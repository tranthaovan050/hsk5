 phiền."},{"h":"爱护","p":"àihù","v":"yêu quý, quý trọng","k":"đgt.","x":0,"ez":"在丈夫的爱护和努力下，她终于又站了起来。","ev":"Nhờ sự yêu thương chăm chút và nỗ lực của chồng, cuối cùng chị đã đứng dậy được."},{"h":"婚姻","p":"hūnyīn","v":"hôn nhân","k":"dt.","x":0,"ez":"他俩说，十几年的婚姻生活中，他们从来没为任何事红过脸、吵过架。","ev":"Hai người kể rằng trong hơn mười năm chung sống, họ chưa từng đỏ mặt hay cãi nhau vì bất cứ chuyện gì."},{"h":"吵架","p":"chǎo jià","v":"cãi nhau","k":"đgt.","x":0,"ez":"他们结婚十几年，从来不吵架。","ev":"Họ cưới nhau hơn mười năm mà chưa bao giờ cãi nhau."},{"h":"相敬如宾","p":"xiāngjìng rúbīn","v":"tương kính như tân","k":"","x":1,"ez":"一直相亲相爱、相敬如宾。","ev":"Họ luôn yêu thương nhau, đối xử với nhau tôn trọng như khách quý."},{"h":"暗暗","p":"àn'àn","v":"thầm, ngấm ngầm","k":"phó.","x":0,"ez":"评委们听了暗暗点头。","ev":"Ban giám khảo nghe xong thầm gật đầu."},{"h":"轮","p":"lún","v":"luân phiên, thay phiên","k":"đgt.","x":0,"ez":"轮到第三对夫妻了，却很长时间不见人。","ev":"Đến lượt cặp vợ chồng thứ ba, nhưng mãi vẫn chẳng thấy ai vào."},{"h":"不耐烦","p":"bú nàifán","v":"sốt ruột, bực mình","k":"","x":0,"ez":"评委们等得有些不耐烦，就走出来看个究竟。","ev":"Ban giám khảo đợi đến mức hơi sốt ruột, bèn đi ra xem có chuyện gì."},{"h":"靠","p":"kào","v":"dựa, tựa","k":"đgt.","x":0,"ez":"男人的头靠在女人的肩膀上，睡着了。","ev":"Người chồng tựa đầu lên vai vợ, ngủ thiếp đi."},{"h":"肩膀","p":"jiānbǎng","v":"bờ vai, vai","k":"dt.","x":0,"ez":"男人的头靠在女人的肩膀上，睡着了。","ev":"Người chồng tựa đầu lên vai vợ, ngủ thiếp đi."},{"h":"喊","p":"hǎn","v":"kêu, gọi","k":"đgt.","x":0,"ez":"一个评委要上前喊醒那个男的。","ev":"Một vị giám khảo định bước tới gọi người đàn ông dậy."},{"h":"伸","p":"shēn","v":"duỗi, chìa","k":"đgt.","x":0,"ez":"女的却伸出手指做了个小声的动作。","ev":"Người phụ nữ lại giơ ngón tay ra hiệu nói khẽ thôi."},{"h":"手指","p":"shǒuzhǐ","v":"ngón tay","k":"dt.","x":0,"ez":"女的却伸出手指做了个小声的动作。","ev":"Người phụ nữ lại giơ ngón tay ra hiệu nói khẽ thôi."},{"h":"歪歪扭扭","p":"wāiwāiniǔniǔ","v":"xiêu vẹo, nguệch ngoạc","k":"tt.","x":1,"ez":"用左手歪歪扭扭写下一行字递给评委。","ev":"Chị dùng tay trái viết nguệch ngoạc một dòng chữ rồi đưa cho ban giám khảo."},{"h":"递","p":"dì","v":"đưa, chuyển","k":"đgt.","x":0,"ez":"用左手歪歪扭扭写下一行字递给评委。","ev":"Chị dùng tay trái viết nguệch ngoạc một dòng chữ rồi đưa cho ban giám khảo."},{"h":"脑袋","p":"nǎodai","v":"đầu","k":"dt.","x":0,"ez":"而她的右肩一直让丈夫的脑袋靠着。","ev":"Còn vai phải của chị thì vẫn để yên cho chồng gối đầu."},{"h":"女士","p":"nǚshì","v":"bà (dạng lịch sự để gọi phụ nữ)","k":"dt.","x":0,"ez":"但是女士，我们得听你们夫妻俩的叙述啊！","ev":"Nhưng thưa chị, chúng tôi phải được nghe hai vợ chồng kể lại chứ!"},{"h":"叙述","p":"xùshù","v":"thuật lại","k":"đgt.","x":0,"ez":"但是女士，我们得听你们夫妻俩的叙述啊！","ev":"Nhưng thưa chị, chúng tôi phải được nghe hai vợ chồng kể lại chứ!"},{"h":"居然","p":"jūrán","v":"(chỉ sự bất ngờ) lại có thể, lại","k":"phó.","x":0,"ez":"这个女人为了不影响丈夫睡觉，居然放弃这次机会！","ev":"Người phụ nữ này vì không muốn làm chồng mất giấc mà lại chịu bỏ qua cơ hội này!"},{"h":"催","p":"cuī","v":"thúc giục, hối thúc","k":"đgt.","x":0,"ez":"但评委们还是决定先不催他们，而是再等待一段时间。","ev":"Nhưng ban giám khảo vẫn quyết định tạm thời không hối thúc họ, mà đợi thêm một lúc nữa."},{"h":"等待","p":"děngdài","v":"đợi, chờ","k":"đgt.","x":0,"ez":"但评委们还是决定先不催他们，而是再等待一段时间。","ev":"Nhưng ban giám khảo vẫn quyết định tạm thời không hối thúc họ, mà đợi thêm một lúc nữa."},{"h":"蚊子","p":"wénzi","v":"con muỗi","k":"dt.","x":1,"ez":"我家住一楼，蚊子多。","ev":"Nhà tôi ở tầng một, nhiều muỗi lắm."},{"h":"半夜","p":"bànyè","v":"nửa đêm, đêm hôm","k":"dt.","x":0,"ez":"昨晚半夜我被蚊子叮醒了。","ev":"Nửa đêm hôm qua tôi bị muỗi đốt tỉnh giấc."},{"h":"叮","p":"dīng","v":"đốt, chích","k":"đgt.","x":1,"ez":"昨晚半夜我被蚊子叮醒了。","ev":"Nửa đêm hôm qua tôi bị muỗi đốt tỉnh giấc."},{"h":"老婆","p":"lǎopo","v":"vợ","k":"dt.","x":0,"ez":"我怕我老婆再被吵醒，所以后半夜就在为她赶蚊子。","ev":"Tôi sợ vợ tôi lại bị đánh thức, nên suốt nửa đêm về sáng tôi ngồi đuổi muỗi cho cô ấy."},{"h":"吵","p":"chǎo","v":"làm ồn; ồn ào","k":"đgt./tt.","x":0,"ez":"我怕我老婆再被吵醒，所以后半夜就在为她赶蚊子。","ev":"Tôi sợ vợ tôi lại bị đánh thức, nên suốt nửa đêm về sáng tôi ngồi đuổi muỗi cho cô ấy."},{"h":"项","p":"xiàng","v":"(được dùng cho những vật được chia thành hạng mục) hạng mục, mục","k":"lượng.","x":0,"ez":"最后的结果是，电台增加了两项奖项。","ev":"Kết quả cuối cùng là đài phát thanh đã thêm hai hạng mục giải thưởng."},{"h":"患难与共","p":"huànnàn yǔgòng","v":"hoạn nạn có nhau","k":"","x":1,"ez":"将第一对夫妻评为“患难与共夫妻”。","ev":"Cặp thứ nhất được trao danh hiệu “Vợ chồng hoạn nạn có nhau”."}]],"texts":[{"no":1,"tz":"","tv":"","lines":[{"s":"","z":"电台要选出一对最恩爱的夫妻。","p":"Diàntái yào xuǎnchū yí duì zuì ēn'ài de fūqī.","v":"Một đài phát thanh muốn chọn ra cặp vợ chồng đằm thắm nhất.","b":0},{"s":"","z":"对比后，有三对夫妻入围。","p":"Duìbǐ hòu, yǒu sān duì fūqī rùwéi.","v":"Sau khi so sánh, có ba cặp vợ chồng lọt vào vòng trong.","b":0},{"s":"","z":"评委叫第一对夫妻说说他俩是如何恩爱的。","p":"Píngwěi jiào dì-yī duì fūqī shuōshuo tā liǎ shì rúhé ēn'ài de.","v":"Ban giám khảo bảo cặp thứ nhất kể xem hai người yêu thương nhau như thế nào.","b":0},{"s":"","z":"妻子说，前几年她全身瘫痪了，医生说她站起来的可能性很小。","p":"Qīzi shuō, qián jǐ nián tā quánshēn tānhuàn le, yīshēng shuō tā zhàn qǐlai de kěnéngxìng hěn xiǎo.","v":"Người vợ kể mấy năm trước chị bị liệt toàn thân, bác sĩ nói khả năng chị đứng dậy được là rất thấp.","b":0},{"s":"","z":"别人都觉得她的丈夫会跟她离婚，她也想过要自杀。","p":"Biérén dōu juéde tā de zhàngfu huì gēn tā líhūn, tā yě xiǎngguo yào zìshā.","v":"Ai cũng nghĩ chồng chị sẽ ly hôn với chị, chính chị cũng từng nghĩ đến chuyện tự tử.","b":0},{"s":"","z":"但丈夫一直鼓励她，为她不知找了多少家医院，并且几年如一日地照顾她，从不抱怨。","p":"Dàn zhàngfu yìzhí gǔlì tā, wèi tā bù zhī zhǎole duōshao jiā yīyuàn, bìngqiě jǐ nián rú yí rì de zhàogù tā, cóng bú bàoyuàn.","v":"Nhưng người chồng luôn động viên chị, chẳng biết đã tìm bao nhiêu bệnh viện vì chị, lại còn chăm sóc chị suốt mấy năm trời như một ngày, chưa từng than phiền.","b":0},{"s":"","z":"在丈夫的爱护和努力下，她终于又站了起来。","p":"Zài zhàngfu de àihù hé nǔlì xià, tā zhōngyú yòu zhànle qǐlai.","v":"Nhờ sự yêu thương chăm chút và nỗ lực của chồng, cuối cùng chị đã đứng dậy được.","b":0},{"s":"","z":"她的故事十分感人，评委们听了都很感动。","p":"Tā de gùshi shífēn gǎnrén, píngwěimen tīngle dōu hěn gǎndòng.","v":"Câu chuyện của chị vô cùng cảm động, ban giám khảo nghe xong ai cũng xúc động.","b":0},{"s":"","z":"随后进来的是第二对夫妻，他俩说，十几年的婚姻生活中，他们从来没为任何事红过脸、吵过架，一直相亲相爱、相敬如宾。","p":"Suíhòu jìnlai de shì dì-èr duì fūqī, tā liǎ shuō, shí jǐ nián de hūnyīn shēnghuó zhōng, tāmen cónglái méi wèi rènhé shì hóngguo liǎn, chǎoguo jià, yìzhí xiāngqīn xiāng'ài, xiāngjìng rúbīn.","v":"Tiếp theo là cặp vợ chồng thứ hai. Hai người kể rằng trong hơn mười năm chung sống, họ chưa từng đỏ mặt hay cãi nhau vì bất cứ chuyện gì, lúc nào cũng yêu thương nhau và tôn trọng nhau như khách quý.","b":1},{"s":"","z":"评委们听了暗暗点头。","p":"Píngwěimen tīngle àn'àn diǎntóu.","v":"Ban giám khảo nghe xong thầm gật đầu.","b":0},{"s":"","z":"轮到第三对夫妻了，却很长时间不见人。","p":"Lúndào dì-sān duì fūqī le, què hěn cháng shíjiān bú jiàn rén.","v":"Đến lượt cặp vợ chồng thứ ba, nhưng mãi vẫn chẳng thấy ai vào.","b":0},{"s":"","z":"评委们等得有些不耐烦，就走出来看个究竟。","p":"Píngwěimen děng de yǒuxiē bú nàifán, jiù zǒu chūlai kàn ge jiūjìng.","v":"Ban giám khảo đợi đến mức hơi sốt ruột, bèn đi ra xem có chuyện gì.","b":0},{"s":"","z":"只见第三对夫妻仍然坐在门口，男人的头靠在女人的肩膀上，睡着了。","p":"Zhǐ jiàn dì-sān duì fūqī réngrán zuò zài ménkǒu, nánrén de tóu kào zài nǚrén de jiānbǎng shang, shuìzháo le.","v":"Chỉ thấy cặp thứ ba vẫn ngồi ở cửa, người chồng tựa đầu lên vai vợ, đã ngủ thiếp đi.","b":0},{"s":"","z":"一个评委要上前喊醒那个男的，女的却伸出手指做了个小声的动作，然后小心地从包里拿出纸笔，用左手歪歪扭扭写下一行字递给评委，而她的右肩一直让丈夫的脑袋靠着。","p":"Yí ge píngwěi yào shàngqián hǎnxǐng nàge nán de, nǚ de què shēnchū shǒuzhǐ zuòle ge xiǎoshēng de dòngzuò, ránhòu xiǎoxīn de cóng bāo li náchū zhǐ bǐ, yòng zuǒshǒu wāiwāiniǔniǔ xiěxià yì háng zì dìgěi píngwěi, ér tā de yòu jiān yìzhí ràng zhàngfu de nǎodai kàozhe.","v":"Một vị giám khảo định bước tới gọi người đàn ông dậy, nhưng người vợ giơ ngón tay ra hiệu nói khẽ, rồi nhẹ nhàng lấy giấy bút trong túi ra, dùng tay trái viết nguệch ngoạc một dòng chữ đưa cho giám khảo, còn vai phải thì vẫn để yên cho chồng gối đầu.","b":0},{"s":"","z":"评委们看那纸条上面写着：别出声，他昨晚没睡好。","p":"Píngwěimen kàn nà zhǐtiáo shàngmian xiězhe: Bié chūshēng, tā zuówǎn méi shuìhǎo.","v":"Ban giám khảo đọc mẩu giấy, trên đó viết: Xin đừng lên tiếng, tối qua anh ấy ngủ không ngon.","b":0},{"s":"","z":"一个评委提起笔在后面续写了一句话：但是女士，我们得听你们夫妻俩的叙述啊！","p":"Yí ge píngwěi tíqǐ bǐ zài hòumian xùxiěle yí jù huà: Dànshì nǚshì, wǒmen děi tīng nǐmen fūqī liǎ de xùshù a!","v":"Một vị giám khảo cầm bút viết tiếp một câu bên dưới: Nhưng thưa chị, chúng tôi phải được nghe hai vợ chồng kể lại chứ!","b":0},{"s":"","z":"女人又写：那我们就不参加了。","p":"Nǚrén yòu xiě: Nà wǒmen jiù bù cānjiā le.","v":"Người phụ nữ lại viết: Vậy thì chúng tôi không tham gia nữa.","b":0},{"s":"","z":"大家很吃惊，这个女人为了不影响丈夫睡觉，居然放弃这次机会！","p":"Dàjiā hěn chījīng, zhège nǚrén wèile bù yǐngxiǎng zhàngfu shuìjiào, jūrán fàngqì zhè cì jīhuì!","v":"Mọi người đều sửng sốt: người phụ nữ này vì không muốn làm chồng mất giấc mà lại chịu bỏ qua cơ hội này!","b":1},{"s":"","z":"但评委们还是决定先不催他们，而是再等待一段时间。","p":"Dàn píngwěimen háishi juédìng xiān bù cuī tāmen, ér shì zài děngdài yí duàn shíjiān.","v":"Nhưng ban giám khảo vẫn quyết định tạm thời không hối thúc họ, mà đợi thêm một lúc nữa.","b":0},{"s":"","z":"过了一会儿，男人醒了。","p":"Guòle yíhuìr, nánrén xǐng le.","v":"Một lúc sau, người chồng tỉnh dậy.","b":0},{"s":"","z":"评委们问他怎么那么累。","p":"Píngwěimen wèn tā zěnme nàme lèi.","v":"Ban giám khảo hỏi sao anh lại mệt đến thế.","b":0},{"s":"","z":"男人不好意思地笑笑说：“我家住一楼，蚊子多。","p":"Nánrén bù hǎoyìsi de xiàoxiao shuō: “Wǒ jiā zhù yī lóu, wénzi duō.","v":"Anh ngượng ngùng cười nói: “Nhà tôi ở tầng một, nhiều muỗi lắm.","b":0},{"s":"","z":"昨晚半夜我被蚊子叮醒了，我怕我老婆再被吵醒，所以后半夜就在为她赶蚊子。”","p":"Zuówǎn bànyè wǒ bèi wénzi dīngxǐng le, wǒ pà wǒ lǎopo zài bèi chǎoxǐng, suǒyǐ hòu bànyè jiù zài wèi tā gǎn wénzi.”","v":"Nửa đêm qua tôi bị muỗi đốt tỉnh giấc, sợ vợ tôi cũng bị đánh thức, nên suốt nửa đêm về sáng tôi ngồi đuổi muỗi cho cô ấy.”","b":0},{"s":"","z":"最后的结果是，电台增加了两项奖项，将第一对夫妻评为“患难与共夫妻”，将第二对夫妻评为“相敬如宾夫妻”，而真正的“最恩爱夫妻”奖，却给了第三对夫妻。","p":"Zuìhòu de jiéguǒ shì, diàntái zēngjiāle liǎng xiàng jiǎngxiàng, jiāng dì-yī duì fūqī píngwéi “huànnàn yǔgòng fūqī”, jiāng dì-èr duì fūqī píngwéi “xiāngjìng rúbīn fūqī”, ér zhēnzhèng de “zuì ēn'ài fūqī” jiǎng, què gěile dì-sān duì fūqī.","v":"Kết quả cuối cùng, đài phát thanh đã thêm hai hạng mục giải: cặp thứ nhất được bình chọn là “Vợ chồng hoạn nạn có nhau”, cặp thứ hai là “Vợ chồng tương kính như tân”, còn giải “Vợ chồng đằm thắm nhất” thực sự thì lại thuộc về cặp thứ ba.","b":0}]}],"aud":[{"v":"audio/01-2.mp3","t":"audio/01-1.mp3"}],"gram":[{"id":"ruhe","t":"如何","s":"thế nào, làm sao (đại từ)","b":"<b>如何</b> là <b>đại từ</b>, dùng để <b>hỏi về cách thức</b> (làm thế nào, ra sao), thường đứng trước động từ/tính từ. Ngoài ra, 如何 cũng hay đặt <b>ở cuối câu</b> để <b>hỏi ý kiến</b> hoặc <b>hỏi tình hình</b>.","r":["Hỏi cách thức: 如何 + động từ/tính từ (该如何解决, 是如何恩爱的)","Cuối câu hỏi ý kiến: đề nghị……，如何？ (= …, thấy thế nào?)","Cuối câu hỏi tình hình: chủ ngữ + 如何？ (情况如何？)"],"e":[["我们明天举行会议，讨论这个问题该如何解决。","Wǒmen míngtiān jǔxíng huìyì, tǎolùn zhège wèntí gāi rúhé jiějué.","Ngày mai chúng ta họp để bàn xem nên giải quyết vấn đề này như thế nào."],["评委叫第一对夫妻说说他俩是如何恩爱的。","Píngwěi jiào dì-yī duì fūqī shuōshuo tā liǎ shì rúhé ēn'ài de.","Ban giám khảo bảo cặp thứ nhất kể xem hai người yêu thương nhau như thế nào. <i>(bài khoá)</i>"],["我们希望由你来负责解决这个问题，如何？","Wǒmen xīwàng yóu nǐ lái fùzé jiějué zhège wèntí, rúhé?","Chúng tôi muốn anh phụ trách giải quyết vấn đề này, anh thấy sao?"],["“80后”们月收入情况如何？","“Bālíng hòu” men yuè shōurù qíngkuàng rúhé?","Thu nhập hằng tháng của thế hệ 8x ra sao?"]],"d":[["你的病都好了吗？现在感觉____？","如何"],["如果是你，你会____选择呢？","如何"],["我们明天举行会议，讨论这个问题该____解决。","如何"]],"w":"如何 mang sắc thái trang trọng, thiên về văn viết; không dùng để hỏi nguyên nhân (xem 如何 vs 怎么)."},{"id":"kao","t":"靠","s":"dựa, tựa; nhờ vào; sát, gần (động từ)","b":"<b>靠</b> là <b>động từ</b>, có ba nghĩa chính: (1) <b>dựa, tựa</b> — để người khác hoặc vật khác đỡ một phần sức nặng cơ thể, hay dùng dạng <b>靠着/在……</b>; (2) <b>dựa vào, nhờ vào</b> (được lợi từ ai/cái gì); (3) <b>sát, gần</b> (vị trí kề bên).","r":["Dựa, tựa: 靠着 + vật / 靠在 + nơi chốn (靠着桌子, 靠在肩膀上)","Nhờ vào: 靠 + người/sự vật (在家靠父母, 不靠别人而生活)","Gần, sát: 靠 + địa điểm, làm định ngữ (靠窗的座位, 靠海的房子)"],"e":[["王老师喜欢靠着桌子讲课。","Wáng lǎoshī xǐhuan kàozhe zhuōzi jiǎngkè.","Thầy Vương thích tựa vào bàn khi giảng bài."],["男人的头靠在女人的肩膀上，睡着了。","Nánrén de tóu kào zài nǚrén de jiānbǎng shang, shuìzháo le.","Người chồng tựa đầu lên vai vợ, ngủ thiếp đi. <i>(bài khoá)</i>"],["“在家靠父母，出门靠朋友”，有什么事情我能帮忙的，你们尽管开口。","“Zài jiā kào fùmǔ, chūmén kào péngyou”, yǒu shénme shìqing wǒ néng bāngmáng de, nǐmen jǐnguǎn kāikǒu.","“Ở nhà nhờ cha mẹ, ra ngoài nhờ bạn bè”, có việc gì tôi giúp được thì các bạn cứ lên tiếng."],["没有一个人可以完全不靠别人而生活。","Méiyǒu yí ge rén kěyǐ wánquán bú kào biérén ér shēnghuó.","Không ai có thể sống mà hoàn toàn không cần dựa vào người khác."],["我的座位是17号，是靠窗的座位。","Wǒ de zuòwèi shì shíqī hào, shì kào chuāng de zuòwèi.","Chỗ của tôi là số 17, ghế cạnh cửa sổ."],["以后我一定要买一个靠海的房子，这样我每天都能听到大海的声音。","Yǐhòu wǒ yídìng yào mǎi yí ge kào hǎi de fángzi, zhèyàng wǒ měi tiān dōu néng tīngdào dàhǎi de shēngyīn.","Sau này nhất định tôi sẽ mua một căn nhà sát biển, để ngày nào cũng được nghe tiếng sóng."]],"d":[["机会是要____自己努力去获得的。","靠"],["我的座位是17号，是____窗的座位。","靠"],["王老师喜欢____着桌子讲课。","靠"]],"w":"Phân biệt theo tân ngữ: 靠着/在 + vật đỡ → dựa, tựa; 靠 + người/nỗ lực → nhờ vào; 靠 + địa điểm (窗/海/门) → sát, gần."},{"id":"juran","t":"居然","s":"lại, thế mà lại (phó từ)","b":"<b>居然</b> là <b>phó từ</b>, biểu thị điều xảy ra <b>ngoài dự đoán</b>, khiến người nói bất ngờ. Đứng trước động từ/cụm vị ngữ, sau chủ ngữ.","r":["Chủ ngữ + 居然 + vị ngữ (你居然也不会做)","Hay đi với 没想到 để nhấn mạnh sự bất ngờ: 没想到居然……"],"e":[["这么简单的题，你居然也不会做？上课时都干什么去了？","Zhème jiǎndān de tí, nǐ jūrán yě bú huì zuò? Shàngkè shí dōu gàn shénme qù le?","Bài dễ thế mà em cũng không làm được à? Lúc trên lớp em làm gì vậy?"],["没想到居然在这儿碰到你！你也去上海？","Méi xiǎngdào jūrán zài zhèr pèngdào nǐ! Nǐ yě qù Shànghǎi?","Không ngờ lại gặp cậu ở đây! Cậu cũng đi Thượng Hải à?"],["这个女人为了不影响丈夫睡觉，居然放弃这次机会！","Zhège nǚrén wèile bù yǐngxiǎng zhàngfu shuìjiào, jūrán fàngqì zhè cì jīhuì!","Người phụ nữ này vì không muốn làm chồng mất giấc mà lại chịu bỏ qua cơ hội này! <i>(bài khoá)</i>"]],"d":[["他这么年轻，没想到____是一位著名的作家。","居然"],["这么简单的题，你____也不会做？","居然"]],"w":"居然 nhấn vào sự bất ngờ; đừng nhầm với 仍然 (vẫn, vẫn còn — sự việc tiếp diễn không đổi)."},{"id":"ruhe_zenme","t":"如何 vs 怎么","s":"phân biệt hai đại từ nghi vấn","b":"Điểm giống: <b>如何</b> và <b>怎么</b> đều là <b>đại từ</b>, đều có thể dùng để <b>hỏi cách thức</b>.","r":["如何 thường dùng trong <b>văn viết</b>; 怎么 dùng được trong <b>khẩu ngữ</b>.","如何 <b>không</b> dùng để hỏi nguyên nhân; 怎么 <b>có thể</b> hỏi nguyên nhân (怎么这么冷？).","如何 có thể đặt <b>cuối câu</b> để hỏi tình hình hoặc hỏi ý kiến; 怎么 có thể đặt <b>đầu câu</b> để biểu thị sự ngạc nhiên (怎么，你不认识我了？！)."],"e":[["只有知道如何/怎么停止的人，才知道如何/怎么高速前进。","Zhǐyǒu zhīdào rúhé/zěnme tíngzhǐ de rén, cái zhīdào rúhé/zěnme gāosù qiánjìn.","Chỉ người biết dừng lại thế nào mới biết cách lao về phía trước thật nhanh."],["该如何爱护我们的地球？","Gāi rúhé àihù wǒmen de dìqiú?","Chúng ta nên bảo vệ Trái Đất như thế nào?"],["你今天是怎么来的？","Nǐ jīntiān shì zěnme lái de?","Hôm nay cậu đến bằng cách nào?"],["今天怎么这么冷？","Jīntiān zěnme zhème lěng?","Sao hôm nay lạnh thế nhỉ?"],["最近身体如何？","Zuìjìn shēntǐ rúhé?","Dạo này sức khoẻ thế nào?"],["怎么，你不认识我了？！","Zěnme, nǐ bú rènshi wǒ le?!","Sao thế, cậu không nhận ra tôi nữa à?!"]],"d":[["你____这么不耐烦？","怎么"],["听说你去电台工作了？情况____？","如何"],["今天____这么冷？","怎么"]],"w":"Hỏi lý do (sao lại…) → chỉ dùng 怎么; đứng cuối câu hỏi tình hình/ý kiến → chỉ dùng 如何."}],"ext":[["脑袋","nǎodai","đầu"],["脖子","bózi","cổ"],["肩膀","jiānbǎng","vai"],["胸","xiōng","ngực"],["腰","yāo","eo, thắt lưng"],["后背","hòubèi","lưng"],["手指","shǒuzhǐ","ngón tay"],["眉毛","méimao","lông mày"],["嗓子","sǎngzi","cổ họng"],["牙齿","yáchǐ","răng"]],"extt":"人体","notes":"Nguồn bài khoá: 改编自《今日文摘》 (662字). Bài 1 không có 专名. Sách không ghi từ loại cho 相敬如宾, 不耐烦, 患难与共 (để trống pos). vocab_ex của 细 ì","v":"phòng ngủ","k":"dt.","x":0,"ez":"室内打扫得干干净净，暖气开着，水已温热，卧室床上的被子已铺好，厨房里飘来阵阵饭菜香……","ev":"Trong nhà dọn dẹp sạch sẽ tinh tươm, máy sưởi đang bật, nước đã ấm, chăn trên giường trong phòng ngủ đã trải sẵn, từ bếp từng đợt mùi cơm canh thơm phức bay ra…"},{"h":"铺","p":"pū","v":"trải","k":"đgt.","x":1,"ez":"室内打扫得干干净净，暖气开着，水已温热，卧室床上的被子已铺好，厨房里飘来阵阵饭菜香……","ev":"Trong nhà dọn dẹp sạch sẽ tinh tươm, máy sưởi đang bật, nước đã ấm, chăn trên giường trong phòng ngủ đã trải sẵn, từ bếp từng đợt mùi cơm canh thơm phức bay ra…"},{"h":"飘","p":"piāo","v":"thoảng đưa, thoang thoảng","k":"đgt.","x":0,"ez":"室内打扫得干干净净，暖气开着，水已温热，卧室床上的被子已铺好，厨房里飘来阵阵饭菜香……","ev":"Trong nhà dọn dẹp sạch sẽ tinh tươm, máy sưởi đang bật, nước đã ấm, chăn trên giường trong phòng ngủ đã trải sẵn, từ bếp từng đợt mùi cơm canh thơm phức bay ra…"},{"h":"阵","p":"zhèn","v":"(chỉ giai đoạn trải qua của sự việc hoặc hành động) trận, cơn, lần","k":"lượng.","x":0,"ez":"室内打扫得干干净净，暖气开着，水已温热，卧室床上的被子已铺好，厨房里飘来阵阵饭菜香……","ev":"Trong nhà dọn dẹp sạch sẽ tinh tươm, máy sưởi đang bật, nước đã ấm, chăn trên giường trong phòng ngủ đã trải sẵn, từ bếp từng đợt mùi cơm canh thơm phức bay ra…"},{"h":"感受","p":"gǎnshòu","v":"cảm nhận; sự cảm nhận","k":"đgt./dt.","x":0,"ez":"原来父母要我留下串钥匙，只是为了让我们回来时，能立刻感受到家的温暖！","ev":"Hóa ra cha mẹ muốn tôi để lại chùm chìa khóa chỉ là để khi chúng tôi trở về có thể cảm nhận ngay hơi ấm của gia đình!"},{"h":"流泪","p":"liú lèi","v":"chảy nước mắt","k":"đgt.","x":0,"ez":"听到这个消息，她激动得流泪了。","ev":"Nghe tin này, cô ấy xúc động đến rơi nước mắt."}]],"texts":[{"no":1,"tz":"","tv":"","lines":[{"s":"","z":"父母一辈子住在农村老家，对老屋的感情，就像没断奶的孩子对母亲一样。","p":"Fùmǔ yíbèizi zhù zài nóngcūn lǎojiā, duì lǎo wū de gǎnqíng, jiù xiàng méi duàn nǎi de háizi duì mǔqīn yíyàng.","v":"Cả đời cha mẹ tôi sống ở quê nhà nông thôn; tình cảm của họ với ngôi nhà cũ giống như đứa trẻ chưa dứt sữa đối với mẹ.","b":0},{"s":"","z":"因此长年以来，父母很少离开老屋，尽管姥姥、舅舅和姑姑都在城里，父母也坚决不在城里住。","p":"Yīncǐ chángnián yǐlái, fùmǔ hěn shǎo líkāi lǎo wū, jǐnguǎn lǎolao, jiùjiu hé gūgu dōu zài chéng li, fùmǔ yě jiānjué bú zài chéng li zhù.","v":"Vì vậy suốt bao năm nay, cha mẹ hiếm khi rời ngôi nhà cũ; dù bà ngoại, cậu và cô đều sống trên thành phố, cha mẹ vẫn nhất quyết không lên thành phố ở.","b":0},{"s":"","z":"去年，在我和妻子的努力下，我们终于用打工挣的钱，在县里买了一套新房。","p":"Qùnián, zài wǒ hé qīzi de nǔlì xià, wǒmen zhōngyú yòng dǎgōng zhèng de qián, zài xiàn li mǎile yí tào xīn fáng.","v":"Năm ngoái, nhờ sự nỗ lực của tôi và vợ, cuối cùng chúng tôi đã dùng số tiền đi làm thuê kiếm được để mua một căn nhà mới trên huyện.","b":0},{"s":"","z":"新房装修完，父母第一次走进新房时，高兴得不得了。","p":"Xīn fáng zhuāngxiū wán, fùmǔ dì-yī cì zǒujìn xīn fáng shí, gāoxìng de bùdéliǎo.","v":"Nhà mới sửa sang xong, lần đầu bước vào nhà mới, cha mẹ vui mừng khôn xiết.","b":0},{"s":"","z":"妻子提出留一串钥匙给父母，可他们拒绝了。","p":"Qīzi tíchū liú yí chuàn yàoshi gěi fùmǔ, kě tāmen jùjué le.","v":"Vợ tôi đề nghị để lại một chùm chìa khóa cho cha mẹ, nhưng họ từ chối.","b":0},{"s":"","z":"那天，父亲喝醉了，等他醒时，天色已晚。","p":"Nà tiān, fùqīn hēzuì le, děng tā xǐng shí, tiānsè yǐ wǎn.","v":"Hôm đó cha tôi uống say, đến khi ông tỉnh dậy thì trời đã tối.","b":0},{"s":"","z":"我和妻子强烈留父母在新房住一夜，第二天再回，但他们仍坚持坐上了最后一趟回老家的车。","p":"Wǒ hé qīzi qiángliè liú fùmǔ zài xīn fáng zhù yí yè, dì-èr tiān zài huí, dàn tāmen réng jiānchí zuòshangle zuìhòu yí tàng huí lǎojiā de chē.","v":"Vợ chồng tôi hết sức giữ cha mẹ ở lại nhà mới một đêm, hôm sau hãy về, nhưng họ vẫn nhất định lên chuyến xe cuối cùng về quê.","b":0},{"s":"","z":"一段时间后，我和妻子又准备去外地打工，新房只能上锁空着。","p":"Yí duàn shíjiān hòu, wǒ hé qīzi yòu zhǔnbèi qù wàidì dǎgōng, xīn fáng zhǐ néng shàng suǒ kòngzhe.","v":"Một thời gian sau, vợ chồng tôi lại chuẩn bị đi nơi khác làm thuê, căn nhà mới đành khóa cửa để trống.","b":1},{"s":"","z":"临走那天，父亲从老家赶来送我们。","p":"Lín zǒu nà tiān, fùqīn cóng lǎojiā gǎnlái sòng wǒmen.","v":"Hôm sắp đi, cha tôi từ quê vội vã lên tiễn chúng tôi.","b":0},{"s":"","z":"父亲悄悄把我拉到一边说：“你妈说了，你还是留一串新房的钥匙给我们，要是我和你妈什么时候想来了，就来住上几天，顺便给你们晒晒被子，打扫打扫卫生。”","p":"Fùqīn qiāoqiāo bǎ wǒ lādào yìbiān shuō: “Nǐ mā shuō le, nǐ háishi liú yí chuàn xīn fáng de yàoshi gěi wǒmen, yàoshi wǒ hé nǐ mā shénme shíhou xiǎng lái le, jiù lái zhùshang jǐ tiān, shùnbiàn gěi nǐmen shàishai bèizi, dǎsǎo dǎsǎo wèishēng.”","v":"Cha lặng lẽ kéo tôi ra một bên nói: “Mẹ con bảo rồi, con cứ để lại cho bố mẹ một chùm chìa khóa nhà mới, lúc nào bố mẹ muốn lên thì lên ở vài hôm, tiện thể phơi chăn, dọn dẹp nhà cửa cho các con.”","b":0},{"s":"","z":"父亲说这话时，轻声细语，还红着脸，像个害羞的孩子。","p":"Fùqīn shuō zhè huà shí, qīngshēng xìyǔ, hái hóngzhe liǎn, xiàng ge hàixiū de háizi.","v":"Lúc nói câu đó, cha nói khẽ khàng, mặt còn đỏ lên, trông như một đứa trẻ ngượng ngùng.","b":0},{"s":"","z":"转眼又是半年，我们回家时是一个深冬的夜里。","p":"Zhuǎnyǎn yòu shì bàn nián, wǒmen huí jiā shí shì yí ge shēn dōng de yèli.","v":"Thoắt cái lại nửa năm trôi qua, chúng tôi về nhà vào một đêm giữa mùa đông giá rét.","b":1},{"s":"","z":"下了长途车，儿子被冻得大哭。","p":"Xiàle chángtú chē, érzi bèi dòng de dà kū.","v":"Xuống xe đường dài, con trai tôi bị lạnh cóng đến khóc òa.","b":0},{"s":"","z":"我和妻子想象着打开家门满是灰尘、冷冷清清的景象，觉得心里发寒。","p":"Wǒ hé qīzi xiǎngxiàngzhe dǎkāi jiā mén mǎn shì huīchén, lěnglěngqīngqīng de jǐngxiàng, juéde xīnli fā hán.","v":"Vợ chồng tôi hình dung cảnh mở cửa ra chỉ thấy bụi bặm phủ đầy, lạnh lẽo vắng tanh, trong lòng thấy ớn lạnh.","b":0},{"s":"","z":"来到楼下，抬头一看，却发现自家亮着灯光。","p":"Láidào lóu xià, tái tóu yí kàn, què fāxiàn zìjiā liàngzhe dēngguāng.","v":"Đến dưới tòa nhà, ngẩng đầu nhìn lên, lại thấy nhà mình đang sáng đèn.","b":0},{"s":"","z":"上了楼，开门的竟是微笑着的父母，温暖的气息立刻扑面而来：","p":"Shàngle lóu, kāi mén de jìng shì wēixiàozhe de fùmǔ, wēnnuǎn de qìxī lìkè pūmiàn ér lái:","v":"Lên lầu, người ra mở cửa hóa ra lại là cha mẹ đang mỉm cười, hơi ấm lập tức phả vào mặt:","b":0},{"s":"","z":"室内打扫得干干净净，暖气开着，水已温热，卧室床上的被子已铺好，厨房里飘来阵阵饭菜香……","p":"shìnèi dǎsǎo de gāngānjìngjìng, nuǎnqì kāizhe, shuǐ yǐ wēnrè, wòshì chuáng shang de bèizi yǐ pūhǎo, chúfáng li piāolái zhènzhèn fàncài xiāng……","v":"trong nhà dọn dẹp sạch sẽ tinh tươm, máy sưởi đang bật, nước đã ấm, chăn trên giường trong phòng ngủ đã trải sẵn, từ bếp từng đợt mùi cơm canh thơm phức bay ra…","b":0},{"s":"","z":"父亲说：“你妈昨天接到电话，知道你们今晚回来，今天来新房忙了一天了。”","p":"Fùqīn shuō: “Nǐ mā zuótiān jiēdào diànhuà, zhīdào nǐmen jīnwǎn huílai, jīntiān lái xīn fáng mángle yì tiān le.”","v":"Cha nói: “Hôm qua mẹ con nhận được điện thoại, biết tối nay các con về, nên hôm nay sang nhà mới bận rộn cả ngày.”","b":0},{"s":"","z":"原来父母要我留下串钥匙，只是为了让我们回来时，能立刻感受到家的温暖！","p":"Yuánlái fùmǔ yào wǒ liúxià chuàn yàoshi, zhǐshì wèile ràng wǒmen huílai shí, néng lìkè gǎnshòu dào jiā de wēnnuǎn!","v":"Hóa ra cha mẹ muốn tôi để lại chùm chìa khóa chỉ là để khi chúng tôi trở về có thể cảm nhận ngay hơi ấm của gia đình!","b":0},{"s":"","z":"我鼻子一酸，流下了热泪……","p":"Wǒ bízi yì suān, liúxiàle rèlèi……","v":"Sống mũi tôi cay cay, nước mắt nóng hổi trào ra…","b":0}]}],"aud":[{"v":"audio/02-2.mp3","t":"audio/02-1.mp3"}],"gram":[{"id":"yilai","t":"以来","s":"từ … đến nay (danh từ)","b":"Theo sách, “以来” là <b>danh từ</b>, dùng trong cấu trúc <b>“……以来”</b>, biểu thị khoảng thời gian tính từ một thời điểm nào đó trong quá khứ <b>cho đến hiện tại</b>.","r":["Mốc thời gian / sự kiện trong quá khứ + 以来: 改革开放以来, 到中国以来","Từ chỉ thời gian kéo dài + 以来: 长年以来, 一直以来","Cụm “……以来” thường đứng đầu câu làm trạng ngữ thời gian; vế sau nêu tình trạng kéo dài đến hiện tại","lỗi hay gặp: ✗ 明年以来 → ✓ 去年以来 (以来 chỉ tính từ quá khứ đến nay, không dùng cho tương lai)"],"e":[["改革开放以来，中国发生了巨大的变化。","Gǎigé kāifàng yǐlái, Zhōngguó fāshēngle jùdà de biànhuà.","Từ khi cải cách mở cửa đến nay, Trung Quốc đã có những thay đổi to lớn."],["因此长年以来，父母很少离开老屋，……","Yīncǐ chángnián yǐlái, fùmǔ hěn shǎo líkāi lǎo wū, ……","Vì vậy suốt bao năm nay, cha mẹ hiếm khi rời ngôi nhà cũ, … <i>(bài khoá)</i>"],["一直以来，“80后”这个词儿都含有年轻的味道。","Yìzhí yǐlái, “bālíng hòu” zhège cír dōu hányǒu niánqīng de wèidao.","Từ trước đến nay, cụm từ “thế hệ 8X” vẫn luôn mang hơi hướng trẻ trung."]],"d":[["到中国____，我交了很多中国朋友。","以来"],["结婚____，他们夫妻俩从来没吵过架。","以来"],["最近几年____，这里的空气污染越来越严重。","以来"]],"w":"以来 khác 以后: 以来 tính từ một mốc trong quá khứ kéo dài đến hiện tại; 以后 chỉ khoảng thời gian sau một mốc (có thể ở tương lai)."},{"id":"lin","t":"临","s":"kề, hướng ra (động từ); lúc sắp… (giới từ)","b":"Sách nêu hai cách dùng: <b>động từ</b> “临” nghĩa là kề sát, hướng ra, đối diện (临街, 临江); <b>giới từ</b> trong cấu trúc <b>“临……（时/前）”</b>, biểu thị thời điểm sắp xảy ra một hành động nào đó.","r":["Động từ: 临 + nơi chốn (街/江/海…) = kề, hướng ra: 不临街的房子","Giới từ: 临 + động từ (+ 时/前/的时候) = lúc sắp…: 临离开北京的时候, 临走那天","Sau 临 (giới từ) thường là động từ chỉ hành động sắp diễn ra: 走、离开、出发、睡…"],"e":[["我想买一套不临街的房子，这样不会太吵。","Wǒ xiǎng mǎi yí tào bù lín jiē de fángzi, zhèyàng bú huì tài chǎo.","Tôi muốn mua một căn nhà không nằm sát mặt phố, như vậy sẽ không quá ồn."],["临江新修了一条路，晚饭后很多人都去那儿散步。","Lín jiāng xīn xiūle yì tiáo lù, wǎnfàn hòu hěn duō rén dōu qù nàr sànbù.","Ven sông mới làm một con đường, sau bữa tối nhiều người ra đó tản bộ."],["这是我临离开北京的时候买的。","Zhè shì wǒ lín líkāi Běijīng de shíhou mǎi de.","Cái này tôi mua lúc sắp rời Bắc Kinh."],["临走那天，父亲从老家赶来送我们。","Lín zǒu nà tiān, fùqīn cóng lǎojiā gǎnlái sòng wǒmen.","Hôm sắp đi, cha tôi từ quê vội vã lên tiễn chúng tôi. <i>(bài khoá)</i>"]],"d":[["这件衣服是我____回国前买的。","临"],["我想住一间____海的房间，每天都能看到大海。","临"],["____睡觉前，别喝太多水。","临"]],"w":"临 (giới từ) chỉ thời điểm ngay trước khi hành động xảy ra, thường đi với 时/前/的时候; đừng nhầm với từ 临时 (tạm thời)."},{"id":"like","t":"立刻","s":"lập tức, ngay (phó từ)","b":"“立刻” là <b>phó từ</b>, dùng theo cấu trúc <b>“立刻 + động từ”</b>, nghĩa là ngay lập tức, nhấn mạnh một động tác xảy ra liền ngay sau động tác trước đó.","r":["立刻 + động từ: 立刻扑面而来, 立刻感受到","Hay đi với 一……就……: 一见到青草，就立刻去吃草","立刻 đứng trước động từ, kể cả trước cụm 把: 立刻把他送进了医院","lỗi hay gặp: ✗ 春节立刻就要到了 → ✓ 春节马上就要到了"],"e":[["上了楼，开门的竟是微笑着的父母，温暖的气息立刻扑面而来……","Shàngle lóu, kāi mén de jìng shì wēixiàozhe de fùmǔ, wēnnuǎn de qìxī lìkè pūmiàn ér lái……","Lên lầu, người ra mở cửa hóa ra lại là cha mẹ đang mỉm cười, hơi ấm lập tức phả vào mặt… <i>(bài khoá)</i>"],["原来父母要我留下串钥匙，只是为了让我们回来时，能立刻感受到家的温暖！","Yuánlái fùmǔ yào wǒ liúxià chuàn yàoshi, zhǐshì wèile ràng wǒmen huílai shí, néng lìkè gǎnshòu dào jiā de wēnnuǎn!","Hóa ra cha mẹ muốn tôi để lại chùm chìa khóa chỉ là để khi chúng tôi trở về có thể cảm nhận ngay hơi ấm của gia đình! <i>(bài khoá)</i>"],["那两只羊一见到青草，就立刻去吃草了，哪还有心思打架呢？","Nà liǎng zhī yáng yí jiàndào qīngcǎo, jiù lìkè qù chī cǎo le, nǎ hái yǒu xīnsi dǎjià ne?","Hai con dê vừa thấy cỏ non là lập tức lao vào ăn, còn bụng dạ đâu mà húc nhau nữa?"]],"d":[["他病了，老师和同学们____把他送进了医院。","立刻"],["一下课，他就____跑出了教室。","立刻"],["只有一个星期了，春节____就要到了。","马上 (không dùng 立刻)"]],"w":"立刻 vs 马上: 马上 có thể nói về việc sắp đến trong một khoảng thời gian ngắn (春节马上就要到了); 立刻 nhấn mạnh hành động xảy ra liền ngay sau một hành động/tình huống trước, không dùng cho kiểu “sắp đến”."},{"id":"qiaoqiao_toutou","t":"悄悄 vs 偷偷","s":"lặng lẽ / lén lút (phó từ)","b":"<b>Giống nhau:</b> cả hai đều là <b>phó từ</b>, đều có nghĩa làm việc gì đó mà không để người khác phát hiện. Ví dụ: 他悄悄/偷偷地走了出去。","r":["悄悄: nhấn mạnh âm thanh rất nhỏ, khẽ khàng — 父亲悄悄把我拉到一边说话。","偷偷: nhấn mạnh hành vi không muốn bị người khác biết — 他谁也没告诉，偷偷去旅行了。"],"e":[["他悄悄/偷偷地走了出去。","Tā qiāoqiāo/tōutōu de zǒule chūqu.","Anh ấy lặng lẽ / lén đi ra ngoài."],["父亲悄悄把我拉到一边说话。","Fùqīn qiāoqiāo bǎ wǒ lādào yìbiān shuōhuà.","Cha lặng lẽ kéo tôi ra một bên nói chuyện."],["他谁也没告诉，偷偷去旅行了。","Tā shéi yě méi gàosu, tōutōu qù lǚxíng le.","Anh ấy chẳng nói với ai, lén đi du lịch."]],"d":[["晚饭前姑姑就一个人____地走了。","悄悄 / 偷偷"],["考试已经开始了，他才____走进来。","悄悄"],["孩子睡着了，爸爸在妈妈耳边____说了几句话。","悄悄"],["别人都不知道，她只是____地把这件事告诉了我。","偷偷"]],"w":"Mẹo: nếu ý chính là “khẽ, không gây tiếng động” → 悄悄; nếu ý chính là “giấu, không muốn ai biết” → 偷偷 (偷 vốn nghĩa là “trộm”)."}],"ext":[["外公","wàigōng","ông ngoại"],["姥姥","lǎolao","bà ngoại"],["姑姑","gūgu","cô"],["舅舅","jiùjiu","cậu"],["老婆","lǎopo","vợ (khẩu ngữ)"],["太太","tàitai","vợ; bà (cách gọi phụ nữ đã có chồng)"],["兄弟","xiōngdi","anh em trai"],["小气","xiǎoqi","keo kiệt, bủn xỉn"],["周到","zhōudào","chu đáo"],["坦率","tǎnshuài","thẳng thắn"]],"extt":"亲属称谓 · 交往1","notes":"Cuối bài khoá: 改编自《中国电视报》，作者：陈程 (sách ghi bài khoá 593字). Bài này không có 专名. Từ 1 串: sách in nghĩa “xâu, chuỗi, đời” — chữ “đời” có vẻ là lỗi in của sách, giữ nguyên theo sách. Từ 4 giữ dạng sách 屋（子） (bài khoá dùng 屋 trong 老屋). Từ 39 流泪: bài khoá chỉ có 流下了热泪 (không liền chữ 流泪) nên câu vocab_ex là câu tự đặt. Câu dài “上了楼……饭菜香……” được tách làm 2 dòng tại dấu hai chấm. Bảng 扩展 gồm 2 chủ đề (亲属称谓 và 交往1); sách chỉ in pinyin, nghĩa Việt do người soạn bổ sung. Drill ở các thẻ 以来/临 tự đặt vì 练一练 của sách là bài hoàn thành câu mở; drill 立刻 lấy từ 练习 2–3; drill 悄悄/偷偷 lấy từ 做一做 (đáp án câu 1 theo sách: cả hai).","order":[{"z":"新房装修完，父母第一次走进新房时，高兴得不得了。","t":["新房","装修","完","父母","第一次","走进","新房","时","高兴","得","不得了"],"v":"Nhà mới sửa sang xong, lần đầu bước vào nhà mới, cha mẹ vui mừng khôn xiết."},{"z":"妻子提出留一串钥匙给父母，可他们拒绝了。","t":["妻子","提出","留","一串","钥匙","给","父母","可","他们","拒绝","了"],"v":"Vợ tôi đề nghị để lại một chùm chìa khóa cho cha mẹ, nhưng họ từ chối."},{"z":"那天，父亲喝醉了，等他醒时，天色已晚。","t":["那天","父亲","喝醉","了","等","他","醒","时","天色已晚"],"v":"Hôm đó cha tôi uống say, đến khi ông tỉnh dậy thì trời đã tối."},{"z":"临走那天，父亲从老家赶来送我们。","t":["临走","那天","父亲","从","老家","赶来","送","我们"],"v":"Hôm sắp đi, cha tôi từ quê vội vã lên tiễn chúng tôi."},{"z":"下了长途车，儿子被冻得大哭。","t":["下","了","长途车","儿子","被","冻得","大哭"],"v":"Xuống xe đường dài, con trai tôi bị lạnh cóng đến khóc òa."},{"z":"来到楼下，抬头一看，却发现自家亮着灯光。","t":["来到","楼下","抬头","一看","却","发现","自家","亮","着","灯光"],"v":"Đến dưới tòa nhà, ngẩng đầu nhìn lên, lại thấy nhà mình đang sáng đèn."},{"z":"改革开放以来，中国发生了巨大的变化。","t":["改革开放","以来","中国","发生","了","巨大","的","变化"],"v":"Từ khi cải cách mở cửa đến nay, Trung Quốc đã có những thay đổi to lớn."},{"z":"一直以来，“80后”这个词儿都含有年轻的味道。","t":["一直","以来","80","后","这个","词儿","都","含有","年轻","的","味道"],"v":"Từ trước đến nay, cụm từ “thế hệ 8X” vẫn luôn mang hơi hướng trẻ trung."},{"z":"我想买一套不临街的房子，这样不会太吵。","t":["我","想","买","一套","不" ển chính là một bậc thềm dài trên con đường đời của anh, dẫn tới tương lai mà anh mong muốn."},{"h":"太太","p":"tàitai","v":"vợ","k":"dt.","x":0,"ez":"我和太太想要看看这个时代、这个世界到底是什么样子。","ev":"Tôi và vợ muốn xem thời đại này, thế giới này rốt cuộc trông như thế nào."},{"h":"时代","p":"shídài","v":"thời đại","k":"dt.","x":0,"ez":"我和太太想要看看这个时代、这个世界到底是什么样子。","ev":"Tôi và vợ muốn xem thời đại này, thế giới này rốt cuộc trông như thế nào."},{"h":"澳洲","p":"Àozhōu","v":"Úc","k":"tên riêng","x":0,"ez":"下一站，他们想去澳洲和新西兰。","ev":"Chặng tiếp theo, họ muốn đến Úc và New Zealand."},{"h":"新西兰","p":"Xīnxīlán","v":"New Zealand, Tân Tây Lan","k":"tên riêng","x":0,"ez":"下一站，他们想去澳洲和新西兰。","ev":"Chặng tiếp theo, họ muốn đến Úc và New Zealand."}]],"texts":[{"no":1,"tz":"","tv":"","lines":[{"s":"","z":"翟峰和妻子都是铁路工人，工作稳定、待遇不错。","p":"Zhái Fēng hé qīzi dōu shì tiělù gōngrén, gōngzuò wěndìng, dàiyù búcuò.","v":"Trác Phong và vợ đều là công nhân đường sắt, công việc ổn định, đãi ngộ khá tốt.","b":0},{"s":"","z":"他们有房有车，从不用为生活发愁。","p":"Tāmen yǒu fáng yǒu chē, cóng bú yòng wèi shēnghuó fāchóu.","v":"Họ có nhà có xe, chưa bao giờ phải lo lắng chuyện cơm áo.","b":0},{"s":"","z":"可翟峰却不想一辈子过这样平静的生活。","p":"Kě Zhái Fēng què bù xiǎng yíbèizi guò zhèyàng píngjìng de shēnghuó.","v":"Thế nhưng Trác Phong lại không muốn cả đời sống một cuộc sống yên ả như vậy.","b":0},{"s":"","z":"通过电视，翟峰迷上了帆船，他觉得帆船能带他撞开“世界之门”：只要有一艘船，就能航行在无边无际的海上，到任何自己想去的地方。","p":"Tōngguò diànshì, Zhái Fēng míshang le fānchuán, tā juéde fānchuán néng dài tā zhuàngkāi “shìjiè zhī mén”: zhǐyào yǒu yì sōu chuán, jiù néng hángxíng zài wúbiān-wújì de hǎi shang, dào rènhé zìjǐ xiǎng qù de dìfang.","v":"Qua truyền hình, Trác Phong mê thuyền buồm; anh cho rằng thuyền buồm có thể đưa anh phá tung “cánh cửa thế giới”: chỉ cần có một chiếc thuyền là có thể lênh đênh trên biển cả mênh mông, đi đến bất cứ nơi nào mình muốn.","b":0},{"s":"","z":"由于翟峰和妻子没有积蓄，于是卖房卖车，买下了一艘二手船，翟峰叫它“彩虹号”。","p":"Yóuyú Zhái Fēng hé qīzi méiyǒu jīxù, yúshì mài fáng mài chē, mǎixià le yì sōu èrshǒu chuán, Zhái Fēng jiào tā “Cǎihóng Hào”.","v":"Vì không có tiền dành dụm, Trác Phong và vợ bán nhà bán xe, mua một chiếc thuyền cũ, Trác Phong đặt tên cho nó là “Cầu Vồng”.","b":0},{"s":"","z":"出发前，翟峰自学了航海知识。","p":"Chūfā qián, Zhái Fēng zìxué le hánghǎi zhīshi.","v":"Trước khi khởi hành, Trác Phong tự học kiến thức hàng hải.","b":0},{"s":"","z":"然而，包括翟峰的父母，所有人都觉得，翟峰“疯了”。","p":"Rán'ér, bāokuò Zhái Fēng de fùmǔ, suǒyǒu rén dōu juéde, Zhái Fēng “fēng le”.","v":"Thế nhưng tất cả mọi người, kể cả bố mẹ Trác Phong, đều cho rằng anh “bị điên rồi”.","b":0},{"s":"","z":"2012年11月24日，辞了职的翟峰和妻子带着休学的女儿，第一次驾驶帆船出海了。","p":"Èr líng yī èr nián shíyī yuè èrshísì rì, cí le zhí de Zhái Fēng hé qīzi dàizhe xiūxué de nǚ'ér, dì-yī cì jiàshǐ fānchuán chū hǎi le.","v":"Ngày 24 tháng 11 năm 2012, Trác Phong – lúc này đã nghỉ việc – cùng vợ đưa cô con gái đang tạm nghỉ học lần đầu tiên lái thuyền buồm ra khơi.","b":1},{"s":"","z":"白天，翟峰和妻子轮流驾船。","p":"Báitiān, Zhái Fēng hé qīzi lúnliú jià chuán.","v":"Ban ngày, Trác Phong và vợ thay phiên nhau lái thuyền.","b":0},{"s":"","z":"女儿在船上看书、学习、画画儿。","p":"Nǚ'ér zài chuán shang kàn shū, xuéxí, huà huàr.","v":"Cô con gái ở trên thuyền đọc sách, học bài, vẽ tranh.","b":0},{"s":"","z":"下午海面平静时，翟峰会和妻子下海游泳或者钓鱼。","p":"Xiàwǔ hǎimiàn píngjìng shí, Zhái Fēng huì hé qīzi xià hǎi yóuyǒng huòzhě diào yú.","v":"Buổi chiều khi mặt biển lặng sóng, Trác Phong cùng vợ xuống biển bơi hoặc câu cá.","b":0},{"s":"","z":"该吃饭时，妻子会给全家人做一顿美味的海鲜。","p":"Gāi chī fàn shí, qīzi huì gěi quán jiā rén zuò yí dùn měiwèi de hǎixiān.","v":"Đến bữa, vợ anh sẽ nấu cho cả nhà một bữa hải sản ngon lành.","b":0},{"s":"","z":"傍晚是一家人最舒适的时候。","p":"Bàngwǎn shì yì jiā rén zuì shūshì de shíhou.","v":"Lúc chạng vạng là khoảng thời gian dễ chịu nhất của cả nhà.","b":0},{"s":"","z":"干完活儿，一家人坐在一起，用电脑看看电影，或者聊聊天儿。","p":"Gàn wán huór, yì jiā rén zuò zài yìqǐ, yòng diànnǎo kànkan diànyǐng, huòzhě liáoliao tiānr.","v":"Xong việc, cả nhà ngồi quây quần bên nhau, xem phim trên máy tính hoặc trò chuyện.","b":0},{"s":"","z":"这样的生活，是翟峰盼望已久的。","p":"Zhèyàng de shēnghuó, shì Zhái Fēng pànwàng yǐ jiǔ de.","v":"Cuộc sống như thế là điều Trác Phong mong mỏi từ lâu.","b":0},{"s":"","z":"以前陆地上的夜晚，他们在各自的房间，一家人没有更多的交流。","p":"Yǐqián lùdì shang de yèwǎn, tāmen zài gèzì de fángjiān, yì jiā rén méiyǒu gèng duō de jiāoliú.","v":"Trước đây, những buổi tối trên đất liền, ai nấy ở trong phòng riêng của mình, cả nhà chẳng mấy khi trò chuyện với nhau.","b":0},{"s":"","z":"中国有句老话，可上山，勿下海。","p":"Zhōngguó yǒu jù lǎohuà, kě shàng shān, wù xià hǎi.","v":"Trung Quốc có câu nói xưa: có thể lên núi, chớ xuống biển.","b":1},{"s":"","z":"美好的时刻过去后是一个个紧张的夜晚。","p":"Měihǎo de shíkè guòqù hòu shì yí gègè jǐnzhāng de yèwǎn.","v":"Sau những khoảnh khắc tươi đẹp là từng đêm căng thẳng.","b":0},{"s":"","z":"一路上，翟峰一家经历了船身着火、漏水等大大小小十多次险情。","p":"Yí lù shang, Zhái Fēng yì jiā jīnglì le chuánshēn zháo huǒ, lòu shuǐ děng dàdà-xiǎoxiǎo shí duō cì xiǎnqíng.","v":"Suốt hành trình, gia đình Trác Phong đã trải qua hơn mười lần gặp nguy lớn nhỏ như thân thuyền bốc cháy, bị rò nước.","b":0},{"s":"","z":"他们最怕雷电交加的时刻，因为小船随时有可能被下一道闪电击到，一家三口只能紧紧拥抱在一起，希望闪电快快过去。","p":"Tāmen zuì pà léidiàn jiāojiā de shíkè, yīnwèi xiǎo chuán suíshí yǒu kěnéng bèi xià yí dào shǎndiàn jīdào, yì jiā sān kǒu zhǐ néng jǐnjǐn yōngbào zài yìqǐ, xīwàng shǎndiàn kuàikuài guòqù.","v":"Họ sợ nhất là những lúc sấm chớp dồn dập, vì chiếc thuyền nhỏ có thể bị tia chớp tiếp theo đánh trúng bất cứ lúc nào; cả nhà ba người chỉ biết ôm chặt lấy nhau, mong cho chớp giật mau qua.","b":0},{"s":"","z":"在经历了八个月、航行了4000多海里之后，翟峰一家终于回到了家。","p":"Zài jīnglì le bā ge yuè, hángxíng le sìqiān duō hǎilǐ zhīhòu, Zhái Fēng yì jiā zhōngyú huídào le jiā.","v":"Sau tám tháng trải nghiệm và hơn 4000 hải lý lênh đênh trên biển, cả nhà Trác Phong cuối cùng cũng đã về đến nhà.","b":0},{"s":"","z":"翟峰相信，一切只是开始，航海就是他人生道路上一段长长的台阶，通向他想要的未来。","p":"Zhái Fēng xiāngxìn, yíqiè zhǐ shì kāishǐ, hánghǎi jiù shì tā rénshēng dàolù shang yí duàn chángcháng de táijiē, tōngxiàng tā xiǎng yào de wèilái.","v":"Trác Phong tin rằng mọi thứ chỉ mới bắt đầu; đi biển chính là một bậc thềm dài trên con đường đời của anh, dẫn tới tương lai mà anh mong muốn.","b":0},{"s":"","z":"“我和太太想要看看这个时代、这个世界到底是什么样子。","p":"“Wǒ hé tàitai xiǎng yào kànkan zhège shídài, zhège shìjiè dàodǐ shì shénme yàngzi.","v":"“Tôi và vợ muốn xem thời đại này, thế giới này rốt cuộc trông như thế nào.","b":0},{"s":"","z":"人生有选择，一切可改变”。","p":"Rénshēng yǒu xuǎnzé, yíqiè kě gǎibiàn”.","v":"Đời người có lựa chọn, mọi thứ đều có thể đổi thay”.","b":0},{"s":"","z":"下一站，他们想去澳洲和新西兰。","p":"Xià yí zhàn, tāmen xiǎng qù Àozhōu hé Xīnxīlán.","v":"Chặng tiếp theo, họ muốn đến Úc và New Zealand.","b":0},{"s":"","z":"等待今年11月的北风，北风南下之时，他们将再次出发。","p":"Děngdài jīnnián shíyī yuè de běifēng, běifēng nán xià zhī shí, tāmen jiāng zàicì chūfā.","v":"Họ đợi gió bấc tháng 11 năm nay; khi gió bấc thổi xuống phương Nam, họ sẽ lại lên đường.","b":0}]}],"aud":[{"v":"audio/03-2.mp3","t":"audio/03-1.mp3"}],"gram":[{"id":"gezi","t":"各自","s":"mỗi người, riêng từng bên (đại từ)","b":"<b>各自</b> là <b>đại từ</b>, chỉ bản thân mỗi người, hoặc phía mình trong số các bên. Thường đi cùng với đối tượng mà nó chỉ để làm <b>chủ ngữ</b> hoặc <b>định ngữ</b> trong câu.","r":["Làm chủ ngữ, đứng ngay sau danh từ chỉ nhóm đối tượng: 双方队员<b>各自</b>回场外休息","Làm định ngữ: 各自(的) + danh từ — 三家公司<b>各自</b>提交的计划, 在<b>各自</b>的房间","Luôn chỉ nhiều đối tượng (mỗi người trong nhóm), không dùng cho một người: ✗ 他各自回家 → ✓ 他们各自回家"],"e":[["中场休息时间到了，比赛双方队员各自回场外休息。","Zhōngchǎng xiūxi shíjiān dào le, bǐsài shuāngfāng duìyuán gèzì huí chǎng wài xiūxi.","Đến giờ nghỉ giữa hiệp, cầu thủ hai đội ai về chỗ nấy, ra ngoài sân nghỉ ngơi."],["刘经理认真看了三家广告公司各自提交的计划。","Liú jīnglǐ rènzhēn kàn le sān jiā guǎnggào gōngsī gèzì tíjiāo de jìhuà.","Giám đốc Lưu đã xem kỹ bản kế hoạch mà từng công ty trong ba công ty quảng cáo nộp lên."],["以前陆地上的夜晚，他们在各自的房间，一家人没有更多的交流。","Yǐqián lùdì shang de yèwǎn, tāmen zài gèzì de fángjiān, yì jiā rén méiyǒu gèng duō de jiāoliú.","Trước đây, những buổi tối trên đất liền, ai nấy ở trong phòng riêng của mình, cả nhà chẳng mấy khi trò chuyện với nhau. <i>(bài khoá)</i>"]],"d":[["比赛双方队员____回场外休息。","各自"],["以前陆地上的夜晚，他们在____的房间。","各自"],["刘经理认真看了三家广告公司____提交的计划。","各自"]],"w":"各自 nhấn mạnh “mỗi người tự lo phần mình, tách riêng ra”; muốn nói “tất cả cùng” thì dùng 都 / 大家, không dùng 各自."},{"id":"wu","t":"勿","s":"chớ, đừng (phó từ, văn viết)","b":"<b>勿</b> là <b>phó từ</b>, biểu thị <b>cấm đoán hoặc khuyên can</b>; là từ dùng trong <b>văn viết</b>, tương đương với <b>不要</b>.","r":["勿 + động từ: 勿下海, 勿入内","Hay đi với 请 thành 请勿… (lời yêu cầu lịch sự trên biển báo, thông báo): 请勿入内","切勿… = tuyệt đối đừng…, giọng khuyên răn mạnh hơn","Trong khẩu ngữ dùng 不要 / 别, không dùng 勿"],"e":[["非工作人员，请勿入内。","Fēi gōngzuò rényuán, qǐng wù rù nèi.","Người không phận sự, xin đừng vào trong."],["网上购票者须注意网站的安全性，切勿上当受骗。","Wǎngshang gòupiàozhě xū zhùyì wǎngzhàn de ānquánxìng, qièwù shàngdàng shòupiàn.","Người mua vé trên mạng phải chú ý độ an toàn của trang web, tuyệt đối đừng để mắc lừa."],["中国有句老话，可上山，勿下海。","Zhōngguó yǒu jù lǎohuà, kě shàng shān, wù xià hǎi.","Trung Quốc có câu nói xưa: có thể lên núi, chớ xuống biển. <i>(bài khoá)</i>"]],"d":[["大多数宾馆房间的门上都挂着一块“____”的牌子。","请勿打扰"],["为了他人的健康，请____在公共场所抽烟。","勿"],["非工作人员，请____入内。","勿"]],"w":"勿 mang sắc thái trang trọng, dùng trên biển báo, thông báo; nói chuyện hằng ngày thì dùng 别 / 不要."},{"id":"baokuo","t":"包括","s":"bao gồm; kể cả (động từ)","b":"<b>包括</b> là <b>động từ</b>, biểu thị một tổng thể <b>bao gồm các bộ phận</b>. Ngoài ra, 包括 còn có thể <b>nhấn mạnh một bộ phận nào đó</b>, có tác dụng nêu ví dụ, bổ sung, giải thích (gần nghĩa “kể cả”).","r":["Tổng thể + 包括 + các bộ phận: 汉语技能教学<b>包括</b>听、说、读、写四个方面","包括 + một bộ phận tiêu biểu, + 所有人 / 都…: nhấn mạnh “kể cả”, bổ sung, giải thích — <b>包括</b>翟峰的父母，所有人都觉得…","Cụm 包括… có thể chen giữa câu như thành phần chêm: 我们班所有人，<b>包括</b>最不爱运动的刘方，也都参加了…"],"e":[["汉语技能教学包括听、说、读、写四个方面。","Hànyǔ jìnéng jiàoxué bāokuò tīng, shuō, dú, xiě sì ge fāngmiàn.","Việc dạy kỹ năng tiếng Hán bao gồm bốn mặt: nghe, nói, đọc, viết."],["“学习”，其实包括“学”与“习”两层意思。学，就是学习知识；习，就是实践、练习。","“Xuéxí”, qíshí bāokuò “xué” yǔ “xí” liǎng céng yìsi. Xué, jiù shì xuéxí zhīshi; xí, jiù shì shíjiàn, liànxí.","“Học tập” thật ra bao gồm hai tầng nghĩa “học” và “tập”. Học là tiếp thu kiến thức; tập là thực hành, luyện tập."],["然而，包括翟峰的父母，所有人都觉得，翟峰“疯了”。","Rán'ér, bāokuò Zhái Fēng de fùmǔ, suǒyǒu rén dōu juéde, Zhái Fēng “fēng le”.","Thế nhưng tất cả mọi người, kể cả bố mẹ Trác Phong, đều cho rằng anh “bị điên rồi”. <i>(bài khoá)</i>"],["我们班所有人，包括最不爱运动的刘方，也都参加了这次运动会。","Wǒmen bān suǒyǒu rén, bāokuò zuì bú ài yùndòng de Liú Fāng, yě dōu cānjiā le zhè cì yùndònghuì.","Tất cả mọi người trong lớp tôi, kể cả Lưu Phương – người lười vận động nhất, cũng đều tham gia hội thao lần này."]],"d":[["汉语技能教学____听、说、读、写四个方面。","包括"],["然而，____翟峰的父母，所有人都觉得，翟峰“疯了”。","包括"],["我们班所有人，____最不爱运动的刘方，也都参加了这次运动会。","包括"]],"w":"Khi dùng nghĩa “kể cả”, vế sau thường có 所有人 / 都 / 也都 để khép lại ý tổng thể."},{"id":"shike","t":"时刻","s":"thời khắc (danh từ); luôn luôn (phó từ)","b":"<b>时刻</b> là <b>danh từ</b>, chỉ một thời điểm hoặc một khoảng thời gian nhất định. 时刻 cũng có thể làm <b>phó từ</b>, mang nghĩa mọi lúc mọi nơi, thường xuyên; khi đó có thể lặp lại thành <b>时时刻刻</b>.","r":["Danh từ: (định ngữ +) 时刻 — 最后时刻, 美好的时刻, 雷电交加的时刻","Phó từ: 时刻 + (都) + động từ — 公司的大门时刻都为你开着","Dạng lặp nhấn mạnh: 时时刻刻 + động từ — 他时时刻刻提醒自己"],"e":[["在最后时刻，他为本队踢进了赢得比赛的关键一球。","Zài zuìhòu shíkè, tā wèi běn duì tījìn le yíngdé bǐsài de guānjiàn yì qiú.","Vào thời khắc cuối cùng, anh ấy đã sút tung lưới bàn thắng quyết định giúp đội nhà giành chiến thắng."],["美好的时刻过去后是一个个紧张的夜晚。","Měihǎo de shíkè guòqù hòu shì yí gègè jǐnzhāng de yèwǎn.","Sau những khoảnh khắc tươi đẹp là từng đêm căng thẳng. <i>(bài khoá)</i>"],["我们非常需要你这样的人才，只要你愿意，公司的大门时刻都为你开着。","Wǒmen fēicháng xūyào nǐ zhèyàng de réncái, zhǐyào nǐ yuànyì, gōngsī de dàmén shíkè dōu wèi nǐ kāizhe.","Chúng tôi rất cần nhân tài như anh, chỉ cần anh muốn, cửa công ty lúc nào cũng rộng mở chào đón anh."],["工作中，他时时刻刻提醒自己：乘客的安全是最重要的。","Gōngzuò zhōng, tā shíshíkèkè tíxǐng zìjǐ: chéngkè de ānquán shì zuì zhòngyào de.","Trong công việc, anh ấy luôn tự nhắc mình: an toàn của hành khách là quan trọng nhất."]],"d":[["在最后____，他为本队踢进了赢得比赛的关键一球。","时刻"],["只要你愿意，公司的大门____都为你开着。","时刻"],["工作中，他____提醒自己：乘客的安全是最重要的。","时时刻刻"]],"w":"Đừng nhầm 时刻 (thời khắc, một thời điểm) với 时代 (thời đại, cả một giai đoạn lịch sử) — bài 练习 của sách có câu chọn giữa hai từ này."},{"id":"shushi-shufu","t":"舒适 vs 舒服","s":"phân biệt hai tính từ chỉ sự dễ chịu, thoải mái","b":"<b>Giống nhau:</b> cả hai đều là <b>tính từ</b>, đều biểu thị cảm giác nhẹ nhõm, dễ chịu. Ví dụ có thể dùng cả hai: 饭店为入住的客人准备了舒适/舒服的房间。","r":["Phong cách: <b>舒适</b> dùng nhiều trong văn viết; <b>舒服</b> dùng nhiều trong khẩu ngữ.","Trọng tâm nghĩa: <b>舒适</b> thiên về cảm nhận tổng thể mà môi trường mang lại cho con người; <b>舒服</b> thiên về cảm nhận chủ quan, cụ thể về thể chất, tinh thần của con người.","Lặp lại: <b>舒适</b> hầu như không lặp lại; <b>舒服</b> có thể lặp dạng AABB (舒舒服服), còn có thể dùng linh hoạt như động từ với dạng lặp ABAB (舒服舒服)."],"e":[["饭店为入住的客人准备了舒适/舒服的房间。","Fàndiàn wèi rùzhù de kèrén zhǔnbèi le shūshì/shūfu de fángjiān.","Khách sạn đã chuẩn bị những căn phòng tiện nghi, dễ chịu cho khách lưu trú."],["这款车内部空间宽大，乘坐舒适。","Zhè kuǎn chē nèibù kōngjiān kuāndà, chéngzuò shūshì.","Mẫu xe này có khoang bên trong rộng rãi, ngồi rất thoải mái."],["他靠在沙发上舒舒服服地看电视。","Tā kào zài shāfā shang shūshufúfú de kàn diànshì.","Anh ấy tựa lưng vào sofa, thoải mái xem tivi."],["我们都需要一个轻松舒适的生活环境。","Wǒmen dōu xūyào yí ge qīngsōng shūshì de shēnghuó huánjìng.","Chúng ta đều cần một môi trường sống thư thái, dễ chịu."],["听了他的话，我心里很不舒服。","Tīng le tā de huà, wǒ xīnli hěn bù shūfu.","Nghe những lời anh ta nói, trong lòng tôi thấy rất khó chịu."],["踢完球了？洗个热水澡舒服舒服吧。","Tī wán qiú le? Xǐ ge rèshuǐzǎo shūfu shūfu ba.","Đá bóng xong rồi à? Tắm nước nóng cho thư giãn đi."]],"d":[["早晨收拾完房间后，妈妈喜欢____地坐在那把躺椅上休息一下。","舒服"],["这家餐厅装修精美、环境____。","舒适"],["我今天脖子有点儿不____，左右转动时有点儿疼。","舒服"],["这艘客船就像高级宾馆一样，除了有____的客舱外，还有餐厅、电影院、商店、舞厅、游泳池等。","舒适"]],"w":"Nói về môi trường, không gian (phòng, xe, khoang thuyền, môi trường sống) → 舒适; nói về cảm giác của cơ thể hay trong lòng (cổ đau, trong lòng khó chịu) → 舒服."}],"ext":[["预报","yùbào","dự báo"],["彩虹","cǎihóng","cầu vồng"],["雷","léi","sấm"],["闪电","shǎndiàn","chớp"],["雾","wù","sương mù"],["零件","língjiàn","linh kiện"],["手工","shǒugōng","thủ công"],["维修","wéixiū","bảo trì, sửa chữa"],["机器","jīqì","máy móc"],["产品","chǎnpǐn","sản phẩm"],["设备","shèbèi","thiết bị"],["设施","shèshī","cơ sở vật chất, tiện ích"],["工具","gōngjù","công cụ"]],"extt":"天气 / 生产 1","notes":"Nguồn bài khoá: 改编自《都市快报》，作者：黄小星。Bảng 扩展 có 2 chủ đề (天气; 生产 1) được gộp chung; sách chỉ in pinyin, nghĩa Việt của bảng 扩展 do người soạn bổ sung. vocab_ex: 辞职 lấy câu bài 练习 1 của sách (bài khoá chỉ có “辞了职”); 干活儿 là câu tự đặt vì bài khoá chỉ có “干完活儿”. Ví dụ (2) của 包括: sách chú thích 实践 (shíjiàn, thực hành) ngay trong câu, đã bỏ phần chú thích. Phần (二) 词语搭配 (轮流+驾船/休息/照看; 盼望+(好)消息/过年/成功; 稳定的+工作/生活/关系/收入; 平静的+海面/心情/生活; 为+生活/工作/考试+发愁; 紧紧(地)/热情(地)+拥抱; 撞+倒/伤/断/开; 漏+光/掉/出来; 一顿+饭/海鲜; 一道+闪电) không có trường riêng trong schema. Không có chỗ nào trong sách bị mờ.","order":[{"z":"翟峰和妻子都是铁路工人，工作稳定、待遇不错。","t":["翟峰","和","妻子","都","是","铁路工人","工作","稳定","待遇","不错"],"v":"Trác Phong và vợ đều là công nhân đường sắt, công việc ổn định, đãi ngộ khá tốt."},{"z":"他们有房有车，从不用为生活发愁。","t":["他们","有房","有车","从","不用","为","生活","发愁"],"v":"Họ có nhà có xe, chưa bao giờ phải lo lắng chuyện cơm áo."},{"z":"可翟峰却不想一辈子过这样平静的生活。","t":["可","翟峰","却","不想","一辈子","过","这样","平静","的","生活"],"v":"Thế nhưng Trác Phong lại không muốn cả đời sống một cuộc sống yên ả như vậy."},{"z":"出发前，翟峰自学了航海知识。","t":["出发","前","翟峰","自学","了","航海","知识"],"v":"Trước khi khởi hành, Trác Phong tự học kiến thức hàng hải."},{"z":"然而，包括翟峰的父母，所有人都觉得，翟峰“疯了”。","t":["然而","包括","翟峰","的","父母","所有人","都","觉得","翟峰","疯","了"],"v":"Thế nhưng tất cả mọi người, kể cả bố mẹ Trác Phong, đề z":"路过镇上，他买了一袋米、一块肉、两条鱼，背在后背上。","ev":"Đi ngang qua thị trấn, anh mua một bao gạo, một miếng thịt, hai con cá rồi vác lên lưng."},{"h":"滑","p":"huá","v":"trơn; trượt","k":"tt./đgt.","x":0,"ez":"天气非常寒冷，雪地很滑，子路不小心滑了一下。","ev":"Trời rét buốt, mặt tuyết rất trơn, Tử Lộ sơ ý trượt chân một cái."},{"h":"甩","p":"shuǎi","v":"vung, quăng, ném","k":"đgt.","x":0,"ez":"背上的米袋差点儿被甩出去。","ev":"Bao gạo trên lưng suýt nữa thì văng ra ngoài."},{"h":"顶","p":"dǐng","v":"đi ngược","k":"đgt.","x":0,"ez":"他顶着大雪往前走。","ev":"Anh đội tuyết lớn mà đi tiếp về phía trước."},{"h":"扶","p":"fú","v":"đỡ, vịn","k":"đgt.","x":0,"ez":"扶着米袋的双手冻得不行，就停下来暖暖，再继续赶路。","ev":"Hai bàn tay giữ bao gạo lạnh cóng đến mức không chịu nổi, anh phải dừng lại sưởi ấm một chút rồi mới đi tiếp."},{"h":"不行","p":"bùxíng","v":"(chỉ mức độ, cường độ...) ghê gớm, kinh khủng, cực kỳ","k":"đgt.","x":0,"ez":"扶着米袋的双手冻得不行，就停下来暖暖，再继续赶路。","ev":"Hai bàn tay giữ bao gạo lạnh cóng đến mức không chịu nổi, anh phải dừng lại sưởi ấm một chút rồi mới đi tiếp."},{"h":"团圆","p":"tuányuán","v":"sum họp, đoàn tụ","k":"đgt.","x":1,"ez":"一家人高高兴兴地生火做饭，饱饱地吃了顿团圆饭。","ev":"Cả nhà vui vẻ nhóm lửa nấu cơm, cùng ăn một bữa cơm đoàn viên no nê."},{"h":"去世","p":"qùshì","v":"qua đời, từ trần","k":"đgt.","x":0,"ez":"后来子路的父母去世了，他也南下到了楚国。","ev":"Về sau cha mẹ Tử Lộ qua đời, ông cũng xuống phía nam đến nước Sở."},{"h":"国君","p":"guójūn","v":"vua","k":"dt.","x":1,"ez":"楚国国君觉得他很有本领，是个人才。","ev":"Vua nước Sở thấy ông rất có năng lực, là một nhân tài."},{"h":"本领","p":"běnlǐng","v":"bản lĩnh, năng lực","k":"dt.","x":0,"ez":"楚国国君觉得他很有本领，是个人才。","ev":"Vua nước Sở thấy ông rất có năng lực, là một nhân tài."},{"h":"人才","p":"réncái","v":"người có tài","k":"dt.","x":0,"ez":"楚国国君觉得他很有本领，是个人才，就留他做了官。","ev":"Vua nước Sở thấy ông rất có năng lực, là một nhân tài, liền giữ ông lại làm quan."},{"h":"官","p":"guān","v":"quan","k":"dt.","x":0,"ez":"楚国国君觉得他很有本领，是个人才，就留他做了官，并给他很优厚的待遇。","ev":"Vua nước Sở thấy ông rất có năng lực, là một nhân tài, liền giữ ông lại làm quan và đãi ngộ rất hậu hĩnh."},{"h":"物质","p":"wùzhì","v":"vật chất","k":"dt.","x":0,"ez":"但他并没有因为物质条件好而感到欢喜。","ev":"Nhưng ông không hề vì điều kiện vật chất đầy đủ mà thấy vui mừng."},{"h":"反而","p":"fǎn'ér","v":"trái lại, ngược lại","k":"phó.","x":0,"ez":"但他并没有因为物质条件好而感到欢喜，反而常常诚恳地说……","ev":"Nhưng ông không hề vì điều kiện vật chất đầy đủ mà vui mừng, trái lại thường thành khẩn nói…"},{"h":"诚恳","p":"chéngkěn","v":"thành khẩn","k":"tt.","x":0,"ez":"反而常常诚恳地说：“多么希望父母能和我一起过好日子！”","ev":"Trái lại, ông thường thành khẩn nói: \"Ước gì cha mẹ được cùng tôi sống những ngày sung túc!\""},{"h":"成就","p":"chéngjiù","v":"thành tựu, thành quả","k":"dt.","x":0,"ez":"我现在有了一点儿成就，可他们已经不在了。","ev":"Giờ tôi đã có chút thành tựu, nhưng cha mẹ thì đã không còn nữa."},{"h":"古代","p":"gǔdài","v":"ngày xưa","k":"dt.","x":0,"ez":"中国古代有句话叫“百善孝为先”。","ev":"Người Trung Quốc xưa có câu \"Trăm điều thiện, chữ hiếu đứng đầu\"."},{"h":"孝顺","p":"xiàoshùn","v":"thể hiện lòng hiếu thảo; hiếu thảo","k":"đgt./tt.","x":0,"ez":"孝顺父母是各种美德中占第一位的。","ev":"Hiếu thảo với cha mẹ đứng hàng đầu trong mọi đức tính tốt."},{"h":"美德","p":"měidé","v":"phẩm chất tốt","k":"dt.","x":1,"ez":"孝顺父母是各种美德中占第一位的。","ev":"Hiếu thảo với cha mẹ đứng hàng đầu trong mọi đức tính tốt."},{"h":"占","p":"zhàn","v":"chiếm, giữ","k":"đgt.","x":0,"ez":"孝顺父母是各种美德中占第一位的。","ev":"Hiếu thảo với cha mẹ chiếm vị trí số một trong mọi đức tính tốt."},{"h":"食物","p":"shíwù","v":"thức ăn","k":"dt.","x":0,"ez":"子路为了让父母吃到较好的食物，不怕辛苦。","ev":"Tử Lộ không quản vất vả để cha mẹ được ăn những món ăn tươm tất hơn."},{"h":"楚国","p":"Chǔguó","v":"nước Sở","k":"tên riêng","x":0,"ez":"后来子路的父母去世了，他也南下到了楚国。","ev":"Về sau cha mẹ Tử Lộ qua đời, ông cũng xuống phía nam đến nước Sở."}]],"texts":[{"no":1,"tz":"","tv":"","lines":[{"s":"","z":"从前，大概在距今两千五百多年前的春秋时期，有一个人叫子路，他是孔子最年长的学生。","p":"Cóngqián, dàgài zài jù jīn liǎngqiān wǔbǎi duō nián qián de Chūnqiū shíqī, yǒu yí ge rén jiào Zǐlù, tā shì Kǒngzǐ zuì niánzhǎng de xuésheng.","v":"Ngày xưa, vào thời Xuân Thu cách nay khoảng hơn hai nghìn năm trăm năm, có một người tên là Tử Lộ, ông là học trò lớn tuổi nhất của Khổng Tử.","b":0},{"s":"","z":"流传至今的“百里背米”讲的就是他孝敬父母的故事。","p":"Liúchuán zhìjīn de “Bǎi lǐ bēi mǐ” jiǎng de jiù shì tā xiàojìng fùmǔ de gùshi.","v":"Câu chuyện \"Vác gạo trăm dặm\" còn lưu truyền đến ngày nay chính là kể về lòng hiếu kính cha mẹ của ông.","b":0},{"s":"","z":"子路的父母都是农民。","p":"Zǐlù de fùmǔ dōu shì nóngmín.","v":"Cha mẹ Tử Lộ đều là nông dân.","b":0},{"s":"","z":"由于连年的战争，家里生活非常困难。","p":"Yóuyú liánnián de zhànzhēng, jiāli shēnghuó fēicháng kùnnan.","v":"Vì chiến tranh liên miên năm này qua năm khác, cuộc sống gia đình vô cùng khó khăn.","b":0},{"s":"","z":"一天，子路从外面回来，听到父母在屋里说话：“活了大半辈子了，别说鱼肉，只要能饱饱地吃上一顿米饭，也就满足啦！”","p":"Yì tiān, Zǐlù cóng wàimian huílai, tīngdào fùmǔ zài wū li shuōhuà: “Huóle dà bànbèizi le, bié shuō yú ròu, zhǐyào néng bǎobǎo de chīshang yí dùn mǐfàn, yě jiù mǎnzú la!”","v":"Một hôm, Tử Lộ từ ngoài về, nghe cha mẹ nói chuyện trong nhà: \"Sống hơn nửa đời người rồi, đừng nói cá thịt, chỉ cần được ăn một bữa cơm no nê là mãn nguyện lắm rồi!\"","b":0},{"s":"","z":"子路听了，心里觉得十分惭愧。","p":"Zǐlù tīngle, xīnli juéde shífēn cánkuì.","v":"Tử Lộ nghe vậy, trong lòng thấy vô cùng hổ thẹn.","b":0},{"s":"","z":"他暗下决心：“一定要让父母吃上米饭，不能再委屈他们了！”","p":"Tā àn xià juéxīn: “Yídìng yào ràng fùmǔ chīshang mǐfàn, bù néng zài wěiqu tāmen le!”","v":"Anh thầm hạ quyết tâm: \"Nhất định phải cho cha mẹ được ăn cơm, không thể để họ chịu thiệt thòi thêm nữa!\"","b":0},{"s":"","z":"子路打听到百里之外有个有钱人，家里缺干活儿的人，决定去试一试。","p":"Zǐlù dǎtingdào bǎi lǐ zhī wài yǒu ge yǒu qián rén, jiāli quē gàn huór de rén, juédìng qù shì yi shì.","v":"Tử Lộ nghe ngóng được rằng cách đó trăm dặm có một nhà giàu đang thiếu người làm, bèn quyết định đi thử xem sao.","b":1},{"s":"","z":"那家主人见他身体结实，就留下了他。","p":"Nà jiā zhǔrén jiàn tā shēntǐ jiēshi, jiù liúxiale tā.","v":"Chủ nhà thấy anh khỏe mạnh nên giữ anh lại.","b":0},{"s":"","z":"子路干起活来十分勤奋，主人很喜欢这个小伙子。","p":"Zǐlù gàn qǐ huó lai shífēn qínfèn, zhǔrén hěn xǐhuan zhège xiǎohuǒzi.","v":"Tử Lộ làm việc rất chăm chỉ, chủ nhà rất quý chàng trai này.","b":0},{"s":"","z":"半年后，当子路要回家时，发现主人给的银子比他应该得到的多了许多，子路老老实实地告诉了主人。","p":"Bàn nián hòu, dāng Zǐlù yào huí jiā shí, fāxiàn zhǔrén gěi de yínzi bǐ tā yīnggāi dédào de duōle xǔduō, Zǐlù lǎolǎoshíshí de gàosule zhǔrén.","v":"Nửa năm sau, lúc sắp về nhà, Tử Lộ phát hiện số bạc chủ nhà đưa nhiều hơn hẳn số anh đáng được nhận, anh liền thật thà nói lại với chủ nhà.","b":0},{"s":"","z":"主人笑着说：“孩子，工钱没算错，你做事勤快，这是我给你加的奖金。”","p":"Zhǔrén xiàozhe shuō: “Háizi, gōngqian méi suàn cuò, nǐ zuò shì qínkuai, zhè shì wǒ gěi nǐ jiā de jiǎngjīn.”","v":"Chủ nhà cười nói: \"Con à, tiền công không tính nhầm đâu, con làm việc siêng năng, đây là tiền thưởng ta thêm cho con.\"","b":0},{"s":"","z":"谢过主人，子路高兴地上路了。","p":"Xièguo zhǔrén, Zǐlù gāoxìng de shànglù le.","v":"Cảm ơn chủ nhà xong, Tử Lộ vui vẻ lên đường.","b":0},{"s":"","z":"路过镇上，他买了一袋米、一块肉、两条鱼，背在后背上。","p":"Lùguò zhèn shang, tā mǎile yí dài mǐ, yí kuài ròu, liǎng tiáo yú, bēi zài hòubèi shang.","v":"Đi ngang qua thị trấn, anh mua một bao gạo, một miếng thịt, hai con cá rồi vác lên lưng.","b":0},{"s":"","z":"天气非常寒冷，雪地很滑，子路不小心滑了一下，背上的米袋差点儿被甩出去。","p":"Tiānqì fēicháng hánlěng, xuědì hěn huá, Zǐlù bù xiǎoxīn huále yíxià, bèi shang de mǐdài chàdiǎnr bèi shuǎi chuqu.","v":"Trời rét buốt, mặt tuyết rất trơn, Tử Lộ sơ ý trượt chân một cái, bao gạo trên lưng suýt nữa thì văng ra ngoài.","b":0},{"s":"","z":"他顶着大雪往前走，扶着米袋的双手冻得不行，就停下来暖暖，再继续赶路。","p":"Tā dǐngzhe dàxuě wǎng qián zǒu, fúzhe mǐdài de shuāng shǒu dòng de bùxíng, jiù tíng xialai nuǎnnuan, zài jìxù gǎnlù.","v":"Anh đội tuyết lớn đi tiếp, hai bàn tay giữ bao gạo lạnh cóng đến mức không chịu nổi, anh phải dừng lại sưởi ấm một chút rồi mới tiếp tục lên đường.","b":0},{"s":"","z":"终于到家了，见到父母，子路把给他们买的东西及剩下的工钱都交给了他们。","p":"Zhōngyú dào jiā le, jiàndào fùmǔ, Zǐlù bǎ gěi tāmen mǎi de dōngxi jí shèngxia de gōngqian dōu jiāo gěile tāmen.","v":"Cuối cùng cũng về đến nhà, gặp cha mẹ, Tử Lộ trao hết cho họ những thứ đã mua cùng số tiền công còn lại.","b":0},{"s":"","z":"一家人高高兴兴地生火做饭，饱饱地吃了顿团圆饭。","p":"Yì jiā rén gāogāoxìngxìng de shēng huǒ zuò fàn, bǎobǎo de chīle dùn tuányuán fàn.","v":"Cả nhà vui vẻ nhóm lửa nấu cơm, cùng ăn một bữa cơm đoàn viên no nê.","b":0},{"s":"","z":"后来子路的父母去世了，他也南下到了楚国。","p":"Hòulái Zǐlù de fùmǔ qùshì le, tā yě nánxià dàole Chǔguó.","v":"Về sau cha mẹ Tử Lộ qua đời, ông cũng xuống phía nam đến nước Sở.","b":1},{"s":"","z":"楚国国君觉得他很有本领，是个人才，就留他做了官，并给他很优厚的待遇。","p":"Chǔguó guójūn juéde tā hěn yǒu běnlǐng, shì ge réncái, jiù liú tā zuòle guān, bìng gěi tā hěn yōuhòu de dàiyù.","v":"Vua nước Sở thấy ông rất có năng lực, là một nhân tài, liền giữ ông lại làm quan và đãi ngộ rất hậu hĩnh.","b":0},{"s":"","z":"但他并没有因为物质条件好而感到欢喜，反而常常诚恳地说：“多么希望父母能和我一起过好日子！","p":"Dàn tā bìng méiyǒu yīnwèi wùzhì tiáojiàn hǎo ér gǎndào huānxǐ, fǎn'ér chángcháng chéngkěn de shuō: “Duōme xīwàng fùmǔ néng hé wǒ yìqǐ guò hǎo rìzi!","v":"Nhưng ông không hề vì điều kiện vật chất đầy đủ mà vui mừng, trái lại thường thành khẩn nói: \"Ước gì cha mẹ được cùng tôi sống những ngày sung túc!","b":0},{"s":"","z":"我现在有了一点儿成就，可他们已经不在了，即使再想背米百里去孝敬双亲，也不可能了。”","p":"Wǒ xiànzài yǒule yìdiǎnr chéngjiù, kě tāmen yǐjīng bú zài le, jíshǐ zài xiǎng bēi mǐ bǎi lǐ qù xiàojìng shuāngqīn, yě bù kěnéng le.”","v":"Giờ tôi đã có chút thành tựu, nhưng cha mẹ thì không còn nữa; dù có muốn vác gạo trăm dặm về phụng dưỡng song thân cũng chẳng thể nào được nữa.\"","b":0},{"s":"","z":"中国古代有句话叫“百善孝为先”，意思是说，孝顺父母是各种美德中占第一位的。","p":"Zhōngguó gǔdài yǒu jù huà jiào “bǎi shàn xiào wéi xiān”, yìsi shì shuō, xiàoshùn fùmǔ shì gè zhǒng měidé zhōng zhàn dì-yī wèi de.","v":"Trung Quốc thời xưa có câu \"Trăm điều thiện, chữ hiếu đứng đầu\", nghĩa là hiếu thảo với cha mẹ đứng hàng đầu trong mọi đức tính tốt.","b":0},{"s":"","z":"子路为了让父母吃到较好的食物，不怕辛苦，这种做法确实值得我们学习。","p":"Zǐlù wèile ràng fùmǔ chīdào jiào hǎo de shíwù, bú pà xīnkǔ, zhè zhǒng zuòfǎ quèshí zhíde wǒmen xuéxí.","v":"Tử Lộ không quản vất vả để cha mẹ được ăn ngon hơn, việc làm ấy thật đáng để chúng ta học tập.","b":0}]}],"aud":[{"v":"audio/04-2.mp3","t":"audio/04-1.mp3"}],"gram":[{"id":"zhijin","t":"至今","s":"đến nay, đến bây giờ (phó từ)","b":"<b>至今</b> là <b>phó từ</b>, nghĩa là \"cho đến tận bây giờ\". Thường đứng <b>đầu phân câu</b> hoặc <b>trước động từ</b>. Ngoài ra có thể kết hợp với một số từ để tạo thành cấu trúc cố định như <b>从古至今</b> (từ xưa đến nay), <b>流传至今</b> (lưu truyền đến nay).","r":["Đầu phân câu, có dấu phẩy: 至今，很多国家并没有……","Trước động từ (thường đi với 还/没): ……，至今还没离开过","Cấu trúc cố định: 从古至今 / 流传至今 (+ 的 + danh từ để làm định ngữ)"],"e":[["我在北京出生、长大，至今还没离开过呢。","Wǒ zài Běijīng chūshēng, zhǎngdà, zhìjīn hái méi líkāiguo ne.","Tôi sinh ra và lớn lên ở Bắc Kinh, đến giờ vẫn chưa từng rời khỏi đó."],["至今，很多国家并没有规定什么才是健康食品。","Zhìjīn, hěn duō guójiā bìng méiyǒu guīdìng shénme cái shì jiànkāng shípǐn.","Cho đến nay, nhiều nước vẫn chưa hề quy định thế nào mới là thực phẩm lành mạnh."],["流传至今的“百里背米”讲的就是他孝敬父母的故事。","Liúchuán zhìjīn de “Bǎi lǐ bēi mǐ” jiǎng de jiù shì tā xiàojìng fùmǔ de gùshi.","Câu chuyện \"Vác gạo trăm dặm\" lưu truyền đến nay chính là kể về lòng hiếu kính cha mẹ của ông. <i>(bài khoá)</i>"]],"d":[["我在北京出生、长大，____还没离开过呢。","至今"],["____，很多国家并没有规定什么才是健康食品。","至今"],["流传____的“百里背米”讲的就是他孝敬父母的故事。","至今"]],"w":"至今 nhấn mạnh trạng thái kéo dài tới hiện tại, nên hay đi với 还/仍/一直 hoặc phủ định 没(有)."},{"id":"ding","t":"顶","s":"đỉnh; đội, húc; đội (gió tuyết); chiếc (lượng từ)","b":"<b>顶</b> có nhiều cách dùng: <b>danh từ</b> chỉ phần cao nhất của người hoặc vật (头顶, 山顶); <b>động từ</b> chỉ động tác bằng đầu (đội, húc); động từ còn mang nghĩa <b>đi ngược lại, chống chọi</b> (顶着大雪, 顶着压力); và <b>lượng từ</b> dùng cho mũ, ô lớn hoặc vật hình chiếc ô.","r":["Danh từ: 头顶 (đỉnh đầu), 山顶 (đỉnh núi)","Động từ – động tác bằng đầu: 用头顶起……, 头顶着头","Động từ – đi ngược, chống chọi: 顶着 + 大雪/大风/压力 + V","Lượng từ: 一顶帽子, 一顶保护伞"],"e":[["请把手举过头顶。","Qǐng bǎ shǒu jǔguò tóudǐng.","Hãy giơ tay lên quá đỉnh đầu."],["父亲的朋友画了张画儿送我，画上是一座山，山顶有一个人往下看，山下有一个人往上看。","Fùqin de péngyou huàle zhāng huàr sòng wǒ, huà shang shì yí zuò shān, shāndǐng yǒu yí ge rén wǎng xià kàn, shān xià yǒu yí ge rén wǎng shàng kàn.","Bạn của bố vẽ tặng tôi một bức tranh: trong tranh là một ngọn núi, trên đỉnh có một người nhìn xuống, dưới chân núi có một người nhìn lên."],["他能用头顶起20斤重的东西。","Tā néng yòng tóu dǐngqǐ èrshí jīn zhòng de dōngxi.","Anh ấy có thể dùng đầu đội được vật nặng 20 cân."],["院子里有两只羊正在打架，它们头顶着头，角对着角，就像两个小孩儿一样，谁也不愿让谁。","Yuànzi li yǒu liǎng zhī yáng zhèngzài dǎjià, tāmen tóu dǐngzhe tóu, jiǎo duìzhe jiǎo, jiù xiàng liǎng ge xiǎoháir yíyàng, shéi yě bú yuàn ràng shéi.","Trong sân có hai con dê đang húc nhau, đầu chạm đầu, sừng chọi sừng, y như hai đứa trẻ, chẳng con nào chịu nhường con nào."],["天气非常寒冷，子路顶着大雪往前走。","Tiānqì fēicháng hánlěng, Zǐlù dǐngzhe dàxuě wǎng qián zǒu.","Trời rét buốt, Tử Lộ đội tuyết lớn mà đi tiếp."],["您为什么要顶着压力来做这件事呢？","Nín wèi shénme yào dǐngzhe yālì lái zuò zhè jiàn shì ne?","Vì sao ông lại chịu áp lực mà làm việc này?"],["我这顶新帽子怎么样？","Wǒ zhè dǐng xīn màozi zěnmeyàng?","Chiếc mũ mới này của tớ thế nào?"],["这项计划将成为儿童健康的一顶保护伞。","Zhè xiàng jìhuà jiāng chéngwéi értóng jiànkāng de yì dǐng bǎohùsǎn.","Kế hoạch này sẽ trở thành chiếc ô bảo vệ sức khỏe trẻ em."]],"d":[["请把手举过头____。","顶"],["天气非常寒冷，子路____着大雪往前走。","顶"],["我这____新帽子怎么样？","顶"],["球被那个球员____了回来。","顶"]],"w":"Khi là động từ \"chống chọi\", 顶 thường ở dạng 顶着 + danh từ (大雪/压力) rồi mới đến động từ chính. Lượng từ 顶 chỉ dùng cho mũ, ô và vật hình ô."},{"id":"de_buxing","t":"……得 + 不行","s":"… đến mức không chịu nổi, cực kỳ (bổ ngữ mức độ)","b":"<b>……得 + 不行</b> biểu thị <b>mức độ</b> rất cao (ghê gớm, cực kỳ). Có thể thay bằng <b>……得 + 很</b> hoặc <b>……得 + 不得了</b>.","r":["Tính từ/động từ tâm lý + 得 + 不行: 冻得不行, 累得不行","Biến thể: ……得很 (烦得很), ……得不得了 (高兴得不得了)","Không bỏ 得: ✗ 冻不行 → ✓ 冻得不行"],"e":[["他顶着大雪往前走，扶着米袋的双手冻得不行，就停下来暖暖，再继续赶路。","Tā dǐngzhe dàxuě wǎng qián zǒu, fúzhe mǐdài de shuāng shǒu dòng de bùxíng, jiù tíng xialai nuǎnnuan, zài jìxù gǎnlù.","Anh đội tuyết lớn đi tiếp, hai bàn tay giữ bao gạo lạnh cóng đến mức không chịu nổi, anh phải dừng lại sưởi ấm một chút rồi mới tiếp tục lên đường. <i>(bài khoá)</i>"],["这个地方这么热闹，孩子们高兴得不得了！","Zhège dìfang zhème rènao, háizimen gāoxìng de bùdéliǎo!","Chỗ này náo nhiệt thế, bọn trẻ vui không tả xiết!"],["他心里烦得很，自言自语地抱怨：“怎么还有那么远啊！”","Tā xīnli fán de hěn, zìyán-zìyǔ de bàoyuàn: “Zěnme hái yǒu nàme yuǎn a!”","Trong lòng anh ấy bực bội vô cùng, lẩm bẩm than phiền: \"Sao vẫn còn xa thế chứ!\""]],"d":[["扶着米袋的双手冻得____，就停下来暖暖。","不行"],["这个地方这么热闹，孩子们高兴得____！","不得了"],["这几天作业太多了，我累____不得了。","得"]],"w":"得很 / 得不行 / 得不得了 đều chỉ mức độ cao; 得不行 thường dùng cho cảm giác khó chịu (lạnh, mệt, đói…)."},{"id":"faner","t":"反而","s":"trái lại, ngược lại (phó từ)","b":"<b>反而</b> là <b>phó từ</b>, dùng giữa hai phân câu (đứng ở phân câu sau), biểu thị kết quả <b>trái ngược với dự đoán ban đầu</b>.","r":["Thường gặp: 不但不/没……，反而……","Thường gặp: (虽然)……，但……反而……","并没有因为……而……，反而……","Là phó từ nên đứng sau chủ ngữ, trước vị ngữ: 父母反而会不适应"],"e":[["这样不但不能提高他们的阅读能力，反而有可能降低他们的阅读兴趣和热情。","Zhèyàng búdàn bù néng tígāo tāmen de yuèdú nénglì, fǎn'ér yǒu kěnéng jiàngdī tāmen de yuèdú xìngqù hé rèqíng.","Làm vậy không những không nâng cao được khả năng đọc của các em, trái lại còn có thể làm giảm hứng thú và nhiệt tình đọc sách."],["大城市的生活虽然很精彩，但一辈子生活在农村的父母反而会不适应。","Dà chéngshì de shēnghuó suīrán hěn jīngcǎi, dàn yíbèizi shēnghuó zài nóngcūn de fùmǔ fǎn'ér huì bú shìyìng.","Cuộc sống ở thành phố lớn tuy rất sôi động, nhưng cha mẹ cả đời sống ở nông thôn lại có thể không quen."],["但他并没有因为物质条件好而感到欢喜，反而常常诚恳地说：“多么希望父母能和我一起过好日子！……”","Dàn tā bìng méiyǒu yīnwèi wùzhì tiáojiàn hǎo ér gǎndào huānxǐ, fǎn'ér chángcháng chéngkěn de shuō: “Duōme xīwàng fùmǔ néng hé wǒ yìqǐ guò hǎo rìzi! ……”","Nhưng ông không hề vì điều kiện vật chất đầy đủ mà vui mừng, trái lại thường thành khẩn nói: \"Ước gì cha mẹ được cùng tôi sống những ngày sung túc!…\" <i>(bài khoá)</i>"]],"d":[["他没有接受那份优厚的待遇，____辞职了。","反而"],["这样不但不能提高他们的阅读能力，____有可能降低他们的阅读兴趣和热情。","反而"],["大城市的生活虽然很精彩，但一辈子生活在农村的父母____会不适应。","反而"]],"w":"Đừng nhầm với 而且: 而且 nối thêm ý cùng chiều, còn 反而 dẫn ra kết quả ngược với điều mong đợi."},{"id":"manzu_manyi","t":"满足 vs 满意","s":"thỏa mãn, mãn nguyện vs hài lòng","b":"<b>Giống nhau:</b> cả hai đều là <b>động từ</b>, đều mang nghĩa cảm thấy đủ rồi, mong muốn đã thành hiện thực. Ví dụ: 我对现在的生活感到非常满足/满意。","r":["满足 nhấn mạnh <b>không đòi hỏi gì thêm nữa</b>; 满意 nhấn mạnh <b>hợp với ý mình</b>.","满足 thường <b>không làm định ngữ hay trạng ngữ</b>; 满意 <b>có thể làm định ngữ hoặc trạng ngữ</b> (一份满意的工作, 满意地笑了).","满足 có thể đi với tân ngữ như 需要、要求、条件、愿望 (满足……的需要); 满意 <b>ít khi mang tân ngữ trực tiếp</b> (thường dùng 对……满意)."],"e":[["我对现在的生活感到非常满足/满意。","Wǒ duì xiànzài de shēnghuó gǎndào fēicháng mǎnzú/mǎnyì.","Tôi cảm thấy rất mãn nguyện/hài lòng với cuộc sống hiện tại."],["只要能饱饱地吃上一顿米饭，也就满足啦！","Zhǐyào néng bǎobǎo de chīshang yí dùn mǐfàn, yě jiù mǎnzú la!","Chỉ cần được ăn một bữa cơm no nê là mãn nguyện lắm rồi! <i>(bài khoá)</i>"],["老师说她对我这次的作业非常满意。","Lǎoshī shuō tā duì wǒ zhè cì de zuòyè fēicháng mǎnyì.","Cô giáo nói cô rất hài lòng với bài tập lần này của tôi."],["他找到了一份满意的工作。","Tā zhǎodàole yí fèn mǎnyì de gōngzuò.","Anh ấy đã tìm được một công việc ưng ý."],["这个我不想要，它不能满足我们的需要。","Zhège wǒ bù xiǎng yào, tā bù néng mǎnzú wǒmen de xūyào.","Cái này tôi không muốn lấy, nó không đáp ứng được nhu cầu của chúng tôi."]],"d":[["我对新公司的工作条件感到很____。","满意"],["父母总是会想办法____孩子的要求。","满足"],["听到这个消息，他____地笑了。","满意"],["你不能仅仅通过考试就____了，要努力取得最好的成绩。","满足"]],"w":"Mẹo: thấy chỗ trống cần tân ngữ (需要/要求/愿望) → 满足; cần định ngữ/trạng ngữ (……的工作, ……地笑) → 满意."}],"ext":[["国王","guówáng","quốc vương, vua"],["王子","wángzǐ","hoàng tử"],["公主","gōngzhǔ","công chúa"],["总理","zǒnglǐ","thủ tướng"],["总统","zǒngtǒng","tổng thống"],["主席","zhǔxí","chủ tịch"],["总裁","zǒngcái","tổng giám đốc, chủ tịch (tập đoàn)"],["主任","zhǔrèn","chủ nhiệm, trưởng (phòng, ban)"],["老板","lǎobǎn","ông chủ, sếp"],["领导","lǐngdǎo","lãnh đạo"]],"extt":"社交称谓","notes":"Sách in từ 17 là 银(子) yín (zi); trong JSON ghi han = 银子
