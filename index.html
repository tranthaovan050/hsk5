có cả cách đọc theo tiếng phổ thông và một số phương ngữ, phần giải nghĩa tiếng Anh, v.v."},{"h":"称赞","p":"chēngzàn","v":"khen ngợi, tán thưởng","k":"đgt.","x":0,"ez":"被网友称赞为“有图有真相”。","ev":"Được cư dân mạng khen là “có hình có sự thật”."},{"h":"真相","p":"zhēnxiàng","v":"sự thật","k":"dt.","x":1,"ez":"被网友称赞为“有图有真相”。","ev":"Được cư dân mạng khen là “có hình có sự thật” (có hình ảnh làm chứng)."},{"h":"佩服","p":"pèifú","v":"khâm phục, bái phục","k":"đgt.","x":0,"ez":"更让人佩服的是，汉字叔叔将网站上的内容全部开放给网友免费下载。","ev":"Điều càng khiến người ta khâm phục là Chú Chữ Hán đã mở toàn bộ nội dung trên trang web cho cư dân mạng tải xuống miễn phí."},{"h":"开放","p":"kāifàng","v":"mở cửa, mở công khai","k":"đgt.","x":0,"ez":"汉字叔叔将网站上的内容全部开放给网友免费下载。","ev":"Chú Chữ Hán đã mở toàn bộ nội dung trên trang web cho cư dân mạng tải xuống miễn phí."},{"h":"下载","p":"xiàzài","v":"tải xuống","k":"đgt.","x":0,"ez":"汉字叔叔将网站上的内容全部开放给网友免费下载。","ev":"Chú Chữ Hán đã mở toàn bộ nội dung trên trang web cho cư dân mạng tải xuống miễn phí."},{"h":"单位","p":"dānwèi","v":"đơn vị","k":"dt.","x":0,"ez":"现在，有很多单位向理查德发出了工作邀请。","ev":"Hiện nay, có rất nhiều đơn vị đã gửi lời mời làm việc tới Richard."},{"h":"识别","p":"shíbié","v":"phân biệt, nhận dạng","k":"đgt.","x":1,"ez":"因为那里也有人在做汉字识别查询的研究。","ev":"Bởi vì ở đó cũng có người đang nghiên cứu về nhận dạng và tra cứu chữ Hán."},{"h":"查询","p":"cháxún","v":"tìm kiếm, tra cứu","k":"đgt.","x":1,"ez":"因为那里也有人在做汉字识别查询的研究。","ev":"Bởi vì ở đó cũng có người đang nghiên cứu về nhận dạng và tra cứu chữ Hán."},{"h":"物理","p":"wùlǐ","v":"vật lý","k":"dt.","x":0,"ez":"在北师大，他除了教物理，还有充分的时间继续研究他的汉字，完善他的网站。","ev":"Ở Đại học Sư phạm Bắc Kinh, ngoài việc dạy vật lý, ông còn có nhiều thời gian để tiếp tục nghiên cứu chữ Hán và hoàn thiện trang web của mình."},{"h":"完善","p":"wánshàn","v":"hoàn thiện; trọn vẹn, đầy đủ","k":"đgt./tt.","x":0,"ez":"还有充分的时间继续研究他的汉字，完善他的网站。","ev":"Còn có nhiều thời gian để tiếp tục nghiên cứu chữ Hán và hoàn thiện trang web của mình."},{"h":"退休","p":"tuì xiū","v":"về hưu","k":"đgt.","x":0,"ez":"在中国，60多岁已经是退休的年纪了。","ev":"Ở Trung Quốc, hơn 60 tuổi đã là tuổi nghỉ hưu rồi."},{"h":"日程","p":"rìchéng","v":"chương trình trong ngày","k":"dt.","x":0,"ez":"但汉字叔叔每天的日程却安排得很满。","ev":"Thế nhưng lịch làm việc mỗi ngày của Chú Chữ Hán lại kín mít."},{"h":"追求","p":"zhuīqiú","v":"theo đuổi","k":"đgt.","x":0,"ez":"我还要继续追求我的梦想。","ev":"Tôi vẫn sẽ tiếp tục theo đuổi ước mơ của mình."},{"h":"梦想","p":"mèngxiǎng","v":"điều mơ ước; mơ tưởng","k":"dt./đgt.","x":0,"ez":"我不会退休，我还要继续追求我的梦想。","ev":"Tôi sẽ không nghỉ hưu, tôi vẫn sẽ tiếp tục theo đuổi ước mơ của mình."},{"h":"北京师范大学","p":"Běijīng Shīfàn Dàxué","v":"Đại học Sư phạm Bắc Kinh","k":"tên riêng","x":0,"ez":"而理查德选择了去北京师范大学教书。","ev":"Còn Richard thì chọn đến Đại học Sư phạm Bắc Kinh dạy học."}]],"texts":[{"no":1,"tz":"","tv":"","lines":[{"s":"","z":"1972年，22岁的理查德·希尔斯爱上了中文，但是他感觉汉字很复杂，汉字的一笔一画没有任何逻辑，只能死记硬背。","p":"1972 nián, 22 suì de Lǐchádé·Xī'ěrsī àishangle Zhōngwén, dànshì tā gǎnjué Hànzì hěn fùzá, Hànzì de yì bǐ yí huà méiyǒu rènhé luójí, zhǐ néng sǐjì-yìngbèi.","v":"Năm 1972, chàng Richard Sears 22 tuổi đem lòng yêu tiếng Trung, nhưng anh thấy chữ Hán quá phức tạp, từng nét từng nét chẳng theo lô-gích nào, chỉ có thể học thuộc lòng một cách máy móc.","b":0},{"s":"","z":"一个偶然的机会，他发现如果了解汉字的来源和演变过程，再学习它就变得轻松、容易。","p":"Yí ge ǒurán de jīhuì, tā fāxiàn rúguǒ liǎojiě Hànzì de láiyuán hé yǎnbiàn guòchéng, zài xuéxí tā jiù biàn de qīngsōng, róngyì.","v":"Một lần tình cờ, anh phát hiện ra rằng nếu hiểu được nguồn gốc và quá trình biến đổi của chữ Hán thì việc học nó sẽ trở nên nhẹ nhàng, dễ dàng hơn.","b":0},{"s":"","z":"但是他遗憾地发现，几乎没有一本英文书能充分解释汉字的字源。","p":"Dànshì tā yíhàn de fāxiàn, jīhū méiyǒu yì běn Yīngwén shū néng chōngfèn jiěshì Hànzì de zìyuán.","v":"Nhưng anh tiếc nuối nhận ra rằng hầu như không có cuốn sách tiếng Anh nào giải thích đầy đủ nguồn gốc của chữ Hán.","b":0},{"s":"","z":"1994年，理查德得了心脏病，当时医生说他剩下的时间可能不多了。","p":"1994 nián, Lǐchádé déle xīnzàngbìng, dāngshí yīshēng shuō tā shèngxia de shíjiān kěnéng bù duō le.","v":"Năm 1994, Richard mắc bệnh tim, khi ấy bác sĩ nói thời gian còn lại của ông có lẽ không còn nhiều.","b":0},{"s":"","z":"那时，他开始思考自己的人生，“我该怎么办？我该做什么？”","p":"Nàshí, tā kāishǐ sīkǎo zìjǐ de rénshēng, “Wǒ gāi zěnme bàn? Wǒ gāi zuò shénme?”","v":"Lúc đó, ông bắt đầu suy ngẫm về cuộc đời mình: “Mình nên làm sao đây? Mình nên làm gì đây?”","b":0},{"s":"","z":"“如果只能活24小时，我会打电话和朋友们说再见；如果我还能活一年，我要抓紧时间尽快把《说文解字》电脑化。”","p":"“Rúguǒ zhǐ néng huó 24 xiǎoshí, wǒ huì dǎ diànhuà hé péngyoumen shuō zàijiàn; rúguǒ wǒ hái néng huó yì nián, wǒ yào zhuājǐn shíjiān jǐnkuài bǎ 《Shuōwén Jiězì》 diànnǎohuà.”","v":"“Nếu chỉ còn sống được 24 tiếng, mình sẽ gọi điện chào tạm biệt bạn bè; nếu còn sống được một năm, mình sẽ tranh thủ thời gian số hoá cuốn ‘Thuyết văn giải tự’ càng sớm càng tốt.”","b":0},{"s":"","z":"就这样，一部部古汉字经典进入他的资料库，仅仅复印、整理和把这些资料输入电脑就用了8年。","p":"Jiù zhèyàng, yí bùbù gǔ Hànzì jīngdiǎn jìnrù tā de zīliàokù, jǐnjǐn fùyìn, zhěnglǐ hé bǎ zhèxiē zīliào shūrù diànnǎo jiù yòngle 8 nián.","v":"Cứ như thế, từng bộ kinh điển chữ Hán cổ lần lượt đi vào kho tư liệu của ông; chỉ riêng việc photo, sắp xếp và nhập số tư liệu ấy vào máy tính đã mất tới 8 năm.","b":0},{"s":"","z":"2002年元旦，战胜疾病的他决定把自己创办的网站公开，让更多喜欢中文的人在学习汉字时，不再像他最初那样学得那么痛苦。","p":"2002 nián Yuándàn, zhànshèng jíbìng de tā juédìng bǎ zìjǐ chuàngbàn de wǎngzhàn gōngkāi, ràng gèng duō xǐhuan Zhōngwén de rén zài xuéxí Hànzì shí, bú zài xiàng tā zuìchū nàyàng xué de nàme tòngkǔ.","v":"Tết Dương lịch năm 2002, đã chiến thắng bệnh tật, ông quyết định công khai trang web do mình lập ra, để nhiều người yêu tiếng Trung hơn khi học chữ Hán không còn phải học khổ sở như ông thuở ban đầu.","b":0},{"s":"","z":"2011年，有人把他的故事放到微博上，引起了广泛关注，他也因此被网友亲切地称呼为“汉字叔叔”。","p":"2011 nián, yǒu rén bǎ tā de gùshi fàngdào Wēibó shang, yǐnqǐle guǎngfàn guānzhù, tā yě yīncǐ bèi wǎngyǒu qīnqiè de chēnghu wéi “Hànzì Shūshu”.","v":"Năm 2011, có người đăng câu chuyện của ông lên Weibo, thu hút sự quan tâm rộng rãi, nhờ đó ông được cư dân mạng trìu mến gọi là “Chú Chữ Hán”.","b":1},{"s":"","z":"打开汉字叔叔克服种种困难、花光全部积蓄创办的网站，可以看到他收集整理的近10万个汉字，包含了它们演变的全部字形，当然也包括繁体字形和简体字形，还有普通话和部分方言读音、英文释义等内容，被网友称赞为“有图有真相”。","p":"Dǎkāi Hànzì Shūshu kèfú zhǒngzhǒng kùnnan, huāguāng quánbù jīxù chuàngbàn de wǎngzhàn, kěyǐ kàndào tā shōují zhěnglǐ de jìn 10 wàn ge Hànzì, bāohánle tāmen yǎnbiàn de quánbù zìxíng, dāngrán yě bāokuò fántǐ zìxíng hé jiǎntǐ zìxíng, hái yǒu pǔtōnghuà hé bùfen fāngyán dúyīn, Yīngwén shìyì děng nèiróng, bèi wǎngyǒu chēngzàn wéi “yǒu tú yǒu zhēnxiàng”.","v":"Mở trang web mà Chú Chữ Hán đã vượt qua bao khó khăn, tiêu sạch toàn bộ tiền tiết kiệm để lập ra, có thể thấy gần 100.000 chữ Hán do ông thu thập và sắp xếp, gồm toàn bộ các tự hình trong quá trình biến đổi của chúng, dĩ nhiên có cả tự hình phồn thể lẫn giản thể, lại thêm cách đọc theo tiếng phổ thông và một số phương ngữ, phần giải nghĩa tiếng Anh…, nên được cư dân mạng khen là “có hình có sự thật”.","b":0},{"s":"","z":"更让人佩服的是，汉字叔叔将网站上的内容全部开放给网友免费下载。","p":"Gèng ràng rén pèifú de shì, Hànzì Shūshu jiāng wǎngzhàn shang de nèiróng quánbù kāifàng gěi wǎngyǒu miǎnfèi xiàzài.","v":"Điều càng khiến người ta khâm phục là Chú Chữ Hán đã mở toàn bộ nội dung trên trang web cho cư dân mạng tải xuống miễn phí.","b":0},{"s":"","z":"现在，有很多单位向理查德发出了工作邀请，而理查德选择了去北京师范大学教书，因为那里也有人在做汉字识别查询的研究。","p":"Xiànzài, yǒu hěn duō dānwèi xiàng Lǐchádé fāchūle gōngzuò yāoqǐng, ér Lǐchádé xuǎnzéle qù Běijīng Shīfàn Dàxué jiāo shū, yīnwèi nàli yě yǒu rén zài zuò Hànzì shíbié cháxún de yánjiū.","v":"Hiện nay, rất nhiều đơn vị đã gửi lời mời làm việc tới Richard, nhưng ông chọn đến Đại học Sư phạm Bắc Kinh dạy học, vì ở đó cũng có người đang nghiên cứu về nhận dạng và tra cứu chữ Hán.","b":1},{"s":"","z":"在北师大，他除了教物理，还有充分的时间继续研究他的汉字，完善他的网站。","p":"Zài Běi Shī Dà, tā chúle jiāo wùlǐ, hái yǒu chōngfèn de shíjiān jìxù yánjiū tā de Hànzì, wánshàn tā de wǎngzhàn.","v":"Ở Đại học Sư phạm Bắc Kinh, ngoài việc dạy vật lý, ông còn có nhiều thời gian để tiếp tục nghiên cứu chữ Hán và hoàn thiện trang web của mình.","b":0},{"s":"","z":"在中国，60多岁已经是退休的年纪了。","p":"Zài Zhōngguó, 60 duō suì yǐjīng shì tuìxiū de niánjì le.","v":"Ở Trung Quốc, ngoài 60 tuổi đã là tuổi nghỉ hưu rồi.","b":0},{"s":"","z":"但汉字叔叔每天的日程却安排得很满。","p":"Dàn Hànzì Shūshu měi tiān de rìchéng què ānpái de hěn mǎn.","v":"Thế nhưng lịch làm việc mỗi ngày của Chú Chữ Hán lại kín mít.","b":0},{"s":"","z":"他说：“我不会退休，我还要继续追求我的梦想，我要‘活到老，学到老’。”","p":"Tā shuō: “Wǒ bú huì tuìxiū, wǒ hái yào jìxù zhuīqiú wǒ de mèngxiǎng, wǒ yào ‘huó dào lǎo, xué dào lǎo’.”","v":"Ông nói: “Tôi sẽ không nghỉ hưu, tôi vẫn sẽ tiếp tục theo đuổi ước mơ của mình, tôi muốn ‘còn sống là còn học’.”","b":0}]}],"aud":[{"v":"audio/21-2.mp3","t":"audio/21-1.mp3"}],"gram":[{"id":"ying","t":"硬","s":"cố, khăng khăng, gắng gượng (phó từ)","b":"<b>硬</b> làm <b>phó từ</b>, đứng trước động từ, có hai nghĩa: (1) biểu thị <b>kiên quyết hoặc cố chấp</b> làm một việc gì đó (khăng khăng, nhất quyết); (2) biểu thị <b>năng lực không đủ nhưng vẫn cố hết sức</b> làm việc đó (gắng gượng, cố mà làm).","r":["Nghĩa 1 – kiên quyết/cố chấp: 硬 + động từ: 赵高把鹿<b>硬</b>说成马 (khăng khăng nói hươu là ngựa).","Nghĩa 2 – sức không đủ vẫn cố: 硬挺过来 (gắng gượng vượt qua), 硬把它喝下去 (cố uống cho hết).","Thành ngữ trong bài khoá: 死记硬背 sǐjì-yìngbèi – học thuộc lòng một cách máy móc."],"e":[["在中国历史故事“指鹿为马”中，赵高把鹿硬说成马。","Zài Zhōngguó lìshǐ gùshi “zhǐ lù wéi mǎ” zhōng, Zhào Gāo bǎ lù yìng shuōchéng mǎ.","Trong điển tích lịch sử Trung Quốc “chỉ hươu bảo ngựa”, Triệu Cao khăng khăng nói con hươu là con ngựa."],["……但是他感觉汉字很复杂，汉字的一笔一画没有任何逻辑，只能死记硬背。","……dànshì tā gǎnjué Hànzì hěn fùzá, Hànzì de yì bǐ yí huà méiyǒu rènhé luójí, zhǐ néng sǐjì-yìngbèi.","…nhưng anh thấy chữ Hán quá phức tạp, từng nét chẳng theo lô-gích nào, chỉ có thể học thuộc lòng một cách máy móc. <i>(bài khoá)</i>"],["你不知道这一年我是怎么硬挺过来的。","Nǐ bù zhīdào zhè yì nián wǒ shì zěnme yìng tǐng guolai de.","Cậu không biết một năm qua tôi đã gắng gượng vượt qua thế nào đâu."],["虽然中药汤有点儿苦，但为了治病，他还是硬把它喝下去了。","Suīrán zhōngyàotāng yǒudiǎnr kǔ, dàn wèile zhì bìng, tā háishi yìng bǎ tā hē xiaqu le.","Thuốc bắc tuy hơi đắng, nhưng để chữa bệnh, anh ấy vẫn cố uống cạn."]],"d":[["在中国历史故事“指鹿为马”中，赵高把鹿____说成马。","硬"],["你不知道这一年我是怎么____挺过来的。","硬"],["虽然中药汤有点儿苦，但为了治病，他还是____把它喝下去了。","硬"]],"w":"硬 vốn là tính từ “cứng”; khi đứng trước động từ thì là phó từ mang nghĩa “cố, khăng khăng”, thường hàm ý trái ý người khác hoặc vượt quá sức mình."},{"id":"ouran","t":"偶然","s":"tình cờ, ngẫu nhiên (tính từ); thỉnh thoảng (phó từ)","b":"<b>偶然</b> là <b>tính từ</b>, biểu thị sự việc xảy ra <b>ngoài dự liệu</b>, hoặc xét theo quy luật thông thường thì <b>không thể xảy ra</b> (tình cờ, ngẫu nhiên). <b>偶然</b> cũng có thể làm <b>phó từ</b>, nghĩa là “偶尔，有时候” (thỉnh thoảng, đôi khi).","r":["Tính từ: 偶然的机会 (cơ hội tình cờ); có thể làm định ngữ.","Phó từ = 偶尔/有时候, đứng trước động từ, hay đi với 也会: 偶然也会抬眼看一下…, 偶然也会在我梦中出现."],"e":[["一个偶然的机会，他发现如果了解汉字的来源和演变过程，再学习它就变得轻松、容易。","Yí ge ǒurán de jīhuì, tā fāxiàn rúguǒ liǎojiě Hànzì de láiyuán hé yǎnbiàn guòchéng, zài xuéxí tā jiù biàn de qīngsōng, róngyì.","Một lần tình cờ, anh phát hiện ra rằng nếu hiểu được nguồn gốc và quá trình biến đổi của chữ Hán thì việc học nó sẽ trở nên nhẹ nhàng, dễ dàng hơn. <i>(bài khoá)</i>"],["虽然桂花偶然也能长成18米高的大树，但是绝大多数情况下它们都很矮。","Suīrán guìhuā ǒurán yě néng zhǎngchéng 18 mǐ gāo de dà shù, dànshì jué dà duōshù qíngkuàng xià tāmen dōu hěn ǎi.","Tuy cây hoa quế đôi khi cũng có thể mọc thành cây lớn cao 18 mét, nhưng trong đại đa số trường hợp chúng đều rất thấp."],["她专心地织着毛衣，偶然也会抬眼看一下墙上的挂钟。","Tā zhuānxīn de zhīzhe máoyī, ǒurán yě huì tái yǎn kàn yíxià qiáng shang de guàzhōng.","Cô ấy chăm chú đan áo len, thỉnh thoảng lại ngước mắt nhìn chiếc đồng hồ treo tường."],["那些我生活过的地方，偶然也会在我梦中出现，但都不是我的“家”！","Nàxiē wǒ shēnghuóguo de dìfang, ǒurán yě huì zài wǒ mèng zhōng chūxiàn, dàn dōu bú shì wǒ de “jiā”!","Những nơi tôi từng sống thỉnh thoảng cũng hiện về trong giấc mơ, nhưng chẳng nơi nào là “nhà” của tôi cả!"]],"d":[["一个____的机会，他发现如果了解汉字的来源和演变过程，再学习它就变得轻松、容易。","偶然"],["和刘峰在上海的那次碰面非常____。","偶然"],["李阳的父亲是一位画家，所以，李阳喜欢画画儿并非____。","偶然"]],"w":"Khi là phó từ, 偶然 gần nghĩa với 偶尔 — xem thẻ phân biệt 偶然 vs 偶尔."},{"id":"jinkuai","t":"尽快","s":"càng sớm càng tốt (phó từ)","b":"<b>尽快</b> là <b>phó từ</b>, nghĩa là cố gắng hết mức để làm nhanh hơn (尽量加快), đứng trước động từ hoặc trước cụm 把…: 尽快把…电脑化, 尽快商量一下.","r":["Cấu trúc: 尽快 + động từ / 尽快 + 把 + tân ngữ + động từ.","Thường dùng trong câu cầu khiến, dặn dò hoặc nói về dự định của bản thân: 你尽快…, 我要尽快…","Hay đi kèm 抓紧时间: 抓紧时间尽快…"],"e":[["……我要抓紧时间尽快把《说文解字》电脑化。","……wǒ yào zhuājǐn shíjiān jǐnkuài bǎ 《Shuōwén Jiězì》 diànnǎohuà.","…mình sẽ tranh thủ thời gian số hoá cuốn “Thuyết văn giải tự” càng sớm càng tốt. <i>(bài khoá)</i>"],["新产品出了点儿问题，你和严经理尽快商量一下这事。","Xīn chǎnpǐn chūle diǎnr wèntí, nǐ hé Yán jīnglǐ jǐnkuài shāngliang yíxià zhè shì.","Sản phẩm mới có chút vấn đề, cậu và giám đốc Nghiêm bàn bạc chuyện này càng sớm càng tốt nhé."],["趁这两天天气好，你尽快把过季的衣服洗一洗，收起来。","Chèn zhè liǎng tiān tiānqì hǎo, nǐ jǐnkuài bǎ guò jì de yīfu xǐ yi xǐ, shōu qilai.","Nhân mấy hôm nay trời đẹp, con mau giặt hết quần áo trái mùa rồi cất đi."]],"d":[["我要抓紧时间____把《说文解字》电脑化。","尽快"],["新产品出了点儿问题，你和严经理____商量一下这事。","尽快"],["趁这两天天气好，你____把过季的衣服洗一洗，收起来。","尽快"]],"w":"练习2③ của sách cho chọn 尽快/赶快: 什么？小明受伤了，那____送医院呀！— đáp án (người soạn giải) là 赶快: 赶快 nhấn mạnh làm ngay lập tức vì tình huống gấp, hay dùng trong câu cảm thán/thúc giục; 尽快 là “càng sớm càng tốt” trong khả năng cho phép."},{"id":"ouran_ouer","t":"偶然 vs 偶尔","s":"tình cờ – thỉnh thoảng","b":"<b>Giống nhau:</b> đều có thể là <b>phó từ</b>, đều mang nghĩa “không thường xuyên”, đôi khi thay thế cho nhau được nhưng nghĩa hơi khác. Ví dụ: 在校园里，我偶然/偶尔也会碰到李艳。","r":["<b>偶然</b> nhấn mạnh tính <b>đột ngột, không ngờ tới</b>, đối lập với “必然” (tất nhiên): 这本书是她一次逛书市时偶然发现的。","<b>偶尔</b> nhấn mạnh <b>số lần ít</b>, đối lập với “经常” (thường xuyên): 我平时加班不多，月底偶尔有一两天。","<b>偶然</b> còn có thể biểu thị sự việc xảy ra ngoài dự liệu, hoặc theo quy luật thông thường thì không thể xảy ra; có thể làm <b>định ngữ, vị ngữ</b>, phía trước có thể thêm <b>phó từ chỉ mức độ</b> (很偶然, 非常偶然): 李阳喜欢画画儿并非偶然。","<b>偶尔</b> còn có thể là <b>từ chỉ thuộc tính</b> (属性词), <b>chỉ làm định ngữ</b>, phía trước không thêm phó từ chỉ mức độ, cũng không làm vị ngữ; cách dùng này không phổ biến: 偶尔的聚会."],"e":[["在校园里，我偶然/偶尔也会碰到李艳。","Zài xiàoyuán li, wǒ ǒurán/ǒu'ěr yě huì pèngdào Lǐ Yàn.","Trong khuôn viên trường, thỉnh thoảng tôi cũng tình cờ gặp Lý Diễm."],["这本书是她一次逛书市时偶然发现的。","Zhè běn shū shì tā yí cì guàng shūshì shí ǒurán fāxiàn de.","Cuốn sách này là cô ấy tình cờ phát hiện ra trong một lần đi dạo hội sách."],["我平时加班不多，月底偶尔有一两天。","Wǒ píngshí jiā bān bù duō, yuèdǐ ǒu'ěr yǒu yì liǎng tiān.","Bình thường tôi ít khi tăng ca, thỉnh thoảng cuối tháng có một hai hôm."],["李阳的父亲是一位画家，所以，李阳喜欢画画儿并非偶然。","Lǐ Yáng de fùqin shì yí wèi huàjiā, suǒyǐ, Lǐ Yáng xǐhuan huà huàr bìngfēi ǒurán.","Bố của Lý Dương là họa sĩ, vì vậy việc Lý Dương thích vẽ tranh không phải chuyện ngẫu nhiên."],["他在农村的生活很单调，偶尔的聚会还是在村里的老房子里举行，很无聊。","Tā zài nóngcūn de shēnghuó hěn dāndiào, ǒu'ěr de jùhuì hái shì zài cūn li de lǎo fángzi li jǔxíng, hěn wúliáo.","Cuộc sống của anh ấy ở nông thôn rất đơn điệu, những buổi tụ tập thỉnh thoảng mới có cũng chỉ tổ chức trong ngôi nhà cũ ở làng, rất buồn tẻ."]],"d":[["和刘峰在上海的那次碰面非常____。","偶然"],["在昨天的训练中，他很____地和队友撞在了一起，受了伤。","偶然"],["她们多半会到丽丽家玩儿，____也会去吃饭看电影。","偶尔"],["大家都安静地吃着，只听到筷子碰到碗边儿的声音和____的几声咳嗽。","偶尔"]],"w":"Có 很/非常 phía trước hoặc làm vị ngữ (并非偶然) → chỉ dùng 偶然. Muốn nói “ít khi, thỉnh thoảng” (đối lập với 经常) → 偶尔."}],"ext":[["哲学","zhéxué","triết học"],["化学","huàxué","hóa học"],["物理","wùlǐ","vật lý"],["政治","zhèngzhì","chính trị"],["粘贴","zhāntiē","dán (paste)"],["复制","fùzhì","sao chép (copy)"],["浏览","liúlǎn","duyệt, xem lướt"],["删除","shānchú","xóa"],["搜索","sōusuǒ","tìm kiếm"],["文件","wénjiàn","tệp, văn bản"]],"extt":"学科、电脑","notes":"Nguồn cuối bài khoá: 改编自《中国电视报》，作者：孙莲莲. Bài khoá 657 chữ (theo sách), tr.30–32 (B031–B033), 6 đoạn văn trong sách, chia thành 3 phần: đoạn 1–2 (từ 1–19, 专名1–2) / đoạn 3–4, gồm cả câu “更让人佩服的是……免费下载。” đầu tr.32 vốn nối tiếp đoạn 4 (từ 20–32) / đoạn 5–6 (từ 33–41, 专名3). Từ có dấu * (ngoài đề cương): 1, 5, 15, 16, 20, 23, 25, 26, 27, 29, 34, 35. Dưới từ 3 (硬) sách có mục phụ không đánh số: 死记硬背 sǐjì-yìngbèi – học thuộc lòng một cách máy móc (không tính thành từ riêng). Từ 25, 26 sách in “繁体（字）”, “简体（字）” nên câu ví dụ chứa 繁体/简体 (繁体字形, 简体字形) chứ không chứa nguyên dạng có ngoặc. Pinyin 抓紧 “zhuā jǐn”, 退休 “tuì xiū” chép đúng cách viết có dấu cách của sách. Lời thoại trong đoạn 2 tách thành 2 dòng tại dấu ngoặc kép đóng; câu “打开汉字叔叔……有图有真相”。” rất dài nhưng không có ；nên giữ nguyên một dòng. Phần 注释 gồm 3 mục 词语例释 (硬, 偶然, 尽快) và 1 词语辨析 (偶然—偶尔); (二) 词语搭配 có bảng: 收集/克服/追求 + tân ngữ, 完善的/公开的 + danh từ, 暗暗地/深深地/打心里 + 佩服, 认真/反复… + 思考, 日程 + 确定/紧/满/松, 梦想 + 实现/（被）打破. Drill 偶然 vs 偶尔 lấy từ 做一做 (câu (1) sách đã cho đáp án 偶然; câu (2)–(4) đáp án do người soạn giải). Drill 硬/偶然/尽快 đặt dựa trên câu ví dụ của sách vì 练一练 là bài hoàn thành câu mở. Đáp án 练习1 (người soạn giải): ①克服 ②公开 ③收集 ④抓紧 ⑤佩服 ⑥追求; vocab_ex của 克服 lấy từ 练习1①; của 硬, 尽快 lấy từ phần 注释; còn lại trích câu/vế câu trong bài khoá. Bảng 扩展 có 2 chủ đề (学科, 电脑), sách chỉ có chữ Hán + pinyin, nghĩa tiếng Việt do người soạn bổ sung.","order":[{"z":"那时，他开始思考自己的人生，“我该怎么办？","t":["那时","他","开始","思考","自己","的","人生","我该","怎么办"],"v":"Lúc đó, ông bắt đầu suy ngẫm về cuộc đời mình: “Mình nên làm sao đây? Mình nên làm gì đây?”"},{"z":"我该做什么？","t":["我","该","做","什么"],"v":"Lúc đó, ông bắt đầu suy ngẫm về cuộc đời mình: “Mình nên làm sao đây? Mình nên làm gì đây?”"},{"z":"在中国，60多岁已经是退休的年纪了。","t":["在","中国","60","多岁","已经","是","退休","的","年纪","了"],"v":"Ở Trung Quốc, ngoài 60 tuổi đã là tuổi nghỉ hưu rồi."},{"z":"但汉字叔叔每天的日程却安排得很满。","t":["但","汉字","叔叔","每天","的","日程","却","安排","得","很","满"],"v":"Thế nhưng lịch làm việc mỗi ngày của Chú Chữ Hán lại kín mít."},{"z":"在中国历史故事“指鹿为马”中，赵高把鹿硬说成马。","t":["在","中国","历史","故事","指鹿为马","中","赵高","把","鹿","硬","说","成马"],"v":"Trong điển tích lịch sử Trung Quốc “chỉ hươu ":"dt.","x":1,"ez":"另外还要承认人性中一些先天的不完美。","ev":"Ngoài ra còn phải thừa nhận một vài điểm không hoàn hảo bẩm sinh trong bản tính con người. <i>(bài khoá)</i>"},{"h":"完美","p":"wánměi","v":"hoàn hảo, hoàn mỹ","k":"tt.","x":0,"ez":"另外还要承认人性中一些先天的不完美。","ev":"Ngoài ra còn phải thừa nhận một vài điểm không hoàn hảo bẩm sinh trong bản tính con người. <i>(bài khoá)</i>"},{"h":"难免","p":"nánmiǎn","v":"khó tránh","k":"tt.","x":0,"ez":"朋友间难免会产生矛盾、误会甚至是伤害。","ev":"Giữa bạn bè với nhau khó tránh khỏi nảy sinh mâu thuẫn, hiểu lầm, thậm chí là tổn thương."},{"h":"疼爱","p":"téng'ài","v":"thương yêu","k":"đgt.","x":0,"ez":"在自己的亲生女儿和不是亲生的灰姑娘之间，难免会更疼爱自己亲生的女儿。","ev":"Giữa con gái ruột của mình và Lọ Lem không phải con đẻ, khó tránh khỏi việc thương con ruột hơn. <i>(bài khoá)</i>"},{"h":"平等","p":"píngděng","v":"bình đẳng, công bằng","k":"tt.","x":0,"ez":"法律面前人人平等。","ev":"Mọi người đều bình đẳng trước pháp luật."},{"h":"自私","p":"zìsī","v":"ích kỷ","k":"tt.","x":0,"ez":"可能你觉得继母很自私，但这种行为有自然倾向的理由，与道德没有必然的关系。","ev":"Có thể bạn thấy bà mẹ kế rất ích kỷ, nhưng hành vi này có lý do từ khuynh hướng tự nhiên, không có quan hệ tất yếu với đạo đức. <i>(bài khoá)</i>"},{"h":"倾向","p":"qīngxiàng","v":"nghiêng về; khuynh hướng","k":"đgt./dt.","x":1,"ez":"可能你觉得继母很自私，但这种行为有自然倾向的理由，与道德没有必然的关系。","ev":"Có thể bạn thấy bà mẹ kế rất ích kỷ, nhưng hành vi này có lý do từ khuynh hướng tự nhiên, không có quan hệ tất yếu với đạo đức. <i>(bài khoá)</i>"},{"h":"理由","p":"lǐyóu","v":"lý do","k":"dt.","x":0,"ez":"希望你能给我一个好的理由，解释清楚你为什么这么做。","ev":"Mong anh có thể cho tôi một lý do thỏa đáng, giải thích rõ vì sao anh làm như vậy."},{"h":"道德","p":"dàodé","v":"đạo đức","k":"dt.","x":0,"ez":"可能你觉得继母很自私，但这种行为有自然倾向的理由，与道德没有必然的关系。","ev":"Có thể bạn thấy bà mẹ kế rất ích kỷ, nhưng hành vi này có lý do từ khuynh hướng tự nhiên, không có quan hệ tất yếu với đạo đức. <i>(bài khoá)</i>"},{"h":"自从","p":"zìcóng","v":"từ lúc","k":"giới.","x":0,"ez":"自从我听说了这件事，就开始思考应该如何阅读，除了阅读还应该做什么。","ev":"Từ khi nghe chuyện này, tôi bắt đầu suy nghĩ nên đọc sách như thế nào, và ngoài đọc ra thì còn nên làm gì nữa. <i>(bài khoá)</i>"},{"h":"童话","p":"tónghuà","v":"truyện hư cấu","k":"dt.","x":1,"ez":"你看这个老师在讲童话的时候，已经在有意识地把这种情感影响，甚至把人性的价值判断，都给了孩子们。","ev":"Bạn xem, khi kể truyện cổ tích, người thầy ấy đã có ý thức trao cho bọn trẻ sự ảnh hưởng về tình cảm ấy, thậm chí cả những phán đoán giá trị về nhân tính. <i>(bài khoá)</i>"},{"h":"价值","p":"jiàzhí","v":"giá trị","k":"dt.","x":0,"ez":"你的这个建议很有价值，我马上告诉总裁。","ev":"Đề xuất này của bạn rất có giá trị, tôi sẽ báo ngay với tổng giám đốc."},{"h":"单纯","p":"dānchún","v":"đơn thuần, đơn giản, chỉ","k":"tt.","x":0,"ez":"他太单纯了，这样很容易被人骗。","ev":"Anh ấy ngây thơ quá, như vậy rất dễ bị người ta lừa."},{"h":"主张","p":"zhǔzhāng","v":"cho là, tán thành; chủ trương","k":"đgt./dt.","x":0,"ez":"他主张将会议地点改在上海，因为这次的合作伙伴对我们来说非常重要。","ev":"Anh ấy chủ trương chuyển địa điểm họp sang Thượng Hải, vì đối tác lần này rất quan trọng với chúng ta."},{"h":"知感","p":"zhīgǎn","v":"tri giác","k":"dt.","x":1,"ez":"所谓“知感”就是别人告诉你、说给你听、要求你记住的那一部分。","ev":"Cái gọi là “tri giác” chính là phần mà người khác bảo bạn, nói cho bạn nghe, yêu cầu bạn ghi nhớ. <i>(bài khoá)</i>"}]],"texts":[{"no":1,"tz":"","tv":"","lines":[{"s":"","z":"很多家长可能过分强调阅读的作用，觉得多读书就能够把作文写得特别好。","p":"Hěn duō jiāzhǎng kěnéng guòfèn qiángdiào yuèdú de zuòyòng, juéde duō dú shū jiù nénggòu bǎ zuòwén xiě de tèbié hǎo.","v":"Nhiều phụ huynh có lẽ quá đề cao vai trò của việc đọc, cho rằng cứ đọc nhiều sách là có thể viết văn thật hay.","b":0},{"s":"","z":"这个观点是不客观、不全面的，我们需要转变自己的观念。","p":"Zhège guāndiǎn shì bú kèguān, bù quánmiàn de, wǒmen xūyào zhuǎnbiàn zìjǐ de guānniàn.","v":"Quan điểm này không khách quan, không toàn diện; chúng ta cần thay đổi quan niệm của mình.","b":0},{"s":"","z":"我曾经听一位美国的小学老师说，他们十分重视和学生一起讨论问题。","p":"Wǒ céngjīng tīng yí wèi Měiguó de xiǎoxué lǎoshī shuō, tāmen shífēn zhòngshì hé xuésheng yìqǐ tǎolùn wèntí.","v":"Tôi từng nghe một thầy giáo tiểu học người Mỹ kể rằng họ rất coi trọng việc cùng học sinh thảo luận các vấn đề.","b":0},{"s":"","z":"比如，他们讨论过《卖火柴的小女孩儿》是写给谁看的，还讨论过灰姑娘的故事。","p":"Bǐrú, tāmen tǎolùn guo《Mài Huǒchái de Xiǎo Nǚháir》shì xiě gěi shéi kàn de, hái tǎolùn guo Huīgūniang de gùshi.","v":"Chẳng hạn, họ đã thảo luận xem truyện “Cô bé bán diêm” được viết cho ai đọc, rồi còn thảo luận về câu chuyện Cô bé Lọ Lem.","b":0},{"s":"","z":"老师讲完故事之后，问同学们：灰姑娘一旦进了这个王宫，成为王子的心上人，她的梦想实现了，一切幸福都属于她之后，这时她应该怎样对待她的继母，应该怎样对待她的两个姐姐？","p":"Lǎoshī jiǎngwán gùshi zhīhòu, wèn tóngxuémen: Huīgūniang yídàn jìnle zhège wánggōng, chéngwéi wángzǐ de xīnshàngrén, tā de mèngxiǎng shíxiàn le, yíqiè xìngfú dōu shǔyú tā zhīhòu, zhè shí tā yīnggāi zěnyàng duìdài tā de jìmǔ, yīnggāi zěnyàng duìdài tā de liǎng ge jiějie?","v":"Kể xong câu chuyện, thầy hỏi cả lớp: một khi Lọ Lem đã bước vào hoàng cung, trở thành người trong lòng của hoàng tử, ước mơ đã thành hiện thực và mọi hạnh phúc đều thuộc về cô, thì lúc ấy cô nên đối xử với mẹ kế thế nào, nên đối xử với hai người chị ra sao?","b":0},{"s":"","z":"为什么要讨论这个问题呢？","p":"Wèi shénme yào tǎolùn zhège wèntí ne?","v":"Vì sao lại phải thảo luận vấn đề này?","b":1},{"s":"","z":"因为这是一种情感交换。","p":"Yīnwèi zhè shì yì zhǒng qínggǎn jiāohuàn.","v":"Bởi vì đây là một sự trao đổi về tình cảm.","b":0},{"s":"","z":"老师和学生通过讨论得出的结论是：一个已经拥有巨大幸福的人，应该原谅和理解那些伤害过自己的人。","p":"Lǎoshī hé xuésheng tōngguò tǎolùn déchū de jiélùn shì: yí ge yǐjīng yōngyǒu jùdà xìngfú de rén, yīnggāi yuánliàng hé lǐjiě nàxiē shānghài guo zìjǐ de rén.","v":"Kết luận mà thầy và trò rút ra qua thảo luận là: một người đã có được hạnh phúc to lớn thì nên tha thứ và thấu hiểu cho những người từng làm tổn thương mình.","b":0},{"s":"","z":"另外还要承认人性中一些先天的不完美，就是说作为一个母亲，在自己的亲生女儿和不是亲生的灰姑娘之间，难免会更疼爱自己亲生的女儿，很难完全平等地对待她们。","p":"Lìngwài hái yào chéngrèn rénxìng zhōng yìxiē xiāntiān de bù wánměi, jiùshì shuō zuòwéi yí ge mǔqīn, zài zìjǐ de qīnshēng nǚ'ér hé bú shì qīnshēng de Huīgūniang zhījiān, nánmiǎn huì gèng téng'ài zìjǐ qīnshēng de nǚ'ér, hěn nán wánquán píngděng de duìdài tāmen.","v":"Ngoài ra còn phải thừa nhận một vài điểm không hoàn hảo bẩm sinh trong bản tính con người, nghĩa là, đã là một người mẹ, giữa con gái ruột của mình và Lọ Lem không phải con đẻ, khó tránh khỏi việc thương con ruột hơn, rất khó đối xử với hai bên hoàn toàn bình đẳng.","b":0},{"s":"","z":"可能你觉得继母很自私，但这种行为有自然倾向的理由，与道德没有必然的关系。","p":"Kěnéng nǐ juéde jìmǔ hěn zìsī, dàn zhè zhǒng xíngwéi yǒu zìrán qīngxiàng de lǐyóu, yǔ dàodé méiyǒu bìrán de guānxi.","v":"Có thể bạn thấy bà mẹ kế rất ích kỷ, nhưng hành vi này có lý do từ khuynh hướng tự nhiên, không có quan hệ tất yếu với đạo đức.","b":0},{"s":"","z":"自从我听说了这件事，就开始思考应该如何阅读，除了阅读还应该做什么。","p":"Zìcóng wǒ tīngshuōle zhè jiàn shì, jiù kāishǐ sīkǎo yīnggāi rúhé yuèdú, chúle yuèdú hái yīnggāi zuò shénme.","v":"Từ khi nghe chuyện này, tôi bắt đầu suy nghĩ nên đọc sách như thế nào, và ngoài đọc ra thì còn nên làm gì nữa.","b":1},{"s":"","z":"你看这个老师在讲童话的时候，已经在有意识地把这种情感影响，甚至把人性的价值判断，都给了孩子们。","p":"Nǐ kàn zhège lǎoshī zài jiǎng tónghuà de shíhou, yǐjīng zài yǒu yìshí de bǎ zhè zhǒng qínggǎn yǐngxiǎng, shènzhì bǎ rénxìng de jiàzhí pànduàn, dōu gěile háizimen.","v":"Bạn xem, khi kể truyện cổ tích, người thầy ấy đã có ý thức trao cho bọn trẻ sự ảnh hưởng về tình cảm ấy, thậm chí cả những phán đoán giá trị về nhân tính.","b":0},{"s":"","z":"如果只是单纯地主张阅读而不强调思考，那是片面的。","p":"Rúguǒ zhǐshì dānchún de zhǔzhāng yuèdú ér bù qiángdiào sīkǎo, nà shì piànmiàn de.","v":"Nếu chỉ đơn thuần chủ trương đọc mà không nhấn mạnh việc suy nghĩ thì đó là phiến diện.","b":0},{"s":"","z":"“知识”两个字我始终认为它是要分开来谈的，“知”就是知感，“识”就是认识。","p":"“Zhīshi” liǎng ge zì wǒ shǐzhōng rènwéi tā shì yào fēnkāi lái tán de, “zhī” jiù shì zhīgǎn, “shí” jiù shì rènshi.","v":"Hai chữ “知识” (tri thức), tôi trước sau vẫn cho rằng phải tách ra mà bàn: “知” là tri giác, “识” là nhận thức.","b":0},{"s":"","z":"所谓“知感”就是别人告诉你、说给你听、要求你记住的那一部分。","p":"Suǒwèi “zhīgǎn” jiù shì biérén gàosu nǐ, shuō gěi nǐ tīng, yāoqiú nǐ jìzhù de nà yí bùfen.","v":"Cái gọi là “tri giác” chính là phần mà người khác bảo bạn, nói cho bạn nghe, yêu cầu bạn ghi nhớ.","b":0},{"s":"","z":"但只有这一部分是不够的，还要有认识、思考。","p":"Dàn zhǐyǒu zhè yí bùfen shì bú gòu de, hái yào yǒu rènshi, sīkǎo.","v":"Nhưng chỉ có phần này thì chưa đủ, còn phải có nhận thức và suy nghĩ.","b":0}]}],"aud":[{"v":"audio/22-2.mp3","t":"audio/22-1.mp3"}],"gram":[{"id":"yidan","t":"一旦","s":"một khi (phó từ)","b":"<b>一旦</b> là <b>phó từ</b>, biểu thị <b>một thời điểm không xác định</b>, một ngày nào đó bất chợt đến, hoặc <b>giả sử có một ngày như thế</b>. Thường đứng ở vế trước, sau chủ ngữ và trước động từ; vế sau nêu kết quả/hệ quả, hay có 就 đi kèm.","r":["Cấu trúc: (Chủ ngữ +) 一旦 + động từ/sự việc, (chủ ngữ +) 就 + kết quả: 女人一旦做了母亲，就变得矛盾了。","Có thể nêu một giả thiết: 一旦有人闯入这个空间，我们就会感觉不舒服。","Vế sau cũng có thể là câu hỏi về cách ứng xử khi sự việc xảy ra: 灰姑娘一旦进了这个王宫，……应该怎样对待她的继母？"],"e":[["长大后，我终于明白了这个道理：女人一旦做了母亲，就变得矛盾了。","Zhǎngdà hòu, wǒ zhōngyú míngbaile zhège dàoli: nǚrén yídàn zuòle mǔqīn, jiù biàn de máodùn le.","Lớn lên rồi, tôi mới hiểu ra đạo lý này: người phụ nữ một khi đã làm mẹ thì sẽ trở nên đầy mâu thuẫn."],["灰姑娘一旦进了这个王宫，……应该怎样对待她的继母，应该怎样对待她的两个姐姐？","Huīgūniang yídàn jìnle zhège wánggōng, …… yīnggāi zěnyàng duìdài tā de jìmǔ, yīnggāi zěnyàng duìdài tā de liǎng ge jiějie?","Một khi Lọ Lem đã bước vào hoàng cung, … cô nên đối xử với mẹ kế thế nào, nên đối xử với hai người chị ra sao? <i>(bài khoá)</i>"],["所谓私人空间，是指我们身体周围的一定的空间，一旦有人闯入这个空间，我们就会感觉不舒服，不自在。","Suǒwèi sīrén kōngjiān, shì zhǐ wǒmen shēntǐ zhōuwéi de yídìng de kōngjiān, yídàn yǒu rén chuǎngrù zhège kōngjiān, wǒmen jiù huì gǎnjué bù shūfu, bú zìzai.","Cái gọi là không gian riêng là một khoảng không gian nhất định quanh cơ thể chúng ta; một khi có người xông vào khoảng không gian đó, chúng ta sẽ cảm thấy khó chịu, không thoải mái."]],"d":[["长大后，我终于明白了这个道理：女人____做了母亲，就变得矛盾了。","一旦"],["____有人闯入这个空间，我们就会感觉不舒服，不自在。","一旦"],["天冷了，多穿点儿，____感冒了就麻烦了。","一旦"]],"w":"一旦 dùng cho sự việc chưa xác định hoặc mang tính giả thiết, vế sau là hệ quả (thường có 就). Chú ý chữ 旦 (dàn), đừng viết nhầm thành 但."},{"id":"nanmian","t":"难免","s":"khó tránh, khó tránh khỏi (tính từ)","b":"<b>难免</b> là <b>tính từ</b>, nghĩa là <b>không dễ tránh được, không tránh khỏi</b>. Có thể làm vị ngữ (thường trong khung 是……的) hoặc đứng trước động từ, hay đi kèm 会.","r":["Làm vị ngữ: Chủ ngữ + 是难免的: 这样的错误是难免的。","Đứng trước động từ: 难免 + 会 + động từ: 朋友间难免会产生矛盾。","Thường dùng để thừa nhận một điều không hay nhưng khó tránh, giọng điệu cảm thông, nhẹ nhàng."],"e":[["刚开始工作，这样的错误是难免的。","Gāng kāishǐ gōngzuò, zhèyàng de cuòwù shì nánmiǎn de.","Mới bắt đầu đi làm thì những lỗi như thế này là khó tránh khỏi."],["朋友间难免会产生矛盾、误会甚至是伤害。","Péngyou jiān nánmiǎn huì chǎnshēng máodùn, wùhuì shènzhì shì shānghài.","Giữa bạn bè với nhau khó tránh khỏi nảy sinh mâu thuẫn, hiểu lầm, thậm chí là tổn thương."],["……作为一个母亲，在自己的亲生女儿和不是亲生的灰姑娘之间，难免会更疼爱自己亲生的女儿，很难完全平等地对待她们。","…… zuòwéi yí ge mǔqīn, zài zìjǐ de qīnshēng nǚ'ér hé bú shì qīnshēng de Huīgūniang zhījiān, nánmiǎn huì gèng téng'ài zìjǐ qīnshēng de nǚ'ér, hěn nán wánquán píngděng de duìdài tāmen.","… đã là một người mẹ, giữa con gái ruột của mình và Lọ Lem không phải con đẻ, khó tránh khỏi việc thương con ruột hơn, rất khó đối xử với hai bên hoàn toàn bình đẳng. <i>(bài khoá)</i>"]],"d":[["刚开始工作，这样的错误是____的。","难免"],["朋友间____会产生矛盾、误会甚至是伤害。","难免"],["马上就要考试了，觉得紧张是____的。","难免"]],"w":"难免 là tính từ nên có thể đứng sau 是 làm vị ngữ (是难免的), khác với các phó từ chỉ đứng trước động từ."},{"id":"zicong","t":"自从","s":"từ khi, từ lúc (giới từ)","b":"<b>自从</b> là <b>giới từ</b>, biểu thị <b>bắt đầu từ một thời điểm nào đó trong quá khứ</b>. Cụm 自从 thường đứng đầu câu, phía sau hay có 后/之后/以后; vế sau nêu tình hình kéo dài từ đó đến nay, thường có 就.","r":["Cấu trúc: 自从 + mốc thời gian/sự việc trong quá khứ (+ 后/之后/以后)，(chủ ngữ +) 就/都……","Mốc phía sau 自从 phải là chuyện <b>đã xảy ra</b>: 自从我听说了这件事……","Lỗi hay gặp: ✗ 自从明天开始，我每天跑步。 → ✓ 从明天开始，我每天跑步。 (tương lai không dùng 自从)"],"e":[["自从城市出现后，它就成为人类生活的中心。","Zìcóng chéngshì chūxiàn hòu, tā jiù chéngwéi rénlèi shēnghuó de zhōngxīn.","Từ khi thành phố xuất hiện, nó đã trở thành trung tâm của đời sống loài người."],["自从有了长大后成为作家这个理想之后，他每天都坚持写作。","Zìcóng yǒule zhǎngdà hòu chéngwéi zuòjiā zhège lǐxiǎng zhīhòu, tā měi tiān dōu jiānchí xiězuò.","Từ khi có ước mơ lớn lên sẽ trở thành nhà văn, ngày nào cậu ấy cũng kiên trì viết."],["自从我听说了这件事，就开始思考应该如何阅读，除了阅读还应该做什么。","Zìcóng wǒ tīngshuōle zhè jiàn shì, jiù kāishǐ sīkǎo yīnggāi rúhé yuèdú, chúle yuèdú hái yīnggāi zuò shénme.","Từ khi nghe chuyện này, tôi bắt đầu suy nghĩ nên đọc sách như thế nào, và ngoài đọc ra thì còn nên làm gì nữa. <i>(bài khoá)</i>"]],"d":[["____城市出现后，它就成为人类生活的中心。","自从"],["____我听说了这件事，就开始思考应该如何阅读。","自从"],["____我来中国以后，我的观念就转变了。","自从"]],"w":"自从 chỉ dùng với mốc trong quá khứ; nói về tương lai thì dùng 从 (从明天开始)."},{"id":"pingdeng_gongping","t":"平等 vs 公平","s":"bình đẳng – công bằng","b":"<b>平等</b> và <b>公平</b> đều là <b>tính từ</b>, nghĩa gần nhau, đôi khi có thể thay thế cho nhau. Ví dụ: 作为一个母亲，在自己的亲生女儿和不是亲生的灰姑娘之间，难免会更疼爱自己亲生的女儿，很难完全平等/公平地对待她们。","r":["<b>平等</b> nhấn mạnh <b>quyền lợi hoặc đãi ngộ</b> mà người với người nhận được trong xã hội là như nhau: 法律面前人人平等。","<b>公平</b> nhấn mạnh <b>xử lý sự việc hợp tình hợp lý, không thiên về một phía</b>: 我们应当公平竞争。","<b>平等</b> thường dùng cho tình huống <b>phổ biến, chung chung</b>: 现实社会中，女人与男人有时并不平等。","<b>公平</b> có thể dùng cho <b>người hoặc việc cụ thể</b>: 我认为公司对这次事情的处理不够公平。"],"e":[["作为一个母亲，在自己的亲生女儿和不是亲生的灰姑娘之间，难免会更疼爱自己亲生的女儿，很难完全平等/公平地对待她们。","Zuòwéi yí ge mǔqīn, zài zìjǐ de qīnshēng nǚ'ér hé bú shì qīnshēng de Huīgūniang zhījiān, nánmiǎn huì gèng téng'ài zìjǐ qīnshēng de nǚ'ér, hěn nán wánquán píngděng/gōngpíng de duìdài tāmen.","Đã là một người mẹ, giữa con gái ruột của mình và Lọ Lem không phải con đẻ, khó tránh khỏi việc thương con ruột hơn, rất khó đối xử hoàn toàn bình đẳng/công bằng với hai bên. <i>(bài khoá)</i>"],["法律面前人人平等。","Fǎlǜ miànqián rénrén píngděng.","Mọi người đều bình đẳng trước pháp luật."],["我们应当公平竞争。","Wǒmen yīngdāng gōngpíng jìngzhēng.","Chúng ta nên cạnh tranh công bằng."],["现实社会中，女人与男人有时并不平等。","Xiànshí shèhuì zhōng, nǚrén yǔ nánrén yǒushí bìng bù píngděng.","Trong xã hội thực tế, phụ nữ và nam giới đôi khi chẳng hề bình đẳng."],["我认为公司对这次事情的处理不够公平。","Wǒ rènwéi gōngsī duì zhè cì shìqing de chǔlǐ bú gòu gōngpíng.","Tôi cho rằng cách công ty xử lý chuyện lần này chưa đủ công bằng."]],"d":[["机会对每个人来说都是____的。","平等"],["这次比赛很____，没有什么问题。","公平"],["作为法官，你做事应该____。","公平"],["人生来是____的，人人都有权追求自由和幸福。","平等"]],"w":"Nói về quyền lợi, địa vị chung của con người (人人平等、男女平等) → 平等. Đánh giá cách xử lý một việc cụ thể, một cuộc thi, một phán quyết có đúng mực, không thiên vị hay không → 公平."}],"ext":[["作文","zuòwén","bài làm văn"],["论文","lùnwén","luận văn, bài luận"],["主题","zhǔtí","chủ đề"],["题目","tímù","đề bài, đầu đề"],["话题","huàtí","đề tài, chủ đề (câu chuyện)"],["目录","mùlù","mục lục"],["提纲","tígāng","dàn ý, đề cương"],["标点","biāodiǎn","dấu câu"],["废话","fèihuà","lời thừa, nói nhảm"],["胡说","húshuō","nói bậy, nói càn"]],"extt":"写作表达","notes":"Nguồn cuối bài khoá: 改编自《北京青年报》，作者：梁晓声. Bài khoá 578 chữ (theo sách), 5 đoạn văn (tr.40–41), chia 3 phần: đoạn 1–2 (từ 1–15 + 2 专名) / đoạn 3 (từ 16–28) / đoạn 4–5 (từ 29–34). Từ số 12, 17, 20, 26, 30, 34 có dấu * (ngoài đề cương). 专名 có 2 mục: 《卖火柴的小女孩儿》 và 灰姑娘 (cả hai xuất hiện lần đầu ở đoạn 2); nghĩa Việt chép theo sách (“Cô bé bán diêm”, Cô bé lọ lem). Nghĩa từ 9 火柴 chép đúng sách là “diêm quẹt”; từ 30 童话 sách dịch là “truyện hư cấu”. Câu cuối đoạn 2 (老师讲完故事之后……两个姐姐？) dài hơn 45 chữ nhưng không có ；nên giữ nguyên một dòng. Phần 注释 gồm 3 mục 词语例释 (一旦, 难免, 自从) và 1 词语辨析 (平等—公平). Ví dụ cuối của 辨析 sách có chú thích “处理（chǔlǐ, xử lý）”, đã bỏ chú thích khi chép câu. Drill 平等—公平 lấy từ 做一做 (câu (1) sách đã cho đáp án 平等; câu (2)(3)(4) đáp án do người soạn giải). Drill của 一旦/难免/自从: 练一练 trong sách là bài hoàn thành câu mở, nên drill đặt dựa trên câu ví dụ của sách; câu cuối mỗi thẻ (天冷了，多穿点儿…; 马上就要考试了…; 自从我来中国以后…) dựa theo đề 练一练 nhưng phần hoàn thành là do người soạn tự đặt. vocab_ex của 过分, 客观, 价值, 主张, 承认, 理由 lấy từ 练习1; của 观点, 转变, 单纯 từ 练习2 (đã điền đáp án); của 难免 từ 注释; của 平等 từ bảng 辨析; của 灰 và 灰姑娘 từ phần 运用 (背景分析; câu về 灰 đã bỏ chú thích “尘土（chéntǔ, bụi）”); còn lại trích câu/vế câu trong bài khoá. Bảng 扩展 (话题: 写作表达) trong sách chỉ có chữ Hán + pinyin, nghĩa tiếng Việt do người soạn bổ sung.","order":[{"z":"这个观点是不客观、不全面的，我们需要转变自己的观念。","t":["这个","观点","是","不","客观","不","全面","的","我们","需要","转变","自己","的","观念"],"v":"Quan điểm này không khách quan, không toàn diện; chúng ta cần thay đổi quan niệm của mình."},{"z":"为什么要讨论这个问题呢？","t":["为什么","要","讨论","这个","问题","呢"],"v":"Vì sao lại phải thảo luận vấn đề này?"},{"z":"因为这是一种情感交换。","t":["因为","这是","一种","情感","交换"],"v":"Bởi vì đây là một sự trao đổi về tình cảm."},{"z":"如果只是单纯地主张阅读而不强调思考，那是片面的。","t":["如果","只是","单纯","地","主张","阅读","而","不","强调","思考","那","是","片面","的"],"v":"Nếu chỉ đơn thuần chủ trương đọc mà không nhấn mạnh việc suy nghĩ thì đó là phiến diện."},{"z":"但只有这一部分是不够的，还要有认识、思考。","t":["但","只有","这","一部分","是","不够","的","还要","有","认识","思考"],"v":"Nhưng chỉ có phần này thì chưa đủ, còn phải có nhận thức và suy nghĩ."},{"z":"刚开始工作，这样的错误是难免的。","t":["刚","开始","工作","这样","的","错误","是","难免","的"],"v":"Mới bắt đầu đi làm thì những lỗi như thế này là khó tránh khỏi."},{"z":"朋友间难免会产生矛盾、误会甚至是伤害。","t":["朋友","间","难免会","产生矛盾","误会","甚至","是","伤害"],"v":"Giữa bạn bè với nhau khó tránh khỏi nảy sinh mâu thuẫn, hiểu lầm, thậm chí là tổn thương."},{"z":"自从城市出现后，它就成为人类生活的中心。","t":["自从","城市","出现","后","它","就","成为","人类","生活","的","中心"],"v":"Từ khi thành phố xuất hiện, nó đã trở thành trung tâm của đời sống loài người."},{"z":"现实社会中，女人与男人有时并不平等。","t":["现实","社会","中","女人","与","男人","有时","并","不","平等"],"v":"Trong xã hội thực tế, phụ nữ và nam giới đôi khi chẳng hề bình đẳng."},{"z":"我认为公司对这次事情的处理不够公平。","t":["我","认为","公司","对","这次","事情","的","处理","不够","公平"],"v":"Tôi cho rằng cách công ty xử lý chuyện lần này chưa đủ công bằng."}]},"23":{"n":23,"tz":"放手","tv":"Buông tay","batches":[[{"h":"乖","p":"guāi","v":"ngoan ngoãn","k":"tt.","x":0,"ez":"文文从小是个乖乖女，学习刻苦，遵守纪律。","ev":"Từ nhỏ Văn Văn đã là ":"một mình","k":"phó.","x":0,"ez":"最初，妈妈哪儿也不敢去，不能单独出门，不能与人沟通。","ev":"Lúc đầu, mẹ chẳng dám đi đâu, không thể ra ngoài một mình, không thể giao tiếp với ai."},{"h":"沟通","p":"gōutōng","v":"giao tiếp, liên lạc","k":"đgt.","x":0,"ez":"最初，妈妈哪儿也不敢去，不能单独出门，不能与人沟通。","ev":"Lúc đầu, mẹ chẳng dám đi đâu, không thể ra ngoài một mình, không thể giao tiếp với ai."},{"h":"横","p":"héng","v":"ngang, đi ngang qua","k":"tt.","x":1,"ez":"最后竟然独自把美国横穿了一遍。","ev":"Cuối cùng lại một mình đi xuyên ngang cả nước Mỹ."},{"h":"沙滩","p":"shātān","v":"bãi cát","k":"dt.","x":0,"ez":"2010年3月的一个夜晚，母女俩躺在夏威夷的沙滩上谈心。","ev":"Một đêm tháng 3 năm 2010, hai mẹ con nằm trên bãi cát ở Hawaii trò chuyện tâm tình."},{"h":"沉默","p":"chénmò","v":"lặng im","k":"đgt.","x":0,"ez":"文文沉默了很久，最后吻了妈妈一下。","ev":"Văn Văn im lặng rất lâu, cuối cùng hôn mẹ một cái."},{"h":"吻","p":"wěn","v":"hôn","k":"đgt.","x":0,"ez":"文文沉默了很久，最后吻了妈妈一下。","ev":"Văn Văn im lặng rất lâu, cuối cùng hôn mẹ một cái."},{"h":"忍不住","p":"rěnbuzhù","v":"không nhịn được, không thể không","k":"","x":0,"ez":"妈妈忍不住流下了眼泪。","ev":"Mẹ không kìm được nước mắt."},{"h":"幸亏","p":"xìngkuī","v":"may mà","k":"phó.","x":0,"ez":"她说：“幸亏那晚天色很暗。”","ev":"Bà nói: “May mà tối hôm đó trời rất tối.”"},{"h":"暗","p":"àn","v":"tối, u ám","k":"tt.","x":0,"ez":"她说：“幸亏那晚天色很暗。”","ev":"Bà nói: “May mà tối hôm đó trời rất tối.”"},{"h":"夏威夷","p":"Xiàwēiyí","v":"Hawaii","k":"tên riêng","x":0,"ez":"2010年3月的一个夜晚，母女俩躺在夏威夷的沙滩上谈心。","ev":"Một đêm tháng 3 năm 2010, hai mẹ con nằm trên bãi cát ở Hawaii trò chuyện tâm tình."}]],"texts":[{"no":1,"tz":"","tv":"","lines":[{"s":"","z":"文文从小是个乖乖女，学习刻苦，遵守纪律。","p":"Wénwen cóngxiǎo shì ge guāiguāinǚ, xuéxí kèkǔ, zūnshǒu jìlǜ.","v":"Từ nhỏ Văn Văn đã là một cô bé ngoan ngoãn, học hành chăm chỉ, tuân thủ kỷ luật.","b":0},{"s":"","z":"大事小事，尽管妈妈表示也要征求她的意见，但上哪所学校、念什么专业，甚至跟什么人交朋友，基本上都是妈妈说了算。","p":"Dàshì xiǎoshì, jǐnguǎn māma biǎoshì yě yào zhēngqiú tā de yìjiàn, dàn shàng nǎ suǒ xuéxiào, niàn shénme zhuānyè, shènzhì gēn shénme rén jiāo péngyou, jīběn shang dōu shì māma shuōle suàn.","v":"Việc lớn việc nhỏ, tuy mẹ nói là cũng sẽ hỏi ý kiến cô, nhưng học trường nào, theo ngành gì, thậm chí kết bạn với ai, về cơ bản đều do mẹ quyết định.","b":0},{"s":"","z":"可是到了大学阶段，亲爱的女儿竟然违反了乖乖女的各种规矩，越来越有自己的主见，越来越能干、独立了。","p":"Kěshì dàole dàxué jiēduàn, qīn'ài de nǚ'ér jìngrán wéifǎnle guāiguāinǚ de gè zhǒng guīju, yuè lái yuè yǒu zìjǐ de zhǔjiàn, yuè lái yuè nénggàn, dúlì le.","v":"Nhưng đến giai đoạn đại học, cô con gái yêu quý lại phá vỡ mọi khuôn phép của một cô bé ngoan, ngày càng có chính kiến riêng, ngày càng giỏi giang và tự lập.","b":0},{"s":"","z":"尽管她的成绩仍然是第一名，但她不再甘于当“好学生”：她逃课去听各种讲座，出席欧盟商会的鸡尾酒会，做志愿者，拍电影，学摄影，泡酒吧，参加了学生会并担任了学生会主席，还组织各种社会活动。","p":"Jǐnguǎn tā de chéngjì réngrán shì dì-yī míng, dàn tā bú zài gānyú dāng “hǎo xuésheng”: tā táokè qù tīng gè zhǒng jiǎngzuò, chūxí Ōuméng shānghuì de jīwěijiǔhuì, zuò zhìyuànzhě, pāi diànyǐng, xué shèyǐng, pào jiǔbā, cānjiāle xuéshenghuì bìng dānrènle xuéshenghuì zhǔxí, hái zǔzhī gè zhǒng shèhuì huódòng.","v":"Dù thành tích vẫn đứng đầu, cô không còn cam chịu làm “học sinh ngoan” nữa: cô trốn học đi nghe đủ loại buổi thuyết trình, dự tiệc cocktail của Phòng Thương mại châu Âu, làm tình nguyện viên, quay phim, học nhiếp ảnh, la cà quán bar, tham gia hội sinh viên và làm chủ tịch hội, lại còn tổ chức đủ loại hoạt động xã hội.","b":0},{"s":"","z":"妈妈以前要她当外交官的计划，在她眼里“实在没什么意思”，她觉得经商才是自己的目标。","p":"Māma yǐqián yào tā dāng wàijiāoguān de jìhuà, zài tā yǎn li “shízài méi shénme yìsi”, tā juéde jīngshāng cái shì zìjǐ de mùbiāo.","v":"Kế hoạch trước đây mẹ muốn cô làm nhà ngoại giao, trong mắt cô “thật chẳng có gì thú vị”; cô thấy kinh doanh mới là mục tiêu của mình.","b":0},{"s":"","z":"她放弃了本系保送研究生、放弃了各种工作的面试，坚持要去国外留学，结果12所世界名牌大学录取了她。","p":"Tā fàngqìle běn xì bǎosòng yánjiūshēng, fàngqìle gè zhǒng gōngzuò de miànshì, jiānchí yào qù guówài liúxué, jiéguǒ shí'èr suǒ shìjiè míngpái dàxué lùqǔle tā.","v":"Cô từ bỏ suất được khoa tiến cử thẳng lên cao học, từ bỏ các cuộc phỏng vấn xin việc, nhất quyết đòi đi du học, kết quả là 12 trường đại học danh tiếng thế giới đều nhận cô.","b":1},{"s":"","z":"当面临是否选择牛津大学时，她们全家开会，爸爸妈妈认为应该去，但文文跟他们的意见不一致，她坚持要去美国。","p":"Dāng miànlín shìfǒu xuǎnzé Niújīn Dàxué shí, tāmen quánjiā kāihuì, bàba māma rènwéi yīnggāi qù, dàn Wénwen gēn tāmen de yìjiàn bù yízhì, tā jiānchí yào qù Měiguó.","v":"Khi phải cân nhắc có chọn Đại học Oxford hay không, cả nhà họp bàn; bố mẹ cho rằng nên đi, nhưng Văn Văn không cùng ý kiến, cô nhất quyết muốn sang Mỹ.","b":0},{"s":"","z":"这一次妈妈让步了。","p":"Zhè yí cì māma ràngbù le.","v":"Lần này mẹ đã nhượng bộ.","b":0},{"s":"","z":"她隐隐约约觉得：自己该完全放手了。","p":"Tā yǐnyǐnyuēyuē juéde: zìjǐ gāi wánquán fàngshǒu le.","v":"Bà lờ mờ cảm thấy: đã đến lúc mình nên hoàn toàn buông tay.","b":0},{"s":"","z":"没想到，正是妈妈的放手，让风筝越飞越高。","p":"Méi xiǎngdào, zhèng shì māma de fàngshǒu, ràng fēngzheng yuè fēi yuè gāo.","v":"Không ngờ chính sự buông tay của mẹ lại khiến cánh diều bay càng lúc càng cao.","b":0},{"s":"","z":"几年后，文文在美国工作，妈妈去洛杉矶看她。","p":"Jǐ nián hòu, Wénwen zài Měiguó gōngzuò, māma qù Luòshānjī kàn tā.","v":"Vài năm sau, Văn Văn làm việc ở Mỹ, mẹ sang Los Angeles thăm cô.","b":0},{"s":"","z":"在这个陌生的地方，妈妈感到她们好像交换了某种身份：自己倒像女儿，而文文倒像妈妈。","p":"Zài zhège mòshēng de dìfang, māma gǎndào tāmen hǎoxiàng jiāohuànle mǒu zhǒng shēnfèn: zìjǐ dào xiàng nǚ'ér, ér Wénwen dào xiàng māma.","v":"Ở nơi xa lạ này, mẹ cảm thấy hai mẹ con dường như đã đổi vai cho nhau: mình lại giống con gái, còn Văn Văn lại giống mẹ.","b":0},{"s":"","z":"她们建立了一种新的关系。","p":"Tāmen jiànlìle yì zhǒng xīn de guānxi.","v":"Hai mẹ con đã xây dựng một mối quan hệ mới.","b":0},{"s":"","z":"最初，妈妈哪儿也不敢去，不能单独出门，不能与人沟通，什么都要靠女儿。","p":"Zuìchū, māma nǎr yě bù gǎn qù, bù néng dāndú chūmén, bù néng yǔ rén gōutōng, shénme dōu yào kào nǚ'ér.","v":"Lúc đầu, mẹ chẳng dám đi đâu, không thể ra ngoài một mình, không thể giao tiếp với ai, việc gì cũng phải trông vào con gái.","b":1},{"s":"","z":"后来文文工作忙，就给她地图、车钥匙、机票，鼓励她自己出去。","p":"Hòulái Wénwen gōngzuò máng, jiù gěi tā dìtú, chē yàoshi, jīpiào, gǔlì tā zìjǐ chūqu.","v":"Sau đó Văn Văn bận việc, bèn đưa mẹ bản đồ, chìa khoá xe, vé máy bay, khuyến khích mẹ tự đi.","b":0},{"s":"","z":"从家门口的超市开始，妈妈越走越远，最后竟然独自把美国横穿了一遍。","p":"Cóng jiā ménkǒu de chāoshì kāishǐ, māma yuè zǒu yuè yuǎn, zuìhòu jìngrán dúzì bǎ Měiguó héngchuānle yí biàn.","v":"Bắt đầu từ siêu thị trước cửa nhà, mẹ đi mỗi lúc một xa, cuối cùng lại một mình đi xuyên ngang cả nước Mỹ.","b":0},{"s":"","z":"她说，是女儿的“放手”，让她走得更远。","p":"Tā shuō, shì nǚ'ér de “fàngshǒu”, ràng tā zǒu de gèng yuǎn.","v":"Bà nói, chính sự “buông tay” của con gái đã giúp bà đi được xa hơn.","b":0},{"s":"","z":"做妈妈的，这才算是真正明白了“放手”的重要。","p":"Zuò māma de, zhè cái suàn shì zhēnzhèng míngbaile “fàngshǒu” de zhòngyào.","v":"Là người làm mẹ, đến lúc này bà mới thật sự hiểu tầm quan trọng của việc “buông tay”.","b":0},{"s":"","z":"2010年3月的一个夜晚，母女俩躺在夏威夷的沙滩上谈心。","p":"Èr líng yī líng nián sān yuè de yí ge yèwǎn, mǔnǚ liǎ tǎng zài Xiàwēiyí de shātān shang tánxīn.","v":"Một đêm tháng 3 năm 2010, hai mẹ con nằm trên bãi cát ở Hawaii trò chuyện tâm tình.","b":0},{"s":"","z":"妈妈第一次为以前对女儿的“不放手”而道歉。","p":"Māma dì-yī cì wèi yǐqián duì nǚ'ér de “bú fàngshǒu” ér dàoqiàn.","v":"Lần đầu tiên mẹ xin lỗi vì trước đây đã “không chịu buông tay” con gái.","b":0},{"s":"","z":"文文沉默了很久，最后吻了妈妈一下，轻轻地说：“妈妈，我真的很喜欢现在的你。”","p":"Wénwen chénmòle hěn jiǔ, zuìhòu wěnle māma yíxià, qīngqīng de shuō: “Māma, wǒ zhēn de hěn xǐhuan xiànzài de nǐ.”","v":"Văn Văn im lặng rất lâu, cuối cùng hôn mẹ một cái, khẽ nói: “Mẹ ơi, con thật sự rất thích mẹ của bây giờ.”","b":0},{"s":"","z":"妈妈忍不住流下了眼泪。","p":"Māma rěnbuzhù liúxiale yǎnlèi.","v":"Mẹ không kìm được nước mắt.","b":0},{"s":"","z":"她说：“幸亏那晚天色很暗。”","p":"Tā shuō: “Xìngkuī nà wǎn tiānsè hěn àn.”","v":"Bà nói: “May mà tối hôm đó trời rất tối.”","b":0}]}],"aud":[{"v":"audio/23-2.mp3","t":"audio/23-1.mp3"}],"gram":[{"id":"yizhi","t":"一致","s":"nhất trí, giống nhau (tính từ); cùng, đồng loạt (phó từ)","b":"<b>一致</b> trước hết là <b>tính từ</b>, biểu thị <b>không có sự bất đồng</b> (分歧 fēnqí), tức là ý kiến, quan điểm, trạng thái giống nhau. Ngoài ra <b>一致</b> còn có thể làm <b>phó từ</b>, đứng trước động từ, mang nghĩa <b>cùng nhau, đồng loạt</b>.","r":["Tính từ, làm vị ngữ: A 跟/和 B (的意见) (不)一致: 文文跟他们的意见不一致。","Tính từ, sau 趋于/达成/保持…: 在兴趣爱好、心理情绪上也趋于一致。","Phó từ, đứng trước động từ: 一致 + 表示/认为/同意…: 双方一致表示…; 专家们一致认为…","Làm định ngữ khi bổ nghĩa cho danh từ: 一致的意见、大家的一致认可。"],"e":[["……但文文跟他们的意见不一致，她坚持要去美国。","…… dàn Wénwen gēn tāmen de yìjiàn bù yízhì, tā jiānchí yào qù Měiguó.","…… nhưng Văn Văn không cùng ý kiến với bố mẹ, cô nhất quyết muốn sang Mỹ. <i>(bài khoá)</i>"],["长期共同生活的夫妻在兴趣爱好、心理情绪上也趋于一致。","Chángqī gòngtóng shēnghuó de fūqī zài xìngqù àihào, xīnlǐ qíngxù shang yě qūyú yízhì.","Vợ chồng chung sống lâu năm thì cả sở thích lẫn tâm lý, cảm xúc cũng dần trở nên giống nhau."],["双方一致表示将进一步发展友好合作关系。","Shuāngfāng yízhì biǎoshì jiāng jìnyíbù fāzhǎn yǒuhǎo hézuò guānxi.","Hai bên đều nhất trí sẽ tiếp tục phát triển quan hệ hợp tác hữu nghị."],["专家们一致认为这是一种成功的产品，可以放心使用。","Zhuānjiāmen yízhì rènwéi zhè shì yì zhǒng chénggōng de chǎnpǐn, kěyǐ fàngxīn shǐyòng.","Các chuyên gia đều nhất trí cho rằng đây là một sản phẩm thành công, có thể yên tâm sử dụng."]],"d":[["……但文文跟他们的意见不____，她坚持要去美国。","一致"],["专家们____认为这是一种成功的产品，可以放心使用。","一致"],["他的建议一提出，就得到了大家的____认可。","一致"]],"w":"一致 nói về sự thống nhất ý kiến, quan điểm (không bất đồng), còn 一样 chỉ đơn thuần là giống nhau về hình thức, mức độ. Vì vậy nói 大家的一致认可 (sự công nhận nhất trí của mọi người), không nói 大家的一样认可. Chú ý pinyin: yízhì (一 biến điệu thành thanh 2)."},{"id":"mou","t":"某","s":"nào đó, mỗ (đại từ chỉ thị)","b":"<b>某</b> là <b>đại từ chỉ thị</b>, có hai cách dùng. (1) Chỉ <b>một người hoặc sự vật nhất định</b>: thường đặt sau họ, cho biết người nói <b>biết tên nhưng không nói ra</b>, đôi khi mang <b>sắc thái chê bai</b>. (2) Chỉ <b>người hoặc sự vật không xác định</b>.","r":["Họ + 某: 李某 (người họ Lý nào đó), có khi mang ý coi thường: 公司业务员李某闻之大喜。","某某: chỉ chung một người bất kỳ, giấu tên: “某某到此一游”。","某 + (số từ) + lượng từ/danh từ, chỉ cái không xác định: 某一方面、某种身份、某大学、某入口处、某年某月。"],"e":[["公司业务员李某闻之大喜，以为自己碰到了一个大买主。","Gōngsī yèwùyuán Lǐ mǒu wén zhī dà xǐ, yǐwéi zìjǐ pèngdàole yí ge dà mǎizhǔ.","Gã nhân viên kinh doanh họ Lý của công ty nghe vậy thì mừng rỡ, tưởng mình vớ được một khách hàng lớn."],["在公园的墙上写“某某到此一游”之类的行为是极不文明的。","Zài gōngyuán de qiáng shang xiě “mǒumǒu dào cǐ yì yóu” zhī lèi de xíngwéi shì jí bù wénmíng de.","Những hành vi như viết “X đã đến đây” lên tường công viên là cực kỳ thiếu văn minh."],["人们如果长期进行某一方面的训练，就可以使大脑在某一方面的反应能力提高。","Rénmen rúguǒ chángqī jìnxíng mǒu yì fāngmiàn de xùnliàn, jiù kěyǐ shǐ dànǎo zài mǒu yì fāngmiàn de fǎnyìng nénglì tígāo.","Nếu con người luyện tập lâu dài ở một mặt nào đó thì có thể nâng cao khả năng phản ứng của não ở mặt đó."],["在这个陌生的地方，妈妈感到她们好像交换了某种身份：自己倒像女儿，而文文倒像妈妈。","Zài zhège mòshēng de dìfang, māma gǎndào tāmen hǎoxiàng jiāohuànle mǒu zhǒng shēnfèn: zìjǐ dào xiàng nǚ'ér, ér Wénwen dào xiàng māma.","Ở nơi xa lạ này, mẹ cảm thấy hai mẹ con dường như đã đổi vai cho nhau: mình lại giống con gái, còn Văn Văn lại giống mẹ. <i>(bài khoá)</i>"]],"d":[["公司业务员李____闻之大喜，以为自己碰到了一个大买主。","某"],["人们如果长期进行某一方面的训练，就可以使大脑在____一方面的反应能力提高。","某"],["一位著名的教授到____大学做演讲，教室被学生挤得满满的。","某"]],"w":"Khi đứng sau họ người (李某、王某), 某 thường dùng trong văn bản tin tức, pháp luật hoặc khi người nói không muốn nêu tên, có thể mang ý chê; không dùng cách này để gọi người mình tôn trọng."},{"id":"xingkui","t":"幸亏","s":"may mà, may sao (phó từ)","b":"<b>幸亏</b> là <b>phó từ</b>, biểu thị nhờ <b>một nguyên nhân nào đó</b> mà <b>tránh được</b> một việc không mong muốn. 幸亏 dẫn ra điều kiện thuận lợi; vế còn lại nêu kết quả tốt đã đạt được hoặc điều xấu đã tránh được.","r":["幸亏 + điều kiện thuận lợi, (chủ ngữ +) (才/就) + kết quả: 幸亏你提醒了我，我今天就去报名。","Có thể đặt ở vế sau để giải thích vì sao tránh được rủi ro: 这个病人是心脏问题，幸亏送来得及时。","幸亏 có thể đứng trước hoặc sau chủ ngữ: 幸亏你… / 你幸亏…"],"e":[["幸亏你提醒了我，我今天就去报名。","Xìngkuī nǐ tíxǐngle wǒ, wǒ jīntiān jiù qù bàomíng.","May mà bạn nhắc tôi, hôm nay tôi sẽ đi đăng ký ngay."],["医生说这个病人是心脏问题，幸亏送来得及时。","Yīshēng shuō zhège bìngrén shì xīnzàng wèntí, xìngkuī sòng lái de jíshí.","Bác sĩ nói bệnh nhân này bị bệnh tim, may mà được đưa đến kịp thời."],["妈妈忍不住流下了眼泪。她说：“幸亏那晚天色很暗。”","Māma rěnbuzhù liúxiale yǎnlèi. Tā shuō: “Xìngkuī nà wǎn tiānsè hěn àn.”","Mẹ không kìm được nước mắt. Bà nói: “May mà tối hôm đó trời rất tối.” <i>(bài khoá)</i>"]],"d":[["____你提醒了我，我今天就去报名。","幸亏"],["医生说这个病人是心脏问题，____送来得及时。","幸亏"],["____有人给我们带路，我们今天才没走错路。","幸亏"]],"w":"幸亏 là phó từ, phía sau phải là cả một sự việc (幸亏你提醒了我). Muốn cảm ơn trực tiếp một người/ sự vật bằng cấu trúc “… + 了 + danh từ” thì dùng 多亏: ✓ 多亏了吴县长，咱不用出村就把苹果都卖了 (练习2), không nói ✗ 幸亏了吴县长."},{"id":"dandu_duzi","t":"单独 vs 独自","s":"một mình, riêng – một mình (tự mình)","b":"<b>单独</b> và <b>独自</b> đều có thể làm <b>phó từ</b>, đều mang nghĩa <b>một mình mình</b>. Ví dụ: 你太年轻了，恐怕不能单独/独自一人完成这个任务。","r":["<b>Nghĩa nhấn mạnh:</b> 单独 nhấn mạnh <b>không gộp chung với cái khác</b> (riêng ra): 我想和你单独谈谈。 — 独自 nhấn mạnh <b>một người tự làm một việc</b>: 孩子……就独自先吃了起来。","<b>Đối tượng:</b> 单独 <b>còn dùng được cho sự vật</b>: 鸡蛋要先单独炒好备用。 — 独自 <b>không dùng cho sự vật</b>.","<b>Từ loại:</b> 单独 <b>có thể làm tính từ</b>, làm định ngữ trong câu: 本科生上课有单独的教室。 — 独自 <b>không làm tính từ được</b>."],"e":[["你太年轻了，恐怕不能单独/独自一人完成这个任务。","Nǐ tài niánqīng le, kǒngpà bù néng dāndú/dúzì yì rén wánchéng zhège rènwu.","Cậu còn trẻ quá, e là không thể một mình hoàn thành nhiệm vụ này."],["你下午有时间吗？我想和你单独谈谈。","Nǐ xiàwǔ yǒu shíjiān ma? Wǒ xiǎng hé nǐ dāndú tántan.","Chiều nay cậu có rảnh không? Tớ muốn nói chuyện riêng với cậu."],["孩子饿得等不及爸爸了，就独自先吃了起来。","Háizi è de děng bu jí bàba le, jiù dúzì xiān chīle qilai.","Đứa bé đói quá không đợi bố được nữa, bèn tự mình ăn trước."],["做这个菜时，鸡蛋要先单独炒好备用。","Zuò zhège cài shí, jīdàn yào xiān dāndú chǎohǎo bèiyòng.","Khi nấu món này, phải xào riêng trứng trước để sẵn."],["本科生上课有单独的教室。","Běnkēshēng shàngkè yǒu dāndú de jiàoshì.","Sinh viên đại học có phòng học riêng để lên lớp."]],"d":[["这所大学为女生提供了____的考试，引起了激烈争论。","单独"],["教练为他____安排了训练。","单独"],["我喜欢早起，____去公园散步，顺便考虑一下一天的工作。","独自"]],"w":"Thấy cần “tách riêng” (nói chuyện riêng, xào riêng, phòng riêng, sắp xếp riêng cho ai) → 单独; thấy “một mình tự làm” (một mình đi dạo, một mình ăn trước) → 独自. Làm định ngữ có 的 (单独的教室) chỉ dùng 单独."}],"ext":[["教材","jiàocái","giáo trình, tài liệu giảng dạy"],["课程","kèchéng","chương trình học, môn học"],["实习","shíxí","thực tập"],["学历","xuélì","trình độ học vấn, bằng cấp"],["本科","běnkē","hệ đại học (chính quy)"],["系","xì","khoa (trường đại học)"],["讲座","jiǎngzuò","bài thuyết trình, buổi tọa đàm"],["学术","xuéshù","học thuật"],["学问","xuéwèn","học vấn, kiến thức"],["理论","lǐlùn","lý luận"],["资料","zīliào","tư liệu, tài liệu"],["修改","xiūgǎi","sửa đổi, chỉnh sửa"],["发表","fābiǎo","công bố, đăng (bài)"]],"extt":"教学1 / 学术","notes":"Nguồn cuối bài khoá: 改编自《中国青年报》，作者：从玉华. Bài khoá 716 chữ (theo sách), 7 đoạn văn (tr.47–49), chia 3 phần: đoạn 1–2 (từ 1–21 + 专名 文文, 欧盟) / đoạn 3–5 (từ 22–31 + 牛津大学, 洛杉矶) / đoạn 6–7 (từ 32–40 + 夏威夷). Từ số 27 让步, 28 隐约, 34 横 có dấu * (ngoài đề cương). Từ 38 忍不住: sách không ghi từ loại, để trống pos. Pinyin từ 20 và 27 chép đúng cách viết tách của sách (jīng shāng, ràng bù); trong pinyin bài khoá viết liền. 专名 5 夏威夷: sách ghi nghĩa “Hawaii”. Câu thứ 4 đoạn 2 (尽管她的成绩仍然是第一名……还组织各种社会活动。) dài hơn 45 chữ nhưng không có ；nên giữ một dòng. 注释 gồm 3 mục 词语例释 (一致, 某, 幸亏) và 1 词语辨析 (单独—独自). Drill 单独—独自 lấy từ 做一做: câu (1) sách đã cho đáp án 单独; câu (3)(4) đáp án do người soạn giải; câu (2) 他____一人在体育馆里进行训练 bỏ qua vì theo phần 共同点 của sách cả hai từ đều điền được. Drill 一致 câu 3 lấy từ 练习2④ (đáp án A.一致); 练习2② (幸亏/多亏) đáp án do người soạn giải là B.多亏, đưa vào warn của 幸亏. 练一练 của 一致 và 幸亏 là bài hoàn thành câu mở nên drill đặt dựa trên câu ví dụ của sách; câu drill cuối của 幸亏 (____有人给我们带路…) dựa theo đề 练一练(1) nhưng phần điền do người soạn tự đặt. 练一练 của 某 (chỉ ra cách dùng) sách không cho đáp án; drill 3 của 某 lấy câu (1) của 练一练. vocab_ex của 主席 lấy từ câu mẫu phần 热身 2; còn lại trích câu/vế câu trong bài khoá. Bảng 扩展 có 2 chủ đề (教学1, 学术) chỉ gồm chữ Hán + pinyin, nghĩa tiếng Việt do người soạn bổ sung; pinyin 学问 chép theo sách (xuéwèn).","order":[{"z":"文文从小是个乖乖女，学习刻苦，遵守纪律。","t":["文文","从小","是","个","乖乖女","学习","刻苦","遵守纪律"],"v":"Từ nhỏ Văn Văn đã là một cô bé ngoan ngoãn, học hành chăm chỉ, tuân thủ kỷ luật."},{"z":"这一次妈妈让步了。","t":["这","一次","妈妈","让步","了"],"v":"Lần này mẹ đã nhượng bộ."},{"z":"她隐隐约约觉得：自己该完全放手了。","t":["她","隐隐约约","觉得","自己","该","完全","放手","了"],"v":"Bà lờ mờ cảm thấy: đã đến lúc mình nên hoàn toàn buông tay."},{"z":"没想到，正是妈妈的放手，让风筝越飞越高。","t":["没想到","正是","妈妈","的","放手","让","风筝","越飞越","高"],"v":"Không ngờ chính sự buông tay của mẹ lại khiến cánh diều bay càng lúc càng cao."},{"z":"几年后，文文在美国工作，妈妈去洛杉矶看她。","t":["几年","后","文文","在","美国","工作","妈妈","去","洛杉矶","看","她"],"v":"Vài năm sau, Văn Văn làm việc ở Mỹ, mẹ sang Los Angeles thăm cô."},{"z":"她们建立了一种新的关系。","t":["她们","建立","了","一种","新","的","关系"],"v":"Hai mẹ con đã xây dựng một mối quan hệ mới."},{"z":"做妈妈的，这才算是真正明白了“放手”的重要。","t":["做","妈妈","的","这才","算是","真正","明白","了","放手","的","重要"],"v":"Là người làm mẹ, đến lúc này bà mới thật sự hiểu tầm quan trọng của việc “buông tay”."},{"z":"妈妈第一次为以前对女儿的“不放手”而道歉。","t":["妈妈","第一次","为","以前","对","女儿","的","不","放手","而","道歉"],"v":"Lần đầu tiên mẹ xin lỗi vì trước đây đã “không chịu buông tay” con gái."},{"z":"妈妈忍不住流下了眼泪。","t":["妈妈","忍不住","流下","了","眼泪"],"v":"Mẹ không kìm được nước mắt."},{"z":"她说：“幸亏那晚天色很暗。","t":["她","说","幸亏","那晚","天色","很","暗"],"v":"Bà nói: “May mà tối hôm đó trời rất tối.”"},{"z":"双方一致表示将进一步发展友好合作关系。","t":["双方","一致","表示","将","进一步","发展","友好合作","关系"],"v":"Hai bên đều nhất trí sẽ tiếp tục phát triển quan hệ hợp tác hữu nghị."},{"z":"专家们一致认为这是一种成功的产品，可以放心使用。","t":["专家","们","一致","认为","这是","一种","成功","的","产品","可以","放心使用"],"v":"Các chuyên gia đều nhất trí cho rằng đây là một sản phẩm thành công, có thể yên tâm sử dụng."},{"z":"幸亏你提醒了我，我今天就去报名。","t":["幸亏","你","提醒","了","我","我","今天","就","去","报名"],"v":"Ma ên, trai tráng trong núi đều ra ngoài bôn ba, chỉ còn người già và trẻ con ở lại. <i>(bài khoá)</i>"},{"h":"主题","p":"zhǔtí","v":"chủ đề","k":"dt.","x":0,"ez":"于是，郝老师组织了一个8周的研究型学习活动，主题是“让家乡的明天更美好”。","ev":"Vì thế, cô Hách tổ chức một hoạt động học tập nghiên cứu kéo dài 8 tuần với chủ đề “Làm cho ngày mai của quê hương tốt đẹp hơn”. <i>(bài khoá)</i>"},{"h":"地理","p":"dìlǐ","v":"địa lý","k":"dt.","x":0,"ez":"她鼓励学生寻找村子的问题，通过了解历史地理情况、采访村里的老人、小组讨论等，最终提出解决方案。","ev":"Cô khuyến khích học sinh tìm ra những vấn đề của làng, thông qua việc tìm hiểu lịch sử, địa lý, phỏng vấn người già trong làng, thảo luận nhóm…, cuối cùng đưa ra phương án giải quyết. <i>(bài khoá)</i>"},{"h":"采访","p":"cǎifǎng","v":"phỏng vấn","k":"đgt.","x":0,"ez":"她鼓励学生寻找村子的问题，通过了解历史地理情况、采访村里的老人、小组讨论等，最终提出解决方案。","ev":"Cô khuyến khích học sinh tìm ra những vấn đề của làng, thông qua việc tìm hiểu lịch sử, địa lý, phỏng vấn người già trong làng, thảo luận nhóm…, cuối cùng đưa ra phương án giải quyết. <i>(bài khoá)</i>"},{"h":"利用","p":"lìyòng","v":"sử dụng, dùng","k":"đgt.","x":0,"ez":"她和其他志愿者利用午休、周末等空闲时间给学生们指导和培训。","ev":"Cô cùng các tình nguyện viên khác tranh thủ giờ nghỉ trưa, cuối tuần và những lúc rảnh rỗi để hướng dẫn, bồi dưỡng cho học sinh. <i>(bài khoá)</i>"},{"h":"空闲","p":"kòngxián","v":"nhàn rỗi, rỗi rãi","k":"tt.","x":0,"ez":"她和其他志愿者利用午休、周末等空闲时间给学生们指导和培训。","ev":"Cô cùng các tình nguyện viên khác tranh thủ giờ nghỉ trưa, cuối tuần và những lúc rảnh rỗi để hướng dẫn, bồi dưỡng cho học sinh. <i>(bài khoá)</i>"},{"h":"指导","p":"zhǐdǎo","v":"hướng dẫn, chỉ bảo","k":"đgt.","x":0,"ez":"她和其他志愿者利用午休、周末等空闲时间给学生们指导和培训。","ev":"Cô cùng các tình nguyện viên khác tranh thủ giờ nghỉ trưa, cuối tuần và những lúc rảnh rỗi để hướng dẫn, bồi dưỡng cho học sinh. <i>(bài khoá)</i>"},{"h":"培训","p":"péixùn","v":"huấn luyện, đào tạo","k":"đgt.","x":0,"ez":"她和其他志愿者利用午休、周末等空闲时间给学生们指导和培训。","ev":"Cô cùng các tình nguyện viên khác tranh thủ giờ nghỉ trưa, cuối tuần và những lúc rảnh rỗi để hướng dẫn, bồi dưỡng cho học sinh. <i>(bài khoá)</i>"},{"h":"建设","p":"jiànshè","v":"xây dựng, kiến thiết","k":"đgt.","x":0,"ez":"毕业后我希望回去建设我的国家。","ev":"Tốt nghiệp xong, tôi mong được trở về xây dựng đất nước mình."},{"h":"操心","p":"cāo xīn","v":"bận tâm, lo nghĩ","k":"đgt.","x":0,"ez":"以前，我们总认为建设家乡是大人的事，用不着我们操心。","ev":"Trước đây, chúng em luôn nghĩ xây dựng quê hương là việc của người lớn, chẳng cần chúng em bận tâm. <i>(bài khoá)</i>"},{"h":"承担","p":"chéngdān","v":"gánh vác, đảm nhận","k":"đgt.","x":0,"ez":"这次活动的费用将由学校统一承担。","ev":"Chi phí cho hoạt động lần này sẽ do nhà trường chi trả chung."},{"h":"义务","p":"yìwù","v":"nghĩa vụ","k":"dt.","x":0,"ez":"不过，现在我们明白了，建设家乡，人人有责，我们也要承担这个义务。","ev":"Nhưng giờ chúng em đã hiểu: xây dựng quê hương là trách nhiệm của mọi người, chúng em cũng phải gánh vác nghĩa vụ này. <i>(bài khoá)</i>"},{"h":"艰巨","p":"jiānjù","v":"gian khổ, nặng nề","k":"tt.","x":0,"ez":"这个任务很艰巨，我们要尽自己最大的力量。","ev":"Nhiệm vụ này rất gian nan, chúng em phải dốc hết sức mình. <i>(bài khoá)</i>"},{"h":"力量","p":"lìliàng","v":"lực lượng, sức mạnh, sức lực","k":"dt.","x":0,"ez":"表面上弱小的人，很可能拥有你想象不到的巨大力量。","ev":"Người trông có vẻ yếu ớt rất có thể lại mang một sức mạnh to lớn mà bạn không ngờ tới."},{"h":"收获","p":"shōuhuò","v":"thu hoạch","k":"dt.","x":0,"ez":"郝琳硕觉得自己的收获远多于给孩子们的。","ev":"Hách Lâm Thạc cảm thấy những gì mình nhận được còn nhiều hơn rất nhiều so với những gì mình đã cho các em. <i>(bài khoá)</i>"}]],"texts":[{"no":1,"tz":"","tv":"","lines":[{"s":"","z":"来云南支教一年多，郝琳硕老师自己也记不清有多少次家访了。","p":"Lái Yúnnán zhījiào yì nián duō, Hǎo Línshuò lǎoshī zìjǐ yě jì bu qīng yǒu duōshao cì jiāfǎng le.","v":"Đã đến Vân Nam dạy học tình nguyện hơn một năm, chính cô giáo Hách Lâm Thạc cũng không nhớ nổi mình đã đi thăm nhà học sinh bao nhiêu lần.","b":0},{"s":"","z":"刚到时，一位叫赵福根的男生引起了她的注意。","p":"Gāng dào shí, yí wèi jiào Zhào Fúgēn de nánshēng yǐnqǐle tā de zhùyì.","v":"Hồi mới đến, một cậu học trò tên Triệu Phúc Căn đã khiến cô chú ý.","b":0},{"s":"","z":"他上课从不发言，很多课不及格，平时也几乎不和同学交往。","p":"Tā shàngkè cóng bù fāyán, hěn duō kè bù jígé, píngshí yě jīhū bù hé tóngxué jiāowǎng.","v":"Trong giờ học cậu chưa bao giờ phát biểu, nhiều môn không đạt, ngày thường cũng hầu như không chơi với bạn bè.","b":0},{"s":"","z":"郝老师家访后得知，赵福根的父亲去世了，姐姐在外打工，他家里很穷，还得帮着妈妈做家务，是个体贴孝顺的孩子。","p":"Hǎo lǎoshī jiāfǎng hòu dézhī, Zhào Fúgēn de fùqin qùshì le, jiějie zài wài dǎgōng, tā jiā li hěn qióng, hái děi bāngzhe māma zuò jiāwù, shì ge tǐtiē xiàoshùn de háizi.","v":"Sau khi đến thăm nhà, cô Hách mới biết bố của Phúc Căn đã qua đời, chị gái đi làm thuê ở xa, nhà cậu rất nghèo, cậu còn phải giúp mẹ làm việc nhà – là một đứa trẻ chu đáo, hiếu thảo.","b":0},{"s":"","z":"“和他妈妈聊天才知道他很喜欢跳舞，”郝老师说，“我觉得这是个机会！”","p":"“Hé tā māma liáotiān cái zhīdào tā hěn xǐhuan tiàowǔ,” Hǎo lǎoshī shuō, “wǒ juéde zhè shì ge jīhuì!”","v":"“Nói chuyện với mẹ em ấy tôi mới biết em rất thích nhảy múa,” cô Hách kể, “tôi thấy đây chính là một cơ hội!”","b":0},{"s":"","z":"她鼓励福根在学校艺术节上表演，每周二带着他一起去找音乐老师排练。","p":"Tā gǔlì Fúgēn zài xuéxiào yìshùjié shang biǎoyǎn, měi zhōu'èr dàizhe tā yìqǐ qù zhǎo yīnyuè lǎoshī páiliàn.","v":"Cô động viên Phúc Căn biểu diễn ở liên hoan nghệ thuật của trường, thứ Ba hằng tuần lại dẫn cậu đi tìm thầy dạy nhạc để tập luyện.","b":0},{"s":"","z":"表演时，福根的蝴蝶舞得了舞蹈组的冠军，台下的同学们鼓起掌来，齐声地喊着“福根”的名字……","p":"Biǎoyǎn shí, Fúgēn de húdié wǔ déle wǔdǎo zǔ de guànjūn, tái xià de tóngxuémen gǔqǐ zhǎng lái, qíshēng de hǎnzhe “Fúgēn” de míngzi……","v":"Hôm biểu diễn, điệu múa bươm bướm của Phúc Căn giành giải nhất bảng múa, các bạn ngồi dưới đồng loạt vỗ tay, đồng thanh hô vang tên “Phúc Căn”…","b":0},{"s":"","z":"之后，赵福根学习用功了，成绩也逐渐进步。","p":"Zhīhòu, Zhào Fúgēn xuéxí yònggōng le, chéngjì yě zhújiàn jìnbù.","v":"Từ đó, Triệu Phúc Căn học hành chăm chỉ hơn, thành tích cũng dần tiến bộ.","b":1},{"s":"","z":"他写了一篇题目为《那天的舞蹈和掌声》的作文，得了全班最高分，他朗读了自己的作文：“郝老师来到我家，那是第一次有老师来。","p":"Tā xiěle yì piān tímù wéi 《Nà Tiān de Wǔdǎo hé Zhǎngshēng》 de zuòwén, déle quán bān zuì gāo fēn, tā lǎngdúle zìjǐ de zuòwén: “Hǎo lǎoshī lái dào wǒ jiā, nà shì dì-yī cì yǒu lǎoshī lái.","v":"Cậu viết một bài văn có đầu đề “Điệu múa và tràng pháo tay hôm ấy”, được điểm cao nhất lớp, rồi đọc to bài văn của mình: “Cô Hách đến nhà em, đó là lần đầu tiên có thầy cô đến nhà.","b":0},{"s":"","z":"她非常温柔……","p":"Tā fēicháng wēnróu……","v":"Cô rất dịu dàng…","b":0},{"s":"","z":"我永远都忘不了那热烈的掌声和同学们送我的糖，甜甜的。","p":"Wǒ yǒngyuǎn dōu wàng bu liǎo nà rèliè de zhǎngshēng hé tóngxuémen sòng wǒ de táng, tiántián de.","v":"Em sẽ mãi không quên tràng pháo tay nồng nhiệt ấy và những viên kẹo các bạn tặng, ngọt lịm.","b":0},{"s":"","z":"我感觉在学校也有人爱我了，我开始有勇气……”","p":"Wǒ gǎnjué zài xuéxiào yě yǒu rén ài wǒ le, wǒ kāishǐ yǒu yǒngqì……”","v":"Em cảm thấy ở trường cũng đã có người thương em, em bắt đầu có thêm can đảm…”","b":0},{"s":"","z":"郝老师发现，山里的青壮年都出去闯世界，只有老人、孩子留守，“他们出去了还回来吗？大山以后谁来负责”？","p":"Hǎo lǎoshī fāxiàn, shān li de qīng-zhuàngnián dōu chūqu chuǎng shìjiè, zhǐyǒu lǎorén, háizi liúshǒu, “tāmen chūqu le hái huílai ma? Dàshān yǐhòu shéi lái fùzé”?","v":"Cô Hách nhận ra thanh niên, trai tráng trong núi đều ra ngoài bôn ba, chỉ còn người già và trẻ con ở lại: “Họ đi rồi có còn quay về không? Sau này ai sẽ lo cho vùng núi này?”","b":1},{"s":"","z":"于是，郝老师组织了一个8周的研究型学习活动，主题是“让家乡的明天更美好”。","p":"Yúshì, Hǎo lǎoshī zǔzhīle yí ge bā zhōu de yánjiūxíng xuéxí huódòng, zhǔtí shì “ràng jiāxiāng de míngtiān gèng měihǎo”.","v":"Vì thế, cô Hách tổ chức một hoạt động học tập nghiên cứu kéo dài 8 tuần với chủ đề “Làm cho ngày mai của quê hương tốt đẹp hơn”.","b":0},{"s":"","z":"她鼓励学生寻找村子的问题，通过了解历史地理情况、采访村里的老人、小组讨论等，最终提出解决方案。","p":"Tā gǔlì xuésheng xúnzhǎo cūnzi de wèntí, tōngguò liǎojiě lìshǐ dìlǐ qíngkuàng, cǎifǎng cūn li de lǎorén, xiǎozǔ tǎolùn děng, zuìzhōng tíchū jiějué fāng'àn.","v":"Cô khuyến khích học sinh tìm ra những vấn đề của làng, thông qua việc tìm hiểu lịch sử, địa lý, phỏng vấn người già trong làng, thảo luận nhóm…, cuối cùng đưa ra phương án giải quyết.","b":0},{"s":"","z":"她和其他志愿者利用午休、周末等空闲时间给学生们指导和培训。","p":"Tā hé qítā zhìyuànzhě lìyòng wǔxiū, zhōumò děng kòngxián shíjiān gěi xuéshengmen zhǐdǎo hé péixùn.","v":"Cô cùng các tình nguyện viên khác tranh thủ giờ nghỉ trưa, cuối tuần và những lúc rảnh rỗi để hướng dẫn, bồi dưỡng cho học sinh.","b":0},{"s":"","z":"学生们说：“以前，我们总认为建设家乡是大人的事，用不着我们操心。","p":"Xuéshengmen shuō: “Yǐqián, wǒmen zǒng rènwéi jiànshè jiāxiāng shì dàren de shì, yòng bu zháo wǒmen cāoxīn.","v":"Các em học sinh nói: “Trước đây, chúng em luôn nghĩ xây dựng quê hương là việc của người lớn, chẳng cần chúng em bận tâm.","b":1},{"s":"","z":"不过，现在我们明白了，建设家乡，人人有责，我们也要承担这个义务。","p":"Búguò, xiànzài wǒmen míngbai le, jiànshè jiāxiāng, rénrén yǒu zé, wǒmen yě yào chéngdān zhège yìwù.","v":"Nhưng giờ chúng em đã hiểu: xây dựng quê hương là trách nhiệm của mọi người, chúng em cũng phải gánh vác nghĩa vụ này.","b":0},{"s":"","z":"这个任务很艰巨，我们要尽自己最大的力量。”","p":"Zhège rènwu hěn jiānjù, wǒmen yào jìn zìjǐ zuì dà de lìliàng.”","v":"Nhiệm vụ này rất gian nan, chúng em phải dốc hết sức mình.”","b":0},{"s":"","z":"郝琳硕觉得自己的收获远多于给孩子们的。","p":"Hǎo Línshuò juéde zìjǐ de shōuhuò yuǎn duō yú gěi háizimen de.","v":"Hách Lâm Thạc cảm thấy những gì mình nhận được còn nhiều hơn rất nhiều so với những gì mình đã cho các em.","b":0},{"s":"","z":"“不管以后在哪儿，我都会继续用我的力量影响山里的孩子们，因为他们是国家的未来与希望。”","p":"“Bùguǎn yǐhòu zài nǎr, wǒ dōu huì jìxù yòng wǒ de lìliàng yǐngxiǎng shān li de háizimen, yīnwèi tāmen shì guójiā de wèilái yǔ xīwàng.”","v":"“Dù sau này ở đâu, tôi vẫn sẽ tiếp tục dùng sức mình để tác động tới trẻ em vùng núi, vì các em là tương lai và hy vọng của đất nước.”","b":0}]}],"aud":[{"v":"audio/24-2.mp3","t":"audio/24-1.mp3"}],"gram":[{"id":"xingdong","t":"行动","s":"đi lại, cử động; hành động (động từ) – hoạt động, hành vi (danh từ)","b":"<b>行动</b> có ba cách dùng chính theo sách: (1) là <b>động từ</b>, chỉ việc đi lại, cử động cơ thể; (2) cũng là <b>động từ</b>, chỉ việc <b>bắt tay vào làm một hoạt động nào đó vì một mục đích</b>; (3) có thể làm <b>danh từ</b>, nghĩa là hoạt động, hành vi.","r":["Động từ – đi lại, cử động: 行动不便 (đi lại bất tiện), 单独行动 (đi lẻ, hoạt động một mình).","Động từ – bắt tay vào làm vì một mục đích: 提前行动 (hành động sớm), 开始行动 (bắt đầu hành động).","Danh từ – hoạt động, hành vi: 参加……行动 (tham gia hoạt động…), 采取行动 (hành động, ra tay)."],"e":[["他运动时受伤了，行动不便。","Tā yùndòng shí shòushāng le, xíngdòng búbiàn.","Anh ấy bị thương khi chơi thể thao, đi lại khó khăn."],["有些鸟类喜欢单独行动。","Yǒuxiē niǎolèi xǐhuan dāndú xíngdòng.","Có một số loài chim thích hoạt động đơn lẻ."],["做什么事他都喜欢提前行动，早做准备。","Zuò shénme shì tā dōu xǐhuan tíqián xíngdòng, zǎo zuò zhǔnbèi.","Làm việc gì anh ấy cũng thích bắt tay vào sớm, chuẩn bị trước."],["有的人总是怀疑计划不够准确而迟迟不能开始行动。","Yǒu de rén zǒngshì huáiyí jìhuà bú gòu zhǔnquè ér chíchí bù néng kāishǐ xíngdòng.","Có người cứ nghi ngờ kế hoạch chưa đủ chính xác nên mãi chẳng thể bắt đầu hành động."],["郝老师到云南参加支教行动。","Hǎo lǎoshī dào Yúnnán cānjiā zhījiào xíngdòng.","Cô Hách đến Vân Nam tham gia hoạt động dạy học tình nguyện."],["我们应该勇敢面对困难，迅速采取行动，主动承担责任。","Wǒmen yīnggāi yǒnggǎn miànduì kùnnan, xùnsù cǎiqǔ xíngdòng, zhǔdòng chéngdān zérèn.","Chúng ta nên dũng cảm đối mặt với khó khăn, nhanh chóng hành động và chủ động gánh vác trách nhiệm."]],"d":[["他运动时受伤了，____不便。","行动"],["有的人总是怀疑计划不够准确而迟迟不能开始____。","行动"],["我们应该勇敢面对困难，迅速采取____，主动承担责任。","行动"]],"w":"Đừng chỉ hiểu 行动 là “hành động” chung chung: trong 行动不便 nó là “đi lại, cử động”; còn trong tên bài 支教行动 nó là danh từ “hoạt động, chiến dịch”."},{"id":"yiwu","t":"义务","s":"nghĩa vụ (danh từ); không công, tình nguyện (tính từ)","b":"<b>义务</b> là <b>danh từ</b>, chỉ trách nhiệm phải gánh vác về mặt <b>pháp luật</b> hoặc <b>đạo đức</b>. Ngoài ra 义务 còn làm được <b>tính từ</b>, nghĩa là <b>không nhận thù lao</b> (làm không công, tình nguyện).","r":["Danh từ: 承担……义务 (gánh vác nghĩa vụ), 是……的义务和责任.","Tính từ (không nhận thù lao), thường đứng trước danh từ: 义务劳动 (lao động công ích không lương), 义务教育 (giáo dục bắt buộc, miễn phí)."],"e":[["不过，现在我们明白了，建设家乡，人人有责，我们也要承担这个义务。","Búguò, xiànzài wǒmen míngbai le, jiànshè jiāxiāng, rénrén yǒu zé, wǒmen yě yào chéngdān zhège yìwù.","Nhưng giờ chúng em đã hiểu: xây dựng quê hương là trách nhiệm của mọi người, chúng em cũng phải gánh vác nghĩa vụ này. <i>(bài khoá)</i>"],["参与社会事务和促进社会进步是每个人的权利，也是每个人的义务和责任。","Cānyù shèhuì shìwù hé cùjìn shèhuì jìnbù shì měi ge rén de quánlì, yě shì měi ge rén de yìwù hé zérèn.","Tham gia các công việc xã hội và thúc đẩy xã hội tiến bộ là quyền lợi của mỗi người, đồng thời cũng là nghĩa vụ và trách nhiệm của mỗi người."],["我们每个学期都要至少参加三次义务劳动。","Wǒmen měi ge xuéqī dōu yào zhìshǎo cānjiā sān cì yìwù láodòng.","Mỗi học kỳ chúng tôi phải tham gia ít nhất ba buổi lao động công ích."],["中国有关于九年制义务教育的法律。","Zhōngguó yǒu guānyú jiǔ nián zhì yìwù jiàoyù de fǎlǜ.","Trung Quốc có luật về giáo dục bắt buộc chín năm."]],"d":[["建设家乡，人人有责，我们也要承担这个____。","义务"],["我们每个学期都要至少参加三次____劳动。","义务"],["中国有关于九年制____教育的法律。","义务"]],"w":"Khi là tính từ, 义务 mang nghĩa “không lấy tiền”: 义务劳动 là lao động không công, chứ không phải “lao động bắt buộc theo luật”."},{"id":"fayan_fabiao","t":"发言 vs 发表","s":"phát biểu (trong họp/lớp) – công bố, đăng tải","b":"Điểm giống: <b>发言</b> và <b>发表</b> đều làm được <b>động từ</b> và đều liên quan đến việc <b>bày tỏ ý kiến</b>.","r":["Ý nghĩa: <b>发言</b> là nói trong cuộc họp hoặc trong giờ học; <b>发表</b> là chính thức bày tỏ ý kiến của mình với tập thể, xã hội, hoặc đăng bài trên báo, tạp chí.","Từ loại: <b>发言</b> làm được danh từ, chỉ ý kiến/bài phát biểu (他今天在会上的发言很精彩); <b>发表</b> không làm danh từ.","Cấu tạo: <b>发言</b> là từ ly hợp, ở giữa chen được thành phần khác (发过言), phía sau không mang tân ngữ; <b>发表</b> không phải từ ly hợp, mang tân ngữ được (发表文章, 发表意见).","lỗi hay gặp: ✗ 我准备公开发言我的意见。 → ✓ 我准备公开发表我的意见。"],"e":[["他上课从不发言，很多课不及格，平时也几乎不和同学交往。","Tā shàngkè cóng bù fāyán, hěn duō kè bù jígé, píngshí yě jīhū bù hé tóngxué jiāowǎng.","Trong giờ học cậu chưa bao giờ phát biểu, nhiều môn không đạt, ngày thường cũng hầu như không chơi với bạn bè. <i>(bài khoá)</i>"],["总统发表了有关两国关系的讲话。","Zǒngtǒng fābiǎole yǒuguān liǎng guó guānxì de jiǎnghuà.","Tổng thống đã có bài phát biểu về quan hệ giữa hai nước."],["他今天在会上的发言很精彩。","Tā jīntiān zài huì shang de fāyán hěn jīngcǎi.","Bài phát biểu của anh ấy trong cuộc họp hôm nay rất xuất sắc."],["你已经发过言了吗？","Nǐ yǐjīng fāguo yán le ma?","Bạn đã phát biểu rồi chưa?"],["你发表过这篇文章吗？","Nǐ fābiǎoguo zhè piān wénzhāng ma?","Bạn đã từng đăng bài viết này chưa?"]],"d":[["我准备公开____我的意见。","发表"],["明天上课该轮到我____了。","发言"],["总裁，这是明天会议的____，请您过目。","发言"],["她年纪虽小，已经在杂志上____过几首诗了。","发表"]],"w":"Mẹo: có tân ngữ phía sau (意见, 文章, 讲话…) hoặc nói chuyện đăng báo → dùng 发表; nói trong họp/lớp, hoặc cần danh từ “bài phát biểu” → dùng 发言. Muốn chen 过/了 thì tách: 发过言."}],"ext":[["测验","cèyàn","kiểm tra, bài kiểm tra"],["实验","shíyàn","thí nghiệm, thực nghiệm"],["抄","chāo","chép, sao chép"],["试卷","shìjuàn","bài thi, đề thi"],["夏令营","xiàlìngyíng","trại hè"],["操场","cāochǎng","sân tập, sân vận động (trường)"],["用功","yònggōng","chăm chỉ, siêng năng"],["辅导","fǔdǎo","phụ đạo, kèm cặp"],["收获","shōuhuò","thu hoạch, thành quả"],["铃","líng","chuông"],["退步","tuìbù","thụt lùi, sa sút"],["改正","gǎizhèng","sửa, sửa chữa (lỗi)"]],"extt":"教学2","notes":"Nguồn cuối bài khoá: 改编自“美丽中国”官网，题目自拟. Bài khoá 682 chữ (theo sách), 6 đoạn văn (tr.55–57), chia 4 phần: đoạn 1–2 (từ 1–13 + 3 专名) / đoạn 3 (từ 14–20) / đoạn 4 (từ 21–30) / đoạn 5–6 (từ 31–37). Từ số 1, 3, 9, 11, 21, 23 có dấu * (ngoài đề cương). Từ 21 青壮年 sách không ghi từ loại nên để trống pos; pinyin chép đúng sách “qīng-zhuàngnián”. Pinyin các từ ly hợp chép theo sách có khoảng cách (zhī jiào, fā yán, jí gé, gǔ zhǎng, cāo xīn); 力量 sách ghi lìliàng. Câu “……大山以后谁来负责”？” sách in dấu ？ sau dấu ngoặc kép, giữ nguyên; câu này và câu 4 (郝老师家访后得知……) dài >45 chữ nhưng không có ；nên giữ một dòng. Phần 注释 gồm 2 mục 词语例释 (行动, 义务) và 1 词语辨析 (发言—发表). Ví dụ (2) của 义务 sách có chú thích “事务（shìwù, công việc）”, “促进（cùjìn, thúc đẩy）”, đã bỏ chú thích khi chép câu. Drill 发言—发表 lấy từ 做一做 (câu (1) sách đã cho đáp án 发表; câu (2)(3)(4) đáp án do người soạn giải). 练一练 của 行动/义务 là bài hoàn thành câu mở, nên drill đặt dựa trên câu ví dụ của sách; dòng “lỗi hay gặp” trong thẻ 发言—发表 là do người soạn đặt từ câu 做一做 (1) theo quy tắc 3 của bảng. vocab_ex của 体贴, 温柔, 勇气, 闯, 建设 lấy từ 练习1 (đã điền đáp án); của 承担 từ 练习1 câu 6; của 力量 từ 练习2 (đã điền đáp án); của 行动 từ 注释 ví dụ (5); còn lại trích câu/vế câu trong bài khoá. Riêng 鼓掌: bài khoá chỉ có dạng tách 鼓起掌来 (không chứa liền 鼓掌), sách không có câu nào chứa liền 鼓掌, nên câu ví dụ “演出结束后，观众热烈鼓掌。” do người soạn đặt. Bảng 扩展 (话题: 教学2) trong sách chỉ có chữ Hán + pinyin, nghĩa tiếng Việt do người soạn bổ sung.","order":[{"z":"之后，赵福根学习用功了，成绩也逐渐进步。","t":["之后","赵福根","学习","用功","了","成绩","也","逐渐","进步"],"v":"Từ đó, Triệu Phúc Căn học hành chăm chỉ hơn, thành tích cũng dần tiến bộ."},{"z":"大山以后谁来负责”？","t":["大山","以后","谁","来","负责"],"v":"Cô Hách nhận ra thanh niên, trai tráng trong núi đều ra ngoài bôn ba, chỉ còn người già và trẻ con ở lại: “Họ đi rồi có còn quay về không? Sau này ai "},{"z":"这个任务很艰巨，我们要尽自己最大的力量。","t":["这个","任务","很","艰巨","我们","要","尽","自己","最大","的","力量"],"v":"Nhiệm vụ này rất gian nan, chúng em phải dốc hết sức mình.”"},{"z":"郝琳硕觉得自己的收获远多于给孩子们的。","t":["郝琳硕","觉得","自己","的","收获","远","多于","给","孩子","们","的"],"v":"Hách Lâm Thạc cảm thấy những gì mình nhận được còn nhiều hơn rất nhiều so với những gì mình đã cho các em."},{"z":"他运动时受伤了，行动不便。","t":["他","运动","时","受伤","了","行动不便"],"v":"Anh ấy bị thương khi chơi thể thao, đi lại khó khăn."},{"z":"有些鸟类喜欢单独行动。","t":["有些","鸟类","喜欢","单独","行动"],"v":"Có một số loài chim thích hoạt động đơn lẻ."},{"z":"做什么事他都喜欢提前行动，早做准备。","t":["做","什么","事","他","都","喜欢","提前","行动","早","做","准备"],"v":"Làm việc gì anh ấy cũng thích bắt tay vào sớm, chuẩn bị trước."},{"z":"郝老师到云南参加支教行动。","t":["郝","老师","到","云南","参加","支教","行动"],"v":"Cô Hách đến Vân Nam tham gia hoạt động dạy học tình nguyện."},{"z":"我们应该勇敢面对困难，迅速采取行动，主动承担责任。","t":["我们","应该","勇敢","面对","困难","迅速","采取行动","主动","承担责任"],"v":"Chúng ta nên dũng cảm đối mặt với khó khăn, nhanh chóng hành động và chủ động gánh vác trách nhiệm."},{"z":"
