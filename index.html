thường… <i>(bài khoá)</i>"},{"h":"评价","p":"píngjià","v":"đánh giá; sự đánh giá","k":"đgt./dt.","x":0,"ez":"观众对这部电影的评价就肯定不好。","ev":"Đánh giá của khán giả về bộ phim này chắc chắn sẽ không tốt. <i>(bài khoá)</i>"},{"h":"烂","p":"làn","v":"dở, tệ, thối rữa, rách nát","k":"tt.","x":0,"ez":"甚至会说这是一部“烂片”。","ev":"Thậm chí còn nói đây là một “phim dở”. <i>(bài khoá)</i>"},{"h":"主持","p":"zhǔchí","v":"chủ trì; người chủ trì","k":"đgt./dt.","x":0,"ez":"作为电视节目主持人，我在工作中常常会运用“峰终定律”。","ev":"Là người dẫn chương trình truyền hình, trong công việc tôi thường vận dụng “quy luật cao điểm – điểm cuối”. <i>(bài khoá)</i>"},{"h":"运用","p":"yùnyòng","v":"vận dụng, áp dụng","k":"đgt.","x":0,"ez":"学知识不能死记硬背，要懂得灵活地运用。","ev":"Học kiến thức không được học vẹt, phải biết vận dụng linh hoạt."},{"h":"开幕式","p":"kāimùshì","v":"lễ khai mạc","k":"dt.","x":0,"ez":"做节目时，与开幕式相比，我们宁可把更多的精力集中在闭幕式上。","ev":"Khi làm chương trình, so với lễ khai mạc, chúng tôi thà dồn nhiều công sức hơn vào lễ bế mạc. <i>(bài khoá)</i>"},{"h":"宁可","p":"nìngkě","v":"thà rằng, thà","k":"phó.","x":0,"ez":"作为母亲，她宁可自己累一点儿，也不想委屈了孩子。","ev":"Là mẹ, chị ấy thà bản thân vất vả một chút chứ không muốn để con phải chịu thiệt thòi."},{"h":"集中","p":"jízhōng","v":"tập trung; chăm chú","k":"đgt./tt.","x":0,"ez":"你复习时要集中注意力，效果才会好。","ev":"Khi ôn bài cậu phải tập trung chú ý thì hiệu quả mới tốt."},{"h":"体会","p":"tǐhuì","v":"hiểu rõ, nhận thức rõ; nhận thức","k":"đgt./dt.","x":0,"ez":"他们能从经验中体会这种做法的重要性。","ev":"Họ có thể cảm nhận được tầm quan trọng của cách làm này từ kinh nghiệm. <i>(bài khoá)</i>"}]],"texts":[{"no":1,"tz":"","tv":"","lines":[{"s":"","z":"我奶奶说过：“人们应该在最美好的时候离开。”","p":"Wǒ nǎinai shuōguo: “Rénmen yīnggāi zài zuì měihǎo de shíhou líkāi.”","v":"Bà tôi từng nói: “Con người nên rời đi vào lúc tốt đẹp nhất.”","b":0},{"s":"","z":"因为这个认知而获得诺贝尔奖的，不是我奶奶，而是心理学家丹尼尔·卡内曼。","p":"Yīnwèi zhège rènzhī ér huòdé Nuòbèi'ěr Jiǎng de, bú shì wǒ nǎinai, ér shì xīnlǐxuéjiā Dānní'ěr·Kǎnèimàn.","v":"Người nhận giải Nô-ben nhờ nhận thức này không phải là bà tôi, mà là nhà tâm lý học Daniel Kahneman.","b":0},{"s":"","z":"他将这一现象命名为“峰终定律”：我们对事物的记忆仅在高峰和结尾，而事情的经过对记忆几乎没有影响。","p":"Tā jiāng zhè yí xiànxiàng mìngmíng wéi “Fēngzhōng Dìnglǜ”: wǒmen duì shìwù de jìyì jǐn zài gāofēng hé jiéwěi, ér shìqing de jīngguò duì jìyì jīhū méiyǒu yǐngxiǎng.","v":"Ông gọi hiện tượng này là “quy luật cao điểm – điểm cuối”: ký ức của chúng ta về sự vật chỉ đọng lại ở thời điểm cao trào và phần kết, còn diễn biến của sự việc hầu như không ảnh hưởng gì đến ký ức.","b":0},{"s":"","z":"高峰之后，终点出现得越迅速，这件事留给我们的印象就越深刻。","p":"Gāofēng zhīhòu, zhōngdiǎn chūxiàn de yuè xùnsù, zhè jiàn shì liú gěi wǒmen de yìnxiàng jiù yuè shēnkè.","v":"Sau cao điểm, điểm kết thúc đến càng nhanh thì ấn tượng mà sự việc để lại cho chúng ta càng sâu sắc.","b":0},{"s":"","z":"大部分人不理解这一定律。","p":"Dà bùfen rén bù lǐjiě zhè yí dìnglǜ.","v":"Phần lớn mọi người không hiểu quy luật này.","b":1},{"s":"","z":"比如说为了一场戏剧演出，我们会投入很多时间，准备服装、化妆、道具、舞台美术，以创造良好的效果，争取给观众留下一个好的印象，却常常忽视结束退场时的准备。","p":"Bǐrú shuō wèile yì chǎng xìjù yǎnchū, wǒmen huì tóurù hěn duō shíjiān, zhǔnbèi fúzhuāng, huàzhuāng, dàojù, wǔtái měishù, yǐ chuàngzào liánghǎo de xiàoguǒ, zhēngqǔ gěi guānzhòng liúxià yí ge hǎo de yìnxiàng, què chángcháng hūshì jiéshù tuìchǎng shí de zhǔnbèi.","v":"Chẳng hạn, vì một buổi diễn kịch, chúng ta sẽ bỏ ra rất nhiều thời gian chuẩn bị trang phục, hoá trang, đạo cụ, mỹ thuật sân khấu để tạo ra hiệu quả tốt, cố gắng để lại ấn tượng đẹp cho khán giả, nhưng lại thường xem nhẹ việc chuẩn bị cho lúc kết thúc, rời sân khấu.","b":0},{"s":"","z":"演出开始时人们认为很有魅力，但是糟糕的结局会给人留下难以忘记的坏印象。","p":"Yǎnchū kāishǐ shí rénmen rènwéi hěn yǒu mèilì, dànshì zāogāo de jiéjú huì gěi rén liúxià nányǐ wàngjì de huài yìnxiàng.","v":"Lúc buổi diễn bắt đầu, mọi người thấy rất cuốn hút, nhưng một cái kết tồi tệ sẽ để lại ấn tượng xấu khó quên.","b":0},{"s":"","z":"有一次，我去参加一个婚礼，前三个小时感觉都很好，只在最后一个小时感到无聊。","p":"Yǒu yí cì, wǒ qù cānjiā yí ge hūnlǐ, qián sān ge xiǎoshí gǎnjué dōu hěn hǎo, zhǐ zài zuìhòu yí ge xiǎoshí gǎndào wúliáo.","v":"Có lần tôi đi dự một đám cưới, ba tiếng đầu cảm thấy đều rất ổn, chỉ có tiếng cuối cùng là thấy chán.","b":1},{"s":"","z":"三个小时快乐减一个小时无聊等于两个小时快乐，也就是说，我愉快地度过了两个小时。","p":"Sān ge xiǎoshí kuàilè jiǎn yí ge xiǎoshí wúliáo děngyú liǎng ge xiǎoshí kuàilè, yě jiù shì shuō, wǒ yúkuài de dùguòle liǎng ge xiǎoshí.","v":"Ba tiếng vui vẻ trừ đi một tiếng buồn chán bằng hai tiếng vui vẻ, tức là tôi đã trải qua hai tiếng đồng hồ vui vẻ.","b":0},{"s":"","z":"但是，我的记忆并不是这样计算的。","p":"Dànshì, wǒ de jìyì bìng bú shì zhèyàng jìsuàn de.","v":"Nhưng ký ức của tôi lại không hề tính toán như vậy.","b":0},{"s":"","z":"如果我参加另外一次活动，只在那里待一个小时，早早地告别，我却享受了满满60分钟的快乐。","p":"Rúguǒ wǒ cānjiā lìngwài yí cì huódòng, zhǐ zài nàli dāi yí ge xiǎoshí, zǎozǎo de gàobié, wǒ què xiǎngshòule mǎnmǎn liùshí fēnzhōng de kuàilè.","v":"Nếu tôi tham gia một hoạt động khác, chỉ ở đó một tiếng rồi sớm chào ra về, thì tôi lại được tận hưởng trọn vẹn 60 phút vui vẻ.","b":0},{"s":"","z":"与第一次相比，第二次的聚会留给我的印象更为美好。","p":"Yǔ dì-yī cì xiāngbǐ, dì-èr cì de jùhuì liú gěi wǒ de yìnxiàng gèng wéi měihǎo.","v":"So với lần đầu, buổi tụ họp lần thứ hai để lại cho tôi ấn tượng đẹp hơn.","b":0},{"s":"","z":"看电影也是如此。","p":"Kàn diànyǐng yě shì rúcǐ.","v":"Xem phim cũng vậy.","b":0},{"s":"","z":"一部电影，开始虽然剧情平平常常，如果最后半个小时能使我们感动，我们依然会向别人推荐它。","p":"Yí bù diànyǐng, kāishǐ suīrán jùqíng píngpíngchángcháng, rúguǒ zuìhòu bàn ge xiǎoshí néng shǐ wǒmen gǎndòng, wǒmen yīrán huì xiàng biérén tuījiàn tā.","v":"Một bộ phim dù lúc đầu tình tiết bình thường, nhưng nếu nửa tiếng cuối có thể khiến chúng ta cảm động, chúng ta vẫn sẽ giới thiệu nó cho người khác.","b":0},{"s":"","z":"相反，如果在前半个小时就把剧情的创造力表现得淋漓尽致，结尾却非常普通，那么，观众对这部电影的评价就肯定不好，甚至会说这是一部“烂片”。","p":"Xiāngfǎn, rúguǒ zài qián bàn ge xiǎoshí jiù bǎ jùqíng de chuàngzàolì biǎoxiàn de línlí jìnzhì, jiéwěi què fēicháng pǔtōng, nàme, guānzhòng duì zhè bù diànyǐng de píngjià jiù kěndìng bù hǎo, shènzhì huì shuō zhè shì yí bù “lànpiàn”.","v":"Ngược lại, nếu ngay trong nửa tiếng đầu đã phô hết mức sự sáng tạo của tình tiết, mà phần kết lại rất tầm thường, thì đánh giá của khán giả về bộ phim chắc chắn sẽ không tốt, thậm chí còn bảo đây là một “phim dở”.","b":0},{"s":"","z":"作为电视节目主持人，我在工作中常常会运用“峰终定律”。","p":"Zuòwéi diànshì jiémù zhǔchírén, wǒ zài gōngzuò zhōng chángcháng huì yùnyòng “Fēngzhōng Dìnglǜ”.","v":"Là người dẫn chương trình truyền hình, trong công việc tôi thường vận dụng “quy luật cao điểm – điểm cuối”.","b":1},{"s":"","z":"例如，做节目时，与开幕式相比，我们宁可把更多的精力集中在闭幕式上，这样可以加强观众对节目的印象。","p":"Lìrú, zuò jiémù shí, yǔ kāimùshì xiāngbǐ, wǒmen nìngkě bǎ gèng duō de jīnglì jízhōng zài bìmùshì shang, zhèyàng kěyǐ jiāqiáng guānzhòng duì jiémù de yìnxiàng.","v":"Ví dụ, khi làm chương trình, so với lễ khai mạc, chúng tôi thà dồn nhiều công sức hơn vào lễ bế mạc, như vậy có thể làm khán giả ấn tượng sâu hơn về chương trình.","b":0},{"s":"","z":"虽然很多人并不了解“峰终定律”，但是，他们能从经验中体会这种做法的重要性。","p":"Suīrán hěn duō rén bìng bù liǎojiě “Fēngzhōng Dìnglǜ”, dànshì, tāmen néng cóng jīngyàn zhōng tǐhuì zhè zhǒng zuòfǎ de zhòngyàoxìng.","v":"Tuy nhiều người không hề biết đến “quy luật cao điểm – điểm cuối”, nhưng họ có thể cảm nhận được tầm quan trọng của cách làm này từ chính kinh nghiệm.","b":0}]}],"aud":[{"v":"audio/17-2.mp3","t":"audio/17-1.mp3"}],"gram":[{"id":"yi","t":"以","s":"dùng, bằng (giới từ); để, nhằm (liên từ) — văn viết","b":"<b>以</b> thường dùng trong <b>văn viết</b>. Làm <b>giới từ</b>, nghĩa là “用、拿、凭借” (<i>dùng, lấy, dựa vào</i>), đứng trước danh từ chỉ phương tiện, cách thức. Làm <b>liên từ</b>, biểu thị <b>mục đích</b> (<i>để, nhằm</i>), đứng đầu vế sau, nối với hành động ở vế trước.","r":["Giới từ: 以 + danh từ + động từ: 以英文名WeChat进入国际市场 (vào thị trường quốc tế với tên tiếng Anh WeChat).","Hay gặp kết cấu 以 A 为 B: lấy A làm B — 以足球为比赛工具.","Liên từ: Vế 1 (hành động)，以 + động từ (mục đích): 坚持学习，以适应社会的发展.","Mang sắc thái trang trọng; trong khẩu ngữ thường dùng 用 (giới từ) hoặc 为了/好 (mục đích)."],"e":[["同年4月，（微信）以英文名WeChat正式进入国际市场。","Tóngnián sì yuè, (Wēixìn) yǐ Yīngwénmíng WeChat zhèngshì jìnrù guójì shìchǎng.","Tháng 4 cùng năm, (WeChat) chính thức bước vào thị trường quốc tế với tên tiếng Anh là WeChat."],["……学生分为甲乙两队，以足球为比赛工具向篮内投，按得分多少决定输赢。","……xuésheng fēnwéi jiǎ yǐ liǎng duì, yǐ zúqiú wéi bǐsài gōngjù xiàng lán nèi tóu, àn défēn duōshao juédìng shūyíng.","……Học sinh chia thành hai đội A và B, lấy quả bóng đá làm dụng cụ thi đấu để ném vào rổ, thắng thua quyết định theo số điểm ghi được."],["虽然我们已经老了，但还要坚持学习，以适应社会的发展。","Suīrán wǒmen yǐjīng lǎo le, dàn hái yào jiānchí xuéxí, yǐ shìyìng shèhuì de fāzhǎn.","Tuy chúng tôi đã già rồi nhưng vẫn phải kiên trì học tập để thích ứng với sự phát triển của xã hội."],["比如说为了一场戏剧演出，我们会投入很多时间，准备服装、化妆、道具、舞台美术，以创造良好的效果，……","Bǐrú shuō wèile yì chǎng xìjù yǎnchū, wǒmen huì tóurù hěn duō shíjiān, zhǔnbèi fúzhuāng, huàzhuāng, dàojù, wǔtái měishù, yǐ chuàngzào liánghǎo de xiàoguǒ, ……","Chẳng hạn, vì một buổi diễn kịch, chúng ta sẽ bỏ ra rất nhiều thời gian chuẩn bị trang phục, hoá trang, đạo cụ, mỹ thuật sân khấu để tạo ra hiệu quả tốt, … <i>(bài khoá)</i>"]],"d":[["大家要迅速地熟悉新产品，____更好地向顾客推广。","以"],["虽然我们已经老了，但还要坚持学习，____适应社会的发展。","以"],["同年4月，（微信）____英文名WeChat正式进入国际市场。","以"]],"w":"Khi là liên từ chỉ mục đích, 以 đứng ở <b>đầu vế sau</b> (không đứng đầu câu như 为了): ✓ 坚持学习，以适应…… / ✗ 以适应社会的发展，坚持学习。"},{"id":"pingchang","t":"平常","s":"bình thường (tính từ); ngày thường (danh từ)","b":"<b>平常</b> làm <b>tính từ</b> nghĩa là <i>bình thường, không có gì đặc biệt</i>; có thể lặp thành <b>平平常常</b>. Làm <b>danh từ</b> nghĩa giống “平时” (<i>ngày thường, lúc bình thường</i>), thường đứng trước động từ/làm trạng ngữ chỉ thời gian.","r":["Tính từ: 不平常的日子 (một ngày không bình thường), 剧情平平常常 (tình tiết bình thường).","Danh từ (= 平时): 他平常总是来得很早 — đứng sau chủ ngữ, trước động từ.","Cụm 像平常一样: như ngày thường.","Phân biệt với 平时: 平时 chỉ là danh từ, không làm vị ngữ tính từ — ✗ 这部电影很平时 → ✓ 这部电影很平常."],"e":[["对小王来说，今天是一个不平常的日子，因为他今天第一天上班。","Duì Xiǎo Wáng lái shuō, jīntiān shì yí ge bù píngcháng de rìzi, yīnwèi tā jīntiān dì-yī tiān shàngbān.","Với Tiểu Vương, hôm nay là một ngày không bình thường, vì hôm nay là ngày đầu tiên anh ấy đi làm."],["一部电影，开始虽然剧情平平常常，如果最后半个小时能使我们感动，我们依然会向别人推荐它。","Yí bù diànyǐng, kāishǐ suīrán jùqíng píngpíngchángcháng, rúguǒ zuìhòu bàn ge xiǎoshí néng shǐ wǒmen gǎndòng, wǒmen yīrán huì xiàng biérén tuījiàn tā.","Một bộ phim dù lúc đầu tình tiết bình thường, nhưng nếu nửa tiếng cuối có thể khiến chúng ta cảm động, chúng ta vẫn sẽ giới thiệu nó cho người khác. <i>(bài khoá)</i>"],["他平常总是来得很早，今天却迟到了。","Tā píngcháng zǒngshì lái de hěn zǎo, jīntiān què chídào le.","Ngày thường anh ấy luôn đến rất sớm, vậy mà hôm nay lại đi muộn."],["校长又告诉老师们，对待这些孩子，要像平常一样，不要让孩子或家长知道他们是被选出来的。","Xiàozhǎng yòu gàosu lǎoshīmen, duìdài zhèxiē háizi, yào xiàng píngcháng yíyàng, bú yào ràng háizi huò jiāzhǎng zhīdào tāmen shì bèi xuǎn chulai de.","Hiệu trưởng còn dặn các thầy cô đối xử với những đứa trẻ này như ngày thường, đừng để các em hay phụ huynh biết các em là người được chọn ra."]],"d":[["这部电影很____，我觉得没必要去看。","平常"],["他____总是来得很早，今天却迟到了。","平常"],["对小王来说，今天是一个不____的日子，因为他今天第一天上班。","平常"]],"w":"平常 vừa là tính từ vừa là danh từ; 平时 chỉ là danh từ. Sau 很 / làm định ngữ chỉ tính chất → dùng 平常."},{"id":"ningke","t":"宁可","s":"thà, thà rằng (phó từ)","b":"<b>宁可</b> là <b>phó từ</b>, biểu thị sau khi đã <b>so sánh</b> hai khả năng thì chọn phía <b>tương đối có lợi</b> hơn (dù phía đó có thể phải chịu thiệt một chút). Đứng sau chủ ngữ, trước động từ.","r":["宁可 A，也不 / 也不想 B: thà A chứ không B — 她宁可自己累一点儿，也不想委屈了孩子.","宁可 A，也要 B: thà chịu A cũng phải đạt B — 我宁可多花点儿钱，也要买一个质量好点儿的.","Có thể đi cùng 与……相比 để nêu rõ sự so sánh: 与开幕式相比，我们宁可…….","Vị trí: chủ ngữ + 宁可 + động từ — ✗ 宁可我多花点儿钱 → ✓ 我宁可多花点儿钱."],"e":[["作为母亲，她宁可自己累一点儿，也不想委屈了孩子。","Zuòwéi mǔqīn, tā nìngkě zìjǐ lèi yìdiǎnr, yě bù xiǎng wěiqu le háizi.","Là mẹ, chị ấy thà bản thân vất vả một chút chứ không muốn để con phải chịu thiệt thòi."],["为什么大家宁可挤成一团，也不去没人的那边？","Wèi shénme dàjiā nìngkě jǐ chéng yì tuán, yě bú qù méi rén de nàbiān?","Tại sao mọi người thà chen chúc dồn lại một chỗ chứ không sang phía bên kia không có ai?"],["……做节目时，与开幕式相比，我们宁可把更多的精力集中在闭幕式上，……","……zuò jiémù shí, yǔ kāimùshì xiāngbǐ, wǒmen nìngkě bǎ gèng duō de jīnglì jízhōng zài bìmùshì shang, ……","…Khi làm chương trình, so với lễ khai mạc, chúng tôi thà dồn nhiều công sức hơn vào lễ bế mạc, … <i>(bài khoá)</i>"]],"d":[["我____多花点儿钱，也要买一个质量好点儿的。","宁可"],["作为母亲，她____自己累一点儿，也不想委屈了孩子。","宁可"],["为什么大家____挤成一团，也不去没人的那边？","宁可"]],"w":"宁可 thường đi theo cặp với 也 ở vế sau (也不…… / 也要……)."},{"id":"hushi_qingshi","t":"忽视 vs 轻视","s":"xem nhẹ, không chú ý / coi thường, coi nhẹ","b":"Điểm giống: cả hai đều biểu thị <b>không chú ý, không coi trọng</b>; trong một số câu có thể thay thế cho nhau, nhưng ý nhấn mạnh khác nhau. Ví dụ: 他只注重理论，忽视/轻视实践，所以失败了。","r":["忽视 nhấn mạnh <b>không nghĩ tới, không để ý tới</b>: 他忙得忽视了去医院看病。","轻视 nhấn mạnh <b>coi thường, xem không ra gì</b>: 你可别轻视他，他看起来很平常，其实很能干。","Về thái độ, 忽视 có thể là <b>vô ý</b> cũng có thể là <b>cố ý</b>.","Về thái độ, 轻视 thường là <b>cố ý</b> hoặc <b>có chọn lọc</b>: 虽然这是一次小考，你也不能轻视，要好好复习。"],"e":[["他只注重理论，忽视/轻视实践，所以失败了。","Tā zhǐ zhùzhòng lǐlùn, hūshì/qīngshì shíjiàn, suǒyǐ shībài le.","Anh ta chỉ chú trọng lý thuyết mà xem nhẹ thực tiễn, nên đã thất bại."],["他忙得忽视了去医院看病。","Tā máng de hūshìle qù yīyuàn kànbìng.","Anh ấy bận đến mức quên mất cả việc đi bệnh viện khám bệnh."],["我们常常忽视结束退场时的准备，演出开始时人们认为很有魅力，但是糟糕的结局会给人留下难以忘记的坏印象。","Wǒmen chángcháng hūshì jiéshù tuìchǎng shí de zhǔnbèi, yǎnchū kāishǐ shí rénmen rènwéi hěn yǒu mèilì, dànshì zāogāo de jiéjú huì gěi rén liúxià nányǐ wàngjì de huài yìnxiàng.","Chúng ta thường xem nhẹ việc chuẩn bị cho lúc kết thúc, rời sân khấu; lúc buổi diễn bắt đầu mọi người thấy rất cuốn hút, nhưng một cái kết tồi tệ sẽ để lại ấn tượng xấu khó quên."],["你可别轻视他，他看起来很平常，其实很能干。","Nǐ kě bié qīngshì tā, tā kàn qilai hěn píngcháng, qíshí hěn nénggàn.","Cậu đừng có coi thường anh ta, trông anh ta có vẻ bình thường nhưng thật ra rất giỏi giang."],["虽然这是一次小考，你也不能轻视，要好好复习。","Suīrán zhè shì yí cì xiǎokǎo, nǐ yě bù néng qīngshì, yào hǎohāo fùxí.","Dù đây chỉ là một bài kiểm tra nhỏ, cậu cũng không được coi nhẹ, phải ôn tập cho tốt."]],"d":[["以前我们____了教育问题，现在要赶上去。","忽视"],["我们过多地看电视、玩手机，____了家人之间的交流。","忽视"],["虽然这是一份平常的工作，你也不能____，要认真做好。","轻视"],["你不要因为他是小孩子就____他。","轻视"]],"w":"Mẹo: “quên/không để ý tới” → 忽视; “coi thường, xem không ra gì” (thường có thái độ chủ ý) → 轻视."}],"ext":[["诊断","zhěnduàn","chẩn đoán"],["手术","shǒushù","phẫu thuật"],["血","xiě/xuè","máu"],["肌肉","jīròu","cơ bắp"],["骨头","gǔtou","xương"],["胃","wèi","dạ dày"],["心脏","xīnzàng","tim"],["病毒","bìngdú","vi-rút"],["传染","chuánrǎn","lây nhiễm, truyền nhiễm"],["寿命","shòumìng","tuổi thọ"]],"extt":"医务2","notes":"Nguồn cuối bài khoá: 改编自《广州日报》，作者：埃卡特·冯·希施豪森，陈晓川译. Bài khoá 644 chữ, 5 đoạn trong sách (tr.154–156), chia thành 4 phần: đoạn 1 (từ 1–5 + 3 专名) / đoạn 2 (từ 6–17, tràn từ tr.154 sang tr.155) / đoạn 3–4 (từ 18–27) / đoạn 5 (từ 28–33, tr.156). Từ có dấu * (ngoài đề cương): 2, 3, 9, 10, 25. Từ 25 淋漓尽致 sách không ghi từ loại (để trống pos). Pinyin từ 9 chép theo sách là “huà zhuāng” (có cách). Câu thứ 2 của đoạn 2 dài >45 chữ nhưng không có ；nên giữ nguyên một câu. Phần 注释 gồm 3 mục 词语例释 (以, 平常, 宁可) và 1 词语辨析 (忽视—轻视); bảng 词语搭配 không đưa vào schema. Ví dụ (2) của 宁可 trong sách có chú âm “挤（jǐ, dồn lại）”, đã bỏ phần chú âm trong câu zh. Ví dụ 忽视 ở bảng 辨析 là câu bài khoá được sách viết lại (không nguyên văn) nên không đánh dấu (bài khoá). Drill của 以 lấy từ 练习2① và ví dụ của sách; của 平常 lấy từ 练习2③ và ví dụ của sách; của 宁可 lấy từ 练习3④ và ví dụ của sách (练一练 đều là bài hoàn thành câu mở); drill của 忽视—轻视 lấy từ 做一做 (câu (1) sách đã cho đáp án 忽视), đáp án (2)–(4) do người soạn giải. vocab_ex của 迅速, 深刻, 争取, 忽视, 度过, 依然, 推荐, 运用, 集中 lấy từ câu bài tập/做一做 của sách (đã điền đáp án); của 以, 平常, 宁可 lấy từ phần 注释; còn lại trích câu/vế câu trong bài khoá. Bảng 扩展 (医务2) trong sách chỉ có chữ Hán + pinyin, nghĩa tiếng Việt do người soạn bổ sung.","order":[{"z":"大部分人不理解这一定律。","t":["大部分","人","不","理解","这一","定律"], ,"k":"dt.","x":0,"ez":"如果没有可靠的证据，你就不能这么说。","ev":"Nếu không có bằng chứng đáng tin cậy thì anh không thể nói như vậy."},{"h":"话题","p":"huàtí","v":"chủ đề, đề tài","k":"dt.","x":0,"ez":"我们的大脑究竟如何感知抽象艺术，是一个有趣的话题。","ev":"Rốt cuộc bộ não của chúng ta cảm nhận nghệ thuật trừu tượng như thế nào là một đề tài thú vị."}]],"texts":[{"no":1,"tz":"","tv":"","lines":[{"s":"","z":"对有些人来说，抽象艺术没有古典艺术那么容易欣赏，画布上那些不规则的色块、线条，实在看不出有什么意义。","p":"Duì yǒuxiē rén lái shuō, chōuxiàng yìshù méiyǒu gǔdiǎn yìshù nàme róngyì xīnshǎng, huàbù shang nàxiē bù guīzé de sèkuài, xiàntiáo, shízài kàn bu chū yǒu shénme yìyì.","v":"Với một số người, nghệ thuật trừu tượng không dễ thưởng thức như nghệ thuật cổ điển; những mảng màu, đường nét lộn xộn trên vải vẽ thật sự chẳng nhìn ra có ý nghĩa gì.","b":0},{"s":"","z":"抽象派画家的作品中经常见到好像随便洒上颜料而形成的画作，在有人看来极其神秘甚至丑陋，有人却从中感受到对自由、对生命的赞美。","p":"Chōuxiàngpài huàjiā de zuòpǐn zhōng jīngcháng jiàndào hǎoxiàng suíbiàn sǎshang yánliào ér xíngchéng de huàzuò, zài yǒu rén kànlái jíqí shénmì shènzhì chǒulòu, yǒu rén què cóng zhōng gǎnshòu dào duì zìyóu, duì shēngmìng de zànměi.","v":"Trong tác phẩm của các họa sĩ trường phái trừu tượng thường thấy những bức tranh trông như được tạo nên từ việc vẩy màu tùy tiện; có người thấy chúng vô cùng bí ẩn, thậm chí xấu xí, nhưng có người lại cảm nhận được trong đó lời ca ngợi tự do và sự sống.","b":0},{"s":"","z":"研究者设计了一个有趣的实验。","p":"Yánjiūzhě shèjìle yí ge yǒuqù de shíyàn.","v":"Các nhà nghiên cứu đã thiết kế một thí nghiệm thú vị.","b":0},{"s":"","z":"志愿者的任务很简单，每个人会看到两两一组出现的一些图画，每组中一幅出自著名抽象艺术家之手，另一幅是业余爱好者、婴儿、黑猩猩或者大象的涂鸦。","p":"Zhìyuànzhě de rènwu hěn jiǎndān, měi ge rén huì kàndào liǎngliǎng yì zǔ chūxiàn de yìxiē túhuà, měi zǔ zhōng yì fú chūzì zhùmíng chōuxiàng yìshùjiā zhī shǒu, lìng yì fú shì yèyú àihàozhě, yīng'ér, hēixīngxing huòzhě dàxiàng de túyā.","v":"Nhiệm vụ của tình nguyện viên rất đơn giản: mỗi người sẽ xem một loạt tranh xuất hiện theo từng cặp, mỗi cặp có một bức do một họa sĩ trừu tượng nổi tiếng vẽ, bức còn lại là nét vẽ nguệch ngoạc của người vẽ nghiệp dư, trẻ sơ sinh, tinh tinh hoặc voi.","b":0},{"s":"","z":"志愿者必须判断每一组画作中自己更喜欢哪一幅。","p":"Zhìyuànzhě bìxū pànduàn měi yì zǔ huàzuò zhōng zìjǐ gèng xǐhuan nǎ yì fú.","v":"Tình nguyện viên phải xác định trong mỗi cặp tranh, mình thích bức nào hơn.","b":0},{"s":"","z":"其中三分之一的画作作者没有签名，而其余的则标明了身份。","p":"Qízhōng sān fēn zhī yī de huàzuò zuòzhě méiyǒu qiānmíng, ér qíyú de zé biāomíngle shēnfèn.","v":"Trong số đó, một phần ba số tranh không có chữ ký của tác giả, còn những bức còn lại thì ghi rõ danh tính.","b":1},{"s":"","z":"令人头疼的是，一些签名被故意弄错了，志愿者无法确认作者到底是谁，所以有可能志愿者认为自己看到的是黑猩猩的随手涂鸦，实际则是著名抽象艺术家的大作。","p":"Lìng rén tóuténg de shì, yìxiē qiānmíng bèi gùyì nòngcuò le, zhìyuànzhě wúfǎ quèrèn zuòzhě dàodǐ shì shéi, suǒyǐ yǒu kěnéng zhìyuànzhě rènwéi zìjǐ kàndào de shì hēixīngxing de suíshǒu túyā, shíjì zé shì zhùmíng chōuxiàng yìshùjiā de dàzuò.","v":"Điều gây đau đầu là một số chữ ký đã bị cố ý ghi sai, tình nguyện viên không thể xác nhận rốt cuộc tác giả là ai; vì vậy rất có thể tình nguyện viên tưởng mình đang xem nét vẽ nguệch ngoạc tiện tay của một con tinh tinh, nhưng thực ra đó lại là kiệt tác của một họa sĩ trừu tượng nổi tiếng.","b":0},{"s":"","z":"也许有人认为，在这种情况下根本不可能分辨出来。","p":"Yěxǔ yǒu rén rènwéi, zài zhè zhǒng qíngkuàng xià gēnběn bù kěnéng fēnbiàn chūlai.","v":"Có lẽ có người cho rằng trong tình huống như vậy thì hoàn toàn không thể phân biệt được.","b":0},{"s":"","z":"然而在每一次测试中，志愿者普遍更喜欢的作品都是由人类艺术家挥笔完成的。","p":"Rán'ér zài měi yí cì cèshì zhōng, zhìyuànzhě pǔbiàn gèng xǐhuan de zuòpǐn dōu shì yóu rénlèi yìshùjiā huī bǐ wánchéng de.","v":"Thế nhưng trong mọi lần thử nghiệm, những tác phẩm mà tình nguyện viên nhìn chung thích hơn đều do họa sĩ là con người vung bút hoàn thành.","b":0},{"s":"","z":"由此可见，志愿者能够从画作中感知艺术家的用心，哪怕他们不能够解释原因。","p":"Yóucǐ kějiàn, zhìyuànzhě nénggòu cóng huàzuò zhōng gǎnzhī yìshùjiā de yòngxīn, nǎpà tāmen bù nénggòu jiěshì yuányīn.","v":"Từ đó có thể thấy, tình nguyện viên có thể cảm nhận được tâm huyết của người nghệ sĩ qua bức tranh, cho dù họ không giải thích được lý do.","b":0},{"s":"","z":"另一个实验是这样，志愿者同时欣赏原作和画面元素被调整后的画作，包括静物画和抽象画。","p":"Lìng yí ge shíyàn shì zhèyàng, zhìyuànzhě tóngshí xīnshǎng yuánzuò hé huàmiàn yuánsù bèi tiáozhěng hòu de huàzuò, bāokuò jìngwùhuà hé chōuxiànghuà.","v":"Một thí nghiệm khác như sau: tình nguyện viên cùng lúc xem bản gốc và bức tranh đã bị điều chỉnh các yếu tố trong khung hình, gồm cả tranh tĩnh vật lẫn tranh trừu tượng.","b":1},{"s":"","z":"结果，几乎每个人都更喜欢原作。","p":"Jiéguǒ, jīhū měi ge rén dōu gèng xǐhuan yuánzuò.","v":"Kết quả là hầu như ai cũng thích bản gốc hơn.","b":0},{"s":"","z":"研究者发现，当看到画上物体位置变化后，大脑中有关含意和解释的区域活跃性下降了。","p":"Yánjiūzhě fāxiàn, dāng kàndào huà shang wùtǐ wèizhì biànhuà hòu, dànǎo zhōng yǒuguān hányì hé jiěshì de qūyù huóyuèxìng xiàjiàng le.","v":"Các nhà nghiên cứu phát hiện, khi thấy vị trí các vật thể trong tranh bị thay đổi, mức độ hoạt động của vùng não liên quan đến hàm ý và việc lý giải đã giảm xuống.","b":0},{"s":"","z":"这表明，我们的大脑注意到了原作的布局，并且可以感知其背后的用意，即使我们还没有清楚地感受到这个事实。","p":"Zhè biǎomíng, wǒmen de dànǎo zhùyì dàole yuánzuò de bùjú, bìngqiě kěyǐ gǎnzhī qí bèihòu de yòngyì, jíshǐ wǒmen hái méiyǒu qīngchu de gǎnshòu dào zhège shìshí.","v":"Điều này cho thấy bộ não chúng ta đã chú ý đến bố cục của bản gốc và có thể cảm nhận được dụng ý đằng sau nó, ngay cả khi bản thân chúng ta chưa nhận thức rõ sự thật này.","b":0},{"s":"","z":"至少目前可以这么说，没有证据表明黑猩猩或儿童可以这样做。","p":"Zhìshǎo mùqián kěyǐ zhème shuō, méiyǒu zhèngjù biǎomíng hēixīngxing huò értóng kěyǐ zhèyàng zuò.","v":"Ít nhất hiện nay có thể nói rằng chưa có bằng chứng nào cho thấy tinh tinh hay trẻ em làm được như vậy.","b":0},{"s":"","z":"我们的大脑究竟如何感知抽象艺术，是一个有趣的话题。","p":"Wǒmen de dànǎo jiūjìng rúhé gǎnzhī chōuxiàng yìshù, shì yí ge yǒuqù de huàtí.","v":"Rốt cuộc bộ não của chúng ta cảm nhận nghệ thuật trừu tượng như thế nào là một đề tài thú vị.","b":0},{"s":"","z":"每个人对抽象艺术可以有不同的解读，这既是挑战，也是自由。","p":"Měi ge rén duì chōuxiàng yìshù kěyǐ yǒu bù tóng de jiědú, zhè jì shì tiǎozhàn, yě shì zìyóu.","v":"Mỗi người có thể có cách hiểu khác nhau về nghệ thuật trừu tượng, đó vừa là thử thách, vừa là tự do.","b":0}]}],"aud":[{"v":"audio/18-2.mp3","t":"audio/18-1.mp3"}],"gram":[{"id":"jiqi","t":"极其","s":"vô cùng, hết sức (phó từ)","b":"<b>极其</b> là <b>phó từ</b>, nghĩa là “非常” (rất, vô cùng), chủ yếu dùng trong <b>văn viết</b>. Nó <b>chỉ bổ nghĩa cho tính từ hai âm tiết hoặc nhiều âm tiết</b>, đứng ngay trước tính từ đó.","r":["Cấu trúc: 极其 + tính từ hai/nhiều âm tiết: 极其少见、极其糟糕、极其神秘.","Mang sắc thái trang trọng, sách vở; trong khẩu ngữ thường dùng 非常.","Lỗi hay gặp: ✗ 那个人长得极其丑。 → ✓ 那个人长得非常丑。 (丑 là tính từ một âm tiết — 练习 2①)"],"e":[["在中国，餐桌上放一把刀是极其少见的现象。","Zài Zhōngguó, cānzhuō shang fàng yì bǎ dāo shì jíqí shǎojiàn de xiànxiàng.","Ở Trung Quốc, đặt một con dao trên bàn ăn là chuyện cực kỳ hiếm thấy."],["每天说“太糟糕了”“太讨厌了”“真倒霉”的人，遇到的困难也格外多，运气也显得极其糟糕。","Měi tiān shuō “tài zāogāo le” “tài tǎoyàn le” “zhēn dǎoméi” de rén, yùdào de kùnnan yě géwài duō, yùnqì yě xiǎnde jíqí zāogāo.","Người ngày nào cũng than “tệ quá”, “chán quá”, “xui thật” thì gặp khó khăn cũng nhiều hơn hẳn, vận may cũng có vẻ cực kỳ tệ hại."],["抽象派画家的作品中经常见到好像随便洒上颜料而形成的画作，在有人看来极其神秘甚至丑陋，……","Chōuxiàngpài huàjiā de zuòpǐn zhōng jīngcháng jiàndào hǎoxiàng suíbiàn sǎshang yánliào ér xíngchéng de huàzuò, zài yǒu rén kànlái jíqí shénmì shènzhì chǒulòu, ……","Trong tác phẩm của các họa sĩ trường phái trừu tượng thường thấy những bức tranh trông như được tạo nên từ việc vẩy màu tùy tiện, có người thấy chúng vô cùng bí ẩn, thậm chí xấu xí… <i>(bài khoá)</i>"]],"d":[["我对这个人____欣赏，我认为他很有才华。","极其"],["在中国，餐桌上放一把刀是____少见的现象。","极其"],["抽象派画家的作品在有人看来____神秘甚至丑陋。","极其"]],"w":"极其 không đi với tính từ một âm tiết: nói 非常丑, không nói 极其丑. Khẩu ngữ hằng ngày ưu tiên 非常."},{"id":"qiyu","t":"其余","s":"phần còn lại, những cái khác (đại từ)","b":"<b>其余</b> là <b>đại từ</b>, chỉ <b>phần còn lại, phần khác</b> ngoài phần đã nhắc tới. Có thể đứng trước danh từ (其余的同学、其余窗户) hoặc dùng độc lập làm chủ ngữ với 的 (其余的).","r":["其余 + (的) + danh từ: 其余的同学、其余窗户.","Dùng độc lập: 其余的 (những cái/người còn lại), thường làm chủ ngữ ở vế sau.","Hay đi cặp với vế trước nêu một phần: 只有……，其余……都……；其中……，而其余的则……"],"e":[["怎么只有你们两个人？其余的同学呢？","Zěnme zhǐ yǒu nǐmen liǎng ge rén? Qíyú de tóngxué ne?","Sao chỉ có hai em thế? Các bạn còn lại đâu?"],["只有一个房间亮着灯，其余窗户都是黑的。","Zhǐ yǒu yí ge fángjiān liàngzhe dēng, qíyú chuānghu dōu shì hēi de.","Chỉ có một phòng sáng đèn, các cửa sổ còn lại đều tối om."],["其中三分之一的画作作者没有签名，而其余的则标明了身份。","Qízhōng sān fēn zhī yī de huàzuò zuòzhě méiyǒu qiānmíng, ér qíyú de zé biāomíngle shēnfèn.","Trong số đó, một phần ba số tranh không có chữ ký của tác giả, còn những bức còn lại thì ghi rõ danh tính. <i>(bài khoá)</i>"]],"d":[["我只认识这两个字，____都不认识。","其余"],["怎么只有你们两个人？____的同学呢？","其余"],["只有一个房间亮着灯，____窗户都是黑的。","其余"]],"w":""},{"id":"kejian","t":"可见","s":"có thể thấy, đủ thấy (liên từ)","b":"<b>可见</b> là <b>liên từ</b>, thường dùng theo khuôn “……，（由此）可见……”, biểu thị <b>có thể dựa vào tình huống vừa nêu ở trên để đưa ra phán đoán, kết luận</b>. Vế trước nêu sự việc/căn cứ, vế sau bắt đầu bằng 可见 hoặc 由此可见 nêu kết luận.","r":["Căn cứ，可见 + kết luận: 一直诊断不出是什么问题，可见情况不太好。","由此可见 + kết luận: thường đứng đầu câu mới, tổng kết điều vừa trình bày.","可见 luôn đứng sau phần căn cứ, không đặt ở đầu đoạn khi chưa có thông tin phía trước."],"e":[["他已经住院好几天了，一直诊断不出是什么问题，可见情况不太好。","Tā yǐjīng zhùyuàn hǎo jǐ tiān le, yìzhí zhěnduàn bu chū shì shénme wèntí, kějiàn qíngkuàng bú tài hǎo.","Anh ấy nằm viện mấy ngày rồi mà vẫn chưa chẩn đoán ra bệnh gì, đủ thấy tình hình không mấy khả quan."],["汉语中有个成语叫“自知之明”，把“自知”称为“明”，可见“自知”是一种智慧。","Hànyǔ zhōng yǒu ge chéngyǔ jiào “zìzhī zhī míng”, bǎ “zìzhī” chēngwéi “míng”, kějiàn “zìzhī” shì yì zhǒng zhìhuì.","Tiếng Hán có thành ngữ “自知之明” (sáng suốt vì biết mình), gọi việc “tự biết mình” là “sáng suốt”, đủ thấy “tự biết mình” là một loại trí tuệ."],["由此可见，志愿者能够从画作中感知艺术家的用心，哪怕他们不能够解释原因。","Yóucǐ kějiàn, zhìyuànzhě nénggòu cóng huàzuò zhōng gǎnzhī yìshùjiā de yòngxīn, nǎpà tāmen bù nénggòu jiěshì yuányīn.","Từ đó có thể thấy, tình nguyện viên có thể cảm nhận được tâm huyết của người nghệ sĩ qua bức tranh, cho dù họ không giải thích được lý do. <i>(bài khoá)</i>"]],"d":[["他已经住院好几天了，一直诊断不出是什么问题，____情况不太好。","可见"],["由此____，志愿者能够从画作中感知艺术家的用心。","可见"],["把“自知”称为“明”，____“自知”是一种智慧。","可见"]],"w":"Đừng nhầm liên từ 可见 (đủ thấy, suy ra) với cụm 可以看见 (nhìn thấy được)."},{"id":"muqian_xianzai","t":"目前 vs 现在","s":"hiện nay, trước mắt – bây giờ, hiện tại","b":"<b>目前</b> và <b>现在</b> đều là <b>danh từ chỉ thời gian</b>, chỉ thời điểm đang nói, thường có thể thay thế cho nhau. Ví dụ: 至少目前/现在可以这么说，没有证据表明黑猩猩或儿童可以这样做。","r":["目前 thường nhấn mạnh <b>một khoảng thời gian tính từ trước cho tới hiện tại</b>: 到目前为止，事情还没有变化。","现在 có thể chỉ một khoảng thời gian hoặc một <b>thời điểm</b>, còn có thể nhấn mạnh sự <b>đối lập với trước kia</b>: 我现在就去。","目前 <b>không</b> đi với từ chỉ thời gian cụ thể; 现在 <b>có thể</b>: 现在是北京时间上午十点钟。 (✗ 目前是北京时间上午十点钟)"],"e":[["至少目前可以这么说，没有证据表明黑猩猩或儿童可以这样做。","Zhìshǎo mùqián kěyǐ zhème shuō, méiyǒu zhèngjù biǎomíng hēixīngxing huò értóng kěyǐ zhèyàng zuò.","Ít nhất hiện nay có thể nói rằng chưa có bằng chứng nào cho thấy tinh tinh hay trẻ em làm được như vậy. <i>(bài khoá)</i>"],["到目前为止，事情还没有变化。","Dào mùqián wéizhǐ, shìqing hái méiyǒu biànhuà.","Cho đến nay, sự việc vẫn chưa có thay đổi gì."],["我现在就去。","Wǒ xiànzài jiù qù.","Tôi đi ngay bây giờ."],["现在是北京时间上午十点钟。","Xiànzài shì Běijīng shíjiān shàngwǔ shí diǎn zhōng.","Bây giờ là 10 giờ sáng giờ Bắc Kinh."]],"d":[["我们很着急，你____能过来一趟吗？","现在"],["选择性失忆____还无法治疗。","目前/现在"],["调查显示，66.9%的女性对____的工作不满意。","目前/现在"],["____的年轻人，跟我们那时候真不一样！","现在"]],"w":"Muốn nói “ngay bây giờ” (一个时间点) hoặc đi với giờ giấc cụ thể → dùng 现在. So sánh với ngày xưa (现在的年轻人…) → 现在. “到目前为止” là cụm cố định."}],"ext":[["导演","dǎoyǎn","đạo diễn"],["角色","juésè","vai diễn, nhân vật"],["明星","míngxīng","ngôi sao"],["动画片","dònghuàpiàn","phim hoạt hình"],["娱乐","yúlè","giải trí"],["录音","lù yīn","ghi âm"],["麦克风","màikèfēng","micrô"],["频道","píndào","kênh (truyền hình)"],["字幕","zìmù","phụ đề"],["乐器","yuèqì","nhạc cụ"],["美术","měishù","mỹ thuật"]],"extt":"影视艺术","notes":"Nguồn cuối bài khoá: 改编自《科学画报》，作者：周静嫣. Bài khoá 634 chữ (theo sách), 6 đoạn văn trong sách (tr.162–164), chia thành 3 phần: đoạn 1–2 (từ 1–20) / đoạn 3–4 (từ 21–29) / đoạn 5–6 (từ 30–40). Bài không có mục 专名. Từ số 18, 19, 20, 26, 30, 33, 34, 36 có dấu * (ngoài đề cương). Từ 11 chép theo sách là “丑（陋）” chou (lou), nên câu ví dụ chứa “丑陋” chứ không chứa nguyên dạng có ngoặc. Pinyin 录音 trong bảng 扩展 sách in “lù yīn” (có cách). Một số câu bài khoá dài >45 chữ nhưng không có ；nên giữ nguyên một dòng. Phần 注释 gồm 3 mục 词语例释 (极其, 其余, 可见) và 1 词语辨析 (目前—现在). Ví dụ (2) của 极其: sách có chú thích trong ngoặc “倒霉（dǎoméi, xui xẻo）”, “运气（yùnqì, vận may）”, đã bỏ phần chú thích khi chép câu. Drill: 极其 ① lấy từ 练习3① (đáp án vị trí B); 其余 ① từ 练习3③; các drill khác của 极其/其余/可见 đặt dựa trên câu ví dụ của sách vì 练一练 là bài hoàn thành câu mở; drill 目前—现在 lấy từ 做一做 (câu (1) sách đã cho đáp án 现在; câu (2)(3) đáp án do người soạn giải, cả hai từ đều dùng được). vocab_ex của 欣赏, 布, 幅, 业余, 随手, 哪怕, 调整, 活跃, 事实, 证据 lấy từ câu bài 练习 của sách (đã điền đáp án); của 极其, 其余, 目前 lấy từ phần 注释; còn lại trích câu/vế câu trong bài khoá. Bảng 扩展 (话题: 影视艺术) trong sách chỉ có chữ Hán + pinyin, nghĩa tiếng Việt do người soạn bổ sung.","order":[{"z":"研究者设计了一个有趣的实验。","t":["研究者","设计","了","一个","有趣","的","实验"],"v":"Các nhà nghiên cứu đã thiết kế một thí nghiệm thú vị."},{"z":"志愿者必须判断每一组画作中自己更喜欢哪一幅。","t":["志愿者","必须","判断","每","一组","画作","中","自己","更","喜欢","哪","一幅"],"v":"Tình nguyện viên phải xác định trong mỗi cặp tranh, mình thích bức nào hơn."},{"z":"其中三分之一的画作作者没有签名，而其余的则标明了身份。","t":["其中","三分之一","的","画作","作者","没有","签名","而","其余","的","则","标明","了","身份"],"v":"Trong số đó, một phần ba số tranh không có chữ ký của tác giả, còn những bức còn lại thì ghi rõ danh tính."},{"z":"也许有人认为，在这种情况下根本不可能分辨出来。","t":["也许","有人","认为","在","这种","情况","下","根本","不","可能","分辨","出来"],"v":"Có lẽ có ngườ dầu, muối… vào, dùng đũa trộn đều là đã xong phần nguyên liệu làm bánh."},{"h":"擀","p":"gǎn","v":"cán, nghiền","k":"đgt.","x":1,"ez":"最关键的功夫是擀面。","ev":"Khâu đòi hỏi tay nghề nhất là cán bột."},{"h":"薄","p":"báo","v":"mỏng","k":"tt.","x":0,"ez":"高手往往把面擀得薄如白纸，拌好的萝卜丝儿铺到饼上后，得再折叠两三次，要求饼熟之后表皮是透明的，能透过表皮看见萝卜丝儿。","ev":"Người khéo tay thường cán bột mỏng như tờ giấy trắng; sau khi rải sợi củ cải đã trộn lên mặt bánh, còn phải gấp lại hai ba lần, sao cho khi bánh chín thì lớp vỏ ngoài trong suốt, nhìn xuyên qua thấy được những sợi củ cải bên trong."},{"h":"折叠","p":"zhédié","v":"gấp, xếp","k":"đgt.","x":1,"ez":"高手往往把面擀得薄如白纸，拌好的萝卜丝儿铺到饼上后，得再折叠两三次，要求饼熟之后表皮是透明的，能透过表皮看见萝卜丝儿。","ev":"Người khéo tay thường cán bột mỏng như tờ giấy trắng; sau khi rải sợi củ cải đã trộn lên mặt bánh, còn phải gấp lại hai ba lần, sao cho khi bánh chín thì lớp vỏ ngoài trong suốt, nhìn xuyên qua thấy được những sợi củ cải bên trong."},{"h":"透明","p":"tòumíng","v":"trong suốt","k":"tt.","x":0,"ez":"高手往往把面擀得薄如白纸，拌好的萝卜丝儿铺到饼上后，得再折叠两三次，要求饼熟之后表皮是透明的，能透过表皮看见萝卜丝儿。","ev":"Người khéo tay thường cán bột mỏng như tờ giấy trắng; sau khi rải sợi củ cải đã trộn lên mặt bánh, còn phải gấp lại hai ba lần, sao cho khi bánh chín thì lớp vỏ ngoài trong suốt, nhìn xuyên qua thấy được những sợi củ cải bên trong."},{"h":"淋","p":"lín","v":"rải, rưới, đổ vào","k":"đgt.","x":1,"ez":"接下来，拿一个平底锅，先在锅里淋一圈油，待油锅烫手时，将切好的萝卜饼一块一块地放进锅里。","ev":"Tiếp theo, lấy một chiếc chảo đáy bằng, trước hết rưới một vòng dầu vào chảo, đợi khi chảo dầu nóng bỏng tay thì xếp từng miếng bánh củ cải đã cắt vào chảo."},{"h":"圈","p":"quān","v":"vòng","k":"dt.","x":0,"ez":"接下来，拿一个平底锅，先在锅里淋一圈油，待油锅烫手时，将切好的萝卜饼一块一块地放进锅里。","ev":"Tiếp theo, lấy một chiếc chảo đáy bằng, trước hết rưới một vòng dầu vào chảo, đợi khi chảo dầu nóng bỏng tay thì xếp từng miếng bánh củ cải đã cắt vào chảo."},{"h":"烫","p":"tàng","v":"làm bỏng, hâm, ủi; nóng","k":"đgt./tt.","x":0,"ez":"接下来，拿一个平底锅，先在锅里淋一圈油，待油锅烫手时，将切好的萝卜饼一块一块地放进锅里。","ev":"Tiếp theo, lấy một chiếc chảo đáy bằng, trước hết rưới một vòng dầu vào chảo, đợi khi chảo dầu nóng bỏng tay thì xếp từng miếng bánh củ cải đã cắt vào chảo."},{"h":"盖","p":"gài","v":"đậy; nắp","k":"đgt./dt.","x":0,"ez":"盖锅前须放进一些温水，预防糊底。","ev":"Trước khi đậy vung phải cho vào một ít nước ấm để tránh cháy đáy."},{"h":"预防","p":"yùfáng","v":"đề phòng, ngăn ngừa","k":"đgt.","x":0,"ez":"盖锅前须放进一些温水，预防糊底。","ev":"Trước khi đậy vung phải cho vào một ít nước ấm để tránh cháy đáy."},{"h":"糊","p":"hú","v":"khét, cháy","k":"đgt.","x":1,"ez":"盖锅前须放进一些温水，预防糊底。","ev":"Trước khi đậy vung phải cho vào một ít nước ấm để tránh cháy đáy."},{"h":"文火","p":"wénhuǒ","v":"lửa nhỏ, lửa riu riu","k":"dt.","x":1,"ez":"火最好用文火，等能闻到香味时，便可开锅了。","ev":"Tốt nhất là để lửa nhỏ liu riu, đợi đến khi ngửi thấy mùi thơm là có thể mở vung."},{"h":"闻","p":"wén","v":"ngửi","k":"đgt.","x":0,"ez":"火最好用文火，等能闻到香味时，便可开锅了。","ev":"Tốt nhất là để lửa nhỏ liu riu, đợi đến khi ngửi thấy mùi thơm là có thể mở vung."},{"h":"趁","p":"chèn","v":"nhân (lúc), thừa (dịp)","k":"giới.","x":0,"ez":"萝卜饼要趁热吃，喜欢口味重的，还可以加少许酱油和醋。","ev":"Bánh củ cải phải ăn lúc còn nóng; ai thích vị đậm thì có thể thêm chút nước tương và giấm."},{"h":"口味","p":"kǒuwèi","v":"mùi vị, hương vị","k":"dt.","x":0,"ez":"萝卜饼要趁热吃，喜欢口味重的，还可以加少许酱油和醋。","ev":"Bánh củ cải phải ăn lúc còn nóng; ai thích vị đậm thì có thể thêm chút nước tương và giấm."},{"h":"少许","p":"shǎoxǔ","v":"một chút","k":"tt.","x":1,"ez":"萝卜饼要趁热吃，喜欢口味重的，还可以加少许酱油和醋。","ev":"Bánh củ cải phải ăn lúc còn nóng; ai thích vị đậm thì có thể thêm chút nước tương và giấm."},{"h":"酱油","p":"jiàngyóu","v":"nước tương","k":"dt.","x":0,"ez":"萝卜饼要趁热吃，喜欢口味重的，还可以加少许酱油和醋。","ev":"Bánh củ cải phải ăn lúc còn nóng; ai thích vị đậm thì có thể thêm chút nước tương và giấm."},{"h":"醋","p":"cù","v":"giấm","k":"dt.","x":0,"ez":"萝卜饼要趁热吃，喜欢口味重的，还可以加少许酱油和醋。","ev":"Bánh củ cải phải ăn lúc còn nóng; ai thích vị đậm thì có thể thêm chút nước tương và giấm."},{"h":"焦","p":"jiāo","v":"bị cháy","k":"tt.","x":1,"ez":"刚出锅的萝卜饼，香味扑鼻，外焦里嫩，吃上一口，便让人永远忘不了。","ev":"Bánh củ cải vừa nhấc khỏi chảo thơm nức mũi, ngoài giòn cháy cạnh mà trong mềm, ăn một miếng là nhớ mãi không quên."},{"h":"嫩","p":"nèn","v":"mềm","k":"tt.","x":0,"ez":"刚出锅的萝卜饼，香味扑鼻，外焦里嫩，吃上一口，便让人永远忘不了。","ev":"Bánh củ cải vừa nhấc khỏi chảo thơm nức mũi, ngoài giòn cháy cạnh mà trong mềm, ăn một miếng là nhớ mãi không quên."},{"h":"特色","p":"tèsè","v":"đặc điểm, đặc trưng","k":"dt.","x":0,"ez":"他们不仅要观色、闻香、尝味、赏形，而且还要求食物具有养生方面的特色。","ev":"Họ không chỉ muốn ngắm màu, ngửi hương, nếm vị, thưởng thức hình dáng, mà còn đòi hỏi món ăn phải có nét đặc sắc về mặt dưỡng sinh."},{"h":"痰","p":"tán","v":"đàm, đờm","k":"dt.","x":1,"ez":"我想，家乡的萝卜饼完全具备这几个方面的条件，人们不是常说吗——“鱼生火，肉生痰，青菜萝卜保平安”，养生的功能，让我更加喜爱它了。","ev":"Tôi nghĩ bánh củ cải quê nhà hội đủ tất cả những điều kiện ấy; chẳng phải người ta vẫn thường nói “cá sinh nóng, thịt sinh đờm, rau xanh củ cải giữ bình an” đó sao? Chính công dụng dưỡng sinh ấy càng khiến tôi yêu thích nó hơn."},{"h":"平安","p":"píng'ān","v":"bình an, an toàn","k":"tt.","x":0,"ez":"我想，家乡的萝卜饼完全具备这几个方面的条件，人们不是常说吗——“鱼生火，肉生痰，青菜萝卜保平安”，养生的功能，让我更加喜爱它了。","ev":"Tôi nghĩ bánh củ cải quê nhà hội đủ tất cả những điều kiện ấy; chẳng phải người ta vẫn thường nói “cá sinh nóng, thịt sinh đờm, rau xanh củ cải giữ bình an” đó sao? Chính công dụng dưỡng sinh ấy càng khiến tôi yêu thích nó hơn."}]],"texts":[{"no":1,"tz":"","tv":"","lines":[{"s":"","z":"家乡的众多美食中，萝卜饼是最让我怀念的。","p":"Jiāxiāng de zhòngduō měishí zhōng, luóbobǐng shì zuì ràng wǒ huáiniàn de.","v":"Trong vô số món ngon của quê nhà, bánh củ cải là món khiến tôi nhớ nhung nhất.","b":0},{"s":"","z":"它那丰富的色彩、微甜的口感，至今仍让我十分想念。","p":"Tā nà fēngfù de sècǎi, wēi tián de kǒugǎn, zhìjīn réng ràng wǒ shífēn xiǎngniàn.","v":"Màu sắc rực rỡ và vị ngọt dịu của nó đến nay vẫn khiến tôi nhớ mãi.","b":0},{"s":"","z":"家乡的萝卜有青、红、紫三种。","p":"Jiāxiāng de luóbo yǒu qīng, hóng, zǐ sān zhǒng.","v":"Củ cải quê tôi có ba loại: xanh, đỏ và tím.","b":0},{"s":"","z":"三种萝卜看起来赏心悦目，吃起来，青的甜中带点儿辣，红的辣中带着甜，紫的像山泉般清淡可口。","p":"Sān zhǒng luóbo kàn qilai shǎngxīn-yuèmù, chī qilai, qīng de tián zhōng dài diǎnr là, hóng de là zhōng dàizhe tián, zǐ de xiàng shānquán bān qīngdàn kěkǒu.","v":"Ba loại củ cải trông thật vui mắt; ăn vào thì củ xanh ngọt mà phảng phất vị cay, củ đỏ cay mà vẫn đượm vị ngọt, còn củ tím thì thanh mát, ngon miệng như nước suối trên núi.","b":0},{"s":"","z":"父老乡亲们夸它说：“橘子、葡萄、梨，比不上咱的萝卜皮。”","p":"Fùlǎo xiāngqīnmen kuā tā shuō: “Júzi, pútao, lí, bǐ bu shàng zán de luóbo pí.”","v":"Bà con cô bác quê tôi khen nó rằng: “Quýt, nho hay lê cũng chẳng sánh được với vỏ củ cải nhà mình.”","b":0},{"s":"","z":"而萝卜饼就是用这三种颜色的萝卜做成的。","p":"Ér luóbobǐng jiù shì yòng zhè sān zhǒng yánsè de luóbo zuòchéng de.","v":"Và bánh củ cải chính là được làm từ củ cải ba màu ấy.","b":0},{"s":"","z":"萝卜饼的做法极其简单，既不必炒或煮，也不用油炸。","p":"Luóbobǐng de zuòfǎ jíqí jiǎndān, jì búbì chǎo huò zhǔ, yě búyòng yóuzhá.","v":"Cách làm bánh củ cải cực kỳ đơn giản, chẳng cần xào hay luộc, cũng không phải chiên ngập dầu.","b":1},{"s":"","z":"先把三色萝卜洗净切丝，放入油、盐等，用筷子搅拌均匀，萝卜饼的原料便做成了。","p":"Xiān bǎ sān sè luóbo xǐjìng qiē sī, fàngrù yóu, yán děng, yòng kuàizi jiǎobàn jūnyún, luóbobǐng de yuánliào biàn zuòchéng le.","v":"Trước tiên rửa sạch củ cải ba màu rồi thái sợi, cho dầu, muối… vào, dùng đũa trộn đều là đã xong phần nguyên liệu làm bánh.","b":0},{"s":"","z":"最关键的功夫是擀面。","p":"Zuì guānjiàn de gōngfu shì gǎn miàn.","v":"Khâu đòi hỏi tay nghề nhất là cán bột.","b":0},{"s":"","z":"高手往往把面擀得薄如白纸，拌好的萝卜丝儿铺到饼上后，得再折叠两三次，要求饼熟之后表皮是透明的，能透过表皮看见萝卜丝儿。","p":"Gāoshǒu wǎngwǎng bǎ miàn gǎn de báo rú bái zhǐ, bànhǎo de luóbo sīr pūdào bǐng shang hòu, děi zài zhédié liǎng-sān cì, yāoqiú bǐng shú zhīhòu biǎopí shì tòumíng de, néng tòuguò biǎopí kànjiàn luóbo sīr.","v":"Người khéo tay thường cán bột mỏng như tờ giấy trắng; sau khi rải sợi củ cải đã trộn lên mặt bánh, còn phải gấp lại hai ba lần, sao cho khi bánh chín thì lớp vỏ ngoài trong suốt, nhìn xuyên qua thấy được những sợi củ cải bên trong.","b":0},{"s":"","z":"最后用刀切成块状，饼便做好了。","p":"Zuìhòu yòng dāo qiēchéng kuài zhuàng, bǐng biàn zuòhǎo le.","v":"Cuối cùng dùng dao cắt thành từng miếng là bánh đã làm xong.","b":0},{"s":"","z":"接下来，拿一个平底锅，先在锅里淋一圈油，待油锅烫手时，将切好的萝卜饼一块一块地放进锅里。","p":"Jiē xialai, ná yí ge píngdǐguō, xiān zài guō li lín yì quān yóu, dài yóuguō tàng shǒu shí, jiāng qiēhǎo de luóbobǐng yí kuài yí kuài de fàngjìn guō li.","v":"Tiếp theo, lấy một chiếc chảo đáy bằng, trước hết rưới một vòng dầu vào chảo, đợi khi chảo dầu nóng bỏng tay thì xếp từng miếng bánh củ cải đã cắt vào chảo.","b":1},{"s":"","z":"盖锅前须放进一些温水，预防糊底。","p":"Gài guō qián xū fàngjìn yìxiē wēnshuǐ, yùfáng hú dǐ.","v":"Trước khi đậy vung phải cho vào một ít nước ấm để tránh cháy đáy.","b":0},{"s":"","z":"火最好用文火，等能闻到香味时，便可开锅了。","p":"Huǒ zuìhǎo yòng wénhuǒ, děng néng wéndào xiāngwèi shí, biàn kě kāi guō le.","v":"Tốt nhất là để lửa nhỏ liu riu, đợi đến khi ngửi thấy mùi thơm là có thể mở vung.","b":0},{"s":"","z":"萝卜饼要趁热吃，喜欢口味重的，还可以加少许酱油和醋。","p":"Luóbobǐng yào chèn rè chī, xǐhuan kǒuwèi zhòng de, hái kěyǐ jiā shǎoxǔ jiàngyóu hé cù.","v":"Bánh củ cải phải ăn lúc còn nóng; ai thích vị đậm thì có thể thêm chút nước tương và giấm.","b":0},{"s":"","z":"刚出锅的萝卜饼，香味扑鼻，外焦里嫩，吃上一口，便让人永远忘不了。","p":"Gāng chū guō de luóbobǐng, xiāngwèi pū bí, wài jiāo lǐ nèn, chīshang yì kǒu, biàn ràng rén yǒngyuǎn wàng bu liǎo.","v":"Bánh củ cải vừa nhấc khỏi chảo thơm nức mũi, ngoài giòn cháy cạnh mà trong mềm, ăn một miếng là nhớ mãi không quên.","b":0},{"s":"","z":"如今，美食家们对吃提出了更高的要求。","p":"Rújīn, měishíjiāmen duì chī tíchūle gèng gāo de yāoqiú.","v":"Ngày nay, những người sành ăn đặt ra yêu cầu cao hơn đối với chuyện ăn uống.","b":0},{"s":"","z":"他们不仅要观色、闻香、尝味、赏形，而且还要求食物具有养生方面的特色。","p":"Tāmen bùjǐn yào guān sè, wén xiāng, cháng wèi, shǎng xíng, érqiě hái yāoqiú shíwù jùyǒu yǎngshēng fāngmiàn de tèsè.","v":"Họ không chỉ muốn ngắm màu, ngửi hương, nếm vị, thưởng thức hình dáng, mà còn đòi hỏi món ăn phải có nét đặc sắc về mặt dưỡng sinh.","b":0},{"s":"","z":"我想，家乡的萝卜饼完全具备这几个方面的条件，人们不是常说吗——“鱼生火，肉生痰，青菜萝卜保平安”，养生的功能，让我更加喜爱它了。","p":"Wǒ xiǎng, jiāxiāng de luóbobǐng wánquán jùbèi zhè jǐ ge fāngmiàn de tiáojiàn, rénmen bú shì cháng shuō ma——“Yú shēng huǒ, ròu shēng tán, qīngcài luóbo bǎo píng'ān”, yǎngshēng de gōngnéng, ràng wǒ gèngjiā xǐ'ài tā le.","v":"Tôi nghĩ bánh củ cải quê nhà hội đủ tất cả những điều kiện ấy; chẳng phải người ta vẫn thường nói “cá sinh nóng, thịt sinh đờm, rau xanh củ cải giữ bình an” đó sao? Chính công dụng dưỡng sinh ấy càng khiến tôi yêu thích nó hơn.","b":0}]}],"aud":[{"v":"audio/19-2.mp3","t":"audio/19-1.mp3"}],"gram":[{"id":"ban","t":"般","s":"giống như, tựa như (trợ từ)","b":"<b>般</b> là <b>trợ từ</b>, nghĩa giống “一样”, “似的” (giống như, tựa như). Thường đứng <b>sau danh từ</b>, tạo thành cụm từ làm <b>định ngữ</b> hoặc <b>trạng ngữ</b> trong câu.","r":["(像) + danh từ + 般 + tính từ/động từ → làm trạng ngữ: 像山泉般清淡可口, 雨点般不停地往下掉.","Danh từ + 般 + 的 + danh từ → làm định ngữ: 阳光般的笑容.","Dùng thay cho 一样 / 似的 trong lối viết trang trọng: 像金子一样宝贵 → 金子般宝贵."],"e":[["……紫的像山泉般清淡可口。","…… zǐ de xiàng shānquán bān qīngdàn kěkǒu.","… còn củ tím thì thanh mát, ngon miệng như nước suối trên núi. <i>(bài khoá)</i>"],["说起那段往事，她的脸上露出了阳光般的笑容。","Shuōqǐ nà duàn wǎngshì, tā de liǎn shang lùchūle yángguāng bān de xiàoróng.","Nhắc đến chuyện cũ ấy, gương mặt cô ấy nở nụ cười rạng rỡ như ánh nắng."],["望着爸爸远去的背影，我的眼泪雨点般不停地往下掉。","Wàngzhe bàba yuǎnqù de bèiyǐng, wǒ de yǎnlèi yǔdiǎn bān bù tíng de wǎng xià diào.","Nhìn theo bóng bố khuất dần, nước mắt tôi cứ tuôn rơi như mưa."]],"d":[["他在下半场的进球，为球队赢得了一场金子____宝贵的胜利。","般"],["书法大赛开办以来，全国各地的参赛作品雪片____飞来。","般"],["这时，从远处传来了孩子们一阵阵银铃____清脆的笑声。","般"]],"w":"般 luôn đứng SAU danh từ được so sánh (山泉般, 阳光般), tương đương “一样/似的”; khi làm định ngữ thường có 的: 阳光般的笑容."},{"id":"wen","t":"闻","s":"nghe (ngữ tố); ngửi (động từ)","b":"Khi làm <b>ngữ tố</b> (thành phần cấu tạo từ), <b>闻</b> có nghĩa “听见，听见的事情、消息” — nghe thấy; điều nghe được, tin tức. Khi dùng làm <b>động từ</b>, 闻 nghĩa là dùng mũi để cảm nhận mùi — <b>ngửi</b>.","r":["Ngữ tố = nghe / điều nghe được: 百闻不如一见 (trăm nghe không bằng một thấy), 闻声 (nghe tiếng), 所见所闻 (những điều mắt thấy tai nghe), 见闻 (hiểu biết, điều thấy và nghe).","Động từ = ngửi: 闻到香味, 闻了闻.","练一练: 闻到了…玫瑰花香 → ngửi; 奇闻趣事, 听而不闻 → nghe / điều nghe được."],"e":[["你们到各地去旅游，一定会增加对中国的了解，老话说：百闻不如一见。","Nǐmen dào gè dì qù lǚyóu, yídìng huì zēngjiā duì Zhōngguó de liǎojiě, lǎohuà shuō: bǎi wén bùrú yí jiàn.","Các bạn đi du lịch khắp nơi chắc chắn sẽ hiểu thêm về Trung Quốc; người xưa nói rồi: trăm nghe không bằng một thấy."],["邻居们闻声赶来，纷纷跳入水中救起了落水的小孩。","Línjūmen wén shēng gǎnlái, fēnfēn tiàorù shuǐ zhōng jiùqǐle luò shuǐ de xiǎohái.","Hàng xóm nghe tiếng liền chạy tới, người này người kia nhảy xuống nước cứu đứa bé bị rơi xuống nước lên."],["时隔多年再来这里，所到之处、所见所闻，无不给人一种新鲜感。","Shí gé duō nián zài lái zhèli, suǒ dào zhī chù, suǒ jiàn suǒ wén, wú bù gěi rén yì zhǒng xīnxiāngǎn.","Nhiều năm sau trở lại đây, đi tới đâu, thấy gì nghe gì cũng đều đem lại cảm giác mới mẻ."],["假期里，他常带孩子们到世界各地旅行，增长他们的见闻。","Jiàqī li, tā cháng dài háizimen dào shìjiè gè dì lǚxíng, zēngzhǎng tāmen de jiànwén.","Vào kỳ nghỉ, anh ấy thường đưa các con đi du lịch khắp thế giới để mở mang tầm hiểu biết cho chúng."],["火最好用文火，等能闻到香味时，便可开锅了。","Huǒ zuìhǎo yòng wénhuǒ, děng néng wéndào xiāngwèi shí, biàn kě kāi guō le.","Tốt nhất là để lửa nhỏ liu riu, đợi đến khi ngửi thấy mùi thơm là có thể mở vung. <i>(bài khoá)</i>"],["他把壶盖儿打开，闻了闻，原来是酒。","Tā bǎ húgàir dǎkāi, wénle wén, yuánlái shì jiǔ.","Anh ấy mở nắp bình ra ngửi thử, hóa ra là rượu."]],"d":[["一进村口，我们就____到了清风送来的浓浓的玫瑰花香。","闻"],["邻居们____声赶来，纷纷跳入水中救起了落水的小孩。","闻"],["你们到各地去旅游，一定会增加对中国的了解，老话说：百____不如一见。","闻"]],"w":"Nghĩa “nghe” của 闻 chỉ còn trong từ ghép, thành ngữ (闻声, 见闻, 所见所闻, 百闻不如一见); khi đứng một mình làm động từ, 闻 là “ngửi”, không phải “nghe” (听)."},{"id":"chen","t":"趁","s":"nhân (lúc), thừa (dịp) (giới từ)","b":"<b>趁</b> là <b>giới từ</b>, nghĩa là “利用（时间、机会）” — tận dụng thời gian, cơ hội để làm việc gì. Phía sau có thể là <b>danh từ, cụm động từ, tính từ hoặc mệnh đề</b>.","r":["趁(着) + danh từ / cụm động từ: 趁着这几天休息, 我们去看看房子吧.","趁 + mệnh đề: 趁电影还没开始, 我去买两瓶矿泉水.","趁 + tính từ: 趁热吃 (ăn lúc còn nóng).","Cụm 趁… nêu thời cơ, phần sau nêu việc tranh thủ làm."],"e":[["趁着这几天休息，我们去看看房子吧。","Chènzhe zhè jǐ tiān xiūxi, wǒmen qù kànkan fángzi ba.","Nhân mấy hôm nay được nghỉ, chúng mình đi xem nhà đi."],["趁电影还没开始，我去买两瓶矿泉水。","Chèn diànyǐng hái méi kāishǐ, wǒ qù mǎi liǎng píng kuàngquánshuǐ.","Tranh thủ lúc phim chưa chiếu, tôi đi mua hai chai nước khoáng."],["萝卜饼要趁热吃，喜欢口味重的，还可以加少许酱油和醋。","Luóbobǐng yào chèn rè chī, xǐhuan kǒuwèi zhòng de, hái kěyǐ jiā shǎoxǔ jiàngyóu hé cù.","Bánh củ cải phải ăn lúc còn nóng; ai thích vị đậm thì có thể thêm chút nước tương và giấm. <i>(bài khoá)</i>"]],"d":[["萝卜饼要____热吃。","趁"],["____电影还没开始，我去买两瓶矿泉水。","趁"],["____着这几天休息，我们去看看房子吧。","趁"]],"w":"趁 chỉ dùng khi chủ động tận dụng thời cơ để làm việc gì. Ở 练习 2③ “____我们从天津回来时，才听说她出国的事。” phải chọn 等 (đợi đến khi), không chọn 趁."},{"id":"huainian-xiangnian","t":"怀念 vs 想念","s":"tưởng nhớ, hoài niệm vs nhớ, mong gặp","b":"<b>Điểm giống:</b> cả hai đều là <b>động từ</b>, đều biểu thị không thể quên được một người hoặc một hoàn cảnh, mang nghĩa nhớ nhung. Ví dụ: 每当回忆起小学时代的学习生活，我最怀念/想念的人就是刘老师。","r":["怀念: thường dùng trong <b>văn viết</b>, nghĩa nhấn mạnh việc <b>thường xuyên nhớ lại, không thể quên</b>.","想念: thường dùng trong <b>khẩu ngữ</b>, nghĩa nhấn mạnh <b>mong được gặp lại</b> ai đó.","怀念: thường dùng với người <b>đã qua đời</b> hoặc hoàn cảnh <b>không thể gặp lại</b>.","想念: thường dùng với người <b>còn sống</b> hoặc hoàn cảnh <b>có thể gặp lại</b>."],"e":[["每当回忆起小学时代的学习生活，我最怀念/想念的人就是刘老师。","Měi dāng huíyì qǐ xiǎoxué shídài de xuéxí shēnghuó, wǒ zuì huáiniàn/xiǎngniàn de rén jiù shì Liú lǎoshī.","Mỗi khi nhớ lại những năm tháng học tiểu học, người tôi nhớ nhất chính là thầy Lưu."],["刘教授非常怀念年轻时在国外留学的那段生活。","Liú jiàoshòu fēicháng huáiniàn niánqīng shí zài guówài liúxué de nà duàn shēnghuó.","Giáo sư Lưu rất hoài niệm quãng đời du học ở nước ngoài thời trẻ."],["女儿告诉我，她很想念出差的爸爸。","Nǚ'ér gàosu wǒ, tā hěn xiǎngniàn chūchāi de bàba.","Con gái nói với tôi rằng con rất nhớ bố đang đi công tác."],["从文章中我们读到了先生对去世的母亲的怀念。","Cóng wénzhāng zhōng wǒmen dúdàole xiānsheng duì qùshì de mǔqin de huáiniàn.","Qua bài văn, chúng ta đọc được nỗi thương nhớ của ông đối với người mẹ đã khuất."],["每到春节，我就格外想念家乡的一草一木。","Měi dào Chūn Jié, wǒ jiù géwài xiǎngniàn jiāxiāng de yì cǎo yí mù.","Cứ đến Tết, tôi lại đặc biệt nhớ từng ngọn cỏ, gốc cây nơi quê nhà."]],"d":[["在南方的时候，我总是____北方雪花飘飘的美景。","想念"],["在国外工作的那段时间，他时时刻刻都在____着家人。","想念"],["在楼房里住了十多年后，老李却开始____起住在四合院里的生活。","怀念"]],"w":"Người đã mất, quãng đời đã qua không thể quay lại → 怀念; người còn sống, nơi chốn có thể trở về, mong được gặp → 想念."}],"ext":[["零食","língshí","đồ ăn vặt"],["冰激凌","bīngjīlíng","kem"],["酱油","jiàngyóu","nước tương"],["醋","cù","giấm"],["开水","kāishuǐ","nước sôi"],["点心","diǎnxin","điểm tâm, bánh ngọt"],["营养","yíngyǎng","dinh dưỡng"],["口味","kǒuwèi","khẩu vị, mùi vị"],["胃口","wèikǒu","khẩu vị, sự thèm ăn"],["淡","dàn","nhạt"],["臭","chòu","thối, hôi"],["软","ruǎn","mềm"],["嫩","nèn","mềm, non"],["过期","guòqī","quá hạn"]],"extt":"饮食2","notes":"Nguồn cuối bài khoá: 改编自《中国电视报》，作者：李星涛. Bài khoá 547 chữ (theo sách), 5 đoạn văn (tr.14–16), chia 3 phần: đoạn 1–2 (từ 1–14) / đoạn 3 (từ 15–26) / đoạn 4–5 (từ 27–44). Bài không có mục 专名. Từ có dấu * (ngoài đề cương): 2, 8, 9, 11, 19, 20, 23, 25, 27, 32, 33, 37, 40, 43. Từ 8 赏心悦目 sách không ghi từ loại. Sách còn có (二) 词语搭配 (切/预防 + tân ngữ; định ngữ + 色彩/特色; 搅拌/翻炒/烫/盖/炒/煮/炸 + bổ ngữ; 分布/呼吸/色彩 + vị ngữ) — không có trường trong schema nên không đưa vào. 做一做 怀念/想念: sách chỉ cho đáp án mẫu câu (1) (想念); câu (3) “令我____起自己的家乡” không đưa vào drill vì đáp án không chắc chắn.","order":[{"z":"家乡的萝卜有青、红、紫三种。","t":["家乡","的","萝卜","有青","红","紫","三种"],"v":"Củ cải quê tôi có ba loại: xanh, đỏ và tím."},{"z":"最关键的功夫是擀面。","t":["最","关键","的","功夫","是","擀面"],"v":"Khâu đòi hỏi tay nghề nhất là cán bột."},{"z":"最后用刀切成块状，饼便做好了。","t":["最后","用","刀切","成","块状","饼","便","做好","了"],"v":"Cuối cùng dùng dao cắt thành từng miếng là bánh đã làm xong."},{"z":"盖锅前须放进一些温水，预防糊底。","t":["盖锅","前须","放进","一些","温水","预防","糊底"],"v":"Trước khi đậy vung phải cho vào một ít nước ấm để tránh cháy đáy."},{"z":"如今，美食家们对吃提出了更高的要求。","t":["如今","美食家","们","对","吃","提出","了","更","高","的","要求"],"v":"Ngày nay, những người sành ăn đặt ra yêu cầu cao hơn đối với chuyện ăn uống."},{"z":"说起那段往事，她的脸上露出了阳光般的笑容。","t":["说起","那段","往事","她","的","脸上","露出","了","阳光","般的","笑容"],"v":"Nhắc đến chuyện cũ ấy, gương mặt cô ấy nở nụ cười rạng rỡ như ánh nắng."},{"z":"邻居们闻声赶来，纷纷跳入水中救起了落水的小孩。","t":["邻居们","闻声","赶来","纷纷","跳入","水中","救起","了","落水","的","小孩"],"v":"Hàng xóm nghe tiếng liền chạy tới, người này người kia nhảy xuống nước cứu đứa bé bị rơi xuống nước lên."},{"z":"时隔多年再来这里，所到之处、所见所闻，无不给人一种新鲜感。","t":["时隔多年","再","来","这里","所到之处","所见所闻","无不","给","人","一种","新鲜感"],"v":"Nhiều năm sau trở lại đây, đi tới đâu, thấy gì nghe gì cũng đều đem lại cảm giác mới mẻ."},{"z":"他把壶盖儿打开，闻了闻，原来是酒。","t":["他","把","壶盖","儿","打开","闻","了","闻","原来","是","酒"],"v":"Anh ấy mở nắp bình ra ngửi thử, hóa ra là rượu."},{"z":"趁着这几天休息，我们去看看房子吧。","t":["趁着","这","几天","休息","我们","去","看看","房子","吧"],"v":"Nhân mấy hôm nay được nghỉ, chúng mình đi xem nhà đi."},{"z":"趁电影还没开始，我去买两瓶矿泉水。","t":["趁","电影","还","没","开始","我","去","买","两瓶","矿泉水"],"v":"Tranh thủ lúc phim chưa chiếu, tôi đi mua hai chai nước khoáng."},{"z":"女儿告诉我，她很想念出差的爸爸。","t":["女儿","告诉","我","她","很","想念","出差","的","爸爸"],"v":"Con gái nói với tôi rằng con rất nhớ bố đang đi công tác."},{"z":"每到春节，我就格外想念家乡的一草一木。","t":["每到","春节","我","就","格外","想念","家乡","的","一草一木"],"v":"Cứ đến Tết, tôi lại đặc biệt nhớ từng ngọn cỏ, gốc cây nơi quê nhà."}]},"20":{"n":20,"tz":"小人书摊","tv":"Quầy truyện tranh","batches":[[{"h":"摊","p":"tān","v":"quầy, sạp","k":"dt.","x":1,"ez":"随着小人书的流行，出现了从事租书业务的小人书摊。","ev":"Cùng với sự thịnh hành của truyện tranh, đã xuất hiện những quầy truyện tranh chuyên cho thuê sách."},{"h":"出版","p":"chūbǎn","v":"xuất bản","k":"đgt.","x":0,"ez":"小人书，是一种以书的形式出版的连环画。","ev":"“Tiểu nhân thư” là một loại truyện tranh liên hoàn được xuất bản dưới hình thức sách."},{"h":"连环画","p":"liánhuánhuà","v":"sách truyện tranh","k":"dt.","x":1,"ez":"小人书，是一种以书的形式出版的连环画。","ev":"“Tiểu nhân thư” là một loại truyện tranh liên hoàn được xuất bản dưới hình thức sách."},{"h":"年代","p":"niándài","v":"thập kỷ","k":"dt.","x":0,"ez":"这可以说是20世纪80年代最流行的歌曲。","ev":"Có thể nói đây là bài hát thịnh hành nhất những năm 80 của thế kỷ XX."},{"h":"单调","p":"dāndiào","v":"đơn điệu, nhàm chán","k":"tt.","x":0,"ez":"他觉得在中国的生活很单调，我却觉得很丰富。","ev":"Anh ấy thấy cuộc sống ở Trung Quốc rất đơn điệu, còn tôi lại thấy rất phong phú."},{"h":"网络","p":"wǎngluò","v":"mạng (Internet)","k":"dt.","x":0,"ez":"那时候生活很单调，没有网络，没有动画片。","ev":"Hồi đó cuộc sống rất đơn điệu, không có Internet, cũng chẳng có phim hoạt hình."},{"h":"动画片","p":"dònghuàpiàn","v":"phim hoạt hình","k":"dt.","x":0,"ez":"没有网络，没有动画片，读小人书是儿童最主要的娱乐之一。","ev":"Không có Internet, không có phim hoạt hình, đọc truyện tranh là một trong những thú giải trí chính của trẻ em."},{"h":"娱乐","p":"yúlè","v":"thú tiêu khiển; giải trí","k":"dt./đgt.","x":0,"ez":"读小人书是儿童最主要的娱乐之一。","ev":"Đọc truyện tranh là một trong những thú giải trí chính của trẻ em."},{"h":"无数","p":"wúshù","v":"vô số","k":"tt.","x":0,"ez":"不仅小孩子爱看，还有无数的青少年和大人也爱看。","ev":"Không chỉ trẻ nhỏ thích đọc, mà vô số thanh thiếu niên và người lớn cũng mê."},{"h":"青少年","p":"qīng-shàonián","v":"thanh thiếu niên","k":"dt.","x":0,"ez":"不仅小孩子爱看，还有无数的青少年和大人也爱看。","ev":"Không chỉ trẻ nhỏ thích đọc, mà vô số thanh thiếu niên và người lớn cũng mê."},{"h":"从事","p":"cóngshì","v":"làm, tham gia","k":"đgt.","x":0,"ez":"我想从事有挑战性的工作，因为那样可以更好地成长。","ev":"Tôi muốn làm công việc có tính thử thách, vì như vậy mình sẽ trưởng thành tốt hơn."},{"h":"毫无","p":"háowú","v":"không chút","k":"","x":1,"ez":"只用很少的钱就能看一本，毫无疑问是件大好事。","ev":"Chỉ cần bỏ ra rất ít tiền là đọc được một cuốn, chắc chắn đây là một chuyện rất tốt."},{"h":"疑问","p":"yíwèn","v":"sự nghi ngờ","k":"dt.","x":0,"ez":"今天的课就到这儿，大家有什么疑问吗？","ev":"Buổi học hôm nay đến đây thôi, mọi người có thắc mắc gì không?"},{"h":"棚子","p":"péngzi","v":"lều, chuồng","k":"dt.","x":1,"ez":"就是一进街口靠墙的一个小棚子。","ev":"Đó là một cái lán nhỏ dựa vào tường ngay đầu phố."},{"h":"砖头","p":"zhuāntou","v":"gạch","k":"dt.","x":1,"ez":"里面用几块砖头支着粗糙的木头板子供人们坐着看书。","ev":"Bên trong dùng mấy viên gạch kê những tấm ván gỗ thô ráp cho mọi người ngồi đọc sách."},{"h":"支","p":"zhī","v":"chống, đỡ","k":"đgt.","x":0,"ez":"他的两只手放在桌上，支着脑袋，正在想事情。","ev":"Anh ấy đặt hai tay lên bàn, chống đầu, đang suy nghĩ chuyện gì đó."},{"h":"粗糙","p":"cūcāo","v":"sần sùi, thô, gồ ghề","k":"tt.","x":0,"ez":"这房子装修得太粗糙了！","ev":"Căn nhà này sửa sang cẩu thả quá!"},{"h":"木头","p":"mùtou","v":"gỗ","k":"dt.","x":0,"ez":"里面用几块砖头支着粗糙的木头板子供人们坐着看书。","ev":"Bên trong dùng mấy viên gạch kê những tấm ván gỗ thô ráp cho mọi người ngồi đọc sách."},{"h":"题材","p":"tícái","v":"đề tài, chủ đề","k":"dt.","x":1,"ez":"棚子里有一张床板摆着各种题材的小人书。","ev":"Trong lán có một tấm ván giường bày đủ loại truyện tranh với nhiều đề tài khác nhau."},{"h":"翻","p":"fān","v":"lật, giở","k":"đgt.","x":0,"ez":"今天早上是谁打翻了桌子上的牛奶？","ev":"Sáng nay ai làm đổ sữa trên bàn vậy?"},{"h":"搭","p":"dā","v":"vắt, mắc","k":"đgt.","x":1,"ez":"一本本书翻开搭在上面，五颜六色的，很好看。","ev":"Từng cuốn sách được mở ra vắt lên trên, đủ màu sặc sỡ, trông rất đẹp."},{"h":"整齐","p":"zhěngqí","v":"ngay ngắn, đều đặn, ngăn nắp","k":"tt.","x":0,"ez":"窗外响起了一阵整齐的歌声。","ev":"Ngoài cửa sổ vang lên một tràng tiếng hát đều tăm tắp."},{"h":"年纪","p":"niánjì","v":"tuổi","k":"dt.","x":0,"ez":"摊主是位上了年纪、身材瘦小的老人。","ev":"Chủ quầy là một ông lão đã có tuổi, dáng người gầy nhỏ."},{"h":"身材","p":"shēncái","v":"vóc dáng, dáng người","k":"dt.","x":0,"ez":"他身材高大，动作灵活，很适合打篮球。","ev":"Anh ấy cao lớn, động tác linh hoạt, rất hợp chơi bóng rổ."},{"h":"成人","p":"chéngrén","v":"người lớn","k":"dt.","x":0,"ez":"在这里看书的人大部分是附近住户的孩子，也有一些喜欢小人书的成人。","ev":"Người đến đây đọc sách phần lớn là trẻ con các nhà quanh đó, cũng có một số người lớn thích truyện tranh."},{"h":"册","p":"cè","v":"cuốn, quyển, tập","k":"lượng.","x":0,"ez":"租借小人书很便宜，在摊里看，每册1分钱。","ev":"Thuê truyện tranh rất rẻ, đọc tại quầy thì mỗi cuốn 1 xu."},{"h":"假如","p":"jiǎrú","v":"nếu","k":"liên.","x":0,"ez":"假如你每天都能做好一件事，那么你每天都能得到一份快乐。","ev":"Nếu mỗi ngày bạn đều làm tốt được một việc, thì ngày nào bạn cũng sẽ có được một niềm vui."},{"h":"登记","p":"dēngjì","v":"đăng ký, ghi vào sổ","k":"đgt.","x":0,"ez":"摊主仔细地将租书人的姓名、地址和所借小人书的书名登记在本子上。","ev":"Chủ quầy cẩn thận ghi họ tên, địa chỉ của người thuê và tên những cuốn truyện được mượn vào sổ."},{"h":"记录","p":"jìlù","v":"kỷ lục, lời ghi; ghi chép","k":"dt./đgt.","x":0,"ez":"第二天还书时再把记录一个一个地画掉。","ev":"Hôm sau khi trả sách thì gạch bỏ từng dòng ghi chép một."},{"h":"手续","p":"shǒuxù","v":"thủ tục","k":"dt.","x":0,"ez":"还书手续就算是办理好了。","ev":"Thế là xong thủ tục trả sách."},{"h":"办理","p":"bànlǐ","v":"giải quyết, làm","k":"đgt.","x":0,"ez":"请96号顾客到2号窗口办理业务。","ev":"Mời khách hàng số 96 đến quầy số 2 làm thủ tục giao dịch."},{"h":"押金","p":"yājīn","v":"tiền thế chấp, tiền đặt cọc","k":"dt.","x":0,"ez":"印象中似乎没有什么押金，全凭信用。","ev":"Theo trí nhớ của tôi, hình như chẳng có tiền đặt cọc gì cả, hoàn toàn dựa vào chữ tín."},{"h":"凭","p":"píng","v":"dựa vào; căn cứ","k":"đgt./giới.","x":0,"ez":"请旅客们准备好车票，凭票进站。","ev":"Mời quý hành khách chuẩn bị sẵn vé, xuất trình vé để vào ga."},{"h":"印刷","p":"yìnshuā","v":"in (sách, báo...)","k":"đgt.","x":0,"ez":"一些印刷精美、有特色的作品则身价大涨，成了收藏品。","ev":"Một số tác phẩm in đẹp, có nét đặc sắc thì giá trị tăng vọt, trở thành đồ sưu tầm."},{"h":"涨","p":"zhǎng","v":"lên cao, tăng","k":"đgt.","x":0,"ez":"最近几年，物价涨得很厉害。","ev":"Mấy năm gần đây, vật giá tăng rất mạnh."},{"h":"收藏","p":"shōucáng","v":"sưu tầm, thu thập","k":"đgt.","x":1,"ez":"一些印刷精美、有特色的作品则身价大涨，成了收藏品，甚至进了博物馆。","ev":"Một số tác phẩm in đẹp, có nét đặc sắc thì giá trị tăng vọt, trở thành đồ sưu tầm, thậm chí còn được đưa vào viện bảo tàng."},{"h":"潘家园","p":"Pānjiāyuán","v":"Phan Gia Viên (tên một khu chợ đồ cổ nổi tiếng ở Bắc Kinh)","k":"tên riêng","x":0,"ez":"如今只能在北京的潘家园、护国寺等地的旧书摊上找到。","ev":"Nay chỉ còn tìm thấy ở các sạp sách cũ tại những nơi như Phan Gia Viên, Hộ Quốc Tự ở Bắc Kinh."},{"h":"护国寺","p":"Hùguósì","v":"Hộ Quốc Tự (tên một con đường thương mại ở Bắc Kinh)","k":"tên riêng","x":0,"ez":"如今只能在北京的潘家园、护国寺等地的旧书摊上找到。","ev":"Nay chỉ còn tìm thấy ở các sạp sách cũ tại những nơi như Phan Gia Viên, Hộ Quốc Tự ở Bắc Kinh."}]],"texts":[{"no":1,"tz":"","tv":"","lines":[{"s":"","z":"小人书，是一种以书的形式出版的连环画。","p":"Xiǎorénshū, shì yì zhǒng yǐ shū de xíngshì chūbǎn de liánhuánhuà.","v":"“Tiểu nhân thư” là một loại truyện tranh liên hoàn được xuất bản dưới hình thức sách.","b":0},{"s":"","z":"在二十世纪五六十年代，那时候生活很单调，没有网络，没有动画片，读小人书是儿童最主要的娱乐之一。","p":"Zài èrshí shìjì wǔ-liùshí niándài, nà shíhou shēnghuó hěn dāndiào, méiyǒu wǎngluò, méiyǒu dònghuàpiàn, dú xiǎorénshū shì értóng zuì zhǔyào de yúlè zhī yī.","v":"Vào những năm 50, 60 của thế kỷ XX, cuộc sống thời đó rất đơn điệu, không có Internet, không có phim hoạt hình, đọc truyện tranh là một trong những thú giải trí chính của trẻ em.","b":0},{"s":"","z":"不仅小孩子爱看，还有无数的青少年和大人也爱看。","p":"Bùjǐn xiǎo háizi ài kàn, hái yǒu wúshù de qīng-shàonián hé dàrén yě ài kàn.","v":"Không chỉ trẻ nhỏ thích đọc, mà vô số thanh thiếu niên và người lớn cũng mê.","b":0},{"s":"","z":"随着小人书的流行，出现了从事租书业务的小人书摊，这对于那些想看又买不起书的人来说，只用很少的钱就能看一本，毫无疑问是件大好事。","p":"Suízhe xiǎorénshū de liúxíng, chūxiàn le cóngshì zū shū yèwù de xiǎorénshū tān, zhè duìyú nàxiē xiǎng kàn yòu mǎi bu qǐ shū de rén lái shuō, zhǐ yòng hěn shǎo de qián jiù néng kàn yì běn, háowú yíwèn shì jiàn dà hǎoshì.","v":"Cùng với sự thịnh hành của truyện tranh, đã xuất hiện những quầy truyện tranh chuyên cho thuê sách; với những người muốn đọc mà không đủ tiền mua sách, chỉ cần bỏ ra rất ít tiền là đọc được một cuốn, đây chắc chắn là một chuyện rất tốt.","b":0},{"s":"","z":"记得小时候，我家附近就有个小人书摊，就是一进街口靠墙的一个小棚子，里面用几块砖头支着粗糙的木头板子供人们坐着看书。","p":"Jìde xiǎo shíhou, wǒ jiā fùjìn jiù yǒu ge xiǎorénshū tān, jiùshì yí jìn jiēkǒu kào qiáng de yí ge xiǎo péngzi, lǐmiàn yòng jǐ kuài zhuāntou zhīzhe cūcāo de mùtou bǎnzi gōng rénmen zuòzhe kàn shū.","v":"Tôi nhớ hồi nhỏ, gần nhà tôi có một quầy truyện tranh, đó là một cái lán nhỏ dựa vào tường ngay đầu phố, bên trong dùng mấy viên gạch kê những tấm ván gỗ thô ráp cho mọi người ngồi đọc sách.","b":1},{"s":"","z":"棚子里有一张床板摆着各种题材的小人书，墙边还拉了几根绳子，一本本书翻开搭在上面，五颜六色的，很好看。","p":"Péngzi li yǒu yì zhāng chuángbǎn bǎizhe gè zhǒng tícái de xiǎorénshū, qiáng biān hái lāle jǐ gēn shéngzi, yì běnběn shū fānkāi dā zài shàngmiàn, wǔyán-liùsè de, hěn hǎokàn.","v":"Trong lán có một tấm ván giường bày đủ loại truyện tranh với nhiều đề tài khác nhau, bên tường còn căng mấy sợi dây, từng cuốn sách được mở ra vắt lên trên, đủ màu sặc sỡ, trông rất đẹp.","b":0},{"s":"","z":"为了减少损坏程度，每本小人书都用牛皮纸加了层封皮，封皮上用毛笔写上书名，整齐漂亮的毛笔字能充分地显示出书摊主人的文化水平。","p":"Wèile jiǎnshǎo sǔnhuài chéngdù, měi běn xiǎorénshū dōu yòng niúpízhǐ jiāle céng fēngpí, fēngpí shang yòng máobǐ xiěshang shūmíng, zhěngqí piàoliang de máobǐzì néng chōngfèn de xiǎnshì chū shūtān zhǔrén de wénhuà shuǐpíng.","v":"Để sách đỡ bị hư hỏng, cuốn truyện nào cũng được bọc thêm một lớp bìa bằng giấy da bò, trên bìa viết tên sách bằng bút lông; những nét chữ bút lông ngay ngắn, đẹp đẽ ấy cho thấy rõ trình độ học vấn của chủ quầy.","b":0},{"s":"","z":"摊主是位上了年纪、身材瘦小的老人，总是穿着一件灰色长衫，静静地坐在一边，陪着看书的人们。","p":"Tānzhǔ shì wèi shàngle niánjì, shēncái shòuxiǎo de lǎorén, zǒngshì chuānzhe yí jiàn huīsè chángshān, jìngjìng de zuò zài yìbiān, péizhe kàn shū de rénmen.","v":"Chủ quầy là một ông lão đã có tuổi, dáng người gầy nhỏ, lúc nào cũng mặc một chiếc áo dài màu xám, lặng lẽ ngồi một bên, bầu bạn với những người đọc sách.","b":0},{"s":"","z":"在这里看书的人大部分是附近住户的孩子，也有一些喜欢小人书的成人。","p":"Zài zhèlǐ kàn shū de rén dà bùfen shì fùjìn zhùhù de háizi, yě yǒu yìxiē xǐhuan xiǎorénshū de chéngrén.","v":"Người đến đây đọc sách phần lớn là trẻ con các nhà quanh đó, cũng có một số người lớn thích truyện tranh.","b":1},{"s":"","z":"租借小人书很便宜，在摊里看，每册1分钱，选好书坐下就看，看完连书带钱交给摊主；","p":"Zūjiè xiǎorénshū hěn piányi, zài tān li kàn, měi cè yì fēn qián, xuǎnhǎo shū zuòxia jiù kàn, kànwán lián shū dài qián jiāo gěi tānzhǔ;","v":"Thuê truyện tranh rất rẻ: đọc tại quầy thì mỗi cuốn 1 xu, chọn xong sách là ngồi xuống đọc ngay, đọc xong thì trả cả sách lẫn tiền cho chủ quầy;","b":0},{"s":"","z":"假如借走回家看，则每本每天2分钱，挑好书后交给摊主，摊主仔细地将租书人的姓名、地址和所借小人书的书名登记在本子上，收了租金就可以拿走了，第二天还书时再把记录一个一个地画掉，还书手续就算是办理好了。","p":"jiǎrú jièzǒu huí jiā kàn, zé měi běn měi tiān liǎng fēn qián, tiāohǎo shū hòu jiāo gěi tānzhǔ, tānzhǔ zǐxì de jiāng zū shū rén de xìngmíng, dìzhǐ hé suǒ jiè xiǎorénshū de shūmíng dēngjì zài běnzi shang, shōule zūjīn jiù kěyǐ názǒu le, dì-èr tiān huán shū shí zài bǎ jìlù yí ge yí ge de huàdiào, huán shū shǒuxù jiù suàn shì bànlǐ hǎo le.","v":"nếu mượn mang về nhà đọc thì mỗi cuốn mỗi ngày 2 xu; chọn xong sách thì đưa cho chủ quầy, chủ quầy cẩn thận ghi họ tên, địa chỉ của người thuê và tên những cuốn truyện được mượn vào sổ, thu tiền thuê xong là có thể mang đi; hôm sau khi trả sách thì gạch bỏ từng dòng ghi chép một, thế là xong thủ tục trả sách.","b":0},{"s":"","z":"印象中似乎没有什么押金，全凭信用。","p":"Yìnxiàng zhōng sìhū méiyǒu shénme yājīn, quán píng xìnyòng.","v":"Theo trí nhớ của tôi, hình như chẳng có tiền đặt cọc gì cả, hoàn toàn dựa vào chữ tín.","b":0},{"s":"","z":"我每天放学回家总要经过这家书摊，都要进去看看。","p":"Wǒ měi tiān fàngxué huí jiā zǒng yào jīngguò zhè jiā shūtān, dōu yào jìnqu kànkan.","v":"Ngày nào đi học về tôi cũng đi ngang qua quầy sách này, và lần nào cũng phải ghé vào xem.","b":0},{"s":"","z":"然而，这种影响了数代人的小人书，如今只能在北京的潘家园、护国寺等地的旧书摊上找到，一些印刷精美、有特色的作品则身价大涨，成了收藏品，甚至进了博物馆。","p":"Rán'ér, zhè zhǒng yǐngxiǎngle shù dài rén de xiǎorénshū, rújīn zhǐ néng zài Běijīng de Pānjiāyuán, Hùguósì děng dì de jiù shūtān shang zhǎodào, yìxiē yìnshuā jīngměi, yǒu tèsè de zuòpǐn zé shēnjià dà zhǎng, chéngle shōucángpǐn, shènzhì jìnle bówùguǎn.","v":"Thế nhưng, loại truyện tranh từng ảnh hưởng đến mấy thế hệ này, nay chỉ còn tìm thấy ở các sạp sách cũ tại những nơi như Phan Gia Viên, Hộ Quốc Tự ở Bắc Kinh; một số tác phẩm in đẹp, có nét đặc sắc thì giá trị tăng vọt, trở thành đồ sưu tầm, thậm chí còn được đưa vào viện bảo tàng.","b":0},{"s":"","z":"小人书和小人书摊已成为历史的记忆。","p":"Xiǎorénshū hé xiǎorénshū tān yǐ chéngwéi lìshǐ de jìyì.","v":"Truyện tranh và những quầy truyện tranh đã trở thành ký ức của lịch sử.","b":0}]}],"aud":[{"v":"audio/20-2.mp3","t":"audio/20-1.mp3"}],"gram":[{"id":"v_de_bu_qi","t":"动词+得/不+起","s":"(không) đủ khả năng, điều kiện để làm gì","b":"Theo sách, cấu trúc <b>động từ + 得/不 + 起</b> biểu thị <b>về mặt chủ quan</b> có (hoặc không có) <b>năng lực và điều kiện</b> để thực hiện (hoặc chịu đựng) một hành động nào đó. <b>V + 得起</b> = đủ khả năng; <b>V + 不起</b> = không đủ khả năng (thường vì tiền bạc, điều kiện).","r":["Khẳng định: V + 得起 — đủ khả năng/điều kiện: 经得起困难和时间考验 (chịu được thử thách).","Phủ định: V + 不起 — không đủ khả năng/điều kiện: 买不起书、买不起灯.","得/不 luôn chen giữa động từ và 起: ✗ 不买起 → ✓ 买不起."],"e":[["……这对于那些想看又买不起书的人来说，毫无疑问是件大好事。","……Zhè duìyú nàxiē xiǎng kàn yòu mǎi bu qǐ shū de rén lái shuō, háowú yíwèn shì jiàn dà hǎoshì.","…Điều này đối với những người muốn đọc mà không đủ tiền mua sách thì chắc chắn là một chuyện rất tốt. <i>(bài khoá)</i>"],["古时候，有个十分好学的年轻人，但他家里很穷，买不起灯，一到晚上就不能读书。","Gǔ shíhou, yǒu ge shífēn hàoxué de niánqīngrén, dàn tā jiāli hěn qióng, mǎi bu qǐ dēng, yí dào wǎnshang jiù bù néng dú shū.","Ngày xưa có một chàng trai rất ham học, nhưng nhà nghèo, không mua nổi đèn, nên cứ tối đến là không đọc sách được."],["只有经得起困难和时间考验的朋友才算是真正的朋友。","Zhǐyǒu jīng de qǐ kùnnan hé shíjiān kǎoyàn de péngyou cái suàn shì zhēnzhèng de péngyou.","Chỉ những người bạn chịu được thử thách của khó khăn và thời gian mới được coi là bạn thật sự."]],"d":[["古时候，有个十分好学的年轻人，但他家里很穷，买____灯，一到晚上就不能读书。","不起"],["只有经____困难和时间考验的朋友才算是真正的朋友。","得起"],["这对于那些想看又买____书的人来说，毫无疑问是件大好事。","不起"]],"w":"起 ở đây không mang nghĩa “đứng dậy/lên” mà chỉ khả năng, điều kiện (nhất là khả năng tài chính hoặc sức chịu đựng)."},{"id":"zhi","t":"支","s":"chống, đỡ (động từ); lượng từ","b":"Theo sách, <b>支</b> là <b>động từ</b>, chỉ việc dùng vật gì đó chống/đỡ để vật không bị rơi, đổ xuống. <b>支</b> cũng có thể làm <b>lượng từ</b>, dùng cho tác phẩm âm nhạc, đội ngũ (quân đội, đội ngũ) hoặc những vật có dạng que, cán dài.","r":["Động từ: (用 + vật) + 支着 + vật được đỡ: 用几块砖头支着木头板子、支着脑袋.","Lượng từ cho tác phẩm âm nhạc: 第二支曲子.","Lượng từ cho đội ngũ: 一支军队.","Lượng từ cho vật dạng que/cán: 十支枪、二十支香烟 (练习 2①)."],"e":[["他的两只手放在桌上，支着脑袋，正在想事情。","Tā de liǎng zhī shǒu fàng zài zhuō shang, zhīzhe nǎodai, zhèngzài xiǎng shìqing.","Anh ấy đặt hai tay lên bàn, chống đầu, đang suy nghĩ chuyện gì đó."],["……我家附近就有个小人书摊，就是一进街口靠墙的一个小棚子，里面用几块砖头支着粗糙的木头板子供人们坐着看书。","……Wǒ jiā fùjìn jiù yǒu ge xiǎorénshū tān, jiùshì yí jìn jiēkǒu kào qiáng de yí ge xiǎo péngzi, lǐmiàn yòng jǐ kuài zhuāntou zhīzhe cūcāo de mùtou bǎnzi gōng rénmen zuòzhe kàn shū.","…Gần nhà tôi có một quầy truyện tranh, đó là một cái lán nhỏ dựa vào tường ngay đầu phố, bên trong dùng mấy viên gạch kê những tấm ván gỗ thô ráp cho mọi người ngồi đọc sách. <i>(bài khoá)</i>"],["他弹第二支曲子时引起了牛的注意。","Tā tán dì-èr zhī qǔzi shí yǐnqǐle niú de zhùyì.","Khi anh ấy đàn đến bản nhạc thứ hai thì con bò bắt đầu chú ý."],["给他十支枪，他就能拉起一支军队来。","Gěi tā shí zhī qiāng, tā jiù néng lāqǐ yì zhī jūnduì lai.","Chỉ cần cho anh ta mười khẩu súng là anh ta có thể gây dựng nên cả một đội quân."]],"d":[["一般来说，一包香烟有二十____。","支"],["他的两只手放在桌上，____着脑袋，正在想事情。","支"],["给他十支枪，他就能拉起一____军队来。","支"]],"w":"Lượng từ 支 (vật dạng que, bản nhạc, đội ngũ) khác 只 (cùng âm zhī, dùng cho một chiếc trong một đôi, con vật: 两只手). Trong 练习 2①, điếu thuốc dùng 支 chứ không dùng 册 (册 dùng cho sách)."},{"id":"ping","t":"凭","s":"dựa vào (động từ); căn cứ vào (giới từ)","b":"Theo sách, <b>凭</b> là <b>động từ</b>, nghĩa là dựa vào (依靠). <b>凭</b> còn làm <b>giới từ</b>, cấu trúc thường dùng là <b>凭 + tân ngữ + động từ</b>, biểu thị căn cứ vào, dựa vào cái gì để làm gì.","r":["Động từ: (全/光)凭 + danh từ: 全凭信用、光凭经验.","Giới từ: 凭 + tân ngữ + động từ: 凭票进站 (căn cứ vào vé để vào ga).","凭什么 + động từ: hỏi “dựa vào đâu mà…”, thường mang giọng chất vấn: 你凭什么怀疑我偷了东西？"],"e":[["干工作不能光凭经验，还要有创新。","Gàn gōngzuò bù néng guāng píng jīngyàn, hái yào yǒu chuàngxīn.","Làm việc không thể chỉ dựa vào kinh nghiệm, mà còn phải biết đổi mới, sáng tạo."],["印象中似乎没有什么押金，全凭信用。","Yìnxiàng zhōng sìhū méiyǒu shénme yājīn, quán píng xìnyòng.","Theo trí nhớ của tôi, hình như chẳng có tiền đặt cọc gì cả, hoàn toàn dựa vào chữ tín. <i>(bài khoá)</i>"],["请旅客们准备好车票，凭票进站。","Qǐng lǚkèmen zhǔnbèi hǎo chēpiào, píng piào jìn zhàn.","Mời quý hành khách chuẩn bị sẵn vé, xuất trình vé để vào ga."],["你凭什么怀疑我偷了东西？","Nǐ píng shénme huáiyí wǒ tōule dōngxi?","Anh dựa vào đâu mà nghi tôi ăn trộm đồ?"]],"d":[["你的这个结论全____经验和想象，我认为不科学。","凭"],["请旅客们准备好车票，____票进站。","凭"],["干工作不能光____经验，还要有创新。","凭"]],"w":"凭 hay đi sau 全/光 để nhấn mạnh “chỉ dựa vào”: 全凭信用、光凭经验. Ở 练习 3④, 凭 đứng ngay sau 全 (vị trí C): 结论全凭经验和想象."},{"id":"jilu_jilu","t":"记录 vs 纪录","s":"ghi chép, biên bản — kỷ lục, phim tài liệu","b":"Hai từ cùng đọc <b>jìlù</b> nên rất dễ viết nhầm. Bảng của sách chỉ nêu <b>điểm khác nhau</b>: <b>记录</b> vừa là động từ (ghi lại) vừa là danh từ (biên bản, người ghi chép); <b>纪录</b> chỉ là danh từ, nghĩa là thành tích tốt nhất (kỷ lục) hoặc sự ghi lại các sự kiện có giá trị tin tức.","r":["记录 ① động từ: ghi lại lời nghe được hoặc sự việc xảy ra: 把会议的内容详细地记录下来.","记录 ② danh từ: tài liệu được ghi lại hoặc người làm công việc ghi chép: 把记录一个一个地画掉、做会议的记录.","纪录 ① danh từ: thành tích tốt nhất trong một thời kỳ, một phạm vi nhất định (kỷ lục): 打破世界纪录.","纪录 ② danh từ: sự ghi lại các sự kiện có giá trị tin tức: 纪录片 (phim tài liệu)."],"e":[["我已经把这次会议的内容详细地记录下来了。","Wǒ yǐjīng bǎ zhè cì huìyì de nèiróng xiángxì de jìlù xialai le.","Tôi đã ghi chép lại chi tiết nội dung cuộc họp lần này rồi."],["第二天还书时再把记录一个一个地画掉。","Dì-èr tiān huán shū shí zài bǎ jìlù yí ge yí ge de huàdiào.","Hôm sau khi trả sách thì gạch bỏ từng dòng ghi chép một. <i>(bài khoá)</i>"],["小刘，你来做这次会议的记录。","Xiǎo Liú, nǐ lái zuò zhè cì huìyì de jìlù.","Tiểu Lưu, cậu ghi biên bản cuộc họp lần này nhé."],["他在本次比赛中打破了世界纪录。","Tā zài běn cì bǐsài zhōng dǎpòle shìjiè jìlù.","Trong cuộc thi lần này anh ấy đã phá kỷ lục thế giới."],["学校带孩子们看了一部有教育意义的纪录片。","Xuéxiào dài háizimen kànle yí bù yǒu jiàoyù yìyì de jìlùpiàn.","Nhà trường đưa các em đi xem một bộ phim tài liệu có ý nghĩa giáo dục."]],"d":[["他又创造了新的奥运会____。","纪录"],["小张呢？不是安排她来做会议____吗？","记录"],["我很喜欢看新闻____片。","纪录"],["甲骨文____了3000多年以前的中国历史和社会生活。","记录"]],"w":"Mẹo: cần động từ “ghi lại” → chỉ dùng 记录; “kỷ lục” (创造/打破…纪录) và “phim tài liệu” (纪录片) → dùng 纪录."}],"ext":[["俱乐部","jùlèbù","câu lạc bộ"],["幼儿园","yòu'éryuán","nhà trẻ, trường mẫu giáo"],["博物馆","bówùguǎn","viện bảo tàng"],["酒吧","jiǔbā","quán bar"],["法院","fǎyuàn","tòa án"],["海关","hǎiguān","hải quan"],["生产","shēngchǎn","sản xuất"],["发明","fāmíng","phát minh"],["设计","shèjì","thiết kế"],["业务","yèwù","nghiệp vụ, công việc chuyên môn"],["项目","xiàngmù","hạng mục, dự án"],["效率","xiàolǜ","hiệu suất, năng suất"],["合法","héfǎ","hợp pháp"],["公平","gōngpíng","công bằng"]],"extt":"单位、场所 / 生产2","notes":"Nguồn cuối bài khoá: 改编自《中国电视报》，作者：俞万林. Bài khoá 664 chữ (theo sách), 5 đoạn văn trong sách (tr.22–24), chia thành 3 phần: đoạn 1–2 (từ 1–13) / đoạn 3 (từ 14–24) / đoạn 4–5 (từ 25–36 + 2 专名). Từ số 1, 3, 12, 14, 15, 19, 21, 36 có dấu * (ngoài đề cương). Từ 12 毫无 trong sách không ghi từ loại nên để pos rỗng. Câu bài khoá “租借小人书很便宜……交给摊主；假如借走回家看……办理好了。” dài nên cắt tại “；”; hai câu dài >45 chữ khác (đoạn 2 và câu “随着小人书的流行……”) không có ；nên giữ nguyên một dòng. Phần 注释 gồm 3 mục 词语例释 (动词+得/不+起, 支, 凭) và 1 词语辨析 (记录—纪录; bảng sách chỉ có 不同点, không có 共同点). Ví dụ (3) của 动词+得/不+起 có chú thích “考验（kǎoyàn, sự thử thách）”, ví dụ (3) của 支 có chú thích “曲子（qǔzi, ca khúc, bài hát）” — đã bỏ phần chú thích khi chép câu. Drill: 支 ① lấy từ 练习2①; 凭 ① từ 练习3④; 记录—纪录 lấy đủ 4 câu 做一做 (câu (1) sách đã cho đáp án 纪录, câu (2)–(4) đáp án do người soạn giải); các drill còn lại đặt dựa trên câu ví dụ của sách vì 练一练 là bài hoàn thành câu mở. vocab_ex của 年代, 单调, 从事, 疑问, 粗糙, 翻, 整齐, 身材, 假如, 办理, 涨 lấy từ câu bài 练习 của sách (đã điền đáp án); của 支, 凭 lấy từ phần 注释; còn lại trích câu/vế câu trong bài khoá. Bảng 扩展 có 2 chủ đề (单位、场所 và 生产2) gộp chung một bảng; sách chỉ có chữ Hán + pinyin, nghĩa tiếng Việt do người soạn bổ sung.","order":[{"z":"小人书，是一种以书的形式出版的连环画。","t":["小人书","是","一种","以书","的","形式","出版","的","连环画"],"v":"“Tiểu nhân thư” là một loại truyện tranh liên hoàn được xuất bản dưới hình thức sách."},{"z":"不仅小孩子爱看，还有无数的青少年和大人也爱看。","t":["不仅","小孩子","爱看","还有","无数","的","青少年","和","大人","也","爱看"],"v":"Không chỉ trẻ nhỏ thích đọc, mà vô số thanh thiếu niên và người lớn cũng mê."},{"z":"印象中似乎没有什么押金，全凭信用。","t":["印象","中","似乎","没有","什么","押金","全","凭","信用"],"v":"Theo trí nhớ của tôi, hình như chẳng có tiền đặt cọc gì cả, hoàn toàn dựa vào chữ tín."},{"z":"小人书和小人书摊已成为历史的记忆。","t":["小人书","和","小人","书摊","已","成为","历史","的","记忆"],"v":"Truyện tranh và những quầy truyện tranh đã trở thành ký ức của lịch sử."},{"z":"他的两只手放在桌上，支着脑袋，正在想事情。","t":["他","的","两只手","放在","桌上","支","着","脑袋","正在","想","事情"],"v":"Anh ấy đặt hai tay lên bàn, chống đầu, đang suy nghĩ chuyện gì đó."},{"z":"他弹第二支曲子时引起了牛的注意。","t":["他弹","第二支","曲子","时","引起","了","牛","的","注意"],"v":"Khi anh ấy đàn đến bản nhạc thứ hai thì con bò bắt đầu chú ý."},{"z":"给他十支枪，他就能拉起一支军队来。","t":["给","他","十支","枪","他","就","能拉起","一支","军队","来"],"v":"Chỉ cần cho anh ta mười khẩu súng là anh ta có thể gây dựng nên cả một đội quân."},{"z":"干工作不能光凭经验，还要有创新。","t":["干","工作","不能","光凭","经验","还要","有","创新"],"v":"Làm việc không thể chỉ dựa vào kinh nghiệm, mà còn phải biết đổi mới, sáng tạo."},{"z":"请旅客们准备好车票，凭票进站。","t":["请","旅客","们","准备","好","车票","凭票","进站"],"v":"Mời quý hành khách chuẩn bị sẵn vé, xuất trình vé để vào ga."},{"z":"你凭什么怀疑我偷了东西？","t":["你","凭","什么","怀疑","我","偷","了","东西"],"v":"Anh dựa vào đâu mà nghi tôi ăn trộm đồ?"},{"z":"我已经把这次会议的内容详细地记录下来了。","t":["我","已经","把","这次","会议","的","内容","详细","地","记录下来","了"],"v":"Tôi đã ghi chép lại chi tiết nội dung cuộc họp lần này rồi."},{"z":"第二天还书时再把记录一个一个地画掉。","t":["第二天","还书时","再","把","记录","一个","一个","地画","掉"],"v":"Hôm sau khi trả sách thì gạch bỏ từng dòng ghi chép một. (bài khoá)"},{"z":"小刘，你来做这次会议的记录。","t":["小","刘","你","来","做","这次",
