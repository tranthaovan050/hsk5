m sao, thuyền trưởng già ra lệnh cho họ lập tức mở khoang hàng, ra sức bơm nước vào trong."},{"h":"使劲（儿）","p":"shǐ jìn (r)","v":"cố gắng, gắng sức","k":"đgt.","x":0,"ez":"正当水手们慌张得不知如何是好时，老船长命令水手们立刻打开货舱，使劲儿朝里面放水。","ev":"Đúng lúc các thủy thủ hoảng hốt không biết phải làm sao, thuyền trưởng già ra lệnh cho họ lập tức mở khoang hàng, ra sức bơm nước vào trong."},{"h":"朝","p":"cháo","v":"về phía, hướng về","k":"giới.","x":0,"ez":"我们学校的正门坐西朝东。","ev":"Cổng chính trường chúng tôi quay lưng về hướng tây, nhìn ra hướng đông."},{"h":"简直","p":"jiǎnzhí","v":"quả là, thật là","k":"phó.","x":0,"ez":"听到刘方离婚的消息时，我简直不敢相信自己的耳朵。","ev":"Khi nghe tin Lưu Phương ly hôn, tôi quả thật không dám tin vào tai mình."},{"h":"沉","p":"chén","v":"chìm, lặn","k":"đgt.","x":1,"ez":"船长简直是疯了，这样做只会增加船的压力，船就会下沉得更快，这不是找死吗？","ev":"Thuyền trưởng đúng là điên rồi, làm thế chỉ tăng thêm sức ép cho con tàu, tàu sẽ chìm nhanh hơn, thế chẳng phải là tự tìm đường chết sao?"},{"h":"严肃","p":"yánsù","v":"nghiêm túc, nghiêm nghị, trang nghiêm","k":"tt.","x":0,"ez":"看着船长严肃的表情，水手们还是照做了。","ev":"Nhìn vẻ mặt nghiêm nghị của thuyền trưởng, các thủy thủ vẫn làm theo."},{"h":"猛烈","p":"měngliè","v":"mạnh, dữ dội","k":"tt.","x":1,"ez":"随着货舱里的水位越升越高，船一点一点地下沉，狂风巨浪依然猛烈，对船的威胁却减小了，船也渐渐取得了平衡。","ev":"Mực nước trong khoang hàng càng dâng cao, con tàu chìm xuống từng chút một; gió giật sóng dữ vẫn mãnh liệt, nhưng mối đe dọa đối với con tàu lại giảm đi, con tàu cũng dần lấy lại thăng bằng."},{"h":"狂","p":"kuáng","v":"mạnh, điên cuồng","k":"tt.","x":0,"ez":"……往往一场人生的狂风巨浪便会把他们彻底地打翻在地。","ev":"… thường chỉ một trận cuồng phong sóng dữ của cuộc đời cũng đủ lật nhào họ hoàn toàn."},{"h":"威胁","p":"wēixié","v":"uy hiếp, đe dọa","k":"đgt.","x":0,"ez":"在人口压力面前，经济发展、社会进步都受到了巨大威胁。","ev":"Trước sức ép dân số, sự phát triển kinh tế và tiến bộ xã hội đều bị đe dọa nghiêm trọng."},{"h":"平衡","p":"pínghéng","v":"thăng bằng","k":"tt.","x":0,"ez":"初学骑自行车最重要的是注意保持平衡。","ev":"Khi mới tập đi xe đạp, điều quan trọng nhất là chú ý giữ thăng bằng."},{"h":"吨","p":"dūn","v":"tấn","k":"lượng.","x":0,"ez":"几万吨的钢铁巨轮很少有被打翻的，……","ev":"Những con tàu thép khổng lồ nặng mấy vạn tấn rất hiếm khi bị lật…"},{"h":"钢铁","p":"gāngtiě","v":"sắt thép","k":"dt.","x":0,"ez":"几万吨的钢铁巨轮很少有被打翻的，被打翻的常常是根基很轻的小船。","ev":"Những con tàu thép khổng lồ nặng mấy vạn tấn rất hiếm khi bị lật, những chiếc bị lật thường là thuyền nhỏ có phần đế rất nhẹ."},{"h":"根基","p":"gēnjī","v":"nền tảng, nền móng","k":"dt.","x":1,"ez":"……被打翻的常常是根基很轻的小船。","ev":"… những chiếc bị lật thường là thuyền nhỏ có phần đế rất nhẹ."},{"h":"重量","p":"zhòngliàng","v":"trọng lượng","k":"dt.","x":0,"ez":"船在有一定重量的时候是最安全的，在空的时候则是最危险的。","ev":"Tàu có một trọng lượng nhất định là lúc an toàn nhất, còn khi trống rỗng lại là lúc nguy hiểm nhất."},{"h":"相似","p":"xiāngsì","v":"tương tự, giống nhau","k":"tt.","x":0,"ez":"另一个相似的故事发生在某一著名风景区，……","ev":"Một câu chuyện tương tự xảy ra ở một khu thắng cảnh nổi tiếng nọ…"},{"h":"风景","p":"fēngjǐng","v":"phong cảnh, cảnh vật","k":"dt.","x":0,"ez":"另一个相似的故事发生在某一著名风景区，那里有一段被当地人称为“鬼谷”的最危险的路段，山路非常窄，两边是万丈深渊。","ev":"Một câu chuyện tương tự xảy ra ở một khu thắng cảnh nổi tiếng nọ: ở đó có một đoạn đường nguy hiểm nhất, được người dân địa phương gọi là “Thung lũng Quỷ”; đường núi vô cùng hẹp, hai bên là vực sâu thăm thẳm."},{"h":"窄","p":"zhǎi","v":"chật, hẹp","k":"tt.","x":0,"ez":"……山路非常窄，两边是万丈深渊。","ev":"… đường núi vô cùng hẹp, hai bên là vực sâu thăm thẳm."},{"h":"万丈","p":"wànzhàng","v":"cao ngất, muôn trượng","k":"sl.","x":1,"ez":"……山路非常窄，两边是万丈深渊。","ev":"… đường núi vô cùng hẹp, hai bên là vực sâu thăm thẳm."},{"h":"深渊","p":"shēnyuān","v":"vực sâu, vực thẳm","k":"dt.","x":1,"ez":"……山路非常窄，两边是万丈深渊。","ev":"… đường núi vô cùng hẹp, hai bên là vực sâu thăm thẳm."},{"h":"游览","p":"yóulǎn","v":"tham quan, dạo chơi","k":"đgt.","x":0,"ez":"每当导游们带队来这里游览时，一定要让游客们背点或者拿点什么东西。","ev":"Mỗi khi các hướng dẫn viên dẫn đoàn đến đây tham quan, họ nhất định bắt du khách phải đeo hoặc cầm theo thứ gì đó."},{"h":"发抖","p":"fādǒu","v":"run, run rẩy","k":"đgt.","x":0,"ez":"这么危险的地方，我不拿东西两腿都发抖，再负重前行，那不是更容易摔倒吗？","ev":"Chỗ nguy hiểm thế này, không cầm gì mà hai chân tôi đã run lẩy bẩy rồi, giờ còn mang vác nặng mà đi thì chẳng phải càng dễ ngã sao?"},{"h":"负重","p":"fùzhòng","v":"vác nặng","k":"đgt.","x":1,"ez":"假如你感觉到了有风险，谨慎地负重前行，反而会更安全。","ev":"Nếu bạn cảm thấy có nguy hiểm mà cẩn thận mang vác nặng bước tiếp thì ngược lại còn an toàn hơn."},{"h":"摔倒","p":"shuāidǎo","v":"ngã, té, rơi xuống","k":"đgt.","x":0,"ez":"这么危险的地方，我不拿东西两腿都发抖，再负重前行，那不是更容易摔倒吗？","ev":"Chỗ nguy hiểm thế này, không cầm gì mà hai chân tôi đã run lẩy bẩy rồi, giờ còn mang vác nặng mà đi thì chẳng phải càng dễ ngã sao?"},{"h":"妇女","p":"fùnǚ","v":"phụ nữ","k":"dt.","x":0,"ez":"“这么危险的地方，我不拿东西两腿都发抖，再负重前行，那不是更容易摔倒吗？”一位妇女不解地问。","ev":"“Chỗ nguy hiểm thế này, không cầm gì mà hai chân tôi đã run lẩy bẩy rồi, giờ còn mang vác nặng mà đi thì chẳng phải càng dễ ngã sao?” – một người phụ nữ khó hiểu hỏi."},{"h":"起","p":"qǐ","v":"vụ (việc)","k":"lượng.","x":0,"ez":"这里以前发生过好几起意外，……","ev":"Trước đây ở chỗ này từng xảy ra mấy vụ tai nạn…"},{"h":"丝毫","p":"sīháo","v":"chút nào, tí nào","k":"tt.","x":0,"ez":"这里以前发生过好几起意外，都是迷路的游客在丝毫没有感觉到压力的情况下，一不小心滚下去的。","ev":"Trước đây ở chỗ này từng xảy ra mấy vụ tai nạn, đều là những du khách lạc đường, trong lúc chẳng hề cảm thấy chút áp lực nào, sơ ý một cái là lăn xuống vực."},{"h":"滚","p":"gǔn","v":"lăn, lộn","k":"đgt.","x":0,"ez":"……都是迷路的游客在丝毫没有感觉到压力的情况下，一不小心滚下去的。","ev":"… đều là những du khách lạc đường, trong lúc chẳng hề cảm thấy chút áp lực nào, sơ ý một cái là lăn xuống vực."},{"h":"风险","p":"fēngxiǎn","v":"sự mạo hiểm, sự nguy hiểm","k":"dt.","x":0,"ez":"你决定在海外投资，有没有考虑到风险？","ev":"Bạn quyết định đầu tư ra nước ngoài, đã tính đến rủi ro chưa?"},{"h":"谨慎","p":"jǐnshèn","v":"cẩn thận, thận trọng","k":"tt.","x":0,"ez":"这毕竟是高考择校，我们必须谨慎对待。","ev":"Dù sao đây cũng là chuyện chọn trường thi đại học, chúng ta phải cân nhắc thận trọng."},{"h":"效应","p":"xiàoyìng","v":"tác động, ảnh hưởng, hiệu ứng","k":"dt.","x":1,"ez":"这就是“压力效应”。","ev":"Đó chính là “hiệu ứng áp lực”."},{"h":"胸","p":"xiōng","v":"ngực, lòng","k":"dt.","x":0,"ez":"那些胸怀理想、肩上有责任感的人，才能承受住压力，从历史的风雨中走过“鬼谷”；","ev":"Những người mang trong lòng lý tưởng, trên vai gánh tinh thần trách nhiệm mới có thể chịu đựng được áp lực, vượt qua “Thung lũng Quỷ” giữa mưa gió của lịch sử;"},{"h":"承受","p":"chéngshòu","v":"chịu đựng, chấp nhận","k":"đgt.","x":0,"ez":"那些胸怀理想、肩上有责任感的人，才能承受住压力，从历史的风雨中走过“鬼谷”；","ev":"Những người mang trong lòng lý tưởng, trên vai gánh tinh thần trách nhiệm mới có thể chịu đựng được áp lực, vượt qua “Thung lũng Quỷ” giữa mưa gió của lịch sử;"},{"h":"和尚","p":"héshang","v":"hòa thượng","k":"dt.","x":1,"ez":"而那些没有理想，没有一点压力，做一天和尚撞一天钟的人，就像一艘风暴中的空船，……","ev":"Còn những người không có lý tưởng, chẳng có chút áp lực nào, sống kiểu “làm hòa thượng ngày nào gõ chuông ngày ấy” thì giống như một con tàu rỗng giữa cơn bão…"},{"h":"钟","p":"zhōng","v":"chuông","k":"dt.","x":1,"ez":"而那些没有理想，没有一点压力，做一天和尚撞一天钟的人，就像一艘风暴中的空船，……","ev":"Còn những người không có lý tưởng, chẳng có chút áp lực nào, sống kiểu “làm hòa thượng ngày nào gõ chuông ngày ấy” thì giống như một con tàu rỗng giữa cơn bão…"},{"h":"彻底","p":"chèdǐ","v":"triệt để, hoàn toàn","k":"tt.","x":0,"ez":"你的病好得不彻底，还应该再休息几天。","ev":"Bệnh của bạn chưa khỏi hẳn, nên nghỉ thêm vài ngày nữa."}]],"texts":[{"no":1,"tz":"","tv":"","lines":[{"s":"","z":"有一位经验丰富的老船长，一次返航中，天气恶劣，他们的船遇到了可怕的巨大风浪。","p":"Yǒu yí wèi jīngyàn fēngfù de lǎo chuánzhǎng, yí cì fǎnháng zhōng, tiānqì èliè, tāmen de chuán yùdàole kěpà de jùdà fēnglàng.","v":"Có một vị thuyền trưởng già giàu kinh nghiệm. Trong một lần quay tàu trở về, thời tiết rất xấu, con tàu của họ gặp phải sóng gió khổng lồ đáng sợ.","b":0},{"s":"","z":"正当水手们慌张得不知如何是好时，老船长命令水手们立刻打开货舱，使劲儿朝里面放水。","p":"Zhèngdāng shuǐshǒumen huāngzhāng de bù zhī rúhé shì hǎo shí, lǎo chuánzhǎng mìnglìng shuǐshǒumen lìkè dǎkāi huòcāng, shǐjìnr cháo lǐmiàn fàng shuǐ.","v":"Đúng lúc các thủy thủ hoảng hốt đến mức không biết phải làm sao, vị thuyền trưởng già ra lệnh cho họ lập tức mở khoang hàng, ra sức bơm nước vào bên trong.","b":0},{"s":"","z":"“船长简直是疯了，这样做只会增加船的压力，船就会下沉得更快，这不是找死吗？”一个年轻的水手骂道。","p":"“Chuánzhǎng jiǎnzhí shì fēng le, zhèyàng zuò zhǐ huì zēngjiā chuán de yālì, chuán jiù huì xiàchén de gèng kuài, zhè bú shì zhǎosǐ ma?” Yí ge niánqīng de shuǐshǒu mà dào.","v":"“Thuyền trưởng đúng là điên rồi, làm thế chỉ tăng thêm sức ép cho con tàu, tàu sẽ chìm nhanh hơn, thế chẳng phải là tự tìm đường chết sao?” – một thủy thủ trẻ chửi.","b":0},{"s":"","z":"看着船长严肃的表情，水手们还是照做了。","p":"Kànzhe chuánzhǎng yánsù de biǎoqíng, shuǐshǒumen háishi zhào zuò le.","v":"Nhìn vẻ mặt nghiêm nghị của thuyền trưởng, các thủy thủ vẫn làm theo.","b":0},{"s":"","z":"随着货舱里的水位越升越高，船一点一点地下沉，狂风巨浪依然猛烈，对船的威胁却减小了，船也渐渐取得了平衡。","p":"Suízhe huòcāng li de shuǐwèi yuè shēng yuè gāo, chuán yìdiǎn yìdiǎn de xiàchén, kuángfēng jùlàng yīrán měngliè, duì chuán de wēixié què jiǎnxiǎo le, chuán yě jiànjiàn qǔdéle pínghéng.","v":"Mực nước trong khoang hàng càng dâng cao, con tàu chìm xuống từng chút một; gió giật sóng dữ vẫn mãnh liệt như cũ, nhưng mối đe dọa đối với con tàu lại giảm đi, con tàu cũng dần dần lấy lại được thăng bằng.","b":0},{"s":"","z":"船长望着松了一口气的水手们说：“几万吨的钢铁巨轮很少有被打翻的，被打翻的常常是根基很轻的小船。","p":"Chuánzhǎng wàngzhe sōngle yì kǒu qì de shuǐshǒumen shuō: “Jǐ wàn dūn de gāngtiě jùlún hěn shǎo yǒu bèi dǎfān de, bèi dǎfān de chángcháng shì gēnjī hěn qīng de xiǎo chuán.","v":"Thuyền trưởng nhìn các thủy thủ vừa thở phào nhẹ nhõm, nói: “Những con tàu thép khổng lồ nặng mấy vạn tấn rất hiếm khi bị lật, những chiếc bị lật thường là thuyền nhỏ có phần đế rất nhẹ.","b":1},{"s":"","z":"船在有一定重量的时候是最安全的，在空的时候则是最危险的。”","p":"Chuán zài yǒu yídìng zhòngliàng de shíhou shì zuì ānquán de, zài kōng de shíhou zé shì zuì wēixiǎn de.”","v":"Tàu có một trọng lượng nhất định là lúc an toàn nhất, còn khi trống rỗng lại là lúc nguy hiểm nhất.”","b":0},{"s":"","z":"另一个相似的故事发生在某一著名风景区，那里有一段被当地人称为“鬼谷”的最危险的路段，山路非常窄，两边是万丈深渊。","p":"Lìng yí ge xiāngsì de gùshi fāshēng zài mǒu yī zhùmíng fēngjǐngqū, nàli yǒu yí duàn bèi dāngdìrén chēngwéi “Guǐgǔ” de zuì wēixiǎn de lùduàn, shānlù fēicháng zhǎi, liǎngbiān shì wànzhàng shēnyuān.","v":"Một câu chuyện tương tự xảy ra ở một khu thắng cảnh nổi tiếng nọ: ở đó có một đoạn đường nguy hiểm nhất, được người dân địa phương gọi là “Thung lũng Quỷ”; đường núi vô cùng hẹp, hai bên là vực sâu thăm thẳm.","b":0},{"s":"","z":"每当导游们带队来这里游览时，一定要让游客们背点或者拿点什么东西。","p":"Měi dāng dǎoyóumen dài duì lái zhèli yóulǎn shí, yídìng yào ràng yóukèmen bēi diǎn huòzhě ná diǎn shénme dōngxi.","v":"Mỗi khi các hướng dẫn viên dẫn đoàn đến đây tham quan, họ nhất định bắt du khách phải đeo hoặc cầm theo thứ gì đó.","b":0},{"s":"","z":"“这么危险的地方，我不拿东西两腿都发抖，再负重前行，那不是更容易摔倒吗？”一位妇女不解地问。","p":"“Zhème wēixiǎn de dìfang, wǒ bù ná dōngxi liǎng tuǐ dōu fādǒu, zài fùzhòng qiánxíng, nà bú shì gèng róngyì shuāidǎo ma?” Yí wèi fùnǚ bùjiě de wèn.","v":"“Chỗ nguy hiểm thế này, không cầm gì mà hai chân tôi đã run lẩy bẩy rồi, giờ còn mang vác nặng mà đi thì chẳng phải càng dễ ngã sao?” – một người phụ nữ khó hiểu hỏi.","b":0},{"s":"","z":"导游小姐解释道：“这里以前发生过好几起意外，都是迷路的游客在丝毫没有感觉到压力的情况下，一不小心滚下去的。","p":"Dǎoyóu xiǎojiě jiěshì dào: “Zhèli yǐqián fāshēngguo hǎo jǐ qǐ yìwài, dōu shì mílù de yóukè zài sīháo méiyǒu gǎnjué dào yālì de qíngkuàng xià, yí bù xiǎoxīn gǔn xiàqu de.","v":"Cô hướng dẫn viên giải thích: “Trước đây ở chỗ này từng xảy ra mấy vụ tai nạn, đều là những du khách lạc đường, trong lúc chẳng hề cảm thấy chút áp lực nào, sơ ý một cái là lăn xuống vực.","b":1},{"s":"","z":"当地人每天都从这条路上背着东西来来往往，却从来没人出事。","p":"Dāngdìrén měi tiān dōu cóng zhè tiáo lù shang bēizhe dōngxi láiláiwǎngwǎng, què cónglái méi rén chūshì.","v":"Người dân địa phương ngày nào cũng mang vác đồ đạc qua lại trên con đường này, vậy mà chưa từng có ai gặp chuyện.","b":0},{"s":"","z":"假如你感觉到了有风险，谨慎地负重前行，反而会更安全。”","p":"Jiǎrú nǐ gǎnjué dàole yǒu fēngxiǎn, jǐnshèn de fùzhòng qiánxíng, fǎn'ér huì gèng ānquán.”","v":"Nếu bạn cảm thấy có nguy hiểm mà cẩn thận mang vác nặng bước tiếp thì ngược lại còn an toàn hơn.”","b":0},{"s":"","z":"这就是“压力效应”。","p":"Zhè jiù shì “yālì xiàoyìng”.","v":"Đó chính là “hiệu ứng áp lực”.","b":0},{"s":"","z":"那些胸怀理想、肩上有责任感的人，才能承受住压力，从历史的风雨中走过“鬼谷”；","p":"Nàxiē xiōnghuái lǐxiǎng, jiān shang yǒu zérèngǎn de rén, cái néng chéngshòu zhù yālì, cóng lìshǐ de fēngyǔ zhōng zǒuguò “Guǐgǔ”;","v":"Những người mang trong lòng lý tưởng, trên vai gánh tinh thần trách nhiệm mới có thể chịu đựng được áp lực, vượt qua “Thung lũng Quỷ” giữa mưa gió của lịch sử;","b":0},{"s":"","z":"而那些没有理想，没有一点压力，做一天和尚撞一天钟的人，就像一艘风暴中的空船，往往一场人生的狂风巨浪便会把他们彻底地打翻在地。","p":"ér nàxiē méiyǒu lǐxiǎng, méiyǒu yìdiǎn yālì, zuò yì tiān héshang zhuàng yì tiān zhōng de rén, jiù xiàng yì sōu fēngbào zhōng de kōng chuán, wǎngwǎng yì chǎng rénshēng de kuángfēng jùlàng biàn huì bǎ tāmen chèdǐ de dǎfān zài dì.","v":"còn những người không có lý tưởng, chẳng có chút áp lực nào, sống kiểu “làm hòa thượng ngày nào gõ chuông ngày ấy” thì giống như một con tàu rỗng giữa cơn bão, thường chỉ một trận cuồng phong sóng dữ của cuộc đời cũng đủ lật nhào họ hoàn toàn.","b":0}]}],"aud":[{"v":"audio/25-2.mp3","t":"audio/25-1.mp3"}],"gram":[{"id":"chao","t":"朝","s":"quay về, hướng về; về phía (động từ / giới từ)","b":"<b>朝</b> trước hết là <b>động từ</b>, nghĩa là <b>quay mặt về, hướng về</b> một phía. <b>朝</b> cũng có thể làm <b>giới từ</b>, chỉ <b>phương hướng mà động tác nhắm tới</b>, đứng trước động từ. Khác với <b>向</b>, <b>朝 không thể làm bổ ngữ</b> (không đứng sau động từ).","r":["Động từ: chủ ngữ + 朝 + phương hướng: 正门坐西朝东 (cổng chính quay về hướng đông); 脸朝里 (mặt quay vào trong).","Giới từ: 朝 + phương hướng/đối tượng + động từ: 朝里面放水、朝我们走来。","Lỗi hay gặp: dùng 朝 làm bổ ngữ sau động từ — ✗ 走朝我们 → ✓ 朝我们走来."],"e":[["我们学校的正门坐西朝东。","Wǒmen xuéxiào de zhèngmén zuò xī cháo dōng.","Cổng chính trường chúng tôi quay lưng về hướng tây, nhìn ra hướng đông."],["我进去时，他正脸朝里和李主任商量着什么，没注意到我的到来。","Wǒ jìnqu shí, tā zhèng liǎn cháo lǐ hé Lǐ zhǔrèn shāngliangzhe shénme, méi zhùyì dào wǒ de dàolái.","Lúc tôi bước vào, anh ấy đang quay mặt vào trong bàn bạc gì đó với chủ nhiệm Lý, không để ý thấy tôi đến."],["……老船长命令水手们立刻打开货舱，使劲儿朝里面放水。","…… lǎo chuánzhǎng mìnglìng shuǐshǒumen lìkè dǎkāi huòcāng, shǐjìnr cháo lǐmiàn fàng shuǐ.","… vị thuyền trưởng già ra lệnh cho các thủy thủ lập tức mở khoang hàng, ra sức bơm nước vào bên trong. <i>(bài khoá)</i>"],["我仿佛看到胜利正朝我们走来。","Wǒ fǎngfú kàndào shènglì zhèng cháo wǒmen zǒu lái.","Tôi như thấy chiến thắng đang tiến về phía chúng ta."]],"d":[["我们学校的正门坐西____东。","朝"],["我仿佛看到胜利正____我们走来。","朝"],["老船长命令水手们立刻打开货舱，使劲儿____里面放水。","朝"],["请问，去国家图书馆是____这个方向走吗？","朝"]],"w":"朝 và 向 đều đứng được trước động từ để chỉ hướng (朝/向我们走来), nhưng chỉ 向 làm được bổ ngữ sau động từ; 朝 thì không."},{"id":"jianzhi","t":"简直","s":"quả là, thật là, đúng là (phó từ)","b":"<b>简直</b> là <b>phó từ</b>, biểu thị sự việc <b>gần như hoàn toàn là như vậy, nhưng thực ra không hẳn hoàn toàn</b> như vậy. Mang <b>giọng điệu khoa trương, nhấn mạnh</b>. Đứng trước thành phần vị ngữ (động từ, cụm 是/像…).","r":["简直 + cụm động từ: 我简直不敢相信自己的耳朵。","简直 + 像/是 …: 与从前相比，简直像换了个人；船长简直是疯了。","Dùng để phóng đại cảm nhận của người nói, không phải để mô tả chính xác, khách quan."],"e":[["听到刘方离婚的消息时，我简直不敢相信自己的耳朵。","Tīngdào Liú Fāng líhūn de xiāoxi shí, wǒ jiǎnzhí bù gǎn xiāngxìn zìjǐ de ěrduo.","Khi nghe tin Lưu Phương ly hôn, tôi quả thật không dám tin vào tai mình."],["这次张小姐变得格外客气、礼貌，与从前相比，简直像换了个人。","Zhè cì Zhāng xiǎojiě biàn de géwài kèqi, lǐmào, yǔ cóngqián xiāngbǐ, jiǎnzhí xiàng huànle ge rén.","Lần này cô Trương trở nên đặc biệt khách sáo, lịch sự; so với trước kia, cứ như thành một người khác vậy."],["“船长简直是疯了，这样做只会增加船的压力，船就会下沉得更快，这不是找死吗？”","“Chuánzhǎng jiǎnzhí shì fēng le, zhèyàng zuò zhǐ huì zēngjiā chuán de yālì, chuán jiù huì xiàchén de gèng kuài, zhè bú shì zhǎosǐ ma?”","“Thuyền trưởng đúng là điên rồi, làm thế chỉ tăng thêm sức ép cho con tàu, tàu sẽ chìm nhanh hơn, thế chẳng phải là tự tìm đường chết sao?” <i>(bài khoá)</i>"]],"d":[["听到刘方离婚的消息时，我____不敢相信自己的耳朵。","简直"],["昨晚的比赛太精彩了，林丹____太厉害了！","简直"],["你病成这样还要去上班，____是不要命了！","简直"]],"w":"简直 là cách nói cường điệu: sự việc “gần như là thế” chứ không hoàn toàn là thế, nên thường dùng để bày tỏ cảm xúc mạnh (ngạc nhiên, bực bội, khen ngợi) của người nói."},{"id":"yansu_yange","t":"严肃 vs 严格","s":"nghiêm túc, nghiêm nghị – nghiêm khắc, chặt chẽ","b":"<b>严肃</b> và <b>严格</b> đều là <b>tính từ</b>, đều biểu thị <b>nghiêm túc, không lơi lỏng</b>, nhưng phạm vi sử dụng khác nhau khá nhiều, <b>không thể thay thế cho nhau</b>.","r":["<b>严肃</b> nhấn mạnh sự nghiêm túc về <b>tác phong, thái độ</b>…: 小林这件事影响恶劣，我们对他一定要严肃批评。","<b>严格</b> biểu thị nghiêm túc, không lơi lỏng khi <b>tuân thủ chế độ hoặc nắm vững tiêu chuẩn</b>: 小华妈妈，平时对孩子教育很严格。","<b>严肃</b> còn biểu thị <b>nét mặt, bầu không khí</b>… khiến người ta vừa tôn trọng vừa e sợ: 一句幽默的笑话可以让紧张严肃的气氛变得轻松愉快。","<b>严格</b> không có nghĩa này."],"e":[["小林这件事影响恶劣，我们对他一定要严肃批评。","Xiǎo Lín zhè jiàn shì yǐngxiǎng èliè, wǒmen duì tā yídìng yào yánsù pīpíng.","Chuyện này của Tiểu Lâm gây ảnh hưởng rất xấu, chúng ta nhất định phải phê bình cậu ấy nghiêm túc."],["小华妈妈，平时对孩子教育很严格。","Xiǎo Huá māma, píngshí duì háizi jiàoyù hěn yángé.","Mẹ của Tiểu Hoa bình thường dạy con rất nghiêm khắc."],["一句幽默的笑话可以让紧张严肃的气氛变得轻松愉快。","Yí jù yōumò de xiàohua kěyǐ ràng jǐnzhāng yánsù de qìfēn biàn de qīngsōng yúkuài.","Một câu chuyện cười hài hước có thể khiến bầu không khí căng thẳng, nặng nề trở nên thoải mái, vui vẻ."]],"d":[["刘老师虽然看上去很____，但其实对人很友善。","严肃"],["这是一个决定公司发展的重大问题，应引起高度重视，____对待。","严肃"],["实验过程中，温度、水分等条件都要____地控制。","严格"],["每次读到这段历史都会让我____地思考。","严肃"]],"w":"Mẹo: nói về thái độ, nét mặt, bầu không khí → 严肃 (严肃的表情、严肃的气氛、严肃批评); nói về việc tuân thủ quy định, tiêu chuẩn → 严格 (严格控制、对孩子教育很严格)."}],"ext":[["厘米","límǐ","xentimét"],["克","kè","gam"],["平方","píngfāng","mét vuông (đơn vị diện tích)"],["吨","dūn","tấn"],["尺子","chǐzi","cái thước"],["胶水","jiāoshuǐ","hồ dán, keo dán"],["文具","wénjù","văn phòng phẩm, đồ dùng học tập"]],"extt":"度量单位 / 学习用具","notes":"Nguồn cuối bài khoá: 改编自《小故事大道理》，作者：汪胜战. Bài khoá 624 chữ (theo sách), 8 đoạn văn (tr.64–66), chia 3 phần: đoạn ài liệu về nền văn minh Inca cổ đại."},{"h":"灵魂","p":"línghún","v":"linh hồn, tâm hồn","k":"dt.","x":1,"ez":"“那是为了让我们的灵魂，能够追得上我们赶了三天路的疲劳的身体。”","ev":"“Đó là để linh hồn của chúng tôi có thể đuổi kịp cơ thể mệt mỏi đã vội vã lên đường suốt ba ngày.”"},{"h":"疲劳","p":"píláo","v":"mệt mỏi, mệt nhọc","k":"tt.","x":0,"ez":"“那是为了让我们的灵魂，能够追得上我们赶了三天路的疲劳的身体。”","ev":"“Đó là để linh hồn của chúng tôi có thể đuổi kịp cơ thể mệt mỏi đã vội vã lên đường suốt ba ngày.”"},{"h":"哲理","p":"zhélǐ","v":"triết lý","k":"dt.","x":1,"ez":"多么富有哲理的话！","ev":"Một câu nói giàu triết lý biết bao!"},{"h":"提倡","p":"tíchàng","v":"đề xướng, chủ trương","k":"đgt.","x":0,"ez":"现在饭馆都提倡节约，不浪费食物，“光盘”的意思就是把点的菜吃光。","ev":"Bây giờ các nhà hàng đều khuyến khích tiết kiệm, không lãng phí thức ăn; “sạch đĩa” nghĩa là ăn hết các món đã gọi."},{"h":"步骤","p":"bùzhòu","v":"bước","k":"dt.","x":0,"ez":"在这个提倡和鼓励竞争的时代，我们常常只顾低头拉车，却少了抬头看路，少了思考、总结这一重要的步骤。","ev":"Trong thời đại đề cao và khuyến khích cạnh tranh này, chúng ta thường chỉ biết cắm đầu kéo xe mà quên ngẩng đầu nhìn đường, thiếu đi bước quan trọng là suy ngẫm và đúc kết."},{"h":"闭关","p":"bìguān","v":"bế quan, tịnh cư","k":"đgt.","x":1,"ez":"从20世纪80年代起，比尔·盖茨每年都要进行两次为期一周的“闭关”。","ev":"Từ thập niên 80 của thế kỷ 20, mỗi năm Bill Gates đều “bế quan” hai lần, mỗi lần kéo dài một tuần."},{"h":"一律","p":"yílǜ","v":"nhất loạt, hết thảy","k":"phó.","x":0,"ez":"按规定，小动物一律不准带上飞机。","ev":"Theo quy định, mọi loại động vật nhỏ đều không được mang lên máy bay."},{"h":"寂寞","p":"jìmò","v":"cô đơn, cô độc","k":"tt.","x":0,"ez":"她有些寂寞，想让我到她那儿陪她聊聊天。","ev":"Cô ấy thấy hơi cô đơn, muốn tôi sang chỗ cô ấy trò chuyện cho vui."},{"h":"效率","p":"xiàolǜ","v":"năng suất, hiệu suất","k":"dt.","x":0,"ez":"盖茨的这种令人寂寞难耐的“闭关”不只是一种休息方式，更是一种高效率的工作方式。","ev":"Kiểu “bế quan” cô độc đến khó chịu nổi này của Gates không chỉ là một cách nghỉ ngơi, mà còn là một phương thức làm việc hiệu suất cao."},{"h":"比尔·盖茨","p":"Bǐ'ěr Gàicí","v":"Bill Gates","k":"tên riêng","x":0,"ez":"从20世纪80年代起，比尔·盖茨每年都要进行两次为期一周的“闭关”。","ev":"Từ thập niên 80 của thế kỷ 20, mỗi năm Bill Gates đều “bế quan” hai lần, mỗi lần kéo dài một tuần."}]],"texts":[{"no":1,"tz":"","tv":"","lines":[{"s":"","z":"工作中的忙碌大概可以分为三种：第一种忙，忙得很被动，总是被事情追着、赶着，人几乎成了工作的奴隶；","p":"Gōngzuò zhōng de mánglù dàgài kěyǐ fēnwéi sān zhǒng: dì-yī zhǒng máng, máng de hěn bèidòng, zǒngshì bèi shìqing zhuīzhe, gǎnzhe, rén jīhū chéngle gōngzuò de núlì;","v":"Sự bận rộn trong công việc đại khái có thể chia làm ba loại: loại thứ nhất bận một cách bị động, lúc nào cũng bị công việc đuổi theo, thúc ép, con người gần như trở thành nô lệ của công việc;","b":0},{"s":"","z":"第二种忙，忙得很主动，忙而不乱，人是工作的主人；","p":"dì-èr zhǒng máng, máng de hěn zhǔdòng, máng ér bú luàn, rén shì gōngzuò de zhǔrén;","v":"loại thứ hai bận một cách chủ động, bận mà không rối, con người làm chủ công việc;","b":0},{"s":"","z":"第三种忙，忙得有些虚伪，因为在他们的思想中，已经把忙与成功、闲与失败联系到一起，所以，这样的人总是想办法让自己忙。","p":"dì-sān zhǒng máng, máng de yǒuxiē xūwěi, yīnwèi zài tāmen de sīxiǎng zhōng, yǐjīng bǎ máng yǔ chénggōng, xián yǔ shībài liánxì dào yìqǐ, suǒyǐ, zhèyàng de rén zǒngshì xiǎng bànfǎ ràng zìjǐ máng.","v":"loại thứ ba bận có phần giả tạo, bởi trong suy nghĩ của họ, bận đã gắn liền với thành công còn rảnh gắn liền với thất bại, vì thế những người này luôn tìm cách khiến mình bận rộn.","b":0},{"s":"","z":"你属于哪种忙呢？","p":"Nǐ shǔyú nǎ zhǒng máng ne?","v":"Bạn thuộc kiểu bận rộn nào?","b":0},{"s":"","z":"我有一个体会：现实中，我们不一定知道正确的道路是什么，但时时反省、总结，却可以使我们不会在错误的道路上走得太远。","p":"Wǒ yǒu yí ge tǐhuì: xiànshí zhōng, wǒmen bù yídìng zhīdào zhèngquè de dàolù shì shénme, dàn shíshí fǎnxǐng, zǒngjié, què kěyǐ shǐ wǒmen bú huì zài cuòwù de dàolù shang zǒu de tài yuǎn.","v":"Tôi có một trải nghiệm thế này: trong thực tế, chưa chắc ta đã biết con đường đúng là gì, nhưng thường xuyên tự kiểm điểm, đúc kết thì có thể giúp ta không đi quá xa trên con đường sai.","b":0},{"s":"","z":"据说，曾经有一位很有个性、极爱冒险的大导演到南美丛林拍有关古代印加文明的纪录片。","p":"Jùshuō, céngjīng yǒu yí wèi hěn yǒu gèxìng, jí ài màoxiǎn de dà dǎoyǎn dào Nánměi cónglín pāi yǒuguān gǔdài Yìnjiā wénmíng de jìlùpiàn.","v":"Nghe nói, từng có một đạo diễn lớn rất cá tính, cực kỳ thích mạo hiểm, đến rừng rậm Nam Mỹ quay phim tài liệu về nền văn minh Inca cổ đại.","b":1},{"s":"","z":"他雇了20来个当地人为他带路和搬运行李。","p":"Tā gùle èrshí lái ge dāngdìrén wèi tā dàilù hé bānyùn xíngli.","v":"Ông thuê khoảng hai mươi người dân địa phương dẫn đường và khuân vác hành lý cho mình.","b":0},{"s":"","z":"这批当地人个个都表现出色，尽管他们背着重重的行李，但他们的脚力过人，健步如飞。","p":"Zhè pī dāngdìrén gègè dōu biǎoxiàn chūsè, jǐnguǎn tāmen bēizhe zhòngzhòng de xíngli, dàn tāmen de jiǎolì guòrén, jiànbù-rúfēi.","v":"Nhóm người địa phương này ai cũng làm rất tốt; dù phải cõng hành lý nặng trĩu nhưng sức chân của họ hơn người, bước đi thoăn thoắt như bay.","b":0},{"s":"","z":"一连三天，他们都很顺利地实现了原定的计划。","p":"Yìlián sān tiān, tāmen dōu hěn shùnlì de shíxiànle yuándìng de jìhuà.","v":"Ba ngày liền, họ đều hoàn thành suôn sẻ kế hoạch đã định.","b":0},{"s":"","z":"到了第四天，大导演一早醒来就催着大家上路。","p":"Dàole dì-sì tiān, dà dǎoyǎn yìzǎo xǐnglái jiù cuīzhe dàjiā shànglù.","v":"Đến ngày thứ tư, vị đạo diễn vừa thức dậy từ sáng sớm đã giục mọi người lên đường.","b":0},{"s":"","z":"然而，当地人却拒绝行动。","p":"Rán'ér, dāngdìrén què jùjué xíngdòng.","v":"Thế nhưng, những người địa phương lại từ chối đi tiếp.","b":0},{"s":"","z":"大导演非常着急，一来，耽误了时间，日程就得重新安排；","p":"Dà dǎoyǎn fēicháng zháojí, yī lái, dānwùle shíjiān, rìchéng jiù děi chóngxīn ānpái;","v":"Vị đạo diễn vô cùng sốt ruột: một là, chậm trễ thời gian thì lịch trình sẽ phải sắp xếp lại;","b":0},{"s":"","z":"二来，会因为费用增加而让投资人不高兴，至于这部影片的投资人，可是一位大人物，他可不敢得罪。","p":"èr lái, huì yīnwèi fèiyong zēngjiā ér ràng tóuzīrén bù gāoxìng, zhìyú zhè bù yǐngpiàn de tóuzīrén, kě shì yí wèi dà rénwù, tā kě bù gǎn dézuì.","v":"hai là, chi phí tăng sẽ khiến nhà đầu tư không vui, mà nhà đầu tư của bộ phim này lại là một nhân vật tầm cỡ, ông chẳng dám làm phật lòng.","b":0},{"s":"","z":"经过沟通，大导演总算搞明白了，当地人自古就有一种习俗：在赶路时，用尽全力地向前冲，但每走上三天，便要休息一天。","p":"Jīngguò gōutōng, dà dǎoyǎn zǒngsuàn gǎo míngbai le, dāngdìrén zìgǔ jiù yǒu yì zhǒng xísú: zài gǎnlù shí, yòngjìn quánlì de xiàng qián chōng, dàn měi zǒushang sān tiān, biàn yào xiūxi yì tiān.","v":"Sau khi trao đổi, vị đạo diễn cuối cùng cũng hiểu ra: người dân nơi đây từ xưa đã có một tập tục — khi đi đường thì dốc hết sức lao về phía trước, nhưng cứ đi được ba ngày là phải nghỉ một ngày.","b":0},{"s":"","z":"当大导演进一步询问原因时，当地人的回答令他受益终生。","p":"Dāng dà dǎoyǎn jìnyíbù xúnwèn yuányīn shí, dāngdìrén de huídá lìng tā shòuyì zhōngshēng.","v":"Khi vị đạo diễn hỏi kỹ thêm lý do, câu trả lời của họ đã khiến ông được lợi suốt đời.","b":0},{"s":"","z":"“那是为了让我们的灵魂，能够追得上我们赶了三天路的疲劳的身体。”","p":"“Nà shì wèile ràng wǒmen de línghún, nénggòu zhuī de shàng wǒmen gǎnle sān tiān lù de píláo de shēntǐ.”","v":"“Đó là để linh hồn của chúng tôi có thể đuổi kịp cơ thể mệt mỏi đã vội vã lên đường suốt ba ngày.”","b":1},{"s":"","z":"多么富有哲理的话！","p":"Duōme fùyǒu zhélǐ de huà!","v":"Một câu nói giàu triết lý biết bao!","b":0},{"s":"","z":"在这个提倡和鼓励竞争的时代，我们常常只顾低头拉车，却少了抬头看路，少了思考、总结这一重要的步骤。","p":"Zài zhège tíchàng hé gǔlì jìngzhēng de shídài, wǒmen chángcháng zhǐ gù dītóu lā chē, què shǎole táitóu kàn lù, shǎole sīkǎo, zǒngjié zhè yí zhòngyào de bùzhòu.","v":"Trong thời đại đề cao và khuyến khích cạnh tranh này, chúng ta thường chỉ biết cắm đầu kéo xe mà quên ngẩng đầu nhìn đường, thiếu đi bước quan trọng là suy ngẫm và đúc kết.","b":0},{"s":"","z":"从20世纪80年代起，比尔·盖茨每年都要进行两次为期一周的“闭关”。","p":"Cóng èrshí shìjì bāshí niándài qǐ, Bǐ'ěr Gàicí měi nián dōu yào jìnxíng liǎng cì wéiqī yì zhōu de “bìguān”.","v":"Từ thập niên 80 của thế kỷ 20, mỗi năm Bill Gates đều “bế quan” hai lần, mỗi lần kéo dài một tuần.","b":0},{"s":"","z":"在这一周的时间里，他会把自己关在一所房子里，包括家人在内的任何人他都一律不见，使自己完全不受日常工作的打扰。","p":"Zài zhè yì zhōu de shíjiān li, tā huì bǎ zìjǐ guān zài yì suǒ fángzi li, bāokuò jiārén zài nèi de rènhé rén tā dōu yílǜ bú jiàn, shǐ zìjǐ wánquán bú shòu rìcháng gōngzuò de dǎrǎo.","v":"Trong tuần đó, ông tự nhốt mình trong một căn nhà, không gặp bất kỳ ai, kể cả người nhà, để hoàn toàn không bị công việc thường ngày quấy rầy.","b":0},{"s":"","z":"盖茨的这种令人寂寞难耐的“闭关”不只是一种休息方式，更是一种高效率的工作方式。","p":"Gàicí de zhè zhǒng lìng rén jìmò nánnài de “bìguān” bù zhǐ shì yì zhǒng xiūxi fāngshì, gèng shì yì zhǒng gāo xiàolǜ de gōngzuò fāngshì.","v":"Kiểu “bế quan” cô độc đến khó chịu nổi này của Gates không chỉ là một cách nghỉ ngơi, mà còn là một phương thức làm việc hiệu suất cao.","b":0},{"s":"","z":"忙碌的人们，请多给自己一点思考的时间吧。","p":"Mánglù de rénmen, qǐng duō gěi zìjǐ yìdiǎn sīkǎo de shíjiān ba.","v":"Hỡi những người bận rộn, hãy dành cho mình thêm chút thời gian để suy ngẫm nhé.","b":0}]}],"aud":[{"v":"audio/26-2.mp3","t":"audio/26-1.mp3"}],"gram":[{"id":"lai","t":"来","s":"khoảng, chừng (trợ từ); 一来……，二来…… (một là…, hai là…)","b":"<b>来</b> là <b>trợ từ</b>, đặt sau các số như 十、百、千 hoặc sau số lượng từ để biểu thị <b>số ước lượng</b> (khoảng, chừng, ngoài…). Ngoài ra, 来 còn đứng sau các số 一、二、三… tạo thành cấu trúc <b>“一来……，二来……”</b> để <b>liệt kê lý do</b>.","r":["Số tròn + 来 + lượng từ + danh từ: 20来个当地人 (khoảng hai mươi người)","Số + lượng từ + 来 + tính từ đo lường: 5斤来重 (nặng chừng 5 cân)","一来……，二来……: lần lượt nêu các lý do, thường đi sau vế nêu sự việc/thái độ (我对上海很有感情，一来……，二来……)"],"e":[["他雇了20来个当地人为他带路和搬运行李。","Tā gùle èrshí lái ge dāngdìrén wèi tā dàilù hé bānyùn xíngli.","Ông thuê khoảng hai mươi người dân địa phương dẫn đường và khuân vác hành lý cho mình. <i>(bài khoá)</i>"],["按照老人教的方法，他几乎每天都能钓到5斤来重的大鱼。","Ànzhào lǎorén jiāo de fāngfǎ, tā jīhū měi tiān dōu néng diàodào wǔ jīn lái zhòng de dà yú.","Theo cách ông lão chỉ, gần như ngày nào anh ấy cũng câu được cá to nặng chừng 5 cân."],["今天是大年三十，我们来看看大家，一来是给大家送水果，二来是看看大家过节还有什么难处。","Jīntiān shì dànián sānshí, wǒmen lái kànkan dàjiā, yī lái shì gěi dàjiā sòng shuǐguǒ, èr lái shì kànkan dàjiā guò jié hái yǒu shénme nánchù.","Hôm nay là ngày 30 Tết, chúng tôi đến thăm mọi người, một là để biếu ít hoa quả, hai là xem mọi người ăn Tết còn khó khăn gì không."],["我对上海很有感情，一来上大学时在那里住过几年，二来我太太也是上海人。","Wǒ duì Shànghǎi hěn yǒu gǎnqíng, yī lái shàng dàxué shí zài nàli zhùguo jǐ nián, èr lái wǒ tàitai yě shì Shànghǎirén.","Tôi rất có tình cảm với Thượng Hải, một là hồi học đại học từng sống ở đó mấy năm, hai là vợ tôi cũng là người Thượng Hải."]],"d":[["看到房间满是灰尘，他发起了愁，刚坐了十____个小时火车，实在没力气收拾了。","来"],["我对上海很有感情，____上大学时在那里住过几年，二来我太太也是上海人。","一来"],["这所学校是小班上课，每个班20____个学生。","来"]],"w":"Đừng nhầm trợ từ 来 với động từ 来 (đến): trong câu (3), 我们<b>来</b>看看大家 là động từ “đến”, còn <b>一来/二来</b> là “một là/hai là”."},{"id":"zhiyu","t":"至于","s":"đến mức (động từ); còn về (giới từ)","b":"<b>至于</b> làm <b>động từ</b> biểu thị đạt tới một mức độ nào đó, thường dùng trong <b>câu phản vấn</b> (đến mức… sao?). 至于 còn có thể làm <b>giới từ</b>, dùng trong cấu trúc “(A)……，至于(B)……” để <b>chuyển sang nói một việc khác</b> (còn về B thì…).","r":["Động từ trong câu phản vấn: 你至于……吗？/ 哪至于……呢？ — có đến mức… không? / đâu đến mức…","Dạng phủ định 不至于: chưa đến mức, đâu đến nỗi (练习: 不至于要闹离婚吧？)","Giới từ: A……，至于B…… — nói xong việc A rồi chuyển sang việc B; 至于 đứng đầu vế sau"],"e":[["我只是和你开个玩笑，你至于生那么大的气吗？","Wǒ zhǐshì hé nǐ kāi ge wánxiào, nǐ zhìyú shēng nàme dà de qì ma?","Tôi chỉ đùa với cậu một chút thôi, có đến mức cậu phải giận dữ thế không?"],["什么？一件衬衫要一千来块钱。哪至于那么贵呢？","Shénme? Yí jiàn chènshān yào yìqiān lái kuài qián. Nǎ zhìyú nàme guì ne?","Cái gì? Một chiếc áo sơ mi mà mất khoảng một nghìn tệ. Làm gì đến mức đắt thế chứ?"],["……至于这部影片的投资人，可是一位大人物，他可不敢得罪。","……zhìyú zhè bù yǐngpiàn de tóuzīrén, kě shì yí wèi dà rénwù, tā kě bù gǎn dézuì.","…còn nhà đầu tư của bộ phim này thì lại là một nhân vật tầm cỡ, ông chẳng dám làm phật lòng. <i>(bài khoá)</i>"],["我只知道他是六班的学生，至于住在哪儿，我就不清楚了。","Wǒ zhǐ zhīdào tā shì liù bān de xuésheng, zhìyú zhù zài nǎr, wǒ jiù bù qīngchu le.","Tôi chỉ biết cậu ấy là học sinh lớp 6, còn sống ở đâu thì tôi không rõ."]],"d":[["你们两口子吵架归吵架，不____要闹离婚吧？","至于"],["我只知道他是六班的学生，____住在哪儿，我就不清楚了。","至于"],["我只是和你开个玩笑，你____生那么大的气吗？","至于"]],"w":"Phân biệt <b>至于</b> (còn về — chuyển sang việc khác, đứng đầu vế sau) với <b>关于</b> (về — nêu phạm vi đề cập)."},{"id":"zongsuan","t":"总算","s":"cuối cùng cũng; cũng coi như (phó từ)","b":"<b>总算</b> là <b>phó từ</b>, biểu thị sau một thời gian khá dài, <b>mong muốn nào đó cuối cùng đã thành hiện thực</b>. 总算 còn có thể biểu thị <b>đại thể vẫn tạm được, cũng coi như ổn</b>.","r":["Chủ ngữ + 总算 + động từ (thường có 了): 总算搞明白了、总算把活儿干完了","Nghĩa “cũng coi như tạm được”: 虽然……，但总算……；这趟总算没有白来","Nghĩa này chỉ 总算 có, 终于 không có (xem thẻ 总算 vs 终于)"],"e":[["经过沟通，大导演总算搞明白了，……","Jīngguò gōutōng, dà dǎoyǎn zǒngsuàn gǎo míngbai le, ……","Sau khi trao đổi, vị đạo diễn cuối cùng cũng hiểu ra… <i>(bài khoá)</i>"],["总算把活儿干完了，可把我累坏了。","Zǒngsuàn bǎ huór gànwán le, kě bǎ wǒ lèihuài le.","Cuối cùng cũng làm xong việc, mệt muốn chết."],["虽然我对这家宾馆不太满意，但总算有个睡觉的地方了。","Suīrán wǒ duì zhè jiā bīnguǎn bú tài mǎnyì, dàn zǒngsuàn yǒu ge shuìjiào de dìfang le.","Tuy tôi không hài lòng lắm với khách sạn này, nhưng dù sao cũng có chỗ để ngủ rồi."],["临走前能和你见上一面，这趟总算没有白来！","Lín zǒu qián néng hé nǐ jiàn shang yí miàn, zhè tàng zǒngsuàn méiyǒu bái lái!","Trước khi đi còn gặp được cậu một lần, chuyến này coi như không uổng công!"]],"d":[["经过沟通，大导演____搞明白了，……","总算"],["虽然我对这家宾馆不太满意，但____有个睡觉的地方了。","总算"],["临走前能和你见上一面，这趟____没有白来！","总算"]],"w":"Khi mang nghĩa “cũng coi như tạm được” thì chỉ dùng 总算, không thay bằng 终于."},{"id":"zongsuan_zhongyu","t":"总算 vs 终于","s":"cuối cùng (cũng) — phân biệt","b":"<b>总算</b> và <b>终于</b> đều là <b>phó từ</b>, đều mang nghĩa sau một thời gian dài thay đổi hoặc chờ đợi thì một tình huống nào đó đã xuất hiện. Ví dụ: 这青年后来努力学艺，总算/终于有了一点儿小名气。","r":["<b>总算</b>: kết quả thường là điều <b>mong muốn</b> xảy ra — 到北京的第二年，我总算找到了一份比较满意的工作。","<b>终于</b>: kết quả phần nhiều là điều mong muốn, nhưng <b>cũng có thể là điều không như ý</b> — 尽管他也很想去，但他终于还是放弃了留学的打算。","<b>总算</b> còn biểu thị <b>đại thể vẫn tạm được</b> — 他才学了半年外语，能说成这样，总算不错了。","<b>终于</b> không có nghĩa và cách dùng này."],"e":[["这青年后来努力学艺，总算/终于有了一点儿小名气。","Zhè qīngnián hòulái nǔlì xué yì, zǒngsuàn/zhōngyú yǒule yìdiǎnr xiǎo míngqi.","Chàng thanh niên này về sau chăm chỉ học nghề, cuối cùng cũng có chút tiếng tăm."],["到北京的第二年，我总算找到了一份比较满意的工作。","Dào Běijīng de dì-èr nián, wǒ zǒngsuàn zhǎodàole yí fèn bǐjiào mǎnyì de gōngzuò.","Năm thứ hai ở Bắc Kinh, tôi cuối cùng cũng tìm được một công việc khá ưng ý."],["尽管他也很想去，但他终于还是放弃了留学的打算。","Jǐnguǎn tā yě hěn xiǎng qù, dàn tā zhōngyú háishi fàngqìle liúxué de dǎsuàn.","Dù cũng rất muốn đi, nhưng rốt cuộc anh ấy vẫn từ bỏ dự định du học."],["他才学了半年外语，能说成这样，总算不错了。","Tā cái xuéle bàn nián wàiyǔ, néng shuō chéng zhèyàng, zǒngsuàn búcuò le.","Cậu ấy mới học ngoại ngữ nửa năm mà nói được thế này thì cũng coi như khá rồi."]],"d":[["他多次想告诉她，但____没说出口。","终于"],["可让我担心的事____还是发生了。","终于"],["整整一个星期没出门，我____把这几本厚厚的书读完了。","总算 / 终于"],["听了李阳这些话后，妈妈____有点放心了。","总算 / 终于"]],"w":"Kết quả không như ý (chuyện đáng lo đã xảy ra, từ bỏ dự định, không nói ra được) → dùng 终于; nghĩa “cũng coi như tạm được” → chỉ dùng 总算."}],"ext":[["演讲","yǎnjiǎng","diễn thuyết, bài diễn văn"],["发言","fāyán","phát biểu"],["宴会","yànhuì","yến tiệc, tiệc chiêu đãi"],["嘉宾","jiābīn","khách quý"],["证件","zhèngjiàn","giấy tờ (tùy thân)"],["名片","míngpiàn","danh thiếp"],["嫁","jià","(con gái) lấy chồng"],["娶","qǔ","lấy vợ, cưới vợ"],["分手","fēn shǒu","chia tay"],["怀孕","huái yùn","mang thai"],["吻","wěn","hôn"]],"extt":"社会关系、婚恋","notes":"Nguồn cuối bài khoá: 改编自《青年参考》，作者：毛尧飞、杨立军. Bài khoá 731 chữ (theo sách), 8 đoạn văn (tr.71–73), chia 3 phần: đoạn 1–3 (từ 1–6) / đoạn 4 — câu chuyện vị đạo diễn (từ 7–26 + 专名 印加) / đoạn 5–8 (từ 27–35 + 专名 比尔·盖茨). Phần 2 dài hơn hai phần kia vì đoạn 4 trong sách là một đoạn văn liền, không cắt giữa đoạn. Câu đầu bài khoá dài và câu “大导演非常着急……他可不敢得罪。” được cắt tại dấu ；. Câu “经过沟通……便要休息一天。” và “在这一周的时间里……打扰。” dài hơn 45 chữ nhưng không có ； nên giữ nguyên một dòng. Từ số 1, 2, 3, 4, 6, 10, 13, 14, 17, 18, 23, 26, 27, 29, 32 có dấu * (ngoài đề cương). Pinyin, từ loại, nghĩa Việt chép theo sách (giữ cách viết của sách: 冒险 “mào xiǎn”, 投资 “tóu zī”, 得罪 “dézuì”, 一连 “yìlián”; 17 健步如飞 sách không ghi từ loại; 20 至于 sách ghi giới từ, nghĩa “còn”). 专名 印加 nghĩa sách: “đế chế Inca (đế chế lớn nhất ở Châu Mỹ trước Columbus)”. Phần 注释 gồm 3 mục 词语例释 (来, 至于, 总算) và 1 词语辨析 (总算—终于). Drill: 来 câu 1 lấy từ 练习3① (đáp án: vị trí C → 十来个); 至于 câu 1 lấy từ 练习1⑥; 总算 vs 终于 lấy từ 做一做 (câu (1) sách đã cho đáp án 终于; câu (2)(3)(4) do người soạn giải); các drill còn lại đặt theo câu ví dụ của sách (练一练 trong sách là bài hoàn thành câu mở; drill “每个班20____个学生” do người soạn đặt dựa trên đề 练一练(1)). Đáp án 练习 (người soạn giải): 练习1 ①提倡 ②耽误 ③一律 ④寂寞 ⑤出色 ⑥至于; 练习2 ①A ②A ③A ④A; 练习3 ①C ②D ③C ④A. vocab_ex của 出色, 耽误, 至于, 搞, 提倡, 一律, 寂寞 lấy từ 练习1/练习2 (đã điền đáp án); còn lại trích nguyên câu bài khoá. Bảng 扩展 có hai 话题 (社会关系; 婚恋), gộp làm một bảng; sách chỉ có chữ Hán + pinyin, nghĩa tiếng Việt do người soạn bổ sung. Không có chỗ nào mờ/không đọc được.","order":[{"z":"第二种忙，忙得很主动，忙而不乱，人是工作的主人；","t":["第二种","忙","忙","得","很","主动","忙而不乱","人","是","工作","的","主人"],"v":"loại thứ hai bận một cách chủ động, bận mà không rối, con người làm chủ công việc;"},{"z":"你属于哪种忙呢？","t":["你","属于","哪种","忙","呢"],"v":"Bạn thuộc kiểu bận rộn nào?"},{"z":"他雇了20来个当地人为他带路和搬运行李。","t":["他","雇","了","20","来个","当地人","为","他","带路","和","搬运","行李"],"v":"Ông thuê khoảng hai mươi người dân địa phương dẫn đường và khuân vác hành lý cho mình."},{"z":"一连三天，他们都很顺利地实现了原定的计划。","t":["一连","三天","他们","都","很","顺利","地","实现","了","原定","的","计划"],"v":"Ba ngày liền, họ đều hoàn thành suôn sẻ kế hoạch đã định."},{"z":"到了第四天，大导演一早醒来就催着大家上路。","t":["到","了","第四天","大","导演","一早","醒来","就","催","着","大家","上路"],"v":"Đến ngày thứ tư, vị đạo diễn vừa thức dậy từ sáng sớm đã giục mọi người lên đường."},{"z":"然而，当地人却拒绝行动。","t":["然而","当地人","却","拒绝","行动"],"v":"Thế nhưng, những người địa phương lại từ chối đi tiếp."},{"z":"大导演非常着急，一来，耽误了时间，日程就得重新安排；","t":["大","导演","非常","着急","一来","耽误","了","时间","日程","就","得","重新安排"],"v":"Vị đạo diễn vô cùng sốt ruột: một là, chậm trễ thời gian thì lịch trình sẽ phải sắp xếp lại;"},{"z":"当大导演进一步询问原因时，当地人 ữa cũng chưa chắc đã thắng được."},{"h":"次要","p":"cìyào","v":"thứ yếu, không quan trọng","k":"tt.","x":0,"ez":"这只是次要因素，不是最重要的。","ev":"Đó chỉ là yếu tố thứ yếu, không phải điều quan trọng nhất."},{"h":"因素","p":"yīnsù","v":"nhân tố","k":"dt.","x":0,"ez":"这只是次要因素，不是最重要的。","ev":"Đó chỉ là yếu tố thứ yếu, không phải điều quan trọng nhất."},{"h":"在于","p":"zàiyú","v":"cốt ở, ở chỗ","k":"đgt.","x":0,"ez":"最重要的问题在于你心态不对。","ev":"Vấn đề quan trọng nhất nằm ở chỗ tâm lý của con không đúng."},{"h":"心态","p":"xīntài","v":"tâm lý, trạng thái tâm lý","k":"dt.","x":1,"ez":"最重要的问题在于你心态不对。","ev":"Vấn đề quan trọng nhất nằm ở chỗ tâm lý của con không đúng."},{"h":"珍惜","p":"zhēnxī","v":"quý trọng","k":"đgt.","x":0,"ez":"你不够珍惜你的棋子。","ev":"Con chưa biết quý quân cờ của mình."},{"h":"否认","p":"fǒurèn","v":"phủ nhận, bác bỏ","k":"đgt.","x":0,"ez":"“怎么不珍惜呀？我每走一步，都想半天。”我否认说。","ev":"“Sao lại không quý chứ ạ? Nước nào con cũng nghĩ mãi mới đi mà.” Tôi cãi lại."},{"h":"观察","p":"guānchá","v":"quan sát, theo dõi","k":"đgt.","x":0,"ez":"我仔细观察过，你三分之二的棋子是在前三分之一的时间失去的。","ev":"Cha đã quan sát kỹ rồi, hai phần ba số quân của con bị mất trong một phần ba thời gian đầu."},{"h":"失去","p":"shīqù","v":"mất","k":"đgt.","x":0,"ez":"一个棋子也不想失，反而一个一个都失去了。","ev":"Một quân cũng không muốn mất, rốt cuộc lại mất từng quân một."},{"h":"期间","p":"qījiān","v":"thời gian, thời kỳ","k":"dt.","x":0,"ez":"这期间你好像很有把握，下棋时不假思索，拿起来就走，失去了也不觉得可惜。","ev":"Trong khoảng thời gian đó con có vẻ rất chắc ăn, đánh cờ chẳng cần nghĩ, cầm quân lên là đi, mất quân cũng chẳng thấy tiếc."},{"h":"把握","p":"bǎwò","v":"sự chắc chắn, sự tin chắc","k":"dt.","x":0,"ez":"这期间你好像很有把握，下棋时不假思索，拿起来就走，失去了也不觉得可惜。","ev":"Trong khoảng thời gian đó con có vẻ rất chắc ăn, đánh cờ chẳng cần nghĩ, cầm quân lên là đi, mất quân cũng chẳng thấy tiếc."},{"h":"不假思索","p":"bùjiǎ-sīsuǒ","v":"không cần cân nhắc, không cần suy nghĩ","k":"","x":1,"ez":"这期间你好像很有把握，下棋时不假思索，拿起来就走，失去了也不觉得可惜。","ev":"Trong khoảng thời gian đó con có vẻ rất chắc ăn, đánh cờ chẳng cần nghĩ, cầm quân lên là đi, mất quân cũng chẳng thấy tiếc."},{"h":"犯","p":"fàn","v":"phạm (sai lầm, tội...)","k":"đgt.","x":1,"ez":"后三分之二的时间，你又犯了相反的错误……","ev":"Hai phần ba thời gian sau, con lại mắc phải sai lầm ngược lại…"},{"h":"过于","p":"guòyú","v":"quá, quá đáng","k":"phó.","x":1,"ez":"对棋子过于珍惜，每走一步都过于谨慎……","ev":"Quá tiếc quân cờ, nước nào cũng dè dặt quá mức…"},{"h":"原则","p":"yuánzé","v":"nguyên tắc","k":"dt.","x":0,"ez":"我问你，下棋的基本原则是什么？","ev":"Cha hỏi con, nguyên tắc cơ bản của việc đánh cờ là gì?"},{"h":"责备","p":"zébèi","v":"quở trách, chỉ trích","k":"đgt.","x":0,"ez":"父亲用责备的眼光看了我一眼……","ev":"Cha nhìn tôi bằng ánh mắt trách móc…"},{"h":"必然","p":"bìrán","v":"thế nào cũng, chắc chắn","k":"tt.","x":0,"ez":"有得必然有失，有失才会有得。","ev":"Có được ắt có mất, có mất mới có được."},{"h":"事先","p":"shìxiān","v":"trước đó","k":"dt.","x":0,"ez":"每走一步，你事先都应该想清楚：为了赢得什么，你愿意失去什么，这样才可能赢。","ev":"Mỗi nước đi, con đều phải tính kỹ từ trước: để giành được điều gì thì con chấp nhận mất đi điều gì, như vậy mới có thể thắng."},{"h":"舍不得","p":"shěbude","v":"không nỡ, tiếc rẻ, luyến tiếc","k":"đgt.","x":0,"ez":"等到后来失去得多了，又开始舍不得，后果就是屡下屡败。","ev":"Đến khi về sau mất nhiều rồi lại bắt đầu tiếc, hậu quả là ván nào cũng thua."},{"h":"后果","p":"hòuguǒ","v":"hậu quả","k":"dt.","x":0,"ez":"等到后来失去得多了，又开始舍不得，后果就是屡下屡败。","ev":"Đến khi về sau mất nhiều rồi lại bắt đầu tiếc, hậu quả là ván nào cũng thua."},{"h":"屡","p":"lǚ","v":"nhiều lần","k":"phó.","x":1,"ez":"等到后来失去得多了，又开始舍不得，后果就是屡下屡败。","ev":"Đến khi về sau mất nhiều rồi lại bắt đầu tiếc, hậu quả là ván nào cũng thua."}]],"texts":[{"no":1,"tz":"","tv":"","lines":[{"s":"","z":"我父亲是一位象棋教练。","p":"Wǒ fùqīn shì yí wèi xiàngqí jiàoliàn.","v":"Cha tôi là một huấn luyện viên cờ tướng.","b":0},{"s":"","z":"那一年，我大学放假回家，父亲要跟我下棋，我高兴地答应了。","p":"Nà yì nián, wǒ dàxué fàngjià huí jiā, fùqīn yào gēn wǒ xià qí, wǒ gāoxìng de dāying le.","v":"Năm ấy, trường đại học cho nghỉ, tôi về nhà, cha muốn đánh cờ với tôi, tôi vui vẻ nhận lời.","b":0},{"s":"","z":"父亲让我先走三步。","p":"Fùqīn ràng wǒ xiān zǒu sān bù.","v":"Cha cho tôi đi trước ba nước.","b":0},{"s":"","z":"不到三分钟，我的棋子损失大半，棋盘上空空的，只剩下几个子了。","p":"Bú dào sān fēnzhōng, wǒ de qízǐ sǔnshī dàbàn, qípán shang kōngkōng de, zhǐ shèngxia jǐ ge zǐ le.","v":"Chưa đầy ba phút, quân cờ của tôi đã mất quá nửa, bàn cờ trống trơn, chỉ còn lại vài quân.","b":0},{"s":"","z":"没办法，眼睁睁看着父亲“将军”，我输了。","p":"Méi bànfǎ, yǎnzhēngzhēng kànzhe fùqīn “jiāng jūn”, wǒ shū le.","v":"Hết cách, tôi đành trơ mắt nhìn cha “chiếu tướng”, thế là tôi thua.","b":0},{"s":"","z":"我不服气，说：“这次运气不好，再来！”","p":"Wǒ bù fúqì, shuō: “Zhè cì yùnqi bù hǎo, zài lái!”","v":"Tôi không phục, bảo: “Lần này xui quá, chơi lại!”","b":0},{"s":"","z":"第二局又输了，“这次没发挥好，我们再来”！","p":"Dì-èr jú yòu shū le, “zhè cì méi fāhuī hǎo, wǒmen zài lái”!","v":"Ván thứ hai lại thua, “Lần này con chơi chưa tốt, mình chơi lại đi”!","b":0},{"s":"","z":"几局下来，基本上都是不到10分钟我就败下阵来。","p":"Jǐ jú xiàlai, jīběnshang dōu shì bú dào shí fēnzhōng wǒ jiù bài xià zhèn lai.","v":"Mấy ván liền, hầu như ván nào chưa đến 10 phút tôi đã thua trận.","b":0},{"s":"","z":"我有些灰心。","p":"Wǒ yǒuxiē huīxīn.","v":"Tôi bắt đầu thấy nản.","b":0},{"s":"","z":"父亲看看我说：“你初学棋，输是正常的。","p":"Fùqīn kànkan wǒ shuō: “Nǐ chū xué qí, shū shì zhèngcháng de.","v":"Cha nhìn tôi rồi nói: “Con mới học cờ, thua là chuyện bình thường.","b":0},{"s":"","z":"但是你要知道输在什么地方，要吸取教训。","p":"Dànshì nǐ yào zhīdào shū zài shénme dìfang, yào xīqǔ jiàoxùn.","v":"Nhưng con phải biết mình thua ở đâu, phải rút ra bài học.","b":0},{"s":"","z":"否则，你就再下上10年，也未必能赢。”","p":"Fǒuzé, nǐ jiù zài xiàshang shí nián, yě wèibì néng yíng.”","v":"Nếu không, dù con có chơi thêm 10 năm nữa cũng chưa chắc đã thắng được.”","b":0},{"s":"","z":"“我知道，我技术没你好，经验也不足。”","p":"“Wǒ zhīdào, wǒ jìshù méi nǐ hǎo, jīngyàn yě bùzú.”","v":"“Con biết mà, kỹ thuật của con không bằng cha, kinh nghiệm cũng còn thiếu.”","b":0},{"s":"","z":"“这只是次要因素，不是最重要的。”","p":"“Zhè zhǐ shì cìyào yīnsù, bú shì zuì zhòngyào de.”","v":"“Đó chỉ là yếu tố thứ yếu, không phải điều quan trọng nhất.”","b":0},{"s":"","z":"“那最重要的是什么？”我奇怪地问。","p":"“Nà zuì zhòngyào de shì shénme?” Wǒ qíguài de wèn.","v":"“Vậy điều quan trọng nhất là gì ạ?” Tôi ngạc nhiên hỏi.","b":0},{"s":"","z":"“最重要的问题在于你心态不对。","p":"“Zuì zhòngyào de wèntí zàiyú nǐ xīntài bú duì.","v":"“Vấn đề quan trọng nhất nằm ở chỗ tâm lý của con không đúng.","b":1},{"s":"","z":"你不够珍惜你的棋子。”","p":"Nǐ bú gòu zhēnxī nǐ de qízǐ.”","v":"Con chưa biết quý quân cờ của mình.”","b":0},{"s":"","z":"“怎么不珍惜呀？","p":"“Zěnme bù zhēnxī ya?","v":"“Sao lại không quý chứ ạ?","b":0},{"s":"","z":"我每走一步，都想半天。”我否认说。","p":"Wǒ měi zǒu yí bù, dōu xiǎng bàntiān.” Wǒ fǒurèn shuō.","v":"Nước nào con cũng nghĩ mãi mới đi mà.” Tôi cãi lại.","b":0},{"s":"","z":"“那是后来。","p":"“Nà shì hòulái.","v":"“Đó là về sau thôi.","b":0},{"s":"","z":"开始你是这样吗？","p":"Kāishǐ nǐ shì zhèyàng ma?","v":"Lúc đầu con có như thế không?","b":0},{"s":"","z":"我仔细观察过，你三分之二的棋子是在前三分之一的时间失去的。","p":"Wǒ zǐxì guānchá guo, nǐ sān fēn zhī èr de qízǐ shì zài qián sān fēn zhī yī de shíjiān shīqù de.","v":"Cha đã quan sát kỹ rồi, hai phần ba số quân của con bị mất trong một phần ba thời gian đầu.","b":0},{"s":"","z":"这期间你好像很有把握，下棋时不假思索，拿起来就走，失去了也不觉得可惜。","p":"Zhè qījiān nǐ hǎoxiàng hěn yǒu bǎwò, xià qí shí bùjiǎ-sīsuǒ, ná qilai jiù zǒu, shīqù le yě bù juéde kěxī.","v":"Trong khoảng thời gian đó con có vẻ rất chắc ăn, đánh cờ chẳng cần nghĩ, cầm quân lên là đi, mất quân cũng chẳng thấy tiếc.","b":0},{"s":"","z":"因为你觉得棋子很多，失一两个不算什么。","p":"Yīnwèi nǐ juéde qízǐ hěn duō, shī yì-liǎng ge bú suàn shénme.","v":"Vì con nghĩ quân cờ còn nhiều, mất một hai quân chẳng đáng gì.","b":0},{"s":"","z":"后三分之二的时间，你又犯了相反的错误：对棋子过于珍惜，每走一步都过于谨慎，一个棋子也不想失，反而一个一个都失去了。”","p":"Hòu sān fēn zhī èr de shíjiān, nǐ yòu fànle xiāngfǎn de cuòwù: duì qízǐ guòyú zhēnxī, měi zǒu yí bù dōu guòyú jǐnshèn, yí ge qízǐ yě bù xiǎng shī, fǎn'ér yí ge yí ge dōu shīqù le.”","v":"Còn hai phần ba thời gian sau, con lại mắc phải sai lầm ngược lại: quá tiếc quân cờ, nước nào cũng dè dặt quá mức, một quân cũng không muốn mất, rốt cuộc lại mất từng quân một.”","b":0},{"s":"","z":"说到这，父亲停下来，把棋子重新在棋盘上摆好，抬起头，看着我，问：“这是一盘待下的棋。","p":"Shuō dào zhè, fùqīn tíng xialai, bǎ qízǐ chóngxīn zài qípán shang bǎihǎo, tái qi tóu, kànzhe wǒ, wèn: “Zhè shì yì pán dài xià de qí.","v":"Nói đến đây, cha dừng lại, xếp lại các quân cờ lên bàn, ngẩng đầu nhìn tôi và hỏi: “Đây là một ván cờ chưa đánh.","b":1},{"s":"","z":"我问你，下棋的基本原则是什么？”","p":"Wǒ wèn nǐ, xià qí de jīběn yuánzé shì shénme?”","v":"Cha hỏi con, nguyên tắc cơ bản của việc đánh cờ là gì?”","b":0},{"s":"","z":"我想也没想，脱口而出：“赢啊！”","p":"Wǒ xiǎng yě méi xiǎng, tuōkǒu'érchū: “Yíng a!”","v":"Tôi chẳng cần nghĩ, buột miệng đáp ngay: “Thắng ạ!”","b":0},{"s":"","z":"“那是目的。”","p":"“Nà shì mùdì.”","v":"“Đó là mục đích.”","b":0},{"s":"","z":"父亲用责备的眼光看了我一眼，“至于原则，是要考虑得失。","p":"Fùqīn yòng zébèi de yǎnguāng kànle wǒ yì yǎn, “zhìyú yuánzé, shì yào kǎolǜ déshī.","v":"Cha nhìn tôi bằng ánh mắt trách móc, “còn nguyên tắc thì phải tính đến được và mất.","b":0},{"s":"","z":"有得必然有失，有失才会有得。","p":"Yǒu dé bìrán yǒu shī, yǒu shī cái huì yǒu dé.","v":"Có được ắt có mất, có mất mới có được.","b":0},{"s":"","z":"每走一步，你事先都应该想清楚：为了赢得什么，你愿意失去什么，这样才可能赢。","p":"Měi zǒu yí bù, nǐ shìxiān dōu yīnggāi xiǎng qīngchu: wèile yíngdé shénme, nǐ yuànyì shīqù shénme, zhèyàng cái kěnéng yíng.","v":"Mỗi nước đi, con đều phải tính kỹ từ trước: để giành được điều gì thì con chấp nhận mất đi điều gì, như vậy mới có thể thắng.","b":0},{"s":"","z":"可惜，大部分人都像你这样，开始不考虑得失，等到后来失去得多了，又开始舍不得，后果就是屡下屡败。","p":"Kěxī, dà bùfen rén dōu xiàng nǐ zhèyàng, kāishǐ bù kǎolǜ déshī, děngdào hòulái shīqù de duō le, yòu kāishǐ shěbude, hòuguǒ jiù shì lǚ xià lǚ bài.","v":"Đáng tiếc là phần lớn mọi người đều giống con, lúc đầu không tính đến được mất, đến khi về sau mất nhiều rồi lại bắt đầu tiếc, hậu quả là ván nào cũng thua.","b":0},{"s":"","z":"其实不仅是下棋，人生也是如此啊！”","p":"Qíshí bùjǐn shì xià qí, rénshēng yě shì rúcǐ a!”","v":"Thật ra đâu chỉ đánh cờ, đời người cũng vậy thôi con ạ!”","b":0}]}],"aud":[{"v":"audio/27-2.mp3","t":"audio/27-1.mp3"}],"gram":[{"id":"dongci_xialai","t":"动词 + 下来","s":"bổ ngữ xu hướng mang nghĩa mở rộng: hoàn thành; tách rời; cố định","b":"Theo sách, cấu trúc <b>động từ + 下来</b> biểu thị <b>sự hoàn thành</b> của động tác/quá trình; đôi khi còn kèm nghĩa <b>tách rời</b> (vật rời khỏi chỗ cũ) hoặc <b>cố định</b> (sự việc được chốt lại, giữ lại). 下来 đứng ngay sau động từ, thường đọc nhẹ <b>xialai</b>.","r":["Hoàn thành: 几局下来 (đánh xong mấy ván), 败下阵来 — kết thúc một quá trình, đi đến kết quả.","Kèm nghĩa tách rời: 撕下来 (xé ra khỏi cuốn sách) — vật bị tách khỏi chỗ vốn gắn vào.","Kèm nghĩa cố định: 定下来 (chốt lại, quyết định xong) — sự việc từ chưa chắc chắn trở nên ổn định.","Tân ngữ chỉ nơi chốn/vật có thể chen giữa 下 và 来: 败下阵来."],"e":[["你的论文大概什么时候发表？定下来了吗？","Nǐ de lùnwén dàgài shénme shíhou fābiǎo? Dìng xialai le ma?","Luận văn của bạn khoảng bao giờ thì đăng? Đã chốt được chưa?"],["你看，那张纸是从这本书里撕下来的。","Nǐ kàn, nà zhāng zhǐ shì cóng zhè běn shū li sī xialai de.","Cậu xem, tờ giấy đó là xé ra từ cuốn sách này đấy."],["几局下来，基本上都是不到10分钟我就败下阵来。","Jǐ jú xiàlai, jīběnshang dōu shì bú dào shí fēnzhōng wǒ jiù bài xià zhèn lai.","Mấy ván liền, hầu như ván nào chưa đến 10 phút tôi đã thua trận. <i>(bài khoá)</i>"]],"d":[["开始学滑雪的时候，我花了很长时间学习怎么停____。","下来"],["说到这，父亲停____，把棋子重新在棋盘上摆好。","下来"],["你的论文大概什么时候发表？定____了吗？","下来"]],"w":"Đừng chỉ hiểu 下来 là “đi xuống”: trong 几局下来、定下来 nó không chỉ hướng mà chỉ kết quả — xong xuôi, chốt lại."},{"id":"shebude","t":"舍不得","s":"không nỡ, tiếc (động từ)","b":"Theo sách, <b>舍不得</b> là <b>động từ</b>, biểu thị <b>không muốn từ bỏ, bỏ ra (tiền, công sức) hoặc sử dụng</b> một thứ gì đó. Dạng khẳng định <b>舍得</b> thường dùng trong <b>câu hỏi, câu trả lời</b> hoặc khi <b>so sánh</b>.","r":["舍不得 + động từ: 舍不得穿 (không nỡ mặc), 舍不得花钱.","舍不得 có thể đứng cuối làm vị ngữ: 又开始舍不得、总是有些舍不得.","Dạng khẳng định 舍得 hay xuất hiện trong câu hỏi: 你舍得吗？/ 你怎么舍得……？","Lỗi hay gặp: ✗ 这么好的工作，你怎么舍不得辞职？（muốn hỏi “sao bạn nỡ…”）→ ✓ 这么好的工作，你怎么舍得辞职？"],"e":[["把你最喜欢的玩具送给小朋友，你舍得吗？","Bǎ nǐ zuì xǐhuan de wánjù sòng gěi xiǎopéngyǒu, nǐ shěde ma?","Đem món đồ chơi con thích nhất tặng cho các bạn nhỏ, con có nỡ không?"],["有些人对于把钱花在为家庭和自己的生活增加乐趣的事情上，总是有些舍不得。","Yǒuxiē rén duìyú bǎ qián huā zài wèi jiātíng hé zìjǐ de shēnghuó zēngjiā lèqù de shìqing shang, zǒngshì yǒuxiē shěbude.","Có những người hễ phải tiêu tiền vào những việc làm cho gia đình và cuộc sống của mình thêm vui là lại thấy tiếc."],["可惜，大部分人都像你这样，开始不考虑得失，等到后来失去得多了，又开始舍不得，后果就是屡下屡败。","Kěxī, dà bùfen rén dōu xiàng nǐ zhèyàng, kāishǐ bù kǎolǜ déshī, děngdào hòulái shīqù de duō le, yòu kāishǐ shěbude, hòuguǒ jiù shì lǚ xià lǚ bài.","Đáng tiếc là phần lớn mọi người đều giống con, lúc đầu không tính đến được mất, đến khi về sau mất nhiều rồi lại bắt đầu tiếc, hậu quả là ván nào cũng thua. <i>(bài khoá)</i>"]],"d":[["这么好的工作，你怎么____辞职？！","舍得"],["买了件新衣服____穿，结果一直放在柜子里。","舍不得"],["把你最喜欢的玩具送给小朋友，你____吗？","舍得"]],"w":"Hỏi “có nỡ không / sao nỡ…” thì dùng dạng khẳng định 舍得; nói “không nỡ, tiếc” thì dùng 舍不得."},{"id":"sunshi_shiqu","t":"损失 vs 失去","s":"mất, tổn thất — mất đi","b":"<b>Giống nhau:</b> cả hai đều có thể làm <b>động từ</b>, đều mang nghĩa <b>vốn có mà sau đó không còn nữa</b>.","r":["损失 biểu thị sự <b>giảm bớt</b> (mất một phần): 棋子损失大半.","失去 thường chỉ <b>mất hẳn, hoàn toàn không còn</b>: 失去了家庭.","损失 <b>có thể làm danh từ</b> (tổn thất): 赔偿我们的损失.","失去 <b>không thể làm danh từ</b>."],"e":[["每走一步，你事先都应该想清楚：为了赢得什么，你愿意损失/失去什么，这样才可能赢。","Měi zǒu yí bù, nǐ shìxiān dōu yīnggāi xiǎng qīngchu: wèile yíngdé shénme, nǐ yuànyì sǔnshī/shīqù shénme, zhèyàng cái kěnéng yíng.","Mỗi nước đi, con đều phải tính kỹ từ trước: để giành được điều gì thì con chấp nhận mất đi điều gì, như vậy mới có thể thắng. <i>(bài khoá)</i>"],["不到三分钟，我的棋子损失大半。","Bú dào sān fēnzhōng, wǒ de qízǐ sǔnshī dàbàn.","Chưa đầy ba phút, quân cờ của tôi đã mất quá nửa. <i>(bài khoá)</i>"],["公司会赔偿我们的损失。","Gōngsī huì péicháng wǒmen de sǔnshī.","Công ty sẽ bồi thường tổn thất cho chúng tôi."],["战争让他失去了家庭。","Zhànzhēng ràng tā shīqù le jiātíng.","Chiến tranh đã khiến anh ấy mất đi gia đình."]],"d":[["生意失败，他____了很多钱。","损失"],["因为一场病，他____了记忆。","失去"],["要珍惜时间，因为____的时间永远都不会再回来。","失去"],["这次火灾造成了巨大的____。","损失"]],"w":"Mẹo: cần danh từ (造成……的损失、赔偿损失) → chỉ dùng 损失; mất hẳn thứ trừu tượng/không lấy lại được (记忆、时间、家庭) → 失去."}],"ext":[["夹子","jiāzi","cái kẹp"],["梳子","shūzi","cái lược"],["肥皂","féizào","xà phòng"],["扇子","shànzi","cái quạt (tay)"],["剪刀","jiǎndāo","cái kéo"],["绳子","shéngzi","sợi dây, dây thừng"],["锁","suǒ","ổ khóa; khóa"],["叉子","chāzi","cái nĩa"],["锅","guō","cái nồi, chảo"],["壶","hú","cái ấm, bình"],["盆","pén","cái chậu"],["火柴","huǒchái","que diêm"]],"extt":"家居2","notes":"Nguồn cuối bài khoá: 改编自《今日中学生》，作者：林夕. Bài khoá 704 chữ (theo sách), tr.79–81, chia 3 phần: đầu bài → “……我奇怪地问。” (từ 1–16) / “最重要的问题在于……” → “……反而一个一个都失去了。” (từ 17–27) / “说到这……” → hết (từ 28–34). Bài không có 专名. Từ số 6, 7, 9, 18, 25, 26, 27, 34 có dấu * (ngoài đề cương). Từ 5 睁 sách có kèm mục phụ 眼睁睁 yǎnzhēngzhēng (tt., trơ mắt) không đánh số — gộp vào nghĩa của từ 5. Từ 6 将军 sách ghi hai cách đọc/từ loại: jiāngjūn (dt., tướng quân) và jiāng jūn (đgt., chiếu tướng (trong đánh cờ)) — gộp vào một mục. Từ 25 不假思索 sách không ghi từ loại nên để trống pos; từ 1 sách ghi “（象）棋 (xiàng) qí”. Câu “第二局又输了，“这次没发挥好，我们再来”！” sách in dấu ！ sau dấu ngoặc kép, giữ nguyên. Hai câu dài >45 chữ (“后三分之二的时间……都失去了。”” và “可惜，大部分人……屡下屡败。”) không có ；nên giữ một dòng. Phần 注释 gồm 2 mục 词语例释 (动词+下来, 舍不得) và 1 词语辨析 (损失—失去); bảng 词语搭配 (接受/总结/吸取+教训, 珍惜+时间/现在/朋友/生命, 重要/决定(性)/关键+因素, 严重(的)+后果, 认真/仔细(地)+观察, 充分/尽情(地)+发挥, 睁+开/大, 把握+好/住, 一盘/局+棋, 一个/条+原则) không có trường trong schema nên chỉ ghi ở đây. Ví dụ (2) của 动词+下来 sách có chú thích “撕（sī, xé）”, đã bỏ chú thích khi chép câu. Drill 损失—失去 lấy từ 做一做 (câu (1) sách đã cho đáp án 损失; câu (2)(3)(4) đáp án do người soạn giải). Drill 动词+下来: câu 1 từ 练习3 câu ④ (đáp án vị trí D), câu 2 từ bài khoá, câu 3 từ ví dụ (1) của sách. Drill 舍不得: câu 1 từ 练一练 (1), câu 2 dựa trên 练一练 (2) (vế “结果一直放在柜子里” do người soạn thêm), câu 3 từ ví dụ (1). Dòng “lỗi hay gặp” của 舍不得 và các mục warn do người soạn đặt. vocab_ex của 犯, 过于, 责备, 失去, 舍不得, 后果, 屡 là vế câu trích nguyên từ bài khoá; còn lại là nguyên câu bài khoá. Bảng 扩展 (话题: 家居2) trong sách chỉ có chữ Hán + pinyin, nghĩa tiếng Việt do người soạn bổ sung. Sách không có chỗ mờ/không đọc được.","order":[{"z":"我父亲是一位象棋教练。","t":["我","父亲","是","一位","象棋","教练"],"v":"Cha tôi là một huấn luyện viên cờ tướng."},{"z":"父亲让我先走三步。","t":["父亲","让","我","先","走","三步"],"v":"Cha cho tôi đi trước ba nước."},{"z":"没办法，眼睁睁看着父亲“将军”，我输了。","t":["没","办法","眼睁睁","看着","父亲","将军","我输","了"],"v":"Hết cách, tôi đành trơ mắt nhìn cha “chiếu tướng”, thế là tôi thua."},{"z":"我不服气，说：“这次运气不好，再来！","t":["我","不服气","说","这次","运气","不好","再","来"],"v":"Tôi không phục, bảo: “Lần này xui quá, chơi lại!”"},{"z":"第二局又输了，“这次没发挥好，我们再来”！","t":["第二局","又","输","了","这次","没","发挥","好","我们","再","来"],"v":"Ván thứ hai lại thua, “Lần này con chơi chưa tốt, mình chơi lại đi”!"},{"z":"几局下来，基本上都是不到10分钟我就败下阵来。","t":["几局","下来","基本上","都","是","不到","10","分钟","我","就","败下阵来"],"v":"Mấy ván liền, hầu như ván nào chưa đến 10 phút tôi đã thua trận."},{"z":"父亲看看我说：“你初学棋，输是正常的。","t":["父亲","看看","我","说","你","初学","棋","输是","正常","的"],"v":"Cha nhìn tôi rồi nói: “Con mới học cờ, thua là chuyện bình thường."},{"z":"但是你要知道输在什么地方，要吸取教训。","t":["但是","你","要","知道","输在","什么","地方","要","吸取教训"],"v":"Nhưng con phải biết mình thua ở đâu, phải rút ra bài học."},{"z":"我知道，我技术没你好，经验也不足。","t":["我","知道","我","技术","没","你好","经验","也","不足"],"v":"“Con biết mà, kỹ thuật của con không bằng cha, kinh nghiệm cũng còn thiếu.”"},{"z":"这只是次要因素，不是最重要的。","t":["这","只是","次要","因素","不是","最","重要","的"],"v":"“Đó chỉ là yếu tố thứ yếu, không phải điều quan trọng nhất.”"},{"z":"那最重要的是什么？","t":["那","最","重要","的","是","什么"],"v":"“Vậy điều quan trọng nhất là gì ạ?” Tôi ngạc nhiên hỏi."},{"z":"最重要的问题在于你心态不对。","t":["最","重要","的","问题","在于","你","心态","不","对"],"v":"“Vấn đề quan trọng nhất nằm ở chỗ tâm lý của con không đúng."},{"z":"你不够珍惜你的棋子。","t":["你","不够","珍惜","你","的","棋子"],"v":"Con chưa biết quý quân cờ của mình.”"},{"z":"我 nhân kế hoạch cụ thể cho chuyến đi chơi thư giãn một ngày ở Bắc Kinh."},{"h":"休闲","p":"xiūxián","v":"nghỉ ngơi và giải trí","k":"đgt.","x":0,"ez":"他有问必答，不但准确无误地按顺序报了一大堆公交车、地铁站的名字，而且还给一对情侣制订了北京休闲一日游的具体方案。","ev":"Hỏi gì cậu cũng trả lời được: không chỉ đọc vanh vách, chính xác theo thứ tự tên cả một loạt tuyến xe buýt và ga tàu điện ngầm, mà còn lên cho một cặp tình nhân kế hoạch cụ thể cho chuyến đi chơi thư giãn một ngày ở Bắc Kinh."},{"h":"具体","p":"jùtǐ","v":"cụ thể, tỉ mỉ","k":"tt.","x":0,"ez":"因为天气影响，我们的活动推迟了，具体时间再等通知。","ev":"Do ảnh hưởng của thời tiết, hoạt động của chúng ta bị hoãn lại, thời gian cụ thể xin chờ thông báo sau."},{"h":"国贸","p":"Guómào","v":"Quốc Mậu (khu trung tâm thương mại của Bắc Kinh)","k":"tên riêng","x":0,"ez":"主持人现场考他：“假设我要从国贸到鼓楼大街，该怎么乘车？”","ev":"Người dẫn chương trình kiểm tra cậu ngay tại chỗ: “Giả sử tôi muốn đi từ Quốc Mậu đến đường Cổ Lâu thì nên đi xe thế nào?”"},{"h":"鼓楼大街","p":"Gǔlóu Dàjiē","v":"Đường Cổ Lâu","k":"tên riêng","x":0,"ez":"主持人现场考他：“假设我要从国贸到鼓楼大街，该怎么乘车？”","ev":"Người dẫn chương trình kiểm tra cậu ngay tại chỗ: “Giả sử tôi muốn đi từ Quốc Mậu đến đường Cổ Lâu thì nên đi xe thế nào?”"},{"h":"天安门东","p":"Tiān'ānmén Dōng","v":"trạm phía đông Thiên An Môn","k":"tên riêng","x":0,"ez":"他反应得非常快，马上回答说：“在国贸坐1路车，到天安门东，换乘82路，就可以到达。”","ev":"Cậu phản ứng cực nhanh, lập tức trả lời: “Ở Quốc Mậu lên xe số 1, đến trạm phía đông Thiên An Môn thì chuyển sang tuyến 82 là tới nơi.”"},{"h":"专注","p":"zhuānzhù","v":"mê mải, dồn hết tâm trí vào","k":"tt.","x":1,"ez":"他对公交的这种专注显然为他的求职打开了大门。","ev":"Rõ ràng sự say mê, chuyên tâm ấy dành cho xe buýt đã mở ra cánh cửa tìm việc cho cậu."},{"h":"显然","p":"xiǎnrán","v":"rõ ràng, hiển nhiên","k":"tt.","x":0,"ez":"前两局棋输给爸爸，他显然并不担心。","ev":"Thua bố hai ván cờ đầu, rõ ràng cậu bé chẳng hề lo lắng."},{"h":"成立","p":"chénglì","v":"thành lập, lập","k":"đgt.","x":0,"ez":"老总们向他发出了热情的邀请，给他非常好的职位和待遇，甚至要专门为他成立有关的部门，只为留住这个人才。","ev":"Các vị tổng giám đốc nhiệt tình mời cậu, đưa ra vị trí và đãi ngộ cực tốt, thậm chí còn muốn lập riêng một bộ phận liên quan cho cậu, chỉ để giữ chân nhân tài này."},{"h":"部门","p":"bùmén","v":"ban, vị trí việc làm","k":"dt.","x":0,"ez":"老总们向他发出了热情的邀请，给他非常好的职位和待遇，甚至要专门为他成立有关的部门，只为留住这个人才。","ev":"Các vị tổng giám đốc nhiệt tình mời cậu, đưa ra vị trí và đãi ngộ cực tốt, thậm chí còn muốn lập riêng một bộ phận liên quan cho cậu, chỉ để giữ chân nhân tài này."},{"h":"执着","p":"zhízhuó","v":"bền bỉ, kiên trì","k":"tt.","x":1,"ez":"这个老总回答：“专业的、执着的、优秀的人才是无价的，这样的人一定会有光明的前途。”","ev":"Vị tổng giám đốc đáp: “Nhân tài chuyên nghiệp, bền bỉ, xuất sắc là vô giá, người như vậy nhất định sẽ có tương lai tươi sáng.”"},{"h":"光明","p":"guāngmíng","v":"sáng sủa, tươi sáng","k":"tt.","x":0,"ez":"来我们公司工作，你的前途一片光明！","ev":"Đến làm việc ở công ty chúng tôi, tương lai của bạn sẽ rộng mở tươi sáng!"},{"h":"前途","p":"qiántú","v":"tiền đồ, tương lai, triển vọng","k":"dt.","x":0,"ez":"这个老总回答：“专业的、执着的、优秀的人才是无价的，这样的人一定会有光明的前途。”","ev":"Vị tổng giám đốc đáp: “Nhân tài chuyên nghiệp, bền bỉ, xuất sắc là vô giá, người như vậy nhất định sẽ có tương lai tươi sáng.”"},{"h":"行业","p":"hángyè","v":"ngành, nghề","k":"dt.","x":0,"ez":"是的，无论在哪个行业，最缺乏的永远都是专注的人。","ev":"Đúng vậy, dù ở ngành nghề nào, thứ thiếu nhất mãi mãi vẫn là những người chuyên tâm."},{"h":"缺乏","p":"quēfá","v":"thiếu, không có đủ","k":"đgt.","x":0,"ez":"是的，无论在哪个行业，最缺乏的永远都是专注的人。","ev":"Đúng vậy, dù ở ngành nghề nào, thứ thiếu nhất mãi mãi vẫn là những người chuyên tâm."}]],"texts":[{"no":1,"tz":"","tv":"","lines":[{"s":"","z":"他叫刘辰，是一个年仅23岁的应届本科毕业生，再过一个月就要毕业了。","p":"Tā jiào Liú Chén, shì yí ge nián jǐn èrshísān suì de yīngjiè běnkē bìyèshēng, zài guò yí ge yuè jiù yào bìyè le.","v":"Cậu ấy tên là Lưu Thần, mới 23 tuổi, là sinh viên đại học chính quy khóa tốt nghiệp năm nay, chỉ còn một tháng nữa là ra trường.","b":0},{"s":"","z":"面对并不乐观的就业形势，他压力很大：“说实话，我觉得自己实在没什么优势。”","p":"Miànduì bìng bú lèguān de jiùyè xíngshì, tā yālì hěn dà: “Shuō shíhuà, wǒ juéde zìjǐ shízài méi shénme yōushì.”","v":"Đứng trước tình hình việc làm chẳng mấy khả quan, cậu chịu áp lực rất lớn: “Nói thật, tôi thấy bản thân chẳng có ưu thế gì cả.”","b":0},{"s":"","z":"就在他为工作发愁时，机会来了。","p":"Jiù zài tā wèi gōngzuò fāchóu shí, jīhuì lái le.","v":"Đúng lúc cậu đang rầu rĩ vì chuyện việc làm thì cơ hội đến.","b":0},{"s":"","z":"天津卫视的《非你莫属》节目组看了他的简历，接受了他的申请，他可以到节目现场去求职。","p":"Tiānjīn Wèishì de 《Fēinǐmòshǔ》 jiémùzǔ kàn le tā de jiǎnlì, jiēshòu le tā de shēnqǐng, tā kěyǐ dào jiémù xiànchǎng qù qiúzhí.","v":"Ê-kíp chương trình “Chỉ thuộc về bạn” của Kênh truyền hình Thiên Tân đã xem lý lịch của cậu và nhận đơn đăng ký, cậu có thể đến trường quay của chương trình để tìm việc.","b":0},{"s":"","z":"来到现场，他发现，果然有一家公司有适合他的职位——旅游体验师。","p":"Láidào xiànchǎng, tā fāxiàn, guǒrán yǒu yì jiā gōngsī yǒu shìhé tā de zhíwèi —— lǚyóu tǐyànshī.","v":"Đến trường quay, cậu phát hiện quả nhiên có một công ty có vị trí hợp với mình — chuyên viên trải nghiệm du lịch.","b":0},{"s":"","z":"因为小学六年级的时候，他迷上了公交车，从此，就一直关注公交线路，北京市范围内所有的公交线路他都了如指掌。","p":"Yīnwèi xiǎoxué liù niánjí de shíhou, tā míshang le gōngjiāochē, cóngcǐ, jiù yìzhí guānzhù gōngjiāo xiànlù, Běijīng Shì fànwéi nèi suǒyǒu de gōngjiāo xiànlù tā dōu liǎorúzhǐzhǎng.","v":"Hồi lớp sáu cậu mê xe buýt, từ đó cậu luôn để ý các tuyến xe buýt, mọi tuyến trong phạm vi thành phố Bắc Kinh cậu đều thuộc như lòng bàn tay.","b":0},{"s":"","z":"从上初中起，他就是同学们的出行顾问，无论谁想去哪里，他都能很快地回答出最方便的路线，提供给同学们参考。","p":"Cóng shàng chūzhōng qǐ, tā jiù shì tóngxuémen de chūxíng gùwèn, wúlùn shéi xiǎng qù nǎli, tā dōu néng hěn kuài de huídá chū zuì fāngbiàn de lùxiàn, tígōng gěi tóngxuémen cānkǎo.","v":"Từ khi lên cấp hai, cậu đã là “cố vấn đi lại” của các bạn, ai muốn đi đâu cậu cũng nhanh chóng chỉ ra tuyến đường tiện nhất để các bạn tham khảo.","b":0},{"s":"","z":"在他的成长过程中，公交就是他最好的伙伴。","p":"Zài tā de chéngzhǎng guòchéng zhōng, gōngjiāo jiù shì tā zuì hǎo de huǒbàn.","v":"Trong quá trình trưởng thành của cậu, xe buýt chính là người bạn thân thiết nhất.","b":0},{"s":"","z":"节目制作时，电视台问他有什么才艺，他便说：“我是个公交迷，对北京市的公交、地铁线路都有一些研究。”","p":"Jiémù zhìzuò shí, diànshìtái wèn tā yǒu shénme cáiyì, tā biàn shuō: “Wǒ shì ge gōngjiāomí, duì Běijīng Shì de gōngjiāo, dìtiě xiànlù dōu yǒu yìxiē yánjiū.”","v":"Khi ghi hình chương trình, đài truyền hình hỏi cậu có tài lẻ gì, cậu liền nói: “Tôi là dân mê xe buýt, có tìm hiểu đôi chút về các tuyến xe buýt và tàu điện ngầm ở Bắc Kinh.”","b":1},{"s":"","z":"主持人现场考他：“假设我要从国贸到鼓楼大街，该怎么乘车？”","p":"Zhǔchírén xiànchǎng kǎo tā: “Jiǎshè wǒ yào cóng Guómào dào Gǔlóu Dàjiē, gāi zěnme chéngchē?”","v":"Người dẫn chương trình kiểm tra cậu ngay tại chỗ: “Giả sử tôi muốn đi từ Quốc Mậu đến đường Cổ Lâu thì nên đi xe thế nào?”","b":0},{"s":"","z":"他反应得非常快，马上回答说：“在国贸坐1路车，到天安门东，换乘82路，就可以到达。”","p":"Tā fǎnyìng de fēicháng kuài, mǎshàng huídá shuō: “Zài Guómào zuò yī lù chē, dào Tiān'ānmén Dōng, huànchéng bāshí'èr lù, jiù kěyǐ dàodá.”","v":"Cậu phản ứng cực nhanh, lập tức trả lời: “Ở Quốc Mậu lên xe số 1, đến trạm phía đông Thiên An Môn thì chuyển sang tuyến 82 là tới nơi.”","b":0},{"s":"","z":"他的回答让台上的12位老板都兴奋了起来，他们开始陆续向他提问。","p":"Tā de huídá ràng tái shang de shí'èr wèi lǎobǎn dōu xīngfèn le qilai, tāmen kāishǐ lùxù xiàng tā tíwèn.","v":"Câu trả lời của cậu khiến cả 12 ông chủ trên sân khấu đều phấn khích, họ bắt đầu lần lượt đặt câu hỏi cho cậu.","b":0},{"s":"","z":"他有问必答，不但准确无误地按顺序报了一大堆公交车、地铁站的名字，而且还给一对情侣制订了北京休闲一日游的具体方案。","p":"Tā yǒu wèn bì dá, búdàn zhǔnquè wúwù de àn shùnxù bào le yí dà duī gōngjiāochē, dìtiězhàn de míngzi, érqiě hái gěi yí duì qínglǚ zhìdìng le Běijīng xiūxián yírìyóu de jùtǐ fāng'àn.","v":"Hỏi gì cậu cũng trả lời được: không chỉ đọc vanh vách, chính xác theo thứ tự tên cả một loạt tuyến xe buýt và ga tàu điện ngầm, mà còn lên cho một cặp tình nhân kế hoạch cụ thể cho chuyến đi chơi thư giãn một ngày ở Bắc Kinh.","b":0},{"s":"","z":"他对公交的这种专注显然为他的求职打开了大门。","p":"Tā duì gōngjiāo de zhè zhǒng zhuānzhù xiǎnrán wèi tā de qiúzhí dǎkāi le dàmén.","v":"Rõ ràng sự say mê, chuyên tâm ấy dành cho xe buýt đã mở ra cánh cửa tìm việc cho cậu.","b":1},{"s":"","z":"老总们向他发出了热情的邀请，给他非常好的职位和待遇，甚至要专门为他成立有关的部门，只为留住这个人才。","p":"Lǎozǒngmen xiàng tā fāchū le rèqíng de yāoqǐng, gěi tā fēicháng hǎo de zhíwèi hé dàiyù, shènzhì yào zhuānmén wèi tā chénglì yǒuguān de bùmén, zhǐ wèi liúzhù zhège réncái.","v":"Các vị tổng giám đốc nhiệt tình mời cậu, đưa ra vị trí và đãi ngộ cực tốt, thậm chí còn muốn lập riêng một bộ phận liên quan cho cậu, chỉ để giữ chân nhân tài này.","b":0},{"s":"","z":"最终，他选择了一家他感兴趣的单位。","p":"Zuìzhōng, tā xuǎnzé le yì jiā tā gǎn xìngqù de dānwèi.","v":"Cuối cùng, cậu chọn một đơn vị mà mình thấy hứng thú.","b":0},{"s":"","z":"主持人问这家公司的老总：“你给的工资是不是太高了？”","p":"Zhǔchírén wèn zhè jiā gōngsī de lǎozǒng: “Nǐ gěi de gōngzī shì bu shì tài gāo le?”","v":"Người dẫn chương trình hỏi vị tổng giám đốc của công ty này: “Mức lương anh đưa ra có phải quá cao không?”","b":0},{"s":"","z":"这个老总回答：“专业的、执着的、优秀的人才是无价的，这样的人一定会有光明的前途。”","p":"Zhège lǎozǒng huídá: “Zhuānyè de, zhízhuó de, yōuxiù de réncái shì wújià de, zhèyàng de rén yídìng huì yǒu guāngmíng de qiántú.”","v":"Vị tổng giám đốc đáp: “Nhân tài chuyên nghiệp, bền bỉ, xuất sắc là vô giá, người như vậy nhất định sẽ có tương lai tươi sáng.”","b":0},{"s":"","z":"是的，无论在哪个行业，最缺乏的永远都是专注的人。","p":"Shì de, wúlùn zài nǎge hángyè, zuì quēfá de yǒngyuǎn dōu shì zhuānzhù de rén.","v":"Đúng vậy, dù ở ngành nghề nào, thứ thiếu nhất mãi mãi vẫn là những người chuyên tâm.","b":0},{"s":"","z":"专注的人永远不缺机会！","p":"Zhuānzhù de rén yǒngyuǎn bù quē jīhuì!","v":"Người chuyên tâm thì không bao giờ thiếu cơ hội!","b":0}]}],"aud":[{"v":"audio/28-2.mp3","t":"audio/28-1.mp3"}],"gram":[{"id":"congci","t":"从此","s":"từ đó, từ đấy (phó từ)","b":"<b>从此</b> là <b>phó từ</b>, biểu thị <b>bắt đầu từ thời điểm này hoặc từ thời điểm vừa được nhắc tới</b> trở về sau. Vế trước nêu một sự việc làm mốc, vế sau dùng <b>从此</b> để nói điều xảy ra và kéo dài kể từ mốc đó.","r":["Cấu trúc: [sự việc làm mốc]，从此 + (chủ ngữ) + hành động/trạng thái từ đó về sau.","Có thể đứng trước chủ ngữ (从此他刻苦用功) hoặc đứng riêng, ngắt bằng dấu phẩy (从此，就一直关注……).","Thường dùng khi kể chuyện: sau sự việc A thì từ đó trở đi là B."],"e":[["李白听了老婆婆的话，很受感动。从此他刻苦用功，最后成了一位伟大的诗人。","Lǐ Bái tīng le lǎopópo de huà, hěn shòu gǎndòng. Cóngcǐ tā kèkǔ yònggōng, zuìhòu chéng le yí wèi wěidà de shīrén.","Lý Bạch nghe lời bà cụ, vô cùng cảm động. Từ đó ông chăm chỉ khổ luyện, cuối cùng trở thành một nhà thơ vĩ đại."],["因为小学六年级的时候，他迷上了公交车，从此，就一直关注公交线路，……","Yīnwèi xiǎoxué liù niánjí de shíhou, tā míshang le gōngjiāochē, cóngcǐ, jiù yìzhí guānzhù gōngjiāo xiànlù, ……","Hồi lớp sáu cậu mê xe buýt, từ đó cậu luôn để ý các tuyến xe buýt… <i>(bài khoá)</i>"],["嫦娥自己吃下了不死药，结果她飞到了月亮上，从此与后羿分离。","Cháng'é zìjǐ chīxià le bù sǐ yào, jiéguǒ tā fēidào le yuèliang shang, cóngcǐ yǔ Hòuyì fēnlí.","Hằng Nga tự mình uống thuốc trường sinh, kết quả bay lên cung trăng, từ đó chia lìa với Hậu Nghệ."]],"d":[["李白听了老婆婆的话，很受感动。____他刻苦用功，最后成了一位伟大的诗人。","从此"],["嫦娥自己吃下了不死药，结果她飞到了月亮上，____与后羿分离。","从此"],["他是十年前来的中国，____就一直住在这里。","从此"]],"w":"Đừng nhầm 从此 (từ đó trở đi — chỉ mốc thời gian) với 因此 (vì vậy — chỉ kết quả)."},{"id":"jiashe","t":"假设","s":"giả sử (động từ); giả thuyết, giả thiết (danh từ)","b":"<b>假设</b> là <b>động từ</b>, nghĩa là <b>coi một tình huống nào đó như thật</b> (giả sử, giả định). <b>假设</b> cũng có thể làm <b>danh từ</b>, chỉ <b>tình huống được hình dung, đặt ra</b> (giả thuyết, giả thiết).","r":["Động từ: đặt ở đầu câu/vế câu để nêu tình huống giả định, vế sau là câu hỏi hoặc kết luận — 假设……，该怎么……？","Danh từ: làm chủ ngữ hoặc tân ngữ, thường có định ngữ đi kèm — 您当年的假设, 一种大胆的假设.","Khi có chủ ngữ đứng trước (我们假设……), cần dùng động từ 假设."],"e":[["假设我要从国贸到鼓楼大街，该怎么乘车？","Jiǎshè wǒ yào cóng Guómào dào Gǔlóu Dàjiē, gāi zěnme chéngchē?","Giả sử tôi muốn đi từ Quốc Mậu đến đường Cổ Lâu thì nên đi xe thế nào? <i>(bài khoá)</i>"],["假设汽水两块钱一瓶，两个空瓶可以换一瓶汽水，如果给你6块钱，你最多能喝几瓶汽水？","Jiǎshè qìshuǐ liǎng kuài qián yì píng, liǎng ge kōng píng kěyǐ huàn yì píng qìshuǐ, rúguǒ gěi nǐ liù kuài qián, nǐ zuì duō néng hē jǐ píng qìshuǐ?","Giả sử nước ngọt có ga giá hai tệ một chai, hai vỏ chai rỗng đổi được một chai, nếu đưa bạn 6 tệ thì bạn uống được nhiều nhất mấy chai?"],["您当年的假设已经被证明是对的。","Nín dāngnián de jiǎshè yǐjīng bèi zhèngmíng shì duì de.","Giả thuyết năm xưa của ông đã được chứng minh là đúng."],["这是一种大胆的假设，但不一定是科学的。","Zhè shì yì zhǒng dàdǎn de jiǎshè, dàn bù yídìng shì kēxué de.","Đây là một giả thuyết táo bạo, nhưng chưa chắc đã có cơ sở khoa học."]],"d":[["我们____他明天9点能出发，那么10点可以到这儿。","假设"],["这是一种大胆的____，但不一定是科学的。","假设"],["____我要从国贸到鼓楼大街，该怎么乘车？","假设"]],"w":"Bài tập trong sách cho chọn 假设/假如: ở câu “我们____他明天9点能出发” đã có chủ ngữ 我们 nên dùng động từ 假设."},{"id":"dui","t":"堆","s":"đống, đám (lượng từ); chất đống (động từ); đống (danh từ)","b":"<b>堆</b> trước hết là <b>lượng từ</b>, dùng cho đồ vật hoặc người <b>tụ lại thành đống, thành đám</b> (không dùng cho người mình kính trọng). <b>堆</b> còn làm <b>động từ</b>: dùng tay hoặc dụng cụ gom đồ vật lại một chỗ (chất đống); và làm <b>danh từ</b>: những thứ được chất lại thành đống.","r":["Lượng từ: 一（大）堆 + danh từ — 一大堆公交车、地铁站的名字, 一大堆毛病, 一堆人.","Không dùng cho người đáng kính trọng: ✗ 一堆老师 → ✓ 几位老师.","Động từ: 堆在 + nơi chốn / 堆成 + kết quả — 堆在这儿, 堆成山.","Danh từ: danh từ + 堆 — 建筑材料堆, 石头堆."],"e":[["他有问必答，不但准确无误地按顺序报了一大堆公交车、地铁站的名字，而且还给一对情侣制订了北京休闲一日游的具体方案。","Tā yǒu wèn bì dá, búdàn zhǔnquè wúwù de àn shùnxù bào le yí dà duī gōngjiāochē, dìtiězhàn de míngzi, érqiě hái gěi yí duì qínglǚ zhìdìng le Běijīng xiūxián yírìyóu de jùtǐ fāng'àn.","Hỏi gì cậu cũng trả lời được: không chỉ đọc chính xác theo thứ tự tên cả một loạt tuyến xe buýt và ga tàu điện ngầm, mà còn lên cho một cặp tình nhân kế hoạch cụ thể cho chuyến đi chơi một ngày ở Bắc Kinh. <i>(bài khoá)</i>"],["一个小师弟结婚才半年，就跑过来找我诉苦，说妻子几乎每天都要挑出他一大堆毛病：饭后不洗碗、睡前不洗脚……","Yí ge xiǎo shīdì jiéhūn cái bàn nián, jiù pǎo guòlai zhǎo wǒ sùkǔ, shuō qīzi jīhū měi tiān dōu yào tiāochū tā yí dà duī máobìng: fàn hòu bù xǐ wǎn, shuì qián bù xǐ jiǎo……","Một cậu đàn em mới cưới được nửa năm đã chạy đến than thở với tôi, rằng gần như ngày nào vợ cũng bới ra cả đống tật xấu của cậu: ăn xong không rửa bát, trước khi ngủ không rửa chân…"],["这些零件怎么都堆在这儿啊？","Zhèxiē língjiàn zěnme dōu duī zài zhèr a?","Sao đống linh kiện này lại chất hết ở đây thế?"],["今年真不错！你看这粮食，都堆成山了。","Jīnnián zhēn búcuò! Nǐ kàn zhè liángshi, dōu duī chéng shān le.","Năm nay được mùa thật! Nhìn lương thực mà xem, chất cao như núi rồi."],["工厂旁边有一个建筑材料堆。","Gōngchǎng pángbiān yǒu yí ge jiànzhù cáiliào duī.","Cạnh nhà máy có một đống vật liệu xây dựng."],["叔叔把手指上的金戒指取了下来，扔到石头堆里。","Shūshu bǎ shǒuzhǐ shang de jīn jièzhi qǔ le xiàlai, rēngdào shítou duī li.","Chú tháo chiếc nhẫn vàng trên ngón tay ra, ném vào đống đá."]],"d":[["A：那边怎么有一____人围在那儿？","堆"],["这些零件怎么都____在这儿啊？","堆"],["叔叔把手指上的金戒指取了下来，扔到石头____里。","堆"]],"w":"堆 mang sắc thái “cả đống, lộn xộn”, nên không dùng làm lượng từ cho người đáng kính (thầy cô, khách quý…)."},{"id":"fanying-fanying","t":"反应 vs 反映","s":"phản ứng — phản ánh","b":"Điểm giống: hai từ <b>đồng âm</b> (fǎnyìng), và <b>đều vừa làm động từ vừa làm danh từ</b>.","r":["<b>反应</b>: động từ chỉ việc chịu kích thích từ bên ngoài mà có hành động hoặc biến đổi; danh từ chỉ chính những hành động, biến đổi đó (phản ứng). Ngoài ra không có nghĩa nào khác.","<b>反映</b> (1): báo cáo tình hình hoặc ý kiến lên cấp trên (phản ánh lên trên).","<b>反映</b> (2): còn chỉ việc thể hiện bản chất của sự vật ra ngoài (phản ánh).","<b>反应</b> không mang tân ngữ (他反应得非常快); <b>反映</b> mang được tân ngữ (反映了……新变化).","lỗi hay gặp: ✗ 他脑子反映得很快 → ✓ 他脑子反应得很快"],"e":[["这时人体精力下降，反应减慢，情绪低下，利于人体进入甜美的梦乡。","Zhè shí réntǐ jīnglì xiàjiàng, fǎnyìng jiǎnmàn, qíngxù dīxià, lìyú réntǐ jìnrù tiánměi de mèngxiāng.","Lúc này tinh lực cơ thể giảm, phản ứng chậm lại, cảm xúc lắng xuống, giúp cơ thể dễ chìm vào giấc ngủ ngon."],["请放心，我会把你的意见反映给学校。","Qǐng fàngxīn, wǒ huì bǎ nǐ de yìjiàn fǎnyìng gěi xuéxiào.","Bạn cứ yên tâm, tôi sẽ phản ánh ý kiến của bạn lên nhà trường."],["谈话可以反映一个人的职业特点。","Tánhuà kěyǐ fǎnyìng yí ge rén de zhíyè tèdiǎn.","Cách nói chuyện có thể phản ánh đặc điểm nghề nghiệp của một người."],["他反应得非常快，一点儿也不用思考。","Tā fǎnyìng de fēicháng kuài, yìdiǎnr yě búyòng sīkǎo.","Anh ấy phản ứng cực nhanh, chẳng cần suy nghĩ chút nào."],["这个电影反映了中国年轻一代的新变化。","Zhège diànyǐng fǎnyìng le Zhōngguó niánqīng yí dài de xīn biànhuà.","Bộ phim này phản ánh những thay đổi mới của thế hệ trẻ Trung Quốc."]],"d":[["那两只羊看见青草后是什么____？","反应"],["他这么做，____出他的思想还不太成熟。","反映"],["他脑子____得很快，马上找到了问题的关键。","反应"],["小王，大家____你最近常迟到。家里有什么问题吗？","反映"]],"w":"Mẹo: 反应 = “phản ứng” (đáp lại kích thích, không mang tân ngữ); 反映 = “phản ánh” (báo lên cấp trên, hoặc thể hiện bản chất; mang được tân ngữ)."}],"ext":[["模特","mótè","người mẫu"],["会计","kuàijì","kế toán"],["秘书","mìshū","thư ký"],["农民","nóngmín","nông dân"],["工程师","gōngchéngshī","kỹ sư"],["工人","gōngrén","công nhân"],["员工","yuángōng","nhân viên"],["人事","rénshì","nhân sự"],["报到","bào dào","trình diện, báo danh (nhận việc)"],["失业","shī yè","thất nghiệp"],["手续","shǒuxù","thủ tục"],["待遇","dàiyù","đãi ngộ"],["兼职","jiānzhí","việc làm thêm, kiêm nhiệm"],["简历","jiǎnlì","sơ yếu lý lịch"]],"extt":"职业、求职","notes":"Nguồn cuối bài khoá: 改编自《年轻人》，作者：张宏生. Bài khoá 673 chữ (theo sách), 5 đoạn văn (tr.88–90), chia 3 phần: đoạn 1–2 (từ 1–17 + 3 专名 刘辰, 天津卫视, 《非你莫属》) / đoạn 3 (từ 18–31 + 3 专名 国贸, 鼓楼大街, 天安门东) / đoạn 4–5 (từ 32–40). Từ số 5, 9, 10, 15, 19, 21, 28, 29, 32, 36 có dấu * (ngoài đề cương). Pinyin chép theo sách: 就业 “jiù yè” (sách in tách), 初（级）中（学） “chū (jí) zhōng (xué)”; trong bảng 扩展 sách in “bào dào”, “shī yè”. Từ 14 sách ghi dạng 初（级）中（学）, bài khoá chỉ có 初中 nên câu ví dụ chứa 初中 chứ không chứa nguyên dạng có ngoặc. Các câu dài >45 chữ không có dấu ；(câu 6, 7 đoạn 1; câu cuối đoạn 2; câu 2 đoạn 3) giữ nguyên một dòng. Ví dụ (3) của 从此 sách có chú âm 嫦娥（Cháng'é）, 后羿（Hòuyì） — đã bỏ phần chú âm khi chép câu. Phần 注释 gồm 3 mục 词语例释 (从此, 假设, 堆) và 1 词语辨析 (反应—反映). Drill 反应—反映 lấy từ 做一做 (câu (1) sách đã cho đáp án 反应; câu (2)(3)(4) đáp án do người soạn giải); drill 假设 câu 1 lấy từ 练习2 ②; drill 堆 câu 1 từ 练一练 (3); các drill còn lại đặt dựa trên câu ví dụ của sách (riêng “他是十年前来的中国，____就一直住在这里。” do người soạn hoàn thành từ 练一练 (1)). Dòng “lỗi hay gặp” của 堆 và 反应—反映, cùng câu warn của 从此/假设, là do người soạn suy ra từ lời giải thích/bảng của sách. vocab_ex của 乐观, 范围, 参考, 具体, 陆续, 显然 lấy từ 练习1 (đã điền đáp án); của 制作, 到达, 光明 từ 练习2 (đã điền đáp án); của 就业, 优势 từ phần 运用; của 职位 từ phần 热身; còn lại là câu nguyên văn trong bài khoá. Bảng 扩展 (话题: 职业, 求职) trong sách chỉ có chữ Hán + pinyin, nghĩa tiếng Việt do người soạn bổ sung.","order":[{"z":"就在他为工作发愁时，机会来了。","t":["就","在","他","为","工作","发愁","时","机会","来","了"],"v":"Đúng lúc cậu đang rầu rĩ vì chuyện việc làm thì cơ hội đến."},{"z":"最终，他选择了一家他感兴趣的单位。","t":["最终","他","选择","了","一家","他","感兴趣","的","单位"],"v":"Cuối cùng, cậu chọn một đơn vị mà mình thấy hứng thú."},{"z":"专注的人永远不缺机会！","t":["专注","的","人","永远","不缺","机会"],"v":"Người chuyên tâm thì không bao giờ thiếu cơ hội!"},{"z":"李白听了老婆婆的话，很受感动。","t":["李白","听","了","老婆婆","的话","很受","感动"],"v":"Lý Bạch nghe lời bà cụ, vô cùng cảm động. Từ đó ông chăm chỉ khổ luyện, cuối cùng trở thành một nhà thơ vĩ đại."},{"z":"从此他刻苦用功，最后成了一位伟大的诗人。","t":["从此","他","刻苦","用功","最后","成","了","一位","伟大","的","诗人"],"v":"Lý Bạch nghe lời bà cụ, vô cùng cảm động. Từ đó ông chăm chỉ khổ luyện, cuối cùng trở thành một nhà thơ vĩ đại."},{"z":"假设我要从国贸到鼓楼大街，该怎么乘车？","t":["假设","我要","从","国贸","到","鼓楼","大街","该","怎么","乘车"],"v":"Giả sử tôi muốn đi từ Quốc Mậu đến đường Cổ Lâu thì nên đi xe thế nào? (bài khoá)"},{"z":"您当年的假设已经被证明是对的。","t":["您","当年","的","假设","已经","被","证明","是","对","的"],"v":"Giả thuyết năm xưa của ông đã được chứng minh là đúng."},{"z":"这是一种大胆的假设，但不一定是科学的。","t":["这是","一种","大胆","的","假设","但","不","一定","是","科学","的"],"v":"Đây là một giả thuyết táo bạo, nhưng chưa chắc đã có cơ sở khoa học."},{"z":"这些零件怎么都堆在这儿啊？","t":["这些","零件","怎么","都","堆","在","这儿","啊"],"v":"Sao đống linh kiện này lại chất hết ở đây thế?"},{"z":"你看这粮食，都堆成山了。","t":["你","看","这","粮食","都","堆","成山","了"],"v":"Năm nay được mùa thật! Nhìn lương thực mà xem, chất cao như núi rồi."},{"z":"工厂旁边有一个建筑材料堆。","t":["工厂
