về phía Tế Nam."},{"h":"斜","p":"xié","v":"xiên, nghiêng","k":"tt.","x":0,"ez":"山区的石灰岩层，以大约三十度的角度，由南向北斜，因此大量的地下水向济南运动。","ev":"Các tầng đá vôi ở vùng núi nghiêng từ nam sang bắc với góc khoảng ba mươi độ, vì thế một lượng lớn nước ngầm dịch chuyển về phía Tế Nam."},{"h":"为","p":"wéi","v":"trở thành","k":"đgt.","x":0,"ez":"而济南市区的地下岩石变为了火成岩，地下水流到这里，碰到火成岩挡住了路，就积蓄起来，越积越多。","ev":"Còn đá dưới lòng đất ở nội thành Tế Nam lại chuyển thành đá mác-ma; nước ngầm chảy tới đây, gặp đá mác-ma chắn đường liền tích tụ lại, càng tích càng nhiều."},{"h":"火成岩","p":"huǒchéngyán","v":"đá phun trào, đá mác-ma","k":"dt.","x":1,"ez":"而济南市区的地下岩石变为了火成岩，地下水流到这里，碰到火成岩挡住了路，就积蓄起来，越积越多。","ev":"Còn đá dưới lòng đất ở nội thành Tế Nam lại chuyển thành đá mác-ma; nước ngầm chảy tới đây, gặp đá mác-ma chắn đường liền tích tụ lại, càng tích càng nhiều."},{"h":"碰","p":"pèng","v":"đụng, gặp phải","k":"đgt.","x":0,"ez":"而济南市区的地下岩石变为了火成岩，地下水流到这里，碰到火成岩挡住了路，就积蓄起来，越积越多。","ev":"Còn đá dưới lòng đất ở nội thành Tế Nam lại chuyển thành đá mác-ma; nước ngầm chảy tới đây, gặp đá mác-ma chắn đường liền tích tụ lại, càng tích càng nhiều."},{"h":"挡","p":"dǎng","v":"chặn, cản","k":"đgt.","x":0,"ez":"而济南市区的地下岩石变为了火成岩，地下水流到这里，碰到火成岩挡住了路，就积蓄起来，越积越多。","ev":"Còn đá dưới lòng đất ở nội thành Tế Nam lại chuyển thành đá mác-ma; nước ngầm chảy tới đây, gặp đá mác-ma chắn đường liền tích tụ lại, càng tích càng nhiều."},{"h":"地势","p":"dìshì","v":"địa thế","k":"dt.","x":1,"ez":"济南旧城一带，地势低，有的地方甚至低过了地下水的水面，地下水就冲出地表，形成了众多的泉水。","ev":"Khu thành cũ Tế Nam có địa thế thấp, có chỗ thậm chí còn thấp hơn mực nước ngầm, thế là nước ngầm phun lên khỏi mặt đất, tạo thành vô số dòng suối."},{"h":"冲","p":"chōng","v":"xông thẳng lên","k":"đgt.","x":0,"ez":"济南旧城一带，地势低，有的地方甚至低过了地下水的水面，地下水就冲出地表，形成了众多的泉水。","ev":"Khu thành cũ Tế Nam có địa thế thấp, có chỗ thậm chí còn thấp hơn mực nước ngầm, thế là nước ngầm phun lên khỏi mặt đất, tạo thành vô số dòng suối."}]],"texts":[{"no":1,"tz":"","tv":"","lines":[{"s":"","z":"济南的泉水，历史悠久，最早的文字记载可以推到3000多年前。","p":"Jǐnán de quánshuǐ, lìshǐ yōujiǔ, zuì zǎo de wénzì jìzǎi kěyǐ tuīdào sānqiān duō nián qián.","v":"Nước suối Tế Nam có lịch sử lâu đời, những ghi chép bằng văn tự sớm nhất có thể truy về hơn 3000 năm trước.","b":0},{"s":"","z":"许多文人都对它的声音、颜色、形状、味道进行过描写，留下了许多赞美泉水的诗文。","p":"Xǔduō wénrén dōu duì tā de shēngyīn, yánsè, xíngzhuàng, wèidào jìnxíngguo miáoxiě, liúxiàle xǔduō zànměi quánshuǐ de shīwén.","v":"Nhiều văn nhân từng miêu tả âm thanh, màu sắc, hình dạng, mùi vị của nó, để lại biết bao thơ văn ca ngợi nước suối.","b":0},{"s":"","z":"而济南的老百姓住在泉边，喝着这甜美的泉水，自然对它充满感激之情，从而也产生了许多关于泉水的美丽传说。","p":"Ér Jǐnán de lǎobǎixìng zhù zài quán biān, hēzhe zhè tiánměi de quánshuǐ, zìrán duì tā chōngmǎn gǎnjī zhī qíng, cóng'ér yě chǎnshēngle xǔduō guānyú quánshuǐ de měilì chuánshuō.","v":"Còn người dân Tế Nam sống bên suối, uống dòng nước ngọt lành ấy, lẽ tự nhiên lòng chan chứa biết ơn, vì vậy cũng nảy sinh nhiều truyền thuyết đẹp về nước suối.","b":0},{"s":"","z":"相传很久以前，济南城里有个善良的青年，名叫鲍全，他学习医术，救了很多人。","p":"Xiāngchuán hěn jiǔ yǐqián, Jǐnán chéng li yǒu ge shànliáng de qīngnián, míng jiào Bào Quán, tā xuéxí yīshù, jiùle hěn duō rén.","v":"Tương truyền từ rất lâu về trước, trong thành Tế Nam có một chàng trai tốt bụng tên là Bào Toàn; anh học nghề y và đã cứu được rất nhiều người.","b":1},{"s":"","z":"一次，他在路边救了一位晕倒的老人，并把老人接回家照顾。","p":"Yí cì, tā zài lù biān jiùle yí wèi yūndǎo de lǎorén, bìng bǎ lǎorén jiēhuí jiā zhàogù.","v":"Có lần, anh cứu một ông lão ngất xỉu bên đường rồi đưa ông về nhà chăm sóc.","b":0},{"s":"","z":"这老人其实是东海龙王的哥哥。","p":"Zhè lǎorén qíshí shì Dōnghǎi Lóngwáng de gēge.","v":"Ông lão ấy thật ra là anh trai của Đông Hải Long vương.","b":0},{"s":"","z":"通过老人的介绍，鲍全从龙王那儿求到了治病救人的白玉壶。","p":"Tōngguò lǎorén de jièshào, Bào Quán cóng Lóngwáng nàr qiúdàole zhì bìng jiù rén de báiyù hú.","v":"Nhờ ông lão giới thiệu, Bào Toàn đã xin được từ chỗ Long vương chiếc bình ngọc trắng có thể chữa bệnh cứu người.","b":0},{"s":"","z":"为了不被坏人抢走，他把壶埋入地下藏了起来，于是就变成了今天有“天下第一泉”美名的趵突泉。","p":"Wèile bú bèi huàirén qiǎngzǒu, tā bǎ hú máirù dìxià cángle qǐlai, yúshì jiù biànchéngle jīntiān yǒu “Tiānxià dì-yī quán” měimíng de Bàotūquán.","v":"Để không bị kẻ xấu cướp mất, anh chôn chiếc bình xuống đất giấu đi, thế là nơi ấy trở thành suối Báo Đột ngày nay – dòng suối mang mỹ danh “Thiên hạ đệ nhất tuyền”.","b":0},{"s":"","z":"如今的济南市区内，分布着大大小小七百多个天然泉，这在国内外城市中是极为少有的。","p":"Rújīn de Jǐnán shìqū nèi, fēnbùzhe dàdà xiǎoxiǎo qībǎi duō ge tiānrán quán, zhè zài guónèiwài chéngshì zhōng shì jíwéi shǎoyǒu de.","v":"Ngày nay, trong nội thành Tế Nam có hơn bảy trăm con suối tự nhiên lớn nhỏ, điều cực kỳ hiếm có ở các thành phố trong và ngoài nước.","b":1},{"s":"","z":"有如此之多的泉，名字当然也少不了。","p":"Yǒu rúcǐ zhī duō de quán, míngzi dāngrán yě shǎobuliǎo.","v":"Đã có nhiều suối đến thế thì tên gọi đương nhiên cũng không thể thiếu.","b":0},{"s":"","z":"济南泉水的优美，还可从那独特的名字上反映出来，如：以人名命名的舜泉，以动物命名的黑虎泉，以形状命名的珍珠泉，等等。","p":"Jǐnán quánshuǐ de yōuměi, hái kě cóng nà dútè de míngzi shang fǎnyìng chūlai, rú: yǐ rénmíng mìngmíng de Shùn Quán, yǐ dòngwù mìngmíng de Hēihǔ Quán, yǐ xíngzhuàng mìngmíng de Zhēnzhū Quán, děngděng.","v":"Vẻ đẹp của suối Tế Nam còn thể hiện qua những cái tên độc đáo, chẳng hạn: suối Thuấn đặt theo tên người, suối Hắc Hổ đặt theo tên con vật, suối Trân Châu đặt theo hình dạng, v.v.","b":0},{"s":"","z":"说到这里，您也许要问，这么多、这么好的泉水是如何形成的呢？","p":"Shuōdào zhèlǐ, nín yěxǔ yào wèn, zhème duō, zhème hǎo de quánshuǐ shì rúhé xíngchéng de ne?","v":"Nói đến đây, có lẽ bạn sẽ hỏi: suối vừa nhiều vừa tốt như vậy được hình thành như thế nào?","b":1},{"s":"","z":"济南的泉水，来自于济南市以南的广大山区，这些山区的岩石是大约四亿年前形成的一层厚厚的石灰岩。","p":"Jǐnán de quánshuǐ, láizì yú Jǐnán shì yǐ nán de guǎngdà shānqū, zhèxiē shānqū de yánshí shì dàyuē sì yì nián qián xíngchéng de yì céng hòuhòu de shíhuīyán.","v":"Nước suối Tế Nam bắt nguồn từ vùng núi rộng lớn ở phía nam thành phố; đá ở vùng núi này là một lớp đá vôi dày hình thành khoảng bốn trăm triệu năm trước.","b":0},{"s":"","z":"在这种石灰岩地区，陆地表面的水很容易进入地下。","p":"Zài zhè zhǒng shíhuīyán dìqū, lùdì biǎomiàn de shuǐ hěn róngyì jìnrù dìxià.","v":"Ở vùng đá vôi như thế này, nước trên bề mặt đất liền rất dễ thấm xuống lòng đất.","b":0},{"s":"","z":"山区的石灰岩层，以大约三十度的角度，由南向北斜，因此大量的地下水向济南运动。","p":"Shānqū de shíhuīyán céng, yǐ dàyuē sānshí dù de jiǎodù, yóu nán xiàng běi xié, yīncǐ dàliàng de dìxiàshuǐ xiàng Jǐnán yùndòng.","v":"Các tầng đá vôi ở vùng núi nghiêng từ nam sang bắc với góc khoảng ba mươi độ, vì thế một lượng lớn nước ngầm dịch chuyển về phía Tế Nam.","b":0},{"s":"","z":"而济南市区的地下岩石变为了火成岩，地下水流到这里，碰到火成岩挡住了路，就积蓄起来，越积越多。","p":"Ér Jǐnán shìqū de dìxià yánshí biànwéile huǒchéngyán, dìxiàshuǐ liúdào zhèlǐ, pèngdào huǒchéngyán dǎngzhùle lù, jiù jīxù qǐlai, yuè jī yuè duō.","v":"Còn đá dưới lòng đất ở nội thành Tế Nam lại chuyển thành đá mác-ma; nước ngầm chảy tới đây, gặp đá mác-ma chắn đường liền tích tụ lại, càng tích càng nhiều.","b":0},{"s":"","z":"它无处可流，就得另找出路。","p":"Tā wú chù kě liú, jiù děi lìng zhǎo chūlù.","v":"Không còn chỗ nào để chảy, nó buộc phải tìm lối thoát khác.","b":0},{"s":"","z":"济南旧城一带，地势低，有的地方甚至低过了地下水的水面，地下水就冲出地表，形成了众多的泉水。","p":"Jǐnán jiù chéng yídài, dìshì dī, yǒude dìfang shènzhì dīguòle dìxiàshuǐ de shuǐmiàn, dìxiàshuǐ jiù chōngchū dìbiǎo, xíngchéngle zhòngduō de quánshuǐ.","v":"Khu thành cũ Tế Nam có địa thế thấp, có chỗ thậm chí còn thấp hơn mực nước ngầm, thế là nước ngầm phun lên khỏi mặt đất, tạo thành vô số dòng suối.","b":0},{"s":"","z":"这就是济南“泉城”美名得来的原因。","p":"Zhè jiù shì Jǐnán “Quánchéng” měimíng délái de yuányīn.","v":"Đó chính là lý do Tế Nam có được mỹ danh “Tuyền thành” (thành phố suối).","b":0}]}],"aud":[{"v":"audio/05-2.mp3","t":"audio/05-1.mp3"}],"gram":[{"id":"qilai","t":"起来","s":"động từ xu hướng làm bổ ngữ (V + 起来)","b":"<b>起来</b> là <b>động từ</b>, đứng sau động từ khác tạo thành <b>“động từ + 起来”</b>. Theo sách, cấu trúc này có hai nghĩa: (1) biểu thị sự vật <b>từ phân tán đến tập trung</b> (gom lại, dồn lại); (2) biểu thị <b>từ chỗ lộ ra đến chỗ khuất kín</b> (giấu đi, cất đi).","r":["Từ phân tán → tập trung: 积蓄起来, 收起来 (tích tụ lại, thu gom lại)","Từ lộ ra → ẩn giấu: 躲起来, 藏起来 (trốn đi, giấu đi)","Khi có tân ngữ, hay dùng câu 把: 把壶……藏了起来"],"e":[["……地下水流到这里，碰到火成岩挡住了路，就积蓄起来，越积越多。","……dìxiàshuǐ liúdào zhèlǐ, pèngdào huǒchéngyán dǎngzhùle lù, jiù jīxù qǐlai, yuè jī yuè duō.","…nước ngầm chảy tới đây, gặp đá mác-ma chắn đường liền tích tụ lại, càng tích càng nhiều. <i>(bài khoá)</i>"],["渔夫想，这网一收起来，鱼一定可以装满整条船。","Yúfū xiǎng, zhè wǎng yì shōu qǐlai, yú yídìng kěyǐ zhuāngmǎn zhěng tiáo chuán.","Người đánh cá nghĩ, mẻ lưới này mà kéo lên thì cá chắc chắn sẽ đầy cả thuyền."],["刘丽知道自己做得不对，躲起来不敢见我。","Liú Lì zhīdào zìjǐ zuò de bú duì, duǒ qǐlai bù gǎn jiàn wǒ.","Lưu Lệ biết mình làm sai nên trốn biệt, không dám gặp tôi."],["为了不被坏人抢走，他把壶埋入地下藏了起来，……","Wèile bú bèi huàirén qiǎngzǒu, tā bǎ hú máirù dìxià cángle qǐlai, ……","Để không bị kẻ xấu cướp mất, anh chôn chiếc bình xuống đất giấu đi… <i>(bài khoá)</i>"]],"d":[["刘丽知道自己做得不对，躲____不敢见我。","起来"],["渔夫想，这网一收____，鱼一定可以装满整条船。","起来"],["地下水碰到火成岩挡住了路，就积蓄____，越积越多。","起来"]],"w":"Hai nghĩa của V+起来 trong bài này khác với nghĩa “bắt đầu” (笑起来) hay “hướng lên” (站起来) đã học trước đó — dựa vào động từ đi kèm để phân biệt."},{"id":"yu","t":"于","s":"ở, vào, từ, đối với, hơn (giới từ)","b":"<b>于</b> là <b>giới từ</b>, theo sách tương đương với <b>在、从、对、向、比</b>. Tuỳ ngữ cảnh, 于 có thể chỉ thời gian, phạm vi, nơi chốn (xuất xứ), đối tượng hoặc so sánh. 于 mang sắc thái văn viết, thường đứng ngay sau động từ/tính từ.","r":["Thời gian (= 在): 成立于1997年","Phạm vi: 用于感冒的治疗","Nơi chốn / xuất xứ (= 从): 来自于……山区","Đối tượng (= 对/向): 有助于健康, 求助于老同学","So sánh (= 比): 高于自己"],"e":[["这家公司成立于1997年。","Zhè jiā gōngsī chénglì yú yī jiǔ jiǔ qī nián.","Công ty này được thành lập vào năm 1997. (chỉ thời gian)"],["这种药主要用于感冒的治疗。","Zhè zhǒng yào zhǔyào yòngyú gǎnmào de zhìliáo.","Loại thuốc này chủ yếu dùng để điều trị cảm cúm. (chỉ phạm vi)"],["济南的泉水，来自于济南市以南的广大山区，……","Jǐnán de quánshuǐ, láizì yú Jǐnán shì yǐ nán de guǎngdà shānqū, ……","Nước suối Tế Nam bắt nguồn từ vùng núi rộng lớn ở phía nam thành phố… (chỉ nơi chốn) <i>(bài khoá)</i>"],["运动有助于健康。","Yùndòng yǒuzhù yú jiànkāng.","Vận động có ích cho sức khoẻ. (chỉ đối tượng)"],["李明半年没找到工作了，没办法，只好求助于当经理的老同学王峰了。","Lǐ Míng bàn nián méi zhǎodào gōngzuò le, méi bànfǎ, zhǐhǎo qiúzhù yú dāng jīnglǐ de lǎo tóngxué Wáng Fēng le.","Lý Minh nửa năm rồi chưa tìm được việc, hết cách, đành nhờ cậy người bạn học cũ Vương Phong đang làm giám đốc. (chỉ đối tượng)"],["队员们都认为对方的水平远远高于自己。","Duìyuánmen dōu rènwéi duìfāng de shuǐpíng yuǎnyuǎn gāo yú zìjǐ.","Các cầu thủ đều cho rằng trình độ của đối phương cao hơn mình rất nhiều. (chỉ so sánh)"]],"d":[["刘经理毕业____北京大学经济学院。","于"],["这家公司成立____1997年。","于"],["运动有助____健康。","于"],["队员们都认为对方的水平远远高____自己。","于"]],"w":"于 là từ văn viết; trong khẩu ngữ thường thay bằng 在/从/对/比 và đặt trước động từ (在1997年成立), còn 于 thì đứng sau động từ (成立于1997年)."},{"id":"conger","t":"从而","s":"do đó, nhờ vậy mà (liên từ)","b":"<b>从而</b> là <b>liên từ</b>, dùng <b>giữa hai vế câu</b>: vế trước nêu <b>nguyên nhân, phương pháp…</b>, vế sau (bắt đầu bằng 从而) nêu <b>kết quả, mục đích…</b>.","r":["Cấu trúc: [nguyên nhân/phương pháp]，从而 + [kết quả/mục đích]","从而 đứng đầu vế sau, chủ ngữ hai vế thường là một","Có thể kết hợp với 也: ……，从而也产生了……"],"e":[["比赛前做好思想准备可以减少运动员的压力，从而取得比赛的成功。","Bǐsài qián zuòhǎo sīxiǎng zhǔnbèi kěyǐ jiǎnshǎo yùndòngyuán de yālì, cóng'ér qǔdé bǐsài de chénggōng.","Chuẩn bị tốt tâm lý trước trận đấu có thể giảm áp lực cho vận động viên, nhờ đó giành được thắng lợi."],["在学习过程中及时复习，可以尽早发现和解决问题，加深理解，从而取得更好的成绩。","Zài xuéxí guòchéng zhōng jíshí fùxí, kěyǐ jǐnzǎo fāxiàn hé jiějué wèntí, jiāshēn lǐjiě, cóng'ér qǔdé gèng hǎo de chéngjì.","Ôn tập kịp thời trong quá trình học giúp sớm phát hiện và giải quyết vấn đề, hiểu sâu hơn, từ đó đạt kết quả tốt hơn."],["而济南的老百姓住在泉边，喝着这甜美的泉水，自然对它充满感激之情，从而也产生了许多关于泉水的美丽传说。","Ér Jǐnán de lǎobǎixìng zhù zài quán biān, hēzhe zhè tiánměi de quánshuǐ, zìrán duì tā chōngmǎn gǎnjī zhī qíng, cóng'ér yě chǎnshēngle xǔduō guānyú quánshuǐ de měilì chuánshuō.","Còn người dân Tế Nam sống bên suối, uống dòng nước ngọt lành ấy, lẽ tự nhiên lòng chan chứa biết ơn, vì vậy cũng nảy sinh nhiều truyền thuyết đẹp về nước suối. <i>(bài khoá)</i>"]],"d":[["换一个角度考虑，也许正好就能发现问题的关键，____找到解决问题的答案。","从而"],["比赛前做好思想准备可以减少运动员的压力，____取得比赛的成功。","从而"],["在学习过程中及时复习，可以加深理解，____取得更好的成绩。","从而"]],"w":"从而 mang sắc thái văn viết, chỉ nối hai vế câu (không đứng đầu câu độc lập); vế trước thường là cách làm/nguyên nhân chứ không phải điều kiện giả định."},{"id":"wei","t":"为 (wéi)","s":"thành, trở thành; làm, coi là (động từ)","b":"<b>为 (wéi)</b> là <b>động từ</b>, mang nghĩa <b>“成、成为”</b> (thành, trở thành), thường đứng <b>sau động từ làm bổ ngữ</b>: 变为、改为. Ngoài ra 为 còn biểu thị nghĩa <b>“作为、算作”</b> (làm, coi là), hay gặp trong khung <b>以……为……</b> và <b>称……为……</b>.","r":["V + 为 (bổ ngữ): 变为火成岩, 变为动力, 改为下周一","以 A 为 B: lấy A làm B (以收入多少为第一标准)","称 A 为 B: gọi A là B (称其为生活)"],"e":[["而济南市区的地下岩石变为了火成岩，……","Ér Jǐnán shìqū de dìxià yánshí biànwéile huǒchéngyán, ……","Còn đá dưới lòng đất ở nội thành Tế Nam lại chuyển thành đá mác-ma… <i>(bài khoá)</i>"],["每个人都会遇到各种压力，可是，压力也可以变为动力。","Měi ge rén dōu huì yùdào gè zhǒng yālì, kěshì, yālì yě kěyǐ biànwéi dònglì.","Ai cũng sẽ gặp đủ loại áp lực, nhưng áp lực cũng có thể biến thành động lực."],["找工作时，很多人会以收入多少为第一标准，这种想法我不能接受。","Zhǎo gōngzuò shí, hěn duō rén huì yǐ shōurù duōshǎo wéi dì-yī biāozhǔn, zhè zhǒng xiǎngfǎ wǒ bù néng jiēshòu.","Khi tìm việc, nhiều người coi thu nhập cao hay thấp là tiêu chí hàng đầu; cách nghĩ này tôi không chấp nhận được."],["在他看来，没有工作的生活就不能称其为生活。","Zài tā kànlái, méiyǒu gōngzuò de shēnghuó jiù bù néng chēng qí wéi shēnghuó.","Theo anh ấy, cuộc sống không có công việc thì chẳng thể gọi là cuộc sống."]],"d":[["办公室让我通知你明天下午的活动改____下周一了。","为"],["每个人都会遇到各种压力，可是，压力也可以变____动力。","为"],["找工作时，很多人会以收入多少____第一标准。","为"]],"w":"为 ở đây đọc <b>wéi</b> (thanh 2), khác với giới từ 为 <b>wèi</b> (vì, cho) như trong 为了."},{"id":"meili_youmei","t":"美丽 vs 优美","s":"đẹp — đẹp đẽ, uyển chuyển (tính từ)","b":"Điểm giống: <b>美丽</b> và <b>优美</b> đều là <b>tính từ</b>, đều có thể dùng để tả <b>phong cảnh, môi trường</b>… Ví dụ: 济南是一座风景美丽/优美的城市。","r":["美丽: thường tả <b>dung mạo, dáng vẻ, cách ăn mặc</b> đẹp — 优美: thiên về tả <b>động tác, hình tượng</b> đem lại cảm giác đẹp","美丽: chủ yếu tả cảm nhận <b>thị giác</b> — 优美: còn tả được cảm nhận <b>phi thị giác</b> (giọng hát, ngôn ngữ…)","美丽: có <b>cách dùng tu từ</b>, mang nghĩa tốt đẹp, cao quý (美丽善良的心) — 优美: không có cách dùng này"],"e":[["济南是一座风景美丽/优美的城市。","Jǐnán shì yí zuò fēngjǐng měilì/yōuměi de chéngshì.","Tế Nam là một thành phố có phong cảnh đẹp."],["她有一双美丽的大眼睛。","Tā yǒu yì shuāng měilì de dà yǎnjing.","Cô ấy có đôi mắt to đẹp."],["演员们的动作十分优美。","Yǎnyuánmen de dòngzuò shífēn yōuměi.","Động tác của các diễn viên vô cùng uyển chuyển, đẹp mắt."],["雨后天空中出现了一道美丽的彩虹。","Yǔ hòu tiānkōng zhōng chūxiànle yí dào měilì de cǎihóng.","Sau mưa, trên bầu trời hiện lên một dải cầu vồng tuyệt đẹp."],["一进院子就听到了丽丽那优美的歌声。","Yí jìn yuànzi jiù tīngdàole Lìli nà yōuměi de gēshēng.","Vừa bước vào sân đã nghe thấy giọng hát êm ái của Lệ Lệ."],["她有一颗美丽善良的心。","Tā yǒu yì kē měilì shànliáng de xīn.","Cô ấy có một tâm hồn đẹp và nhân hậu."]],"d":[["这篇文章的语言生动____。","优美"],["心也像窗户一样，如果不打开，就看不到外面的____和热闹。","美丽"],["这里流传着许多____的传说。","美丽"],["当地____的自然风景吸引了很多中外游客。","美丽 / 优美 (đều được)"]],"w":"Tả âm thanh, ngôn ngữ, động tác → dùng 优美; tả người (gương mặt, đôi mắt) hay nghĩa bóng “tâm hồn đẹp” → dùng 美丽; tả phong cảnh → cả hai đều được."}],"ext":[["作品","zuòpǐn","tác phẩm"],["诗","shī","thơ"],["传说","chuánshuō","truyền thuyết"],["神话","shénhuà","thần thoại"],["戏剧","xìjù","kịch, hí kịch"],["风格","fēnggé","phong cách"],["形象","xíngxiàng","hình tượng"],["魅力","mèilì","sức hấp dẫn, sức quyến rũ"],["生动","shēngdòng","sinh động, sống động"]],"extt":"文学","notes":"Bài khoá 633字 (sách ghi), không có dòng chú thích nguồn ở cuối bài. Từ 18 và 23 giữ đúng dạng sách 治（疗）, （躲）藏 — câu vocab_ex chỉ chứa 治 / 藏 (bài khoá không có 治疗, 躲藏). Sách ghi pinyin tên riêng 济南 là Jǐ'nán (giữ nguyên trong batches; lines dùng Jǐnán). Bảng 扩展 sách chỉ in chữ Hán + pinyin, nghĩa Việt là bổ sung. Ví dụ (2) mục 起来 trong sách có chú thích 渔夫 (yúfū, người đánh cá) — đã bỏ phần chú thích trong ngoặc khỏi câu. Bài tập 练一练 của 起来/于/从而/为 là dạng hoàn thành câu/viết lại câu mở, nên drill lấy từ 练习1 (câu ④⑤⑥) và câu ví dụ trong sách đục lỗ. Câu (4) 做一做 美丽/优美: cả hai từ đều dùng được (theo điểm giống: đều tả phong cảnh).","order":[{"z":"这老人其实是东海龙王的哥哥。","t":["这","老人","其实","是","东海龙王","的","哥哥"],"v":"Ông lão ấy thật ra là anh trai của Đông Hải Long vương."},{"z":"有如此之多的泉，名字当然也少不了。","t":["有","如此","之多","的","泉","名字","当然","也","少不了"],"v":"Đã có nhiều suối đến thế thì tên gọi đương nhiên cũng không thể thiếu."},{"z":"它无处可流，就得另找出路。","t":["它","无处","可流","就","得","另","找出路"],"v":"Không còn chỗ nào để chảy, nó buộc phải tìm lối thoát khác."},{"z":"这就是济南“泉城”美名得来的原因。","t":["这","就是","济南","泉城","美名","得来","的","原因"],"v":"Đó chính là lý do Tế Nam có được mỹ danh “Tuyền thành” (thành phố suối)."},{"z":"渔夫想，这网一收起来，鱼一定可以装满整条船。","t":["渔夫","想","这网","一收","起来","鱼","一定","可以","装满","整条","船"],"v":"Người đánh cá nghĩ, mẻ lưới này mà kéo lên thì cá chắc chắn sẽ đầy cả thuyền."},{"z":"刘丽知道自己做得不对，躲起来不敢见我。","t":["刘丽","知道","自己","做","得","不","对","躲起来","不敢","见","我"],"v":"Lưu Lệ biết mình làm sai nên trốn biệt, không dám gặp tôi."},{"z":"这家公司成立于1997年。","t":["这家","公司","成立","于","1997","年"],"v":"Công ty này được thành lập vào năm 1997. (chỉ thời gian)"},{"z":"这种药主要用于感冒的治疗。","t":["这种","药","主要","用于","感冒","的","治疗"],"v":"Loại thuốc này chủ yếu dùng để điều trị cảm cúm. (chỉ phạm vi)"},{"z":"队员们都认为对方的水平远远高于自己。","t":["队员","们","都","认为","对方","的","水平","远远","高于","自己"],"v":"Các cầu thủ đều cho rằng trình độ của đối phương cao hơn mình rất nhiều. (chỉ so sánh)"},{"z":"在他看来，没有工作的生活就不能称其为生活。","t":["在","他","看来","没有","工作","的","生活","就","不能","称其为","生活"],"v":"Theo anh ấy, cuộc sống không có công việc thì chẳng thể gọi là cuộc sống."},{"z":"济南是一座风景美丽/优美的城市。","t":["济南","是","一座","风景","美丽","/","优美","的","城市"],"v":"Tế Nam là một thành phố có p "cô gái, thiếu nữ","k":"dt.","x":0,"ez":"它想吃一户人家的姑娘，被这家人发现了，于是他们立刻敲响了家中的锅和盆子，跟着整个镇子都响了起来。","ev":"Nó định ăn thịt cô con gái của một gia đình nhưng bị nhà ấy phát hiện, thế là họ lập tức gõ vang nồi và chậu trong nhà, theo đó cả thị trấn cũng vang lên tiếng gõ."},{"h":"锅","p":"guō","v":"(cái) nồi","k":"dt.","x":0,"ez":"它想吃一户人家的姑娘，被这家人发现了，于是他们立刻敲响了家中的锅和盆子，跟着整个镇子都响了起来。","ev":"Nó định ăn thịt cô con gái của một gia đình nhưng bị nhà ấy phát hiện, thế là họ lập tức gõ vang nồi và chậu trong nhà, theo đó cả thị trấn cũng vang lên tiếng gõ."},{"h":"盆子","p":"pén (zi)","v":"chậu, bồn","k":"dt.","x":0,"ez":"它想吃一户人家的姑娘，被这家人发现了，于是他们立刻敲响了家中的锅和盆子，跟着整个镇子都响了起来。","ev":"Nó định ăn thịt cô con gái của một gia đình nhưng bị nhà ấy phát hiện, thế là họ lập tức gõ vang nồi và chậu trong nhà, theo đó cả thị trấn cũng vang lên tiếng gõ."},{"h":"整个","p":"zhěnggè","v":"cả","k":"tt.","x":0,"ez":"它想吃一户人家的姑娘，被这家人发现了，于是他们立刻敲响了家中的锅和盆子，跟着整个镇子都响了起来。","ev":"Nó định ăn thịt cô con gái của một gia đình nhưng bị nhà ấy phát hiện, thế là họ lập tức gõ vang nồi và chậu trong nhà, theo đó cả thị trấn cũng vang lên tiếng gõ."},{"h":"吓","p":"xià","v":"làm cho khiếp sợ","k":"đgt.","x":0,"ez":"“夕”吓得什么似的，急忙往外逃。","ev":"\"Tịch\" sợ hết hồn, vội vàng chạy trốn ra ngoài."},{"h":"似的","p":"shìde","v":"(chỉ sự giống nhau) dường như, tựa như","k":"trợ.","x":0,"ez":"“夕”吓得什么似的，急忙往外逃。","ev":"\"Tịch\" sợ hết hồn, vội vàng chạy trốn ra ngoài."},{"h":"追","p":"zhuī","v":"đuổi theo","k":"đgt.","x":0,"ez":"七郎的狗追上了“夕”，并死死地咬住了它。","ev":"Con chó của Thất Lang đuổi kịp \"Tịch\" và cắn chặt lấy nó không buông."},{"h":"箭","p":"jiàn","v":"mũi tên","k":"dt.","x":1,"ez":"七郎跑上前去，一箭射死了“夕”。","ev":"Thất Lang chạy tới, chỉ một mũi tên đã bắn chết \"Tịch\"."},{"h":"射","p":"shè (jī)","v":"bắn","k":"đgt.","x":0,"ez":"七郎跑上前去，一箭射死了“夕”。","ev":"Thất Lang chạy tới, chỉ một mũi tên đã bắn chết \"Tịch\"."},{"h":"纷纷","p":"fēnfēn","v":"tới tấp, dồn dập; nhao nhao, sôi nổi","k":"tt./phó.","x":0,"ez":"除掉“夕”以后，百姓纷纷对七郎表达谢意。","ev":"Sau khi trừ được \"Tịch\", dân chúng lần lượt đến bày tỏ lòng biết ơn với Thất Lang."},{"h":"表达","p":"biǎodá","v":"bày tỏ, giãi bày","k":"đgt.","x":0,"ez":"除掉“夕”以后，百姓纷纷对七郎表达谢意。","ev":"Sau khi trừ được \"Tịch\", dân chúng lần lượt đến bày tỏ lòng biết ơn với Thất Lang."},{"h":"意义","p":"yìyì","v":"ý nghĩa, tầm quan trọng","k":"dt.","x":0,"ez":"由于这一天很有意义，于是人们就在每年的年三十这天晚上，仍然像那天一样整晚不睡觉，敲打出响声。","ev":"Vì ngày hôm đó rất có ý nghĩa, nên cứ đến tối ngày 30 Tết hằng năm, mọi người vẫn thức suốt đêm giống như hôm ấy, gõ đập tạo ra tiếng động."},{"h":"鞭炮","p":"biānpào","v":"pháo","k":"dt.","x":0,"ez":"就这样一代代传下来，形成了除夕夜守岁、放鞭炮的风俗。","ev":"Cứ thế truyền từ đời này sang đời khác, hình thành nên phong tục thức đón giao thừa và đốt pháo vào đêm trừ tịch."},{"h":"风俗","p":"fēngsú","v":"phong tục, tục lệ","k":"dt.","x":0,"ez":"就这样一代代传下来，形成了除夕夜守岁、放鞭炮的风俗。","ev":"Cứ thế truyền từ đời này sang đời khác, hình thành nên phong tục thức đón giao thừa và đốt pháo vào đêm trừ tịch."}]],"texts":[{"no":1,"tz":"","tv":"","lines":[{"s":"","z":"在中国，人们把农历十二月三十日这一年中的最后一天叫作除夕，这一天，全家人会一起吃年夜饭，守岁。","p":"Zài Zhōngguó, rénmen bǎ nónglì shí'èr yuè sānshí rì zhè yì nián zhōng de zuìhòu yì tiān jiàozuò chúxī, zhè yì tiān, quánjiā rén huì yìqǐ chī niányèfàn, shǒusuì.","v":"Ở Trung Quốc, người ta gọi ngày cuối cùng trong năm – ngày 30 tháng Chạp âm lịch – là đêm giao thừa; hôm đó cả nhà sẽ cùng ăn bữa cơm tất niên và thức đón giao thừa.","b":0},{"s":"","z":"但是，人们为什么要把年三十叫作除夕呢？","p":"Dànshì, rénmen wèi shénme yào bǎ nián sānshí jiàozuò chúxī ne?","v":"Thế nhưng, vì sao người ta lại gọi ngày 30 Tết là \"trừ tịch\"?","b":0},{"s":"","z":"传说在很久以前，有个叫作“夕”的怪物，经常出来伤害百姓，百姓对其恨之入骨，但是又十分无奈。","p":"Chuánshuō zài hěn jiǔ yǐqián, yǒu ge jiàozuò “Xī” de guàiwù, jīngcháng chūlai shānghài bǎixìng, bǎixìng duì qí hèn zhī rù gǔ, dànshì yòu shífēn wúnài.","v":"Tương truyền từ rất lâu trước đây, có một con quái vật tên là \"Tịch\" thường ra làm hại dân chúng; dân chúng căm ghét nó đến tận xương tuỷ nhưng lại hoàn toàn bất lực.","b":0},{"s":"","z":"当时有个英雄叫作七郎，他英俊高大、力大无比。","p":"Dāngshí yǒu ge yīngxióng jiàozuò Qīláng, tā yīngjùn gāodà, lì dà wúbǐ.","v":"Khi ấy có một anh hùng tên là Thất Lang, chàng khôi ngô cao lớn, sức mạnh vô song.","b":0},{"s":"","z":"七郎还有一条狗，这条狗非常勇敢，无论咬住什么都不会松口。","p":"Qīláng hái yǒu yì tiáo gǒu, zhè tiáo gǒu fēicháng yǒnggǎn, wúlùn yǎozhù shénme dōu bú huì sōng kǒu.","v":"Thất Lang còn có một con chó rất dũng cảm, hễ đã cắn được thứ gì là nhất định không nhả ra.","b":0},{"s":"","z":"一天，七郎从外边回来，看到邻居家女孩的外公坐在路边哭，于是上前询问，一问才知道，原来天真可爱的女孩被“夕”吃掉了。","p":"Yì tiān, Qīláng cóng wàibian huílai, kàndào línjū jiā nǚhái de wàigōng zuò zài lù biān kū, yúshì shàngqián xúnwèn, yí wèn cái zhīdào, yuánlái tiānzhēn kě'ài de nǚhái bèi “Xī” chīdiào le.","v":"Một hôm, Thất Lang từ ngoài về, thấy ông ngoại của cô bé nhà hàng xóm ngồi khóc bên đường, bèn đến hỏi han; hỏi ra mới biết cô bé ngây thơ đáng yêu đã bị \"Tịch\" ăn thịt.","b":1},{"s":"","z":"七郎暗暗下定决心一定要杀死“夕”，替百姓除掉这个制造灾害的东西。","p":"Qīláng àn'àn xiàdìng juéxīn yídìng yào shāsǐ “Xī”, tì bǎixìng chúdiào zhège zhìzào zāihài de dōngxi.","v":"Thất Lang thầm hạ quyết tâm nhất định phải giết chết \"Tịch\", trừ khử con vật gây tai hoạ này thay cho dân chúng.","b":0},{"s":"","z":"于是七郎带着他的狗出发了，他到处打听“夕”的消息，但是一直找不到它。","p":"Yúshì Qīláng dàizhe tā de gǒu chūfā le, tā dàochù dǎting “Xī” de xiāoxi, dànshì yìzhí zhǎo bu dào tā.","v":"Thế là Thất Lang dẫn theo con chó lên đường; chàng đi khắp nơi dò hỏi tin tức về \"Tịch\" nhưng mãi vẫn không tìm thấy nó.","b":0},{"s":"","z":"这样过了差不多一年，这天正好是大年三十，七郎来到了一个热闹的城镇。","p":"Zhèyàng guòle chàbuduō yì nián, zhè tiān zhènghǎo shì dà nián sānshí, Qīláng láidàole yí ge rènao de chéngzhèn.","v":"Cứ thế gần một năm trôi qua, hôm ấy đúng vào ngày 30 Tết, Thất Lang đến một thị trấn đông vui náo nhiệt.","b":0},{"s":"","z":"这一年来，七郎虽然没有找到“夕”，但是了解到了很多关于“夕”的情况：它一般在太阳落山后出来害人，到天亮前又会逃得连影子都找不着了；","p":"Zhè yì nián lái, Qīláng suīrán méiyǒu zhǎodào “Xī”, dànshì liǎojiě dàole hěn duō guānyú “Xī” de qíngkuàng: tā yìbān zài tàiyáng luòshān hòu chūlai hài rén, dào tiānliàng qián yòu huì táo de lián yǐngzi dōu zhǎo bu zháo le;","v":"Suốt một năm qua, tuy Thất Lang chưa tìm được \"Tịch\" nhưng đã biết được rất nhiều điều về nó: nó thường ra hại người sau khi mặt trời lặn, rồi trước lúc trời sáng lại trốn mất, đến cái bóng cũng không tìm thấy;","b":0},{"s":"","z":"此外，它还特别害怕声响。","p":"Cǐwài, tā hái tèbié hàipà shēngxiǎng.","v":"Ngoài ra, nó còn đặc biệt sợ tiếng động.","b":0},{"s":"","z":"于是七郎告诉这里的百姓，“夕”说不定晚上要出来伤害大家，让大家今晚熬夜等着，一见到“夕”就赶紧敲打东西，大家一起把“夕”杀掉。","p":"Yúshì Qīláng gàosu zhèli de bǎixìng, “Xī” shuōbudìng wǎnshang yào chūlai shānghài dàjiā, ràng dàjiā jīnwǎn áoyè děngzhe, yí jiàndào “Xī” jiù gǎnjǐn qiāodǎ dōngxi, dàjiā yìqǐ bǎ “Xī” shādiào.","v":"Thế là Thất Lang báo cho dân chúng ở đây rằng tối nay rất có thể \"Tịch\" sẽ ra làm hại mọi người, bảo mọi người đêm nay thức canh, hễ thấy \"Tịch\" là lập tức gõ đập đồ vật, mọi người cùng nhau giết chết nó.","b":0},{"s":"","z":"太阳很快落山了，到了晚上，“夕”果然出来了。","p":"Tàiyáng hěn kuài luòshān le, dàole wǎnshang, “Xī” guǒrán chūlai le.","v":"Mặt trời nhanh chóng lặn xuống, đến tối, quả nhiên \"Tịch\" xuất hiện.","b":1},{"s":"","z":"它想吃一户人家的姑娘，被这家人发现了，于是他们立刻敲响了家中的锅和盆子，跟着整个镇子都响了起来。","p":"Tā xiǎng chī yí hù rénjiā de gūniang, bèi zhè jiā rén fāxiàn le, yúshì tāmen lìkè qiāoxiǎngle jiā zhōng de guō hé pénzi, gēnzhe zhěnggè zhènzi dōu xiǎngle qǐlai.","v":"Nó định ăn thịt cô con gái của một gia đình nhưng bị nhà ấy phát hiện, thế là họ lập tức gõ vang nồi và chậu trong nhà, theo đó cả thị trấn cũng vang lên tiếng gõ.","b":0},{"s":"","z":"“夕”吓得什么似的，急忙往外逃。","p":"“Xī” xià de shénme shìde, jímáng wǎng wài táo.","v":"\"Tịch\" sợ hết hồn, vội vàng chạy trốn ra ngoài.","b":0},{"s":"","z":"七郎的狗追上了“夕”，并死死地咬住了它。","p":"Qīláng de gǒu zhuīshangle “Xī”, bìng sǐsǐ de yǎozhùle tā.","v":"Con chó của Thất Lang đuổi kịp \"Tịch\" và cắn chặt lấy nó không buông.","b":0},{"s":"","z":"七郎跑上前去，一箭射死了“夕”。","p":"Qīláng pǎo shàngqián qu, yí jiàn shèsǐle “Xī”.","v":"Thất Lang chạy tới, chỉ một mũi tên đã bắn chết \"Tịch\".","b":0},{"s":"","z":"除掉“夕”以后，百姓纷纷对七郎表达谢意。","p":"Chúdiào “Xī” yǐhòu, bǎixìng fēnfēn duì Qīláng biǎodá xièyì.","v":"Sau khi trừ được \"Tịch\", dân chúng lần lượt đến bày tỏ lòng biết ơn với Thất Lang.","b":0},{"s":"","z":"由于这一天很有意义，于是人们就在每年的年三十这天晚上，仍然像那天一样整晚不睡觉，敲打出响声。","p":"Yóuyú zhè yì tiān hěn yǒu yìyì, yúshì rénmen jiù zài měi nián de nián sānshí zhè tiān wǎnshang, réngrán xiàng nà tiān yíyàng zhěng wǎn bú shuìjiào, qiāodǎ chū xiǎngshēng.","v":"Vì ngày hôm đó rất có ý nghĩa, nên cứ đến tối ngày 30 Tết hằng năm, mọi người vẫn thức suốt đêm giống như hôm ấy, gõ đập tạo ra tiếng động.","b":0},{"s":"","z":"就这样一代代传下来，形成了除夕夜守岁、放鞭炮的风俗。","p":"Jiù zhèyàng yí dàidài chuán xiàlai, xíngchéngle chúxī yè shǒusuì, fàng biānpào de fēngsú.","v":"Cứ thế truyền từ đời này sang đời khác, hình thành nên phong tục thức đón giao thừa và đốt pháo vào đêm trừ tịch.","b":0}]}],"aud":[{"v":"audio/06-2.mp3","t":"audio/06-1.mp3"}],"gram":[{"id":"ti","t":"替","s":"thay, thay cho (động từ); cho, vì (giới từ)","b":"<b>替</b> trước hết là <b>động từ</b>, nghĩa là \"thay thế\" (= 代替): làm thay phần việc của người khác. Ngoài ra <b>替</b> còn làm <b>giới từ</b>, mang nghĩa \"cho, vì\" (= 给、为): <b>替 + người + động từ/tính từ</b>, chỉ đối tượng được hưởng lợi hoặc đối tượng mà mình bày tỏ cảm xúc thay.","r":["Động từ \"thay thế\": 你能替替他吗？ (có thể lặp lại 替替 cho nhẹ giọng)","Giới từ \"cho/vì\" + hành động: 替百姓除掉…… (làm việc gì vì/thay cho ai)","Giới từ + cảm xúc: 替 + người + 高兴/着急/担心 (vui/lo thay cho ai)"],"e":[["见了外公，你替我向他问好。","Jiànle wàigōng, nǐ tì wǒ xiàng tā wènhǎo.","Gặp ông ngoại thì cháu chào ông giúp bà (thay bà) nhé."],["刘老师今天有点儿事来不了，你能替替他吗？","Liú lǎoshī jīntiān yǒudiǎnr shì lái bu liǎo, nǐ néng tìti tā ma?","Hôm nay thầy Lưu có chút việc không đến được, bạn có thể dạy thay thầy một chút không?"],["七郎暗暗下定决心一定要杀死“夕”，替百姓除掉这个制造灾害的东西。","Qīláng àn'àn xiàdìng juéxīn yídìng yào shāsǐ “Xī”, tì bǎixìng chúdiào zhège zhìzào zāihài de dōngxi.","Thất Lang thầm hạ quyết tâm nhất định phải giết chết \"Tịch\", trừ khử con vật gây tai hoạ này thay cho dân chúng. <i>(bài khoá)</i>"],["李阳要去留学了，我们都替他高兴。","Lǐ Yáng yào qù liúxué le, wǒmen dōu tì tā gāoxìng.","Lý Dương sắp đi du học, chúng tôi ai cũng mừng cho cậu ấy."]],"d":[["见了外公，你____我向他问好。","替"],["李阳要去留学了，我们都____他高兴。","替"],["路上的人____他着急，拉住他的马，阻止他说：“方向错了。”","替"]],"w":"Khi là giới từ, 替 gần nghĩa với 给/为; nhưng 替 hay mang sắc thái \"đứng về phía/thay mặt\" người đó (替他高兴 = mừng cho anh ấy)."},{"id":"shuobuding","t":"说不定","s":"chưa nói chắc được (động từ); có lẽ, biết đâu (phó từ)","b":"<b>说不定</b> là <b>động từ</b>, nghĩa là \"không thể nói rõ ràng, chắc chắn được\", thường làm vị ngữ cuối câu. Nó cũng có thể làm <b>phó từ</b>, biểu thị sự <b>phỏng đoán, khả năng xảy ra rất lớn</b> (\"có lẽ, biết đâu\"), đứng trước động từ hoặc đầu phân câu.","r":["Động từ, làm vị ngữ: ……时间还说不定 / 还真说不定呢","Phó từ, đứng trước vị ngữ: 这会儿说不定还在睡觉呢","Phó từ, đầu phân câu: ……，说不定下次就成功了"],"e":[["这事儿经理已经同意了，只是出发的时间还说不定。","Zhè shìr jīnglǐ yǐjīng tóngyì le, zhǐshì chūfā de shíjiān hái shuōbudìng.","Việc này giám đốc đã đồng ý rồi, chỉ là thời gian khởi hành thì vẫn chưa nói chắc được."],["咱俩到底谁赢谁输还真说不定呢。","Zán liǎ dàodǐ shéi yíng shéi shū hái zhēn shuōbudìng ne.","Rốt cuộc hai đứa mình ai thắng ai thua thật sự còn chưa biết được đâu."],["周末他起得晚，这会儿说不定还在睡觉呢。","Zhōumò tā qǐ de wǎn, zhè huìr shuōbudìng hái zài shuìjiào ne.","Cuối tuần anh ấy dậy muộn, giờ này có khi vẫn còn đang ngủ đấy."],["别随随便便就说放弃，说不定下次就成功了。","Bié suísuíbiànbiàn jiù shuō fàngqì, shuōbudìng xià cì jiù chénggōng le.","Đừng dễ dàng nói bỏ cuộc, biết đâu lần sau sẽ thành công."],["于是七郎告诉这里的百姓，“夕”说不定晚上要出来伤害大家，让大家今晚熬夜等着，一见到“夕”就赶紧敲打东西，大家一起把“夕”杀掉。","Yúshì Qīláng gàosu zhèli de bǎixìng, “Xī” shuōbudìng wǎnshang yào chūlai shānghài dàjiā, ràng dàjiā jīnwǎn áoyè děngzhe, yí jiàndào “Xī” jiù gǎnjǐn qiāodǎ dōngxi, dàjiā yìqǐ bǎ “Xī” shādiào.","Thế là Thất Lang báo cho dân chúng ở đây rằng tối nay rất có thể \"Tịch\" sẽ ra làm hại mọi người, bảo mọi người đêm nay thức canh, hễ thấy \"Tịch\" là lập tức gõ đập đồ vật, mọi người cùng nhau giết chết nó. <i>(bài khoá)</i>"]],"d":[["周末他起得晚，这会儿____还在睡觉呢。","说不定"],["别随随便便就说放弃，____下次就成功了。","说不定"],["咱俩到底谁赢谁输还真____呢。","说不定"]],"w":"Phân biệt theo vị trí: cuối câu (还说不定) = \"chưa chắc, chưa định được\"; trước động từ (说不定还在……) = \"có lẽ, rất có thể\"."},{"id":"shide","t":"似的","s":"giống như, tựa như (trợ từ)","b":"<b>似的</b> là <b>trợ từ</b>, dùng trong cấu trúc <b>像/跟/好像……似的</b> để biểu thị sự giống với một sự vật, tình huống nào đó; thường dùng trong <b>văn viết</b>. Trong cấu trúc <b>……得 + 什么似的</b>, cụm \"什么似的\" thay cho trạng thái muốn diễn tả, mang <b>ngữ khí cường điệu</b> (\"… không gì tả nổi\").","r":["(像/跟/好像) + danh từ/cụm từ + 似的: 雪片似的, 好像做梦似的","Động từ/tính từ + 得 + 什么似的 (cường điệu mức độ): 累得什么似的, 吓得什么似的","Kết hợp hay gặp: 吓/急/恨/羡慕/后悔/吵 + 得 + 什么似的"],"e":[["消息一出来，询问情况的电话雪片似的纷纷打来。","Xiāoxi yì chūlai, xúnwèn qíngkuàng de diànhuà xuěpiàn shìde fēnfēn dǎlai.","Tin vừa đưa ra, điện thoại hỏi han tình hình gọi đến tới tấp như tuyết rơi."],["我不敢相信这是真的，好像做梦似的。","Wǒ bù gǎn xiāngxìn zhè shì zhēn de, hǎoxiàng zuò mèng shìde.","Tôi không dám tin đây là thật, cứ như đang nằm mơ vậy."],["刘方背着重重的电脑包挤地铁，下班回到家累得什么似的。","Liú Fāng bēizhe zhòngzhòng de diànnǎo bāo jǐ dìtiě, xiàbān huídào jiā lèi de shénme shìde.","Lưu Phương đeo chiếc cặp laptop nặng trịch chen chúc trên tàu điện ngầm, tan làm về đến nhà thì mệt rã rời."],["“夕”吓得什么似的，急忙往外逃。","“Xī” xià de shénme shìde, jímáng wǎng wài táo.","\"Tịch\" sợ hết hồn, vội vàng chạy trốn ra ngoài. <i>(bài khoá)</i>"]],"d":[["我不敢相信这是真的，好像做梦____。","似的"],["“夕”吓得什么____，急忙往外逃。","似的"],["消息一出来，询问情况的电话雪片____纷纷打来。","似的"]],"w":"似的 đọc là shìde (không đọc sì). 似的 luôn đứng SAU thành phần được so sánh, khác với 似乎 (phó từ, đứng trước động từ)."},{"id":"fenfen","t":"纷纷","s":"tới tấp, nhao nhao (tính từ); lần lượt, dồn dập (phó từ)","b":"<b>纷纷</b> là <b>tính từ</b>: trong cấu trúc <b>động từ/tính từ + 纷纷</b>, nó miêu tả (lời bàn tán, vật rơi xuống) <b>nhiều và hỗn loạn</b>. <b>纷纷</b> còn làm <b>phó từ</b>, theo sau là động từ, biểu thị (nhiều người hoặc sự vật) <b>nối tiếp nhau, lần lượt</b> làm gì.","r":["Tính từ, đứng sau: 落叶纷纷 / 议论纷纷","Phó từ, đứng trước động từ: 纷纷 + V (百姓纷纷对七郎表达谢意)","Chủ ngữ phải là số nhiều (nhiều người/nhiều vật)"],"e":[["秋风刮起，落叶纷纷。","Qiūfēng guāqǐ, luòyè fēnfēn.","Gió thu nổi lên, lá rụng lả tả."],["他救起了妻子，孩子却被大水冲走了。事后，人们议论纷纷。","Tā jiùqǐle qīzi, háizi què bèi dàshuǐ chōngzǒu le. Shìhòu, rénmen yìlùn fēnfēn.","Anh ấy cứu được vợ, nhưng con thì bị nước lũ cuốn đi. Sau chuyện đó, mọi người bàn tán xôn xao."],["除掉“夕”以后，百姓纷纷对七郎表达谢意。","Chúdiào “Xī” yǐhòu, bǎixìng fēnfēn duì Qīláng biǎodá xièyì.","Sau khi trừ được \"Tịch\", dân chúng lần lượt đến bày tỏ lòng biết ơn với Thất Lang. <i>(bài khoá)</i>"],["要下雨了，路上的人纷纷往家里跑。","Yào xià yǔ le, lù shang de rén fēnfēn wǎng jiā li pǎo.","Trời sắp mưa, người đi đường lần lượt chạy về nhà."]],"d":[["秋风刮起，落叶____。","纷纷"],["要下雨了，路上的人____往家里跑。","纷纷"],["除掉“夕”以后，百姓____对七郎表达谢意。","纷纷"]],"w":"纷纷 (phó từ) nhấn mạnh nhiều chủ thể nối tiếp nhau; không dùng cho một người: ✗ 他纷纷离开了 → ✓ 大家纷纷离开了."},{"id":"dating_xunwen","t":"打听 vs 询问","s":"dò hỏi / hỏi thăm (phân biệt)","b":"<b>Điểm giống:</b> cả <b>打听</b> và <b>询问</b> đều là <b>động từ</b>, đều có nghĩa \"hỏi\". Ví dụ: 他打听/询问了老人的身体和生活情况。","r":["打听 thường dùng trong khẩu ngữ; 询问 thường dùng trong văn viết.","打听 thường dùng để tìm kiếm, tìm hiểu thông tin liên quan, phía sau có thể có bổ ngữ kết quả 到 (打听到); 询问 thường không mang bổ ngữ kết quả 到, ngoài ra còn có nghĩa \"trưng cầu ý kiến\".","询问 có thể mang tân ngữ là đối tượng của hành động (询问邻居), còn có thể dùng như danh từ (病人的询问); 打听 không có cách dùng này."],"e":[["他打听/询问了老人的身体和生活情况。","Tā dǎting/xúnwèn le lǎorén de shēntǐ hé shēnghuó qíngkuàng.","Anh ấy hỏi thăm tình hình sức khoẻ và cuộc sống của cụ già."],["我跟您打听一下，附近有邮局吗？","Wǒ gēn nín dǎting yíxià, fùjìn yǒu yóujú ma?","Cho tôi hỏi thăm một chút, gần đây có bưu điện không ạ?"],["他仔细地询问了公司近年来的发展情况。","Tā zǐxì de xúnwènle gōngsī jìn nián lái de fāzhǎn qíngkuàng.","Anh ấy hỏi kỹ về tình hình phát triển của công ty trong những năm gần đây."],["我到处打听也没打听到这家公司。","Wǒ dàochù dǎting yě méi dǎting dào zhè jiā gōngsī.","Tôi dò hỏi khắp nơi mà vẫn không hỏi ra được công ty này."],["他打电话询问刘教授对论文的意见。","Tā dǎ diànhuà xúnwèn Liú jiàoshòu duì lùnwén de yìjiàn.","Anh ấy gọi điện hỏi ý kiến của giáo sư Lưu về luận văn."],["警察询问了当天见过他的邻居。","Jǐngchá xúnwènle dàngtiān jiànguo tā de línjū.","Cảnh sát đã hỏi những người hàng xóm từng gặp anh ta hôm đó."],["他详细地回答了病人的询问。","Tā xiángxì de huídále bìngrén de xúnwèn.","Anh ấy trả lời cặn kẽ những câu hỏi của bệnh nhân."]],"d":[["打扰一下，向您____件事。你知道王老板有什么兴趣爱好吗？","打听"],["她____到北京有位医生能治这个病，就带着孩子来了。","打听"],["我____了一下，附近像这样的房子，差不多都得一百万。","打听"],["我____了几个修过机器的顾客，他们对小刘的服务都很满意。","询问"]],"w":"Mẹo: có 到 phía sau (打听到) hoặc nói chuyện thân mật → 打听; hỏi trực tiếp một người cụ thể, hỏi ý kiến, văn phong trang trọng hoặc dùng như danh từ → 询问."}],"ext":[["名胜古迹","míngshèng gǔjì","danh lam thắng cảnh, di tích cổ"],["风景","fēngjǐng","phong cảnh"],["展览","zhǎnlǎn","triển lãm"],["合影","hé yǐng","chụp ảnh chung"],["预订","yùdìng","đặt trước"],["结账","jiézhàng","thanh toán"],["团","tuán","đoàn"],["时差","shíchā","chênh lệch múi giờ"],["国庆节","Guóqìngjié","Quốc khánh"],["元旦","Yuándàn","Tết Dương lịch"],["除夕","Chúxī","đêm giao thừa"]],"extt":"旅游 / 节日","notes":"Bài khoá 671 chữ, không có dòng chú thích nguồn ở cuối. Sách in từ 8 là 骨（头）gǔ (tou), từ 17 là （代）替 (dài) tì, từ 30 là 盆（子）pén (zi), từ 36 là 射（击）shè (jī); trong JSON ghi han = 骨 / 替 / 盆子 / 射 để khớp với chữ trong bài khoá (恨之入骨, 替百姓, 盆子, 射死), pinyin giữ nguyên cách in của sách. Từ có dấu * (ngoài đề cương): 2 由来, 3 农历, 5 怪物, 35 箭. Từ 由来 chỉ xuất hiện trong tên bài nên vocab_ex dùng tên bài. Câu dài ở đoạn 4 (……了解到了很多关于“夕”的情况：……找不着了；此外……) được cắt tại dấu ；. Ví dụ (2) của 纷纷 trong sách có chú thích 议论 (yìlùn, bàn tán, bàn bạc), đã lược phần chú thích khỏi câu ví dụ. Bảng 扩展 (旅游, 节日) trong sách chỉ có chữ Hán + pinyin, nghĩa tiếng Việt do người soạn bổ sung. Drill của 替 câu 3 lấy từ 练习 3 (给括号里的词选择适当的位置); drill 打听/询问 lấy từ 做一做 (câu 1 sách đã cho đáp án 打听). Các drill khác (说不定, 似的, 纷纷) tự đặt dựa trên ví dụ của sách vì 练一练 là bài hoàn thành câu mở.","order":[{"z":"但是，人们为什么要把年三十叫作除夕呢？","t":["但是","人们","为什么","要","把","年三十","叫作","除夕","呢"],"v":"Thế nhưng, vì sao người ta lại gọi ngày 30 Tết là \"trừ tịch\"?"},{"z":"当时有个英雄叫作七郎，他英俊高大、力大无比。","t":["当时","有个","英雄","叫作","七郎","他","英俊","高大","力大无比"],"v":"Khi ấy có một anh hùng tên là Thất Lang, chàng khôi ngô cao lớn, sức mạnh vô song."},{"z":"此外，它还特别害怕声响。","t":["此外","它","还","特别","害怕","声响"],"v":"Ngoài ra, nó còn đặc biệt sợ tiếng động."},{"z":"太阳很快落山了，到了晚上，“夕”果然出来了。","t":["太阳","很快","落山","了","到","了","晚上","夕","果然","出来","了"],"v":"Mặt trời nhanh chóng lặn xuống, đến tối, quả nhiên \"Tịch\" xuất hiện."},{"z":"夕”吓得什么似的，急忙往外逃。","t":["夕","吓","得","什么","似的","急忙","往","外逃"],"v":"\"Tịch\" sợ hết hồn, vội vàng chạy trốn ra ngoài."},{"z":"七郎的狗追上了“夕”，并死死地咬住了它。","t":["七郎","的","狗","追上","了","夕","并","死死地","咬住","了","它"],"v":"Con chó của Thất Lang đuổi kịp \"Tịch\" và cắn chặt lấy nó không buông."},{"z":"七郎跑上前去，一箭射死了“夕”。","t":["七郎","跑","上","前去","一箭","射死","了","夕"],"v":"Thất Lang chạy tới, chỉ một mũi tên đã bắn chết \"Tịch\"."},{"z":"除掉“夕”以后，百姓纷纷对七郎表达谢意。","t":["除掉","夕","以后","百姓","纷纷","对七郎","表达","谢意"],"v":"Sau khi trừ được \"Tịch\", dân chúng lần lượt đến bày tỏ lòng biết ơn với Thất Lang."},{"z":"就这样一代代传下来，形成了除夕夜守岁、放鞭炮的风俗。","t":["就","这样","一代代","传下来","形成","了","除夕夜","守岁","放鞭炮","的","风俗"],"v":"Cứ thế truyền từ đời này sang đời khác, hình thành nên phong tục thức đón giao thừa và đốt pháo vào đêm trừ tịch."},{"z":"见了外公，你替我向他问好。","t":["见","了","外公","你","替","我","向","他","问好"],"v":"Gặp ông ngoại thì cháu chào ông giúp bà (thay bà) nhé."},{"z":"刘老师今天有点儿事来不了，你能替替他吗？","t":["刘老师","今天","有点儿","事来","不了","你","能","替","替","他","吗"],"v":"Hôm nay thầy Lưu có chút việc không đến được, bạn có thể dạy thay thầy một chút không?"},{"z":"李阳要去留学了，我们都替他高兴。","t":["李阳要","去","留学","了","我们","都","替","他","高兴"],"v":"Lý Dương sắp đi du học, chúng tôi ai cũng mừng cho cậu ấy."},{"z":"咱俩到底谁赢谁输还真说 ,"v":"phản ứng; sự phản ứng","k":"đgt./dt.","x":0,"ez":"过了一会儿，老虎没什么反应，士兵们小心地走上前去，想确定它是不是死了。","ev":"Một lúc sau, con hổ không có phản ứng gì, binh lính rón rén tiến lại gần, muốn xem chắc nó đã chết hay chưa."},{"h":"确定","p":"quèdìng","v":"xác định, khẳng định","k":"đgt.","x":0,"ez":"过了一会儿，老虎没什么反应，士兵们小心地走上前去，想确定它是不是死了。","ev":"Một lúc sau, con hổ không có phản ứng gì, binh lính rón rén tiến lại gần, muốn xem chắc nó đã chết hay chưa."},{"h":"石头","p":"shítou","v":"đá","k":"dt.","x":0,"ez":"没想到仔细一看，被射中的竟不是老虎，而是一块形状很像老虎的大石头，而且一整支箭几乎全都射到石头中去了！","ev":"Không ngờ nhìn kỹ lại, thứ bị bắn trúng hoá ra không phải con hổ mà là một tảng đá lớn có hình dáng rất giống con hổ, hơn nữa gần như cả mũi tên đã cắm ngập vào trong đá!"},{"h":"连续","p":"liánxù","v":"liên tục, liên tiếp","k":"đgt.","x":0,"ez":"可是，这次他连续换了几根箭，都没能再射进去，有的箭头碎了，有的箭杆断了，而大石头一点儿变化也没有。","ev":"Thế nhưng lần này ông liên tiếp thay mấy mũi tên mà không mũi nào bắn xuyên vào được nữa, có mũi vỡ đầu tên, có mũi gãy thân tên, còn tảng đá thì chẳng suy suyển chút nào."},{"h":"根","p":"gēn","v":"rễ cây, chân; (lượng từ được dùng cho vật dài và mảnh) chiếc, cái","k":"dt./lượng.","x":0,"ez":"可是，这次他连续换了几根箭，都没能再射进去，有的箭头碎了，有的箭杆断了，而大石头一点儿变化也没有。","ev":"Thế nhưng lần này ông liên tiếp thay mấy mũi tên mà không mũi nào bắn xuyên vào được nữa, có mũi vỡ đầu tên, có mũi gãy thân tên, còn tảng đá thì chẳng suy suyển chút nào."},{"h":"碎","p":"suì","v":"vỡ; vụn vặt","k":"đgt./tt.","x":0,"ez":"可是，这次他连续换了几根箭，都没能再射进去，有的箭头碎了，有的箭杆断了，而大石头一点儿变化也没有。","ev":"Thế nhưng lần này ông liên tiếp thay mấy mũi tên mà không mũi nào bắn xuyên vào được nữa, có mũi vỡ đầu tên, có mũi gãy thân tên, còn tảng đá thì chẳng suy suyển chút nào."},{"h":"杆","p":"gǎn","v":"cán, báng","k":"dt.","x":1,"ez":"可是，这次他连续换了几根箭，都没能再射进去，有的箭头碎了，有的箭杆断了，而大石头一点儿变化也没有。","ev":"Thế nhưng lần này ông liên tiếp thay mấy mũi tên mà không mũi nào bắn xuyên vào được nữa, có mũi vỡ đầu tên, có mũi gãy thân tên, còn tảng đá thì chẳng suy suyển chút nào."},{"h":"哎","p":"āi","v":"(được dùng để diễn tả sự ngạc nhiên hoặc sự không hài lòng) ái chà, trời ơi","k":"ct.","x":0,"ez":"“哎，怎么会这样？”士兵奇怪地你看我，我看你。","ev":"“Ơ kìa, sao lại thế này?” Binh lính ngơ ngác nhìn nhau."},{"h":"唉","p":"ài","v":"(được dùng để diễn tả sự thương cảm hoặc hối tiếc) ôi, than ôi, chao ôi","k":"ct.","x":0,"ez":"“唉！大概是我不够用心了吧！”李广也无奈地说。","ev":"“Haizz! Chắc là ta chưa đủ dốc lòng rồi!” Lý Quảng cũng đành bất lực nói."},{"h":"金属","p":"jīnshǔ","v":"kim loại","k":"dt.","x":0,"ez":"扬雄回答说：“如果诚心实意，即使像金属和石头那样硬的东西也会被打动。”","ev":"Dương Hùng đáp: “Nếu thật lòng thật dạ thì ngay cả những thứ cứng như kim loại và đá cũng sẽ bị lay động.”"},{"h":"硬","p":"yìng","v":"cứng, rắn","k":"tt.","x":0,"ez":"扬雄回答说：“如果诚心实意，即使像金属和石头那样硬的东西也会被打动。”","ev":"Dương Hùng đáp: “Nếu thật lòng thật dạ thì ngay cả những thứ cứng như kim loại và đá cũng sẽ bị lay động.”"},{"h":"便","p":"biàn","v":"(được dùng để chỉ việc gì xảy ra một cách tự nhiên trong điều kiện hoặc tình huống nào đó) thì, liền, bèn, là","k":"phó.","x":0,"ez":"“精诚所至，金石为开”这一成语也便由此流传下来。","ev":"Thành ngữ “Tinh thành sở chí, kim thạch vi khai” cũng từ đó mà lưu truyền đến nay."},{"h":"扬雄","p":"Yáng Xióng","v":"Dương Hùng (53 TCN – 18 CN)","k":"tên riêng","x":0,"ez":"人们对这件事情感到很不解，就去问当时最有影响力的学者扬雄。","ev":"Mọi người thấy chuyện này thật khó hiểu, bèn đi hỏi Dương Hùng, học giả có tiếng nói nhất thời bấy giờ."}]],"texts":[{"no":1,"tz":"盲人摸象","tv":"Thầy bói xem voi (Người mù sờ voi)","lines":[{"s":"","z":"很久以前，有一个很有智慧的国王。","p":"Hěn jiǔ yǐqián, yǒu yí ge hěn yǒu zhìhuì de guówáng.","v":"Ngày xửa ngày xưa, có một vị vua rất sáng suốt.","b":0},{"s":"","z":"一天，他让士兵们去找一头大象和一些出生时眼睛就瞎了的人回来。","p":"Yì tiān, tā ràng shìbīngmen qù zhǎo yì tóu dàxiàng hé yìxiē chūshēng shí yǎnjing jiù xiā le de rén huílai.","v":"Một hôm, ông sai binh lính đi tìm về một con voi và mấy người bị mù từ lúc mới sinh.","b":0},{"s":"","z":"士兵们分别去不同地方寻找，把找到的大象和盲人带到他面前。","p":"Shìbīngmen fēnbié qù bù tóng dìfang xúnzhǎo, bǎ zhǎodào de dàxiàng hé mángrén dàidào tā miànqián.","v":"Binh lính chia nhau đi tìm ở nhiều nơi, rồi đưa voi và những người mù tìm được đến trước mặt nhà vua.","b":0},{"s":"","z":"国王叫盲人们去摸一摸大象，问他们：“你们觉得大象是什么样的呢？”","p":"Guówáng jiào mángrénmen qù mō yi mō dàxiàng, wèn tāmen: “Nǐmen juéde dàxiàng shì shénmeyàng de ne?”","v":"Nhà vua bảo những người mù đến sờ thử con voi, rồi hỏi họ: “Các ngươi thấy con voi trông như thế nào?”","b":0},{"s":"","z":"摸到牙齿的盲人说：“我觉得像一个角。”","p":"Mōdào yáchǐ de mángrén shuō: “Wǒ juéde xiàng yí ge jiǎo.”","v":"Người mù sờ phải cái ngà nói: “Tôi thấy nó giống một cái sừng.”","b":0},{"s":"","z":"“胡说！”摸到尾巴的盲人说，“它像一条绳子。”","p":"“Húshuō!” mōdào wěiba de mángrén shuō, “tā xiàng yì tiáo shéngzi.”","v":"“Nói bậy!” Người mù sờ phải cái đuôi nói, “Nó giống một sợi dây thừng.”","b":0},{"s":"","z":"摸到大象身子的盲人说：“我觉得像一面又高又平的墙。”","p":"Mōdào dàxiàng shēnzi de mángrén shuō: “Wǒ juéde xiàng yí miàn yòu gāo yòu píng de qiáng.”","v":"Người mù sờ phải thân voi nói: “Tôi thấy nó giống một bức tường vừa cao vừa phẳng.”","b":0},{"s":"","z":"“不，你们都错了，应该是像一把扇子。”","p":"“Bù, nǐmen dōu cuò le, yīnggāi shì xiàng yì bǎ shànzi.”","v":"“Không, các anh đều sai cả rồi, nó phải giống một cái quạt mới đúng.”","b":0},{"s":"","z":"这个盲人摸到了大象的耳朵。","p":"Zhège mángrén mōdàole dàxiàng de ěrduo.","v":"Người mù này đã sờ phải tai voi.","b":0},{"s":"","z":"国王笑了起来：“你们每个人都只摸到了一点，就认为自己了解全部了吗？","p":"Guówáng xiàole qilai: “Nǐmen měi ge rén dōu zhǐ mōdàole yìdiǎn, jiù rènwéi zìjǐ liǎojiě quánbù le ma?","v":"Nhà vua bật cười: “Mỗi người các ngươi chỉ sờ được một chút mà đã cho rằng mình hiểu hết toàn bộ rồi sao?","b":0},{"s":"","z":"只有片面的认识是不能下结论的。”","p":"Zhǐyǒu piànmiàn de rènshi shì bù néng xià jiélùn de.”","v":"Chỉ có hiểu biết phiến diện thì không thể đưa ra kết luận được.”","b":0}]},{"no":2,"tz":"精诚所至，金石为开","tv":"Lòng thành cảm động đất trời, đá vàng cũng phải vỡ","lines":[{"s":"","z":"西汉时期有一位著名的将军叫李广，他善于骑马射箭，作战勇敢，被称为“飞将军”。","p":"Xīhàn shíqī yǒu yí wèi zhùmíng de jiāngjūn jiào Lǐ Guǎng, tā shànyú qí mǎ shè jiàn, zuòzhàn yǒnggǎn, bèi chēngwéi “Fēi Jiāngjūn”.","v":"Thời Tây Hán có một vị tướng nổi tiếng tên là Lý Quảng, ông giỏi cưỡi ngựa bắn cung, đánh trận dũng cảm, được người đời gọi là “Phi tướng quân”.","b":0},{"s":"","z":"一天傍晚，他正带着士兵们在山中打猎，忽然发现远处蹲着一只大老虎。","p":"Yì tiān bàngwǎn, tā zhèng dàizhe shìbīngmen zài shān zhōng dǎ liè, hūrán fāxiàn yuǎnchù dūnzhe yì zhī dà lǎohǔ.","v":"Một buổi chiều tối, ông đang dẫn binh lính đi săn trong núi thì bỗng thấy đằng xa có một con hổ lớn đang ngồi phục.","b":0},{"s":"","z":"士兵们都紧张地围了上来，想要保护他。","p":"Shìbīngmen dōu jǐnzhāng de wéile shanglai, xiǎng yào bǎohù tā.","v":"Binh lính đều căng thẳng vây quanh, muốn bảo vệ ông.","b":0},{"s":"","z":"李广摇摇头，表示不要紧。","p":"Lǐ Guǎng yáoyao tóu, biǎoshì bú yàojǐn.","v":"Lý Quảng lắc đầu, ý bảo không sao cả.","b":0},{"s":"","z":"只见他从箭袋里取出一支箭，摆好姿势，全神贯注，用尽全力向老虎射去。","p":"Zhǐ jiàn tā cóng jiàndài li qǔchū yì zhī jiàn, bǎihǎo zīshì, quánshén guànzhù, yòngjìn quánlì xiàng lǎohǔ shè qu.","v":"Chỉ thấy ông rút từ ống tên ra một mũi tên, đứng vào tư thế, dồn hết tinh thần, dùng hết sức bình sinh bắn về phía con hổ.","b":0},{"s":"","z":"过了一会儿，老虎没什么反应，士兵们小心地走上前去，想确定它是不是死了。","p":"Guòle yíhuìr, lǎohǔ méi shénme fǎnyìng, shìbīngmen xiǎoxīn de zǒu shàng qián qu, xiǎng quèdìng tā shì bu shì sǐ le.","v":"Một lúc sau, con hổ không có phản ứng gì, binh lính rón rén tiến lại gần, muốn xem chắc nó đã chết hay chưa.","b":1},{"s":"","z":"没想到仔细一看，被射中的竟不是老虎，而是一块形状很像老虎的大石头，而且一整支箭几乎全都射到石头中去了！","p":"Méi xiǎngdào zǐxì yí kàn, bèi shèzhòng de jìng bú shì lǎohǔ, ér shì yí kuài xíngzhuàng hěn xiàng lǎohǔ de dà shítou, érqiě yì zhěng zhī jiàn jīhū quán dōu shèdào shítou zhōng qu le!","v":"Không ngờ nhìn kỹ lại, thứ bị bắn trúng hoá ra không phải con hổ mà là một tảng đá lớn có hình dáng rất giống con hổ, hơn nữa gần như cả mũi tên đã cắm ngập vào trong đá!","b":0},{"s":"","z":"大家都很吃惊，连李广自己都不相信他能有这么大的力气，于是他想再试试。","p":"Dàjiā dōu hěn chījīng, lián Lǐ Guǎng zìjǐ dōu bù xiāngxìn tā néng yǒu zhème dà de lìqi, yúshì tā xiǎng zài shìshi.","v":"Ai nấy đều kinh ngạc, đến chính Lý Quảng cũng không tin mình lại có sức mạnh lớn như vậy, thế là ông muốn thử lại lần nữa.","b":0},{"s":"","z":"可是，这次他连续换了几根箭，都没能再射进去，有的箭头碎了，有的箭杆断了，而大石头一点儿变化也没有。","p":"Kěshì, zhè cì tā liánxù huànle jǐ gēn jiàn, dōu méi néng zài shè jinqu, yǒude jiàntóu suì le, yǒude jiàngǎn duàn le, ér dà shítou yìdiǎnr biànhuà yě méiyǒu.","v":"Thế nhưng lần này ông liên tiếp thay mấy mũi tên mà không mũi nào bắn xuyên vào được nữa, có mũi vỡ đầu tên, có mũi gãy thân tên, còn tảng đá thì chẳng suy suyển chút nào.","b":0},{"s":"","z":"“哎，怎么会这样？”士兵奇怪地你看我，我看你。","p":"“Āi, zěnme huì zhèyàng?” Shìbīng qíguài de nǐ kàn wǒ, wǒ kàn nǐ.","v":"“Ơ kìa, sao lại thế này?” Binh lính ngơ ngác nhìn nhau.","b":0},{"s":"","z":"“唉！大概是我不够用心了吧！”李广也无奈地说。","p":"“Ài! Dàgài shì wǒ bú gòu yòngxīn le ba!” Lǐ Guǎng yě wúnài de shuō.","v":"“Haizz! Chắc là ta chưa đủ dốc lòng rồi!” Lý Quảng cũng đành bất lực nói.","b":0},{"s":"","z":"人们对这件事情感到很不解，就去问当时最有影响力的学者扬雄。","p":"Rénmen duì zhè jiàn shìqing gǎndào hěn bùjiě, jiù qù wèn dāngshí zuì yǒu yǐngxiǎnglì de xuézhě Yáng Xióng.","v":"Mọi người thấy chuyện này thật khó hiểu, bèn đi hỏi Dương Hùng, học giả có tiếng nói nhất thời bấy giờ.","b":0},{"s":"","z":"扬雄回答说：“如果诚心实意，即使像金属和石头那样硬的东西也会被打动。”","p":"Yáng Xióng huídá shuō: “Rúguǒ chéngxīn shíyì, jíshǐ xiàng jīnshǔ hé shítou nàyàng yìng de dōngxi yě huì bèi dǎdòng.”","v":"Dương Hùng đáp: “Nếu thật lòng thật dạ thì ngay cả những thứ cứng như kim loại và đá cũng sẽ bị lay động.”","b":0},{"s":"","z":"“精诚所至，金石为开”这一成语也便由此流传下来。","p":"“Jīngchéng suǒzhì, jīnshí wéi kāi” zhè yì chéngyǔ yě biàn yóu cǐ liúchuán xialai.","v":"Thành ngữ “Tinh thành sở chí, kim thạch vi khai” cũng từ đó mà lưu truyền đến nay.","b":0}]}],"aud":[{"v":"audio/07-2.mp3","t":"audio/07-1.mp3"},{"v":"audio/07-4.mp3","t":"audio/07-3.mp3"}],"gram":[{"id":"xia","t":"瞎","s":"mù; bừa, vớ vẩn (động từ / phó từ)","b":"<b>Động từ</b>: nghĩa là “mắt không nhìn thấy” – <b>bị mù</b>. Ngoài ra 瞎 còn làm <b>phó từ</b>, đứng trước động từ, chỉ làm việc gì đó <b>không có lý do, không có căn cứ hoặc không có hiệu quả</b> – làm bừa, làm vớ vẩn.","r":["Động từ: 眼睛瞎了 / ……是瞎的 – bị mù.","Phó từ: 瞎 + động từ (瞎说, 瞎担心, 瞎猜…) – làm bừa, vô căn cứ, vô ích."],"e":[["聪明人用双手挡住了马的双眼，对那个人说：“要是这马真是你的，你一定知道马的哪只眼睛是瞎的。”","Cōngming rén yòng shuāng shǒu dǎngzhùle mǎ de shuāng yǎn, duì nàge rén shuō: “Yàoshi zhè mǎ zhēn shì nǐ de, nǐ yídìng zhīdào mǎ de nǎ zhī yǎnjing shì xiā de.”","Người thông minh lấy hai tay che hai mắt con ngựa, nói với người kia: “Nếu con ngựa này đúng là của anh thì chắc chắn anh biết nó mù bên mắt nào.”"],["一天，他让士兵们去找一头大象和一些出生时眼睛就瞎了的人回来。","Yì tiān, tā ràng shìbīngmen qù zhǎo yì tóu dàxiàng hé yìxiē chūshēng shí yǎnjing jiù xiā le de rén huílai.","Một hôm, ông sai binh lính đi tìm về một con voi và mấy người bị mù từ lúc mới sinh. <i>(bài khoá)</i>"],["别听他瞎说，不用害怕。我们不会这么倒霉的。","Bié tīng tā xiā shuō, búyòng hàipà. Wǒmen bú huì zhème dǎoméi de.","Đừng nghe anh ta nói bậy, không phải sợ. Chúng ta không xui xẻo đến thế đâu."],["他自己的问题，他会想办法的，你就别替他瞎担心了。","Tā zìjǐ de wèntí, tā huì xiǎng bànfǎ de, nǐ jiù bié tì tā xiā dānxīn le.","Chuyện của anh ấy thì anh ấy sẽ tự lo liệu, cậu đừng lo bò trắng răng thay anh ấy nữa."]],"d":[["别听他____说，不用害怕。","瞎"],["他没回家，肯定是公司有事，你____着什么急！","瞎"],["一天，他让士兵们去找一头大象和一些出生时眼睛就____了的人回来。","瞎"]],"w":"Phó từ 瞎 luôn đứng ngay trước động từ (瞎说, 瞎着急); khi chỉ “bị mù” thì là động từ, thường đi với 了 hoặc cấu trúc 是……的."},{"id":"fenbie","t":"分别","s":"chia tay; lần lượt, riêng từng người; sự khác biệt (động từ / phó từ / danh từ)","b":"<b>Động từ</b>: nghĩa là “ly biệt” – <b>chia tay, xa nhau</b>. <b>Phó từ</b>: chỉ <b>chia nhau, mỗi người/mỗi bên một phần</b>; khi làm phó từ còn dùng để <b>kể lần lượt từng cái một</b>. <b>Danh từ</b>: nghĩa là “khu biệt”, “chỗ không giống nhau” – <b>sự khác biệt</b>.","r":["Động từ: 分别 + thời gian (分别20年了) – xa cách bao lâu.","Phó từ (chia nhau): 分别 + động từ – mỗi người/mỗi bên tự làm (分别去不同地方寻找).","Phó từ (kể lần lượt): ……分别是A、B和C / 分别占……和…… – lần lượt là.","Danh từ: 有什么分别 / ……的分别 – sự khác nhau."],"e":[["分别是暂时的，我们以后一定会再见。","Fēnbié shì zànshí de, wǒmen yǐhòu yídìng huì zài jiàn.","Chia tay chỉ là tạm thời, sau này chúng ta nhất định sẽ gặp lại."],["从毕业到现在，我们已经分别20年了，一直都没有联系。","Cóng bìyè dào xiànzài, wǒmen yǐjīng fēnbié èrshí nián le, yìzhí dōu méiyǒu liánxì.","Từ lúc tốt nghiệp đến nay, chúng tôi đã xa nhau 20 năm, suốt thời gian đó không hề liên lạc."],["我分别找两个人打听了这件事，他们的说法都是一样的。","Wǒ fēnbié zhǎo liǎng ge rén dǎtingle zhè jiàn shì, tāmen de shuōfǎ dōu shì yíyàng de.","Tôi đã lần lượt hỏi riêng hai người về chuyện này, lời họ kể đều giống nhau."],["士兵们分别去不同地方寻找，把找到的大象和盲人带到他面前。","Shìbīngmen fēnbié qù bù tóng dìfang xúnzhǎo, bǎ zhǎodào de dàxiàng hé mángrén dàidào tā miànqián.","Binh lính chia nhau đi tìm ở nhiều nơi, rồi đưa voi và những người mù tìm được đến trước mặt nhà vua. <i>(bài khoá)</i>"],["一张桌子上放着三瓶饮料，分别是茶、可乐和咖啡。","Yì zhāng zhuōzi shang fàngzhe sān píng yǐnliào, fēnbié shì chá, kělè hé kāfēi.","Trên bàn đặt ba chai đồ uống, lần lượt là trà, cola và cà phê."],["谈到对目前工作最不满意的地方，39.1%的被调查者认为休息时间太少，发展慢、工资太低分别占20.3%和20%。","Tándào duì mùqián gōngzuò zuì bù mǎnyì de dìfang, bǎi fēn zhī sānshíjiǔ diǎn yī de bèi diàocházhě rènwéi xiūxi shíjiān tài shǎo, fāzhǎn màn, gōngzī tài dī fēnbié zhàn bǎi fēn zhī èrshí diǎn sān hé bǎi fēn zhī èrshí.","Khi nói về điều không hài lòng nhất ở công việc hiện tại, 39,1% người được khảo sát cho rằng thời gian nghỉ ngơi quá ít; phát triển chậm và lương quá thấp lần lượt chiếm 20,3% và 20%."],["我不知道这两种做法有什么分别。","Wǒ bù zhīdào zhè liǎng zhǒng zuòfǎ yǒu shénme fēnbié.","Tôi không biết hai cách làm này khác nhau ở chỗ nào."],["这两张照片的分别是一眼就看得出来的。","Zhè liǎng zhāng zhàopiàn de fēnbié shì yì yǎn jiù kàn de chūlai de.","Chỗ khác nhau giữa hai bức ảnh này nhìn qua là thấy ngay."]],"d":[["从毕业到现在，我们已经____20年了，一直都没有联系。","分别"],["他们____去两个不同的城市做社会调查，想了解南方和北方不同的风俗！","分别"],["我不知道这两种做法有什么____。","分别"]],"w":"Ba từ loại, ba nghĩa: động từ = chia tay; phó từ = chia nhau làm / lần lượt là; danh từ = sự khác biệt (gần nghĩa 区别)."},{"id":"gen","t":"根","s":"rễ; gốc rễ; lượng từ cho vật dài mảnh (danh từ / lượng từ)","b":"<b>Danh từ</b>: nghĩa là “phần của cây mọc xuống dưới đất” – <b>rễ cây</b>. Khi làm danh từ còn chỉ <b>nền tảng, gốc rễ của sự vật</b> (牙根, 从根上解决). 根 cũng làm <b>lượng từ</b>, thường dùng cho <b>vật dài và mảnh</b>.","r":["Danh từ: 树的根 – rễ cây; 牙根 – chân răng.","Danh từ (nghĩa bóng): 从根上解决 – giải quyết từ gốc.","Lượng từ: 一根绳子 / 几根箭 / 一根筷子 – vật dài, mảnh."],"e":[["这棵树的根又粗又长。","Zhè kē shù de gēn yòu cū yòu cháng.","Rễ của cây này vừa to vừa dài."],["这种植物的根下雨时会大量吸水，从而满足自身的需要。","Zhè zhǒng zhíwù de gēn xià yǔ shí huì dàliàng xī shuǐ, cóng'ér mǎnzú zìshēn de xūyào.","Khi trời mưa, rễ của loài cây này hút rất nhiều nước, nhờ đó đáp ứng nhu cầu của chính nó."],["你这颗牙连牙根都坏了，平时难道不疼吗？","Nǐ zhè kē yá lián yágēn dōu huài le, píngshí nándào bù téng ma?","Cái răng này của cậu hỏng đến tận chân răng rồi, bình thường lẽ nào không đau sao?"],["这件事还是得从根上解决，只解决表面问题是不行的。","Zhè jiàn shì háishi děi cóng gēn shang jiějué, zhǐ jiějué biǎomiàn wèntí shì bù xíng de.","Chuyện này vẫn phải giải quyết tận gốc, chỉ giải quyết phần bề ngoài thì không được."],["摸到尾巴的盲人说大象像一根绳子。","Mōdào wěiba de mángrén shuō dàxiàng xiàng yì gēn shéngzi.","Người mù sờ phải cái đuôi nói con voi giống một sợi dây thừng."],["可是，这次他连续换了几根箭，都没能再射进去，……","Kěshì, zhè cì tā liánxù huànle jǐ gēn jiàn, dōu méi néng zài shè jinqu, ……","Thế nhưng lần này ông liên tiếp thay mấy mũi tên mà không mũi nào bắn xuyên vào được nữa, … <i>(bài khoá)</i>"]],"d":[["摸到尾巴的盲人说大象像一____绳子。","根"],["这件事还是得从____上解决，只解决表面问题是不行的。","根"],["这么美丽的图画竟然是用____绳子做的！","根"]],"w":"Lượng từ cho vật dài, mảnh: 根 và 条 đều dùng được với 绳子/尾巴 (一根/一条绳子); 支 dùng cho vật dài, cứng như 笔, 箭."},{"id":"bian","t":"便","s":"thì, liền, bèn (phó từ, văn viết)","b":"<b>Phó từ</b>, nghĩa giống <b>就</b>, thường dùng trong <b>văn viết</b>. Đứng sau chủ ngữ, trước động từ, chỉ việc gì đó xảy ra một cách tự nhiên khi có điều kiện hoặc tình huống nhất định.","r":["Vị trí: chủ ngữ + (也) + 便 + động từ (这一成语也便由此流传下来).","Có thể thay bằng 就 trong hầu hết trường hợp; 便 trang trọng, mang sắc thái văn viết hơn."],"e":[["楼上新买了一架钢琴，我们家便多了一些不安静。","Lóu shàng xīn mǎile yí jià gāngqín, wǒmen jiā biàn duōle yìxiē bù ānjìng.","Nhà tầng trên mới mua một cây đàn piano, thế là nhà chúng tôi bớt yên tĩnh hẳn."],["很多时候，仅仅是换一种心情，换一个角度，便可以从困境中走出来。","Hěn duō shíhou, jǐnjǐn shì huàn yì zhǒng xīnqíng, huàn yí ge jiǎodù, biàn kěyǐ cóng kùnjìng zhōng zǒu chulai.","Nhiều khi chỉ cần đổi tâm trạng, đổi góc nhìn là đã có thể thoát khỏi cảnh khó khăn."],["“精诚所至，金石为开”这一成语也便由此流传下来。","“Jīngchéng suǒzhì, jīnshí wéi kāi” zhè yì chéngyǔ yě biàn yóu cǐ liúchuán xialai.","Thành ngữ “Tinh thành sở chí, kim thạch vi khai” cũng từ đó mà lưu truyền đến nay. <i>(bài khoá)</i>"]],"d":[["他刚出门，发现没带钥匙，____转身回去拿。","便"],["楼上新买了一架钢琴，我们家____多了一些不安静。","便"],["“精诚所至，金石为开”这一成语也____由此流传下来。","便"]],"w":"便 = 就 nhưng mang màu sắc văn viết; không đặt 便 trước chủ ngữ (✗ 便我们…… → ✓ 我们便……)."},{"id":"huran_turan","t":"忽然 vs 突然","s":"bỗng nhiên, đột nhiên","b":"<b>Giống nhau:</b> cả hai đều có thể đứng <b>trước động từ</b>, biểu thị việc xảy ra rất nhanh, không ngờ tới. Ví dụ: 我们正在上课，他忽然/突然站了起来。","r":["忽然 là <b>phó từ</b>, chỉ có thể đứng trước động từ hoặc phân câu (có thể thay bằng 突然).","突然 vừa là <b>phó từ</b> vừa là <b>tính từ</b>, có thể làm vị ngữ (这件事太突然了！), bổ ngữ (发生得太突然了！), định ngữ (突然的一声喊叫).","Lỗi hay gặp: ✗ 消息来得太忽然了 → ✓ 消息来得太突然了。"],"e":[["我们正在上课，他忽然/突然站了起来。","Wǒmen zhèngzài shàngkè, tā hūrán/tūrán zhànle qilai.","Chúng tôi đang học thì cậu ấy bỗng đứng bật dậy."],["一天傍晚，他正带着士兵们在山中打猎，忽然发现远处的草丛中蹲着一只大老虎。","Yì tiān bàngwǎn, tā zhèng dàizhe shìbīngmen zài shān zhōng dǎ liè, hūrán fāxiàn yuǎnchù de cǎocóng zhōng dūnzhe yì zhī dà lǎohǔ.","Một buổi chiều tối, ông đang dẫn binh lính đi săn trong núi thì bỗng thấy trong bụi cỏ đằng xa có một con hổ lớn đang ngồi phục."],["这件事太突然了！","Zhè jiàn shì tài tūrán le!","Chuyện này đột ngột quá! (tính từ, làm vị ngữ)"],["这件事发生得太突然了！","Zhè jiàn shì fāshēng de tài tūrán le!","Chuyện này xảy ra đột ngột quá! (làm bổ ngữ)"],["这突然的一声喊叫吓了我一跳。","Zhè tūrán de yì shēng hǎnjiào xiàle wǒ yí tiào.","Tiếng hét bất ngờ ấy làm tôi giật cả mình. (tính từ, làm định ngữ)"]],"d":[["消息来得太____了，我完全没有准备。","突然"],["这是一个____的变化，我们谁也没想到。","突然"],["他抱着小狗走到门口，____想起妈妈不允许他在家里养小动物。","忽然/突然"],["有个铁路工人____就辞了职，买帆船出海了，你听说了吗？","忽然/突然"]],"w":"Sau 太/很/得 hoặc trước 的 (vị trí của tính từ) chỉ dùng 突然; đứng ngay trước động từ thì cả hai đều được."}],"ext":[["文字","wénzì","chữ viết"],["词汇","cíhuì","từ vựng"],["成语","chéngyǔ","thành ngữ"],["字母","zìmǔ","chữ cái"],["声调","shēngdiào","thanh điệu"],["拼音","pīnyīn","phiên âm (pinyin)"],["语气","yǔqì","ngữ khí, giọng điệu"],["疑问","yíwèn","nghi vấn"],["否定","fǒudìng","phủ định"],["省略","shěnglüè","tỉnh lược, lược bỏ"]],"extt":"语言文字","notes":"Bài 7 gồm HAI bài khoá: 《盲人摸象》(255字, trang 66–67) và 《精诚所至，金石为开》(436字, trang 67–68); texts[0] là bài 1, texts[1]–texts[2] là bài 2 (cắt tại ranh giới đoạn), nên texts[1] cũng ghi tên bài thứ hai. title_vi của bài 1 do người soạn đặt (sách chỉ có tên tiếng Việt chung của bài: Hai câu chuyện thành ngữ). Không có dòng chú thích nguồn ở cuối bài khoá. Câu thoại cuối của nhà vua (bài 1) được cắt tại dấu ？ trong ngoặc kép thành 2 dòng. Sách in từ 5 là （大）象 (dà) xiàng → han ghi 大象; từ 33 in là 尽（力）jìn (lì) → han ghi 尽 để khớp 用尽全力 trong bài khoá. Từ 20, 28, 32 sách không ghi từ loại (pos để rỗng). Từ có dấu * (ngoài đề cương): 3, 20, 21, 24, 32, 40. Ví dụ (3) mục 瞎 trong sách có chú thích 倒霉 (dǎoméi, xui xẻo), ví dụ (3) mục 根 có chú thích 颗 (kē, cái, chiếc) — đã bỏ chú thích khỏi câu. Ví dụ (5) mục 根 là câu phỏng theo bài khoá (sách in màu đen) nên không gắn nhãn (bài khoá); ví dụ 忽然 trong bảng 词语辨析 có thêm “的草丛中” so với bài khoá nên cũng không gắn nhãn. Drill 根 thứ 3 và drill 瞎 thứ 2, 分别 thứ 2 lấy từ 练习3 (đặt từ vào vị trí đúng); drill 便 thứ 1 lấy từ 练一练 (viết lại câu). Bảng 词语搭配 (寻找+机会/信息/亲人/人才; 确定+时间/地点/人选; 片面(地)+看/认为; 连续+工作/驾驶/发生/演出; 摸+到……/出(来)……; 打/撞/撕+碎; 一支+笔/花/烟; 一根/一条+尾巴/绳子/皮带; 这件事情/他的伤+不要紧; 反应+很快) không có trường riêng trong schema. Bảng 扩展 (语言文字) trong sách chỉ có chữ Hán + pinyin, nghĩa tiếng Việt do người soạn bổ sung.","order":[{"z":"很久以前，有一个很有智慧的国王。","t":["很久以前","有","一个","很","有","智慧","的","国王"],"v":"Ngày xửa ngày xưa, có một vị vua rất sáng suốt."},{"z":"摸到牙齿的盲人说：“我觉得像一个角。","t":["摸","到","牙齿","的","盲人","说","我","觉得","像","一个角"],"v":"Người mù sờ phải cái ngà nói: “Tôi thấy nó giống một cái sừng.”"},{"z":"摸到尾巴的盲人说，“它像一条绳子。","t":["摸","到","尾巴","的","盲人","说","它","像","一条","绳子"],"v":"“Nói bậy!” Người mù sờ phải cái đuôi nói, “Nó giống một sợi dây thừng.”"},{"z":"不，你们都错了，应该是像一把扇子。","t":["不","你们","都","错","了","应该","是","像","一把","扇子"],"v":"“Không, các anh đều sai cả rồi, nó phải giống một cái quạt mới đúng.”"},{"z":"这个盲人摸到了大象的耳朵。","t":["这个","盲人","摸","到","了","大象","的","耳朵"],"v":"Người mù này đã sờ phải tai voi."},{"z":"只有片面的认识是不能下结论的。","t":["只有","片面","的","认识","是","不能","下结论","的"],"v":"Chỉ có hiểu biết phiến diện thì không thể đưa ra kết luận được.”"},{"z":"士兵们都紧张地围了上来，想要保护他。","t":["士兵","们","都","紧张","地围","了","上来","想要","保护","他"],"v":"Binh lính đều căng thẳng vây quanh, muốn bảo vệ ông."},{"z":"士兵奇怪地你看我，我看你。","t":["士兵","奇怪","地","你","看","我","我","看","你"],"v":"“Ơ kìa, sao lại thế này?” Binh lính ngơ ngác nhìn nhau."},{"z":"大概是我不够用心了吧！","t":["大概","是","我","不够","用心","了","吧"],"v":"“Haizz! Chắc là ta chưa đủ dốc lòng rồi!” Lý Quảng cũng đành bất lực nói."},{"z":"精诚所至，金石为开”这一成语也便由此流传下来。","t":["精诚所至","金石为开","这一","成语","也","便","由此","流传","下来"],"v":"Thành ngữ “Tinh thành sở chí, kim thạch vi khai” cũng từ đó mà lưu truyền đến nay."},{"z":"别听他瞎说，不用害怕。","t":["别","听","他","瞎说","不用","害怕"],"v":"Đừng nghe anh ta nói bậy, không phải sợ. Chúng ta không xui xẻo đến thế đâu."},{"z":"我们不会这么倒霉的。","t":["我们","不会","这么","倒霉","的"],"v":"Đừng nghe anh ta nói bậy, không phải sợ. Chúng ta không xui xẻo đến thế đâu."},{"z":"分别是暂时的，我们以后一定会再见。","t":["分别","是","暂时","的","我们","以后","一定","会","再见"],"v":"Chia tay chỉ là tạm thời, sau này chúng ta nhất định sẽ gặp lại."},{"z":"我不知道这两种做法有什么分别。","t":["我","不","知道","这","两种","做法","有","什么","分别"],"v":"Tôi không biết hai cách làm  tiếng là thôi; nếu không được đối xử tử tế, chúng sẽ như một đám trẻ nghịch ngợm, suốt ngày quậy phá người ta."},{"h":"淘气","p":"táoqì","v":"nghịch ngợm","k":"tt.","x":0,"ez":"问题是，猴子不像猪、狗，吃不饱时仅仅只是叫叫，它们如果得不到好的待遇，就会像一群调皮的孩子，经常跟人淘气。","ev":"Có điều, khỉ không giống heo hay chó, đói thì chỉ kêu vài tiếng là thôi; nếu không được đối xử tử tế, chúng sẽ như một đám trẻ nghịch ngợm, suốt ngày quậy phá người ta."},{"h":"橡子","p":"xiàngzi","v":"quả đấu, hạt dẻ rừng","k":"dt.","x":1,"ez":"老人的朋友送给他很多橡子，这是一种猴子爱吃的果实。","ev":"Bạn của ông lão tặng ông rất nhiều hạt dẻ rừng, đây là một loại quả mà khỉ rất thích ăn."},{"h":"果实","p":"guǒshí","v":"quả, trái cây","k":"dt.","x":0,"ez":"老人的朋友送给他很多橡子，这是一种猴子爱吃的果实。","ev":"Bạn của ông lão tặng ông rất nhiều hạt dẻ rừng, đây là một loại quả mà khỉ rất thích ăn."},{"h":"不足","p":"bùzú","v":"thiếu; không đủ","k":"tt./đgt.","x":0,"ez":"在其他粮食不足的情况下，用橡子喂猴子倒是个办法。","ev":"Trong lúc các loại lương thực khác không đủ, lấy hạt dẻ rừng cho khỉ ăn lại là một cách hay."},{"h":"倒","p":"dào","v":"(chỉ sự trái ngược với điều được mong đợi hoặc suy nghĩ) lại","k":"phó.","x":0,"ez":"在其他粮食不足的情况下，用橡子喂猴子倒是个办法。","ev":"Trong lúc các loại lương thực khác không đủ, lấy hạt dẻ rừng cho khỉ ăn lại là một cách hay."},{"h":"馒头","p":"mántou","v":"màn thầu, bánh bao không nhân","k":"dt.","x":0,"ez":"于是老人对猴子们说：“今后你们除了吃馒头，还可以再吃一些橡子。","ev":"Thế là ông lão nói với bầy khỉ: \"Từ nay ngoài màn thầu ra, các ngươi còn được ăn thêm ít hạt dẻ."},{"h":"颗","p":"kē","v":"(được dùng cho vật có dạng hạt tròn nhỏ) hạt, viên","k":"lượng.","x":0,"ez":"我早上给你们三颗，晚上给四颗。”","ev":"Buổi sáng ta cho các ngươi ba hạt, buổi tối cho bốn hạt.\""},{"h":"似乎","p":"sìhū","v":"dường như","k":"phó.","x":0,"ez":"猴子们似乎只弄懂了主人前面说的一个“三”，觉得自己吃了亏，一个个立起身子跳来跳去，对着老人大喊大叫地发脾气。","ev":"Bầy khỉ dường như chỉ nghe hiểu mỗi chữ \"ba\" mà chủ nói trước, thấy mình bị thiệt, con nào con nấy đứng thẳng người nhảy tới nhảy lui, la hét ầm ĩ nổi cáu với ông lão."},{"h":"吃亏","p":"chī kuī","v":"chịu thiệt, thiệt thòi","k":"đgt.","x":0,"ez":"做生意不能怕吃亏。","ev":"Làm ăn buôn bán thì không được sợ chịu thiệt."},{"h":"方式","p":"fāngshì","v":"phương thức, cách thức","k":"dt.","x":0,"ez":"老人见猴子们不接受，就换了一种方式，安慰它们说道：“要不这样吧，既然你们觉得少，那就改成每天早上四颗，晚上三颗，这样总够了吧？”","ev":"Ông lão thấy bầy khỉ không chịu, bèn đổi cách khác, dỗ dành chúng: \"Hay là thế này nhé, các ngươi đã thấy ít thì ta đổi thành mỗi ngày sáng bốn hạt, tối ba hạt, thế thì đủ rồi chứ?\""},{"h":"安慰","p":"ānwèi","v":"an ủi, dỗ dành","k":"đgt.","x":0,"ez":"老人见猴子们不接受，就换了一种方式，安慰它们说道：“要不这样吧，既然你们觉得少，那就改成每天早上四颗，晚上三颗，这样总够了吧？”","ev":"Ông lão thấy bầy khỉ không chịu, bèn đổi cách khác, dỗ dành chúng: \"Hay là thế này nhé, các ngươi đã thấy ít thì ta đổi thành mỗi ngày sáng bốn hạt, tối ba hạt, thế thì đủ rồi chứ?\""},{"h":"要不","p":"yàobu","v":"nếu không thì","k":"liên.","x":0,"ez":"老人见猴子们不接受，就换了一种方式，安慰它们说道：“要不这样吧，既然你们觉得少，那就改成每天早上四颗，晚上三颗，这样总够了吧？”","ev":"Ông lão thấy bầy khỉ không chịu, bèn đổi cách khác, dỗ dành chúng: \"Hay là thế này nhé, các ngươi đã thấy ít thì ta đổi thành mỗi ngày sáng bốn hạt, tối ba hạt, thế thì đủ rồi chứ?\""},{"h":"显得","p":"xiǎnde","v":"tỏ ra, có vẻ","k":"đgt.","x":0,"ez":"猴子把主人前面说的一个“四”当成全天多得了的橡子，所以马上安静下来，显得格外开心。","ev":"Bầy khỉ tưởng chữ \"bốn\" chủ nói trước là số hạt dẻ cả ngày được thêm, nên lập tức im lặng, tỏ ra vô cùng vui sướng."},{"h":"格外","p":"géwài","v":"vô cùng, hết sức","k":"phó.","x":0,"ez":"猴子把主人前面说的一个“四”当成全天多得了的橡子，所以马上安静下来，显得格外开心。","ev":"Bầy khỉ tưởng chữ \"bốn\" chủ nói trước là số hạt dẻ cả ngày được thêm, nên lập tức im lặng, tỏ ra vô cùng vui sướng."},{"h":"情景","p":"qíngjǐng","v":"tình cảnh, cảnh tượng","k":"dt.","x":0,"ez":"老人看着这情景，哈哈地笑了。","ev":"Ông lão nhìn cảnh tượng ấy mà cười ha hả."},{"h":"哈","p":"hā","v":"(từ tượng thanh chỉ tiếng cười) ha ha, ha hả; (từ cảm thán chỉ sự đắc chí hoặc hài lòng) a ha, ha","k":"tượng./ct.","x":0,"ez":"老人看着这情景，哈哈地笑了。","ev":"Ông lão nhìn cảnh tượng ấy mà cười ha hả."}]],"texts":[{"no":1,"tz":"","tv":"","lines":[{"s":"","z":"成语是汉语中非常有特点的一部分词汇。","p":"Chéngyǔ shì Hànyǔ zhōng fēicháng yǒu tèdiǎn de yí bùfen cíhuì.","v":"Thành ngữ là một bộ phận từ vựng rất đặc sắc trong tiếng Hán.","b":0},{"s":"","z":"成语有固定的结构，不能随便更改；","p":"Chéngyǔ yǒu gùdìng de jiégòu, bù néng suíbiàn gēnggǎi;","v":"Thành ngữ có kết cấu cố định, không thể tùy tiện sửa đổi;","b":0},{"s":"","z":"意义是整体性的，不是每个字意思的简单相加，而是综合起来表达一个完整的意思。","p":"yìyì shì zhěngtǐxìng de, bú shì měi ge zì yìsi de jiǎndān xiāngjiā, ér shì zōnghé qǐlai biǎodá yí ge wánzhěng de yìsi.","v":"ý nghĩa của nó mang tính chỉnh thể, không phải là phép cộng đơn giản nghĩa của từng chữ, mà là tổng hợp lại để diễn đạt một ý trọn vẹn.","b":0},{"s":"","z":"一般来说，成语的意义也是稳定的，很少发生变化，比如我们学过的“盲人摸象”和“精诚所至，金石为开”。","p":"Yìbān lái shuō, chéngyǔ de yìyì yě shì wěndìng de, hěn shǎo fāshēng biànhuà, bǐrú wǒmen xuéguo de “mángrén mō xiàng” hé “jīngchéng suǒ zhì, jīnshí wéi kāi”.","v":"Nói chung, nghĩa của thành ngữ cũng khá ổn định, rất ít khi thay đổi, chẳng hạn như \"Thầy bói xem voi\" và \"Thành tâm đến đâu, vàng đá cũng phải mở\" mà chúng ta đã học.","b":0},{"s":"","z":"但也有古今不同的，像我们今天要学习的“朝三暮四”。","p":"Dàn yě yǒu gǔ jīn bùtóng de, xiàng wǒmen jīntiān yào xuéxí de “zhāosān mùsì”.","v":"Nhưng cũng có những thành ngữ nghĩa xưa và nay khác nhau, như \"Sáng ba chiều bốn\" mà hôm nay chúng ta sẽ học.","b":0},{"s":"","z":"中国古代有一位哲学家，在他的书中讲了这样一个寓言故事：","p":"Zhōngguó gǔdài yǒu yí wèi zhéxuéjiā, zài tā de shū zhōng jiǎngle zhèyàng yí ge yùyán gùshi:","v":"Thời cổ đại Trung Quốc có một nhà triết học, trong sách của mình ông đã kể một câu chuyện ngụ ngôn như sau:","b":0},{"s":"","z":"从前有位老人，喂养了一群猴子当宠物。","p":"Cóngqián yǒu wèi lǎorén, wèiyǎngle yì qún hóuzi dàng chǒngwù.","v":"Ngày xưa có một ông lão nuôi một bầy khỉ làm thú cưng.","b":0},{"s":"","z":"相处久了，彼此居然可以从表情、声音和行为举止中了解对方的意思。","p":"Xiāngchǔ jiǔ le, bǐcǐ jūrán kěyǐ cóng biǎoqíng, shēngyīn hé xíngwéi jǔzhǐ zhōng liǎojiě duìfāng de yìsi.","v":"Sống chung lâu ngày, hai bên vậy mà có thể hiểu ý nhau qua nét mặt, giọng nói và cử chỉ hành động.","b":0},{"s":"","z":"猴子太多，每天要吃大量的瓜果、蔬菜和粮食。","p":"Hóuzi tài duō, měi tiān yào chī dàliàng de guāguǒ, shūcài hé liángshi.","v":"Khỉ thì đông, mỗi ngày phải ăn rất nhiều hoa quả, rau và lương thực.","b":1},{"s":"","z":"然而，一个普通的家庭，财产不多，哪有那么大的财力满足一群猴子对食物的长期需要呢？","p":"Rán'ér, yí ge pǔtōng de jiātíng, cáichǎn bù duō, nǎ yǒu nàme dà de cáilì mǎnzú yì qún hóuzi duì shíwù de chángqī xūyào ne?","v":"Thế nhưng một gia đình bình thường, của cải chẳng là bao, lấy đâu ra nhiều tiền của như vậy để lo cái ăn lâu dài cho cả một bầy khỉ?","b":0},{"s":"","z":"老人甚至必须减少家人的消费，好节省些食物拿去喂养猴子。","p":"Lǎorén shènzhì bìxū jiǎnshǎo jiārén de xiāofèi, hǎo jiéshěng xiē shíwù ná qù wèiyǎng hóuzi.","v":"Ông lão thậm chí phải cắt giảm chi tiêu của người nhà để dành dụm chút thức ăn đem nuôi khỉ.","b":0},{"s":"","z":"他注意到该限制猴子的食量了。","p":"Tā zhùyì dào gāi xiànzhì hóuzi de shíliàng le.","v":"Ông nhận ra đã đến lúc phải hạn chế khẩu phần ăn của lũ khỉ.","b":0},{"s":"","z":"问题是，猴子不像猪、狗，吃不饱时仅仅只是叫叫，它们如果得不到好的待遇，就会像一群调皮的孩子，经常跟人淘气。","p":"Wèntí shì, hóuzi bú xiàng zhū, gǒu, chī bu bǎo shí jǐnjǐn zhǐshì jiàojiao, tāmen rúguǒ dé bu dào hǎo de dàiyù, jiù huì xiàng yì qún tiáopí de háizi, jīngcháng gēn rén táoqì.","v":"Có điều, khỉ không giống heo hay chó, đói thì chỉ kêu vài tiếng là thôi; nếu không được đối xử tử tế, chúng sẽ như một đám trẻ nghịch ngợm, suốt ngày quậy phá người ta.","b":0},{"s":"","z":"老人的朋友送给他很多橡子，这是一种猴子爱吃的果实。","p":"Lǎorén de péngyou sòng gěi tā hěn duō xiàngzi, zhè shì yì zhǒng hóuzi ài chī de guǒshí.","v":"Bạn của ông lão tặng ông rất nhiều hạt dẻ rừng, đây là một loại quả mà khỉ rất thích ăn.","b":0},{"s":"","z":"在其他粮食不足的情况下，用橡子喂猴子倒是个办法。","p":"Zài qítā liángshi bùzú de qíngkuàng xià, yòng xiàngzi wèi hóuzi dào shì ge bànfǎ.","v":"Trong lúc các loại lương thực khác không đủ, lấy hạt dẻ rừng cho khỉ ăn lại là một cách hay.","b":0},{"s":"","z":"于是老人对猴子们说：“今后你们除了吃馒头，还可以再吃一些橡子。","p":"Yúshì lǎorén duì hóuzimen shuō: “Jīnhòu nǐmen chúle chī mántou, hái kěyǐ zài chī yìxiē xiàngzi.","v":"Thế là ông lão nói với bầy khỉ: \"Từ nay ngoài màn thầu ra, các ngươi còn được ăn thêm ít hạt dẻ.","b":0},{"s":"","z":"我早上给你们三颗，晚上给四颗。”","p":"Wǒ zǎoshang gěi nǐmen sān kē, wǎnshang gěi sì kē.”","v":"Buổi sáng ta cho các ngươi ba hạt, buổi tối cho bốn hạt.\"","b":0},{"s":"","z":"猴子们似乎只弄懂了主人前面说的一个“三”，觉得自己吃了亏，一个个立起身子跳来跳去，对着老人大喊大叫地发脾气。","p":"Hóuzimen sìhū zhǐ nòngdǒngle zhǔrén qiánmiàn shuō de yí ge “sān”, juéde zìjǐ chīle kuī, yígègè lìqǐ shēnzi tiào lái tiào qù, duìzhe lǎorén dà hǎn dà jiào de fā píqi.","v":"Bầy khỉ dường như chỉ nghe hiểu mỗi chữ \"ba\" mà chủ nói trước, thấy mình bị thiệt, con nào con nấy đứng thẳng người nhảy tới nhảy lui, la hét ầm ĩ nổi cáu với ông lão.","b":1},{"s":"","z":"老人见猴子们不接受，就换了一种方式，安慰它们说道：“要不这样吧，既然你们觉得少，那就改成每天早上四颗，晚上三颗，这样总够了吧？”","p":"Lǎorén jiàn hóuzimen bù jiēshòu, jiù huànle yì zhǒng fāngshì, ānwèi tāmen shuōdào: “Yàobu zhèyàng ba, jìrán nǐmen juéde shǎo, nà jiù gǎichéng měi tiān zǎoshang sì kē, wǎnshang sān kē, zhèyàng zǒng gòu le ba?”","v":"Ông lão thấy bầy khỉ không chịu, bèn đổi cách khác, dỗ dành chúng: \"Hay là thế này nhé, các ngươi đã thấy ít thì ta đổi thành mỗi ngày sáng bốn hạt, tối ba hạt, thế thì đủ rồi chứ?\"","b":0},{"s":"","z":"猴子把主人前面说的一个“四”当成全天多得了的橡子，所以马上安静下来，显得格外开心。","p":"Hóuzi bǎ zhǔrén qiánmiàn shuō de yí ge “sì” dàngchéng quán tiān duō déle de xiàngzi, suǒyǐ mǎshàng ānjìng xiàlai, xiǎnde géwài kāixīn.","v":"Bầy khỉ tưởng chữ \"bốn\" chủ nói trước là số hạt dẻ cả ngày được thêm, nên lập tức im lặng, tỏ ra vô cùng vui sướng.","b":0},{"s":"","z":"老人看着这情景，哈哈地笑了。","p":"Lǎorén kànzhe zhè qíngjǐng, hāhā de xiào le.","v":"Ông lão nhìn cảnh tượng ấy mà cười ha hả.","b":0},{"s":"","z":"哲学家用这个故事告诉人们，不要太关心生死、得失，因为到最后我们会发现没有失去什么，也没有得到什么。","p":"Zhéxuéjiā yòng zhège gùshi gàosu rénmen, búyào tài guānxīn shēngsǐ, déshī, yīnwèi dào zuìhòu wǒmen huì fāxiàn méiyǒu shīqù shénme, yě méiyǒu dédào shénme.","v":"Nhà triết học dùng câu chuyện này để nhắn nhủ mọi người đừng quá bận tâm chuyện sống chết, được mất, bởi rốt cuộc chúng ta sẽ nhận ra mình chẳng mất đi điều gì, cũng chẳng có thêm được điều gì.","b":0},{"s":"","z":"不过，发展到今天，“朝三暮四”这个成语的意义已经完全改变了。","p":"Búguò, fāzhǎn dào jīntiān, “zhāosān mùsì” zhège chéngyǔ de yìyì yǐjīng wánquán gǎibiàn le.","v":"Tuy nhiên, đến ngày nay, nghĩa của thành ngữ \"Sáng ba chiều bốn\" đã hoàn toàn thay đổi.","b":0},{"s":"","z":"你知道它现在是什么意思吗？","p":"Nǐ zhīdào tā xiànzài shì shénme yìsi ma?","v":"Bạn có biết bây giờ nó mang nghĩa gì không?","b":0}]}],"aud":[{"v":"audio/08-2.mp3","t":"audio/08-1.mp3"}],"gram":[{"id":"dao","t":"倒","s":"lại, thì, ngược lại (phó từ)","b":"<b>倒</b> là <b>phó từ</b>, đứng trước động từ/tính từ (hay gặp dạng <b>倒是</b>, <b>反倒</b>). Sách nêu bốn cách dùng: (1) biểu thị điều <b>trái với tình huống thông thường</b>; (2) biểu thị điều <b>không ngờ tới</b>; (3) biểu thị <b>nhượng bộ</b>: trước dùng 倒 để khẳng định một mặt, sau đó nói sang mặt khác; (4) biểu thị <b>hỏi hoặc giục một cách sốt ruột</b>.","r":["Trái với lẽ thường: ……倒是个办法 / 反倒成为缺点","Không ngờ tới: 我倒要认识认识 / 但最后反倒是他赢了","Nhượng bộ: A倒是……，就是…… (khẳng định một mặt, rồi nói mặt chưa được)","Sốt ruột hỏi/giục: 倒是说句话呀！/ 你倒是说说看"],"e":[["在其他粮食不足的情况下，用橡子喂猴子倒是个办法。","Zài qítā liángshi bùzú de qíngkuàng xià, yòng xiàngzi wèi hóuzi dào shì ge bànfǎ.","Trong lúc các loại lương thực khác không đủ, lấy hạt dẻ rừng cho khỉ ăn lại là một cách hay. <i>(bài khoá)</i>"],["少年不解地问：“怎么勇敢反倒成为缺点了？”","Shàonián bùjiě de wèn: “Zěnme yǒnggǎn fǎndào chéngwéi quēdiǎn le?”","Cậu thiếu niên khó hiểu hỏi: \"Sao dũng cảm lại thành ra khuyết điểm vậy?\""],["有这样的人？我倒要认识认识。","Yǒu zhèyàng de rén? Wǒ dào yào rènshi rènshi.","Có người như thế sao? Vậy tôi lại muốn làm quen thử xem."],["对方确实厉害，一上场就先赢了他两局，但最后反倒是他赢了。","Duìfāng quèshí lìhai, yí shàngchǎng jiù xiān yíngle tā liǎng jú, dàn zuìhòu fǎndào shì tā yíng le.","Đối thủ quả thật lợi hại, vừa vào sân đã thắng anh ấy hai ván, vậy mà cuối cùng người thắng lại là anh ấy."],["质量倒是挺好，就是价格太贵了。","Zhìliàng dào shì tǐng hǎo, jiùshì jiàgé tài guì le.","Chất lượng thì khá tốt đấy, chỉ có điều giá đắt quá."],["我倒是很愿意参加这次活动，就是暂时无法确定是否有时间。","Wǒ dào shì hěn yuànyì cānjiā zhè cì huódòng, jiùshì zànshí wúfǎ quèdìng shìfǒu yǒu shíjiān.","Tôi thì rất muốn tham gia hoạt động lần này, chỉ là tạm thời chưa chắc có thời gian hay không."],["你究竟去还是不去？倒是说句话呀！","Nǐ jiūjìng qù háishi bú qù? Dào shì shuō jù huà ya!","Rốt cuộc cậu đi hay không đi? Nói một câu đi chứ!"],["你倒是说说看，这件事你不负责谁负责？","Nǐ dào shì shuōshuo kàn, zhè jiàn shì nǐ bú fùzé shéi fùzé?","Anh nói thử xem, việc này anh không chịu trách nhiệm thì ai chịu?"]],"d":[["质量____是挺好，就是价格太贵了。","倒"],["你究竟去还是不去？____是说句话呀！","倒"],["对方确实厉害，一上场就先赢了他两局，但最后反____是他赢了。","倒"],["我____很想辞职，但是我妻子不支持我的想法。","倒是"]],"w":"倒 (dào, phó từ) khác 倒 (dǎo, động từ: đổ, ngã). Ở nghĩa nhượng bộ, vế sau thường mở đầu bằng 就是/可是/但是."},{"id":"lai_qu","t":"……来……去","s":"(làm) đi (làm) lại, tới tới lui lui","b":"Cấu trúc <b>V₁来V₂去</b> biểu thị <b>động tác lặp đi lặp lại nhiều lần</b>. Hai động từ đứng trước <b>来</b> và <b>去</b> thường là <b>cùng một từ</b> (跑来跑去、跳来跳去) hoặc <b>hai từ gần nghĩa</b> (研究来讨论去).","r":["Cùng một động từ: 跑来跑去 / 跳来跳去 / 找来找去","Hai động từ gần nghĩa: 研究来讨论去","Thường dùng để tả hành động lặp lại mà chưa có kết quả, vế sau hay đi với 还是/也……"],"e":[["小狗追着自己的尾巴，在草地上跑来跑去。","Xiǎogǒu zhuīzhe zìjǐ de wěiba, zài cǎodì shang pǎo lái pǎo qù.","Chú chó con đuổi theo cái đuôi của mình, chạy tới chạy lui trên bãi cỏ."],["猴子们似乎只弄懂了主人前面说的一个“三”，觉得自己吃了亏，一个个立起身子跳来跳去，对着老人大喊大叫地发脾气。","Hóuzimen sìhū zhǐ nòngdǒngle zhǔrén qiánmiàn shuō de yí ge “sān”, juéde zìjǐ chīle kuī, yígègè lìqǐ shēnzi tiào lái tiào qù, duìzhe lǎorén dà hǎn dà jiào de fā píqi.","Bầy khỉ dường như chỉ nghe hiểu mỗi chữ \"ba\" mà chủ nói trước, thấy mình bị thiệt, con nào con nấy đứng thẳng người nhảy tới nhảy lui, la hét ầm ĩ nổi cáu với ông lão. <i>(bài khoá)</i>"],["他们研究来讨论去，还是没找出原因。","Tāmen yánjiū lái tǎolùn qù, háishi méi zhǎochū yuányīn.","Họ nghiên cứu tới thảo luận lui mà vẫn chưa tìm ra nguyên nhân."]],"d":[["小狗追着自己的尾巴，在草地上跑____跑去。","来"],["他们研究来讨论____，还是没找出原因。","去"],["他的手机不见了，很着急，在房间里找来找____。","去"]],"w":"Đừng đảo thành V去V来 trong các ví dụ của bài; trật tự chuẩn là ……来……去."},{"id":"yaobu","t":"要不","s":"nếu không thì; hay là (liên từ)","b":"<b>要不</b> là <b>liên từ</b>, nghĩa giống <b>要不然</b>: biểu thị <b>nếu không như vậy thì sẽ xảy ra kết quả nêu ở phía sau</b>. 要不/要不然 thường đặt <b>trước chủ ngữ của phân câu sau</b>. Ngoài ra, 要不/要不然 còn biểu thị <b>một lựa chọn khác</b> (\"hay là\").","r":["Nếu không thì: (điều kiện), 要不/要不然 + chủ ngữ + kết quả","Đề xuất lựa chọn khác: ……，要不你明天再走吧 / 要不这样吧","Vị trí: đứng đầu phân câu sau, trước chủ ngữ"],"e":[["老太太说：“4块，要不我不买。”","Lǎotàitai shuō: “Sì kuài, yàobu wǒ bù mǎi.”","Bà cụ nói: \"4 đồng, không thì tôi không mua.\""],["还好碰见你了，要不然我今天肯定要迟到了。","Hái hǎo pèngjiàn nǐ le, yàoburán wǒ jīntiān kěndìng yào chídào le.","May mà gặp được cậu, không thì hôm nay chắc chắn tôi đến muộn rồi."],["今天太晚了，要不你明天再走吧。","Jīntiān tài wǎn le, yàobu nǐ míngtiān zài zǒu ba.","Hôm nay muộn quá rồi, hay là mai cậu hẵng đi."],["要不这样吧，既然你们觉得少，那就改成每天早上四颗，晚上三颗，这样总够了吧？","Yàobu zhèyàng ba, jìrán nǐmen juéde shǎo, nà jiù gǎichéng měi tiān zǎoshang sì kē, wǎnshang sān kē, zhèyàng zǒng gòu le ba?","Hay là thế này nhé, các ngươi đã thấy ít thì ta đổi thành mỗi ngày sáng bốn hạt, tối ba hạt, thế thì đủ rồi chứ? <i>(bài khoá)</i>"]],"d":[["老太太说：“4块，____我不买。”","要不"],["今天太晚了，____你明天再走吧。","要不"],["还好碰见你了，____我今天肯定要迟到了。","要不然 / 要不"]],"w":"Phân biệt hai nghĩa qua ngữ cảnh: vế sau là hậu quả xấu → \"nếu không thì\"; vế sau là lời đề nghị (thường có 吧) → \"hay là\"."},{"id":"bici_huxiang","t":"彼此 vs 互相","s":"hai bên, lẫn nhau (đại từ) vs với nhau, lẫn nhau (phó từ)","b":"<b>Giống nhau:</b> cả hai đều có nghĩa <b>hai bên cùng có hành động như nhau</b>. Ví dụ: 我们彼此/互相都很了解对方。","r":["彼此 là <b>đại từ</b>, có thể đứng trước động từ làm <b>chủ ngữ</b>; 互相 là <b>phó từ</b>, khi đứng trước động từ thì phía trước còn cần thêm chủ ngữ.","彼此 còn có thể làm <b>tân ngữ, định ngữ</b> (不分彼此 / 彼此的爱好); 互相 <b>không</b> làm tân ngữ, định ngữ.","彼此 có thể <b>lặp lại</b> (彼此彼此), biểu thị hai bên cũng xấp xỉ nhau; 互相 <b>không</b> lặp lại."],"e":[["我们彼此/互相都很了解对方。","Wǒmen bǐcǐ/hùxiāng dōu hěn liǎojiě duìfāng.","Chúng tôi đều rất hiểu nhau."],["相处久了，彼此居然可以从表情、声音和行为举止中了解对方的意思。","Xiāngchǔ jiǔ le, bǐcǐ jūrán kěyǐ cóng biǎoqíng, shēngyīn hé xíngwéi jǔzhǐ zhōng liǎojiě duìfāng de yìsi.","Sống chung lâu ngày, hai bên vậy mà có thể hiểu ý nhau qua nét mặt, giọng nói và cử chỉ hành động. <i>(bài khoá)</i>"],["好朋友应该互相帮助。","Hǎo péngyou yīnggāi hùxiāng bāngzhù.","Bạn tốt thì nên giúp đỡ lẫn nhau."],["我们是最好的朋友，不分彼此。","Wǒmen shì zuì hǎo de péngyou, bù fēn bǐcǐ.","Chúng tôi là bạn thân nhất, chẳng phân biệt anh với tôi."],["我们彼此的爱好相同。","Wǒmen bǐcǐ de àihào xiāngtóng.","Sở thích của chúng tôi giống nhau."],["咱们俩彼此彼此，我画得比你好不了多少。","Zánmen liǎ bǐcǐ bǐcǐ, wǒ huà de bǐ nǐ hǎo bu liǎo duōshao.","Hai ta cũng chẳng hơn kém gì nhau, tôi vẽ cũng không đẹp hơn cậu là mấy."]],"d":[["你们是姐妹，应该____照顾。","彼此 / 互相"],["对同一个问题，____的认识不同，是很正常的事情。","彼此"],["我们是夫妻，各自除了孝顺自己的父母，也应该孝顺____的父母。","彼此"],["从成为大学同学以来，他们就____相爱了。","彼此"]],"w":"Mẹo: chỗ trống làm chủ ngữ đứng một mình, làm định ngữ (……的) hay tân ngữ → chỉ dùng 彼此; chỗ trống đứng sau chủ ngữ, trước động từ → cả hai thường đều được."}],"ext":[["食物","shíwù","đồ ăn, thức ăn"],["粮食","liángshi","lương thực"],["蔬菜","shūcài","rau"],["豆腐","dòufu","đậu phụ"],["辣椒","làjiāo","ớt"],["花生","huāshēng","lạc, đậu phộng"],["土豆","tǔdòu","khoai tây"],["玉米","yùmǐ","ngô, bắp"],["馒头","mántou","màn thầu"],["海鲜","hǎixiān","hải sản"],["香肠","xiāngcháng","xúc xích, lạp xưởng"]],"extt":"饮食1","notes":"Bài khoá (737 chữ) không có dòng chú thích nguồn ở cuối; bài không có mục 专名. Từ mới số 1, 8, 9, 10, 29 có dấu * (ngoài đề cương). Sách không ghi từ loại cho 朝三暮四; trường pos ghi \"thành ngữ\" do người soạn bổ sung. Bài khoá chỉ có dạng tách \"吃了亏\" nên câu ví dụ cho 吃亏 (做生意不能怕吃亏。) do người soạn tự đặt, không lấy từ sách. Bảng 扩展 (饮食1) trong sách chỉ có chữ Hán + pinyin, nghĩa tiếng Việt do người soạn bổ sung. Một số câu bài khoá dài hơn 45 chữ nhưng không có dấu ； nên giữ nguyên một câu. Drill thứ 4 của 彼此 vs 互相 lấy từ 练习3 (bỏ các ký hiệu A/B/C/D, 从成为A大学同学以来 → 从成为大学同学以来); drill thứ 4 của 倒 lấy từ 练习3 (đáp án 倒是 đặt ở vị trí B). Drill thứ 3 của ……来……去 tự đặt dựa trên 练一练(1). Cụm \"当成全天多得了的橡子\" chép đúng như sách in.","order":[{"z":"成语是汉语中非常有特点的一部分词汇。","t":["成语","是","汉语","中","非常","有","特点","的","一部分","词汇"],"v":"Thành ngữ là một bộ phận từ vựng rất đặc sắc trong tiếng Hán."},{"z":"成语有固定的结构，不能随便更改；","t":["成语","有","固定","的","结构","不能","随便","更改"],"v":"Thành ngữ có kết cấu cố định, không thể tùy tiện sửa đổi;"},{"z":"从前有位老人，喂养了一群猴子当宠物。","t":["从前","有位","老人","喂养","了","一群","猴子","当","宠物"],"v":"Ngày xưa có một ông lão nuôi một bầy khỉ làm thú cưng."},{"z":"他注意到该限制猴子的食量了。","t":["他","注意","到","该","限制","猴子","的","食量","了"],"v":"Ông nhận ra đã đến lúc phải hạn chế khẩu phần ăn của lũ khỉ."},{"z":"我早上给你们三颗，晚上给四颗。","t":["我","早上","给","你们","三颗","晚上","给","四颗"],"v":"Buổi sáng ta cho các ngươi ba hạt, buổi tối cho bốn hạt.\""},{"z":"老人看着这情景，哈哈地笑了。","t":["老人","看着","这","情景","哈哈地笑","了"],"v":"Ông lão nhìn cảnh tượng ấy mà cười ha hả."},{"z":"你知道它现在是什么意思吗？","t":["你","知道","它","现在","是","什么","意思","吗"],"v":"Bạn có biết bây giờ nó mang nghĩa gì không?"},{"z":"少年不解地问：“怎么勇敢反倒成为缺点了？","t":["少年","不解","地问","怎么","勇敢","反倒","成为","缺点","了"],"v":"Cậu thiếu niên khó hiểu hỏi: \"Sao dũng cảm lại thành ra khuyết điểm vậy?\""},{"z":"我倒要认识认识。","t":["我","倒","要","认识","认识"],"v":"Có người như thế sao? Vậy tôi lại muốn làm quen thử xem."},{"z":"质量倒是挺好，就是价格太贵了。","t":["质量","倒","是","挺","好","就是","价格","太贵","了"],"v":"Chất lượng thì khá tốt đấy, chỉ có điều giá đắt quá."},{"z":"你究竟去还是不去？","t":["你","究竟","去","还是","不去"],"v":"Rốt cuộc cậu đi hay không đi? Nói một câu đi chứ!"},{"z":"你倒是说说看，这件事你不负责谁负责？","t":["你","倒","是","说说看","这件","事","你","不","负责","谁","负责"],"v":"Anh nói thử xem, việc này anh không chịu trách nhiệm thì ai chịu?"},{"z":"小狗追着自己的尾巴，在草地上跑来跑去。","t":["小狗","追着","自己","的","尾巴","在","草地","上","跑来跑去"],"v":"Chú chó con đuổi theo cái đuôi của mình, chạy tới chạy lui trên bãi cỏ."},{"z":"他们研究来讨论去，还是没找出原因。","t":["他们","研究","来","讨论","去","还是",
