 trong tứ hợp viện liền trở thành một môi trường nhỏ khép kín."},{"h":"打交道","p":"dǎ jiāodào","v":"giao thiệp, tiếp xúc","k":"đgt.","x":0,"ez":"住在四合院里的人不常与周围的邻居打交道。","ev":"Người sống trong tứ hợp viện không hay giao thiệp với hàng xóm xung quanh."},{"h":"日子","p":"rìzi","v":"cuộc sống","k":"dt.","x":0,"ez":"在小院里，一家人过着与世无争的日子，充分享受家庭的乐趣，自然有一种令人感到自在亲切的气氛。","ev":"Trong khoảng sân nhỏ, cả nhà sống những ngày tháng yên bình, chẳng tranh giành với đời, tận hưởng trọn vẹn niềm vui gia đình, tự nhiên toát lên một bầu không khí khiến người ta thấy thoải mái, thân thiết."},{"h":"充分","p":"chōngfèn","v":"đầy đủ, trọn vẹn","k":"tt.","x":0,"ez":"在小院里，一家人过着与世无争的日子，充分享受家庭的乐趣，自然有一种令人感到自在亲切的气氛。","ev":"Trong khoảng sân nhỏ, cả nhà sống những ngày tháng yên bình, chẳng tranh giành với đời, tận hưởng trọn vẹn niềm vui gia đình, tự nhiên toát lên một bầu không khí khiến người ta thấy thoải mái, thân thiết."},{"h":"令","p":"lìng","v":"khiến, làm cho","k":"đgt.","x":0,"ez":"在小院里，一家人过着与世无争的日子，充分享受家庭的乐趣，自然有一种令人感到自在亲切的气氛。","ev":"Trong khoảng sân nhỏ, cả nhà sống những ngày tháng yên bình, chẳng tranh giành với đời, tận hưởng trọn vẹn niềm vui gia đình, tự nhiên toát lên một bầu không khí khiến người ta thấy thoải mái, thân thiết."},{"h":"亲切","p":"qīnqiè","v":"thân mật, thân thiết","k":"tt.","x":0,"ez":"在小院里，一家人过着与世无争的日子，充分享受家庭的乐趣，自然有一种令人感到自在亲切的气氛。","ev":"Trong khoảng sân nhỏ, cả nhà sống những ngày tháng yên bình, chẳng tranh giành với đời, tận hưởng trọn vẹn niềm vui gia đình, tự nhiên toát lên một bầu không khí khiến người ta thấy thoải mái, thân thiết."},{"h":"劳动","p":"láodòng","v":"lao động, công việc; làm việc, lao động (bằng chân tay)","k":"dt./đgt.","x":0,"ez":"但也有多户合住一座四合院的情况，被称为“大杂院”，住户多为普通劳动人民。","ev":"Nhưng cũng có trường hợp nhiều hộ cùng ở chung một tứ hợp viện, được gọi là “đại tạp viện”, cư dân phần lớn là người lao động bình thường."},{"h":"人民","p":"rénmín","v":"nhân dân","k":"dt.","x":0,"ez":"但也有多户合住一座四合院的情况，被称为“大杂院”，住户多为普通劳动人民。","ev":"Nhưng cũng có trường hợp nhiều hộ cùng ở chung một tứ hợp viện, được gọi là “đại tạp viện”, cư dân phần lớn là người lao động bình thường."},{"h":"矛盾","p":"máodùn","v":"sự mâu thuẫn; mâu thuẫn","k":"dt./tt.","x":0,"ez":"邻里之间有时虽然也有矛盾，但更多时候是互帮互助，不是亲人胜过亲人，这种浓浓的情感是许多老北京人无法忘记的。","ev":"Giữa hàng xóm láng giềng tuy đôi khi cũng có mâu thuẫn, nhưng phần nhiều là giúp đỡ lẫn nhau, không phải ruột thịt mà còn hơn cả ruột thịt; thứ tình cảm đậm đà ấy là điều mà nhiều người Bắc Kinh xưa không thể nào quên."},{"h":"浓","p":"nóng","v":"sâu sắc, đậm","k":"tt.","x":0,"ez":"邻里之间有时虽然也有矛盾，但更多时候是互帮互助，不是亲人胜过亲人，这种浓浓的情感是许多老北京人无法忘记的。","ev":"Giữa hàng xóm láng giềng tuy đôi khi cũng có mâu thuẫn, nhưng phần nhiều là giúp đỡ lẫn nhau, không phải ruột thịt mà còn hơn cả ruột thịt; thứ tình cảm đậm đà ấy là điều mà nhiều người Bắc Kinh xưa không thể nào quên."}]],"texts":[{"no":1,"tz":"北京的四合院","tv":"Tứ hợp viện Bắc Kinh","lines":[{"s":"","z":"四合院，是中国华北地区民居中的一种组合建筑形式。","p":"Sìhéyuàn, shì Zhōngguó Huáběi dìqū mínjū zhōng de yì zhǒng zǔhé jiànzhù xíngshì.","v":"Tứ hợp viện là một hình thức kiến trúc tổ hợp trong nhà ở dân gian vùng Hoa Bắc, Trung Quốc."},{"s":"","z":"所谓四合，“四”指东、西、南、北四面，“合”就是四面房屋围在一起，中间形成一个方形的院子。","p":"Suǒwèi sìhé, “sì” zhǐ dōng, xī, nán, běi sì miàn, “hé” jiù shì sì miàn fángwū wéi zài yìqǐ, zhōngjiān xíngchéng yí ge fāngxíng de yuànzi.","v":"Cái gọi là “tứ hợp” thì “tứ” chỉ bốn phía đông, tây, nam, bắc, còn “hợp” nghĩa là nhà cửa bốn phía quây lại với nhau, ở giữa tạo thành một khoảng sân hình vuông."},{"s":"","z":"四合院在中国汉族民居中历史最悠久，分布最广泛。","p":"Sìhéyuàn zài Zhōngguó Hànzú mínjū zhōng lìshǐ zuì yōujiǔ, fēnbù zuì guǎngfàn.","v":"Trong các kiểu nhà ở dân gian của người Hán ở Trung Quốc, tứ hợp viện có lịch sử lâu đời nhất và phân bố rộng rãi nhất."},{"s":"","z":"不过，只要人们一提到四合院，便自然会想到北京四合院，这是因为传统的北京四合院都有一套固定的样式，十分具有代表性，在各种各样的四合院中，北京四合院可以代表其主要特点。","p":"Búguò, zhǐyào rénmen yì tídào sìhéyuàn, biàn zìrán huì xiǎngdào Běijīng sìhéyuàn, zhè shì yīnwèi chuántǒng de Běijīng sìhéyuàn dōu yǒu yí tào gùdìng de yàngshì, shífēn jùyǒu dàibiǎoxìng, zài gèzhǒng-gèyàng de sìhéyuàn zhōng, Běijīng sìhéyuàn kěyǐ dàibiǎo qí zhǔyào tèdiǎn.","v":"Tuy vậy, hễ nhắc đến tứ hợp viện là người ta tự nhiên nghĩ ngay đến tứ hợp viện Bắc Kinh, bởi tứ hợp viện Bắc Kinh truyền thống đều có một kiểu dáng cố định, rất tiêu biểu; trong muôn vàn kiểu tứ hợp viện, tứ hợp viện Bắc Kinh có thể đại diện cho những đặc điểm chủ yếu của chúng."}]},{"no":2,"tz":"","tv":"","lines":[{"s":"","z":"北京有各种规模的四合院。","p":"Běijīng yǒu gè zhǒng guīmó de sìhéyuàn.","v":"Bắc Kinh có tứ hợp viện với đủ mọi quy mô."},{"s":"","z":"最简单的四合院只有一个院子，比较复杂的有两三个，而有钱人家的，通常是由好几座四合院并列组成的。","p":"Zuì jiǎndān de sìhéyuàn zhǐ yǒu yí ge yuànzi, bǐjiào fùzá de yǒu liǎng-sān ge, ér yǒu qián rénjiā de, tōngcháng shì yóu hǎo jǐ zuò sìhéyuàn bìngliè zǔchéng de.","v":"Tứ hợp viện đơn giản nhất chỉ có một khoảng sân, loại phức tạp hơn có hai ba sân, còn của những nhà giàu có thì thường do mấy tòa tứ hợp viện nằm song song hợp thành."},{"s":"","z":"大门一般开在东南角或西北角，院中的北房是正房，比其他房屋的规模大，一般包括长辈的卧室和具备日常起居、接待客人等功能的客厅。","p":"Dàmén yìbān kāi zài dōngnán jiǎo huò xīběi jiǎo, yuàn zhōng de běi fáng shì zhèngfáng, bǐ qítā fángwū de guīmó dà, yìbān bāokuò zhǎngbèi de wòshì hé jùbèi rìcháng qǐjū, jiēdài kèrén děng gōngnéng de kètīng.","v":"Cổng lớn thường mở ở góc đông nam hoặc góc tây bắc; dãy nhà phía bắc trong sân là nhà chính, quy mô lớn hơn các dãy nhà khác, thường gồm phòng ngủ của bậc bề trên và phòng khách có đủ các chức năng như sinh hoạt hằng ngày, tiếp đãi khách khứa."},{"s":"","z":"院子的两边是东西厢房，是晚辈们生活的地方。","p":"Yuànzi de liǎngbiān shì dōng xī xiāngfáng, shì wǎnbèimen shēnghuó de dìfang.","v":"Hai bên sân là dãy nhà chái phía đông và phía tây, nơi con cháu sinh sống."},{"s":"","z":"在正房和厢房之间建有走廊，可以供人行走和休息。","p":"Zài zhèngfáng hé xiāngfáng zhījiān jiàn yǒu zǒuláng, kěyǐ gōng rén xíngzǒu hé xiūxi.","v":"Giữa nhà chính và nhà chái có xây hành lang để mọi người đi lại và nghỉ ngơi."},{"s":"","z":"院子是十分理想的室外生活空间。","p":"Yuànzi shì shífēn lǐxiǎng de shìwài shēnghuó kōngjiān.","v":"Khoảng sân là không gian sinh hoạt ngoài trời vô cùng lý tưởng."},{"s":"","z":"有的人家喜欢种草、养花、种竹子，有的人家则喜欢用大盆养金鱼。","p":"Yǒude rénjiā xǐhuan zhòng cǎo, yǎng huā, zhòng zhúzi, yǒude rénjiā zé xǐhuan yòng dà pén yǎng jīnyú.","v":"Có nhà thích trồng cỏ, trồng hoa, trồng trúc, trong khi có nhà lại thích nuôi cá vàng trong những chậu lớn."},{"s":"","z":"院子不仅拉近了人与自然的关系，也让家里人在此得到了感情的交流，对创造生活情趣起了很大作用，因而最为人们所喜爱。","p":"Yuànzi bùjǐn lājìnle rén yǔ zìrán de guānxi, yě ràng jiā li rén zài cǐ dédàole gǎnqíng de jiāoliú, duì chuàngzào shēnghuó qíngqù qǐle hěn dà zuòyòng, yīn'ér zuì wéi rénmen suǒ xǐ'ài.","v":"Khoảng sân không chỉ kéo con người lại gần thiên nhiên hơn mà còn giúp người trong nhà giao lưu tình cảm với nhau, góp phần rất lớn vào việc tạo nên thú vị cho cuộc sống, vì vậy được mọi người yêu thích nhất."}]},{"no":3,"tz":"","tv":"","lines":[{"s":"","z":"只要关闭起大门，四合院内便形成一个封闭式的小环境。","p":"Zhǐyào guānbì qǐ dàmén, sìhéyuàn nèi biàn xíngchéng yí ge fēngbìshì de xiǎo huánjìng.","v":"Chỉ cần đóng cổng lớn lại, bên trong tứ hợp viện liền trở thành một môi trường nhỏ khép kín."},{"s":"","z":"住在四合院里的人不常与周围的邻居打交道。","p":"Zhù zài sìhéyuàn li de rén bù cháng yǔ zhōuwéi de línjū dǎ jiāodao.","v":"Người sống trong tứ hợp viện không hay giao thiệp với hàng xóm xung quanh."},{"s":"","z":"在小院里，一家人过着与世无争的日子，充分享受家庭的乐趣，自然有一种令人感到自在亲切的气氛。","p":"Zài xiǎo yuàn li, yì jiā rén guòzhe yǔ shì wú zhēng de rìzi, chōngfèn xiǎngshòu jiātíng de lèqù, zìrán yǒu yì zhǒng lìng rén gǎndào zìzai qīnqiè de qìfēn.","v":"Trong khoảng sân nhỏ, cả nhà sống những ngày tháng yên bình, chẳng tranh giành với đời, tận hưởng trọn vẹn niềm vui gia đình, tự nhiên toát lên một bầu không khí khiến người ta thấy thoải mái, thân thiết."},{"s":"","z":"但也有多户合住一座四合院的情况，被称为“大杂院”，住户多为普通劳动人民。","p":"Dàn yě yǒu duō hù hé zhù yí zuò sìhéyuàn de qíngkuàng, bèi chēngwéi “dàzáyuàn”, zhùhù duō wéi pǔtōng láodòng rénmín.","v":"Nhưng cũng có trường hợp nhiều hộ cùng ở chung một tứ hợp viện, được gọi là “đại tạp viện”, cư dân phần lớn là người lao động bình thường."},{"s":"","z":"邻里之间有时虽然也有矛盾，但更多时候是互帮互助，不是亲人胜过亲人，这种浓浓的情感是许多老北京人无法忘记的。","p":"Línlǐ zhījiān yǒushí suīrán yě yǒu máodùn, dàn gèng duō shíhou shì hù bāng hù zhù, bú shì qīnrén shèngguò qīnrén, zhè zhǒng nóngnóng de qínggǎn shì xǔduō lǎo Běijīngrén wúfǎ wàngjì de.","v":"Giữa hàng xóm láng giềng tuy đôi khi cũng có mâu thuẫn, nhưng phần nhiều là giúp đỡ lẫn nhau, không phải ruột thịt mà còn hơn cả ruột thịt; thứ tình cảm đậm đà ấy là điều mà nhiều người Bắc Kinh xưa không thể nào quên."}]}],"gram":[{"id":"suowei","t":"所谓","s":"cái gọi là (tính từ)","b":"<b>所谓</b> là <b>tính từ</b>, có hai cách dùng theo sách. (1) Chỉ <b>“cái thường được gọi là”</b>, hay dùng để nêu ra một từ ngữ cần giải thích rồi giải thích nó. (2) Chỉ <b>“cái mà một số người gọi là”</b>, thường mang ý <b>không đồng tình, không thừa nhận</b> điều người khác nói. Từ ngữ được nhắc tới thường đặt trong ngoặc kép.","r":["Nêu khái niệm rồi giải thích: 所谓 + từ ngữ，(就是) + lời giải thích (所谓四合，“四”指……，“合”就是……)","Chốt lại bằng một khái niệm: ……，这就是所谓的“……”","Ý phủ nhận, không thừa nhận: (某人/某处)所谓的“X” + 其实…… (他所谓的“新闻”，其实我们早就知道了)","Khi đứng trước danh từ làm định ngữ thường thêm 的: 所谓的“健康食品”"],"e":[["很多时候，烦恼是自己找来的，这就是所谓的“自寻烦恼”。","Hěn duō shíhou, fánnǎo shì zìjǐ zhǎo lái de, zhè jiù shì suǒwèi de “zì xún fánnǎo”.","Nhiều khi phiền não là do mình tự chuốc lấy, đó chính là cái gọi là “tự tìm phiền não”."],["所谓四合，“四”指东、西、南、北四面，“合”就是四面房屋围在一起，中间形成一个方形的院子。","Suǒwèi sìhé, “sì” zhǐ dōng, xī, nán, běi sì miàn, “hé” jiù shì sì miàn fángwū wéi zài yìqǐ, zhōngjiān xíngchéng yí ge fāngxíng de yuànzi.","Cái gọi là “tứ hợp” thì “tứ” chỉ bốn phía đông, tây, nam, bắc, còn “hợp” nghĩa là nhà cửa bốn phía quây lại với nhau, ở giữa tạo thành một khoảng sân hình vuông. <i>(bài khoá)</i>"],["他所谓的“新闻”，其实我们早就知道了！","Tā suǒwèi de “xīnwén”, qíshí wǒmen zǎo jiù zhīdào le!","Cái mà anh ta gọi là “tin mới” thật ra bọn mình biết từ lâu rồi!"],["现在市场上所谓的“健康食品”其实没有统一的标准。","Xiànzài shìchǎng shang suǒwèi de “jiànkāng shípǐn” qíshí méiyǒu tǒngyī de biāozhǔn.","Những thứ gọi là “thực phẩm tốt cho sức khỏe” trên thị trường hiện nay thật ra chẳng có tiêu chuẩn thống nhất nào."]],"d":[["很多时候，烦恼是自己找来的，这就是____的“自寻烦恼”。","所谓"],["他____的“新闻”，其实我们早就知道了！","所谓"],["____四合，“四”指东、西、南、北四面，“合”就是四面房屋围在一起。","所谓"]],"w":"Nghĩa thứ hai của 所谓 mang sắc thái chê, không tin (≈ “cái gọi là… thực ra…”), thường đi với 其实; đừng dùng khi muốn khen."},{"id":"ze","t":"则","s":"(lượng từ) mẩu, bài; (liên từ) còn…thì, thì","b":"<b>则</b> có hai từ loại. <b>Lượng từ</b>: dùng cho những đoạn văn ngắn thành bài hoặc thành mục (一则新闻, 两则成语故事). <b>Liên từ</b>: cấu trúc thường gặp <b>A……，(而) B则……</b>, biểu thị sự <b>đối chiếu</b> giữa hai vế trước và sau. Ngoài ra 则 còn biểu thị <b>quan hệ nhân quả</b>, thường dùng trong văn viết, tương đương với <b>就</b> trong khẩu ngữ.","r":["Lượng từ: số từ + 则 + 新闻/故事/广告… (một mẩu tin, hai câu chuyện)","Đối chiếu: A……，(而) B则…… — 则 đứng sau chủ ngữ của vế sau (而狗则是……, 有的人家则喜欢……)","Nhân quả (văn viết) = 就: 有风则寒，无风则暖; 欲速则不达"],"e":[["在第七课，我们学习了两则成语故事。","Zài dì-qī kè, wǒmen xuéxíle liǎng zé chéngyǔ gùshi.","Ở bài 7, chúng ta đã học hai mẩu chuyện thành ngữ."],["今天的报纸上有一则非常重要的新闻。","Jīntiān de bàozhǐ shang yǒu yì zé fēicháng zhòngyào de xīnwén.","Trên báo hôm nay có một mẩu tin rất quan trọng."],["猫享受独处的快乐，而狗则是希望和别人分享快乐。","Māo xiǎngshòu dúchǔ de kuàilè, ér gǒu zé shì xīwàng hé biéren fēnxiǎng kuàilè.","Mèo tận hưởng niềm vui khi ở một mình, còn chó thì lại mong được chia sẻ niềm vui với người khác."],["有的人家喜欢种草、养花、种竹子，有的人家则喜欢用大盆养金鱼。","Yǒude rénjiā xǐhuan zhòng cǎo, yǎng huā, zhòng zhúzi, yǒude rénjiā zé xǐhuan yòng dà pén yǎng jīnyú.","Có nhà thích trồng cỏ, trồng hoa, trồng trúc, trong khi có nhà lại thích nuôi cá vàng trong những chậu lớn. <i>(bài khoá)</i>"],["北京的冬天，有风则寒，无风则暖。","Běijīng de dōngtiān, yǒu fēng zé hán, wú fēng zé nuǎn.","Mùa đông ở Bắc Kinh, có gió thì lạnh, không có gió thì ấm."],["“欲速则不达”，人生不能总是要求“快”，其实，“慢”也是一种生活的艺术。","“Yù sù zé bù dá”, rénshēng bù néng zǒngshì yāoqiú “kuài”, qíshí, “màn” yě shì yì zhǒng shēnghuó de yìshù.","“Dục tốc bất đạt”, đời người không thể lúc nào cũng đòi “nhanh”, thật ra “chậm” cũng là một nghệ thuật sống."]],"d":[["今天的报纸上有一____非常重要的新闻。","则"],["猫享受独处的快乐，而狗____是希望和别人分享快乐。","则"],["北京的冬天，有风则寒，无风____暖。","则"]],"w":"则 (liên từ) đứng sau chủ ngữ của vế sau, khác 但是/而 đứng đầu vế: ✗ 则狗希望…… → ✓ 而狗则是希望……"},{"id":"weisuo","t":"为……所……","s":"bị/được … (cấu trúc bị động, văn viết)","b":"<b>为……所……</b> là <b>cấu trúc cố định</b>, chủ yếu dùng trong <b>văn viết</b>; ở đây <b>为</b> (wéi) mang nghĩa của <b>被</b> (bị, được). Mẫu câu: đối tượng chịu tác động + <b>为</b> + người/vật gây tác động + <b>所</b> + động từ.","r":["Mẫu: A + 为 + B + 所 + động từ (A bị/được B …): 为他认真的工作态度所感动","Trước 为 có thể thêm phó từ, trạng ngữ: 更好地为人所用, 最为人们所喜爱","Hay đi với động từ chỉ cảm xúc, đánh giá hoặc sử dụng: 感动、喜爱、用……"],"e":[["认识他的人，没有人不为他认真的工作态度所感动。","Rènshi tā de rén, méiyǒu rén bù wéi tā rènzhēn de gōngzuò tàidu suǒ gǎndòng.","Những ai quen biết anh ấy, không người nào không cảm động trước thái độ làm việc nghiêm túc của anh."],["有了科学，大自然就可以更好地为人所用。","Yǒule kēxué, dàzìrán jiù kěyǐ gèng hǎo de wéi rén suǒ yòng.","Có khoa học, thiên nhiên có thể được con người sử dụng tốt hơn."],["院子不仅拉近了人与自然的关系，也让家里人在此得到了感情的交流，对创造生活情趣起了很大作用，因而最为人们所喜爱。","Yuànzi bùjǐn lājìnle rén yǔ zìrán de guānxi, yě ràng jiā li rén zài cǐ dédàole gǎnqíng de jiāoliú, duì chuàngzào shēnghuó qíngqù qǐle hěn dà zuòyòng, yīn'ér zuì wéi rénmen suǒ xǐ'ài.","Khoảng sân không chỉ kéo con người lại gần thiên nhiên hơn mà còn giúp người trong nhà giao lưu tình cảm với nhau, góp phần rất lớn vào việc tạo nên thú vị cho cuộc sống, vì vậy được mọi người yêu thích nhất. <i>(bài khoá)</i>"]],"d":[["认识他的人，没有人不____他认真的工作态度所感动。","为"],["有了科学，大自然就可以更好地为人____用。","所"],["院子对创造生活情趣起了很大作用，因而最____人们所喜爱。","为"]],"w":"为 trong cấu trúc này đọc là <b>wéi</b> (thanh 2), không đọc wèi; sắc thái trang trọng hơn 被, ít dùng trong khẩu ngữ."},{"id":"qi","t":"起","s":"(động từ) đứng sau động từ: nối, gắn kết, cố định lại","b":"<b>起</b> là <b>động từ</b>. Cấu trúc <b>động từ + 起</b> biểu thị sự <b>nối liền, kết hợp và cố định</b> lại: hai vật được nối với nhau, hoặc một trạng thái/một thứ được xác lập cố định.","r":["Nối liền, kết hợp: 拉起手 (nắm lấy tay nhau)","Khép lại, cố định: 关闭起大门 (đóng chặt cổng lại)","Xác lập nên: 建立起一套……的制度 (xây dựng nên một chế độ)","Sau 动词 + 起 thường có tân ngữ: 拉起手、关闭起大门、建立起一套制度"],"e":[["拉起手，我们就是好朋友。","Lāqǐ shǒu, wǒmen jiù shì hǎo péngyou.","Nắm tay nhau rồi, chúng ta là bạn tốt."],["只要关闭起大门，四合院内便形成一个封闭式的小环境。","Zhǐyào guānbì qǐ dàmén, sìhéyuàn nèi biàn xíngchéng yí ge fēngbìshì de xiǎo huánjìng.","Chỉ cần đóng cổng lớn lại, bên trong tứ hợp viện liền trở thành một môi trường nhỏ khép kín. <i>(bài khoá)</i>"],["对公司来说，最重要的是建立起一套行之有效的制度。","Duì gōngsī lái shuō, zuì zhòngyào de shì jiànlì qǐ yí tào xíng zhī yǒuxiào de zhìdù.","Đối với công ty, điều quan trọng nhất là xây dựng được một chế độ thiết thực, hiệu quả."]],"d":[["拉____手，我们就是好朋友。","起"],["只要关闭____大门，四合院内便形成一个封闭式的小环境。","起"],["对公司来说，最重要的是建立____一套行之有效的制度。","起"]],"w":""},{"id":"tongchang_changchang","t":"通常 vs 常常","s":"thường, thông thường — so sánh","b":"<b>Giống nhau:</b> cả hai đều biểu thị một hành động <b>thường xuyên xảy ra</b>; trong một số câu có thể thay cho nhau, nhưng ý nhấn mạnh khác nhau. Ví dụ: 我通常/常常在学校外面那个超市买东西。","r":["<b>通常</b> nhấn mạnh hành động diễn ra <b>có quy luật</b> (theo lệ thường): 有钱人家的，通常是由好几座四合院并列组成的。","<b>常常</b> nhấn mạnh hành động <b>xảy ra nhiều lần</b>: 他成绩很好，常常受到表扬。","<b>通常</b> là tính từ, <b>có thể làm định ngữ</b>: 我们通常的做法都是这样的。","<b>常常</b> là phó từ, <b>không làm định ngữ và không bổ nghĩa cho cả phân câu</b>: 他常常去上海出差，对上海很熟悉。"],"e":[["我通常/常常在学校外面那个超市买东西。","Wǒ tōngcháng/chángcháng zài xuéxiào wàimiàn nàge chāoshì mǎi dōngxi.","Tôi thường mua đồ ở cái siêu thị bên ngoài trường."],["有钱人家的，通常是由好几座四合院并列组成的。","Yǒu qián rénjiā de, tōngcháng shì yóu hǎo jǐ zuò sìhéyuàn bìngliè zǔchéng de.","Của những nhà giàu có thì thường do mấy tòa tứ hợp viện nằm song song hợp thành. <i>(bài khoá)</i>"],["我们通常的做法都是这样的。","Wǒmen tōngcháng de zuòfǎ dōu shì zhèyàng de.","Cách làm thông thường của chúng tôi đều như thế này."],["他成绩很好，常常受到表扬。","Tā chéngjì hěn hǎo, chángcháng shòudào biǎoyáng.","Cậu ấy học giỏi nên thường xuyên được khen."],["他常常去上海出差，对上海很熟悉。","Tā chángcháng qù Shànghǎi chūchāi, duì Shànghǎi hěn shúxī.","Anh ấy hay đi công tác Thượng Hải nên rất thông thạo Thượng Hải."]],"d":[["她____在家帮妈妈干活儿。","常常"],["____除夕晚上都要放鞭炮、吃饺子。","通常"],["在____情况下，火车是不会晚点的。","通常"],["周末他____去父母家过。","通常 / 常常 (đều được)"]],"w":"Mẹo: đứng trước danh từ (通常的做法, 通常情况下) hoặc mở đầu cả phân câu → chỉ dùng 通常; nhấn “nhiều lần, hay” (常常受到表扬) → dùng 常常."}],"ext":[["屋子","wūzi","phòng, căn phòng"],["卧室","wòshì","phòng ngủ"],["阳台","yángtái","ban công"],["台阶","táijiē","bậc thềm"],["墙","qiáng","tường"],["玻璃","bōli","kính, thủy tinh"],["宿舍","sùshè","ký túc xá"],["公寓","gōngyù","căn hộ, chung cư"],["单元","dānyuán","đơn nguyên (khối/cầu thang trong tòa nhà)"],["隔壁","gébì","nhà bên cạnh, sát vách"],["大厦","dàshà","tòa nhà lớn, cao ốc"],["广场","guǎngchǎng","quảng trường"]],"extt":"建筑","notes":"Dòng chú thích nguồn cuối bài: 改编自百度文库《建筑欣赏之四合院》. Bài khoá (617字) chép từ trang A116–A118, chia 3 đoạn theo ranh giới đoạn văn: đoạn 1 = đoạn văn thứ nhất (từ 1–10 + 专名 华北), đoạn 2 = đoạn “北京有各种规模的四合院……” (từ 11–30), đoạn 3 = đoạn cuối “只要关闭起大门……” (từ 31–41). Từ có dấu * (ngoài đề cương): 1 四合院, 2 民居, 12 并列, 17 起居, 20 厢房, 21 走廊, 23 种, 26 金鱼, 28 情趣, 32 封闭. Câu cuối đoạn 1 dài (>45 chữ) nhưng không có dấu ； nên giữ nguyên một dòng. Pinyin từ 33 打交道 giữ theo cách in của sách (dǎ jiāodào); trong pinyin câu bài khoá ghi thanh nhẹ dǎ jiāodao. Từ 通常 trong bảng từ mới ghi “phó.”, còn bảng 词语辨析 của sách lại xếp 通常 là 形容词 (có thể làm định ngữ) — đã giữ nguyên cả hai theo sách. Ví dụ (6) của 则 trong sách có chú thích 欲 (yù, muốn) và ví dụ (3) của 起 có chú thích 建立 (jiànlì, thiết lập) — đã lược phần chú thích khỏi câu ví dụ. Drill 通常/常常 lấy từ 做一做 (câu 1 sách đã cho đáp án 常常; câu 4 cả hai đều điền được, do người soạn tự giải). Các drill khác (所谓, 则, 为……所……, 起) tự đặt từ câu ví dụ của sách vì 练一练 là bài hoàn thành câu mở. Bảng 扩展 (建筑) trong sách chỉ có chữ Hán + pinyin, nghĩa tiếng Việt do người soạn bổ sung. Bảng 词语搭配 và phần 练习 (1–4), 运用 không đưa vào JSON.","order":[{"z":"四合院，是中国华北地区民居中的一种组合建筑形式。","t":["四合院","是","中国华北地区","民居","中","的","一种","组合","建筑","形式"],"v":"Tứ hợp viện là một hình thức kiến trúc tổ hợp trong nhà ở dân gian vùng Hoa Bắc, Trung Quốc."},{"z":"北京有各种规模的四合院。","t":["北京","有","各种","规模","的","四合院"],"v":"Bắc Kinh có tứ hợp viện với đủ mọi quy mô."},{"z":"院子是十分理想的室外生活空间。","t":["院子","是","十分","理想","的","室外","生活空间"],"v":"Khoảng sân là không gian sinh hoạt ngoài trời vô cùng lý tưởng."},{"z":"他所谓的“新闻”，其实我们早就知道了！","t":["他","所谓","的","新闻","其实","我们","早就","知道","了"],"v":"Cái mà anh ta gọi là “tin mới” thật ra bọn mình biết từ lâu rồi!"},{"z":"在第七课，我们学习了两则成语故事。","t":["在","第七课","我们","学习","了","两则","成语故事"],"v":"Ở bài 7, chúng ta đã học hai mẩu chuyện thành ngữ."},{"z":"今天的报纸上有一则非常重要的新闻。","t":["今天","的","报纸","上","有","一则","非常","重要","的","新闻"],"v":"Trên báo hôm nay có một mẩu tin rất quan trọng."},{"z":"北京的冬天，有风则寒，无风则暖。","t":["北京","的","冬天","有风","则","寒","无风","则","暖"],"v":"Mùa đông ở Bắc Kinh, có gió thì lạnh, không có gió thì ấm."},{"z":"有了科学，大自然就可以更好地为人所用。","t":["有","了","科学","大自然","就","可以","更好","地","为人所用"],"v":"Có khoa học, thiên nhiên có thể được con người sử dụng tốt hơn."},{"z":"拉起手，我们就是好朋友。","t":["拉起","手","我们","就是","好","朋友"],"v":"Nắm tay nhau rồi, chúng ta là bạn tốt."},{"z":"我通常/常常在学校外面那个超市买东西。","t":["我","通常","/","常常","在","学校","外面","那个","超市","买","东西"],"v":"Tôi thường mua đồ ở cái siêu thị bên ngoài trường."},{"z":"有钱人家的，通常是由好几座四合院并列组成的。","t":["有钱","人家","的","通常","是","由","好几座","四合院","并列","组成","的"],"v":"Của những nhà giàu có thì thường do mấy tòa tứ hợp viện nằm song song hợp thành. (bài khoá)"},{"z":"我们通常的做法都是这样的。","t":["我们","通常","的","做法","都","是","这样","的"],"v":"Cách làm thông thường của chúng tôi đều như thế này."},{"z":"他成绩很好，常常受到表扬。","t":["他","成绩","很","好","常常","受到","表扬"],"v":"Cậu ấy học giỏi nên thườn , jiùshì fùqin Zhào Shē yě nán bu zhù tā.","v":"Vào cuối thời Chiến quốc hơn hai nghìn bảy trăm năm trước, danh tướng nước Triệu là Triệu Xa có một người con trai tên Triệu Quát; từ nhỏ cậu đã đọc không ít binh thư, hễ bàn chuyện quân sự với ai thì không ai nói lại được cậu, ngay cả cha cậu là Triệu Xa cũng không làm khó được cậu."},{"s":"","z":"赵括因此很骄傲，自以为天下无敌，连父亲也不放在眼里。","p":"Zhào Kuò yīncǐ hěn jiāo'ào, zì yǐwéi tiānxià wúdí, lián fùqin yě bú fàng zài yǎn li.","v":"Vì thế Triệu Quát rất kiêu ngạo, tự cho mình là thiên hạ vô địch, đến cha mình cũng chẳng coi ra gì."},{"s":"","z":"但是赵奢心里明白，自己的儿子虽然对军事理论都很了解，但是没有实际作战的经验，想法很不符合实际。","p":"Dànshì Zhào Shē xīnli míngbai, zìjǐ de érzi suīrán duì jūnshì lǐlùn dōu hěn liǎojiě, dànshì méiyǒu shíjì zuòzhàn de jīngyàn, xiǎngfǎ hěn bù fúhé shíjì.","v":"Nhưng trong lòng Triệu Xa hiểu rõ, con trai mình tuy rất am hiểu lý luận quân sự nhưng không hề có kinh nghiệm đánh trận thực tế, cách nghĩ rất xa rời thực tế."},{"s":"","z":"他曾经偷偷对妻子说：“儿子的毛病是只会讲大道理，缺乏实际锻炼，不能当大将。","p":"Tā céngjīng tōutōu duì qīzi shuō: “Érzi de máobing shì zhǐ huì jiǎng dà dàolǐ, quēfá shíjì duànliàn, bù néng dāng dàjiàng.","v":"Ông từng lén nói với vợ: \"Tật xấu của con mình là chỉ biết nói đạo lý to tát, thiếu rèn luyện thực tế, không thể làm đại tướng được."},{"s":"","z":"如果让他当了大将，迟早会害了赵国。”","p":"Rúguǒ ràng tā dāngle dàjiàng, chízǎo huì hàile Zhàoguó.”","v":"Nếu để nó làm đại tướng thì sớm muộn gì cũng hại nước Triệu.\""}]},{"no":2,"tz":"","tv":"","lines":[{"s":"","z":"几年后，赵奢去世了。","p":"Jǐ nián hòu, Zhào Shē qùshì le.","v":"Vài năm sau, Triệu Xa qua đời."},{"s":"","z":"这一年正好秦国军队来打赵国，赵国派老将廉颇带20万大军迎战。","p":"Zhè yì nián zhènghǎo Qínguó jūnduì lái dǎ Zhàoguó, Zhàoguó pài lǎojiàng Lián Pō dài èrshí wàn dàjūn yíngzhàn.","v":"Đúng năm đó quân đội nước Tần kéo đến đánh nước Triệu, nước Triệu cử lão tướng Liêm Pha dẫn 200.000 đại quân ra nghênh chiến."},{"s":"","z":"廉颇根据敌强我弱的形势，命令士兵们坚守阵地，绝对不可主动出战。","p":"Lián Pō gēnjù dí qiáng wǒ ruò de xíngshì, mìnglìng shìbīngmen jiānshǒu zhèndì, juéduì bù kě zhǔdòng chūzhàn.","v":"Căn cứ vào tình thế địch mạnh ta yếu, Liêm Pha ra lệnh cho binh lính giữ vững trận địa, tuyệt đối không được chủ động xuất quân."},{"s":"","z":"秦军多次挑战，骂他是胆小鬼，他还是不出兵。","p":"Qínjūn duō cì tiǎozhàn, mà tā shì dǎnxiǎoguǐ, tā háishi bù chūbīng.","v":"Quân Tần nhiều lần khiêu chiến, mắng ông là đồ hèn nhát, ông vẫn không xuất binh."},{"s":"","z":"这个办法果然非常有效，成功地把秦军拦在了国门之外。","p":"Zhège bànfǎ guǒrán fēicháng yǒuxiào, chénggōng de bǎ Qínjūn lán zài le guómén zhī wài.","v":"Cách này quả nhiên rất hiệu quả, đã chặn thành công quân Tần ở ngoài cửa ngõ đất nước."},{"s":"","z":"渐渐地，秦军无法快速取得胜利，粮食也快没了，有些坚持不住了。","p":"Jiànjiàn de, Qínjūn wúfǎ kuàisù qǔdé shènglì, liángshi yě kuài méi le, yǒuxiē jiānchí bu zhù le.","v":"Dần dần, quân Tần không thể nhanh chóng giành thắng lợi, lương thực cũng sắp cạn, có phần không cầm cự nổi nữa."},{"s":"","z":"秦人深知廉颇善于用兵，如果想在短期内打败赵国，必须想办法叫赵国把廉颇调回去。","p":"Qínrén shēn zhī Lián Pō shànyú yòngbīng, rúguǒ xiǎng zài duǎnqī nèi dǎbài Zhàoguó, bìxū xiǎng bànfǎ jiào Zhàoguó bǎ Lián Pō diào huíqu.","v":"Người Tần biết rõ Liêm Pha giỏi dùng binh, nếu muốn đánh bại nước Triệu trong thời gian ngắn thì phải tìm cách khiến nước Triệu điều Liêm Pha về."},{"s":"","z":"于是，他们在赵国四处散布谣言，说秦军最怕赵括，别的人都不放在眼里。","p":"Yúshì, tāmen zài Zhàoguó sìchù sànbù yáoyán, shuō Qínjūn zuì pà Zhào Kuò, bié de rén dōu bú fàng zài yǎn li.","v":"Thế là họ tung tin đồn khắp nơi trong nước Triệu, nói rằng quân Tần sợ nhất là Triệu Quát, còn những người khác thì chẳng coi ra gì."}]},{"no":3,"tz":"","tv":"","lines":[{"s":"","z":"这时，赵王正因廉颇闭门不战而生气呢，听到外面的那些谣言，果然上当了，他派赵括去换回廉颇。","p":"Zhè shí, Zhàowáng zhèng yīn Lián Pō bì mén bú zhàn ér shēngqì ne, tīngdào wàimian de nàxiē yáoyán, guǒrán shàng dàng le, tā pài Zhào Kuò qù huànhuí Lián Pō.","v":"Lúc này, vua Triệu đang bực tức vì Liêm Pha đóng cửa không đánh, nghe những lời đồn bên ngoài, quả nhiên mắc mưu, liền cử Triệu Quát đi thay Liêm Pha về."},{"s":"","z":"赵括的母亲再三阻止赵王任命儿子为大将，说他还没有独立带兵作战的资格。","p":"Zhào Kuò de mǔqin zàisān zǔzhǐ Zhàowáng rènmìng érzi wéi dàjiàng, shuō tā hái méiyǒu dúlì dài bīng zuòzhàn de zīgé.","v":"Mẹ của Triệu Quát hết lần này đến lần khác ngăn vua Triệu bổ nhiệm con mình làm đại tướng, nói rằng cậu chưa đủ tư cách tự mình cầm quân đánh trận."},{"s":"","z":"可是，糊涂的赵王哪里听得进去！","p":"Kěshì, hútu de Zhàowáng nǎli tīng de jìnqu!","v":"Thế nhưng ông vua Triệu hồ đồ kia nào có chịu nghe!"},{"s":"","z":"公元前260年，赵括带兵出战。","p":"Gōngyuán qián èrbǎi liùshí nián, Zhào Kuò dài bīng chūzhàn.","v":"Năm 260 trước Công nguyên, Triệu Quát dẫn quân ra trận."},{"s":"","z":"一直盲目自信、轻视秦军的他完全改变了廉颇的作战方案，死搬兵书上的理论，主动进攻秦军，结果数十万赵军全部被杀，丢掉了宝贵的生命。","p":"Yìzhí mángmù zìxìn, qīngshì Qínjūn de tā wánquán gǎibiànle Lián Pō de zuòzhàn fāng'àn, sǐ bān bīngshū shang de lǐlùn, zhǔdòng jìngōng Qínjūn, jiéguǒ shù shí wàn Zhàojūn quánbù bèi shā, diūdiàole bǎoguì de shēngmìng.","v":"Vốn luôn tự tin mù quáng và xem thường quân Tần, Triệu Quát thay đổi hoàn toàn phương án tác chiến của Liêm Pha, rập khuôn lý thuyết trong binh thư, chủ động tấn công quân Tần; kết quả mấy chục vạn quân Triệu bị giết sạch, mất đi những sinh mạng quý giá."},{"s":"","z":"这就是成语“纸上谈兵”的故事。","p":"Zhè jiù shì chéngyǔ “zhǐshàng tánbīng” de gùshi.","v":"Đó chính là câu chuyện về thành ngữ \"Đánh trận trên giấy\"."},{"s":"","z":"现在常用这个成语讽刺那些只会空谈理论的人，提醒大家做事一定要灵活，要注意理论联系实际。","p":"Xiànzài cháng yòng zhège chéngyǔ fěngcì nàxiē zhǐ huì kōngtán lǐlùn de rén, tíxǐng dàjiā zuòshì yídìng yào línghuó, yào zhùyì lǐlùn liánxì shíjì.","v":"Ngày nay người ta thường dùng thành ngữ này để châm biếm những kẻ chỉ biết bàn suông lý thuyết, nhắc nhở mọi người làm việc nhất định phải linh hoạt, phải chú ý gắn lý luận với thực tế."}]}],"gram":[{"id":"guo","t":"动词 + 得/不 + 过","s":"hơn được / không hơn được (bổ ngữ 过)","b":"<b>过</b> ở đây là <b>động từ xu hướng</b>, đọc <b>guò</b>, thường dùng theo khuôn <b>động từ + 得/不 + 过</b>, làm <b>bổ ngữ</b>, biểu thị ý <b>vượt hơn, thắng được</b> (胜过) người khác.","r":["Khẳng định: V + 得 + 过 + người/vật bị vượt → làm được hơn, thắng được: 没有人说得过他","Phủ định: V + 不 + 过 + người/vật bị vượt → không bì được, không thắng nổi: 比不过你们、竞争不过他们","Đối tượng bị vượt đặt ngay sau 过","lỗi hay gặp: ✗ 我说他不过 → ✓ 我说不过他"],"e":[["……跟别人谈论起军事来，没有人说得过他，……","……gēn biérén tánlùn qǐ jūnshì lai, méiyǒu rén shuō de guò tā,……","…hễ bàn chuyện quân sự với ai thì không ai nói lại được cậu… <i>(bài khoá)</i>"],["年轻人记忆力好，这一点我比不过你们。","Niánqīngrén jìyìlì hǎo, zhè yì diǎn wǒ bǐ bu guò nǐmen.","Người trẻ trí nhớ tốt, về điểm này tôi không bì được với các bạn."],["我们的原材料贵，人工费用高，产品在价格上肯定竞争不过他们。","Wǒmen de yuáncáiliào guì, réngōng fèiyong gāo, chǎnpǐn zài jiàgé shang kěndìng jìngzhēng bu guò tāmen.","Nguyên liệu của chúng ta đắt, chi phí nhân công cao, về giá cả sản phẩm của ta chắc chắn không cạnh tranh nổi với họ."]],"d":[["跟别人谈论起军事来，没有人说得____他。","过"],["年轻人记忆力好，这一点我比不____你们。","过"],["产品在价格上肯定竞争不____他们。","过"]],"w":"Đừng nhầm với trợ từ động thái 过 (guo, chỉ trải nghiệm) như 受过专业训练; bổ ngữ 得/不 + 过 mang nghĩa \"hơn / thắng được\"."},{"id":"chizao","t":"迟早","s":"sớm muộn gì (phó từ)","b":"<b>迟早</b> là <b>phó từ</b>, phía sau thường là <b>động từ</b>, biểu thị một hành động hay sự việc nào đó <b>sớm hay muộn cũng sẽ xảy ra</b> (早晚会发生).","r":["Đứng trước động từ, thường đi với 会: 迟早会害了赵国","Có thể thêm 都 trước 会: 迟早都会得到解决","Hay dùng ở vế sau câu giả thiết: 如果……，迟早会……","lỗi hay gặp: ✗ 我们会迟早被挤出市场 → ✓ 我们迟早会被挤出市场"],"e":[["如果让他当了大将，迟早会害了赵国。","Rúguǒ ràng tā dāngle dàjiàng, chízǎo huì hàile Zhàoguó.","Nếu để nó làm đại tướng thì sớm muộn gì cũng hại nước Triệu. <i>(bài khoá)</i>"],["随着网络技术的发展，这些问题迟早都会得到解决。","Suízhe wǎngluò jìshù de fāzhǎn, zhèxiē wèntí chízǎo dōu huì dédào jiějué.","Cùng với sự phát triển của công nghệ mạng, sớm muộn gì những vấn đề này cũng sẽ được giải quyết."],["如果不重视技术研究和产品开发，我们迟早会被别人挤出市场。","Rúguǒ bú zhòngshì jìshù yánjiū hé chǎnpǐn kāifā, wǒmen chízǎo huì bèi biérén jǐchū shìchǎng.","Nếu không coi trọng nghiên cứu kỹ thuật và phát triển sản phẩm, sớm muộn gì chúng ta cũng bị người khác đẩy ra khỏi thị trường."]],"d":[["如果让他当了大将，____会害了赵国。","迟早"],["随着网络技术的发展，这些问题____都会得到解决。","迟早"],["如果不重视技术研究和产品开发，我们____会被别人挤出市场。","迟早"]],"w":"迟早 nhấn mạnh việc chắc chắn sẽ xảy ra, chỉ chưa biết lúc nào; đặt trước 会/都会 + động từ."},{"id":"zaisan","t":"再三","s":"nhiều lần, hết lần này đến lần khác (phó từ)","b":"<b>再三</b> là <b>phó từ</b>, nghĩa là \"<b>一次又一次</b>\" (hết lần này đến lần khác). Phía sau thường là <b>động từ</b>; đôi khi còn có thể đứng <b>sau động từ không mang tân ngữ</b>.","r":["再三 + động từ (có thể mang tân ngữ): 再三阻止赵王……、再三邀请","Động từ không mang tân ngữ + 再三: 考虑再三","lỗi hay gặp: ✗ 他考虑再三这个问题 → ✓ 他再三考虑这个问题"],"e":[["赵括的母亲再三阻止赵王任命儿子为大将，……","Zhào Kuò de mǔqin zàisān zǔzhǐ Zhàowáng rènmìng érzi wéi dàjiàng,……","Mẹ của Triệu Quát hết lần này đến lần khác ngăn vua Triệu bổ nhiệm con mình làm đại tướng… <i>(bài khoá)</i>"],["我最近这段时间特别忙，实在没时间参加小王的活动，可他再三邀请，出于礼貌，我只好答应了。","Wǒ zuìjìn zhè duàn shíjiān tèbié máng, shízài méi shíjiān cānjiā Xiǎo Wáng de huódòng, kě tā zàisān yāoqǐng, chūyú lǐmào, wǒ zhǐhǎo dāying le.","Dạo này tôi bận vô cùng, thật sự không có thời gian tham gia hoạt động của Tiểu Vương, nhưng cậu ấy mời đi mời lại, vì phép lịch sự tôi đành nhận lời."],["朋友请他做公司的总经理，他考虑再三，最后还是客气地拒绝了。","Péngyou qǐng tā zuò gōngsī de zǒngjīnglǐ, tā kǎolǜ zàisān, zuìhòu háishi kèqi de jùjué le.","Bạn bè mời anh ấy làm tổng giám đốc công ty, anh ấy cân nhắc đi cân nhắc lại, cuối cùng vẫn lịch sự từ chối."]],"d":[["赵括的母亲____阻止赵王任命儿子为大将。","再三"],["可他____邀请，出于礼貌，我只好答应了。","再三"],["他考虑____，最后还是客气地拒绝了。","再三"]],"w":"Đứng trước động từ thì động từ có thể mang tân ngữ; đứng sau động từ (考虑再三) thì động từ không được mang tân ngữ."},{"id":"shengli_chenggong","t":"胜利 vs 成功","s":"thắng lợi – thành công","b":"Cả hai đều là <b>động từ</b>, đều biểu thị <b>đạt được mục đích như dự tính</b>. Ví dụ: 北京<b>胜利/成功</b>地举办了2008年夏季奥运会。","r":["胜利: khi chỉ công việc… đạt mục đích dự tính, thường làm <b>trạng ngữ</b> (胜利地完成了调查工作) — 成功: không chỉ dùng cho công việc, sự nghiệp mà cả các phương diện khác; làm được <b>trạng ngữ</b> lẫn <b>vị ngữ</b> (实验终于成功了)","胜利 còn có nghĩa <b>đánh bại đối phương</b> trong chiến tranh hoặc thi đấu (这场比赛的胜利者) — 成功 không có nghĩa đánh bại đối phương","成功 còn là <b>tính từ</b>, mang nghĩa khiến người ta hài lòng, có thể làm <b>bổ ngữ</b> (拍得很成功) — 胜利 không có nghĩa này, không làm bổ ngữ","lỗi hay gặp: ✗ 这部电视剧拍得很胜利 → ✓ 这部电视剧拍得很成功"],"e":[["北京胜利/成功地举办了2008年夏季奥运会。","Běijīng shènglì/chénggōng de jǔbànle èr líng líng bā nián xiàjì Àoyùnhuì.","Bắc Kinh đã tổ chức thắng lợi/thành công Thế vận hội mùa hè năm 2008."],["经过一年多的努力，我们胜利地完成了调查工作。","Jīngguò yì nián duō de nǔlì, wǒmen shènglì de wánchéngle diàochá gōngzuò.","Sau hơn một năm nỗ lực, chúng tôi đã hoàn thành thắng lợi công tác điều tra."],["经过艰苦的努力，实验终于成功了。","Jīngguò jiānkǔ de nǔlì, shíyàn zhōngyú chénggōng le.","Trải qua bao nỗ lực gian khổ, cuối cùng thí nghiệm đã thành công."],["谁坚持到最后，谁就是这场比赛的胜利者。","Shéi jiānchí dào zuìhòu, shéi jiù shì zhè chǎng bǐsài de shènglìzhě.","Ai trụ được đến cuối cùng, người đó chính là người chiến thắng trong trận đấu này."],["这部电视剧拍得很成功，在全国播出后，受到观众的喜爱。","Zhè bù diànshìjù pāi de hěn chénggōng, zài quánguó bōchū hòu, shòudào guānzhòng de xǐ'ài.","Bộ phim truyền hình này quay rất thành công, sau khi phát sóng trên toàn quốc đã được khán giả yêu thích."]],"d":[["这项实验如果研究____，将给成千上万的病人带来希望。","成功"],["得民心者才会赢得这场战争的____。","胜利"],["她____地说服了丈夫放弃了搬家的打算。","成功"],["座谈会开得很____，大家交换了意见，增进了理解。","成功"]],"w":"Chiến tranh, thi đấu, đánh bại đối thủ → 胜利; đứng sau 得 làm bổ ngữ (开得很…、拍得很…) hoặc làm vị ngữ cho việc ngoài công việc (实验成功了) → 成功."}],"ext":[["枪","qiāng","súng"],["射击","shèjī","bắn, xạ kích"],["英雄","yīngxióng","anh hùng"],["士兵","shìbīng","binh lính"],["敌人","dírén","kẻ địch, quân địch"],["战争","zhànzhēng","chiến tranh"],["胜利","shènglì","thắng lợi, chiến thắng"]],"extt":"军事","notes":"Trang sách A125–A133 (tr. 135–143). Bài khoá 639 chữ (theo sách), 7 đoạn, chia 3 phần: đoạn 1–2 / đoạn 3–4 / đoạn 5–7; cuối bài khoá không có dòng chú thích nguồn. Câu đầu bài khoá chép đúng sách \"两千七百多年前的战国末期\" (sách in vậy dù mốc lịch sử thực tế khoảng 2.200–2.300 năm). Hai câu dài (câu đầu, câu \"一直盲目自信……\") >45 chữ, không có ；, giữ nguyên một câu. Từ mới có dấu * (ngoài đề cương): 1, 9, 14, 15, 22, 23, 24, 28, 33, 36. Từ số 1 纸上谈兵 sách không ghi từ loại (pos để trống). 专名 đánh số 1–6 theo mục 专有名词. Sách chỉ có 3 mục 词语例释 (过, 迟早, 再三) và 1 mục 词语辨析 (胜利—成功). Drill của 过/迟早/再三 đặt dựa trên câu ví dụ của sách vì 练一练 chỉ là bài hoàn thành câu mở; drill 胜利/成功 lấy từ 做一做 (đáp án do người soạn giải). Bảng 扩展 (军事) trong sách chỉ có chữ Hán + pinyin, nghĩa tiếng Việt do người soạn bổ sung.","order":[{"z":"如果让他当了大将，迟早会害了赵国。","t":["如果","让","他","当","了","大将","迟早会","害","了","赵国"],"v":"Nếu để nó làm đại tướng thì sớm muộn gì cũng hại nước Triệu.\""},{"z":"几年后，赵奢去世了。","t":["几年","后","赵奢","去世","了"],"v":"Vài năm sau, Triệu Xa qua đời."},{"z":"秦军多次挑战，骂他是胆小鬼，他还是不出兵。","t":["秦军","多次","挑战","骂","他","是","胆小鬼","他","还是","不","出兵"],"v":"Quân Tần nhiều lần khiêu chiến, mắng ông là đồ hèn nhát, ông vẫn không xuất binh."},{"z":"可是，糊涂的赵王哪里听得进去！","t":["可是","糊涂","的","赵王","哪里","听得","进去"],"v":"Thế nhưng ông vua Triệu hồ đồ kia nào có chịu nghe!"},{"z":"公元前260年，赵括带兵出战。","t":["公元前","260","年","赵括","带兵","出战"],"v":"Năm 260 trước Công nguyên, Triệu Quát dẫn quân ra trận."},{"z":"这就是成语“纸上谈兵”的故事。","t":["这","就是","成语","纸上谈兵","的","故事"],"v":"Đó chính là câu chuyện về thành ngữ \"Đánh trận trên giấy\"."},{"z":"年轻人记忆力好，这一点我比不过你们。","t":["年轻人","记忆力","好","这","一点","我","比","不过","你们"],"v":"Người trẻ trí nhớ tốt, về điểm này tôi không bì được với các bạn."},{"z":"北京胜利/成功地举办了2008年夏季奥运会。","t":["北京","胜利","/","成功","地","举办","了","2008","年","夏季","奥运会"],"v":"Bắc Kinh đã tổ chức thắng lợi/thành công Thế vận hội mùa hè năm 2008."},{"z":"经过艰苦的努力，实验终于成功了。","t":["经过","艰苦","的","努力","实验","终于","成功","了"],"v":"Trải qua bao nỗ lực gian khổ, cuối cùng thí nghiệm đã thành công."},{"z":"谁坚持到最后，谁就是这场比赛的胜利者。","t":["谁","坚持","到","最后","谁","就是","这场","比赛","的","胜利者"],"v":"Ai trụ được đến cuối cùng, người đó chính là người chiến thắng trong trận nghĩa là; ngay","k":"đgt./phó.","x":0,"ez":"不懂即问是他最大的优点，也是他成功的主要原因。","ev":"Không hiểu là hỏi ngay — đó là ưu điểm lớn nhất của anh ấy, cũng là lý do chính giúp anh ấy thành công."},{"h":"升","p":"shēng","v":"lên cao","k":"đgt.","x":0,"ez":"即周末之后体重升高，在工作日体重减轻。","ev":"Tức là sau cuối tuần cân nặng tăng lên, còn vào các ngày làm việc thì giảm xuống. <i>(bài khoá)</i>"},{"h":"达到","p":"dá dào","v":"đạt đến","k":"đgt.","x":0,"ez":"许多人喜爱喝茶，几乎达到不可一日无茶的程度。","ev":"Nhiều người rất thích uống trà, gần như đến mức không thể thiếu trà dù chỉ một ngày."},{"h":"意外","p":"yìwài","v":"bất ngờ; điều bất trắc","k":"tt./dt.","x":0,"ez":"研究人员还意外地发现，体重减轻者和体重增加者在体重波动模式上存在着明显不同。","ev":"Các nhà nghiên cứu còn bất ngờ phát hiện rằng người giảm cân và người tăng cân có sự khác biệt rõ rệt về kiểu dao động cân nặng. <i>(bài khoá)</i>"},{"h":"存在","p":"cúnzài","v":"tồn tại","k":"đgt.","x":0,"ez":"体重减轻者和体重增加者在体重波动模式上存在着明显不同。","ev":"Người giảm cân và người tăng cân có sự khác biệt rõ rệt về kiểu dao động cân nặng. <i>(bài khoá)</i>"},{"h":"明显","p":"míngxiǎn","v":"rõ ràng, nổi bật","k":"tt.","x":0,"ez":"调查结果显示，市民对电子阅读的兴趣明显提高了。","ev":"Kết quả khảo sát cho thấy người dân ngày càng hứng thú với việc đọc sách điện tử một cách rõ rệt."},{"h":"补偿","p":"bǔcháng","v":"đền bù, bổ khuyết","k":"đgt.","x":1,"ez":"体重减轻者会表现出较强的补偿模式。","ev":"Người giảm cân thể hiện kiểu bù trừ khá mạnh. <i>(bài khoá)</i>"},{"h":"立即","p":"lìjí","v":"lập tức, ngay","k":"phó.","x":0,"ez":"即在周末之后体重立即下降。","ev":"Tức là ngay sau cuối tuần cân nặng giảm xuống liền. <i>(bài khoá)</i>"},{"h":"趋势","p":"qūshì","v":"xu hướng, chiều hướng","k":"dt.","x":0,"ez":"这一下降趋势直至周五结束。","ev":"Xu hướng giảm này kéo dài cho đến hết thứ Sáu. <i>(bài khoá)</i>"},{"h":"差异","p":"chāyì","v":"sự khác biệt","k":"dt.","x":0,"ez":"而体重增加者每天的体重都会存在差异。","ev":"Còn cân nặng của người tăng cân thì ngày nào cũng có sự chênh lệch. <i>(bài khoá)</i>"}],[{"h":"联合","p":"liánhé","v":"kết hợp, hợp nhất; chung","k":"đgt./tt.","x":0,"ez":"这项联合多所医学院校所做的研究发现，除了个别人以外，多数人体重的增加会从周六开始。","ev":"Nghiên cứu do nhiều trường đại học y phối hợp thực hiện này phát hiện rằng, trừ một số ít người, cân nặng của đa số người bắt đầu tăng từ thứ Bảy. <i>(bài khoá)</i>"},{"h":"个别","p":"gèbié","v":"riêng lẻ, cá biệt","k":"tt.","x":0,"ez":"天气预报说今晚有小到中雨，个别地区可能有大雨。","ev":"Dự báo thời tiết nói tối nay có mưa nhỏ đến mưa vừa, một vài khu vực có thể có mưa to."},{"h":"表明","p":"biǎomíng","v":"thể hiện, chứng tỏ","k":"đgt.","x":0,"ez":"它表明人们的体重变化在一周内会显示出一种明显的规律。","ev":"Điều đó cho thấy sự thay đổi cân nặng của con người trong một tuần có một quy luật rõ ràng. <i>(bài khoá)</i>"},{"h":"临时","p":"línshí","v":"đến lúc; tạm thời","k":"phó./tt.","x":0,"ez":"早到了30分钟，所以我临时决定去旁边的书店看看。","ev":"Đến sớm 30 phút nên tôi quyết định ngay lúc đó ghé hiệu sách bên cạnh xem một chút."},{"h":"现象","p":"xiànxiàng","v":"hiện tượng","k":"dt.","x":0,"ez":"工作日和周末体重的临时变化应该被视为正常现象。","ev":"Sự thay đổi cân nặng tạm thời giữa ngày làm việc và cuối tuần nên được xem là hiện tượng bình thường. <i>(bài khoá)</i>"},{"h":"非","p":"fēi","v":"không phải, không","k":"đgt.","x":0,"ez":"成功有时候并非想象中那么难。","ev":"Thành công đôi khi không hề khó như ta tưởng."},{"h":"就餐","p":"jiùcān","v":"đi ăn","k":"đgt.","x":1,"ez":"这是由于人们在周末会有更多的时间外出就餐。","ev":"Đó là vì vào cuối tuần người ta có nhiều thời gian ra ngoài ăn uống hơn. <i>(bài khoá)</i>"},{"h":"放纵","p":"fàngzòng","v":"buông thả, không kiểm soát","k":"đgt.","x":1,"ez":"周末对饮食稍微有些放纵影响不大。","ev":"Cuối tuần hơi buông thả một chút trong ăn uống thì không ảnh hưởng mấy. <i>(bài khoá)</i>"},{"h":"苗条","p":"miáotiáo","v":"thon thả, mảnh khảnh","k":"tt.","x":0,"ez":"想要变苗条的节食者应注意到这种变化规律。","ev":"Người ăn kiêng muốn có vóc dáng thon thả nên chú ý đến quy luật thay đổi này. <i>(bài khoá)</i>"},{"h":"借口","p":"jièkǒu","v":"cớ; lấy cớ","k":"dt./đgt.","x":0,"ez":"他借口家里有事，提前离开了会场。","ev":"Anh ấy lấy cớ nhà có việc để rời hội trường sớm."},{"h":"采取","p":"cǎiqǔ","v":"áp dụng, dùng","k":"đgt.","x":0,"ez":"我们虽然还不能准确预报地震，但可以采取有效措施，最大限度地保护我们的财产。","ev":"Tuy chúng ta chưa thể dự báo chính xác động đất, nhưng có thể áp dụng các biện pháp hữu hiệu để bảo vệ tài sản của mình ở mức tối đa."},{"h":"措施","p":"cuòshī","v":"biện pháp","k":"dt.","x":0,"ez":"应及时采取措施阻止这一上升趋势。","ev":"Nên kịp thời có biện pháp ngăn chặn xu hướng tăng này. <i>(bài khoá)</i>"}]],"texts":[{"no":1,"tz":"体重与节食","tv":"Cân nặng và ăn kiêng","lines":[{"s":"","z":"据报道，医学专家进行了一项新研究，研究发现：由于人们在一周内的营养摄入和饮食模式会影响到他们的体重变化，因此节食者的体重会在一周内上下波动。","p":"Jù bàodào, yīxué zhuānjiā jìnxíngle yí xiàng xīn yánjiū, yánjiū fāxiàn: yóuyú rénmen zài yì zhōu nèi de yíngyǎng shèrù hé yǐnshí móshì huì yǐngxiǎng dào tāmen de tǐzhòng biànhuà, yīncǐ jiéshízhě de tǐzhòng huì zài yì zhōu nèi shàngxià bōdòng.","v":"Theo tin đưa, các chuyên gia y học đã tiến hành một nghiên cứu mới và phát hiện rằng: do lượng dinh dưỡng hấp thu và kiểu ăn uống của con người trong một tuần có ảnh hưởng đến sự thay đổi cân nặng, nên cân nặng của người ăn kiêng sẽ dao động lên xuống trong vòng một tuần."},{"s":"","z":"总共有80名年龄在25-62岁之间的成年人参与了这项研究。","p":"Zǒnggòng yǒu bāshí míng niánlíng zài èrshíwǔ dào liùshí'èr suì zhījiān de chéngniánrén cānyùle zhè xiàng yánjiū.","v":"Tổng cộng có 80 người trưởng thành trong độ tuổi từ 25 đến 62 đã tham gia nghiên cứu này."},{"s":"","z":"研究人员根据他们的相对体重变化将其分为三种类型：体重减轻者、体重增加者和体重保持者。","p":"Yánjiū rényuán gēnjù tāmen de xiāngduì tǐzhòng biànhuà jiāng qí fēnwéi sān zhǒng lèixíng: tǐzhòng jiǎnqīngzhě, tǐzhòng zēngjiāzhě hé tǐzhòng bǎochízhě.","v":"Các nhà nghiên cứu căn cứ vào sự thay đổi cân nặng tương đối của họ mà chia thành ba nhóm: người giảm cân, người tăng cân và người giữ cân."},{"s":"","z":"这些成年人在每天起床之后、早餐之前称一下自己的体重，为了保证可靠性，只有那些至少连续7天以上称过体重的人才会被纳入分析。","p":"Zhèxiē chéngniánrén zài měi tiān qǐchuáng zhīhòu, zǎocān zhīqián chēng yíxià zìjǐ de tǐzhòng, wèile bǎozhèng kěkàoxìng, zhǐyǒu nàxiē zhìshǎo liánxù qī tiān yǐshàng chēngguo tǐzhòng de rén cái huì bèi nàrù fēnxī.","v":"Mỗi ngày, sau khi ngủ dậy và trước bữa sáng, những người này tự cân trọng lượng của mình; để bảo đảm độ tin cậy, chỉ những ai đã cân liên tục ít nhất 7 ngày trở lên mới được đưa vào phân tích."},{"s":"","z":"对这些志愿者的跟踪调查时间最短为15天，最长为330天。","p":"Duì zhèxiē zhìyuànzhě de gēnzōng diàochá shíjiān zuì duǎn wéi shíwǔ tiān, zuì cháng wéi sānbǎi sānshí tiān.","v":"Thời gian theo dõi những tình nguyện viên này ngắn nhất là 15 ngày, dài nhất là 330 ngày."}]},{"no":2,"tz":"","tv":"","lines":[{"s":"","z":"研究成果显示：这些人的体重变化表现出清晰的模式，即周末之后体重升高，在工作日体重减轻（周五达到最低点）。","p":"Yánjiū chéngguǒ xiǎnshì: zhèxiē rén de tǐzhòng biànhuà biǎoxiàn chū qīngxī de móshì, jí zhōumò zhīhòu tǐzhòng shēnggāo, zài gōngzuòrì tǐzhòng jiǎnqīng (zhōuwǔ dádào zuì dī diǎn).","v":"Kết quả nghiên cứu cho thấy: sự thay đổi cân nặng của những người này thể hiện một quy luật rõ ràng, tức là cân nặng tăng lên sau cuối tuần và giảm xuống vào các ngày làm việc (thấp nhất vào thứ Sáu)."},{"s":"","z":"研究人员还意外地发现，体重减轻者和体重增加者在体重波动模式上存在着明显不同。","p":"Yánjiū rényuán hái yìwài de fāxiàn, tǐzhòng jiǎnqīngzhě hé tǐzhòng zēngjiāzhě zài tǐzhòng bōdòng móshì shang cúnzàizhe míngxiǎn bù tóng.","v":"Các nhà nghiên cứu còn bất ngờ phát hiện rằng người giảm cân và người tăng cân có sự khác biệt rõ rệt về kiểu dao động cân nặng."},{"s":"","z":"体重减轻者会表现出较强的补偿模式，即在周末之后体重立即下降，这一下降趋势直至周五结束；","p":"Tǐzhòng jiǎnqīngzhě huì biǎoxiàn chū jiào qiáng de bǔcháng móshì, jí zài zhōumò zhīhòu tǐzhòng lìjí xiàjiàng, zhè yí xiàjiàng qūshì zhízhì zhōuwǔ jiéshù;","v":"Người giảm cân thể hiện kiểu bù trừ khá mạnh, tức là ngay sau cuối tuần cân nặng giảm xuống liền, và xu hướng giảm này kéo dài cho đến hết thứ Sáu;"},{"s":"","z":"而体重增加者每天的体重都会存在差异，他们在工作日的体重并无明显减轻。","p":"ér tǐzhòng zēngjiāzhě měi tiān de tǐzhòng dōu huì cúnzài chāyì, tāmen zài gōngzuòrì de tǐzhòng bìng wú míngxiǎn jiǎnqīng.","v":"còn cân nặng của người tăng cân thì ngày nào cũng chênh lệch, vào các ngày làm việc cân nặng của họ không hề giảm rõ rệt."}]},{"no":3,"tz":"","tv":"","lines":[{"s":"","z":"这项联合多所医学院校所做的研究发现，除了个别人以外，多数人体重的增加会从周六开始，而体重减轻则会从周二开始，特别是对于那些体重减轻者和体重保持者来说更是如此。","p":"Zhè xiàng liánhé duō suǒ yīxué yuànxiào suǒ zuò de yánjiū fāxiàn, chúle gèbié rén yǐwài, duōshù rén tǐzhòng de zēngjiā huì cóng zhōuliù kāishǐ, ér tǐzhòng jiǎnqīng zé huì cóng zhōu'èr kāishǐ, tèbié shì duìyú nàxiē tǐzhòng jiǎnqīngzhě hé tǐzhòng bǎochízhě lái shuō gèng shì rúcǐ.","v":"Nghiên cứu do nhiều trường đại học y phối hợp thực hiện này phát hiện rằng, trừ một số ít người, cân nặng của đa số người bắt đầu tăng từ thứ Bảy và bắt đầu giảm từ thứ Ba, nhất là với những người giảm cân và người giữ cân thì càng đúng như vậy."},{"s":"","z":"它表明人们的体重变化在一周内会显示出一种明显的规律，工作日和周末体重的临时变化应该被视为正常现象，而非真正的体重增加，这是由于人们在周末会有更多的时间外出就餐。","p":"Tā biǎomíng rénmen de tǐzhòng biànhuà zài yì zhōu nèi huì xiǎnshì chū yì zhǒng míngxiǎn de guīlǜ, gōngzuòrì hé zhōumò tǐzhòng de línshí biànhuà yīnggāi bèi shìwéi zhèngcháng xiànxiàng, ér fēi zhēnzhèng de tǐzhòng zēngjiā, zhè shì yóuyú rénmen zài zhōumò huì yǒu gèng duō de shíjiān wàichū jiùcān.","v":"Điều đó cho thấy sự thay đổi cân nặng của con người trong một tuần có một quy luật rõ ràng: sự thay đổi cân nặng tạm thời giữa ngày làm việc và cuối tuần nên được xem là hiện tượng bình thường chứ không phải tăng cân thật sự, bởi vì vào cuối tuần người ta có nhiều thời gian ra ngoài ăn uống hơn."},{"s":"","z":"周末对饮食稍微有些放纵影响不大，但为了能成功减轻体重，想要变苗条的节食者应注意到这种变化规律，周末之后不要再找任何吃美食的借口，应及时采取措施阻止这一上升趋势。","p":"Zhōumò duì yǐnshí shāowēi yǒuxiē fàngzòng yǐngxiǎng bú dà, dàn wèile néng chénggōng jiǎnqīng tǐzhòng, xiǎng yào biàn miáotiáo de jiéshízhě yīng zhùyì dào zhè zhǒng biànhuà guīlǜ, zhōumò zhīhòu bú yào zài zhǎo rènhé chī měishí de jièkǒu, yīng jíshí cǎiqǔ cuòshī zǔzhǐ zhè yí shàngshēng qūshì.","v":"Cuối tuần hơi buông thả một chút trong ăn uống thì không ảnh hưởng mấy, nhưng để giảm cân thành công, người ăn kiêng muốn có vóc dáng thon thả nên chú ý đến quy luật thay đổi này: sau cuối tuần đừng tìm thêm bất cứ cái cớ nào để ăn đồ ngon nữa, mà nên kịp thời có biện pháp ngăn chặn xu hướng tăng cân này."}]}],"gram":[{"id":"ji","t":"即","s":"tức là; liền, ngay (động từ / phó từ, văn viết)","b":"<b>即</b> là từ mang sắc thái <b>văn viết</b>. Làm <b>động từ</b>, nghĩa là “就是” (<i>tức là, chính là</i>), dùng để giải thích, làm rõ điều vừa nói. Làm <b>phó từ</b>, nghĩa là “就”, “便” (<i>liền, ngay</i>), đứng trước động từ.","r":["Động từ: A，即 B — B giải thích, cụ thể hoá cho A: “旦”是象形字，即太阳从地平线上升起。","Phó từ: 即 + động từ = 就/便 + động từ: 不懂即问 (không hiểu là hỏi ngay), 一拍即合 (vừa bàn là hợp ý ngay).","Hay gặp trong các kết cấu cố định: 一……即……, 即可 (= 就可以)."],"e":[["“旦”是象形字，即太阳从地平线上升起。","“Dàn” shì xiàngxíngzì, jí tàiyáng cóng dìpíngxiàn shang shēngqǐ.","“旦” là chữ tượng hình, tức là mặt trời mọc lên từ đường chân trời."],["这些人的体重变化表现出清晰的模式，即周末之后体重升高，在工作日体重减轻（周五达到最低点）。","Zhèxiē rén de tǐzhòng biànhuà biǎoxiàn chū qīngxī de móshì, jí zhōumò zhīhòu tǐzhòng shēnggāo, zài gōngzuòrì tǐzhòng jiǎnqīng (zhōuwǔ dádào zuì dī diǎn).","Sự thay đổi cân nặng của những người này thể hiện một quy luật rõ ràng, tức là cân nặng tăng lên sau cuối tuần và giảm xuống vào các ngày làm việc (thấp nhất vào thứ Sáu). <i>(bài khoá)</i>"],["不懂即问是他最大的优点，也是他成功的主要原因。","Bù dǒng jí wèn shì tā zuì dà de yōudiǎn, yě shì tā chénggōng de zhǔyào yuányīn.","Không hiểu là hỏi ngay — đó là ưu điểm lớn nhất của anh ấy, cũng là lý do chính giúp anh ấy thành công."],["在办公司这件事上，两人早都有打算，这次的机会让他俩一拍即合。","Zài bàn gōngsī zhè jiàn shì shang, liǎng rén zǎo dōu yǒu dǎsuàn, zhè cì de jīhuì ràng tā liǎ yì pāi jí hé.","Chuyện mở công ty thì cả hai đã tính từ lâu, lần này có cơ hội nên hai người vừa bàn đã ăn ý ngay."]],"d":[["他可聪明了，什么东西一学____会。","即"],["汉字“宇”代表上下四方，____所有的空间。","即"],["在鸟爸爸、鸟妈妈的精心照顾下，小鸟30~35天____可独立生活。","即"]],"w":"即 trang trọng hơn 就是/就; trong khẩu ngữ thường nói 就是 hoặc 就. Đừng nhầm 即 (jí, tức là) với 既 (jì, đã… lại…)."},{"id":"gebie","t":"个别","s":"riêng lẻ, cá biệt; số rất ít (tính từ)","b":"<b>个别</b> là <b>tính từ</b>, có hai nghĩa: (1) “单个、各个” — <i>riêng lẻ, từng cái một</i>, thường làm định ngữ trước danh từ chỉ hoạt động: 个别谈话, 个别训练; (2) chỉ <b>số rất ít, hiếm có</b>: 个别人, 个别地区.","r":["Nghĩa “riêng lẻ”: 个别 + danh từ/động từ hoạt động — 个别谈话 (nói chuyện riêng), 个别训练 (huấn luyện riêng).","Nghĩa “cực ít”: 个别 + danh từ chỉ người/nơi chốn — 个别人, 个别地区; hay đi với 除了……以外 để đối lập với 多数/大部分.","Có thể làm định ngữ có 的: 个别(的)现象."],"e":[["他经常采取个别谈话的方式了解情况和解决问题。","Tā jīngcháng cǎiqǔ gèbié tánhuà de fāngshì liǎojiě qíngkuàng hé jiějué wèntí.","Anh ấy thường dùng cách nói chuyện riêng để nắm tình hình và giải quyết vấn đề."],["教练针对他的技术特点进行了个别训练，达到了比较好的效果。","Jiàoliàn zhēnduì tā de jìshù tèdiǎn jìnxíngle gèbié xùnliàn, dádàole bǐjiào hǎo de xiàoguǒ.","Huấn luyện viên đã luyện tập riêng cho anh ấy dựa theo đặc điểm kỹ thuật của anh, đạt được hiệu quả khá tốt."],["……除了个别人以外，多数人体重的增加会从周六开始，……","……chúle gèbié rén yǐwài, duōshù rén tǐzhòng de zēngjiā huì cóng zhōuliù kāishǐ, ……","…trừ một số ít người, cân nặng của đa số người bắt đầu tăng từ thứ Bảy… <i>(bài khoá)</i>"],["天气预报说今晚有小到中雨，个别地区可能有大雨。","Tiānqì yùbào shuō jīn wǎn yǒu xiǎo dào zhōng yǔ, gèbié dìqū kěnéng yǒu dàyǔ.","Dự báo thời tiết nói tối nay có mưa nhỏ đến mưa vừa, một vài khu vực có thể có mưa to."]],"d":[["教练针对他的技术特点进行了____训练。","个别"],["天气预报说今晚有小到中雨，____地区可能有大雨。","个别"],["除了____人以外，多数人体重的增加会从周六开始。","个别"]],"w":"个别 (cá biệt, rất ít) khác 各别/各自 (mỗi người riêng). 个别人 = một vài người lẻ tẻ, không phải “mỗi người”."},{"id":"fei","t":"非","s":"phi-, không thuộc; không phải; nhất định (tiền tố / động từ / phó từ)","b":"<b>非</b> có ba cách dùng: (1) <b>tiền tố</b>, đứng trước thành phần danh từ, biểu thị <i>không thuộc phạm vi đó</i> (非语言, 非专业人员); (2) <b>động từ</b>, nghĩa là “不是” (<i>không phải</i>), hay gặp trong 而非, 并非; (3) <b>phó từ</b>, biểu thị chủ quan cố ý khăng khăng, nhất định phải làm (非要); có khi dùng trong câu hỏi tu từ để phủ định sự cần thiết. Kết hợp với động từ tạo cấu trúc thường dùng <b>非 + động từ + 不可</b>, nghĩa là “必须” (<i>nhất định phải</i>).","r":["Tiền tố: 非 + danh từ — 非语言的交流, 非专业人员, 非工作人员.","Động từ = 不是: A，而非 B (là A chứ không phải B); 并非 (hoàn toàn không phải).","Phó từ: 非要 + động từ — khăng khăng, nhất quyết; 何必非要……呢？ — hỏi tu từ: cần gì phải….","Cấu trúc 非 + động từ + 不可 = 必须: 非你本人去不可 (nhất định chính bạn phải đi)."],"e":[["在非语言的交流中，眼睛起着重要的作用。","Zài fēi yǔyán de jiāoliú zhōng, yǎnjing qǐzhe zhòngyào de zuòyòng.","Trong giao tiếp phi ngôn ngữ, đôi mắt đóng vai trò quan trọng."],["我们公司的技术部门都是专业人员，工资高；非专业人员做服务工作，工资不高。","Wǒmen gōngsī de jìshù bùmén dōu shì zhuānyè rényuán, gōngzī gāo; fēi zhuānyè rényuán zuò fúwù gōngzuò, gōngzī bù gāo.","Bộ phận kỹ thuật công ty chúng tôi toàn là nhân viên chuyên môn, lương cao; nhân viên không chuyên làm công việc phục vụ, lương không cao."],["……工作日和周末体重的临时变化应该被视为正常现象，而非真正的体重增加，……","……gōngzuòrì hé zhōumò tǐzhòng de línshí biànhuà yīnggāi bèi shìwéi zhèngcháng xiànxiàng, ér fēi zhēnzhèng de tǐzhòng zēngjiā, ……","…sự thay đổi cân nặng tạm thời giữa ngày làm việc và cuối tuần nên được xem là hiện tượng bình thường chứ không phải tăng cân thật sự… <i>(bài khoá)</i>"],["成功有时候并非想象中那么难。","Chénggōng yǒu shíhou bìng fēi xiǎngxiàng zhōng nàme nán.","Thành công đôi khi không hề khó như ta tưởng."],["他非要离婚，我们谁拦也拦不住。","Tā fēi yào lí hūn, wǒmen shéi lán yě lán bú zhù.","Anh ta nhất quyết đòi ly hôn, ai trong chúng tôi can cũng không được."],["我本不想提这件事，你又何必非要我说出来呢？","Wǒ běn bù xiǎng tí zhè jiàn shì, nǐ yòu hébì fēi yào wǒ shuō chūlai ne?","Tôi vốn không muốn nhắc chuyện này, cần gì cậu cứ phải bắt tôi nói ra chứ?"],["有些家长已经习惯了这种竞争，非让自家的孩子考第一名不可。","Yǒuxiē jiāzhǎng yǐjīng xíguànle zhè zhǒng jìngzhēng, fēi ràng zìjiā de háizi kǎo dì-yī míng bùkě.","Một số phụ huynh đã quen với kiểu cạnh tranh này, nhất định bắt con mình phải thi đứng thứ nhất."],["补办学生证的事非你本人去不可。","Bǔbàn xuéshēngzhèng de shì fēi nǐ běnrén qù bùkě.","Việc làm lại thẻ sinh viên thì nhất định phải chính bạn đi."]],"d":[["门口的牌子上写着：____工作人员请勿入内。","非"],["世界上并____只有人类才会骗人，动物也会。","非"],["听说你住院了，他____来看看你不可。","非"],["补办学生证的事____你本人去不可。","非"]],"w":"Đừng quên 不可 trong cấu trúc 非……不可 (khẩu ngữ đôi khi bỏ 不可: 他非要去). 而非/并非 mang sắc thái văn viết, tương đương 而不是/并不是."},{"id":"linshi_zanshi","t":"临时 vs 暂时","s":"đến lúc, tạm thời – tạm thời, trong thời gian ngắn","b":"<b>临时</b> và <b>暂时</b> đều có nghĩa “<b>trong thời gian ngắn</b>” (短时间内), trong trường hợp này có thể thay thế cho nhau: 没找到满意的房子前，我临时/暂时借住在朋友家里。","r":["临时 biểu thị “临到事情发生的时候” (<i>đến lúc sự việc xảy ra mới…</i>, tức thời, bất chợt): 早到了30分钟，所以我临时决定去旁边的书店看看。 — 暂时 không có nghĩa này.","暂时 biểu thị một khoảng thời gian tương đối gần, không xác định cụ thể (<i>tạm thời, trước mắt</i>): 这套房子我很喜欢，暂时还不打算卖掉。 — 临时 không có nghĩa này.","临时 còn làm <b>từ thuộc tính</b> (属性词), nghĩa là ngắn hạn, không chính thức: 临时工作, 临时的家 — 暂时 không có cách dùng này."],"e":[["没找到满意的房子前，我临时/暂时借住在朋友家里。","Méi zhǎodào mǎnyì de fángzi qián, wǒ línshí/zànshí jièzhù zài péngyou jiā li.","Trước khi tìm được căn nhà ưng ý, tôi tạm thời ở nhờ nhà bạn."],["早到了30分钟，所以我临时决定去旁边的书店看看。","Zǎo dàole sānshí fēnzhōng, suǒyǐ wǒ línshí juédìng qù pángbiān de shūdiàn kànkan.","Đến sớm 30 phút nên tôi quyết định ngay lúc đó ghé hiệu sách bên cạnh xem một chút."],["这套房子我很喜欢，暂时还不打算卖掉。","Zhè tào fángzi wǒ hěn xǐhuan, zànshí hái bù dǎsuàn màidiào.","Tôi rất thích căn nhà này, trước mắt chưa định bán."],["麻烦你春节后帮刘方的女儿找份临时工作。","Máfan nǐ Chūn Jié hòu bāng Liú Fāng de nǚ'ér zhǎo fèn línshí gōngzuò.","Phiền anh sau Tết giúp con gái của Lưu Phương tìm một công việc tạm thời."]],"d":[["我们租下了一所房子作为____的家。","临时"],["演出结束，我想____休息一段时间，考虑一下明年的工作。","暂时"],["公司遇到一些____的困难，我们正在积极想办法。","暂时"],["这件事你____先不要告诉他。","暂时"]],"w":"Mẹo: “đến lúc mới quyết/ứng biến” hoặc đứng trước danh từ (临时工作, 临时的家) → 临时; “trước mắt, tạm thời trong một thời gian” (暂时还不……, 暂时休息) → 暂时."}],"ext":[["挂号","guà hào","đăng ký khám, lấy số"],["急诊","jízhěn","cấp cứu"],["救护车","jiùhùchē","xe cứu thương"],["内科","nèikē","khoa nội"],["过敏","guòmǐn","dị ứng"],["打喷嚏","dǎ pēntì","hắt hơi"],["着凉","zháo liáng","bị cảm lạnh"],["吐","tù","nôn, ói"],["痒","yǎng","ngứa"],["消化","xiāohuà","tiêu hoá"]],"extt":"医务1","notes":"Nguồn cuối bài khoá: 改编自《北京青年报》，作者：臧恒佳. Bài khoá 627 chữ, 4 đoạn trong sách, chia thành 3 phần: đoạn 1–2 (từ 1–17) / đoạn 3 (từ 18–29) / đoạn 4 (từ 30–41; đoạn này tràn từ tr.147 sang tr.148). Bài không có mục 专名. Từ mới số 4, 5, 6, 14, 17, 19, 26, 36, 37 có dấu * (ngoài đề cương). Pinyin từ 22 chép theo sách là “dá dào” (có cách); pinyin 苗条 theo sách là miáotiáo. Khoảng tuổi “25-62” trong sách in bằng dấu gạch ngang. Một số câu bài khoá dài >45 chữ nhưng không có ；nên giữ nguyên một câu; câu duy nhất có ；(đoạn 3) được cắt thành 2 dòng. Phần 注释 gồm 3 mục 词语例释 (即, 个别, 非) và 1 词语辨析 (临时—暂时). Drill của 即 và 非 lấy từ 练一练 (bài viết lại câu) của sách, đổi thành dạng điền khuyết, đáp án do người soạn giải; drill của 个别 đặt dựa trên câu ví dụ của sách vì 练一练 là bài hoàn thành câu mở; drill của 临时—暂时 lấy từ 做一做 (câu (1) sách đã cho đáp án 临时). vocab_ex của 报道, 总共, 可靠, 达到, 明显, 借口, 采取 lấy từ câu bài 练习 của sách (đã điền đáp án); của 即, 个别, 临时, 非 lấy từ phần 注释; còn lại trích câu/vế câu trong bài khoá. Bảng 扩展 (医务1) trong sách chỉ có chữ Hán + pinyin, nghĩa tiếng Việt do người soạn bổ sung.","order":[{"z":"对这些志愿者的跟踪调查时间最短为15天，最长为330天。","t":["对","这些","志愿者","的","跟踪调查","时间","最短","为","15","天","最长","为","330","天"],"v":"Thời gian theo dõi những tình nguyện viên này ngắn nhất là 15 ngày, dài nhất là 330 ngày."},{"z":"旦”是象形字，即太阳从地平线上升起。","t":["旦","是","象形字","即","太阳","从","地平线","上","升起"],"v":"“旦” là chữ tượng hình, tức là mặt trời mọc lên từ đường chân trời."},{"z":"他经常采取个别谈话的方式了解情况和解决问题。","t":["他","经常","采取","个别谈话","的","方式","了解","情况","和","解决问题"],"v":"Anh ấy thường dùng cách nói chuyện riêng để nắm tình hình và giải quyết vấn đề."},{"z":"天气预报说今晚有小到中雨，个别地区可能有大雨。","t":["天气预报","说","今晚","有","小到中雨","个别","地区","可能","有","大雨"],"v":"Dự báo thời tiết nói tối nay có mưa nhỏ đến mưa vừa, một vài khu vực có thể có mưa to."},{"z":"在非语言的交流中，眼睛起着重要的作用。","t":["在","非","语言","的","交流","中","眼睛","起着","重要","的","作用"],"v":"Trong giao tiếp phi ngôn ngữ, đôi mắt đóng vai trò quan trọng."},{"z":"成功有时候并非想象中那么难。","t":["成功","有时候","并非","想象","中","那么","难"],"v":"Thành công đôi khi không hề khó như ta tưởng."},{"z":"他非要离婚，我们谁拦也拦不住。","t":["他","非要", hoạt động khác, chỉ ở đó một tiếng rồi sớm chào ra về, thì tôi lại được tận hưởng trọn vẹn 60 phút vui vẻ. <i>(bài khoá)</i>"},{"h":"平常","p":"píngcháng","v":"bình thường; ngày thường","k":"tt./dt.","x":0,"ez":"他平常总是来得很早，今天却迟到了。","ev":"Ngày thường anh ấy luôn đến rất sớm, vậy mà hôm nay lại đi muộn."},{"h":"依然","p":"yīrán","v":"vẫn, vẫn như cũ","k":"phó.","x":0,"ez":"十几年过去了，她依然那么美丽。","ev":"Mười mấy năm đã trôi qua, cô ấy vẫn đẹp như vậy."},{"h":"推荐","p":"tuījiàn","v":"giới thiệu, tiến cử","k":"đgt.","x":0,"ez":"一些现代营养学专家常常向大家推荐“餐餐有蔬菜，每天有水果”。","ev":"Một số chuyên gia dinh dưỡng học hiện đại thường khuyên mọi người “bữa nào cũng có rau, ngày nào cũng có trái cây”."},{"h":"淋漓尽致","p":"línlí jìnzhì","v":"tinh tế, triệt để","k":"","x":1,"ez":"如果在前半个小时就把剧情的创造力表现得淋漓尽致，结尾却非常普通……","ev":"Nếu ngay trong nửa tiếng đầu đã thể hiện hết mức sự sáng tạo của tình tiết, mà phần kết lại rất tầm thường… <i>(bài khoá)</i>"},{"h":"评价","p":"píngjià","v":"đánh giá; sự đánh giá","k":"đgt./dt.","x":0,"ez":"观众对这部电影的评价就肯定不好。","ev":"Đánh giá của khán giả về bộ phim này chắc chắn sẽ không tốt. <i>(bài khoá)</i>"},{"h":"烂","p":"làn","v":"dở, tệ, thối rữa, rách nát","k":"tt.","x":0,"ez":"甚至会说这是一部“烂片”。","ev":"Thậm chí còn nói đây là một “phim dở”. <i>(bài khoá)</i>"}],[{"h":"主持","p":"zhǔchí","v":"chủ trì; người chủ trì","k":"đgt./dt.","x":0,"ez":"作为电视节目主持人，我在工作中常常会运用“峰终定律”。","ev":"Là người dẫn chương trình truyền hình, trong công việc tôi thường vận dụng “quy luật cao điểm – điểm cuối”. <i>(bài khoá)</i>"},{"h":"运用","p":"yùnyòng","v":"vận dụng, áp dụng","k":"đgt.","x":0,"ez":"学知识不能死记硬背，要懂得灵活地运用。","ev":"Học kiến thức không được học vẹt, phải biết vận dụng linh hoạt."},{"h":"开幕式","p":"kāimùshì","v":"lễ khai mạc","k":"dt.","x":0,"ez":"做节目时，与开幕式相比，我们宁可把更多的精力集中在闭幕式上。","ev":"Khi làm chương trình, so với lễ khai mạc, chúng tôi thà dồn nhiều công sức hơn vào lễ bế mạc. <i>(bài khoá)</i>"},{"h":"宁可","p":"nìngkě","v":"thà rằng, thà","k":"phó.","x":0,"ez":"作为母亲，她宁可自己累一点儿，也不想委屈了孩子。","ev":"Là mẹ, chị ấy thà bản thân vất vả một chút chứ không muốn để con phải chịu thiệt thòi."},{"h":"集中","p":"jízhōng","v":"tập trung; chăm chú","k":"đgt./tt.","x":0,"ez":"你复习时要集中注意力，效果才会好。","ev":"Khi ôn bài cậu phải tập trung chú ý thì hiệu quả mới tốt."},{"h":"体会","p":"tǐhuì","v":"hiểu rõ, nhận thức rõ; nhận thức","k":"đgt./dt.","x":0,"ez":"他们能从经验中体会这种做法的重要性。","ev":"Họ có thể cảm nhận được tầm quan trọng của cách làm này từ kinh nghiệm. <i>(bài khoá)</i>"}]],"texts":[{"no":1,"tz":"在最美好的时刻离开","tv":"Rời khỏi vào thời khắc tốt đẹp nhất","lines":[{"s":"","z":"我奶奶说过：“人们应该在最美好的时候离开。”","p":"Wǒ nǎinai shuōguo: “Rénmen yīnggāi zài zuì měihǎo de shíhou líkāi.”","v":"Bà tôi từng nói: “Con người nên rời đi vào lúc tốt đẹp nhất.”"},{"s":"","z":"因为这个认知而获得诺贝尔奖的，不是我奶奶，而是心理学家丹尼尔·卡内曼。","p":"Yīnwèi zhège rènzhī ér huòdé Nuòbèi'ěr Jiǎng de, bú shì wǒ nǎinai, ér shì xīnlǐxuéjiā Dānní'ěr·Kǎnèimàn.","v":"Người nhận giải Nô-ben nhờ nhận thức này không phải là bà tôi, mà là nhà tâm lý học Daniel Kahneman."},{"s":"","z":"他将这一现象命名为“峰终定律”：我们对事物的记忆仅在高峰和结尾，而事情的经过对记忆几乎没有影响。","p":"Tā jiāng zhè yí xiànxiàng mìngmíng wéi “Fēngzhōng Dìnglǜ”: wǒmen duì shìwù de jìyì jǐn zài gāofēng hé jiéwěi, ér shìqing de jīngguò duì jìyì jīhū méiyǒu yǐngxiǎng.","v":"Ông gọi hiện tượng này là “quy luật cao điểm – điểm cuối”: ký ức của chúng ta về sự vật chỉ đọng lại ở thời điểm cao trào và phần kết, còn diễn biến của sự việc hầu như không ảnh hưởng gì đến ký ức."},{"s":"","z":"高峰之后，终点出现得越迅速，这件事留给我们的印象就越深刻。","p":"Gāofēng zhīhòu, zhōngdiǎn chūxiàn de yuè xùnsù, zhè jiàn shì liú gěi wǒmen de yìnxiàng jiù yuè shēnkè.","v":"Sau cao điểm, điểm kết thúc đến càng nhanh thì ấn tượng mà sự việc để lại cho chúng ta càng sâu sắc."}]},{"no":2,"tz":"","tv":"","lines":[{"s":"","z":"大部分人不理解这一定律。","p":"Dà bùfen rén bù lǐjiě zhè yí dìnglǜ.","v":"Phần lớn mọi người không hiểu quy luật này."},{"s":"","z":"比如说为了一场戏剧演出，我们会投入很多时间，准备服装、化妆、道具、舞台美术，以创造良好的效果，争取给观众留下一个好的印象，却常常忽视结束退场时的准备。","p":"Bǐrú shuō wèile yì chǎng xìjù yǎnchū, wǒmen huì tóurù hěn duō shíjiān, zhǔnbèi fúzhuāng, huàzhuāng, dàojù, wǔtái měishù, yǐ chuàngzào liánghǎo de xiàoguǒ, zhēngqǔ gěi guānzhòng liúxià yí ge hǎo de yìnxiàng, què chángcháng hūshì jiéshù tuìchǎng shí de zhǔnbèi.","v":"Chẳng hạn, vì một buổi diễn kịch, chúng ta sẽ bỏ ra rất nhiều thời gian chuẩn bị trang phục, hoá trang, đạo cụ, mỹ thuật sân khấu để tạo ra hiệu quả tốt, cố gắng để lại ấn tượng đẹp cho khán giả, nhưng lại thường xem nhẹ việc chuẩn bị cho lúc kết thúc, rời sân khấu."},{"s":"","z":"演出开始时人们认为很有魅力，但是糟糕的结局会给人留下难以忘记的坏印象。","p":"Yǎnchū kāishǐ shí rénmen rènwéi hěn yǒu mèilì, dànshì zāogāo de jiéjú huì gěi rén liúxià nányǐ wàngjì de huài yìnxiàng.","v":"Lúc buổi diễn bắt đầu, mọi người thấy rất cuốn hút, nhưng một cái kết tồi tệ sẽ để lại ấn tượng xấu khó quên."}]},{"no":3,"tz":"","tv":"","lines":[{"s":"","z":"有一次，我去参加一个婚礼，前三个小时感觉都很好，只在最后一个小时感到无聊。","p":"Yǒu yí cì, wǒ qù cānjiā yí ge hūnlǐ, qián sān ge xiǎoshí gǎnjué dōu hěn hǎo, zhǐ zài zuìhòu yí ge xiǎoshí gǎndào wúliáo.","v":"Có lần tôi đi dự một đám cưới, ba tiếng đầu cảm thấy đều rất ổn, chỉ có tiếng cuối cùng là thấy chán."},{"s":"","z":"三个小时快乐减一个小时无聊等于两个小时快乐，也就是说，我愉快地度过了两个小时。","p":"Sān ge xiǎoshí kuàilè jiǎn yí ge xiǎoshí wúliáo děngyú liǎng ge xiǎoshí kuàilè, yě jiù shì shuō, wǒ yúkuài de dùguòle liǎng ge xiǎoshí.","v":"Ba tiếng vui vẻ trừ đi một tiếng buồn chán bằng hai tiếng vui vẻ, tức là tôi đã trải qua hai tiếng đồng hồ vui vẻ."},{"s":"","z":"但是，我的记忆并不是这样计算的。","p":"Dànshì, wǒ de jìyì bìng bú shì zhèyàng jìsuàn de.","v":"Nhưng ký ức của tôi lại không hề tính toán như vậy."},{"s":"","z":"如果我参加另外一次活动，只在那里待一个小时，早早地告别，我却享受了满满60分钟的快乐。","p":"Rúguǒ wǒ cānjiā lìngwài yí cì huódòng, zhǐ zài nàli dāi yí ge xiǎoshí, zǎozǎo de gàobié, wǒ què xiǎngshòule mǎnmǎn liùshí fēnzhōng de kuàilè.","v":"Nếu tôi tham gia một hoạt động khác, chỉ ở đó một tiếng rồi sớm chào ra về, thì tôi lại được tận hưởng trọn vẹn 60 phút vui vẻ."},{"s":"","z":"与第一次相比，第二次的聚会留给我的印象更为美好。","p":"Yǔ dì-yī cì xiāngbǐ, dì-èr cì de jùhuì liú gěi wǒ de yìnxiàng gèng wéi měihǎo.","v":"So với lần đầu, buổi tụ họp lần thứ hai để lại cho tôi ấn tượng đẹp hơn."},{"s":"","z":"看电影也是如此。","p":"Kàn diànyǐng yě shì rúcǐ.","v":"Xem phim cũng vậy."},{"s":"","z":"一部电影，开始虽然剧情平平常常，如果最后半个小时能使我们感动，我们依然会向别人推荐它。","p":"Yí bù diànyǐng, kāishǐ suīrán jùqíng píngpíngchángcháng, rúguǒ zuìhòu bàn ge xiǎoshí néng shǐ wǒmen gǎndòng, wǒmen yīrán huì xiàng biérén tuījiàn tā.","v":"Một bộ phim dù lúc đầu tình tiết bình thường, nhưng nếu nửa tiếng cuối có thể khiến chúng ta cảm động, chúng ta vẫn sẽ giới thiệu nó cho người khác."},{"s":"","z":"相反，如果在前半个小时就把剧情的创造力表现得淋漓尽致，结尾却非常普通，那么，观众对这部电影的评价就肯定不好，甚至会说这是一部“烂片”。","p":"Xiāngfǎn, rúguǒ zài qián bàn ge xiǎoshí jiù bǎ jùqíng de chuàngzàolì biǎoxiàn de línlí jìnzhì, jiéwěi què fēicháng pǔtōng, nàme, guānzhòng duì zhè bù diànyǐng de píngjià jiù kěndìng bù hǎo, shènzhì huì shuō zhè shì yí bù “lànpiàn”.","v":"Ngược lại, nếu ngay trong nửa tiếng đầu đã phô hết mức sự sáng tạo của tình tiết, mà phần kết lại rất tầm thường, thì đánh giá của khán giả về bộ phim chắc chắn sẽ không tốt, thậm chí còn bảo đây là một “phim dở”."}]},{"no":4,"tz":"","tv":"","lines":[{"s":"","z":"作为电视节目主持人，我在工作中常常会运用“峰终定律”。","p":"Zuòwéi diànshì jiémù zhǔchírén, wǒ zài gōngzuò zhōng chángcháng huì yùnyòng “Fēngzhōng Dìnglǜ”.","v":"Là người dẫn chương trình truyền hình, trong công việc tôi thường vận dụng “quy luật cao điểm – điểm cuối”."},{"s":"","z":"例如，做节目时，与开幕式相比，我们宁可把更多的精力集中在闭幕式上，这样可以加强观众对节目的印象。","p":"Lìrú, zuò jiémù shí, yǔ kāimùshì xiāngbǐ, wǒmen nìngkě bǎ gèng duō de jīnglì jízhōng zài bìmùshì shang, zhèyàng kěyǐ jiāqiáng guānzhòng duì jiémù de yìnxiàng.","v":"Ví dụ, khi làm chương trình, so với lễ khai mạc, chúng tôi thà dồn nhiều công sức hơn vào lễ bế mạc, như vậy có thể làm khán giả ấn tượng sâu hơn về chương trình."},{"s":"","z":"虽然很多人并不了解“峰终定律”，但是，他们能从经验中体会这种做法的重要性。","p":"Suīrán hěn duō rén bìng bù liǎojiě “Fēngzhōng Dìnglǜ”, dànshì, tāmen néng cóng jīngyàn zhōng tǐhuì zhè zhǒng zuòfǎ de zhòngyàoxìng.","v":"Tuy nhiều người không hề biết đến “quy luật cao điểm – điểm cuối”, nhưng họ có thể cảm nhận được tầm quan trọng của cách làm này từ chính kinh nghiệm."}]}],"gram":[{"id":"yi","t":"以","s":"dùng, bằng (giới từ); để, nhằm (liên từ) — văn viết","b":"<b>以</b> thường dùng trong <b>văn viết</b>. Làm <b>giới từ</b>, nghĩa là “用、拿、凭借” (<i>dùng, lấy, dựa vào</i>), đứng trước danh từ chỉ phương tiện, cách thức. Làm <b>liên từ</b>, biểu thị <b>mục đích</b> (<i>để, nhằm</i>), đứng đầu vế sau, nối với hành động ở vế trước.","r":["Giới từ: 以 + danh từ + động từ: 以英文名WeChat进入国际市场 (vào thị trường quốc tế với tên tiếng Anh WeChat).","Hay gặp kết cấu 以 A 为 B: lấy A làm B — 以足球为比赛工具.","Liên từ: Vế 1 (hành động)，以 + động từ (mục đích): 坚持学习，以适应社会的发展.","Mang sắc thái trang trọng; trong khẩu ngữ thường dùng 用 (giới từ) hoặc 为了/好 (mục đích)."],"e":[["同年4月，（微信）以英文名WeChat正式进入国际市场。","Tóngnián sì yuè, (Wēixìn) yǐ Yīngwénmíng WeChat zhèngshì jìnrù guójì shìchǎng.","Tháng 4 cùng năm, (WeChat) chính thức bước vào thị trường quốc tế với tên tiếng Anh là WeChat."],["……学生分为甲乙两队，以足球为比赛工具向篮内投，按得分多少决定输赢。","……xuésheng fēnwéi jiǎ yǐ liǎng duì, yǐ zúqiú wéi bǐsài gōngjù xiàng lán nèi tóu, àn défēn duōshao juédìng shūyíng.","……Học sinh chia thành hai đội A và B, lấy quả bóng đá làm dụng cụ thi đấu để ném vào rổ, thắng thua quyết định theo số điểm ghi được."],["虽然我们已经老了，但还要坚持学习，以适应社会的发展。","Suīrán wǒmen yǐjīng lǎo le, dàn hái yào jiānchí xuéxí, yǐ shìyìng shèhuì de fāzhǎn.","Tuy chúng tôi đã già rồi nhưng vẫn phải kiên trì học tập để thích ứng với sự phát triển của xã hội."],["比如说为了一场戏剧演出，我们会投入很多时间，准备服装、化妆、道具、舞台美术，以创造良好的效果，……","Bǐrú shuō wèile yì chǎng xìjù yǎnchū, wǒmen huì tóurù hěn duō shíjiān, zhǔnbèi fúzhuāng, huàzhuāng, dàojù, wǔtái měishù, yǐ chuàngzào liánghǎo de xiàoguǒ, ……","Chẳng hạn, vì một buổi diễn kịch, chúng ta sẽ bỏ ra rất nhiều thời gian chuẩn bị trang phục, hoá trang, đạo cụ, mỹ thuật sân khấu để tạo ra hiệu quả tốt, … <i>(bài khoá)</i>"]],"d":[["大家要迅速地熟悉新产品，____更好地向顾客推广。","以"],["虽然我们已经老了，但还要坚持学习，____适应社会的发展。","以"],["同年4月，（微信）____英文名WeChat正式进入国际市场。","以"]],"w":"Khi là liên từ chỉ mục đích, 以 đứng ở <b>đầu vế sau</b> (không đứng đầu câu như 为了): ✓ 坚持学习，以适应…… / ✗ 以适应社会的发展，坚持学习。"},{"id":"pingchang","t":"平常","s":"bình thường (tính từ); ngày thường (danh từ)","b":"<b>平常</b> làm <b>tính từ</b> nghĩa là <i>bình thường, không có gì đặc biệt</i>; có thể lặp thành <b>平平常常</b>. Làm <b>danh từ</b> nghĩa giống “平时” (<i>ngày thường, lúc bình thường</i>), thường đứng trước động từ/làm trạng ngữ chỉ thời gian.","r":["Tính từ: 不平常的日子 (một ngày không bình thường), 剧情平平常常 (tình tiết bình thường).","Danh từ (= 平时): 他平常总是来得很早 — đứng sau chủ ngữ, trước động từ.","Cụm 像平常一样: như ngày thường.","Phân biệt với 平时: 平时 chỉ là danh từ, không làm vị ngữ tính từ — ✗ 这部电影很平时 → ✓ 这部电影很平常."],"e":[["对小王来说，今天是一个不平常的日子，因为他今天第一天上班。","Duì Xiǎo Wáng lái shuō, jīntiān shì yí ge bù píngcháng de rìzi, yīnwèi tā jīntiān dì-yī tiān shàngbān.","Với Tiểu Vương, hôm nay là một ngày không bình thường, vì hôm nay là ngày đầu tiên anh ấy đi làm."],["一部电影，开始虽然剧情平平常常，如果最后半个小时能使我们感动，我们依然会向别人推荐它。","Yí bù diànyǐng, kāishǐ suīrán jùqíng píngpíngchángcháng, rúguǒ zuìhòu bàn ge xiǎoshí néng shǐ wǒmen gǎndòng, wǒmen yīrán huì xiàng biérén tuījiàn tā.","Một bộ phim dù lúc đầu tình tiết bình thường, nhưng nếu nửa tiếng cuối có thể khiến chúng ta cảm động, chúng ta vẫn sẽ giới thiệu nó cho người khác. <i>(bài khoá)</i>"],["他平常总是来得很早，今天却迟到了。","Tā píngcháng zǒngshì lái de hěn zǎo, jīntiān què chídào le.","Ngày thường anh ấy luôn đến rất sớm, vậy mà hôm nay lại đi muộn."],["校长又告诉老师们，对待这些孩子，要像平常一样，不要让孩子或家长知道他们是被选出来的。","Xiàozhǎng yòu gàosu lǎoshīmen, duìdài zhèxiē háizi, yào xiàng píngcháng yíyàng, bú yào ràng háizi huò jiāzhǎng zhīdào tāmen shì bèi xuǎn chulai de.","Hiệu trưởng còn dặn các thầy cô đối xử với những đứa trẻ này như ngày thường, đừng để các em hay phụ huynh biết các em là người được chọn ra."]],"d":[["这部电影很____，我觉得没必要去看。","平常"],["他____总是来得很早，今天却迟到了。","平常"],["对小王来说，今天是一个不____的日子，因为他今天第一天上班。","平常"]],"w":"平常 vừa là tính từ vừa là danh từ; 平时 chỉ là danh từ. Sau 很 / làm định ngữ chỉ tính chất → dùng 平常."},{"id":"ningke","t":"宁可","s":"thà, thà rằng (phó từ)","b":"<b>宁可</b> là <b>phó từ</b>, biểu thị sau khi đã <b>so sánh</b> hai khả năng thì chọn phía <b>tương đối có lợi</b> hơn (dù phía đó có thể phải chịu thiệt một chút). Đứng sau chủ ngữ, trước động từ.","r":["宁可 A，也不 / 也不想 B: thà A chứ không B — 她宁可自己累一点儿，也不想委屈了孩子.","宁可 A，也要 B: thà chịu A cũng phải đạt B — 我宁可多花点儿钱，也要买一个质量好点儿的.","Có thể đi cùng 与……相比 để nêu rõ sự so sánh: 与开幕式相比，我们宁可…….","Vị trí: chủ ngữ + 宁可 + động từ — ✗ 宁可我多花点儿钱 → ✓ 我宁可多花点儿钱."],"e":[["作为母亲，她宁可自己累一点儿，也不想委屈了孩子。","Zuòwéi mǔqīn, tā nìngkě zìjǐ lèi yìdiǎnr, yě bù xiǎng wěiqu le háizi.","Là mẹ, chị ấy thà bản thân vất vả một chút chứ không muốn để con phải chịu thiệt thòi."],["为什么大家宁可挤成一团，也不去没人的那边？","Wèi shénme dàjiā nìngkě jǐ chéng yì tuán, yě bú qù méi rén de nàbiān?","Tại sao mọi người thà chen chúc dồn lại một chỗ chứ không sang phía bên kia không có ai?"],["……做节目时，与开幕式相比，我们宁可把更多的精力集中在闭幕式上，……","……zuò jiémù shí, yǔ kāimùshì xiāngbǐ, wǒmen nìngkě bǎ gèng duō de jīnglì jízhōng zài bìmùshì shang, ……","…Khi làm chương trình, so với lễ khai mạc, chúng tôi thà dồn nhiều công sức hơn vào lễ bế mạc, … <i>(bài khoá)</i>"]],"d":[["我____多花点儿钱，也要买一个质量好点儿的。","宁可"],["作为母亲，她____自己累一点儿，也不想委屈了孩子。","宁可"],["为什么大家____挤成一团，也不去没人的那边？","宁可"]],"w":"宁可 thường đi theo cặp với 也 ở vế sau (也不…… / 也要……)."},{"id":"hushi_qingshi","t":"忽视 vs 轻视","s":"xem nhẹ, không chú ý / coi thường, coi nhẹ","b":"Điểm giống: cả hai đều biểu thị <b>không chú ý, không coi trọng</b>; trong một số câu có thể thay thế cho nhau, nhưng ý nhấn mạnh khác nhau. Ví dụ: 他只注重理论，忽视/轻视实践，所以失败了。","r":["忽视 nhấn mạnh <b>không nghĩ tới, không để ý tới</b>: 他忙得忽视了去医院看病。","轻视 nhấn mạnh <b>coi thường, xem không ra gì</b>: 你可别轻视他，他看起来很平常，其实很能干。","Về thái độ, 忽视 có thể là <b>vô ý</b> cũng có thể là <b>cố ý</b>.","Về thái độ, 轻视 thường là <b>cố ý</b> hoặc <b>có chọn lọc</b>: 虽然这是一次小考，你也不能轻视，要好好复习。"],"e":[["他只注重理论，忽视/轻视实践，所以失败了。","Tā zhǐ zhùzhòng lǐlùn, hūshì/qīngshì shíjiàn, suǒyǐ shībài le.","Anh ta chỉ chú trọng lý thuyết mà xem nhẹ thực tiễn, nên đã thất bại."],["他忙得忽视了去医院看病。","Tā máng de hūshìle qù yīyuàn kànbìng.","Anh ấy bận đến mức quên mất cả việc đi bệnh viện khám bệnh."],["我们常常忽视结束退场时的准备，演出开始时人们认为很有魅力，但是糟糕的结局会给人留下难以忘记的坏印象。","Wǒmen chángcháng hūshì jiéshù tuìchǎng shí de zhǔnbèi, yǎnchū kāishǐ shí rénmen rènwéi hěn yǒu mèilì, dànshì zāogāo de jiéjú huì gěi rén liúxià nányǐ wàngjì de huài yìnxiàng.","Chúng ta thường xem nhẹ việc chuẩn bị cho lúc kết thúc, rời sân khấu; lúc buổi diễn bắt đầu mọi người thấy rất cuốn hút, nhưng một cái kết tồi tệ sẽ để lại ấn tượng xấu khó quên."],["你可别轻视他，他看起来很平常，其实很能干。","Nǐ kě bié qīngshì tā, tā kàn qilai hěn píngcháng, qíshí hěn nénggàn.","Cậu đừng có coi thường anh ta, trông anh ta có vẻ bình thường nhưng thật ra rất giỏi giang."],["虽然这是一次小考，你也不能轻视，要好好复习。","Suīrán zhè shì yí cì xiǎokǎo, nǐ yě bù néng qīngshì, yào hǎohāo fùxí.","Dù đây chỉ là một bài kiểm tra nhỏ, cậu cũng không được coi nhẹ, phải ôn tập cho tốt."]],"d":[["以前我们____了教育问题，现在要赶上去。","忽视"],["我们过多地看电视、玩手机，____了家人之间的交流。","忽视"],["虽然这是一份平常的工作，你也不能____，要认真做好。","轻视"],["你不要因为他是小孩子就____他。","轻视"]],"w":"Mẹo: “quên/không để ý tới” → 忽视; “coi thường, xem không ra gì” (thường có thái độ chủ ý) → 轻视."}],"ext":[["诊断","zhěnduàn","chẩn đoán"],["手术","shǒushù","phẫu thuật"],["血","xiě/xuè","máu"],["肌肉","jīròu","cơ bắp"],["骨头","gǔtou","xương"],["胃","wèi","dạ dày"],["心脏","xīnzàng","tim"],["病毒","bìngdú","vi-rút"],["传染","chuánrǎn","lây nhiễm, truyền nhiễm"],["寿命","shòumìng","tuổi thọ"]],"extt":"医务2","notes":"Nguồn cuối bài khoá: 改编自《广州日报》，作者：埃卡特·冯·希施豪森，陈晓川译. Bài khoá 644 chữ, 5 đoạn trong sách (tr.154–156), chia thành 4 phần: đoạn 1 (từ 1–5 + 3 专名) / đoạn 2 (từ 6–17, tràn từ tr.154 sang tr.155) / đoạn 3–4 (từ 18–27) / đoạn 5 (từ 28–33, tr.156). Từ có dấu * (ngoài đề cương): 2, 3, 9, 10, 25. Từ 25 淋漓尽致 sách không ghi từ loại (để trống pos). Pinyin từ 9 chép theo sách là “huà zhuāng” (có cách). Câu thứ 2 của đoạn 2 dài >45 chữ nhưng không có ；nên giữ nguyên một câu. Phần 注释 gồm 3 mục 词语例释 (以, 平常, 宁可) và 1 词语辨析 (忽视—轻视); bảng 词语搭配 không đưa vào schema. Ví dụ (2) của 宁可 trong sách có chú âm “挤（jǐ, dồn lại）”, đã bỏ phần chú âm trong câu zh. Ví dụ 忽视 ở bảng 辨析 là câu bài khoá được sách viết lại (không nguyên văn) nên không đánh dấu (bài khoá). Drill của 以 lấy từ 练习2① và ví dụ của sách; của 平常 lấy từ 练习2③ và ví dụ của sách; của 宁可 lấy từ 练习3④ và ví dụ của sách (练一练 đều là bài hoàn thành câu mở); drill của 忽视—轻视 lấy từ 做一做 (câu (1) sách đã cho đáp án 忽视), đáp án (2)–(4) do người soạn giải. vocab_ex của 迅速, 深刻, 争取, 忽视, 度过, 依然, 推荐, 运用, 集中 lấy từ câu bài tập/做一做 của sách (đã điền đáp án); của 以, 平常, 宁可 lấy từ phần 注释; còn lại trích câu/vế câu trong bài khoá. Bảng 扩展 (医务2) trong sách chỉ có chữ Hán + pinyin, nghĩa tiếng Việt do người soạn bổ sung.","order":[{"z":"大部分人不理解这一定律。","t":["大部分","人","不","理解","这一","定律"],"v":"Phần lớn mọi người không hiểu quy luật này."},{"z":"但是，我的记忆并不是这样计算的。","t":["但是","我","的","记忆","并","不是","这样","计算","的"],"v":"Nhưng ký ức của tôi lại không hề tính toán như vậy."},{"z":"看电影也是如此。","t":["看","电影","也","是","如此"],"v":"Xem phim cũng vậy."},{"z":"同年4月，（微信）以英文名WeChat正式进入国际市场。","t":["同年","4","月","微信","以","英文名","WeChat","正式","进入","国际","市场"],"v":"Tháng 4 cùng năm, (WeChat) chính thức bước vào thị trường quốc tế với tên tiếng Anh là WeChat."},{"z":"他平常总是来得很早，今天却迟到了。","t":["他","平常","总是","来得","很早","今天","却","迟到","了"],"v":"Ngày thường anh ấy luôn đến rất sớm, vậy mà hôm nay lại đi muộn."},{"z":"为什么大家宁可挤成一团，也不去没人的那边？","t":["为什么","大家","宁可","挤成一团","也","不","去","没人","的","那边"],"v":"Tại sao mọi người thà chen chúc dồn lại một chỗ chứ không sang phía bên kia không có ai?"},{"z":"他只注重理论，忽视/轻视实践，所以失败了。","t":["他","只","注重","理论","忽视","/","轻视","实践","所以","失败","了"],"v":"Anh ta chỉ chú trọng lý thuyết mà xem nhẹ thực tiễn, nên đã thất bại."},{"z":"他忙得忽视了去医院看病。","t":["他","忙","得","忽视","了","去","医院","看病"],"v":"Anh ấy bận đến mức quên mất cả việc đi bệnh viện khám bệnh."},{"z":"你可别轻视他，他看起来很平常，其实很能干。","t":["你","可别","轻视","他","他
