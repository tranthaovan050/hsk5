function vocabTable(ws,id){
  return `<div class="tools"><button class="btn sm" onclick="revAll('${id}',true)">Hiện hết nghĩa</button>
     <button class="btn sm" onclick="revAll('${id}',false)">Che lại</button>
</div>
   <div class="tbl"><table class="masked" id="${id}"><thead><tr><th>Hán</th><th>Pinyin</th><th>Nghĩa & ví dụ <span class="hint">(bấm dòng để lật)</span></th></tr></thead><tbody>`
   + ws.map(w=>`<tr onclick="this.classList.toggle('rv')"><td class="h"><span class="hw">${w.h}${w.x?'<sup class="star" title="Từ ngoài đề cương HSK">*</sup>':''}</span></td>
      <td class="p">${esc(w.p)}</td><td class="m"><span>${w.k?`<span class="pos">${esc(w.k)}</span> `:''}${esc(w.v)}</span>
      ${w.ez?`<div class="exline">${w.ez}</div><div class="exvi">${esc(w.ev)}</div>`:''}</td></tr>`).join('')
   + `</tbody></table></div>`;
}
function revAll(id,v){$$('#'+id+' tbody tr').forEach(r=>r.classList.toggle('rv',v))}
function textSec(t,i){
  return `<div class="tools">
     <span class="chip on" onclick="tg(${i},'p',this)">Pinyin</span>
     <span class="chip on" onclick="tg(${i},'v',this)">Dịch Việt</span></div>
   <div id="tx${i}">${t.lines.map(l=>`<div class="line${l.b?' para':''}">
     <div class="zl">${l.s?`<span class="spk">${esc(l.s)}</span>`:''}${l.z}</div>
     ${l.p?`<div class="pl">${esc(l.p)}</div>`:''}
     <div class="vl">${esc(l.v)}</div></div>`).join('')}</div>`;
}
function tg(i,k,el){$('#tx'+i).classList.toggle('hide'+k);el.classList.toggle('on')}
function rev(el){el.textContent=el.dataset.a;el.classList.add('on')}

function gcard(g,i){
  const eg=(g.e||[]).map(e=>`<div class="eg"><div class="z">${e[0]}</div>
     <div class="y">${esc(e[1])}</div><div class="v">${e[2]}</div></div>`).join('');
  const dr=(g.d||[]).length?`<div class="drill">
     <div class="sub" style="margin-bottom:8px">Luyện tập — bấm chỗ trống để hiện đáp án</div>`
    +g.d.map((q,k)=>`<div class="q"><b>${k+1}.</b>`
      +esc(String(q[0])).replace(/_{2,}/,`<span class="blank" data-a="${esc(q[1])}" onclick="rev(this)">?</span>`)
      +`</div>`).join('')+`</div>`:'';
  return `<details class="gcard" ${i===0?'open':''}><summary><span class="gt">${g.t}</span><span class="gs">${esc(g.s)}</span></summary>
    <div class="gbody"><p>${g.b}</p>${(g.r||[]).length?`<ul>${g.r.map(r=>`<li>${r}</li>`).join('')}</ul>`:''}
    ${eg}${dr}${g.w?`<div class="warn">${g.w}</div>`:''}</div></details>`;
}

function tabsOf(n){
  const L=D[n], T=[], two=L.texts.length>1;
  L.texts.forEach((t,i)=>{
    T.push({id:'v'+i,lb:two?`Từ mới ${i+1}`:'Từ mới',k:'v'});
    T.push({id:'t'+i,lb:two?`Bài khoá ${i+1}`:'Bài khoá',k:'t'});
  });
  T.push({id:'gram',lb:'Ngữ pháp',k:'g'});
  if((L.ext||[]).length) T.push({id:'ext',lb:'Mở rộng',k:'x'});
  T.push({id:'quiz',lb:'Kiểm tra',k:'q'});
  return T;
}
function panel(n,id){
  const L=D[n];
  if(id[0]==='v'){const i=+id.slice(1),b=L.batches[i];
    const two=L.texts.length>1, au=(L.aud||[])[i]||{};
    return `<div class="sh"><h2>Từ mới${two?` ${i+1} · <span class="zh">${L.texts[i].tz}</span>`:''}</h2><span class="tag">${b.length} từ</span></div>
      ${au.v?audioBox(au.v,'Nghe đọc từ mới'):''}${vocabTable(b,'vt'+i)}`}
  if(id[0]==='t'){const i=+id.slice(1),t=L.texts[i];
    const au=(L.aud||[])[i]||{}, title=t.tz||L.tz, tv=t.tv||L.tv;
    return `<div class="sh"><h2>Bài khoá${L.texts.length>1?` ${i+1}`:''} · <span class="zh">${title}</span></h2><span class="tag">${t.lines.length} câu</span></div>
      <div class="sub" style="margin:-6px 0 10px">${esc(tv)}</div>
      ${au.t?audioBox(au.t,'Nghe bài khoá'):''}${textSec(t,i)}`}
  if(id==='gram') return `<div class="sh"><h2>Ngữ pháp bài ${n}</h2><span class="tag p">${L.gram.length} điểm</span>
      <button class="btn sm" style="margin-left:auto" onclick="$$('.gcard').forEach(d=>d.open=!$('.gcard[open]')||!$$('.gcard').every(x=>x.open))">Mở/đóng tất cả</button></div>
      <div class="sub" style="margin-bottom:12px">Soạn theo phần 注释 (词语例释 · 词语辨析) của giáo trình. Ví dụ ghi <i>(bài khoá)</i> là câu nguyên văn trong bài. Bấm tên mục để mở.</div>
      ${L.gram.map(gcard).join('')}`;
  if(id==='ext') return `<div class="sh"><h2>Mở rộng · 扩展</h2><span class="tag">${esc(L.extt||'')}</span></div><div class="ext">
      ${L.ext.map(e=>`<span>${e[0]}<small>${esc(e[1]||'')} · ${esc(e[2]||'')}</small></span>`).join('')}</div>`;
  const nw=allWords(n).length, ng=gramItems(n).length;
  return `<div class="sh"><h2>Kiểm tra cuối bài ${n}</h2><span class="tag p">${nw+ng} câu</span></div>
      <div class="note">Bài kiểm tra đi qua <b>toàn bộ</b> nội dung của bài, theo hai phần:<br>
        <b>Phần 1 — Từ mới:</b> hỏi lần lượt hết ${nw} từ, mỗi từ một câu, thứ tự xáo trộn.<br>
        <b>Phần 2 — Ngữ pháp:</b> làm hết ${ng} câu điền khuyết của ${L.gram.length} điểm ngữ pháp.<br>
        Dạng câu hỏi tự đổi theo mức: đúng 2 câu liên tiếp là lên mức, sai một câu là lùi một mức.
        <b>Dễ:</b> trắc nghiệm, có gợi ý pinyin · <b>Khó:</b> nhiễu cùng bài, điền từ vào câu, viết pinyin ·
        <b>Siêu khó:</b> gõ tay chữ Hán và pinyin.</div>
      <button class="btn primary" onclick="startLessonExam(${n})">Bắt đầu kiểm tra bài ${n}</button>
      ${L.notes?`<details class="srcnote"><summary>Ghi chú về nguồn của bài ${n}</summary><div>${esc(L.notes)}</div></details>`:''}`;
}
const ST={n:LS[0],tab:'v0'};
function renderTabs(){
  const T=tabsOf(ST.n);
  $('#tabs').innerHTML=T.map(t=>`<button class="tab k${t.k} ${t.id===ST.tab&&mode==='lesson'?'on':''}" onclick="openTab(${ST.n},'${t.id}')">${t.lb}</button>`).join('');
  const on=$('#tabs .tab.on'); if(on)on.scrollIntoView({inline:'nearest',block:'nearest'});
  $('#lsel').value=String(ST.n);
}
function openTab(n,id){
  stopAudio(); if(E&&E.tm)clearTimeout(E.tm);
  mode='lesson'; ST.n=n; const T=tabsOf(n); if(!T.some(t=>t.id===id)) id=T[0].id; ST.tab=id;
  const k=T.findIndex(t=>t.id===id), prev=T[k-1], next=T[k+1], L=D[n];
  $('#view').innerHTML=`<div class="lhead"><h1>Bài ${n} <span class="zh">${L.tz||''}</span></h1>
      <div class="sub">${esc(L.tv)} · ${allWords(n).length} từ mới · ${L.gram.length} điểm ngữ pháp</div></div>
    <section class="sec">${panel(n,id)}</section>
    <div class="pager">${prev?`<button class="btn" onclick="openTab(${n},'${prev.id}')">← ${prev.lb}</button>`:(n>LS[0]?`<button class="btn" onclick="openTab(${n-1},'quiz')">← Bài ${n-1}</button>`:'<span></span>')}
      ${next?`<button class="btn primary" onclick="openTab(${n},'${next.id}')">Tiếp: ${next.lb} →</button>`:(n<LS[LS.length-1]?`<button class="btn primary" onclick="openTab(${n+1},'v0')">Sang bài ${n+1} →</button>`:'')}</div>`;
  $('#tabExam').classList.remove('on'); renderTabs();
  try{history.replaceState(null,'','#L'+n+'-'+id); localStorage.setItem('hsk5pos',n+'|'+id)}catch(e){}
  window.scrollTo({top:0});
}

function tgL(l,el){GEX.ls.has(l)?GEX.ls.delete(l):GEX.ls.add(l);el.classList.toggle('on')}
function allL(v){GEX.ls=new Set(v?LS:[]);
  $$('#pkL span').forEach((s,i)=>{if(i<LS.length)s.classList.toggle('on',v)})}
document.addEventListener('input',e=>{if(e.target.id==='cnt')

/* ==================== BỘ KIỂM TRA THÍCH ỨNG ====================
   3 mức. Đúng 2 câu liên tiếp → lên mức. Sai 1 câu → xuống mức.
   Mức 1 trắc nghiệm nhiễu ngẫu nhiên · Mức 2 nhiễu gần + điền từ + ngữ pháp
   Mức 3 gõ tay, không có lựa chọn sẵn, thêm sắp xếp trật tự từ.        */
const LV=[{n:'Dễ',c:'var(--ok)'},{n:'Khó',c:'var(--warn)'},{n:'Siêu khó',c:'var(--bad)'}];
const TN={hv:'Hán → nghĩa',vh:'Nghĩa → Hán',fill:'Điền từ vào câu',gram:'Ngữ pháp',
          py:'Viết pinyin',han:'Viết chữ Hán',order:'Sắp xếp trật tự từ'};

let E=null;
function newExam(lessons,count,tag){
  if(E)clearTimeout(E.tm);
  E={ls:lessons,total:count,i:0,lv:0,streak:0,right:0,wrong:0,peak:0,
     asked:new Set(),missed:[],answered:false,tag:tag,hist:[],id:Math.random()};
}
const pool=()=>E.ls.flatMap(l=>D[l].batches.flat().map(w=>({...w,L:l})));
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function others(arr,not,k,key){
  const s=shuffle(arr.filter(x=>x[key]!==not)).slice(0,k);return s}

function makeQ(){
  const P=pool(), lv=E.lv;
  let types = lv===0 ? ['hv','vh','hv','fill']
            : lv===1 ? ['fill','gram','vh','hv','py']
                     : ['han','py','order','fillType','gram'];
  for(let attempt=0;attempt<40;attempt++){
    const t=rnd(types), w=rnd(P);
    let q=null;
    if(t==='hv'){
      // mức 1 nhiễu bất kỳ; mức 2 nhiễu cùng bài
      const src = lv===0?P:P.filter(x=>x.L===w.L);
      const o=others(src.length>4?src:P,w.v,3,'v').map(x=>x.v);
      if(o.length<3) continue;
      q={t,L:w.L,key:'hv'+w.h,ask:`<div class="big">${w.h}</div>`,
         hint:lv===0?w.p:'',a:w.v,o:shuffle([w.v,...o])};
    } else if(t==='vh'){
      const src = lv===0?P:P.filter(x=>x.L===w.L&&x.h.length===w.h.length);
      const o=others(src.length>4?src:P,w.h,3,'h').map(x=>x.h);
      if(o.length<3) continue;
      q={t,L:w.L,key:'vh'+w.h,ask:`<div class="mid">${esc(w.v)}</div>`,
         a:w.h,o:shuffle([w.h,...o])};
    } else if(t==='fill'||t==='fillType'){
      if(!w.ez||!w.ez.includes(w.h)) continue;
      const sent=w.ez.replace(w.h,'⟦⟧');
      if(t==='fillType'){
        q={t:'fillType',L:w.L,key:'ft'+w.h,type:'type',ph:'gõ chữ Hán',
           ask:`<div class="sent">${sent.replace('⟦⟧','<span class="gap">?</span>')}</div>`,
           hint:w.v,a:w.h,rev:w.ev};
      } else {
        const src=P.filter(x=>x.L===w.L&&x.h.length===w.h.length&&x.h!==w.h);
        const o=others(src.length>=3?src:P,w.h,3,'h').map(x=>x.h);
        if(o.length<3) continue;
        q={t:'fill',L:w.L,key:'fl'+w.h,
           ask:`<div class="sent">${sent.replace('⟦⟧','<span class="gap">?</span>')}</div>`,
           a:w.h,o:shuffle([w.h,...o]),rev:w.ev};
      }
    } else if(t==='py'){
      q={t,L:w.L,key:'py'+w.h,type:'type',ph:'pinyin, không cần dấu',
         ask:`<div class="big">${w.h}</div>`,hint:w.v,a:w.p};
    } else if(t==='han'){
      q={t,L:w.L,key:'hn'+w.h,type:'type',ph:'gõ chữ Hán',
         ask:`<div class="mid">${esc(w.v)}</div>`,hint:w.p,a:w.h};
    } else if(t==='gram'){
      const L=rnd(E.ls), gs=D[L].gram.filter(g=>(g.d||[]).some(d=>d[1]&&/_{2,}/.test(String(d[0]))));
      if(!gs.length) continue;
      const g=rnd(gs), d=rnd(g.d.filter(d=>d[1]&&/_{2,}/.test(String(d[0]))));
      const alt=[...new Set(D[L].gram.flatMap(x=>(x.d||[]).map(y=>y[1])).filter(v=>v&&v!==d[1]))];
      if(alt.length<3) continue;
      q={t,L,key:'gr'+d[0],
         ask:`<div class="sent">${esc(String(d[0])).replace(/_{2,}/,'<span class="gap">?</span>')}</div>`,
         hint:g.t,a:d[1],o:shuffle([d[1],...shuffle(alt).slice(0,3)])};
    } else if(t==='order'){
      const L=rnd(E.ls), os=D[L].order||[];
      if(!os.length) continue;
      const it=rnd(os);
      q={t,L,key:'or'+it.z,type:'order',ask:'',hint:it.v,a:it.z,toks:shuffle([...it.t])};
    }
    if(q && !E.asked.has(q.key)){E.asked.add(q.key);return q}
    if(q && attempt>28) return q;
  }
  return null;
}

function examShell(inner){
  const pct=E.i/E.total*100;
  return `<div class="pbar"><i style="width:${pct}%"></i></div>
   <div class="qcard">
    <div class="qhead">
      <span>${E.seq?phaseLabel():`Câu <b>${E.i+1}</b>/${E.total} · Bài ${E.q?E.q.L:''}`}</span>
      <span><span class="lvbadge" style="color:${LV[E.lv].c};border-color:${LV[E.lv].c}">
        Mức ${E.lv+1} · ${LV[E.lv].n}</span>
        <span class="qtype">${E.q?TN[E.q.t]||TN.fill:''}</span></span>
    </div>${inner}
    <div class="verdict" id="vd"></div><div class="reveal hide" id="rv"></div>
   </div>
   <div style="display:flex;gap:10px;justify-content:center">
     <button class="btn" onclick="answerSkip()">Bỏ qua →</button>
     <button class="btn" onclick="quitExam()">Thoát</button></div>
   <div class="stats">Đúng <b style="color:var(--ok)">${E.right}</b> ·
     Sai <b style="color:var(--bad)">${E.wrong}</b> ·
     Mức cao nhất <b>${LV[E.peak].n}</b></div>`;
}

function renderExamQ(){
  const q=E.q=(E.seq?makeSeqQ(E.seq[E.i]):makeQ());
  if(!q){finishExam();return}
  let ctrl='';
  if(q.type==='type'){
    ctrl=`<div class="tybox"><input id="ans" autocomplete="off" spellcheck="false"
      placeholder="${q.ph}"><button class="btn primary" id="go">Kiểm tra</button></div>`;
  } else if(q.type==='order'){
    ctrl=`<div class="ordbox"><div class="slot" id="slot"></div>
      <div class="bank" id="bank">${q.toks.map((t,i)=>
        `<span class="tok" data-i="${i}" onclick="tokPush(${i})">${t}</span>`).join('')}</div>
      <div style="text-align:center;margin-top:12px">
        <button class="btn primary" id="go" onclick="checkOrder()">Kiểm tra</button>
        <button class="btn" onclick="tokReset()">Xoá</button></div></div>`;
  } else {
    ctrl=`<div class="opts">${q.o.map((o,k)=>
      `<div class="opt" onclick="pickOpt(${k})">${esc(o)}</div>`).join('')}</div>`;
  }
  const body=`<div class="qbody">${q.ask}
     ${q.hint?`<div class="sub" style="margin-top:8px">${esc(q.hint)}</div>`:''}</div>`;
  $('#view').innerHTML=examShell(body+ctrl);
  E.answered=false; E.sel=[];
  if(q.type==='type'){
    $('#go').onclick=checkTyped;
    $('#ans').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();E.answered?nextExamQ():checkTyped()}};
    $('#ans').focus();
  }
}
function grade(ok,given){
  if(E.answered)return; E.answered=true;
  E.hist.push({lv:E.lv,ok});
  if(ok){E.right++;E.streak++;
    if(E.streak>=2&&E.lv<2){E.lv++;E.streak=0;flash('▲ Lên mức '+LV[E.lv].n)}
  }else{E.wrong++;E.streak=0;E.missed.push({q:E.q,given});
    if(E.lv>0){E.lv--;flash('▼ Xuống mức '+LV[E.lv].n)}}
  if(E.lv>E.peak)E.peak=E.lv;
}
function flash(msg){
  const d=document.createElement('div');d.className='flash';d.textContent=msg;
  document.body.appendChild(d);setTimeout(()=>d.remove(),1400);
}
function pickOpt(k){
  if(E.answered)return;
  const q=E.q, ok=q.o[k]===q.a;
  grade(ok,q.o[k]);
  $$('.opt').forEach((e,i)=>{if(q.o[i]===q.a)e.classList.add('ok');else if(i===k)e.classList.add('bad')});
  say(ok);
  const id=E.id; clearTimeout(E.tm); E.tm=setTimeout(()=>{if(E&&E.id===id&&E.answered)nextExamQ()},ok?700:2200);
}
function checkTyped(){
  const q=E.q,v=$('#ans').value; if(!v.trim())return;
  const hz=x=>x.replace(/[（(][^）)]*[）)]/g,'').replace(/[（）()…\s]/g,''), hf=x=>x.replace(/[（）()…\s]/g,'');
  const ok = q.t==='py' ? (strip(v)===strip(q.a)||strip(v)===strip(q.a.replace(/[（(][^）)]*[）)]/g,''))||strip(v)===strip(q.a.replace(/[（）()]/g,'')))
                       : (v.trim()===q.a||hz(v)===hz(q.a)||hf(v)===hf(q.a));
  grade(ok,v.trim()); say(ok);
  $('#ans').disabled=true;$('#go').textContent='Tiếp →';$('#go').onclick=nextExamQ;
}
function say(ok){
  const q=E.q;
  $('#vd').className='verdict '+(ok?'ok':'bad');
  $('#vd').textContent=ok?'✓ Đúng':'✗ Sai — đáp án: '+q.a;
  if(q.rev){$('#rv').classList.remove('hide');$('#rv').textContent=q.rev}
}
function tokPush(i){
  if(E.answered)return;
  const el=document.querySelector(`.tok[data-i="${i}"]`);
  if(!el||el.classList.contains('used'))return;
  el.classList.add('used'); E.sel.push(i);
  drawSlot();
}
function tokPop(k){
  if(E.answered)return;
  const i=E.sel.splice(k,1)[0];
  document.querySelector(`.tok[data-i="${i}"]`).classList.remove('used');
  drawSlot();
}
function tokReset(){if(E.answered)return;E.sel=[];$$('.tok').forEach(t=>t.classList.remove('used'));drawSlot()}
function drawSlot(){
  $('#slot').innerHTML=E.sel.length
    ? E.sel.map((i,k)=>`<span class="tok sel" onclick="tokPop(${k})">${E.q.toks[i]}</span>`).join('')
    : `<span class="ph">Bấm các thẻ bên dưới để xếp thành câu đúng</span>`;
}
function checkOrder(){
  if(E.answered)return;
  const q=E.q, built=E.sel.map(i=>q.toks[i]).join('');
  const target=q.a.replace(/[，。？！、；：“”‘’…—]/g,'');
  const ok=built===target;
  grade(ok,built||'(bỏ trống)');
  $('#vd').className='verdict '+(ok?'ok':'bad');
  $('#vd').textContent=ok?'✓ Đúng':'✗ Sai';
  $('#rv').classList.remove('hide');
  $('#rv').innerHTML=`<div style="font-size:18px;color:var(--ink)">${q.a}</div>
    <div style="margin-top:4px">${esc(q.hint||'')}</div>`;
  $('#go').textContent='Tiếp →'; $('#go').onclick=nextExamQ;
}
function answerSkip(){if(!E.answered)grade(false,'(bỏ qua)');nextExamQ()}
function nextExamQ(){ if(E.queue)return nextRetry(); if(E.i<E.total-1){E.i++;if(E.seq&&E.i===E.nw&&E.ng)flash('Xong phần từ mới → sang ngữ pháp');renderExamQ()} else finishExam() }
function quitExam(){ clearTimeout(E.tm); E.tag==='global'?show('exam'):openTab(E.ls[0],'quiz') }

function finishExam(){
  const t=E.right+E.wrong,pct=t?Math.round(E.right/t*100):0;
  const lvl=LV[E.peak].n;
  $('#view').innerHTML=`<div class="qcard" style="text-align:center">
    <div style="font-size:52px">${pct>=90?'🎉':pct>=70?'👍':'💪'}</div>
    <div style="font-size:22px;font-weight:650;margin:8px 0">${E.right}/${t} câu đúng — ${pct}%</div>
    <div class="sub">Bài ${E.ls.join(', ')} · lên tới mức <b style="color:${LV[E.peak].c}">${lvl}</b></div>
    ${E.nw!=null?`<div class="sub" style="margin-top:6px">Từ mới: <b>${E.nw-E.missed.filter(m=>m.q.t!=='gram').length}/${E.nw}</b> ·
      Ngữ pháp: <b>${E.ng-E.missed.filter(m=>m.q.t==='gram').length}/${E.ng}</b></div>`:''}
    <div style="margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn primary" onclick="${E.tag==='global'?'startGlobal()':`startLessonExam(${E.ls[0]})`}">Làm lại</button>
      ${E.missed.length?`<button class="btn" onclick="retryMissed()">Ôn ${E.missed.length} câu sai</button>`:''}
      <button class="btn" onclick="quitExam()">Quay lại bài học</button>
    </div></div>
    ${E.missed.length?`<div class="review"><h2 style="font-size:16px">Câu đã sai</h2>
      ${E.missed.map(m=>`<div class="r">
        <div class="q">${String(m.q.ask||'').replace(/<[^>]+>/g,' ').trim()||m.q.a}</div>
        <div class="a">Bạn trả lời <b style="color:var(--bad)">${esc(m.given)}</b> ·
          Đáp án <b style="color:var(--ok)">${esc(m.q.a)}</b> · Bài ${m.q.L} · ${TN[m.q.t]||''}</div>
        </div>`).join('')}</div>`
      :`<div class="note" style="margin-top:14px">Không sai câu nào. Thử tăng số câu hoặc gộp thêm bài khác ở mục Kiểm tra tổng hợp.</div>`}`;
}
function retryMissed(){
  const ms=E.missed.slice();
  const ls=E.ls,tag=E.tag;
  newExam(ls,ms.length,tag); E.seq=null;
  E.queue=shuffle(ms.map(m=>m.q));
  E.lv=2;
  renderRetry();
}
function renderRetry(){
  E.q=E.queue[E.i];
  if(!E.q){finishExam();return}
  let ctrl;
  const q=E.q;
  if(q.type==='order'){
    ctrl=`<div class="ordbox"><div class="slot" id="slot"></div>
      <div class="bank" id="bank">${q.toks.map((t,i)=>
        `<span class="tok" data-i="${i}" onclick="tokPush(${i})">${t}</span>`).join('')}</div>
      <div style="text-align:center;margin-top:12px">
        <button class="btn primary" id="go" onclick="checkOrder()">Kiểm tra</button>
        <button class="btn" onclick="tokReset()">Xoá</button></div></div>`;
  } else if(q.type==='type'){
    ctrl=`<div class="tybox"><input id="ans" autocomplete="off" placeholder="${q.ph}">
      <button class="btn primary" id="go">Kiểm tra</button></div>`;
  } else {
    ctrl=`<div class="opts">${q.o.map((o,k)=>
      `<div class="opt" onclick="pickOptR(${k})">${esc(o)}</div>`).join('')}</div>`;
  }
  $('#view').innerHTML=examShell(`<div class="qbody">${q.ask}
     ${q.hint?`<div class="sub" style="margin-top:8px">${esc(q.hint)}</div>`:''}</div>`+ctrl);
  E.answered=false;E.sel=[];
  if(q.type==='type'){$('#go').onclick=checkTyped;
    $('#ans').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();E.answered?nextRetry():checkTyped()}};
    $('#ans').focus()}
  if(q.type==='order')drawSlot();
}
function pickOptR(k){pickOpt(k)}
function nextRetry(){if(E.i<E.queue.length-1){E.i++;renderRetry()}else finishExam()}

/* điểm vào */
/* Kiểm tra cuối bài: phần 1 hỏi lần lượt HẾT từ mới, phần 2 hỏi HẾT câu ngữ pháp.
   Dạng câu hỏi vẫn theo mức độ khó tự điều chỉnh. */
function gramItems(n){
  const L=D[n], out=[];
  L.gram.forEach(g=>{
    let ds=(g.d||[]).filter(d=>d[1]&&/_{2,}/.test(String(d[0])));
    if(!ds.length){ // thẻ không có bài điền: khoét từ khoá khỏi câu ví dụ
      const keys=String(g.t).replace(/<[^>]+>/g,'').split(/\s*vs\s*|\s*\/\s*|[，,、]/).map(k=>k.replace(/[…\.]+/g,'').trim()).filter(k=>/^[一-鿿]+$/.test(k));
      (g.e||[]).forEach(e=>{const k=keys.find(k=>String(e[0]).includes(k));
        if(k&&ds.length<2) ds.push([String(e[0]).replace(k,'____'),k,e[2]]);});
    }
    ds.forEach(d=>out.push({g,d}));
  });
  return out;
}
function startLessonExam(n){
  stopAudio(); mode='lesson'; ST.n=n; ST.tab='quiz'; renderTabs(); window.scrollTo({top:0});
  const ws=shuffle(D[n].batches.flat().map(w=>({k:'w',w:{...w,L:n}})));
  const gs=shuffle(gramItems(n).map(x=>({k:'g',L:n,...x})));
  newExam([n],ws.length+gs.length,'lesson');
  E.seq=[...ws,...gs]; E.nw=ws.length; E.ng=gs.length;
  renderExamQ();
}
function phaseLabel(){
  return E.i<E.nw ? `Phần 1/2 · Từ mới <b>${E.i+1}</b>/${E.nw}`
                  : `Phần 2/2 · Ngữ pháp <b>${E.i-E.nw+1}</b>/${E.ng}`;
}
function makeSeqQ(it){
  if(!it) return null;
  const lv=E.lv, n=E.ls[0];
  if(it.k==='g'){
    const d=it.d, ans=String(d[1]);
    const ask=`<div class="sent">${esc(String(d[0])).replace(/_{2,}/,'<span class="gap">?</span>')}</div>`;
    const hint=String(it.g.t).replace(/<[^>]+>/g,'');
    if(lv===2 && /^[一-鿿]+$/.test(ans))
      return {t:'gram',L:n,key:'gs'+d[0],type:'type',ph:'gõ chữ Hán vào chỗ trống',ask,hint,a:ans,rev:d[2]?String(d[2]).replace(/<[^>]+>/g,''):''};
    let alt=[...new Set(gramItems(n).map(x=>String(x.d[1])).filter(v=>v&&v!==ans))];
    if(alt.length<3) alt=[...new Set(alt.concat(D[n].batches.flat().map(w=>w.h).filter(h=>h!==ans)))];
    return {t:'gram',L:n,key:'gs'+d[0],ask,hint:lv===0?hint:'',a:ans,o:shuffle([ans,...shuffle(alt).slice(0,3)])};
  }
  const w=it.w, P=D[n].batches.flat().map(x=>({...x,L:n}));
  const canFill=w.ez&&w.ez.includes(w.h);
  const types = lv===0 ? ['hv','vh'] : lv===1 ? (canFill?['fill','fill','vh','hv']:['vh','hv','py'])
              : (canFill?['han','fillType','py']:['han','py']);
  const t=rnd(types);
  if(t==='hv'){const o=others(lv===0?pool().concat(P):P,w.v,3,'v').map(x=>x.v);
    return {t,L:n,key:'hv'+w.h,ask:`<div class="big">${w.h}</div>`,hint:lv===0?w.p:'',a:w.v,o:shuffle([w.v,...o])};}
  if(t==='vh'){const src=P.filter(x=>x.h.length===w.h.length&&x.h!==w.h);
    const o=others(src.length>=3?src:P,w.h,3,'h').map(x=>x.h);
    return {t,L:n,key:'vh'+w.h,ask:`<div class="mid">${esc(w.v)}</div>`,hint:lv===0?'':'',a:w.h,o:shuffle([w.h,...o])};}
  const sent=canFill?w.ez.replace(w.h,'<span class="gap">?</span>'):'';
  if(t==='fill'){const src=P.filter(x=>x.h.length===w.h.length&&x.h!==w.h);
    const o=others(src.length>=3?src:P,w.h,3,'h').map(x=>x.h);
    return {t,L:n,key:'fl'+w.h,ask:`<div class="sent">${sent}</div>`,a:w.h,o:shuffle([w.h,...o]),rev:w.ev};}
  if(t==='fillType') return {t,L:n,key:'ft'+w.h,type:'type',ph:'gõ chữ Hán',ask:`<div class="sent">${sent}</div>`,hint:w.v,a:w.h,rev:w.ev};
  if(t==='py') return {t,L:n,key:'py'+w.h,type:'type',ph:'pinyin, không cần dấu',ask:`<div class="big">${w.h}</div>`,hint:w.v,a:w.p};
  return {t:'han',L:n,key:'hn'+w.h,type:'type',ph:'gõ chữ Hán',ask:`<div class="mid">${esc(w.v)}</div>`,hint:w.p,a:w.h};
}
function startGlobal(){
  const ls=[...GEX.ls].sort((a,b)=>a-b);
  if(!ls.length){const b=document.querySelector('#pkL');if(b){b.insertAdjacentHTML('afterend','<div class="sub" style="color:var(--bad);margin-top:6px">Chọn ít nhất một bài để bắt đầu.</div>')}return}
  newExam(ls,GEX.count,'global');
  renderExamQ();
}

/* ============== ĐIỀU HƯỚNG ============== */
function show(what,n){
  if(what==='exam'){stopAudio();if(E&&E.tm)clearTimeout(E.tm);mode='exam';$('#tabExam').classList.add('on');
    $('#tabs').innerHTML=`<span class="sub" style="padding:6px 2px">Trộn câu hỏi từ nhiều bài — chọn bài bên dưới.</span>`;renderExamSetup();window.scrollTo({top:0})}
  else openTab(n||ST.n,'v0');
}
$('#lsel').innerHTML=[['Tập 1 · 上',LS.filter(l=>l<=18)],['Tập 2 · 下',LS.filter(l=>l>18)]].filter(g=>g[1].length)
  .map(g=>`<optgroup label="${g[0]}">${g[1].map(l=>`<option value="${l}">Bài ${l} · ${D[l].tz}</option>`).join('')}</optgroup>`).join('');
$('#lsel').onchange=e=>openTab(+e.target.value,'v0');
$('#prevL').onclick=()=>{const i=LS.indexOf(ST.n);if(i>0)openTab(LS[i-1],'v0')};
$('#nextL').onclick=()=>{const i=LS.indexOf(ST.n);if(i<LS.length-1)openTab(LS[i+1],'v0')};
(function boot(){
  let n=LS[0],id='v0';
  const m=(location.hash||'').match(/^#L(\d+)(?:-(\w+))?$/);
  if(m&&D[m[1]]){n=+m[1];id=m[2]||'v0'}
  else{try{const s=(localStorage.getItem('hsk5pos')||'').split('|');if(D[s[0]]){n=+s[0];id=s[1]||'v0'}}catch(e){}}
  openTab(n,id);
})();
