.","v":"Trong tác phẩm của các họa sĩ trường phái trừu tượng thường thấy những bức tranh trông như được tạo nên từ việc vẩy màu tùy tiện; có người thấy chúng vô cùng bí ẩn, thậm chí xấu xí, nhưng có người lại cảm nhận được trong đó lời ca ngợi tự do và sự sống."},{"s":"","z":"研究者设计了一个有趣的实验。","p":"Yánjiūzhě shèjìle yí ge yǒuqù de shíyàn.","v":"Các nhà nghiên cứu đã thiết kế một thí nghiệm thú vị."},{"s":"","z":"志愿者的任务很简单，每个人会看到两两一组出现的一些图画，每组中一幅出自著名抽象艺术家之手，另一幅是业余爱好者、婴儿、黑猩猩或者大象的涂鸦。","p":"Zhìyuànzhě de rènwu hěn jiǎndān, měi ge rén huì kàndào liǎngliǎng yì zǔ chūxiàn de yìxiē túhuà, měi zǔ zhōng yì fú chūzì zhùmíng chōuxiàng yìshùjiā zhī shǒu, lìng yì fú shì yèyú àihàozhě, yīng'ér, hēixīngxing huòzhě dàxiàng de túyā.","v":"Nhiệm vụ của tình nguyện viên rất đơn giản: mỗi người sẽ xem một loạt tranh xuất hiện theo từng cặp, mỗi cặp có một bức do một họa sĩ trừu tượng nổi tiếng vẽ, bức còn lại là nét vẽ nguệch ngoạc của người vẽ nghiệp dư, trẻ sơ sinh, tinh tinh hoặc voi."},{"s":"","z":"志愿者必须判断每一组画作中自己更喜欢哪一幅。","p":"Zhìyuànzhě bìxū pànduàn měi yì zǔ huàzuò zhōng zìjǐ gèng xǐhuan nǎ yì fú.","v":"Tình nguyện viên phải xác định trong mỗi cặp tranh, mình thích bức nào hơn."}]},{"no":2,"tz":"","tv":"","lines":[{"s":"","z":"其中三分之一的画作作者没有签名，而其余的则标明了身份。","p":"Qízhōng sān fēn zhī yī de huàzuò zuòzhě méiyǒu qiānmíng, ér qíyú de zé biāomíngle shēnfèn.","v":"Trong số đó, một phần ba số tranh không có chữ ký của tác giả, còn những bức còn lại thì ghi rõ danh tính."},{"s":"","z":"令人头疼的是，一些签名被故意弄错了，志愿者无法确认作者到底是谁，所以有可能志愿者认为自己看到的是黑猩猩的随手涂鸦，实际则是著名抽象艺术家的大作。","p":"Lìng rén tóuténg de shì, yìxiē qiānmíng bèi gùyì nòngcuò le, zhìyuànzhě wúfǎ quèrèn zuòzhě dàodǐ shì shéi, suǒyǐ yǒu kěnéng zhìyuànzhě rènwéi zìjǐ kàndào de shì hēixīngxing de suíshǒu túyā, shíjì zé shì zhùmíng chōuxiàng yìshùjiā de dàzuò.","v":"Điều gây đau đầu là một số chữ ký đã bị cố ý ghi sai, tình nguyện viên không thể xác nhận rốt cuộc tác giả là ai; vì vậy rất có thể tình nguyện viên tưởng mình đang xem nét vẽ nguệch ngoạc tiện tay của một con tinh tinh, nhưng thực ra đó lại là kiệt tác của một họa sĩ trừu tượng nổi tiếng."},{"s":"","z":"也许有人认为，在这种情况下根本不可能分辨出来。","p":"Yěxǔ yǒu rén rènwéi, zài zhè zhǒng qíngkuàng xià gēnběn bù kěnéng fēnbiàn chūlai.","v":"Có lẽ có người cho rằng trong tình huống như vậy thì hoàn toàn không thể phân biệt được."},{"s":"","z":"然而在每一次测试中，志愿者普遍更喜欢的作品都是由人类艺术家挥笔完成的。","p":"Rán'ér zài měi yí cì cèshì zhōng, zhìyuànzhě pǔbiàn gèng xǐhuan de zuòpǐn dōu shì yóu rénlèi yìshùjiā huī bǐ wánchéng de.","v":"Thế nhưng trong mọi lần thử nghiệm, những tác phẩm mà tình nguyện viên nhìn chung thích hơn đều do họa sĩ là con người vung bút hoàn thành."},{"s":"","z":"由此可见，志愿者能够从画作中感知艺术家的用心，哪怕他们不能够解释原因。","p":"Yóucǐ kějiàn, zhìyuànzhě nénggòu cóng huàzuò zhōng gǎnzhī yìshùjiā de yòngxīn, nǎpà tāmen bù nénggòu jiěshì yuányīn.","v":"Từ đó có thể thấy, tình nguyện viên có thể cảm nhận được tâm huyết của người nghệ sĩ qua bức tranh, cho dù họ không giải thích được lý do."}]},{"no":3,"tz":"","tv":"","lines":[{"s":"","z":"另一个实验是这样，志愿者同时欣赏原作和画面元素被调整后的画作，包括静物画和抽象画。","p":"Lìng yí ge shíyàn shì zhèyàng, zhìyuànzhě tóngshí xīnshǎng yuánzuò hé huàmiàn yuánsù bèi tiáozhěng hòu de huàzuò, bāokuò jìngwùhuà hé chōuxiànghuà.","v":"Một thí nghiệm khác như sau: tình nguyện viên cùng lúc xem bản gốc và bức tranh đã bị điều chỉnh các yếu tố trong khung hình, gồm cả tranh tĩnh vật lẫn tranh trừu tượng."},{"s":"","z":"结果，几乎每个人都更喜欢原作。","p":"Jiéguǒ, jīhū měi ge rén dōu gèng xǐhuan yuánzuò.","v":"Kết quả là hầu như ai cũng thích bản gốc hơn."},{"s":"","z":"研究者发现，当看到画上物体位置变化后，大脑中有关含意和解释的区域活跃性下降了。","p":"Yánjiūzhě fāxiàn, dāng kàndào huà shang wùtǐ wèizhì biànhuà hòu, dànǎo zhōng yǒuguān hányì hé jiěshì de qūyù huóyuèxìng xiàjiàng le.","v":"Các nhà nghiên cứu phát hiện, khi thấy vị trí các vật thể trong tranh bị thay đổi, mức độ hoạt động của vùng não liên quan đến hàm ý và việc lý giải đã giảm xuống."},{"s":"","z":"这表明，我们的大脑注意到了原作的布局，并且可以感知其背后的用意，即使我们还没有清楚地感受到这个事实。","p":"Zhè biǎomíng, wǒmen de dànǎo zhùyì dàole yuánzuò de bùjú, bìngqiě kěyǐ gǎnzhī qí bèihòu de yòngyì, jíshǐ wǒmen hái méiyǒu qīngchu de gǎnshòu dào zhège shìshí.","v":"Điều này cho thấy bộ não chúng ta đã chú ý đến bố cục của bản gốc và có thể cảm nhận được dụng ý đằng sau nó, ngay cả khi bản thân chúng ta chưa nhận thức rõ sự thật này."},{"s":"","z":"至少目前可以这么说，没有证据表明黑猩猩或儿童可以这样做。","p":"Zhìshǎo mùqián kěyǐ zhème shuō, méiyǒu zhèngjù biǎomíng hēixīngxing huò értóng kěyǐ zhèyàng zuò.","v":"Ít nhất hiện nay có thể nói rằng chưa có bằng chứng nào cho thấy tinh tinh hay trẻ em làm được như vậy."},{"s":"","z":"我们的大脑究竟如何感知抽象艺术，是一个有趣的话题。","p":"Wǒmen de dànǎo jiūjìng rúhé gǎnzhī chōuxiàng yìshù, shì yí ge yǒuqù de huàtí.","v":"Rốt cuộc bộ não của chúng ta cảm nhận nghệ thuật trừu tượng như thế nào là một đề tài thú vị."},{"s":"","z":"每个人对抽象艺术可以有不同的解读，这既是挑战，也是自由。","p":"Měi ge rén duì chōuxiàng yìshù kěyǐ yǒu bù tóng de jiědú, zhè jì shì tiǎozhàn, yě shì zìyóu.","v":"Mỗi người có thể có cách hiểu khác nhau về nghệ thuật trừu tượng, đó vừa là thử thách, vừa là tự do."}]}],"gram":[{"id":"jiqi","t":"极其","s":"vô cùng, hết sức (phó từ)","b":"<b>极其</b> là <b>phó từ</b>, nghĩa là “非常” (rất, vô cùng), chủ yếu dùng trong <b>văn viết</b>. Nó <b>chỉ bổ nghĩa cho tính từ hai âm tiết hoặc nhiều âm tiết</b>, đứng ngay trước tính từ đó.","r":["Cấu trúc: 极其 + tính từ hai/nhiều âm tiết: 极其少见、极其糟糕、极其神秘.","Mang sắc thái trang trọng, sách vở; trong khẩu ngữ thường dùng 非常.","Lỗi hay gặp: ✗ 那个人长得极其丑。 → ✓ 那个人长得非常丑。 (丑 là tính từ một âm tiết — 练习 2①)"],"e":[["在中国，餐桌上放一把刀是极其少见的现象。","Zài Zhōngguó, cānzhuō shang fàng yì bǎ dāo shì jíqí shǎojiàn de xiànxiàng.","Ở Trung Quốc, đặt một con dao trên bàn ăn là chuyện cực kỳ hiếm thấy."],["每天说“太糟糕了”“太讨厌了”“真倒霉”的人，遇到的困难也格外多，运气也显得极其糟糕。","Měi tiān shuō “tài zāogāo le” “tài tǎoyàn le” “zhēn dǎoméi” de rén, yùdào de kùnnan yě géwài duō, yùnqì yě xiǎnde jíqí zāogāo.","Người ngày nào cũng than “tệ quá”, “chán quá”, “xui thật” thì gặp khó khăn cũng nhiều hơn hẳn, vận may cũng có vẻ cực kỳ tệ hại."],["抽象派画家的作品中经常见到好像随便洒上颜料而形成的画作，在有人看来极其神秘甚至丑陋，……","Chōuxiàngpài huàjiā de zuòpǐn zhōng jīngcháng jiàndào hǎoxiàng suíbiàn sǎshang yánliào ér xíngchéng de huàzuò, zài yǒu rén kànlái jíqí shénmì shènzhì chǒulòu, ……","Trong tác phẩm của các họa sĩ trường phái trừu tượng thường thấy những bức tranh trông như được tạo nên từ việc vẩy màu tùy tiện, có người thấy chúng vô cùng bí ẩn, thậm chí xấu xí… <i>(bài khoá)</i>"]],"d":[["我对这个人____欣赏，我认为他很有才华。","极其"],["在中国，餐桌上放一把刀是____少见的现象。","极其"],["抽象派画家的作品在有人看来____神秘甚至丑陋。","极其"]],"w":"极其 không đi với tính từ một âm tiết: nói 非常丑, không nói 极其丑. Khẩu ngữ hằng ngày ưu tiên 非常."},{"id":"qiyu","t":"其余","s":"phần còn lại, những cái khác (đại từ)","b":"<b>其余</b> là <b>đại từ</b>, chỉ <b>phần còn lại, phần khác</b> ngoài phần đã nhắc tới. Có thể đứng trước danh từ (其余的同学、其余窗户) hoặc dùng độc lập làm chủ ngữ với 的 (其余的).","r":["其余 + (的) + danh từ: 其余的同学、其余窗户.","Dùng độc lập: 其余的 (những cái/người còn lại), thường làm chủ ngữ ở vế sau.","Hay đi cặp với vế trước nêu một phần: 只有……，其余……都……；其中……，而其余的则……"],"e":[["怎么只有你们两个人？其余的同学呢？","Zěnme zhǐ yǒu nǐmen liǎng ge rén? Qíyú de tóngxué ne?","Sao chỉ có hai em thế? Các bạn còn lại đâu?"],["只有一个房间亮着灯，其余窗户都是黑的。","Zhǐ yǒu yí ge fángjiān liàngzhe dēng, qíyú chuānghu dōu shì hēi de.","Chỉ có một phòng sáng đèn, các cửa sổ còn lại đều tối om."],["其中三分之一的画作作者没有签名，而其余的则标明了身份。","Qízhōng sān fēn zhī yī de huàzuò zuòzhě méiyǒu qiānmíng, ér qíyú de zé biāomíngle shēnfèn.","Trong số đó, một phần ba số tranh không có chữ ký của tác giả, còn những bức còn lại thì ghi rõ danh tính. <i>(bài khoá)</i>"]],"d":[["我只认识这两个字，____都不认识。","其余"],["怎么只有你们两个人？____的同学呢？","其余"],["只有一个房间亮着灯，____窗户都是黑的。","其余"]],"w":""},{"id":"kejian","t":"可见","s":"có thể thấy, đủ thấy (liên từ)","b":"<b>可见</b> là <b>liên từ</b>, thường dùng theo khuôn “……，（由此）可见……”, biểu thị <b>có thể dựa vào tình huống vừa nêu ở trên để đưa ra phán đoán, kết luận</b>. Vế trước nêu sự việc/căn cứ, vế sau bắt đầu bằng 可见 hoặc 由此可见 nêu kết luận.","r":["Căn cứ，可见 + kết luận: 一直诊断不出是什么问题，可见情况不太好。","由此可见 + kết luận: thường đứng đầu câu mới, tổng kết điều vừa trình bày.","可见 luôn đứng sau phần căn cứ, không đặt ở đầu đoạn khi chưa có thông tin phía trước."],"e":[["他已经住院好几天了，一直诊断不出是什么问题，可见情况不太好。","Tā yǐjīng zhùyuàn hǎo jǐ tiān le, yìzhí zhěnduàn bu chū shì shénme wèntí, kějiàn qíngkuàng bú tài hǎo.","Anh ấy nằm viện mấy ngày rồi mà vẫn chưa chẩn đoán ra bệnh gì, đủ thấy tình hình không mấy khả quan."],["汉语中有个成语叫“自知之明”，把“自知”称为“明”，可见“自知”是一种智慧。","Hànyǔ zhōng yǒu ge chéngyǔ jiào “zìzhī zhī míng”, bǎ “zìzhī” chēngwéi “míng”, kějiàn “zìzhī” shì yì zhǒng zhìhuì.","Tiếng Hán có thành ngữ “自知之明” (sáng suốt vì biết mình), gọi việc “tự biết mình” là “sáng suốt”, đủ thấy “tự biết mình” là một loại trí tuệ."],["由此可见，志愿者能够从画作中感知艺术家的用心，哪怕他们不能够解释原因。","Yóucǐ kějiàn, zhìyuànzhě nénggòu cóng huàzuò zhōng gǎnzhī yìshùjiā de yòngxīn, nǎpà tāmen bù nénggòu jiěshì yuányīn.","Từ đó có thể thấy, tình nguyện viên có thể cảm nhận được tâm huyết của người nghệ sĩ qua bức tranh, cho dù họ không giải thích được lý do. <i>(bài khoá)</i>"]],"d":[["他已经住院好几天了，一直诊断不出是什么问题，____情况不太好。","可见"],["由此____，志愿者能够从画作中感知艺术家的用心。","可见"],["把“自知”称为“明”，____“自知”是一种智慧。","可见"]],"w":"Đừng nhầm liên từ 可见 (đủ thấy, suy ra) với cụm 可以看见 (nhìn thấy được)."},{"id":"muqian_xianzai","t":"目前 vs 现在","s":"hiện nay, trước mắt – bây giờ, hiện tại","b":"<b>目前</b> và <b>现在</b> đều là <b>danh từ chỉ thời gian</b>, chỉ thời điểm đang nói, thường có thể thay thế cho nhau. Ví dụ: 至少目前/现在可以这么说，没有证据表明黑猩猩或儿童可以这样做。","r":["目前 thường nhấn mạnh <b>một khoảng thời gian tính từ trước cho tới hiện tại</b>: 到目前为止，事情还没有变化。","现在 có thể chỉ một khoảng thời gian hoặc một <b>thời điểm</b>, còn có thể nhấn mạnh sự <b>đối lập với trước kia</b>: 我现在就去。","目前 <b>không</b> đi với từ chỉ thời gian cụ thể; 现在 <b>có thể</b>: 现在是北京时间上午十点钟。 (✗ 目前是北京时间上午十点钟)"],"e":[["至少目前可以这么说，没有证据表明黑猩猩或儿童可以这样做。","Zhìshǎo mùqián kěyǐ zhème shuō, méiyǒu zhèngjù biǎomíng hēixīngxing huò értóng kěyǐ zhèyàng zuò.","Ít nhất hiện nay có thể nói rằng chưa có bằng chứng nào cho thấy tinh tinh hay trẻ em làm được như vậy. <i>(bài khoá)</i>"],["到目前为止，事情还没有变化。","Dào mùqián wéizhǐ, shìqing hái méiyǒu biànhuà.","Cho đến nay, sự việc vẫn chưa có thay đổi gì."],["我现在就去。","Wǒ xiànzài jiù qù.","Tôi đi ngay bây giờ."],["现在是北京时间上午十点钟。","Xiànzài shì Běijīng shíjiān shàngwǔ shí diǎn zhōng.","Bây giờ là 10 giờ sáng giờ Bắc Kinh."]],"d":[["我们很着急，你____能过来一趟吗？","现在"],["选择性失忆____还无法治疗。","目前/现在"],["调查显示，66.9%的女性对____的工作不满意。","目前/现在"],["____的年轻人，跟我们那时候真不一样！","现在"]],"w":"Muốn nói “ngay bây giờ” (一个时间点) hoặc đi với giờ giấc cụ thể → dùng 现在. So sánh với ngày xưa (现在的年轻人…) → 现在. “到目前为止” là cụm cố định."}],"ext":[["导演","dǎoyǎn","đạo diễn"],["角色","juésè","vai diễn, nhân vật"],["明星","míngxīng","ngôi sao"],["动画片","dònghuàpiàn","phim hoạt hình"],["娱乐","yúlè","giải trí"],["录音","lù yīn","ghi âm"],["麦克风","màikèfēng","micrô"],["频道","píndào","kênh (truyền hình)"],["字幕","zìmù","phụ đề"],["乐器","yuèqì","nhạc cụ"],["美术","měishù","mỹ thuật"]],"extt":"影视艺术","notes":"Nguồn cuối bài khoá: 改编自《科学画报》，作者：周静嫣. Bài khoá 634 chữ (theo sách), 6 đoạn văn trong sách (tr.162–164), chia thành 3 phần: đoạn 1–2 (từ 1–20) / đoạn 3–4 (từ 21–29) / đoạn 5–6 (từ 30–40). Bài không có mục 专名. Từ số 18, 19, 20, 26, 30, 33, 34, 36 có dấu * (ngoài đề cương). Từ 11 chép theo sách là “丑（陋）” chou (lou), nên câu ví dụ chứa “丑陋” chứ không chứa nguyên dạng có ngoặc. Pinyin 录音 trong bảng 扩展 sách in “lù yīn” (có cách). Một số câu bài khoá dài >45 chữ nhưng không có ；nên giữ nguyên một dòng. Phần 注释 gồm 3 mục 词语例释 (极其, 其余, 可见) và 1 词语辨析 (目前—现在). Ví dụ (2) của 极其: sách có chú thích trong ngoặc “倒霉（dǎoméi, xui xẻo）”, “运气（yùnqì, vận may）”, đã bỏ phần chú thích khi chép câu. Drill: 极其 ① lấy từ 练习3① (đáp án vị trí B); 其余 ① từ 练习3③; các drill khác của 极其/其余/可见 đặt dựa trên câu ví dụ của sách vì 练一练 là bài hoàn thành câu mở; drill 目前—现在 lấy từ 做一做 (câu (1) sách đã cho đáp án 现在; câu (2)(3) đáp án do người soạn giải, cả hai từ đều dùng được). vocab_ex của 欣赏, 布, 幅, 业余, 随手, 哪怕, 调整, 活跃, 事实, 证据 lấy từ câu bài 练习 const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const LS=Object.keys(D).map(Number).sort((a,b)=>a-b);
let cur=LS[0], mode='lesson';
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const norm=s=>s.toLowerCase().trim().replace(/\s+/g,' ');
const strip=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'').toLowerCase();
const allWords=l=>D[l].batches.flat();
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));

/* ============== GIAO DIỆN BÀI HỌC ============== */
function vocabTable(ws){
  return `<table class="masked"><thead><tr><th>Hán</th><th>Pinyin</th><th>Nghĩa & ví dụ</th></tr></thead><tbody>`
   + ws.map(w=>`<tr onclick="this.classList.toggle('rv')"><td class="h">${w.h}${w.x?'<sup class="star" title="Từ ngoài đề cương HSK">*</sup>':''}</td>
      <td class="p">${esc(w.p)}</td><td class="m">${w.k?`<span class="pos">${esc(w.k)}</span> `:''}${esc(w.v)}
      ${w.ez?`<div class="exline">${w.ez}</div><div class="exvi">${esc(w.ev)}</div>`:''}</td></tr>`).join('')
   + `</tbody></table>`;
}
function textSec(t,i){
  return `<div class="tbar">
     <span class="chip on" onclick="tg(${i},'p',this)">Pinyin</span>
     <span class="chip on" onclick="tg(${i},'v',this)">Dịch Việt</span></div>
   <div id="tx${i}">${t.lines.map(l=>`<div class="line">
     <div class="zl">${l.s?`<span class="spk">${esc(l.s)}</span>`:''}${l.z}</div>
     ${l.p?`<div class="pl">${esc(l.p)}</div>`:''}
     <div class="vl">${esc(l.v)}</div></div>`).join('')}</div>`;
}
function tg(i,k,el){$('#tx'+i).classList.toggle('hide'+k);el.classList.toggle('on')}
function rev(el){el.textContent=el.dataset.a;el.classList.add('on')}

function gcard(g){
  const eg=(g.e||[]).map(e=>`<div class="eg"><div class="z">${e[0]}</div>
     <div class="y">${esc(e[1])}</div><div class="v">${e[2]}</div></div>`).join('');
  const dr=(g.d||[]).length?`<div class="drill">
     <div style="font-size:12.5px;color:var(--muted);margin-bottom:8px">Bài luyện của giáo trình — bấm chỗ trống để hiện đáp án</div>`
    +g.d.map((q,i)=>`<div class="q"><b>${i+1}.</b>`
      +String(q[0]).replace(/_{2,}/,`<span class="blank" data-a="${esc(q[1])}" onclick="rev(this)">?</span>`)
      +`</div>`).join('')+`</div>`:'';
  return `<div class="gcard"><h3>${g.t}</h3><div class="gs">${esc(g.s)}</div>
    <p>${g.b}</p>${(g.r||[]).length?`<ul>${g.r.map(r=>`<li>${r}</li>`).join('')}</ul>`:''}
    ${eg}${dr}${g.w?`<div class="warn">${g.w}</div>`:''}</div>`;
}

function renderLesson(n){
  const L=D[n], nb=L.batches.length, nt=L.texts.length;
  let nav=`<div class="nav">`;
  L.batches.forEach((b,i)=>nav+=`<a href="#v${i}">Từ mới ${i+1}</a>`);
  L.texts.forEach((t,i)=>nav+=`<a href="#t${i}">${nt>1?'Đoạn '+t.no:'Bài khoá'}</a>`);
  nav+=`<a href="#gram" class="gr">Ngữ pháp (${L.gram.length})</a>`;
  nav+=`<a href="#quiz" class="gr">Kiểm tra cuối bài</a></div>`;

  let h=`<h1>Bài ${n} <span class="zh">${L.tz||''}</span></h1>
    <div class="sub">${esc(L.tv)} · ${allWords(n).length} từ mới · ${nt>1?nt+' đoạn bài khoá':'bài khoá'} · ${L.gram.length} điểm ngữ pháp</div>
    ${nav}
    <div class="note">Học theo thứ tự: từ mới đợt 1 → đoạn bài khoá 1 → đợt 2 → đoạn 2 …
      <b>Ngữ pháp để dồn xuống cuối</b>, học sau khi đã đọc hết bài khoá — lúc đó các cấu trúc đã quen mặt nên vào nhanh hơn.
      Cột nghĩa bị che, bấm vào dòng để lật. Dấu <span style="color:var(--warn)">*</span> là từ ngoài đề cương HSK.</div>`;

  // xen kẽ: đợt từ mới i → bài khoá i
  const m=Math.max(nb,nt);
  for(let i=0;i<m;i++){
    if(i<nb) h+=`<section class="sec" id="v${i}"><div class="sh">
      <h2>Từ mới — đợt ${i+1}</h2><span class="tag">${L.batches[i].length} từ</span></div>
      ${vocabTable(L.batches[i])}</section>`;
    if(i<nt){const t=L.texts[i];
      h+=`<section class="sec" id="t${i}"><div class="sh">
      <h2>${nt>1?`Bài khoá — đoạn ${t.no}`:'Bài khoá'}${t.tz?` · ${t.tz}`:''}</h2><span class="tag">${t.lines.length} câu</span></div>
      ${t.tv?`<div class="sub" style="margin:-6px 0 12px">${esc(t.tv)}</div>`:''}
      ${textSec(t,i)}</section>`;}
  }
  h+=`<section class="sec" id="gram"><div class="sh">
      <h2>Ngữ pháp bài ${n}</h2><span class="tag p">${L.gram.length} điểm · học sau cùng</span></div>
      <div class="note" style="margin-bottom:14px">Soạn theo phần 注释 (词语例释 · 词语辨析) của Giáo trình chuẩn HSK5,
        giải thích bằng tiếng Việt. Ví dụ đánh dấu <i>(bài khoá)</i> là câu nguyên văn trong bài.</div>
      ${L.gram.map(gcard).join('')}</section>`;
  if((L.ext||[]).length) h+=`<section class="sec" id="ext"><div class="sh"><h2>Mở rộng · 扩展</h2>
      <span class="tag">${L.extt?esc(L.extt):''}</span></div><div class="ext">
      ${L.ext.map(e=>`<span>${e[0]}<small>${esc(e[1]||'')} · ${esc(e[2]||'')}</small></span>`).join('')}</div></section>`;
  h+=`<section class="sec" id="quiz"><div class="sh">
      <h2>Kiểm tra cuối bài ${n}</h2><span class="tag p">độ khó tự điều chỉnh</span></div>
      <div class="note" style="margin-bottom:14px">
        Bắt đầu ở <b>mức Dễ</b>. Đúng 2 câu liên tiếp là lên mức, sai một câu là lùi một mức —
        nên bài sẽ tự dò đúng ngưỡng của bạn.<br>
        <b>Dễ:</b> trắc nghiệm nhiễu ngẫu nhiên, có gợi ý pinyin ·
        <b>Khó:</b> nhiễu là từ cùng bài cùng độ dài, thêm điền từ và câu ngữ pháp ·
        <b>Siêu khó:</b> gõ tay chữ Hán/pinyin không lựa chọn sẵn, thêm sắp xếp trật tự từ.</div>
      <div class="examcta">
        <button class="btn primary" onclick="startLessonExam(${n})">Làm bài kiểm tra bài ${n}</button>
        <span class="sub">${Math.min(24,Math.max(12,Math.round(allWords(n).length*0.6)))} câu ·
          rút từ ${allWords(n).length} từ, ${L.gram.length} điểm ngữ pháp và ${(L.order||[]).length} câu sắp xếp</span>
      </div></section>`;
  if(L.notes) h+=`<div class="note"><b>Ghi chú về nguồn:</b> ${esc(L.notes)}</div>`;
  $('#view').innerHTML=h;
  window.scrollTo({top:0});
}

      <b>Mức 1 – Dễ:</b> trắc nghiệm, nhiễu lấy ngẫu nhiên, có gợi ý pinyin.<br>
      <b>Mức 2 – Khó:</b> nhiễu là từ cùng bài, cùng độ dài; thêm điền từ vào câu và câu ngữ pháp.<br>
      <b>Mức 3 – Siêu khó:</b> gõ tay chữ Hán và pinyin, không còn lựa chọn sẵn, thêm sắp xếp trật tự từ.
    </div>
    <button class="btn primary" onclick="startGlobal()">Bắt đầu làm bài</button>
   </section>`;
}
function tgL(l,el){GEX.ls.has(l)?GEX.ls.delete(l):GEX.ls.add(l);el.classList.toggle('on')}
function allL(v){GEX.ls=new Set(v?LS:[]);
  $$('#pkL span').forEach((s,i)=>{if(i<LS.length)s.classList.toggle('on',v)})}
document.addEventListener('input',e=>{if(e.target.id==='cnt')
  GEX.count=Math.max(5,Math.min(150,+e.target.value||25))});


/* ==================== BỘ KIỂM TRA THÍCH ỨNG ====================
   3 mức. Đúng 2 câu liên tiếp → lên mức. Sai 1 câu → xuống mức.
   Mức 1 trắc nghiệm nhiễu ngẫu nhiên · Mức 2 nhiễu gần + điền từ + ngữ pháp
   Mức 3 gõ tay, không có lựa chọn sẵn, thêm sắp xếp trật tự từ.        */
const LV=[{n:'Dễ',c:'var(--ok)'},{n:'Khó',c:'var(--warn)'},{n:'Siêu khó',c:'var(--bad)'}];
const TN={hv:'Hán → nghĩa',vh:'Nghĩa → Hán',fill:'Điền từ vào câu',gram:'Ngữ pháp',
          py:'Viết pinyin',han:'Viết chữ Hán',order:'Sắp xếp trật tự từ'};

let E=null;
function newExam(lessons,count,tag){
  E={ls:lessons,total:count,i:0,lv:0,streak:0,right:0,wrong:0,peak:0,
     asked:new Set(),missed:[],answered:false,tag:tag,hist:[]};
}
const pool=()=>E.ls.flatMap(l=>D[l].batches.flat().map(w=>({...w,L:l})));
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function others(arr,not,k,key){
  const s=shuffle(arr.filter(x=>x[key]!==not)).slice(0,k);return s}

function makeQ(){
  const P=pool(), lv=E.lv;
  let types = lv===0 ? ['hv','vh','hv','fill']
            : lv===1 ? ['fill','gram','vh','hv','py']
                     : ['han','py','order','fillType','gram'];
  for(let attempt=0;attempt<40;attempt++){
    const t=rnd(types), w=rnd(P);
    let q=null;
    if(t==='hv'){
      // mức 1 nhiễu bất kỳ; mức 2 nhiễu cùng bài
      const src = lv===0?P:P.filter(x=>x.L===w.L);
      const o=others(src.length>4?src:P,w.v,3,'v').map(x=>x.v);
      if(o.length<3) continue;
      q={t,L:w.L,key:'hv'+w.h,ask:`<div class="big">${w.h}</div>`,
         hint:lv===0?w.p:'',a:w.v,o:shuffle([w.v,...o])};
    } else if(t==='vh'){
      const src = lv===0?P:P.filter(x=>x.L===w.L&&x.h.length===w.h.length);
      const o=others(src.length>4?src:P,w.h,3,'h').map(x=>x.h);
      if(o.length<3) continue;
      q={t,L:w.L,key:'vh'+w.h,ask:`<div class="mid">${esc(w.v)}</div>`,
         a:w.h,o:shuffle([w.h,...o])};
    } else if(t==='fill'||t==='fillType'){
      if(!w.ez||!w.ez.includes(w.h)) continue;
      const sent=w.ez.replace(w.h,'⟦⟧');
      if(t==='fillType'){
        q={t:'fillType',L:w.L,key:'ft'+w.h,type:'type',ph:'gõ chữ Hán',
           ask:`<div class="sent">${sent.replace('⟦⟧','<span class="gap">?</span>')}</div>`,
           hint:w.v,a:w.h,rev:w.ev};
      } else {
        const src=P.filter(x=>x.L===w.L&&x.h.length===w.h.length&&x.h!==w.h);
        const o=others(src.length>=3?src:P,w.h,3,'h').map(x=>x.h);
        if(o.length<3) continue;
        q={t:'fill',L:w.L,key:'fl'+w.h,
           ask:`<div class="sent">${sent.replace('⟦⟧','<span class="gap">?</span>')}</div>`,
           a:w.h,o:shuffle([w.h,...o]),rev:w.ev};
      }
    } else if(t==='py'){
      q={t,L:w.L,key:'py'+w.h,type:'type',ph:'pinyin, không cần dấu',
         ask:`<div class="big">${w.h}</div>`,hint:w.v,a:w.p};
    } else if(t==='han'){
      q={t,L:w.L,key:'hn'+w.h,type:'type',ph:'gõ chữ Hán',
         ask:`<div class="mid">${esc(w.v)}</div>`,hint:w.p,a:w.h};
    } else if(t==='gram'){
      const L=rnd(E.ls), gs=D[L].gram.filter(g=>(g.d||[]).some(d=>d[1]&&/_{2,}/.test(String(d[0]))));
      if(!gs.length) continue;
      const g=rnd(gs), d=rnd(g.d.filter(d=>d[1]&&/_{2,}/.test(String(d[0]))));
      const alt=[...new Set(D[L].gram.flatMap(x=>(x.d||[]).map(y=>y[1])).filter(v=>v&&v!==d[1]))];
      if(alt.length<3) continue;
      q={t,L,key:'gr'+d[0],
         ask:`<div class="sent">${esc(String(d[0])).replace(/_{2,}/,'<span class="gap">?</span>')}</div>`,
         hint:g.t,a:d[1],o:shuffle([d[1],...shuffle(alt).slice(0,3)])};
    } else if(t==='order'){
      const L=rnd(E.ls), os=D[L].order||[];
      if(!os.length) continue;
      const it=rnd(os);
      q={t,L,key:'or'+it.z,type:'order',ask:'',hint:it.v,a:it.z,toks:shuffle([...it.t])};
    }
    if(q && !E.asked.has(q.key)){E.asked.add(q.key);return q}
    if(q && attempt>28) return q;
  }
  return null;
}

function examShell(inner){
  const pct=E.i/E.total*100;
  return `<div class="pbar"><i style="width:${pct}%"></i></div>
   <div class="qcard">
    <div class="qhead">
      <span>Câu <b>${E.i+1}</b>/${E.total} · Bài ${E.q?E.q.L:''}</span>
      <span><span class="lvbadge" style="color:${LV[E.lv].c};border-color:${LV[E.lv].c}">
        Mức ${E.lv+1} · ${LV[E.lv].n}</span>
        <span class="qtype">${E.q?TN[E.q.t]||TN.fill:''}</span></span>
    </div>${inner}
    <div class="verdict" id="vd"></div><div class="reveal hide" id="rv"></div>
   </div>
   <div style="display:flex;gap:10px;justify-content:center">
     <button class="btn" onclick="answerSkip()">Bỏ qua →</button>
     <button class="btn" onclick="quitExam()">Thoát</button></div>
   <div class="stats">Đúng <b style="color:var(--ok)">${E.right}</b> ·
     Sai <b style="color:var(--bad)">${E.wrong}</b> ·
     Mức cao nhất <b>${LV[E.peak].n}</b></div>`;
}

function renderExamQ(){
  const q=E.q=makeQ();
  if(!q){finishExam();return}
  let ctrl='';
  if(q.type==='type'){
    ctrl=`<div class="tybox"><input id="ans" autocomplete="off" spellcheck="false"
      placeholder="${q.ph}"><button class="btn primary" id="go">Kiểm tra</button></div>`;
  } else if(q.type==='order'){
    ctrl=`<div class="ordbox"><div class="slot" id="slot"></div>
      <div class="bank" id="bank">${q.toks.map((t,i)=>
        `<span class="tok" data-i="${i}" onclick="tokPush(${i})">${t}</span>`).join('')}</div>
      <div style="text-align:center;margin-top:12px">
        <button class="btn primary" id="go" onclick="checkOrder()">Kiểm tra</button>
        <button class="btn" onclick="tokReset()">Xoá</button></div></div>`;
  } else {
    ctrl=`<div class="opts">${q.o.map((o,k)=>
      `<div class="opt" onclick="pickOpt(${k})">${esc(o)}</div>`).join('')}</div>`;
  }
  const body=`<div class="qbody">${q.ask}
     ${q.hint?`<div class="sub" style="margin-top:8px">${esc(q.hint)}</div>`:''}</div>`;
  $('#view').innerHTML=examShell(body+ctrl);
  E.answered=false; E.sel=[];
  if(q.type==='type'){
    $('#go').onclick=checkTyped;
    $('#ans').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();E.answered?nextExamQ():checkTyped()}};
    $('#ans').focus();
  }
}
function grade(ok,given){
  if(E.answered)return; E.answered=true;
  E.hist.push({lv:E.lv,ok});
  if(ok){E.right++;E.streak++;
    if(E.streak>=2&&E.lv<2){E.lv++;E.streak=0;flash('▲ Lên mức '+LV[E.lv].n)}
  }else{E.wrong++;E.streak=0;E.missed.push({q:E.q,given});
    if(E.lv>0){E.lv--;flash('▼ Xuống mức '+LV[E.lv].n)}}
  if(E.lv>E.peak)E.peak=E.lv;
}
function flash(msg){
  const d=document.createElement('div');d.className='flash';d.textContent=msg;
  document.body.appendChild(d);setTimeout(()=>d.remove(),1400);
}
function pickOpt(k){
  if(E.answered)return;
  const q=E.q, ok=q.o[k]===q.a;
  grade(ok,q.o[k]);
  $$('.opt').forEach((e,i)=>{if(q.o[i]===q.a)e.classList.add('ok');else if(i===k)e.classList.add('bad')});
  say(ok);
  setTimeout(nextExamQ,ok?700:2200);
}
function checkTyped(){
  const q=E.q,v=$('#ans').value; if(!v.trim())return;
  const hz=x=>x.replace(/[（(][^）)]*[）)]/g,'').replace(/[（）()…\s]/g,''), hf=x=>x.replace(/[（）()…\s]/g,'');
  const ok = q.t==='py' ? (strip(v)===strip(q.a)||strip(v)===strip(q.a.replace(/[（(][^）)]*[）)]/g,''))||strip(v)===strip(q.a.replace(/[（）()]/g,'')))
                       : (v.trim()===q.a||hz(v)===hz(q.a)||hf(v)===hf(q.a));
  grade(ok,v.trim()); say(ok);
  $('#ans').disabled=true;$('#go').textContent='Tiếp →';$('#go').onclick=nextExamQ;
}
function say(ok){
  const q=E.q;
  $('#vd').className='verdict '+(ok?'ok':'bad');
  $('#vd').textContent=ok?'✓ Đúng':'✗ Sai — đáp án: '+q.a;
  if(q.rev){$('#rv').classList.remove('hide');$('#rv').textContent=q.rev}
}
function tokPush(i){
  if(E.answered)return;
  const el=document.querySelector(`.tok[data-i="${i}"]`);
  if(!el||el.classList.contains('used'))return;
  el.classList.add('used'); E.sel.push(i);
  drawSlot();
}
function tokPop(k){
  if(E.answered)return;
  const i=E.sel.splice(k,1)[0];
  document.querySelector(`.tok[data-i="${i}"]`).classList.remove('used');
  drawSlot();
}
function tokReset(){if(E.answered)return;E.sel=[];$$('.tok').forEach(t=>t.classList.remove('used'));drawSlot()}
function drawSlot(){
  $('#slot').innerHTML=E.sel.length
    ? E.sel.map((i,k)=>`<span class="tok sel" onclick="tokPop(${k})">${E.q.toks[i]}</span>`).join('')
    : `<span class="ph">Bấm các thẻ bên dưới để xếp thành câu đúng</span>`;
}
function checkOrder(){
  if(E.answered)return;
  const q=E.q, built=E.sel.map(i=>q.toks[i]).join('');
  const target=q.a.replace(/[，。？！、；：“”‘’…—]/g,'');
  const ok=built===target;
  grade(ok,built||'(bỏ trống)');
  $('#vd').className='verdict '+(ok?'ok':'bad');
  $('#vd').textContent=ok?'✓ Đúng':'✗ Sai';
  $('#rv').classList.remove('hide');
  $('#rv').innerHTML=`<div style="font-size:18px;color:var(--ink)">${q.a}</div>
    <div style="margin-top:4px">${esc(q.hint||'')}</div>`;
  $('#go').textContent='Tiếp →'; $('#go').onclick=nextExamQ;
}
function answerSkip(){if(!E.answered)grade(false,'(bỏ qua)');nextExamQ()}
function nextExamQ(){ if(E.i<E.total-1){E.i++;renderExamQ()} else finishExam() }
function quitExam(){ E.tag==='global'?show('exam'):show('lesson',E.ls[0]) }

function finishExam(){
  const t=E.right+E.wrong,pct=t?Math.round(E.right/t*100):0;
  const lvl=LV[E.peak].n;
  $('#view').innerHTML=`<div class="qcard" style="text-align:center">
    <div style="font-size:52px">${pct>=90?'🎉':pct>=70?'👍':'💪'}</div>
    <div style="font-size:22px;font-weight:650;margin:8px 0">${E.right}/${t} câu đúng — ${pct}%</div>
    <div class="sub">Bài ${E.ls.join(', ')} · lên tới mức <b style="color:${LV[E.peak].c}">${lvl}</b></div>
    <div style="margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn primary" onclick="${E.tag==='global'?'startGlobal()':`startLessonExam(${E.ls[0]})`}">Làm lại</button>
      ${E.missed.length?`<button class="btn" onclick="retryMissed()">Ôn ${E.missed.length} câu sai</button>`:''}
      <button class="btn" onclick="quitExam()">Quay lại bài học</button>
    </div></div>
    ${E.missed.length?`<div class="review"><h2 style="font-size:16px">Câu đã sai</h2>
      ${E.missed.map(m=>`<div class="r">
        <div class="q">${String(m.q.ask||'').replace(/<[^>]+>/g,' ').trim()||m.q.a}</div>
        <div class="a">Bạn trả lời <b style="color:var(--bad)">${esc(m.given)}</b> ·
          Đáp án <b style="color:var(--ok)">${esc(m.q.a)}</b> · Bài ${m.q.L} · ${TN[m.q.t]||''}</div>
        </div>`).join('')}</div>`
      :`<div class="note" style="margin-top:14px">Không sai câu nào. Thử tăng số câu hoặc gộp thêm bài khác ở mục Kiểm tra tổng hợp.</div>`}`;
}
function retryMissed(){
  const ms=E.missed.slice();
  const ls=E.ls,tag=E.tag;
  newExam(ls,ms.length,tag);
  E.queue=shuffle(ms.map(m=>m.q));
  E.lv=2;
  renderRetry();
}
function renderRetry(){
  E.q=E.queue[E.i];
  if(!E.q){finishExam();return}
  let ctrl;
  const q=E.q;
  if(q.type==='order'){
    ctrl=`<div class="ordbox"><div class="slot" id="slot"></div>
      <div class="bank" id="bank">${q.toks.map((t,i)=>
        `<span class="tok" data-i="${i}" onclick="tokPush(${i})">${t}</span>`).join('')}</div>
      <div style="text-align:center;margin-top:12px">
        <button class="btn primary" id="go" onclick="checkOrder()">Kiểm tra</button>
        <button class="btn" onclick="tokReset()">Xoá</button></div></div>`;
  } else if(q.type==='type'){
    ctrl=`<div class="tybox"><input id="ans" autocomplete="off" placeholder="${q.ph}">
      <button class="btn primary" id="go">Kiểm tra</button></div>`;
  } else {
    ctrl=`<div class="opts">${q.o.map((o,k)=>
      `<div class="opt" onclick="pickOptR(${k})">${esc(o)}</div>`).join('')}</div>`;
  }
  $('#view').innerHTML=examShell(`<div class="qbody">${q.ask}
     ${q.hint?`<div class="sub" style="margin-top:8px">${esc(q.hint)}</div>`:''}</div>`+ctrl);
  E.answered=false;E.sel=[];
  if(q.type==='type'){$('#go').onclick=checkTyped;
    $('#ans').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();E.answered?nextRetry():checkTyped()}};
    $('#ans').focus()}
  if(q.type==='order')drawSlot();
}
function pickOptR(k){pickOpt(k)}
function nextRetry(){if(E.i<E.queue.length-1){E.i++;renderRetry()}else finishExam()}

/* điểm vào */
function startLessonExam(n){
  const w=D[n].batches.flat().length;
  newExam([n],Math.min(24,Math.max(12,Math.round(w*0.6))),'lesson');
  renderExamQ();
}
function startGlobal(){
  const ls=[...GEX.ls].sort((a,b)=>a-b);
  if(!ls.length){const b=document.querySelector('#pkL');if(b){b.insertAdjacentHTML('afterend','<div class="sub" style="color:var(--bad);margin-top:6px">Chọn ít nhất một bài để bắt đầu.</div>')}return}
  newExam(ls,GEX.count,'global');
  renderExamQ();
}

/* ============== ĐIỀU HƯỚNG ============== */
function show(what,n){
  mode=what;
  $$('.lz').forEach(b=>b.classList.remove('on'));
  if(what==='exam'){$('#tabExam').classList.add('on');renderExamSetup()}
  else{cur=n;$('#lz'+n).classList.add('on');renderLesson(n)}
  window.scrollTo({top:0,behavior:'smooth'});
}
$('#lessons').innerHTML=LS.map(l=>`<button class="lz" id="lz${l}" title="${esc(D[l].tz+' · '+D[l].tv)}" onclick="show('lesson',${l})">${l}</button>`).join('')
  +`<button class="lz exam" id="tabExam" onclick="show('exam')">Kiểm tra tổng hợp</button>`;
show('lesson',LS[0]);

</script>
