 văn phòng, v.v."},{"h":"商务","p":"shāngwù","v":"thương vụ, công việc buôn bán","k":"dt.","x":0,"ez":"在购物广场、商务大厦的附近不建停车场等。","ev":"không xây bãi đỗ xe gần các trung tâm mua sắm, cao ốc văn phòng, v.v."},{"h":"大厦","p":"dàshà","v":"cao ốc, tòa nhà đồ sộ","k":"dt.","x":0,"ez":"在购物广场、商务大厦的附近不建停车场等。","ev":"không xây bãi đỗ xe gần các trung tâm mua sắm, cao ốc văn phòng, v.v."},{"h":"自愿","p":"zìyuàn","v":"tự nguyện, tự ý","k":"tt.","x":0,"ez":"半年过去了，虽然市民们有些抱怨，但效果非常明显，自愿放弃开私家车出门的人越来越多。","ev":"Nửa năm trôi qua, tuy người dân có phần phàn nàn nhưng hiệu quả rất rõ rệt: số người tự nguyện thôi lái xe riêng ra đường ngày càng nhiều."},{"h":"难怪","p":"nánguài","v":"có thể hiểu được, khó trách","k":"đgt.","x":0,"ez":"这也难怪，与其堵在路上浪费时间和汽油，污染环境，倒不如改乘公交出行。","ev":"Điều này cũng dễ hiểu: thay vì kẹt trên đường vừa phí thời gian, tốn xăng lại gây ô nhiễm môi trường, chi bằng chuyển sang đi xe buýt."},{"h":"与其","p":"yǔqí","v":"thà... còn hơn...","k":"liên.","x":0,"ez":"这也难怪，与其堵在路上浪费时间和汽油，污染环境，倒不如改乘公交出行。","ev":"Điều này cũng dễ hiểu: thay vì kẹt trên đường vừa phí thời gian, tốn xăng lại gây ô nhiễm môi trường, chi bằng chuyển sang đi xe buýt."},{"h":"汽油","p":"qìyóu","v":"xăng","k":"dt.","x":0,"ez":"这也难怪，与其堵在路上浪费时间和汽油，污染环境，倒不如改乘公交出行。","ev":"Điều này cũng dễ hiểu: thay vì kẹt trên đường vừa phí thời gian, tốn xăng lại gây ô nhiễm môi trường, chi bằng chuyển sang đi xe buýt."},{"h":"明确","p":"míngquè","v":"rõ ràng","k":"tt.","x":0,"ez":"城市本是为人而建，如今却被汽车占有，詹森的目标很明确，就是期待能够解放城市，使之更适合人类生活。","ev":"Thành phố vốn được xây cho con người, nay lại bị ô tô chiếm chỗ; mục tiêu của Jensen rất rõ ràng: mong có thể giải phóng thành phố, khiến nó phù hợp hơn với cuộc sống con người."},{"h":"期待","p":"qīdài","v":"mong đợi, kỳ vọng","k":"đgt.","x":0,"ez":"城市本是为人而建，如今却被汽车占有，詹森的目标很明确，就是期待能够解放城市，使之更适合人类生活。","ev":"Thành phố vốn được xây cho con người, nay lại bị ô tô chiếm chỗ; mục tiêu của Jensen rất rõ ràng: mong có thể giải phóng thành phố, khiến nó phù hợp hơn với cuộc sống con người."},{"h":"解放","p":"jiěfàng","v":"giải phóng, thả tự do","k":"đgt.","x":1,"ez":"城市本是为人而建，如今却被汽车占有，詹森的目标很明确，就是期待能够解放城市，使之更适合人类生活。","ev":"Thành phố vốn được xây cho con người, nay lại bị ô tô chiếm chỗ; mục tiêu của Jensen rất rõ ràng: mong có thể giải phóng thành phố, khiến nó phù hợp hơn với cuộc sống con người."}]],"texts":[{"no":1,"tz":"","tv":"","lines":[{"s":"","z":"城市汽车的数量迅速增长，最初还被视为是社会发展、经济繁荣的体现。","p":"Chéngshì qìchē de shùliàng xùnsù zēngzhǎng, zuìchū hái bèi shìwéi shì shèhuì fāzhǎn, jīngjì fánróng de tǐxiàn.","v":"Số lượng ô tô trong thành phố tăng nhanh, thoạt đầu điều này còn được xem là biểu hiện của sự phát triển xã hội và phồn thịnh kinh tế.","b":0},{"s":"","z":"但很快人们就发现了问题。","p":"Dàn hěn kuài rénmen jiù fāxiànle wèntí.","v":"Nhưng chẳng bao lâu người ta đã nhận ra vấn đề.","b":0},{"s":"","z":"随着车流量的增加，道路变得格外拥挤，堵车在大城市中已经成了家常便饭。","p":"Suízhe chēliúliàng de zēngjiā, dàolù biàn de géwài yōngjǐ, dǔchē zài dà chéngshì zhōng yǐjīng chéngle jiācháng biànfàn.","v":"Lưu lượng xe càng tăng, đường sá càng trở nên chật chội lạ thường, tắc đường ở các thành phố lớn đã thành chuyện cơm bữa.","b":0},{"s":"","z":"解决交通拥堵的问题就要减少单位面积道路内的汽车数量，新建或加宽道路被公认为最基本的方法。","p":"Jiějué jiāotōng yōngdǔ de wèntí jiù yào jiǎnshǎo dānwèi miànjī dàolù nèi de qìchē shùliàng, xīnjiàn huò jiākuān dàolù bèi gōngrèn wéi zuì jīběn de fāngfǎ.","v":"Muốn giải quyết ùn tắc giao thông thì phải giảm số ô tô trên mỗi đơn vị diện tích đường, và làm đường mới hoặc mở rộng đường được mọi người công nhận là cách cơ bản nhất.","b":0},{"s":"","z":"但事实证明这只是我们美好的主观愿望，道路扩建的速度远远跟不上车流量增加的速度，面积的增加并未使道路空出空间来，甚至还会无形之中鼓励更多的司机开车上路，使得市中心的道路更加拥挤。","p":"Dàn shìshí zhèngmíng zhè zhǐ shì wǒmen měihǎo de zhǔguān yuànwàng, dàolù kuòjiàn de sùdù yuǎnyuǎn gēn bu shàng chēliúliàng zēngjiā de sùdù, miànjī de zēngjiā bìng wèi shǐ dàolù kòngchū kōngjiān lái, shènzhì hái huì wúxíng zhī zhōng gǔlì gèng duō de sījī kāichē shànglù, shǐde shìzhōngxīn de dàolù gèngjiā yōngjǐ.","v":"Nhưng thực tế chứng minh đó chỉ là mong muốn chủ quan tốt đẹp của chúng ta: tốc độ mở rộng đường còn lâu mới theo kịp tốc độ tăng của lưu lượng xe, diện tích đường tăng lên cũng chẳng làm đường thông thoáng hơn, thậm chí còn vô hình trung khuyến khích nhiều tài xế lái xe ra đường hơn, khiến đường sá ở trung tâm thành phố càng thêm chật cứng.","b":0},{"s":"","z":"那么，如何根治交通拥堵呢？","p":"Nàme, rúhé gēnzhì jiāotōng yōngdǔ ne?","v":"Vậy làm thế nào để trị tận gốc tình trạng ùn tắc giao thông?","b":0},{"s":"","z":"这里我们不妨听听佩·詹森的故事。","p":"Zhèlǐ wǒmen bùfáng tīngting Pèi Zhānsēn de gùshi.","v":"Ở đây chúng ta thử nghe câu chuyện của Pay Jensen xem sao.","b":0},{"s":"","z":"詹森一到欧洲环境保护署交通部工作，就接到了研究如何解决城市拥堵问题的任务。","p":"Zhānsēn yí dào Ōuzhōu Huánjìng Bǎohù Shǔ jiāotōngbù gōngzuò, jiù jiēdàole yánjiū rúhé jiějué chéngshì yōngdǔ wèntí de rènwu.","v":"Jensen vừa về làm ở bộ phận giao thông của Cơ quan bảo vệ môi trường châu Âu thì đã nhận nhiệm vụ nghiên cứu cách giải quyết nạn ùn tắc đô thị.","b":1},{"s":"","z":"于是，他开始展开调查，研究收集上来的数据，归纳问题特点，并虚心咨询了有关专家。","p":"Yúshì, tā kāishǐ zhǎnkāi diàochá, yánjiū shōují shànglai de shùjù, guīnà wèntí tèdiǎn, bìng xūxīn zīxúnle yǒuguān zhuānjiā.","v":"Thế là anh bắt đầu tiến hành điều tra, nghiên cứu số liệu thu thập được, tổng kết đặc điểm của vấn đề và khiêm tốn hỏi ý kiến các chuyên gia liên quan.","b":0},{"s":"","z":"九月中旬的一天早晨，詹森照常提前出门赶在早高峰之前去交通部。","p":"Jiǔyuè zhōngxún de yì tiān zǎochen, Zhānsēn zhàocháng tíqián chūmén gǎn zài zǎo gāofēng zhīqián qù jiāotōngbù.","v":"Một buổi sáng trung tuần tháng Chín, Jensen như thường lệ ra khỏi nhà sớm để đến bộ giao thông trước giờ cao điểm buổi sáng.","b":0},{"s":"","z":"他看到一个健身的人慢跑通过一个有过街天桥的路口时，为图省事没上天桥，而是横穿马路。","p":"Tā kàndào yí ge jiànshēn de rén mànpǎo tōngguò yí ge yǒu guòjiē tiānqiáo de lùkǒu shí, wèi tú shěngshì méi shàng tiānqiáo, ér shì héngchuān mǎlù.","v":"Anh thấy một người đang tập thể dục chạy bộ qua một giao lộ có cầu vượt cho người đi bộ; vì muốn đỡ mất công, người đó không lên cầu mà băng ngang qua đường.","b":0},{"s":"","z":"结果，他被一辆车撞倒在地，虽然最后他只是受了点轻伤，而且有保险可以赔偿，但司机还是被吓得不轻。","p":"Jiéguǒ, tā bèi yí liàng chē zhuàngdǎo zài dì, suīrán zuìhòu tā zhǐ shì shòule diǎn qīngshāng, érqiě yǒu bǎoxiǎn kěyǐ péicháng, dàn sījī háishi bèi xià de bù qīng.","v":"Kết quả là người đó bị một chiếc xe tông ngã xuống đất; tuy cuối cùng chỉ bị thương nhẹ, lại có bảo hiểm bồi thường, nhưng người tài xế vẫn một phen hết hồn.","b":0},{"s":"","z":"不过这件事倒是给了詹森启发：开车出行是为了省时省力，但如果情况相反呢？","p":"Búguò zhè jiàn shì dàoshì gěile Zhānsēn qǐfā: kāichē chūxíng shì wèile shěng shí shěng lì, dàn rúguǒ qíngkuàng xiāngfǎn ne?","v":"Thế nhưng chuyện này lại gợi cho Jensen một ý tưởng: người ta lái xe ra đường là để tiết kiệm thời gian và sức lực, nhưng nếu tình hình ngược lại thì sao?","b":0},{"s":"","z":"他决定要改变市民出行的观念，反其道而行之——让城市先堵起来，给司机制造麻烦，以堵治堵。","p":"Tā juédìng yào gǎibiàn shìmín chūxíng de guānniàn, fǎn qí dào ér xíng zhī——ràng chéngshì xiān dǔ qilai, gěi sījī zhìzào máfan, yǐ dǔ zhì dǔ.","v":"Anh quyết định thay đổi quan niệm đi lại của người dân bằng cách làm ngược lại — để thành phố tắc trước, gây phiền phức cho tài xế, \"dùng tắc trị tắc\".","b":0},{"s":"","z":"经过多次努力，政府批准了他提出的改革措施，比如，增设红绿灯，让车辆不得不走走停停；","p":"Jīngguò duō cì nǔlì, zhèngfǔ pīzhǔnle tā tíchū de gǎigé cuòshī, bǐrú, zēngshè hónglǜdēng, ràng chēliàng bùdébù zǒuzǒutíngtíng;","v":"Sau nhiều lần nỗ lực, chính quyền đã phê duyệt các biện pháp cải cách anh đề xuất, chẳng hạn: lắp thêm đèn giao thông để xe cộ buộc phải đi đi dừng dừng;","b":1},{"s":"","z":"在主要十字路口取消地下通道，让行人从地下重返地面；","p":"zài zhǔyào shízì lùkǒu qǔxiāo dìxià tōngdào, ràng xíngrén cóng dìxià chóngfǎn dìmiàn;","v":"bỏ hầm đi bộ ở các ngã tư chính để người đi bộ từ dưới lòng đất trở lại mặt đường;","b":0},{"s":"","z":"在购物广场、商务大厦的附近不建停车场等。","p":"zài gòuwù guǎngchǎng, shāngwù dàshà de fùjìn bú jiàn tíngchēchǎng děng.","v":"không xây bãi đỗ xe gần các trung tâm mua sắm, cao ốc văn phòng, v.v.","b":0},{"s":"","z":"同时，大力发展公共交通。","p":"Tóngshí, dàlì fāzhǎn gōnggòng jiāotōng.","v":"Đồng thời, ra sức phát triển giao thông công cộng.","b":0},{"s":"","z":"半年过去了，虽然市民们有些抱怨，但效果非常明显，自愿放弃开私家车出门的人越来越多。","p":"Bàn nián guòqu le, suīrán shìmínmen yǒuxiē bàoyuàn, dàn xiàoguǒ fēicháng míngxiǎn, zìyuàn fàngqì kāi sījiāchē chūmén de rén yuè lái yuè duō.","v":"Nửa năm trôi qua, tuy người dân có phần phàn nàn nhưng hiệu quả rất rõ rệt: số người tự nguyện thôi lái xe riêng ra đường ngày càng nhiều.","b":0},{"s":"","z":"这也难怪，与其堵在路上浪费时间和汽油，污染环境，倒不如改乘公交出行。","p":"Zhè yě nánguài, yǔqí dǔ zài lù shang làngfèi shíjiān hé qìyóu, wūrǎn huánjìng, dào bùrú gǎi chéng gōngjiāo chūxíng.","v":"Điều này cũng dễ hiểu: thay vì kẹt trên đường vừa phí thời gian, tốn xăng lại gây ô nhiễm môi trường, chi bằng chuyển sang đi xe buýt.","b":0},{"s":"","z":"这样一来，道路拥堵大为缓解。","p":"Zhèyàng yì lái, dàolù yōngdǔ dà wéi huǎnjiě.","v":"Nhờ vậy, tình trạng ùn tắc đường sá đã được giảm bớt đáng kể.","b":0},{"s":"","z":"城市本是为人而建，如今却被汽车占有，詹森的目标很明确，就是期待能够解放城市，使之更适合人类生活。","p":"Chéngshì běn shì wèi rén ér jiàn, rújīn què bèi qìchē zhànyǒu, Zhānsēn de mùbiāo hěn míngquè, jiù shì qīdài nénggòu jiěfàng chéngshì, shǐ zhī gèng shìhé rénlèi shēnghuó.","v":"Thành phố vốn được xây cho con người, nay lại bị ô tô chiếm chỗ; mục tiêu của Jensen rất rõ ràng: mong có thể giải phóng thành phố, khiến nó phù hợp hơn với cuộc sống con người.","b":0}]}],"aud":[{"v":"audio/33-2.mp3","t":"audio/33-1.mp3"}],"gram":[{"id":"zhaochang","t":"照常","s":"như bình thường, như thường lệ (động từ / phó từ)","b":"Sách nêu <b>照常</b> có hai cách dùng. Là <b>động từ</b>, nghĩa là “跟平常一样” – giống như bình thường, thường đứng cuối câu làm vị ngữ (一切照常). Là <b>phó từ</b>, biểu thị tình hình tiếp diễn, không thay đổi – đứng trước động từ: <b>照常 + V</b> (照常举行、照常上班).","r":["Động từ: Chủ ngữ + 照常 = vẫn như mọi khi (一切照常、区内商业活动照常)","Phó từ: 照常 + V = vẫn làm gì như thường lệ (照常举行、照常提前出门)","Hay đi với ngữ cảnh có trở ngại/biến cố: 虽然……，但……照常……"],"e":[["虽然战争临近，但这里的日常生活，一切照常。","Suīrán zhànzhēng línjìn, dàn zhèlǐ de rìcháng shēnghuó, yíqiè zhàocháng.","Tuy chiến tranh đã cận kề nhưng cuộc sống thường ngày ở đây vẫn hoàn toàn như cũ."],["大火对东区的商业活动没有造成大的影响，区内商业活动照常。","Dàhuǒ duì dōngqū de shāngyè huódòng méiyǒu zàochéng dà de yǐngxiǎng, qū nèi shāngyè huódòng zhàocháng.","Trận hoả hoạn không ảnh hưởng nhiều đến hoạt động thương mại ở khu Đông, việc buôn bán trong khu vẫn diễn ra bình thường."],["在东方广场的迎新活动照常举行。","Zài Dōngfāng Guǎngchǎng de yíngxīn huódòng zhàocháng jǔxíng.","Hoạt động chào đón thành viên mới ở quảng trường Phương Đông vẫn được tổ chức như thường lệ."],["九月中旬的一天早晨，詹森照常提前出门赶在早高峰之前去交通部。","Jiǔyuè zhōngxún de yì tiān zǎochen, Zhānsēn zhàocháng tíqián chūmén gǎn zài zǎo gāofēng zhīqián qù jiāotōngbù.","Một buổi sáng trung tuần tháng Chín, Jensen như thường lệ ra khỏi nhà sớm để đến bộ giao thông trước giờ cao điểm buổi sáng. <i>(bài khoá)</i>"]],"d":[["虽然战争临近，但这里的日常生活，一切____。","照常"],["在东方广场的迎新活动____举行。","照常"],["九月中旬的一天早晨，詹森____提前出门赶在早高峰之前去交通部。","照常"]],"w":"Đứng cuối câu (一切照常) là động từ; đứng trước động từ khác (照常举行) là phó từ. Bảng từ mới của bài chỉ ghi phó từ."},{"id":"nanguai","t":"难怪","s":"khó trách, cũng dễ hiểu (động từ); thảo nào, hèn chi (phó từ)","b":"Là <b>động từ</b>, <b>难怪</b> nghĩa là “不应当批评或抱怨” – không nên trách móc hay phàn nàn, mang ngữ khí <b>thông cảm, tha thứ</b>; thường gặp ở dạng <b>这也难怪，……</b> rồi nêu lý do. Là <b>phó từ</b>, biểu thị đã hiểu ra nguyên nhân nên không còn thấy lạ về một tình huống nữa: <b>(nguyên nhân)，难怪 + (kết quả)</b> – “thảo nào, hèn chi”.","r":["Động từ: 这也难怪 / 也难怪 + lý do = cũng khó trách, cũng dễ hiểu thôi","Phó từ: Nguyên nhân，难怪 + hiện tượng = thảo nào…","Vế nêu nguyên nhân thường đứng trước 难怪 (phó từ), còn với 这也难怪 (động từ) thì lý do đứng sau."],"e":[["这也难怪，他每天那么忙，哪儿有时间操心孩子的事啊！","Zhè yě nánguài, tā měi tiān nàme máng, nǎr yǒu shíjiān cāoxīn háizi de shì a!","Cũng khó trách anh ấy, ngày nào cũng bận như thế, lấy đâu ra thời gian lo chuyện con cái chứ!"],["这也难怪，与其堵在路上浪费时间和汽油，污染环境，倒不如改乘公交出行。","Zhè yě nánguài, yǔqí dǔ zài lù shang làngfèi shíjiān hé qìyóu, wūrǎn huánjìng, dào bùrú gǎi chéng gōngjiāo chūxíng.","Điều này cũng dễ hiểu: thay vì kẹt trên đường vừa phí thời gian, tốn xăng lại gây ô nhiễm môi trường, chi bằng chuyển sang đi xe buýt. <i>(bài khoá)</i>"],["你的抽屉真乱，难怪总是找不到东西。","Nǐ de chōuti zhēn luàn, nánguài zǒngshì zhǎo bu dào dōngxi.","Ngăn kéo của cậu bừa thật, thảo nào lúc nào cũng không tìm thấy đồ."],["他都18岁了，还不敢一个人走夜路，难怪大家都叫他胆小鬼。","Tā dōu shíbā suì le, hái bù gǎn yí ge rén zǒu yèlù, nánguài dàjiā dōu jiào tā dǎnxiǎoguǐ.","Cậu ấy đã 18 tuổi rồi mà vẫn không dám đi đường đêm một mình, hèn chi ai cũng gọi cậu là đồ nhát gan."]],"d":[["你的抽屉真乱，____总是找不到东西。","难怪"],["这也____，他每天那么忙，哪儿有时间操心孩子的事啊！","难怪"],["汽油明天要涨价了，____加油站又有车在排队加油呢。","难怪"]],"w":"Đừng nhầm 难怪 (thảo nào – đã hiểu lý do) với 难道 (lẽ nào – câu hỏi tu từ)."},{"id":"yuqi","t":"与其","s":"thay vì…, thà… còn hơn (liên từ)","b":"<b>与其</b> là <b>liên từ</b>, dùng khi so sánh hai tình huống cần chọn một: <b>与其</b> đặt ở vế <b>bị loại bỏ</b>; vế sau thường đi với <b>不如</b> hoặc <b>宁可</b> để nêu lựa chọn được ưu tiên.","r":["与其 A，不如 B = thay vì A, chi bằng B (chọn B)","与其 A，(主语) 宁可 B = thà B còn hơn A","Có thể thêm 倒 trước 不如 để nhấn mạnh: 与其……，倒不如……","与其说 A，不如说 B = nói là A chẳng bằng nói là B"],"e":[["与其说是采访，不如说是向他学习。","Yǔqí shuō shì cǎifǎng, bùrú shuō shì xiàng tā xuéxí.","Nói là phỏng vấn thì chẳng bằng nói là đi học hỏi ông ấy."],["与其找个不认真的小时工，我宁可自己打扫。","Yǔqí zhǎo ge bú rènzhēn de xiǎoshígōng, wǒ nìngkě zìjǐ dǎsǎo.","Thuê một người giúp việc theo giờ làm ăn cẩu thả thì tôi thà tự dọn dẹp còn hơn."],["这也难怪，与其堵在路上浪费时间和汽油，污染环境，倒不如改乘公交出行。","Zhè yě nánguài, yǔqí dǔ zài lù shang làngfèi shíjiān hé qìyóu, wūrǎn huánjìng, dào bùrú gǎi chéng gōngjiāo chūxíng.","Điều này cũng dễ hiểu: thay vì kẹt trên đường vừa phí thời gian, tốn xăng lại gây ô nhiễm môi trường, chi bằng chuyển sang đi xe buýt. <i>(bài khoá)</i>"]],"d":[["____说是采访，不如说是向他学习。","与其"],["____找个不认真的小时工，我宁可自己打扫。","与其"],["这也难怪，____堵在路上浪费时间和汽油，污染环境，倒不如改乘公交出行。","与其"]],"w":"Vế có 与其 là thứ bị gạt bỏ; điều người nói chọn nằm sau 不如 / 宁可 — ngược với thứ tự “thà… còn hơn…” trong tiếng Việt."},{"id":"biaoxian_tixian","t":"表现 vs 体现","s":"thể hiện, biểu hiện","b":"<b>Giống nhau:</b> cả hai đều là <b>động từ</b>, đều có nghĩa “显示出来” – làm cho bộc lộ ra. Ví dụ: 这部电影表现/体现出鲜明的时代特点。","r":["表现 thiên về phản ánh phong cách, tình cảm, thái độ… của người hoặc sự vật (表现得很乐观); 体现 nhấn mạnh một hiện tượng, tính chất, tư tưởng, tinh thần… được thể hiện ra cụ thể thông qua người hoặc sự vật nào đó.","表现 còn có nghĩa cố ý phô bày ưu điểm, sở trường của mình, thường mang nghĩa xấu (表现自己); 体现 không có nghĩa này.","表现 còn làm được danh từ, chỉ tình hình lời nói, hành động (你的表现); 体现 không có cách dùng này."],"e":[["这部电影表现/体现出鲜明的时代特点。","Zhè bù diànyǐng biǎoxiàn/tǐxiàn chū xiānmíng de shídài tèdiǎn.","Bộ phim này thể hiện rõ nét đặc điểm của thời đại."],["他总是乐呵呵的，对什么事都表现得很乐观。","Tā zǒngshì lèhēhē de, duì shénme shì dōu biǎoxiàn de hěn lèguān.","Anh ấy lúc nào cũng vui vẻ, chuyện gì cũng tỏ ra rất lạc quan."],["不同文化的差异在语言特别是词语上体现得最突出。","Bùtóng wénhuà de chāyì zài yǔyán tèbié shì cíyǔ shang tǐxiàn de zuì tūchū.","Sự khác biệt giữa các nền văn hoá thể hiện rõ nhất ở ngôn ngữ, đặc biệt là ở từ ngữ."],["为了得到领导的欣赏，他拼命地表现自己。","Wèile dédào lǐngdǎo de xīnshǎng, tā pīnmìng de biǎoxiàn zìjǐ.","Để được lãnh đạo để mắt tới, anh ta ra sức thể hiện bản thân."],["我们对你的表现很满意，你下周一能来上班吗？","Wǒmen duì nǐ de biǎoxiàn hěn mǎnyì, nǐ xià zhōuyī néng lái shàngbān ma?","Chúng tôi rất hài lòng với biểu hiện của bạn, thứ Hai tuần sau bạn đi làm được không?"]],"d":[["用表格来说明问题是一种有条理的思考方法的____。","体现"],["人们一直认为，哭是胆小、软弱的____。","表现"],["丽丽是不会错过这个在大家面前____自己的机会的。","表现"],["人生的价值不____在你口袋里有多少钱，而在于你为社会做出了多少贡献。","体现"]],"w":"Có tân ngữ là “bản thân” (表现自己) hoặc dùng như danh từ (你的表现、……的表现) → chọn 表现; nói tư tưởng/giá trị/tinh thần được thể hiện cụ thể qua cái gì → chọn 体现."}],"ext":[["卡车","kǎchē","xe tải"],["列车","lièchē","đoàn tàu"],["摩托车","mótuōchē","xe máy, mô tô"],["行人","xíngrén","người đi bộ"],["车厢","chēxiāng","toa xe"],["车库","chēkù","nhà để xe, ga-ra"],["拐弯","guǎiwān","rẽ, quẹo"],["绕","rào","đi vòng, vòng quanh"],["长途","chángtú","đường dài"],["运输","yùnshū","vận chuyển"],["汽油","qìyóu","xăng"],["罚款","fákuǎn","phạt tiền"]],"extt":"交通","notes":"Nguồn cuối bài khoá: 改编自《读者》2012年第8期. Bài khoá sách ghi 744字. Phần 词语例释 có 3 mục (照常, 难怪, 与其) và 1 mục 词语辨析 (表现—体现). 注释 nói 照常 là động từ và phó từ, còn bảng từ mới chỉ ghi phó.; 难怪 bảng từ ghi đgt. — giữ nguyên theo sách. Tên riêng 佩·詹森: sách ghi nghĩa Việt là \"Pay Jensen\" — giữ nguyên. Câu dài \"经过多次努力……停车场等。\" được cắt tại dấu ；. Drill 表现/体现 (1) theo mẫu có sẵn trong sách, (2)–(4) do người soạn tự giải; drill 难怪 câu 3 lấy từ 练习2②, tự giải. Các drill 照常/与其 dựng từ câu ví dụ của sách (练一练 là bài hoàn thành câu mở).","order":[{"z":"但很快人们就发现了问题。","t":["但","很快","人们","就","发现","了","问题"],"v":"Nhưng chẳng bao lâu người ta đã nhận ra vấn đề."},{"z":"那么，如何根治交通拥堵呢？","t":["那么","如何","根治","交通拥堵","呢"],"v":"Vậy làm thế nào để trị tận gốc tình trạng ùn tắc giao thông?"},{"z":"这里我们不妨听听佩·詹森的故事。","t":["这里","我们","不妨","听听","佩","·","詹森","的","故事"],"v":"Ở đây chúng ta thử nghe câu chuyện của Pay Jensen xem sao."},{"z":"在主要十字路口取消地下通道，让行人从地下重返地面；","t":["在","主要","十字路口","取消","地下通道","让","行人","从","地下","重返","地面"],"v":"bỏ hầm đi bộ ở các ngã tư chính để người đi bộ từ dưới lòng đất trở lại mặt đường;"},{"z":"在购物广场、商务大厦的附近不建停车场等。","t":["在","购物广场","商务大厦","的","附近","不建","停车场","等"],"v":"không xây bãi đỗ xe gần các trung tâm mua sắm, cao ốc văn phòng, v.v."},{"z":"这样一来，道路拥堵大为缓解。","t":["这样一来","道路","拥堵","大为","缓解"],"v":"Nhờ vậy, tình trạng ùn tắc đường sá đã được giảm bớt đáng kể."},{"z":"虽然战争临近，但这里的日常生活，一切照常。","t":["虽然","战争","临近","但","这里","的","日常生活","一切","照常"],"v":"Tuy chiến tranh đã cận kề nhưng cuộc sống thường ngày ở đây vẫn hoàn toàn như cũ."},{"z":"在东方广场的迎新活动照常举行。","t":["在","东方广场","的","迎新","活动","照常","举行"],"v":"Hoạt động chào đón thành viên mới ở quảng trường Phương Đông vẫn được tổ chức như thường lệ."},{"z":"你的抽屉真乱，难怪总是找不到东西。","t":["你","的","抽屉","真乱","难怪","总是","找","不到","东西"],"v":"Ngăn kéo của cậu bừa thật, thảo nào lúc nào cũng không tìm thấy đồ."},{"z":"与其说是采访，不如说是向他学习。","t":["与其说是","采访","不如说是","向","他","学习"],"v":"Nói là phỏng vấn thì chẳng bằng nói là đi học hỏi ông ấy."},{"z":"与其找个不认真的小时工，我宁可自己打扫。","t":["与其","找个","不","认真","的","小时工","我","宁可","自己","打扫"],"v":"Thuê một người giúp việc theo giờ làm ăn cẩu thả thì tôi thà tự dọn dẹp còn hơn."},{"z":"这部电影表现/体现出鲜明的时代特点。","t":["这部","电影","表现","/","体现","出","鲜明","的","时代特点"],"v":"Bộ phim này thể hiện rõ nét đặc điểm của thời đại."},{"z":"为了得到领导的欣赏，他拼命地表现自己。","t":["为了","得到","领导","的","欣赏","他","拼命","地","表现","自己"],"v":"Để được lãnh đạo để mắt tới, anh ta ra sức thể hiện bản thân."}]},"34":{"n":34,"tz":"鸟儿的护肤术","tv":"Cách loài chim bảo vệ da","batches":[[{"h":"接触","p":"jiēchù","v":"tiếp xúc","k":"đgt.","x":0,"ez":"大家都接触过鸟儿吧？","ev":"Chắc hẳn ai cũng từng tiếp xúc với chim rồi nhỉ? <i>(bài khoá)</i>"},{"h":"特征","p":"tèzhēng","v":"điểm đặc trưng, nét đặc biệt","k":"dt.","x":0,"ez":"那你知道鸟儿最重要的特征是什么吗？","ev":"Vậy bạn có biết đặc điểm quan trọng nhất của loài chim là gì không? <i>(bài khoá)</i>"},{"h":"翅膀","p":"chìbǎng","v":"cánh (côn trùng, chim)","k":"dt.","x":0,"ez":"是有翅膀会飞？","ev":"Là có cánh và biết bay ư? <i>(bài khoá)</i>"},{"h":"昆虫","p":"kūnchóng","v":"côn trùng, sâu bọ","k":"dt.","x":0,"ez":"还是吃昆虫？","ev":"Hay là ăn côn trùng? <i>(bài khoá)</i>"},{"h":"天空","p":"tiānkōng","v":"bầu trời","k":"dt.","x":0,"ez":"作为一只鸟儿，不管是天空中飞的，陆地上走的，或者能入水的，都必须拥有羽毛。","ev":"Đã là chim thì dù là loài bay trên trời, đi trên mặt đất hay có thể xuống nước, đều phải có lông vũ. <i>(bài khoá)</i>"},{"h":"区分","p":"qūfēn","v":"phân biệt","k":"đgt.","x":1,"ez":"没错儿，区分鸟儿和其他动物的唯一特征就是羽毛，而不是会不会飞！","ev":"Đúng vậy, đặc điểm duy nhất để phân biệt chim với các loài động vật khác chính là lông vũ, chứ không phải chuyện có biết bay hay không! <i>(bài khoá)</i>"},{"h":"唯一","p":"wéiyī","v":"duy nhất, độc nhất","k":"tt.","x":0,"ez":"没错儿，区分鸟儿和其他动物的唯一特征就是羽毛，而不是会不会飞！","ev":"Đúng vậy, đặc điểm duy nhất để phân biệt chim với các loài động vật khác chính là lông vũ, chứ không phải chuyện có biết bay hay không! <i>(bài khoá)</i>"},{"h":"斑","p":"bān","v":"bớt, vết lốm đốm","k":"dt.","x":1,"ez":"羽毛上的颜色和斑还能充当保护色；","ev":"Màu sắc và những đốm trên lông còn có thể đóng vai trò màu ngụy trang để tự vệ; <i>(bài khoá)</i>"},{"h":"充当","p":"chōngdāng","v":"làm, đảm nhiệm","k":"đgt.","x":1,"ez":"总之，在鸟儿的生活中，羽毛充当着十分重要的角色。","ev":"Tóm lại, trong đời sống của loài chim, lông vũ đóng một vai trò vô cùng quan trọng. <i>(bài khoá)</i>"},{"h":"总之","p":"zǒngzhī","v":"nói chung, tóm lại","k":"liên.","x":0,"ez":"总之，网络的确带给我们以前无法想象的方便，但同时它也带来了一定的危害。","ev":"Tóm lại, mạng internet quả thực mang đến cho chúng ta sự tiện lợi mà trước đây không thể tưởng tượng nổi, nhưng đồng thời cũng gây ra những tác hại nhất định."},{"h":"角色","p":"juésè","v":"vai trò, vai","k":"dt.","x":0,"ez":"总之，在鸟儿的生活中，羽毛充当着十分重要的角色。","ev":"Tóm lại, trong đời sống của loài chim, lông vũ đóng một vai trò vô cùng quan trọng. <i>(bài khoá)</i>"},{"h":"爱惜","p":"àixī","v":"yêu quý, quý trọng","k":"đgt.","x":0,"ez":"所以，鸟儿非常爱惜羽毛，每天都会花很长时间来保养自己的“羽衣”。","ev":"Vì thế, chim rất quý bộ lông của mình, ngày nào cũng dành rất nhiều thời gian để chăm sóc “chiếc áo lông” của mình. <i>(bài khoá)</i>"},{"h":"保养","p":"bǎoyǎng","v":"chăm sóc, bảo quản","k":"đgt.","x":1,"ez":"毫无疑问，洗澡也是保养的一大基本项目。","ev":"Không còn nghi ngờ gì nữa, tắm cũng là một hạng mục cơ bản quan trọng trong việc chăm sóc. <i>(bài khoá)</i>"},{"h":"反复","p":"fǎnfù","v":"nhiều lần, lặp đi lặp lại","k":"phó.","x":0,"ez":"它们只要一有时间，就会情不自禁地背过头去，反复地啄着羽毛。","ev":"Hễ có chút thời gian là chúng lại bất giác ngoảnh đầu ra sau, rỉa lông hết lần này đến lần khác. <i>(bài khoá)</i>"},{"h":"啄","p":"zhuó","v":"mổ, rỉa","k":"đgt.","x":1,"ez":"……它们只要有时间，就会情不自禁地背过头去，反复地啄着羽毛，……","ev":"…hễ có thời gian là chúng lại bất giác ngoảnh đầu ra sau, mổ rỉa bộ lông hết lần này đến lần khác… <i>(bài khoá)</i>"},{"h":"随身","p":"suíshēn","v":"mang bên mình, theo bên người","k":"tt.","x":0,"ez":"整理羽毛是保养的基本功，它们只要有时间，就会情不自禁地背过头去，反复地啄着羽毛，就像随身带了一把梳子梳头发一样，顺便上上油，让羽毛更光滑。","ev":"Chải chuốt lông là kỹ năng cơ bản của việc chăm sóc: hễ có thời gian là chúng lại bất giác ngoảnh đầu ra sau, rỉa lông hết lần này đến lần khác, y như mang theo bên mình một chiếc lược để chải tóc, tiện thể bôi chút dầu cho bộ lông thêm bóng mượt. <i>(bài khoá)</i>"},{"h":"梳子","p":"shūzi","v":"(cái) lược","k":"dt.","x":0,"ez":"整理羽毛是保养的基本功，它们只要有时间，就会情不自禁地背过头去，反复地啄着羽毛，就像随身带了一把梳子梳头发一样，顺便上上油，让羽毛更光滑。","ev":"Chải chuốt lông là kỹ năng cơ bản của việc chăm sóc: hễ có thời gian là chúng lại bất giác ngoảnh đầu ra sau, rỉa lông hết lần này đến lần khác, y như mang theo bên mình một chiếc lược để chải tóc, tiện thể bôi chút dầu cho bộ lông thêm bóng mượt. <i>(bài khoá)</i>"},{"h":"光滑","p":"guānghuá","v":"trơn, mượt, bóng loáng","k":"tt.","x":0,"ez":"整理羽毛是保养的基本功，它们只要有时间，就会情不自禁地背过头去，反复地啄着羽毛，就像随身带了一把梳子梳头发一样，顺便上上油，让羽毛更光滑。","ev":"Chải chuốt lông là kỹ năng cơ bản của việc chăm sóc: hễ có thời gian là chúng lại bất giác ngoảnh đầu ra sau, rỉa lông hết lần này đến lần khác, y như mang theo bên mình một chiếc lược để chải tóc, tiện thể bôi chút dầu cho bộ lông thêm bóng mượt. <i>(bài khoá)</i>"},{"h":"抓","p":"zhuā","v":"bắt, tóm","k":"đgt.","x":0,"ez":"另外，鸟儿在理毛的时候，还会抓出一点儿寄生虫。","ev":"Ngoài ra, trong lúc rỉa lông, chim còn bắt ra được một ít ký sinh trùng. <i>(bài khoá)</i>"},{"h":"寄生","p":"jìshēng","v":"ký sinh, ăn bám","k":"đgt.","x":1,"ez":"另外，鸟儿在理毛的时候，还会抓出一点儿寄生虫。","ev":"Ngoài ra, trong lúc rỉa lông, chim còn bắt ra được một ít ký sinh trùng. <i>(bài khoá)</i>"},{"h":"肥皂","p":"féizào","v":"xà phòng","k":"dt.","x":0,"ez":"不过，鸟儿洗澡用不着肥皂，而且不同种类的鸟儿选择的“澡堂”也不一样，概括来说，就是以方便为原则。","ev":"Có điều, chim tắm không cần đến xà phòng, hơn nữa “nhà tắm” mà mỗi loài chim chọn cũng khác nhau; nói khái quát thì nguyên tắc là sao cho tiện. <i>(bài khoá)</i>"},{"h":"种类","p":"zhǒnglèi","v":"chủng loại, loại","k":"dt.","x":0,"ez":"不过，鸟儿洗澡用不着肥皂，而且不同种类的鸟儿选择的“澡堂”也不一样，概括来说，就是以方便为原则。","ev":"Có điều, chim tắm không cần đến xà phòng, hơn nữa “nhà tắm” mà mỗi loài chim chọn cũng khác nhau; nói khái quát thì nguyên tắc là sao cho tiện. <i>(bài khoá)</i>"},{"h":"概括","p":"gàikuò","v":"khái quát; tóm tắt","k":"tt./đgt.","x":0,"ez":"不过，鸟儿洗澡用不着肥皂，而且不同种类的鸟儿选择的“澡堂”也不一样，概括来说，就是以方便为原则。","ev":"Có điều, chim tắm không cần đến xà phòng, hơn nữa “nhà tắm” mà mỗi loài chim chọn cũng khác nhau; nói khái quát thì nguyên tắc là sao cho tiện. <i>(bài khoá)</i>"},{"h":"岛屿","p":"dǎoyǔ","v":"(hòn) đảo","k":"dt.","x":0,"ez":"比如，海鸟在岛屿上生活，就会选择海水；","ev":"Chẳng hạn, chim biển sống trên các hòn đảo thì sẽ chọn nước biển; <i>(bài khoá)</i>"},{"h":"知更鸟","p":"zhīgēngniǎo","v":"chim cổ đỏ","k":"dt.","x":1,"ez":"知更鸟喜欢路旁的浅水坑；","ev":"chim cổ đỏ lại thích những vũng nước nông bên đường; <i>(bài khoá)</i>"},{"h":"坑","p":"kēng","v":"hố, vũng","k":"dt.","x":1,"ez":"知更鸟喜欢路旁的浅水坑；","ev":"chim cổ đỏ lại thích những vũng nước nông bên đường; <i>(bài khoá)</i>"},{"h":"池塘","p":"chítáng","v":"ao, đầm","k":"dt.","x":0,"ez":"寒带的鸟呢，因为江河池塘不好找，只好以雪代水；","ev":"còn chim ở vùng hàn đới, vì khó tìm được sông ngòi ao hồ nên đành lấy tuyết thay nước; <i>(bài khoá)</i>"},{"h":"老鹰","p":"lǎoyīng","v":"diều hâu","k":"dt.","x":1,"ez":"而老鹰的洗澡方式更是直接，它们会在雨中张开双翅痛快地迎接洗礼！","ev":"còn cách tắm của diều hâu thì càng trực tiếp hơn: chúng dang rộng đôi cánh giữa trời mưa, khoan khoái đón nhận “lễ rửa tội”! <i>(bài khoá)</i>"},{"h":"痛快","p":"tòngkuài","v":"vui sướng, thích thú, đã, sướng","k":"tt.","x":0,"ez":"而老鹰的洗澡方式更是直接，它们会在雨中张开双翅痛快地迎接洗礼！","ev":"còn cách tắm của diều hâu thì càng trực tiếp hơn: chúng dang rộng đôi cánh giữa trời mưa, khoan khoái đón nhận “lễ rửa tội”! <i>(bài khoá)</i>"},{"h":"迎接","p":"yíngjiē","v":"nghênh đón, chào đón, đón nhận","k":"đgt.","x":0,"ez":"而老鹰的洗澡方式更是直接，它们会在雨中张开双翅痛快地迎接洗礼！","ev":"còn cách tắm của diều hâu thì càng trực tiếp hơn: chúng dang rộng đôi cánh giữa trời mưa, khoan khoái đón nhận “lễ rửa tội”! <i>(bài khoá)</i>"},{"h":"洗礼","p":"xǐlǐ","v":"lễ rửa tội","k":"dt.","x":1,"ez":"而老鹰的洗澡方式更是直接，它们会在雨中张开双翅痛快地迎接洗礼！","ev":"còn cách tắm của diều hâu thì càng trực tiếp hơn: chúng dang rộng đôi cánh giữa trời mưa, khoan khoái đón nhận “lễ rửa tội”! <i>(bài khoá)</i>"},{"h":"沙子","p":"shāzi","v":"hạt cát","k":"dt.","x":1,"ez":"所谓沙浴，就是用沙子洗澡，它们之所以放弃了用水洗澡，在很大程度上和它们的生活环境有关，它们大多生活在沙漠等干燥的环境，爱在地面上活动。","ev":"Cái gọi là tắm cát chính là dùng cát để tắm; chúng sở dĩ bỏ cách tắm bằng nước phần lớn là do môi trường sống: phần đông chúng sống ở những nơi khô hạn như sa mạc và thích hoạt động trên mặt đất. <i>(bài khoá)</i>"},{"h":"干燥","p":"gānzào","v":"khô","k":"tt.","x":0,"ez":"所谓沙浴，就是用沙子洗澡，它们之所以放弃了用水洗澡，在很大程度上和它们的生活环境有关，它们大多生活在沙漠等干燥的环境，爱在地面上活动。","ev":"Cái gọi là tắm cát chính là dùng cát để tắm; chúng sở dĩ bỏ cách tắm bằng nước phần lớn là do môi trường sống: phần đông chúng sống ở những nơi khô hạn như sa mạc và thích hoạt động trên mặt đất. <i>(bài khoá)</i>"},{"h":"秘密","p":"mìmì","v":"bí mật; điều bí mật","k":"tt./dt.","x":0,"ez":"另外，睡眠是鸟儿们最佳的保养方式，虽然我们很少看到睡眠中的鸟儿，那是因为它们通常会寻找一处秘密的地方休息。","ev":"Ngoài ra, giấc ngủ là cách chăm sóc tốt nhất của loài chim; chúng ta hiếm khi thấy chim đang ngủ, đó là vì chúng thường tìm một chỗ kín đáo, bí mật để nghỉ ngơi. <i>(bài khoá)</i>"}]],"texts":[{"no":1,"tz":"","tv":"","lines":[{"s":"","z":"大家都接触过鸟儿吧？","p":"Dàjiā dōu jiēchùguo niǎo'ér ba?","v":"Chắc hẳn ai cũng từng tiếp xúc với chim rồi nhỉ?","b":0},{"s":"","z":"那你知道鸟儿最重要的特征是什么吗？","p":"Nà nǐ zhīdào niǎo'ér zuì zhòngyào de tèzhēng shì shénme ma?","v":"Vậy bạn có biết đặc điểm quan trọng nhất của loài chim là gì không?","b":0},{"s":"","z":"是有翅膀会飞？","p":"Shì yǒu chìbǎng huì fēi?","v":"Là có cánh và biết bay ư?","b":0},{"s":"","z":"还是吃昆虫？","p":"Háishi chī kūnchóng?","v":"Hay là ăn côn trùng?","b":0},{"s":"","z":"作为一只鸟儿，不管是天空中飞的，陆地上走的，或者能入水的，都必须拥有羽毛。","p":"Zuòwéi yì zhī niǎo'ér, bùguǎn shì tiānkōng zhōng fēi de, lùdì shang zǒu de, huòzhě néng rù shuǐ de, dōu bìxū yōngyǒu yǔmáo.","v":"Đã là chim thì dù là loài bay trên trời, đi trên mặt đất hay có thể xuống nước, đều phải có lông vũ.","b":0},{"s":"","z":"没错儿，区分鸟儿和其他动物的唯一特征就是羽毛，而不是会不会飞！","p":"Méi cuòr, qūfēn niǎo'ér hé qítā dòngwù de wéiyī tèzhēng jiù shì yǔmáo, ér bú shì huì bu huì fēi!","v":"Đúng vậy, đặc điểm duy nhất để phân biệt chim với các loài động vật khác chính là lông vũ, chứ không phải chuyện có biết bay hay không!","b":0},{"s":"","z":"羽毛的作用很多，既可以保暖，又可以保护皮肤；","p":"Yǔmáo de zuòyòng hěn duō, jì kěyǐ bǎonuǎn, yòu kěyǐ bǎohù pífū;","v":"Lông vũ có rất nhiều tác dụng: vừa có thể giữ ấm, lại vừa bảo vệ được làn da;","b":0},{"s":"","z":"羽毛上的颜色和斑还能充当保护色；","p":"Yǔmáo shang de yánsè hé bān hái néng chōngdāng bǎohùsè;","v":"màu sắc và những đốm trên lông còn có thể đóng vai trò màu ngụy trang để tự vệ;","b":0},{"s":"","z":"当然，更关键的是，羽毛有助于飞行；","p":"Dāngrán, gèng guānjiàn de shì, yǔmáo yǒuzhù yú fēixíng;","v":"và dĩ nhiên, điều mấu chốt hơn cả là lông vũ giúp cho việc bay;","b":0},{"s":"","z":"甚至还有一些鸟儿的部分羽毛有“触觉”。","p":"Shènzhì hái yǒu yìxiē niǎo'ér de bùfen yǔmáo yǒu “chùjué”.","v":"thậm chí ở một số loài chim, một phần bộ lông còn có cả “xúc giác”.","b":0},{"s":"","z":"总之，在鸟儿的生活中，羽毛充当着十分重要的角色。","p":"Zǒngzhī, zài niǎo'ér de shēnghuó zhōng, yǔmáo chōngdāngzhe shífēn zhòngyào de juésè.","v":"Tóm lại, trong đời sống của loài chim, lông vũ đóng một vai trò vô cùng quan trọng.","b":0},{"s":"","z":"所以，鸟儿非常爱惜羽毛，每天都会花很长时间来保养自己的“羽衣”。","p":"Suǒyǐ, niǎo'ér fēicháng àixī yǔmáo, měi tiān dōu huì huā hěn cháng shíjiān lái bǎoyǎng zìjǐ de “yǔyī”.","v":"Vì thế, chim rất quý bộ lông của mình, ngày nào cũng dành rất nhiều thời gian để chăm sóc “chiếc áo lông” của mình.","b":0},{"s":"","z":"整理羽毛是保养的基本功，它们只要有时间，就会情不自禁地背过头去，反复地啄着羽毛，就像随身带了一把梳子梳头发一样，顺便上上油，让羽毛更光滑。","p":"Zhěnglǐ yǔmáo shì bǎoyǎng de jīběngōng, tāmen zhǐyào yǒu shíjiān, jiù huì qíngbúzìjīn de bèiguò tóu qu, fǎnfù de zhuózhe yǔmáo, jiù xiàng suíshēn dàile yì bǎ shūzi shū tóufa yíyàng, shùnbiàn shàngshang yóu, ràng yǔmáo gèng guānghuá.","v":"Chải chuốt lông là kỹ năng cơ bản của việc chăm sóc: hễ có thời gian là chúng lại bất giác ngoảnh đầu ra sau, rỉa lông hết lần này đến lần khác, y như mang theo bên mình một chiếc lược để chải tóc, tiện thể bôi chút dầu cho bộ lông thêm bóng mượt.","b":1},{"s":"","z":"另外，鸟儿在理毛的时候，还会抓出一点儿寄生虫。","p":"Lìngwài, niǎo'ér zài lǐ máo de shíhou, hái huì zhuāchū yìdiǎnr jìshēngchóng.","v":"Ngoài ra, trong lúc rỉa lông, chim còn bắt ra được một ít ký sinh trùng.","b":0},{"s":"","z":"毫无疑问，洗澡也是保养的一大基本项目。","p":"Háo wú yíwèn, xǐzǎo yě shì bǎoyǎng de yí dà jīběn xiàngmù.","v":"Không còn nghi ngờ gì nữa, tắm cũng là một hạng mục cơ bản quan trọng trong việc chăm sóc.","b":1},{"s":"","z":"不过，鸟儿洗澡用不着肥皂，而且不同种类的鸟儿选择的“澡堂”也不一样，概括来说，就是以方便为原则。","p":"Búguò, niǎo'ér xǐzǎo yòngbuzháo féizào, érqiě bùtóng zhǒnglèi de niǎo'ér xuǎnzé de “zǎotáng” yě bù yíyàng, gàikuò lái shuō, jiù shì yǐ fāngbiàn wéi yuánzé.","v":"Có điều, chim tắm không cần đến xà phòng, hơn nữa “nhà tắm” mà mỗi loài chim chọn cũng khác nhau; nói khái quát thì nguyên tắc là sao cho tiện.","b":0},{"s":"","z":"比如，海鸟在岛屿上生活，就会选择海水；","p":"Bǐrú, hǎiniǎo zài dǎoyǔ shang shēnghuó, jiù huì xuǎnzé hǎishuǐ;","v":"Chẳng hạn, chim biển sống trên các hòn đảo thì sẽ chọn nước biển;","b":0},{"s":"","z":"知更鸟喜欢路旁的浅水坑；","p":"Zhīgēngniǎo xǐhuan lùpáng de qiǎn shuǐkēng;","v":"chim cổ đỏ lại thích những vũng nước nông bên đường;","b":0},{"s":"","z":"寒带的鸟呢，因为江河池塘不好找，只好以雪代水；","p":"Hándài de niǎo ne, yīnwèi jiānghé chítáng bù hǎo zhǎo, zhǐhǎo yǐ xuě dài shuǐ;","v":"còn chim ở vùng hàn đới, vì khó tìm được sông ngòi ao hồ nên đành lấy tuyết thay nước;","b":0},{"s":"","z":"而老鹰的洗澡方式更是直接，它们会在雨中张开双翅痛快地迎接洗礼！","p":"Ér lǎoyīng de xǐzǎo fāngshì gèng shì zhíjiē, tāmen huì zài yǔ zhōng zhāngkāi shuāng chì tòngkuài de yíngjiē xǐlǐ!","v":"còn cách tắm của diều hâu thì càng trực tiếp hơn: chúng dang rộng đôi cánh giữa trời mưa, khoan khoái đón nhận “lễ rửa tội”!","b":0},{"s":"","z":"沙浴也是一些鸟儿喜欢的保养方式。","p":"Shāyù yě shì yìxiē niǎo'ér xǐhuan de bǎoyǎng fāngshì.","v":"Tắm cát cũng là cách chăm sóc mà một số loài chim ưa thích.","b":0},{"s":"","z":"所谓沙浴，就是用沙子洗澡，它们之所以放弃了用水洗澡，在很大程度上和它们的生活环境有关，它们大多生活在沙漠等干燥的环境，爱在地面上活动。","p":"Suǒwèi shāyù, jiù shì yòng shāzi xǐzǎo, tāmen zhīsuǒyǐ fàngqìle yòng shuǐ xǐzǎo, zài hěn dà chéngdù shang hé tāmen de shēnghuó huánjìng yǒuguān, tāmen dàduō shēnghuó zài shāmò děng gānzào de huánjìng, ài zài dìmiàn shang huódòng.","v":"Cái gọi là tắm cát chính là dùng cát để tắm; chúng sở dĩ bỏ cách tắm bằng nước phần lớn là do môi trường sống: phần đông chúng sống ở những nơi khô hạn như sa mạc và thích hoạt động trên mặt đất.","b":0},{"s":"","z":"另外，睡眠是鸟儿们最佳的保养方式，虽然我们很少看到睡眠中的鸟儿，那是因为它们通常会寻找一处秘密的地方休息。","p":"Lìngwài, shuìmián shì niǎo'érmen zuì jiā de bǎoyǎng fāngshì, suīrán wǒmen hěn shǎo kàndào shuìmián zhōng de niǎo'ér, nà shì yīnwèi tāmen tōngcháng huì xúnzhǎo yí chù mìmì de dìfang xiūxi.","v":"Ngoài ra, giấc ngủ là cách chăm sóc tốt nhất của loài chim; chúng ta hiếm khi thấy chim đang ngủ, đó là vì chúng thường tìm một chỗ kín đáo, bí mật để nghỉ ngơi.","b":0},{"s":"","z":"大多数鸟儿1天大约睡8小时，有些鸟儿差不多要睡1天，而另一些鸟儿几乎一点儿觉也不用睡。","p":"Dàduōshù niǎo'ér yì tiān dàyuē shuì bā xiǎoshí, yǒuxiē niǎo'ér chàbuduō yào shuì yì tiān, ér lìng yìxiē niǎo'ér jīhū yìdiǎnr jiào yě bú yòng shuì.","v":"Phần lớn các loài chim mỗi ngày ngủ khoảng 8 tiếng, có loài ngủ gần như suốt cả ngày, trong khi một số loài khác lại hầu như chẳng cần ngủ chút nào.","b":0}]}],"aud":[{"v":"audio/34-2.mp3","t":"audio/34-1.mp3"}],"gram":[{"id":"zongzhi","t":"总之","s":"tóm lại, nói chung (liên từ)","b":"Sách giải thích <b>总之</b> là <b>liên từ</b>, dùng để <b>khái quát lại nội dung đã nói ở phía trước</b>, tương đương “总的来说” – nói chung, tóm lại. Thường đứng đầu vế câu (hoặc đầu câu) mang ý kết luận, theo sau có dấu phẩy.","r":["Vị trí: đứng đầu vế/câu tổng kết, thường có dấu phẩy: ……，总之，……","Phía trước là các ý hoặc sự việc cụ thể, phía sau là kết luận chung: 上海、南京、杭州……，总之，想去南方几个城市转转","Có thể mở đầu cả một câu để tổng kết đoạn văn phía trước: 总之，在鸟儿的生活中，羽毛充当着十分重要的角色","Hay đi sau 不管……（练一练 của sách）: dù điều kiện thế nào thì kết luận vẫn không đổi — 不管你去不去，总之……"],"e":[["暑假我可能去上海、南京，还有杭州，总之，想去南方几个城市转转。","Shǔjià wǒ kěnéng qù Shànghǎi, Nánjīng, hái yǒu Hángzhōu, zǒngzhī, xiǎng qù nánfāng jǐ ge chéngshì zhuànzhuan.","Kỳ nghỉ hè tôi có thể đi Thượng Hải, Nam Kinh, rồi cả Hàng Châu nữa — nói chung là muốn đi dạo một vòng vài thành phố miền Nam."],["总之，网络的确带给我们以前无法想象的方便，但同时它也带来了一定的危害。","Zǒngzhī, wǎngluò díquè dài gěi wǒmen yǐqián wúfǎ xiǎngxiàng de fāngbiàn, dàn tóngshí tā yě dàiláile yídìng de wēihài.","Tóm lại, mạng internet quả thực mang đến cho chúng ta sự tiện lợi mà trước đây không thể tưởng tượng nổi, nhưng đồng thời cũng gây ra những tác hại nhất định."],["总之，在鸟儿的生活中，羽毛充当着十分重要的角色。","Zǒngzhī, zài niǎo'ér de shēnghuó zhōng, yǔmáo chōngdāngzhe shífēn zhòngyào de juésè.","Tóm lại, trong đời sống của loài chim, lông vũ đóng một vai trò vô cùng quan trọng. <i>(bài khoá)</i>"]],"d":[["暑假我可能去上海、南京，还有杭州，____，想去南方几个城市转转。","总之"],["____，网络的确带给我们以前无法想象的方便，但同时它也带来了一定的危害。","总之"],["____，在鸟儿的生活中，羽毛充当着十分重要的角色。","总之"]],"w":"总之 dùng để gói lại những gì đã nói trước đó thành một kết luận; không dùng nó để mở ra một ý mới không liên quan đến phần trước."},{"id":"dongci_guo","t":"动词＋过","s":"bổ ngữ 过: đổi hướng / dời vị trí nhờ động tác","b":"Sách nêu hai cách dùng của <b>động từ + 过</b> (过 làm bổ ngữ chỉ xu hướng, không phải 过 “đã từng”): <b>1.</b> thông qua động tác, người hoặc vật <b>thay đổi phương hướng</b> (转过身、背过头去); <b>2.</b> thông qua động tác, người hoặc vật <b>di chuyển vị trí</b> (接过书、闪过很多想法).","r":["Đổi hướng: 转 / 回 / 背 + 过 + 身 / 头: 他转过身；背过头去","Dời vị trí: 接 / 递 / 闪 + 过 + tân ngữ: 接过书；脑子里闪过了很多想法","过 đứng ngay sau động từ, tân ngữ đứng sau 过; có thể thêm 来/去 sau tân ngữ: 背过头去","Lỗi hay gặp: ✗ 他转身过 → ✓ 他转过身"],"e":[["他转过身，一句话也不说。","Tā zhuǎnguò shēn, yí jù huà yě bù shuō.","Anh ấy quay người đi, không nói một lời nào."],["……它们只要有时间，就会情不自禁地背过头去，反复地啄着羽毛，……","…tāmen zhǐyào yǒu shíjiān, jiù huì qíngbúzìjīn de bèiguò tóu qu, fǎnfù de zhuózhe yǔmáo, …","…hễ có thời gian là chúng lại bất giác ngoảnh đầu ra sau, rỉa lông hết lần này đến lần khác… <i>(bài khoá)</i>"],["接过书的那一刻，老王突然明白了自己失败的原因。","Jiēguò shū de nà yí kè, Lǎo Wáng tūrán míngbaile zìjǐ shībài de yuányīn.","Khoảnh khắc đón lấy cuốn sách, ông Vương chợt hiểu ra nguyên nhân thất bại của mình."],["短短的几分钟里，我的脑子里闪过了很多想法。","Duǎnduǎn de jǐ fēnzhōng li, wǒ de nǎozi li shǎnguòle hěn duō xiǎngfǎ.","Chỉ trong vài phút ngắn ngủi, trong đầu tôi đã lóe lên rất nhiều ý nghĩ."]],"d":[["你回____头就可以看见我了。","过"],["他递____一块毛巾给我擦汗。","过"],["青年走到门口，转____身说：“我们会再见的。”","过"]],"w":"Đừng nhầm với trợ từ động thái 过 (我去过北京 – đã từng): ở đây 过 cho biết hướng xoay hoặc sự dịch chuyển của người/vật, và tân ngữ (身、头、书…) đứng sau 过."},{"id":"dongci_kai","t":"动词＋开","s":"bổ ngữ 开: dang ra, mở rộng ra","b":"Sách giải thích <b>động từ + 开</b> biểu thị <b>舒展</b> – thông qua động tác mà vật được dang rộng, mở ra, trải ra: 张开手臂 (dang tay), 慢慢展开 (từ từ mở ra), 张开双翅 (dang đôi cánh).","r":["Cấu trúc: động từ + 开 + (tân ngữ): 张开手臂、张开双翅","Có thể không có tân ngữ: 《清明上河图》……慢慢展开","Các động từ gặp trong sách: 张、展、铺、传 — 张开双臂、把纸铺开、事情传开了","Lỗi hay gặp: ✗ 张双臂开 → ✓ 张开双臂"],"e":[["猴子突然站了起来，张开手臂，抱住了管理员。","Hóuzi tūrán zhànle qǐlai, zhāngkāi shǒubì, bàozhùle guǎnlǐyuán.","Con khỉ đột nhiên đứng dậy, dang rộng hai tay ôm chầm lấy người quản lý."],["《清明上河图》在我们的面前慢慢展开。","“Qīngmíng Shàng Hé Tú” zài wǒmen de miànqián mànmàn zhǎnkāi.","Bức “Thanh minh thượng hà đồ” từ từ mở ra trước mắt chúng tôi."],["而老鹰的洗澡方式更是直接，它们会在雨中张开双翅痛快地迎接洗礼！","Ér lǎoyīng de xǐzǎo fāngshì gèng shì zhíjiē, tāmen huì zài yǔ zhōng zhāngkāi shuāng chì tòngkuài de yíngjiē xǐlǐ!","Còn cách tắm của diều hâu thì càng trực tiếp hơn: chúng dang rộng đôi cánh giữa trời mưa, khoan khoái đón nhận “lễ rửa tội”! <i>(bài khoá)</i>"]],"d":[["回家时，妈妈张____双臂迎接我。","开"],["他把纸铺____，笔拿好，准备练习书法。","开"],["那件事情已经都传____了，大家都知道了。","开"]],"w":"开 ở đây không mang nghĩa “mở (cửa)” hay “bắt đầu”; nó chỉ kết quả là vật được dang rộng, trải ra hoặc lan rộng ra (传开 = lan truyền khắp nơi)."},{"id":"fanfu_chongfu","t":"反复 vs 重复","s":"lặp đi lặp lại / làm lại, trùng lặp","b":"<b>Điểm giống:</b> cả hai đều mang nghĩa <b>không chỉ một lần</b> (不止一次); trong câu 这件事情你已经反复/重复说过好几遍了 có thể dùng từ nào cũng được. <b>Điểm khác</b> nằm ở từ loại và đối tượng: 反复 vừa là phó từ, động từ, vừa là danh từ và thiên về tình huống bất lợi tái diễn; 重复 chỉ là động từ, nói việc làm lại hoặc thứ giống nhau xuất hiện lần nữa.","r":["反复 ① phó từ: hết lần này đến lần khác (一遍一遍地), đứng trước động từ: 反复地啄着羽毛 — 重复 ① động từ: làm lại cùng một việc thêm lần nữa: 请你再重复一遍","反复 ② động từ: tình huống bất lợi xuất hiện trở lại: 这种病容易反复 — 重复 ② động từ: cùng một thứ lại xuất hiện lần nữa: 这两个练习题重复了","反复 ③ danh từ: tình trạng không tốt lặp lại: 他思想上可能还有反复 — 重复 không có cách dùng này"],"e":[["这件事情你已经反复/重复说过好几遍了。","Zhè jiàn shìqing nǐ yǐjīng fǎnfù/chóngfù shuōguo hǎo jǐ biàn le.","Chuyện này cậu đã nói đi nói lại mấy lần rồi."],["它们只要一有时间，就会情不自禁地背过头去，反复地啄着羽毛。","Tāmen zhǐyào yì yǒu shíjiān, jiù huì qíngbúzìjīn de bèiguò tóu qu, fǎnfù de zhuózhe yǔmáo.","Hễ có chút thời gian là chúng lại bất giác ngoảnh đầu ra sau, rỉa lông hết lần này đến lần khác. <i>(bài khoá)</i>"],["我没听清，请你再重复一遍。","Wǒ méi tīngqīng, qǐng nǐ zài chóngfù yí biàn.","Tôi nghe không rõ, phiền bạn nhắc lại một lần nữa."],["这种病容易反复。","Zhè zhǒng bìng róngyì fǎnfù.","Bệnh này dễ tái phát."],["这两个练习题重复了。","Zhè liǎng ge liànxítí chóngfù le.","Hai bài tập này bị trùng nhau."],["对这个问题，他思想上可能还有反复。","Duì zhège wèntí, tā sīxiǎng shang kěnéng hái yǒu fǎnfù.","Về vấn đề này, trong suy nghĩ của anh ấy có lẽ vẫn còn dao động, chưa dứt khoát."]],"d":[["我已经____讲了多少次，你竟然还是忘了！","反复"],["这个实验我已经____过两次了。","重复"],["经过____实验，他们终于成功了。","反复"],["他的病情出现了____，情况不太乐观。","反复"]],"w":"Mẹo: làm trạng ngữ đứng trước động từ (反复地 + V, 反复讲/反复实验) hoặc nói về bệnh tình, tư tưởng tái diễn → 反复; làm động từ có bổ ngữ số lần (重复一遍、重复过两次) hoặc nói hai thứ trùng nhau → 重复."}],"ext":[["天空","tiānkōng","bầu trời"],["陆地","lùdì","đất liền, lục địa"],["土地","tǔdì","đất đai"],["池塘","chítáng","ao, đầm"],["沙漠","shāmò","sa mạc"],["沙滩","shātān","bãi cát"],["岛屿","dǎoyǔ","(hòn) đảo"],["岸","àn","bờ"],["洞","dòng","hang, lỗ"],["木头","mùtou","gỗ, khúc gỗ"],["石头","shítou","hòn đá"],["灰尘","huīchén","bụi bặm"]],"extt":"地理环境","notes":"Nguồn cuối bài khoá: 改编自《科学松鼠会》，作者：临渊. Bài này không có 专名 (bảng từ chỉ có 34 từ, có dấu * ở các số 6, 8, 9, 13, 15, 20, 25, 26, 28, 31, 32). Phần 注释 của sách có 3 mục 词语例释 (总之, 动词+过, 动词+开) và 1 mục 词语辨析 (反复—重复). Ví dụ (1) của 动词+开 trong sách có chú thích 手臂 (shǒubì, cánh tay) — đã bỏ phần chú thích khỏi câu. Câu ví dụ bài khoá trong bảng 辨析 sách in “它们只要一有时间”, còn bài khoá in “它们只要有时间” — giữ nguyên mỗi chỗ theo sách. Drill 总之 do người soạn tự đặt từ ví dụ của sách (练一练 của sách là bài hoàn thành câu mở); drill 动词+过/动词+开 chuyển từ bài chọn vị trí A/B/C/D của sách (đáp án tự giải: 过 — A, A, C; 开 — C, A, B); drill 反复/重复 lấy từ 做一做, đáp án tự giải. Trang sách rõ, không có chỗ mờ.","order":[{"z":"大家都接触过鸟儿吧？","t":["大家","都","接触","过","鸟儿","吧"],"v":"Chắc hẳn ai cũng từng tiếp xúc với chim rồi nhỉ?"},{"z":"那你知道鸟儿最重要的特征是什么吗？","t":["那","你","知道","鸟儿","最","重要","的","特征","是","什么","吗"],"v":"Vậy bạn có biết đặc điểm quan trọng nhất của loài chim là gì không?"},{"z":"羽毛的作用很多，既可以保暖，又可以保护皮肤；","t":["羽毛","的","作用","很多","既","可以","保暖","又","可以","保护","皮肤"],"v":"Lông vũ có rất nhiều tác dụng: vừa có thể giữ ấm, lại vừa bảo vệ được làn da;"},{"z":"羽毛上的颜色和斑还能充当保护色；","t":["羽毛","上","的","颜色","和","斑","还","能","充当","保护色"],"v":"màu sắc và những đốm trên lông còn có thể đóng vai trò màu ngụy trang để tự vệ;"},{"z":"当然，更关键的是，羽毛有助于飞行；","t":["当然","更","关键","的","是","羽毛","有助于","飞行"],"v":"và dĩ nhiên, điều mấu chốt hơn cả là lông vũ giúp cho việc bay;"},{"z":"甚至还有一些鸟儿的部分羽毛有“触觉”。","t":["甚至","还有","一些","鸟儿","的","部分","羽毛","有","触觉"],"v":"thậm chí ở một số loài chim, một phần bộ lông còn có cả “xúc giác”."},{"z":"另外，鸟儿在理毛的时候，还会抓出一点儿寄生虫。","t":["另外","鸟儿","在","理毛","的","时候","还会","抓出","一点儿","寄生虫"],"v":"Ngoài ra, trong lúc rỉa lông, chim còn bắt ra được một ít ký sinh trùng."},{"z":"毫无疑问，洗澡也是保养的一大基本项目。","t":["毫无疑问","洗澡","也","是","保养","的","一大","基本","项目"],"v":"Không còn nghi ngờ gì nữa, tắm cũng là một hạng mục cơ bản quan trọng trong việc chăm sóc."},{"z":"比如，海鸟在岛屿上生活，就会选择海水；","t":["比如","海鸟","在","岛屿","上","生活","就","会","选择","海水"],"v":"Chẳng hạn, chim biển sống trên các hòn đảo thì sẽ chọn nước biển; yền tiếp từng đoạn như thế, giống như nước mà rễ hút được bị bơm ngược lên trên."},{"h":"蒸腾","p":"zhēngténg","v":"bốc hơi","k":"đgt.","x":1,"ez":"因为跟蒸腾作用有关，这种特殊的提升力就被称为“蒸腾拉力”。","ev":"Vì liên quan đến quá trình thoát hơi nước, lực nâng đặc biệt này được gọi là “lực kéo thoát hơi nước”."},{"h":"特殊","p":"tèshū","v":"đặc biệt, đặc thù","k":"tt.","x":0,"ez":"因为跟蒸腾作用有关，这种特殊的提升力就被称为“蒸腾拉力”。","ev":"Vì liên quan đến quá trình thoát hơi nước, lực nâng đặc biệt này được gọi là “lực kéo thoát hơi nước”."},{"h":"内部","p":"nèibù","v":"nội bộ, bên trong","k":"dt.","x":0,"ez":"不过，这个大树内部的供水系统具体的运转状况是怎么样的，它们遵守的是一种什么样的秩序，为什么会产生如此巨大的拉力，到目前还是个谜。","ev":"Tuy vậy, hệ thống cấp nước bên trong cây vận hành cụ thể ra sao, nó tuân theo một trật tự như thế nào, vì sao lại tạo ra được lực kéo lớn đến vậy, cho đến nay vẫn còn là một bí ẩn."},{"h":"系统","p":"xìtǒng","v":"hệ thống","k":"dt.","x":0,"ez":"不过，这个大树内部的供水系统具体的运转状况是怎么样的，它们遵守的是一种什么样的秩序，为什么会产生如此巨大的拉力，到目前还是个谜。","ev":"Tuy vậy, hệ thống cấp nước bên trong cây vận hành cụ thể ra sao, nó tuân theo một trật tự như thế nào, vì sao lại tạo ra được lực kéo lớn đến vậy, cho đến nay vẫn còn là một bí ẩn."},{"h":"状况","p":"zhuàngkuàng","v":"tình hình, tình trạng","k":"dt.","x":0,"ez":"不过，这个大树内部的供水系统具体的运转状况是怎么样的，它们遵守的是一种什么样的秩序，为什么会产生如此巨大的拉力，到目前还是个谜。","ev":"Tuy vậy, hệ thống cấp nước bên trong cây vận hành cụ thể ra sao, nó tuân theo một trật tự như thế nào, vì sao lại tạo ra được lực kéo lớn đến vậy, cho đến nay vẫn còn là một bí ẩn."},{"h":"秩序","p":"zhìxù","v":"trật tự","k":"dt.","x":0,"ez":"不过，这个大树内部的供水系统具体的运转状况是怎么样的，它们遵守的是一种什么样的秩序，为什么会产生如此巨大的拉力，到目前还是个谜。","ev":"Tuy vậy, hệ thống cấp nước bên trong cây vận hành cụ thể ra sao, nó tuân theo một trật tự như thế nào, vì sao lại tạo ra được lực kéo lớn đến vậy, cho đến nay vẫn còn là một bí ẩn."}]],"texts":[{"no":1,"tz":"","tv":"","lines":[{"s":"","z":"炎热的夏天，踢完一场球赛，每个队员都已经是汗如雨下。","p":"Yánrè de xiàtiān, tīwán yì chǎng qiúsài, měi ge duìyuán dōu yǐjīng shì hàn rú yǔ xià.","v":"Mùa hè nóng bức, đá xong một trận bóng, cầu thủ nào cũng đã mồ hôi đầm đìa như tắm.","b":0},{"s":"","z":"如果这个时候，能到大树下歇一歇，喝口凉开水，吃个冰激凌，放松放松肌肉，缓解一下疲劳，那一定是件美事，可以很快恢复活力。","p":"Rúguǒ zhège shíhou, néng dào dà shù xià xiē yi xiē, hē kǒu liáng kāishuǐ, chī ge bīngjīlíng, fàngsōng fàngsōng jīròu, huǎnjiě yíxià píláo, nà yídìng shì jiàn měishì, kěyǐ hěn kuài huīfù huólì.","v":"Nếu lúc đó được ra gốc cây to nghỉ một chút, uống ngụm nước đun sôi để nguội, ăn cây kem, thả lỏng cơ bắp cho đỡ mệt, thì đúng là chuyện tuyệt vời, sức lực sẽ hồi phục rất nhanh.","b":0},{"s":"","z":"不过，你知道吗，我们之所以能在大树下享受这种湿润荫凉，也是因为大树在“出汗”呢！","p":"Búguò, nǐ zhīdào ma, wǒmen zhīsuǒyǐ néng zài dà shù xià xiǎngshòu zhè zhǒng shīrùn yìnliáng, yě shì yīnwèi dà shù zài “chū hàn” ne!","v":"Nhưng bạn có biết không, sở dĩ chúng ta được tận hưởng bầu không khí ẩm mát, râm mát dưới gốc cây to, cũng là vì cây đang “đổ mồ hôi” đấy!","b":0},{"s":"","z":"人体要保持相对稳定的温度，一旦温度上升，大脑就会指挥我们的身体赶快出汗，这时所有汗腺开始工作，汗水就从毛孔里冒了出来。","p":"Réntǐ yào bǎochí xiāngduì wěndìng de wēndù, yídàn wēndù shàngshēng, dànǎo jiù huì zhǐhuī wǒmen de shēntǐ gǎnkuài chū hàn, zhè shí suǒyǒu hànxiàn kāishǐ gōngzuò, hànshuǐ jiù cóng máokǒng li màole chūlai.","v":"Cơ thể người cần giữ nhiệt độ tương đối ổn định; hễ nhiệt độ tăng lên, não sẽ ra lệnh cho cơ thể nhanh chóng tiết mồ hôi, lúc này mọi tuyến mồ hôi bắt đầu hoạt động và mồ hôi toát ra từ lỗ chân lông.","b":0},{"s":"","z":"大树出的“汗”，通常是从叶片的气孔里冒出来的，不过，这种“出汗”可不是为了降低温度，而是为了运输养分。","p":"Dà shù chū de “hàn”, tōngcháng shì cóng yèpiàn de qìkǒng li mào chūlai de, búguò, zhè zhǒng “chū hàn” kě bú shì wèile jiàngdī wēndù, ér shì wèile yùnshū yǎngfèn.","v":"“Mồ hôi” của cây thường toát ra từ khí khổng trên lá, có điều kiểu “đổ mồ hôi” này không phải để hạ nhiệt mà là để vận chuyển chất dinh dưỡng.","b":0},{"s":"","z":"我们都知道这样的常识——植物的根会吸收养分和水分，但是你有没有想过，植物是怎么控制这些成分，把它们运输到十几米甚至上百米的树梢的呢？","p":"Wǒmen dōu zhīdào zhèyàng de chángshí——zhíwù de gēn huì xīshōu yǎngfèn hé shuǐfèn, dànshì nǐ yǒu méiyǒu xiǎngguo, zhíwù shì zěnme kòngzhì zhèxiē chéngfèn, bǎ tāmen yùnshū dào shíjǐ mǐ shènzhì shàng bǎi mǐ de shùshāo de ne?","v":"Ai cũng biết một điều thường thức: rễ cây hút chất dinh dưỡng và nước. Nhưng bạn đã bao giờ nghĩ xem cây kiểm soát những thành phần này như thế nào để đưa chúng lên tận ngọn cây cao mười mấy, thậm chí cả trăm mét chưa?","b":1},{"s":"","z":"最初人们认为大树是通过毛细作用来提水的。","p":"Zuìchū rénmen rènwéi dà shù shì tōngguò máoxì zuòyòng lái tí shuǐ de.","v":"Ban đầu người ta cho rằng cây đưa nước lên nhờ hiện tượng mao dẫn.","b":0},{"s":"","z":"所谓“毛细作用”，简单来说，就是水会顺着很细很细的管子向上“爬”，我们在家可以用一个比较细的玻璃管体验一下。","p":"Suǒwèi “máoxì zuòyòng”, jiǎndān lái shuō, jiù shì shuǐ huì shùnzhe hěn xì hěn xì de guǎnzi xiàng shàng “pá”, wǒmen zài jiā kěyǐ yòng yí ge bǐjiào xì de bōliguǎn tǐyàn yíxià.","v":"Nói đơn giản, “hiện tượng mao dẫn” là nước sẽ “bò” ngược lên theo những ống rất rất nhỏ; ở nhà chúng ta có thể thử nghiệm bằng một ống thủy tinh khá mảnh.","b":0},{"s":"","z":"玻璃管越细，水爬升的高度就越高。","p":"Bōliguǎn yuè xì, shuǐ páshēng de gāodù jiù yuè gāo.","v":"Ống thủy tinh càng nhỏ thì nước dâng lên càng cao.","b":0},{"s":"","z":"可是，经过测验计算发现，以大树输送管道的尺寸产生的毛细作用，根本无法把水分送到几十米高的地方。","p":"Kěshì, jīngguò cèyàn jìsuàn fāxiàn, yǐ dà shù shūsòng guǎndào de chǐcùn chǎnshēng de máoxì zuòyòng, gēnběn wúfǎ bǎ shuǐfèn sòngdào jǐ shí mǐ gāo de dìfang.","v":"Thế nhưng qua kiểm tra và tính toán, người ta phát hiện ra rằng với kích thước ống dẫn của cây, hiện tượng mao dẫn hoàn toàn không thể đưa nước lên độ cao vài chục mét.","b":0},{"s":"","z":"实际上，大树利用的是枝干顶端的那些叶片。","p":"Shíjìshang, dà shù lìyòng de shì zhīgàn dǐngduān de nàxiē yèpiàn.","v":"Thực ra, thứ mà cây tận dụng là những chiếc lá ở đầu cành.","b":1},{"s":"","z":"叶子通过不停地向空气中释放水汽，迫使树干中的水分自动前来补充，这样节节传递，就像是把树根吸收的水分给抽了上来。","p":"Yèzi tōngguò bùtíng de xiàng kōngqì zhōng shìfàng shuǐqì, pòshǐ shùgàn zhōng de shuǐfèn zìdòng qiánlái bǔchōng, zhèyàng jiéjié chuándì, jiù xiàng shì bǎ shùgēn xīshōu de shuǐfèn gěi chōule shànglai.","v":"Lá liên tục tỏa hơi nước vào không khí, buộc nước trong thân cây tự động dâng lên bù vào; cứ truyền tiếp từng đoạn như thế, giống như nước mà rễ hút được bị bơm ngược lên trên.","b":0},{"s":"","z":"因为跟蒸腾作用有关，这种特殊的提升力就被称为“蒸腾拉力”。","p":"Yīnwèi gēn zhēngténg zuòyòng yǒuguān, zhè zhǒng tèshū de tíshēnglì jiù bèi chēngwéi “zhēngténg lālì”.","v":"Vì liên quan đến quá trình thoát hơi nước, lực nâng đặc biệt này được gọi là “lực kéo thoát hơi nước”.","b":0},{"s":"","z":"不过，这个大树内部的供水系统具体的运转状况是怎么样的，它们遵守的是一种什么样的秩序，为什么会产生如此巨大的拉力，到目前还是个谜。","p":"Búguò, zhège dà shù nèibù de gōngshuǐ xìtǒng jùtǐ de yùnzhuǎn zhuàngkuàng shì zěnmeyàng de, tāmen zūnshǒu de shì yì zhǒng shénmeyàng de zhìxù, wèi shénme huì chǎnshēng rúcǐ jùdà de lālì, dào mùqián hái shì ge mí.","v":"Tuy vậy, hệ thống cấp nước bên trong cây vận hành cụ thể ra sao, nó tuân theo một trật tự như thế nào, vì sao lại tạo ra được lực kéo lớn đến vậy, cho đến nay vẫn còn là một bí ẩn.","b":0}]}],"aud":[{"v":"audio/35-2.mp3","t":"audio/35-1.mp3"}],"gram":[{"id":"gankuai","t":"赶快","s":"mau mau, nhanh lên (phó từ)","b":"Sách giải thích <b>赶快</b> là <b>phó từ</b>, nghĩa là “抓紧时间、加快速度” – <b>tranh thủ thời gian, đẩy nhanh tốc độ</b>. Đứng trước động từ (hoặc trước cụm 把……) để thúc giục làm việc gì đó ngay, nhanh.","r":["Vị trí: chủ ngữ + 赶快 + động từ: 你赶快把它复印一下","Thường dùng để thúc giục, nhắc nhở, hay đi với 得/要: 得赶快找房子","Hay đi kèm vế nêu lý do/hậu quả nếu chậm trễ: ……，要不……"],"e":[["我下个月要搬家，得赶快找房子。","Wǒ xià ge yuè yào bānjiā, děi gǎnkuài zhǎo fángzi.","Tháng sau tôi phải chuyển nhà rồi, phải nhanh chóng tìm nhà thôi."],["这份材料下午开会要用，你赶快把它复印一下。","Zhè fèn cáiliào xiàwǔ kāihuì yào yòng, nǐ gǎnkuài bǎ tā fùyìn yíxià.","Chiều nay họp cần dùng tài liệu này, cậu mau photo nó đi."],["……一旦温度上升，大脑就会指挥我们的身体赶快出汗，……","…… yídàn wēndù shàngshēng, dànǎo jiù huì zhǐhuī wǒmen de shēntǐ gǎnkuài chū hàn, ……","…hễ nhiệt độ tăng lên, não sẽ ra lệnh cho cơ thể nhanh chóng tiết mồ hôi… <i>(bài khoá)</i>"]],"d":[["我下个月要搬家，得____找房子。","赶快"],["我们____出发吧，要不该赶上堵车了。","赶快"],["火车票还没预定？你____订吧！","赶快"]],"w":""},{"id":"pian","t":"片","s":"tấm, mảnh (danh từ); lượng từ cho vật thành mảng, âm thanh, cảnh sắc","b":"Theo sách, <b>片</b> có hai cách dùng: <b>danh từ</b> chỉ vật phẳng và mỏng, thường không quá lớn (碎片, 叶片); và <b>lượng từ</b> dùng cho những thứ thành mảng, thành tấm, đồng thời dùng cho <b>âm thanh, cảnh sắc</b>.","r":["Danh từ: vật phẳng, mỏng, không lớn — 玻璃碎片 (mảnh kính vỡ), 叶片 (phiến lá)","Lượng từ cho vật thành mảnh/tấm: 一片面包, 一片药, 叶子一片片地掉落下来","Lượng từ cho vùng rộng, âm thanh, cảnh sắc: 一片草地/树林/天空, 一片热烈的欢呼声"],"e":[["瓶子里装着满满的石头、玻璃碎片和沙子。","Píngzi li zhuāngzhe mǎnmǎn de shítou, bōli suìpiàn hé shāzi.","Trong lọ chứa đầy đá, mảnh thủy tinh vỡ và cát."],["大树出的“汗”，通常是从叶片的气孔里冒出来的，……","Dà shù chū de “hàn”, tōngcháng shì cóng yèpiàn de qìkǒng li mào chūlai de, ……","“Mồ hôi” của cây thường toát ra từ khí khổng trên lá… <i>(bài khoá)</i>"],["窗外有一棵大树，秋风中，叶子一片片地掉落下来。","Chuāng wài yǒu yì kē dà shù, qiūfēng zhōng, yèzi yí piànpiàn de diàoluò xiàlai.","Ngoài cửa sổ có một cây to, trong gió thu, lá rơi xuống từng chiếc từng chiếc một."],["同学们听了，发出一片热烈的欢呼声。","Tóngxuémen tīng le, fāchū yí piàn rèliè de huānhūshēng.","Các bạn nghe xong liền reo hò vang dậy."]],"d":[["秋风中，叶子一片____地掉落下来。","片"],["同学们听了，发出一____热烈的欢呼声。","片"],["今天早上我吃了两____面包。","片"]],"w":"Khi là lượng từ, 片 vừa đếm vật mỏng nhỏ (一片药, 一片面包) vừa chỉ cả một vùng rộng hay một âm thanh lan tỏa (一片树林, 一片欢笑声) — nghĩa sau mang sắc thái “cả một vùng/một tràng”."},{"id":"genben","t":"根本","s":"gốc rễ (danh từ); cơ bản, then chốt (tính từ); hoàn toàn, tuyệt nhiên (phó từ)","b":"Sách nêu ba từ loại của <b>根本</b>: <b>danh từ</b> – phần quan trọng nhất của sự vật; <b>tính từ</b> – nghĩa “主要的、最重要的、起决定作用的” (chủ yếu, quan trọng nhất, mang tính quyết định); <b>phó từ</b> – biểu thị “từ đầu đến cuối, trước sau như một”, <b>thường dùng trong câu phủ định</b>; ngoài ra phó từ 根本 còn mang nghĩa <b>triệt để, hoàn toàn</b>.","r":["Danh từ: ……是……的根本; 从根本上解决问题","Tính từ, làm định ngữ: 根本的问题, 根本利益","Phó từ + phủ định (không hề, tuyệt nhiên): 根本读不懂, 根本无法……, 根本不/没……","Phó từ nghĩa triệt để, hoàn toàn: 已经根本解决了; 他根本就是在……"],"e":[["教育是国家的根本。","Jiàoyù shì guójiā de gēnběn.","Giáo dục là gốc rễ của quốc gia."],["这个办法只能救急，不能从根本上解决问题。","Zhège bànfǎ zhǐ néng jiùjí, bù néng cóng gēnběn shang jiějué wèntí.","Cách này chỉ giải quyết được tình thế cấp bách, không thể giải quyết vấn đề tận gốc."],["谈判还算顺利，一些根本的问题都谈好了。","Tánpàn hái suàn shùnlì, yìxiē gēnběn de wèntí dōu tánhǎo le.","Cuộc đàm phán coi như suôn sẻ, một số vấn đề then chốt đều đã bàn xong."],["政府工作应从人民的根本利益出发。","Zhèngfǔ gōngzuò yīng cóng rénmín de gēnběn lìyì chūfā.","Công việc của chính phủ phải xuất phát từ lợi ích căn bản của nhân dân."],["有时候我会梦见参加考试，可是却发现自己根本读不懂考试的题目。","Yǒu shíhou wǒ huì mèngjiàn cānjiā kǎoshì, kěshì què fāxiàn zìjǐ gēnběn dú bu dǒng kǎoshì de tímù.","Đôi khi tôi mơ thấy mình đi thi, nhưng lại phát hiện mình hoàn toàn không đọc hiểu nổi đề thi."],["可是，经过测验计算发现，以大树输送管道的尺寸产生的毛细作用，根本无法把水分送到几十米高的地方。","Kěshì, jīngguò cèyàn jìsuàn fāxiàn, yǐ dà shù shūsòng guǎndào de chǐcùn chǎnshēng de máoxì zuòyòng, gēnběn wúfǎ bǎ shuǐfèn sòngdào jǐ shí mǐ gāo de dìfang.","Thế nhưng qua kiểm tra và tính toán, người ta phát hiện ra rằng với kích thước ống dẫn của cây, hiện tượng mao dẫn hoàn toàn không thể đưa nước lên độ cao vài chục mét. <i>(bài khoá)</i>"],["事情已经根本解决了。","Shìqing yǐjīng gēnběn jiějué le.","Sự việc đã được giải quyết triệt để rồi."],["他根本就是在故意找我们的麻烦。","Tā gēnběn jiù shì zài gùyì zhǎo wǒmen de máfan.","Rõ ràng là anh ta hoàn toàn cố ý gây phiền phức cho chúng ta."]],"d":[["其实他是位盲人，____看不见你的动作。","根本"],["这个办法只能救急，不能从____上解决问题。","根本"],["他说的话____没有道理。","根本"]],"w":"Phó từ 根本 với nghĩa “tuyệt nhiên, không hề” gần như luôn đi với phủ định (不/没/无法); câu khẳng định thì 根本 mang nghĩa “triệt để, hoàn toàn” (根本解决了)."},{"id":"teshu_tebie","t":"特殊 vs 特别","s":"đặc thù vs đặc biệt","b":"<b>Điểm giống:</b> khi làm <b>tính từ</b>, cả hai đều mang nghĩa <b>khác với thông thường</b>. Ví dụ: 对我来说，他是一个特殊/特别的人。","r":["特殊: thường dùng trong văn viết (书面语)","特别: dùng được cả trong khẩu ngữ lẫn văn viết","特别 còn làm được phó từ, nghĩa là “格外” (đặc biệt, hết sức): 我特别喜欢……","特殊 không có cách dùng làm phó từ: ✗ 我特殊喜欢学中文 → ✓ 我特别喜欢学中文"],"e":[["对我来说，他是一个特殊/特别的人。","Duì wǒ lái shuō, tā shì yí ge tèshū/tèbié de rén.","Đối với tôi, anh ấy là một người đặc biệt."],["因为跟蒸腾作用有关，这种特殊的提升力就被称为“蒸腾拉力”。","Yīnwèi gēn zhēngténg zuòyòng yǒuguān, zhè zhǒng tèshū de tíshēnglì jiù bèi chēngwéi “zhēngténg lālì”.","Vì liên quan đến quá trình thoát hơi nước, lực nâng đặc biệt này được gọi là “lực kéo thoát hơi nước”. <i>(bài khoá)</i>"],["她穿衣服总是很特别。","Tā chuān yīfu zǒngshì hěn tèbié.","Cô ấy ăn mặc lúc nào cũng rất đặc biệt."],["我特别喜欢学中文，尤其是汉字。","Wǒ tèbié xǐhuan xué Zhōngwén, yóuqí shì Hànzì.","Tôi đặc biệt thích học tiếng Trung, nhất là chữ Hán."]],"d":[["这种情况比较____，我原来没见过。","特殊 / 特别"],["我喜欢北京，____是北京的秋天。","特别"],["夏天运动后在大树下坐一会儿，喝口凉开水，____舒服。","特别"]],"w":"Mẹo: đứng trước động từ/tính từ để nhấn mức độ (= 格外, 非常) thì chỉ dùng 特别; 特殊 chỉ làm tính từ và mang sắc thái văn viết."}],"ext":[["老鼠","lǎoshǔ","chuột"],["蜜蜂","mìfēng","ong mật"],["蛇","shé","rắn"],["狮子","shīzi","sư tử"],["兔子","tùzi","thỏ"],["大象","dàxiàng","voi"],["猴子","hóuzi","khỉ"],["猪","zhū","lợn"],["蝴蝶","húdié","bướm"],["昆虫","kūnchóng","côn trùng"],["小麦","xiǎomài","lúa mì"],["竹子","zhúzi","tre, trúc"],["根","gēn","rễ"],["果实","guǒshí","quả, trái"]],"extt":"动物、植物","notes":"Nguồn cuối bài khoá: 改编自《科学松鼠会》，作者：史军. Bài khoá 604 chữ, trải trên 3 trang (148–150); câu cuối “不过，这个……” tràn sang trang 150 — đã chép đủ. Bài không có 专名; bảng từ có 35 từ, dấu * ở các số 1, 8, 11, 12, 13, 20, 25, 26, 29, 30. Phần 注释 có 3 mục 词语例释 (赶快, 片, 根本) và 1 mục 词语辨析 (特殊—特别). Câu ví dụ (3) của 赶快 và (2) của 片 sách in dạng trích có “……” — giữ nguyên. Drill 赶快/片 do người soạn tự đặt dựa trên ví dụ và 练一练 của sách (练一练 là bài hoàn thành câu mở); drill 根本 lấy câu ③ 练习1 và ví dụ (2) của sách; drill 特殊/特别 lấy từ 做一做, đáp án tự giải (câu (1) sách đã đánh dấu cả hai từ đều dùng được; câu (2) người soạn cho rằng cả hai đều được). OCR có lỗi 枝千/树千 → đã sửa theo ảnh thành 枝干/树干. Nghĩa Việt của ext do người soạn bổ sung (sách chỉ in chữ Hán + pinyin). Trang sách rõ, không có chỗ mờ.","order":[{"z":"最初人们认为大树是通过毛细作用来提水的。","t":["最初","人们","认为","大树","是","通过","毛细","作用","来","提水","的"],"v":"Ban đầu người ta cho rằng cây đưa nước lên nhờ hiện tượng mao dẫn."},{"z":"玻璃管越细，水爬升的高度就越高。","t":["玻璃管","越细","水","爬升","的","高度","就","越","高"],"v":"Ống thủy tinh càng nhỏ thì nước dâng lên càng cao."},{"z":"实际上，大树利用的是枝干顶端的那些叶片。","t":["实际上","大树","利用","的","是","枝干","顶端","的","那些","叶片"],"v":"Thực ra, thứ mà cây tận dụng là những chiếc lá ở đầu cành."},{"z":"我下个月要搬家，得赶快找房子。","t":["我","下个月","要","搬家","得","赶快","找","房子"],"v":"Tháng sau tôi phải chuyển nhà rồi, phải nhanh chóng tìm nhà thôi."},{"z":"瓶子里装着满满的石头、玻璃碎片和沙子。","t":["瓶子","里装","着","满满的","石头","玻璃","碎片","和","沙子"],"v":"Trong lọ chứa đầy đá, mảnh thủy tinh vỡ và cát."},{"z":"窗外有一棵大树，秋风中，叶子一片片地掉落下来。","t":["窗外","有","一棵","大树","秋风","中","叶子","一片片","地","掉落","下来"],"v":"Ngoài cửa sổ có một cây to, trong gió thu, lá rơi xuống từng chiếc từng chiếc một."},{"z":"同学们听了，发出一片热烈的欢呼声。","t":["同学","们","听","了","发出","一片","热烈","的","欢呼声"],"v":"Các bạn nghe xong liền reo hò vang dậy."},{"z":"教育是国家的根本。","t":["教育","是","国家","的","根本"],"v":"Giáo dục là gốc rễ của quốc gia."},{"z":"这个办法只能救急，不能从根本上解决问题。","t":["这个","办法","只能","救急","不能","从根本上","解决问题"],"v":"Cách này chỉ giải quyết được tình thế cấp bách, không thể giải quyết vấn đề tận gốc."},{"z":"政府工作应从人民的根本利益出发。","t":["政府","工作","应从","人民","的","根本利益","出发"],"v":"Công việc của chính phủ phải xuất phát từ lợi ích căn bản của nhân dân."},{"z":"事情已经根本解决了。","t":["事情","已经","根本","解决","了"],"v":"Sự việc đã được giải quyết triệt để rồi."},{"z":"他根本就是在故意找我们的麻烦。","t":["他","根本就是","在","故意","找","我们","的","麻烦"],"v":"Rõ ràng là anh ta hoàn toàn cố ý gây phiền phức cho chúng ta."},{"z":"对我来说，他是一个特殊/特别的人。","t":["对","我","来说","他","是","一个","特殊","/","特别","的","人"],"v":"Đối với tôi, anh ấy là một người đặc biệt."},{"z":"她穿衣服总是很特别。","t":["她","穿衣服","总是","很","特别"],"v":"Cô ấy ăn mặc lúc nào cũng rất đặc biệt."},{"z":"我特别喜欢学中文，尤其是汉字。","t":["我","特别","喜欢","学","中文","尤其","是","汉字"],"v":"Tôi đặc biệt thích học tiếng Trung, nhất là chữ Hán."}]},"36":{"n":36,"tz":"老舍与养花","tv":"Lão Xá và hoa","batches":[[{"h":"养","p":"yǎng","v":"nuôi, trồng","k":"đgt.","x":0,"ez":"作家老舍先生爱花，他养的花很多，满满摆了一院子。","ev":"Nhà văn Lão Xá rất yêu hoa, ông trồng rất nhiều hoa, bày kín cả một khoảng sân."},{"h":"除非","p":"chúfēi","v":"trừ phi, chỉ với điều kiện là","k":"liên.","x":0,"ez":"可除非是那些好种易活、自己会奋斗的花草，否则他是不养的。","ev":"Nhưng trừ phi là những loài hoa cỏ dễ trồng, dễ sống, tự biết vươn lên, còn không thì ông không trồng."},{"h":"奋斗","p":"fèndòu","v":"phấn đấu, cố gắng","k":"đgt.","x":0,"ez":"可除非是那些好种易活、自己会奋斗的花草，否则他是不养的。","ev":"Nhưng trừ phi là những loài hoa cỏ dễ trồng, dễ sống, tự biết vươn lên, còn không thì ông không trồng."},{"h":"乐趣","p":"lèqù","v":"niềm vui","k":"dt.","x":1,"ez":"老舍把养花当作一种生活乐趣。","ev":"Lão Xá coi việc trồng hoa là một niềm vui trong cuộc sống."},{"h":"在乎","p":"zàihu","v":"để ý đến, quan tâm đến","k":"đgt.","x":0,"ez":"他不在乎花开得大小好坏，只要开花，他就高兴。","ev":"Ông chẳng bận tâm hoa nở to hay nhỏ, đẹp hay xấu, chỉ cần hoa nở là ông vui."},{"h":"朵","p":"duǒ","v":"đóa, đám","k":"lượng.","x":0,"ez":"瞧瞧这棵，看看那朵。","ev":"Ngắm cây này một chút, nhìn bông kia một chút."},{"h":"剪刀","p":"jiǎndāo","v":"cái kéo","k":"dt.","x":0,"ez":"有时拿起剪刀给它们剪剪枝。","ev":"Có lúc ông cầm kéo tỉa cành cho chúng."},{"h":"捡","p":"jiǎn","v":"nhặt, lượm","k":"đgt.","x":0,"ez":"有时蹲下捡几块小石头放在花盆里做点儿装饰。","ev":"Có lúc ông ngồi xuống nhặt mấy hòn sỏi nhỏ bỏ vào chậu hoa để trang trí một chút."},{"h":"装饰","p":"zhuāngshì","v":"sự trang hoàng, đồ trang trí","k":"dt.","x":0,"ez":"有时蹲下捡几块小石头放在花盆里做点儿装饰。","ev":"Có lúc ông ngồi xuống nhặt mấy hòn sỏi nhỏ bỏ vào chậu hoa để trang trí một chút."},{"h":"结合","p":"jiéhé","v":"kết hợp","k":"đgt.","x":0,"ez":"就这样脑力和体力很好地结合，身心也得到放松。","ev":"Cứ thế, lao động trí óc và chân tay được kết hợp nhịp nhàng, cả thân lẫn tâm đều được thư giãn."},{"h":"老舍","p":"Lǎo Shě","v":"Lão Xá (1899 - 1966) (bút danh của nhà văn Trung Quốc – Thư Khánh ớt thì đừng để ngoài nắng."},{"h":"施肥","p":"shī féi","v":"bón phân","k":"đgt.","x":1,"ez":"给花换盆剪枝施肥的活儿他越做越熟练。","ev":"Những việc như thay chậu, tỉa cành, bón phân cho hoa, ông càng làm càng thuần thục."},{"h":"熟练","p":"shúliàn","v":"thuần thục, thông thạo","k":"tt.","x":0,"ez":"给花换盆剪枝施肥的活儿他越做越熟练。","ev":"Những việc như thay chậu, tỉa cành, bón phân cho hoa, ông càng làm càng thuần thục."},{"h":"应付","p":"yìngfu","v":"ứng phó, đối phó","k":"đgt.","x":0,"ez":"花生病长虫他也知道如何应付了。","ev":"Hoa bị bệnh hay sâu bọ, ông cũng biết cách xử trí rồi."},{"h":"鲜艳","p":"xiānyàn","v":"tươi đẹp","k":"tt.","x":0,"ez":"看着院子里那鲜艳的花朵，老舍自豪地说……","ev":"Ngắm những bông hoa rực rỡ trong sân, Lão Xá tự hào nói…"},{"h":"自豪","p":"zìháo","v":"tự hào, hãnh diện","k":"tt.","x":0,"ez":"看着院子里那鲜艳的花朵，老舍自豪地说……","ev":"Ngắm những bông hoa rực rỡ trong sân, Lão Xá tự hào nói…"},{"h":"吹","p":"chuī","v":"khoe khoang, khoác lác","k":"đgt.","x":0,"ez":"不是乱吹，这就是知识啊！","ev":"Không phải tôi khoác lác đâu, đây chính là kiến thức đấy!"},{"h":"爱心","p":"àixīn","v":"lòng yêu thương, lòng trắc ẩn","k":"dt.","x":0,"ez":"老舍很有爱心，更懂得快乐要分享。","ev":"Lão Xá là người giàu lòng yêu thương, lại càng hiểu rằng niềm vui cần được sẻ chia."},{"h":"分享","p":"fēnxiǎng","v":"chia sẻ","k":"đgt.","x":1,"ez":"老舍很有爱心，更懂得快乐要分享。","ev":"Lão Xá là người giàu lòng yêu thương, lại càng hiểu rằng niềm vui cần được sẻ chia."},{"h":"昙花","p":"tánhuā","v":"hoa quỳnh","k":"dt.","x":1,"ez":"每到昙花开放的时候，他就约上几位朋友来家里赏花庆祝。","ev":"Mỗi khi hoa quỳnh nở, ông lại hẹn mấy người bạn đến nhà ngắm hoa ăn mừng."},{"h":"庆祝","p":"qìngzhù","v":"chúc mừng","k":"đgt.","x":0,"ez":"每到昙花开放的时候，他就约上几位朋友来家里赏花庆祝。","ev":"Mỗi khi hoa quỳnh nở, ông lại hẹn mấy người bạn đến nhà ngắm hoa ăn mừng."},{"h":"保留","p":"bǎoliú","v":"giữ lại, để lại, bảo tồn","k":"đgt.","x":0,"ez":"花分根了，一棵分为几棵，他会毫无保留地送给朋友们。","ev":"Hoa đâm nhánh, một cây tách thành mấy cây, ông sẵn lòng đem tặng bạn bè không giữ lại gì."},{"h":"菊花","p":"júhuā","v":"cây hoa cúc, hoa cúc","k":"dt.","x":1,"ez":"菊花被砸死了一百多棵。","ev":"Hơn một trăm cây hoa cúc bị đè chết."},{"h":"砸","p":"zá","v":"đè nát, đè bẹp, đập","k":"đgt.","x":1,"ez":"菊花被砸死了一百多棵。","ev":"Hơn một trăm cây hoa cúc bị đè chết."},{"h":"悲（伤）","p":"bēi (shāng)","v":"đau khổ, buồn phiền","k":"tt.","x":0,"ez":"“有喜有悲，有笑有泪”，这是老舍对养花、对生活的体验。","ev":"“Có vui có buồn, có cười có nước mắt” – đó là trải nghiệm của Lão Xá về việc trồng hoa và về cuộc sống."},{"h":"反正","p":"fǎnzhèng","v":"(được dùng để chỉ kết quả như nhau bất chấp các tình huống khác nhau) dù sao cũng, dù thế nào đi nữa (cũng)","k":"phó.","x":0,"ez":"我不知道花草们受我的照顾，感谢我不感谢，反正我要感谢它们。","ev":"Tôi chẳng biết hoa cỏ được tôi chăm sóc có cảm ơn tôi hay không, nhưng dù sao tôi cũng phải cảm ơn chúng."},{"h":"热爱","p":"rè'ài","v":"yêu tha thiết","k":"đgt.","x":0,"ez":"从中我们不难看出老舍先生对大自然的热爱，对生活的热爱。","ev":"Qua đó, chúng ta dễ dàng nhận ra tình yêu tha thiết của Lão Xá dành cho thiên nhiên và cuộc sống."}]],"texts":[{"no":1,"tz":"","tv":"","lines":[{"s":"","z":"作家老舍先生爱花，他养的花很多，满满摆了一院子。","p":"Zuòjiā Lǎo Shě xiānsheng ài huā, tā yǎng de huā hěn duō, mǎnmǎn bǎile yí yuànzi.","v":"Nhà văn Lão Xá rất yêu hoa, ông trồng rất nhiều hoa, bày kín cả một khoảng sân.","b":0},{"s":"","z":"可除非是那些好种易活、自己会奋斗的花草，否则他是不养的。","p":"Kě chúfēi shì nàxiē hǎo zhòng yì huó, zìjǐ huì fèndòu de huācǎo, fǒuzé tā shì bù yǎng de.","v":"Nhưng trừ phi là những loài hoa cỏ dễ trồng, dễ sống, tự biết vươn lên, còn không thì ông không trồng.","b":0},{"s":"","z":"因为他知道北京的气候对养花来说，不算很好，想把南方的名花养活并非易事。","p":"Yīnwèi tā zhīdào Běijīng de qìhòu duì yǎng huā lái shuō, bú suàn hěn hǎo, xiǎng bǎ nánfāng de mínghuā yǎnghuó bìngfēi yì shì.","v":"Bởi ông biết khí hậu Bắc Kinh không mấy thuận lợi cho việc trồng hoa, muốn nuôi sống những loài hoa nổi tiếng phương Nam đâu phải chuyện dễ.","b":0},{"s":"","z":"老舍把养花当作一种生活乐趣。","p":"Lǎo Shě bǎ yǎng huā dàngzuò yì zhǒng shēnghuó lèqù.","v":"Lão Xá coi việc trồng hoa là một niềm vui trong cuộc sống.","b":0},{"s":"","z":"他不在乎花开得大小好坏，只要开花，他就高兴。","p":"Tā bú zàihu huā kāi de dàxiǎo hǎohuài, zhǐyào kāi huā, tā jiù gāoxìng.","v":"Ông chẳng bận tâm hoa nở to hay nhỏ, đẹp hay xấu, chỉ cần hoa nở là ông vui.","b":0},{"s":"","z":"每天老舍像好朋友似的照管着花草。","p":"Měi tiān Lǎo Shě xiàng hǎo péngyou shìde zhàoguǎnzhe huācǎo.","v":"Ngày nào Lão Xá cũng chăm nom hoa cỏ như chăm sóc những người bạn thân.","b":0},{"s":"","z":"工作的时候，经常写几十个字，就到院中去转转，瞧瞧这棵，看看那朵，有时拿起剪刀给它们剪剪枝，有时蹲下捡几块小石头放在花盆里做点儿装饰，然后回到屋中再写一会儿，然后再出去，就这样脑力和体力很好地结合，身心也得到放松。","p":"Gōngzuò de shíhou, jīngcháng xiě jǐ shí ge zì, jiù dào yuàn zhōng qù zhuànzhuan, qiáoqiao zhè kē, kànkan nà duǒ, yǒushí náqǐ jiǎndāo gěi tāmen jiǎnjian zhī, yǒushí dūnxia jiǎn jǐ kuài xiǎo shítou fàng zài huāpén li zuò diǎnr zhuāngshì, ránhòu huídào wū zhōng zài xiě yíhuìr, ránhòu zài chūqu, jiù zhèyàng nǎolì hé tǐlì hěn hǎo de jiéhé, shēnxīn yě dédào fàngsōng.","v":"Lúc làm việc, ông thường viết được vài chục chữ lại ra sân đi dạo một vòng, ngắm cây này, nhìn bông kia, có lúc cầm kéo tỉa cành cho chúng, có lúc ngồi xuống nhặt mấy hòn sỏi nhỏ bỏ vào chậu trang trí, rồi lại vào nhà viết thêm một lúc, sau đó lại ra ngoài; cứ thế lao động trí óc và chân tay được kết hợp nhịp nhàng, cả thân lẫn tâm đều được thư giãn.","b":0},{"s":"","z":"写作是件艰苦的工作，养花也是如此。","p":"Xiězuò shì jiàn jiānkǔ de gōngzuò, yǎng huā yě shì rúcǐ.","v":"Viết văn là công việc vất vả, trồng hoa cũng vậy.","b":1},{"s":"","z":"有时赶上狂风暴雨，情况紧急，他就得劳驾全家人抢救花草。","p":"Yǒushí gǎnshang kuángfēng bàoyǔ, qíngkuàng jǐnjí, tā jiù děi láojià quánjiā rén qiǎngjiù huācǎo.","v":"Có khi gặp phải mưa to gió lớn, tình hình khẩn cấp, ông phải phiền cả nhà ra cứu hoa.","b":0},{"s":"","z":"几百盆花，要很快地抢到屋里去，累得腰酸腿疼，热汗直流。","p":"Jǐ bǎi pén huā, yào hěn kuài de qiǎngdào wū li qù, lèi de yāo suān tuǐ téng, rè hàn zhí liú.","v":"Mấy trăm chậu hoa phải nhanh chóng khuân vào nhà, mệt đến mỏi lưng đau chân, mồ hôi nhễ nhại.","b":0},{"s":"","z":"第二天，天气好了，又得一盆盆地搬出去。","p":"Dì-èr tiān, tiānqì hǎo le, yòu děi yì pénpén de bān chūqu.","v":"Hôm sau trời đẹp, lại phải bê từng chậu một ra ngoài.","b":0},{"s":"","z":"可是，他并不抱怨，在他看来，任何事都要有付出，不然怎么会有回报？","p":"Kěshì, tā bìng bú bàoyuàn, zài tā kànlái, rènhé shì dōu yào yǒu fùchū, bùrán zěnme huì yǒu huíbào?","v":"Nhưng ông chẳng hề than phiền; theo ông, việc gì cũng phải bỏ công sức, nếu không thì làm sao có được đền đáp?","b":0},{"s":"","z":"这是生活的真理。","p":"Zhè shì shēnghuó de zhēnlǐ.","v":"Đó là chân lý của cuộc sống.","b":0},{"s":"","z":"一来二去，他慢慢地总结出一些养花的经验：有的花喜干，就别多浇水；","p":"Yì lái èr qù, tā mànmàn de zǒngjié chū yìxiē yǎng huā de jīngyàn: yǒude huā xǐ gān, jiù bié duō jiāo shuǐ;","v":"Lâu dần, ông đúc kết được một số kinh nghiệm trồng hoa: có loài hoa ưa khô thì đừng tưới nhiều nước;","b":0},{"s":"","z":"有的花喜欢潮湿的环境，就别放在太阳地里。","p":"yǒude huā xǐhuan cháoshī de huánjìng, jiù bié fàng zài tàiyáng dì li.","v":"có loài hoa thích môi trường ẩm ướt thì đừng để ngoài nắng.","b":0},{"s":"","z":"给花换盆剪枝施肥的活儿他越做越熟练，花生病长虫他也知道如何应付了。","p":"Gěi huā huàn pén jiǎn zhī shī féi de huór tā yuè zuò yuè shúliàn, huā shēng bìng zhǎng chóng tā yě zhīdào rúhé yìngfu le.","v":"Những việc như thay chậu, tỉa cành, bón phân cho hoa, ông càng làm càng thuần thục; hoa bị bệnh hay sâu bọ, ông cũng biết cách xử trí rồi.","b":0},{"s":"","z":"看着院子里那鲜艳的花朵，老舍自豪地说，“不是乱吹，这就是知识啊！","p":"Kànzhe yuànzi li nà xiānyàn de huāduǒ, Lǎo Shě zìháo de shuō, “Bú shì luàn chuī, zhè jiù shì zhīshi a!","v":"Ngắm những bông hoa rực rỡ trong sân, Lão Xá tự hào nói: “Không phải tôi khoác lác đâu, đây chính là kiến thức đấy!","b":0},{"s":"","z":"多得些知识，一定不是坏事。”","p":"Duō dé xiē zhīshi, yídìng bú shì huàishì.”","v":"Biết thêm chút kiến thức thì chắc chắn chẳng phải chuyện xấu.”","b":0},{"s":"","z":"老舍很有爱心，更懂得快乐要分享。","p":"Lǎo Shě hěn yǒu àixīn, gèng dǒngde kuàilè yào fēnxiǎng.","v":"Lão Xá là người giàu lòng yêu thương, lại càng hiểu rằng niềm vui cần được sẻ chia.","b":1},{"s":"","z":"每到昙花开放的时候，他就约上几位朋友来家里赏花庆祝。","p":"Měi dào tánhuā kāifàng de shíhou, tā jiù yuēshang jǐ wèi péngyou lái jiā li shǎng huā qìngzhù.","v":"Mỗi khi hoa quỳnh nở, ông lại hẹn mấy người bạn đến nhà ngắm hoa ăn mừng.","b":0},{"s":"","z":"花分根了，一棵分为几棵，他会毫无保留地送给朋友们。","p":"Huā fēn gēn le, yì kē fēnwéi jǐ kē, tā huì háo wú bǎoliú de sònggěi péngyoumen.","v":"Hoa đâm nhánh, một cây tách thành mấy cây, ông sẵn lòng đem tặng bạn bè không giữ lại gì.","b":0},{"s":"","z":"看着友人高兴地拿走自己的劳动果实，老舍心里十分欢喜。","p":"Kànzhe yǒurén gāoxìng de názǒu zìjǐ de láodòng guǒshí, Lǎo Shě xīnli shífēn huānxǐ.","v":"Nhìn bạn bè vui vẻ mang về thành quả lao động của mình, Lão Xá vô cùng hạnh phúc.","b":0},{"s":"","z":"有一次，送牛奶的小伙子进门就夸“好香”！","p":"Yǒu yí cì, sòng niúnǎi de xiǎohuǒzi jìn mén jiù kuā “hǎo xiāng”!","v":"Có lần, anh chàng giao sữa vừa bước vào cửa đã khen: “Thơm quá!”","b":0},{"s":"","z":"这让老舍先生感到格外高兴。","p":"Zhè ràng Lǎo Shě xiānsheng gǎndào géwài gāoxìng.","v":"Điều đó khiến Lão Xá vui đặc biệt.","b":0},{"s":"","z":"当然，也有伤心的时候。","p":"Dāngrán, yě yǒu shāngxīn de shíhou.","v":"Tất nhiên cũng có lúc đau lòng.","b":0},{"s":"","z":"一年夏天，下了暴雨，邻居家的墙倒了，菊花被砸死了一百多棵，这下可把老舍难受坏了，一连几天人们都看不到他脸上的笑容。","p":"Yì nián xiàtiān, xiàle bàoyǔ, línjū jiā de qiáng dǎo le, júhuā bèi zásǐle yìbǎi duō kē, zhè xià kě bǎ Lǎo Shě nánshòu huài le, yìlián jǐ tiān rénmen dōu kàn bu dào tā liǎn shang de xiàoróng.","v":"Một mùa hè nọ, trời đổ mưa to, bức tường nhà hàng xóm đổ sập, đè chết hơn một trăm cây hoa cúc; lần này Lão Xá buồn rầu vô cùng, mấy ngày liền chẳng ai thấy nụ cười trên gương mặt ông.","b":0},{"s":"","z":"“有喜有悲，有笑有泪”，这是老舍对养花、对生活的体验。","p":"“Yǒu xǐ yǒu bēi, yǒu xiào yǒu lèi”, zhè shì Lǎo Shě duì yǎng huā, duì shēnghuó de tǐyàn.","v":"“Có vui có buồn, có cười có nước mắt” – đó là trải nghiệm của Lão Xá về việc trồng hoa và về cuộc sống.","b":0},{"s":"","z":"“我不知道花草们受我的照顾，感谢我不感谢，反正我要感谢它们。”","p":"“Wǒ bù zhīdào huācǎomen shòu wǒ de zhàogù, gǎnxiè wǒ bù gǎnxiè, fǎnzhèng wǒ yào gǎnxiè tāmen.”","v":"“Tôi chẳng biết hoa cỏ được tôi chăm sóc có cảm ơn tôi hay không, nhưng dù sao tôi cũng phải cảm ơn chúng.”","b":0},{"s":"","z":"老舍在自己的文章中这样写道。","p":"Lǎo Shě zài zìjǐ de wénzhāng zhōng zhèyàng xiědào.","v":"Lão Xá đã viết như vậy trong bài văn của mình.","b":0},{"s":"","z":"从中我们不难看出老舍先生对大自然的热爱，对生活的热爱。","p":"Cóngzhōng wǒmen bù nán kànchū Lǎo Shě xiānsheng duì dàzìrán de rè'ài, duì shēnghuó de rè'ài.","v":"Qua đó, chúng ta dễ dàng nhận ra tình yêu tha thiết của Lão Xá dành cho thiên nhiên và cuộc sống.","b":0}]}],"aud":[{"v":"audio/36-2.mp3","t":"audio/36-1.mp3"}],"gram":[{"id":"chufei","t":"除非","s":"trừ phi, chỉ khi (liên từ); ngoài… ra (giới từ)","b":"<b>除非</b> là <b>liên từ</b>, biểu thị <b>điều kiện duy nhất</b>, tương đương <b>只有</b> (chỉ khi); vế sau thường dùng kèm <b>才、否则、不然</b>. Ngoài ra 除非 còn là <b>giới từ</b>, biểu thị <b>không tính vào</b>, tương đương <b>除了</b> (ngoài… ra).","r":["Liên từ: 除非 + điều kiện duy nhất，(chủ ngữ) + 才 + kết quả (除非急需一大笔钱，我才会考虑……)","Liên từ: 除非 + điều kiện，否则/不然 + kết quả ngược lại (除非是……的花草，否则他是不养的)","Giới từ: 除非 + người/việc，没人/从来不…… = ngoài… ra thì không (除非李阳，没人修得好)"],"e":[["可除非是那些好种易活、自己会奋斗的花草，否则他是不养的。","Kě chúfēi shì nàxiē hǎo zhòng yì huó, zìjǐ huì fèndòu de huācǎo, fǒuzé tā shì bù yǎng de.","Nhưng trừ phi là những loài hoa cỏ dễ trồng, dễ sống, tự biết vươn lên, còn không thì ông không trồng. <i>(bài khoá)</i>"],["除非急需一大笔钱，我才会考虑卖了这房子。","Chúfēi jíxū yí dà bǐ qián, wǒ cái huì kǎolǜ màile zhè fángzi.","Chỉ khi cần gấp một khoản tiền lớn, tôi mới tính đến chuyện bán căn nhà này."],["这种机器，除非李阳，没人修得好。","Zhè zhǒng jīqì, chúfēi Lǐ Yáng, méi rén xiū de hǎo.","Loại máy này, ngoài Lý Dương ra thì chẳng ai sửa được."],["日常工作他从来不过问，除非极特殊的问题。","Rìcháng gōngzuò tā cónglái bú guòwèn, chúfēi jí tèshū de wèntí.","Công việc thường ngày anh ấy chẳng bao giờ hỏi tới, trừ những vấn đề cực kỳ đặc biệt."]],"d":[["____急需一大笔钱，我才会考虑卖了这房子。","除非"],["这种机器，____李阳，没人修得好。","除非"],["他工作时不喜欢别人打扰，____有急事，否则别人的电话他都不接。","除非"]],"w":"Liên từ 除非 hay đi theo cặp 除非……才…… / 除非……否则(不然)……; đừng bỏ 才/否则 ở vế sau khi dùng nghĩa điều kiện."},{"id":"zhi","t":"直","s":"thẳng; liên tục, không ngừng (phó từ)","b":"<b>直</b> làm <b>phó từ</b> có hai cách dùng: (1) biểu thị <b>một mạch, thẳng, trực tiếp</b> (一直、径直、直接), theo sau là <b>động từ đơn âm tiết</b>; (2) biểu thị động tác, hành vi diễn ra <b>liên tục, không ngừng</b>.","r":["Thẳng, trực tiếp: 直 + động từ đơn âm tiết (直达, 直到, 直走)","Liên tục không ngừng: 直 + động từ (气得直发抖, 热汗直流, 直摇头, 直响)"],"e":[["这趟车可以直达北京，非常方便。","Zhè tàng chē kěyǐ zhídá Běijīng, fēicháng fāngbiàn.","Chuyến xe này chạy thẳng tới Bắc Kinh, rất tiện."],["直到今天，我也不明白他当时为什么发那么大脾气。","Zhídào jīntiān, wǒ yě bù míngbai tā dāngshí wèi shénme fā nàme dà píqi.","Cho đến tận hôm nay, tôi vẫn không hiểu sao lúc ấy anh ta lại nổi giận đến thế."],["父亲听说儿子卖了房子，气得直发抖。","Fùqin tīngshuō érzi màile fángzi, qì de zhí fādǒu.","Nghe tin con trai bán nhà, người cha tức đến run bần bật."],["几百盆花，要很快地抢到屋里去，累得腰酸腿疼，热汗直流。","Jǐ bǎi pén huā, yào hěn kuài de qiǎngdào wū li qù, lèi de yāo suān tuǐ téng, rè hàn zhí liú.","Mấy trăm chậu hoa phải nhanh chóng khuân vào nhà, mệt đến mỏi lưng đau chân, mồ hôi nhễ nhại. <i>(bài khoá)</i>"]],"d":[["他朝我____摇头，我故意装作没看见。","直"],["参观者乘电梯可以____达大楼顶层的观光餐厅。","直"],["早晨6点，闹钟在我头上____响，我真不想起床。","直"],["司机师傅，前边路口____走，别拐弯。","直"]],"w":"Phân biệt theo nghĩa (练一练 của sách: A. trực tiếp / B. liên tục): 直摇头 (B), 直达 (A), 直响 (B), 直走 (A)."},{"id":"fanzheng","t":"反正","s":"dù sao, đằng nào cũng (phó từ)","b":"<b>反正</b> là <b>phó từ</b>, biểu thị <b>tình huống tuy khác nhau nhưng kết quả không có gì khác biệt</b> (dù thế nào thì cũng…). Ngoài ra 反正 còn biểu thị <b>ngữ khí khẳng định dứt khoát</b>.","r":["Kết quả không đổi: 不管/无论……，反正…… hoặc A不A，反正…… (感谢我不感谢，反正我要感谢它们)","Khẳng định dứt khoát: 反正 + nhận định/quyết định (反正我是不会考虑的; 反正不是什么要紧事)","Vị trí: đứng đầu vế sau, trước hoặc sau chủ ngữ"],"e":[["不管你们谁去，反正我不会去。","Bùguǎn nǐmen shéi qù, fǎnzhèng wǒ bú huì qù.","Dù các cậu ai đi thì đằng nào tôi cũng không đi."],["我不知道花草们受我的照顾，感谢我不感谢，反正我要感谢它们。","Wǒ bù zhīdào huācǎomen shòu wǒ de zhàogù, gǎnxiè wǒ bù gǎnxiè, fǎnzhèng wǒ yào gǎnxiè tāmen.","Tôi chẳng biết hoa cỏ được tôi chăm sóc có cảm ơn tôi hay không, nhưng dù sao tôi cũng phải cảm ơn chúng. <i>(bài khoá)</i>"],["你别再说了，反正我是不会考虑的。","Nǐ bié zài shuō le, fǎnzhèng wǒ shì bú huì kǎolǜ de.","Cậu đừng nói nữa, đằng nào tôi cũng sẽ không cân nhắc đâu."],["算了，反正不是什么要紧事，还是别打扰他们了。","Suàn le, fǎnzhèng bú shì shénme yàojǐn shì, háishi bié dǎrǎo tāmen le.","Thôi, dù sao cũng chẳng phải chuyện gì quan trọng, đừng làm phiền họ nữa."]],"d":[["不管你们谁去，____我不会去。","反正"],["你别再说了，____我是不会考虑的。","反正"],["算了，____不是什么要紧事，还是别打扰他们了。","反正"]],"w":"反正 thường đi với 不管/无论 hoặc cấu trúc A不A ở vế trước; không dùng để nối hai vế nhân quả thông thường."},{"id":"yingfu_chuli","t":"应付 vs 处理","s":"phân biệt hai động từ đối phó / xử lý","b":"Điểm giống: <b>应付</b> và <b>处理</b> đều là <b>động từ</b>, đều có nghĩa <b>áp dụng biện pháp, cách thức đối với người hoặc việc</b>. Ví dụ: 依我看，以他现有的经验应付/处理不了目前的工作。","r":["应付 nhấn mạnh <b>dùng cách thích hợp để đối phó</b> với người hoặc việc; 处理 nhấn mạnh <b>giải quyết vấn đề</b>.","应付 còn có nghĩa <b>làm qua loa, không nghiêm túc, không có trách nhiệm, chỉ cốt bề ngoài cho xong</b>; 处理 không có nghĩa này.","处理 còn có nghĩa <b>sắp xếp, xử lý (đồ vật)</b>; 应付 không có nghĩa này.","处理 còn có nghĩa <b>hạ giá bán</b> (减价处理); 应付 không có nghĩa này."],"e":[["依我看，以他现有的经验应付/处理不了目前的工作。","Yī wǒ kàn, yǐ tā xiànyǒu de jīngyàn yìngfu/chǔlǐ bu liǎo mùqián de gōngzuò.","Theo tôi, với kinh nghiệm hiện có, anh ta không kham nổi công việc trước mắt."],["他们会想方设法说服你，你准备好怎么应付他们了吗？","Tāmen huì xiǎngfāng-shèfǎ shuōfú nǐ, nǐ zhǔnbèi hǎo zěnme yìngfu tāmen le ma?","Họ sẽ tìm đủ mọi cách thuyết phục cậu, cậu đã chuẩn bị cách đối phó với họ chưa?"],["严重的环境污染使人们深思该如何处理好人与自然的关系。","Yánzhòng de huánjìng wūrǎn shǐ rénmen shēnsī gāi rúhé chǔlǐ hǎo rén yǔ zìrán de guānxi.","Ô nhiễm môi trường nghiêm trọng khiến con người phải suy nghĩ sâu sắc về cách giải quyết tốt mối quan hệ giữa con người và tự nhiên."],["小林学习不认真，完全是在应付父母和老师。","Xiǎo Lín xuéxí bú rènzhēn, wánquán shì zài yìngfu fùmǔ hé lǎoshī.","Tiểu Lâm học hành không nghiêm túc, hoàn toàn chỉ học cho có với bố mẹ và thầy cô."],["洗衣机的包装纸箱，既占地方又没什么用，快处理了吧。","Xǐyījī de bāozhuāng zhǐxiāng, jì zhà const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const LS=Object.keys(D).map(Number).sort((a,b)=>a-b);
let cur=LS[0], mode='lesson';
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const norm=s=>s.toLowerCase().trim().replace(/\s+/g,' ');
const strip=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'').toLowerCase();
const allWords=l=>D[l].batches.flat();
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));

// Mỗi bài: audio/NN-2.mp3 = đọc từ mới, audio/NN-1.mp3 = đọc bài khoá (bài 7: 07-1…07-4).
// Thiếu file thì khung hiện chỗ để chọn file nghe từ máy.
let AUDRATE=1; try{AUDRATE=+localStorage.getItem('hsk5audrate')||1}catch(e){}
function audioBox(src,label){
  const id='au'+Math.random().toString(36).slice(2,8);
  return `<div class="aud" id="${id}"><div class="audh"><span class="audl">${label}</span>
      <span class="audf">Giáo trình · ${src.replace('audio/','')}</span></div>
    <audio controls preload="metadata" src="${src}" onerror="audErr('${id}')" onloadedmetadata="this.playbackRate=AUDRATE"></audio>
    <div class="audx" hidden>Chưa có file <code>${src}</code>. Đặt file nghe vào thư mục <code>audio/</code> cạnh <code>index.html</code>,
      hoặc chọn file từ máy để nghe ngay: <input type="file" accept="audio/*" onchange="audLocal('${id}',this)"></div>
    <div class="speed">${[0.75,0.9,1,1.25].map(r=>`<button type="button" class="chip ${r===AUDRATE?'on':''}" onclick="audRate('${id}',${r},this)">${r}×</button>`).join('')}</div></div>`;
}
function audErr(id){const b=$('#'+id); if(!b)return; b.querySelector('.audx').hidden=false; b.querySelector('audio').hidden=true; b.querySelector('.speed').hidden=true}
function audLocal(id,inp){const f=inp.files&&inp.files[0]; if(!f)return; const b=$('#'+id), a=b.querySelector('audio');
  a.onerror=null; a.src=URL.createObjectURL(f); a.hidden=false; b.querySelector('.speed').hidden=false; b.querySelector('.audx').hidden=true; a.play().catch(()=>{})}
function audRate(id,r,el){AUDRATE=r; try{localStorage.setItem('hsk5audrate',r)}catch(e){}
  $$('audio').forEach(a=>a.playbackRate=r); $$('.speed .chip').forEach(c=>c.classList.toggle('on',c.textContent===r+'×'))}
function stopAudio(){$$('audio').forEach(a=>{try{a.pause()}catch(e){}})}
