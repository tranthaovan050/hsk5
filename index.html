"dt.","x":0,"ez":"有一位工程师甚至专门制造出一种机器，在下面一拉篮筐就能把球弹出来。","ev":"Thậm chí có một kỹ sư còn chế tạo riêng một loại máy, chỉ cần đứng bên dưới giật một cái là giỏ bật bóng ra. <i>(bài khoá)</i>"},{"h":"机器","p":"jīqì","v":"máy móc","k":"dt.","x":0,"ez":"有一位工程师甚至专门制造出一种机器，在下面一拉篮筐就能把球弹出来。","ev":"Thậm chí có một kỹ sư còn chế tạo riêng một loại máy, chỉ cần đứng bên dưới giật một cái là giỏ bật bóng ra. <i>(bài khoá)</i>"},{"h":"顺畅","p":"shùnchàng","v":"trôi chảy","k":"tt.","x":1,"ez":"可是，这些办法都没能让比赛顺畅起来。","ev":"Thế nhưng không cách nào trong số đó giúp trận đấu diễn ra trôi chảy được. <i>(bài khoá)</i>"},{"h":"幼儿园","p":"yòu'éryuán","v":"nhà trẻ","k":"dt.","x":0,"ez":"几年后的一天，一个上幼儿园的小男孩跟着父亲从一群正在进行篮球比赛的人旁边经过。","ev":"Một ngày vài năm sau, một cậu bé đang học mẫu giáo theo bố đi ngang qua một nhóm người đang chơi bóng rổ. <i>(bài khoá)</i>"},{"h":"好奇","p":"hàoqí","v":"hiếu kỳ, tò mò","k":"tt.","x":0,"ez":"看到大人们一次次辛苦地取球，小男孩好奇地问父亲：“何必这么麻烦呢？把篮筐的底去掉不就行了吗？”","ev":"Thấy người lớn hết lần này đến lần khác vất vả lấy bóng, cậu bé tò mò hỏi bố: “Sao phải phiền phức thế ạ? Bỏ đáy giỏ đi chẳng phải là xong sao?” <i>(bài khoá)</i>"},{"h":"何必","p":"hébì","v":"(chỉ sự không cần) hà tất, cần gì","k":"phó.","x":0,"ez":"食堂楼下就有个小超市，何必去学校外边呢？","ev":"Ngay dưới nhà ăn đã có một siêu thị nhỏ, cần gì phải ra tận ngoài trường?"},{"h":"多亏","p":"duōkuī","v":"may mà (có), nhờ có","k":"đgt.","x":0,"ez":"今天搬家多亏有你在，你可帮我大忙了。","ev":"Hôm nay chuyển nhà may mà có cậu, cậu đúng là giúp tớ một việc lớn."},{"h":"连忙","p":"liánmáng","v":"ngay lập tức","k":"phó.","x":0,"ez":"一觉醒来发现已经8点多了，李阳连忙穿好衣服往公司赶。","ev":"Tỉnh dậy thấy đã hơn 8 giờ, Lý Dương vội vàng mặc quần áo rồi chạy đến công ty."},{"h":"瞧","p":"qiáo","v":"nhìn","k":"đgt.","x":0,"ez":"你瞧，困扰人们很长时间的取球问题就这样被一个小孩子解决了。","ev":"Bạn xem, chuyện lấy bóng làm khổ mọi người bấy lâu nay đã được một đứa trẻ giải quyết như thế đấy. <i>(bài khoá)</i>"},{"h":"困扰","p":"kùnrǎo","v":"làm phiền, gây rối","k":"đgt.","x":1,"ez":"你瞧，困扰人们很长时间的取球问题就这样被一个小孩子解决了。","ev":"Bạn xem, chuyện lấy bóng làm khổ mọi người bấy lâu nay đã được một đứa trẻ giải quyết như thế đấy. <i>(bài khoá)</i>"},{"h":"思维","p":"sīwéi","v":"tư duy; suy nghĩ","k":"dt./đgt.","x":1,"ez":"说白了，因为我们的思维像篮球一样被篮筐的底挡在了半空中。","ev":"Nói trắng ra là vì tư duy của chúng ta cũng giống quả bóng, bị đáy giỏ chặn lại lơ lửng giữa không trung. <i>(bài khoá)</i>"},{"h":"呆","p":"dāi","v":"đần độn, ngu ngốc; nán lại, ở lại","k":"tt./đgt.","x":0,"ez":"于是，我们呆呆地去搬梯子、造机器……","ev":"Thế là chúng ta cứ ngây ngô đi khiêng thang, chế tạo máy móc… <i>(bài khoá)</i>"},{"h":"造成","p":"zàochéng","v":"tạo thành, gây ra","k":"đgt.","x":0,"ez":"每天大量饮酒确实给我的身体健康造成了很大的伤害。","ev":"Ngày nào cũng uống nhiều rượu quả thật đã gây hại rất lớn cho sức khỏe của tôi."},{"h":"仿佛","p":"fǎngfú","v":"dường như; giống như","k":"phó./đgt.","x":0,"ez":"他一边听，一边在本子上记着什么，仿佛对我的发言挺感兴趣似的。","ev":"Anh ấy vừa nghe vừa ghi chép gì đó vào sổ, dường như khá hứng thú với bài phát biểu của tôi."},{"h":"阻碍","p":"zǔ'ài","v":"ngăn cản, cản trở","k":"đgt.","x":1,"ez":"生活仿佛篮筐，许多时候，我们需要的只不过是一把锯子，来锯掉那些阻碍我们的“筐底”。","ev":"Cuộc sống giống như chiếc giỏ bóng, nhiều khi thứ chúng ta cần chẳng qua chỉ là một cái cưa để cưa bỏ những “đáy giỏ” đang cản trở mình. <i>(bài khoá)</i>"}]],"texts":[{"no":1,"tz":"","tv":"","lines":[{"s":"","z":"篮球运动是1891年由美国马萨诸塞州的体育教师詹姆士·奈史密斯博士发明的。","p":"Lánqiú yùndòng shì 1891 nián yóu Měiguó Mǎsàzhūsài Zhōu de tǐyù jiàoshī Zhānmǔshì·Nàishǐmìsī bóshì fāmíng de.","v":"Môn bóng rổ do tiến sĩ James Naismith, một giáo viên thể dục ở bang Massachusetts (Mỹ), phát minh vào năm 1891.","b":0},{"s":"","z":"那年的冬天特别冷，奈史密斯所在的训练学校缺乏在室内进行的球类比赛项目，他从当地人把球扔进桃子筐（当地产桃子，各家各户都备有装桃子的专用篮筐）的游戏中得到了启发，将两只篮筐分别安装在体育馆两边看台的栏杆上，学生分为甲乙两队，以足球为比赛工具向篮内投，按得分多少决定输赢。","p":"Nà nián de dōngtiān tèbié lěng, Nàishǐmìsī suǒzài de xùnliàn xuéxiào quēfá zài shìnèi jìnxíng de qiúlèi bǐsài xiàngmù, tā cóng dāngdìrén bǎ qiú rēngjìn táozi kuāng (dāngdì chǎn táozi, gè jiā gè hù dōu bèiyǒu zhuāng táozi de zhuānyòng lánkuāng) de yóuxì zhōng dédàole qǐfā, jiāng liǎng zhī lánkuāng fēnbié ānzhuāng zài tǐyùguǎn liǎngbiān kàntái de lángān shang, xuésheng fēnwéi jiǎ yǐ liǎng duì, yǐ zúqiú wéi bǐsài gōngjù xiàng lán nèi tóu, àn défēn duōshǎo juédìng shūyíng.","v":"Mùa đông năm ấy rất lạnh, trường huấn luyện nơi Naismith làm việc lại thiếu các môn thi đấu bóng chơi được trong nhà. Ông nảy ra ý tưởng từ trò chơi ném bóng vào giỏ đào của người dân địa phương (vùng này trồng đào, nhà nào cũng có sẵn giỏ chuyên dùng để đựng đào), bèn gắn hai chiếc giỏ lần lượt lên lan can khán đài ở hai bên nhà thi đấu, chia học sinh thành hai đội A và B, dùng quả bóng đá làm dụng cụ thi đấu để ném vào giỏ, rồi căn cứ số điểm nhiều hay ít mà phân thắng thua.","b":0},{"s":"","z":"这项运动很快流行起来。","p":"Zhè xiàng yùndòng hěn kuài liúxíng qǐlai.","v":"Môn thể thao này nhanh chóng trở nên phổ biến.","b":1},{"s":"","z":"不过，由于栏杆上固定的是真正的筐，每当球投进时，就得有一个人踩着梯子上去把球取出来。","p":"Búguò, yóuyú lángān shang gùdìng de shì zhēnzhèng de kuāng, měi dāng qiú tóujìn shí, jiù děi yǒu yí ge rén cǎizhe tīzi shàngqu bǎ qiú qǔ chūlai.","v":"Có điều, vì thứ gắn cố định trên lan can là những chiếc giỏ thật, nên mỗi khi bóng được ném vào lại phải có một người trèo thang lên lấy bóng ra.","b":0},{"s":"","z":"这样的行为必须一再地重复，为此，比赛不得不断断续续地进行，缺少了激烈紧张的气氛，连运动员都不满意，更何况看比赛的球迷呢？","p":"Zhèyàng de xíngwéi bìxū yízài de chóngfù, wèicǐ, bǐsài bùdébù duànduàn-xùxù de jìnxíng, quēshǎole jīliè jǐnzhāng de qìfēn, lián yùndòngyuán dōu bù mǎnyì, gèng hékuàng kàn bǐsài de qiúmí ne?","v":"Việc này cứ phải lặp đi lặp lại hết lần này đến lần khác, vì thế trận đấu buộc phải diễn ra ngắt quãng, thiếu hẳn bầu không khí sôi nổi, căng thẳng; đến vận động viên còn không hài lòng, huống hồ là những người hâm mộ đến xem?","b":0},{"s":"","z":"为了解决这个问题，大家纷纷出主意，想出了很多取球的办法。","p":"Wèile jiějué zhège wèntí, dàjiā fēnfēn chū zhǔyi, xiǎngchūle hěn duō qǔ qiú de bànfǎ.","v":"Để giải quyết vấn đề này, mọi người tranh nhau góp ý, nghĩ ra rất nhiều cách lấy bóng.","b":0},{"s":"","z":"有一位工程师甚至专门制造出一种机器，在下面一拉篮筐就能把球弹出来。","p":"Yǒu yí wèi gōngchéngshī shènzhì zhuānmén zhìzào chū yì zhǒng jīqì, zài xiàmian yì lā lánkuāng jiù néng bǎ qiú tán chūlai.","v":"Thậm chí có một kỹ sư còn chế tạo riêng một loại máy, chỉ cần đứng bên dưới giật một cái là giỏ bật bóng ra.","b":0},{"s":"","z":"可是，这些办法都没能让比赛顺畅起来。","p":"Kěshì, zhèxiē bànfǎ dōu méi néng ràng bǐsài shùnchàng qǐlai.","v":"Thế nhưng không cách nào trong số đó giúp trận đấu diễn ra trôi chảy được.","b":0},{"s":"","z":"几年后的一天，一个上幼儿园的小男孩跟着父亲从一群正在进行篮球比赛的人旁边经过。","p":"Jǐ nián hòu de yì tiān, yí ge shàng yòu'éryuán de xiǎo nánhái gēnzhe fùqin cóng yì qún zhèngzài jìnxíng lánqiú bǐsài de rén pángbiān jīngguò.","v":"Một ngày vài năm sau, một cậu bé đang học mẫu giáo theo bố đi ngang qua một nhóm người đang chơi bóng rổ.","b":1},{"s":"","z":"看到大人们一次次辛苦地取球，小男孩好奇地问父亲：“何必这么麻烦呢？把篮筐的底去掉不就行了吗？”","p":"Kàndào dàrenmen yí cìcì xīnkǔ de qǔ qiú, xiǎo nánhái hàoqí de wèn fùqin: “Hébì zhème máfan ne? Bǎ lánkuāng de dǐ qùdiào bú jiù xíng le ma?”","v":"Thấy người lớn hết lần này đến lần khác vất vả lấy bóng, cậu bé tò mò hỏi bố: “Sao phải phiền phức thế ạ? Bỏ đáy giỏ đi chẳng phải là xong sao?”","b":0},{"s":"","z":"多亏了他这句话，人们如梦初醒，一位球员连忙找来一把锯子把篮筐的底锯掉。","p":"Duōkuīle tā zhè jù huà, rénmen rú mèng chū xǐng, yí wèi qiúyuán liánmáng zhǎolái yì bǎ jùzi bǎ lánkuāng de dǐ jùdiào.","v":"Nhờ có câu nói ấy mà mọi người như bừng tỉnh giấc mộng, một cầu thủ vội vàng tìm ngay một cái cưa đến cưa bỏ đáy giỏ.","b":0},{"s":"","z":"你瞧，困扰人们很长时间的取球问题就这样被一个小孩子解决了。","p":"Nǐ qiáo, kùnrǎo rénmen hěn cháng shíjiān de qǔ qiú wèntí jiù zhèyàng bèi yí ge xiǎo háizi jiějué le.","v":"Bạn xem, chuyện lấy bóng làm khổ mọi người bấy lâu nay đã được một đứa trẻ giải quyết như thế đấy.","b":0},{"s":"","z":"去掉篮筐的底，本是一件简单的事，可为什么那么多人都没有想到呢？","p":"Qùdiào lánkuāng de dǐ, běn shì yí jiàn jiǎndān de shì, kě wèi shénme nàme duō rén dōu méiyǒu xiǎngdào ne?","v":"Bỏ đáy giỏ đi vốn là một việc đơn giản, vậy mà sao bao nhiêu người đều không nghĩ ra?","b":0},{"s":"","z":"说白了，因为我们的思维像篮球一样被篮筐的底挡在了半空中。","p":"Shuōbái le, yīnwèi wǒmen de sīwéi xiàng lánqiú yíyàng bèi lánkuāng de dǐ dǎng zàile bànkōng zhōng.","v":"Nói trắng ra là vì tư duy của chúng ta cũng giống quả bóng, bị đáy giỏ chặn lại lơ lửng giữa không trung.","b":0},{"s":"","z":"于是，我们呆呆地去搬梯子、造机器……","p":"Yúshì, wǒmen dāidāi de qù bān tīzi, zào jīqì……","v":"Thế là chúng ta cứ ngây ngô đi khiêng thang, chế tạo máy móc…","b":0},{"s":"","z":"其实，世界上本来就没有太复杂的事，复杂都是我们自己造成的。","p":"Qíshí, shìjiè shang běnlái jiù méiyǒu tài fùzá de shì, fùzá dōu shì wǒmen zìjǐ zàochéng de.","v":"Thật ra trên đời vốn chẳng có việc gì quá phức tạp, sự phức tạp đều do chính chúng ta tạo ra.","b":0},{"s":"","z":"生活仿佛篮筐，许多时候，我们需要的只不过是一把锯子，来锯掉那些阻碍我们的“筐底”。","p":"Shēnghuó fǎngfú lánkuāng, xǔduō shíhou, wǒmen xūyào de zhǐ búguò shì yì bǎ jùzi, lái jùdiào nàxiē zǔ'ài wǒmen de “kuāng dǐ”.","v":"Cuộc sống giống như chiếc giỏ bóng, nhiều khi thứ chúng ta cần chẳng qua chỉ là một cái cưa để cưa bỏ những “đáy giỏ” đang cản trở mình.","b":0}]}],"aud":[{"v":"audio/13-2.mp3","t":"audio/13-1.mp3"}],"gram":[{"id":"hekuang","t":"何况","s":"huống hồ, huống chi (liên từ)","b":"<b>何况</b> là <b>liên từ</b>, dùng <b>giọng phản vấn</b> để biểu thị ý <b>tiến thêm một bậc</b>: căn cứ vào điều vế trước đã nêu thì kết luận ở vế sau là hiển nhiên, mang nghĩa “不用说” (khỏi phải nói). Ngoài ra, <b>何况</b> còn dùng để <b>bổ sung thêm một lý do khác</b>. 何况 đứng ở đầu phân câu sau.","r":["Tiến thêm một bậc: vế trước nêu trường hợp “nặng” hơn (thường có 连……都/也、还……), vế sau: (更) 何况 + đối tượng/tình huống “nhẹ” hơn + (呢)？ — 连运动员都不满意，更何况看比赛的球迷呢？","Có thể không dùng dấu hỏi: ……还常迷路呢，何况你一个外地人。","Bổ sung lý do: vế trước nêu các lý do, vế sau (又/还) 何况 + lý do thêm → dẫn tới kết luận (……，又何况价钱也就贵了几千块，小王有点儿动心了)","Vị trí: đầu phân câu sau, trước chủ ngữ/đối tượng; ✗ ……，一个有病的老人何况呢？ → ✓ ……，何况一个有病的老人呢？"],"e":[["……缺少了激烈紧张的气氛，连运动员都不满意，更何况看比赛的球迷呢？","……quēshǎole jīliè jǐnzhāng de qìfēn, lián yùndòngyuán dōu bù mǎnyì, gèng hékuàng kàn bǐsài de qiúmí ne?","…thiếu đi bầu không khí sôi nổi, căng thẳng; đến vận động viên còn không hài lòng, huống hồ là người hâm mộ ngồi xem? <i>(bài khoá)</i>"],["北京的发展变化太快，我这个土生土长的老北京还常迷路呢，何况你一个外地人。","Běijīng de fāzhǎn biànhuà tài kuài, wǒ zhège tǔshēng-tǔzhǎng de lǎo Běijīng hái cháng mílù ne, hékuàng nǐ yí ge wàidìrén.","Bắc Kinh phát triển, thay đổi nhanh quá, đến tôi là dân Bắc Kinh chính gốc mà còn hay lạc đường, huống chi cậu là người nơi khác đến."],["这辆车外观漂亮，安全性高，又何况价钱也就比上次看的那辆贵了几千块，小王有点儿动心了。","Zhè liàng chē wàiguān piàoliang, ānquánxìng gāo, yòu hékuàng jiàqian yě jiù bǐ shàng cì kàn de nà liàng guìle jǐ qiān kuài, Xiǎo Wáng yǒudiǎnr dòngxīn le.","Chiếc xe này ngoại hình đẹp, độ an toàn cao, huống hồ giá cũng chỉ đắt hơn chiếc xem lần trước có vài nghìn tệ, Tiểu Vương hơi xiêu lòng rồi."],["上海冬天没有暖气，屋子里冷得让人伸不出手，何况李阳还是病人，自然是受不了的。","Shànghǎi dōngtiān méiyǒu nuǎnqì, wūzi li lěng de ràng rén shēn bu chū shǒu, hékuàng Lǐ Yáng háishi bìngrén, zìrán shì shòu bu liǎo de.","Mùa đông ở Thượng Hải không có lò sưởi, trong phòng lạnh đến mức không dám thò tay ra, huống hồ Lý Dương lại đang ốm, đương nhiên là không chịu nổi."]],"d":[["年轻人恐怕都受不了，____一个有病的老人呢？","何况"],["大人都搬不动，更____一个小孩子呢？","何况"],["这辆车外观漂亮，安全性高，又____价钱也不贵。","何况"]],"w":"Vế sau 何况 là trường hợp “dễ suy ra” từ vế trước; nếu vế trước dùng 连……都 thì vế sau thường thêm 更 thành 更何况……呢？"},{"id":"hebi","t":"何必","s":"hà tất, cần gì (phó từ)","b":"<b>何必</b> là <b>phó từ</b>, dùng <b>giọng phản vấn</b> để biểu thị ý <b>không cần thiết, không cần phải</b> (= 不需要，不必). Thường đứng sau chủ ngữ, trước động từ; câu hay kết thúc bằng <b>呢？</b> và thường có một câu tiếp theo đưa ra cách làm đơn giản hơn.","r":["Cấu trúc: (chủ ngữ) + 何必 + động từ/cụm động từ + 呢？ — 你何必亲自送一趟呢？","Hay đi kèm câu gợi ý cách khác: ……不就行了(吗)？ — 何必这么麻烦呢？把篮筐的底去掉不就行了吗？","Vế trước có thể nêu lý do khiến việc đó không cần: 食堂楼下就有个小超市，何必去学校外边呢？","Vị trí: trước động từ; ✗ 你亲自何必送一趟呢？ → ✓ 你何必亲自送一趟呢？"],"e":[["何必这么麻烦呢？把篮筐的底去掉不就行了吗？","Hébì zhème máfan ne? Bǎ lánkuāng de dǐ qùdiào bú jiù xíng le ma?","Sao phải phiền phức thế? Bỏ đáy giỏ đi chẳng phải là xong sao? <i>(bài khoá)</i>"],["食堂楼下就有个小超市，何必去学校外边呢？","Shítáng lóu xià jiù yǒu ge xiǎo chāoshì, hébì qù xuéxiào wàibian ne?","Ngay dưới nhà ăn đã có một siêu thị nhỏ, cần gì phải ra tận ngoài trường?"],["你何必亲自送一趟呢？叫个快递不就行了？","Nǐ hébì qīnzì sòng yí tàng ne? Jiào ge kuàidì bú jiù xíng le?","Cậu hà tất phải tự mang đi một chuyến? Gọi chuyển phát nhanh chẳng phải là được rồi sao?"]],"d":[["您多画点儿画儿多好，____把时间浪费在这些人的身上？","何必"],["既然她已经拒绝了你，你____再去找她呢？","何必"],["叫个快递就行了，你____亲自送一趟呢？","何必"]],"w":"何必 mang sắc thái phản vấn (thường kết thúc bằng 呢？), khác với 不必 là câu trần thuật bình thường: 你不必去了 / 你何必去呢？"},{"id":"duokui","t":"多亏","s":"may mà, nhờ có (động từ)","b":"<b>多亏</b> là <b>động từ</b>, biểu thị <b>nhờ sự giúp đỡ của người khác hoặc một yếu tố thuận lợi nào đó</b> mà tránh được điều không may hoặc có được lợi ích. Thường đứng đầu câu, có thể thêm <b>了</b> hoặc <b>有</b> sau nó; mang sắc thái cảm kích, may mắn.","r":["Cấu trúc: 多亏(了) + người/sự việc，+ kết quả tốt — 多亏了他这句话，人们如梦初醒。","多亏 + 有 + người + 在 — 今天搬家多亏有你在，你可帮我大忙了。","Hay đi với 要不/不然 ở vế sau để nói hậu quả xấu đã tránh được: 多亏你提醒，要不我肯定忘了下午还要开会。","Chỉ dùng cho kết quả tốt; ✗ 多亏你，我迟到了 → nói kết quả xấu thì không dùng 多亏"],"e":[["多亏了他这句话，人们如梦初醒。","Duōkuīle tā zhè jù huà, rénmen rú mèng chū xǐng.","Nhờ có câu nói ấy mà mọi người như bừng tỉnh giấc mộng. <i>(bài khoá)</i>"],["赵老师，谢谢您，多亏您给我那瓶药，很管用。","Zhào lǎoshī, xièxie nín, duōkuī nín gěi wǒ nà píng yào, hěn guǎnyòng.","Thầy Triệu, em cảm ơn thầy, may mà có lọ thuốc thầy cho em, rất hiệu nghiệm."],["今天搬家多亏有你在，你可帮我大忙了。","Jīntiān bānjiā duōkuī yǒu nǐ zài, nǐ kě bāng wǒ dà máng le.","Hôm nay chuyển nhà may mà có cậu, cậu đúng là giúp tớ một việc lớn."]],"d":[["____你提醒，要不我肯定忘了下午还要开会。","多亏"],["____你开车送我，要不今天的飞机我准赶不上了。","多亏"],["____医生及时抢救，妈妈很快就能出院了。","多亏"]],"w":"多亏 đứng ở đầu câu/đầu phân câu, trước người hoặc việc đã giúp mình; vế sau nêu kết quả tốt hoặc dùng 要不/不然 để nói điều xấu đã tránh được."},{"id":"jilie_qianglie","t":"激烈 vs 强烈","s":"kịch liệt, gay gắt – mạnh mẽ, mãnh liệt (tính từ)","b":"<b>Điểm giống:</b> 激烈 và 强烈 đều là <b>tính từ</b>, đều có nghĩa “thế mạnh, dữ dội” (势猛、厉害). Trong một số trường hợp có thể dùng cả hai: 我不顾父母的激烈/强烈反对，偷偷地报考了表演专业。","r":["激烈: nghĩa nhấn vào sự <b>gay gắt, căng thẳng</b> (尖锐紧张) — 一直是学者激烈争论的问题","强烈: nghĩa nhấn vào sự <b>mạnh mẽ, có sức mạnh</b> (强劲有力) — 引起了读者的强烈反响","激烈: thường dùng để miêu tả <b>lời lẽ, cảm xúc hoặc thi đấu, đấu tranh</b> — 激烈的比赛/争吵/战争/运动","强烈: thường dùng để miêu tả <b>ánh sáng, dòng điện, màu sắc, mùi</b> hoặc <b>tình cảm, tư tưởng, yêu cầu</b> của con người — 阳光的照射很强烈 / 强烈的香味 / 强烈要求"],"e":[["我不顾父母的激烈/强烈反对，偷偷地报考了表演专业。","Wǒ bú gù fùmǔ de jīliè/qiángliè fǎnduì, tōutōu de bàokǎole biǎoyǎn zhuānyè.","Bất chấp sự phản đối kịch liệt/mạnh mẽ của bố mẹ, tôi lén đăng ký thi vào ngành biểu diễn."],["人类最早什么时候开始用火，一直是学者激烈争论的问题。","Rénlèi zuì zǎo shénme shíhou kāishǐ yòng huǒ, yìzhí shì xuézhě jīliè zhēnglùn de wèntí.","Loài người bắt đầu dùng lửa sớm nhất từ khi nào vẫn luôn là vấn đề các học giả tranh luận gay gắt."],["文章发表以后立刻引起了读者的强烈反响。","Wénzhāng fābiǎo yǐhòu lìkè yǐnqǐle dúzhě de qiángliè fǎnxiǎng.","Bài viết vừa đăng đã lập tức gây phản hồi mạnh mẽ trong độc giả."],["人在激烈运动时，会出很多汗。","Rén zài jīliè yùndòng shí, huì chū hěn duō hàn.","Khi vận động mạnh, con người sẽ ra rất nhiều mồ hôi."],["这里夏天尽管阳光的照射很强烈，但白天气温很少超过35℃。","Zhèlǐ xiàtiān jǐnguǎn yángguāng de zhàoshè hěn qiángliè, dàn báitiān qìwēn hěn shǎo chāoguò 35℃.","Mùa hè ở đây tuy nắng chiếu rất gắt nhưng nhiệt độ ban ngày hiếm khi vượt quá 35℃."]],"d":[["这种蔬菜有____的香味，它既可以生吃，又可熟食。","强烈"],["明天我去一家公司面试，听说竞争很____。","激烈"],["当晚的比赛紧张、____，两队都打出了很高的水平。","激烈"],["学生们____要求重新安排考试。","强烈"]],"w":"Mẹo: thi đấu, cạnh tranh, tranh luận, vận động → 激烈; ánh sáng, mùi vị, màu sắc, tình cảm, yêu cầu, phản ứng → 强烈."}],"ext":[["太极拳","tàijíquán","thái cực quyền"],["球迷","qiúmí","người hâm mộ (bóng)"],["武术","wǔshù","võ thuật"],["纪录","jìlù","kỷ lục"],["象棋","xiàngqí","cờ tướng"],["教练","jiàoliàn","huấn luyện viên"],["对手","duìshǒu","đối thủ"],["冠军","guànjūn","quán quân, nhà vô địch"],["决赛","juésài","trận chung kết"]],"extt":"体育","notes":"Dòng chú thích nguồn cuối bài: 摘自《环球人物》，作者：张前. Bài khoá (656字) chép từ trang A108–A110, chia 3 đoạn: đoạn 1 = đoạn văn thứ nhất (từ 1–14 + 专名 1–2), đoạn 2 = đoạn văn “这项运动很快流行起来……” (từ 15–25), đoạn 3 = hai đoạn văn cuối “几年后的一天……” và “去掉篮筐的底……” (từ 26–37). Sách in từ 1 là 锯（子）jù (zi); trong JSON ghi han = 锯子 để khớp chữ trong bài khoá (一把锯子), pinyin giữ cách in của sách; từ này xuất hiện ở tên bài (锯掉) và đoạn 3 (一把锯子……锯掉) nhưng vẫn để ở đợt 1 theo thứ tự đánh số của sách.Từ có dấu * (ngoài đề cương): 1 锯（子）, 2 筐, 10 栏杆, 25 顺畅, 32 困扰, 33 思维, 37 阻碍. Từ 14 投篮 không xuất hiện nguyên dạng trong bài khoá (bài viết “向篮内投”), câu ví dụ vocab_ex của 投篮 do người soạn tự đặt. Câu thứ hai của đoạn 1 (那年的冬天……决定输赢。) rất dài nhưng không có dấu ；, nên giữ nguyên một dòng. Đoạn “于是，我们呆呆地去搬梯子、造机器……其实，……” được cắt tại dấu ……. vocab_ex của 缺乏, 重复, 气氛, 造成, 仿佛, 连忙 lấy từ 练习 1; 装 từ 练习 2; 激烈 từ 做一做 (词语辨析); 项目 từ 做一做 phần 扩展 (đã điền đáp án); 何必, 多亏 từ ví dụ phần 注释. Drill: 何况 câu 1, 何必 câu 1, 多亏 câu 1 lấy từ 练习 3 (给括号里的词选择适当的位置); drill 激烈/强烈 lấy nguyên 做一做 (câu 1 sách đã cho đáp án 强烈); các drill còn lại tự đặt dựa trên ví dụ/练一练 của sách vì 练一练 là bài hoàn thành câu mở. Bảng 扩展 (体育) trong sách chỉ có chữ Hán + pinyin, nghĩa tiếng Việt do người soạn bổ sung. Các điểm lỗi OCR đã soát bằng ảnh: OCR bỏ sót chữ 瞧 trong “你瞧”.","order":[{"z":"这项运动很快流行起来。","t":["这项","运动","很快","流行起来"],"v":"Môn thể thao này nhanh chóng trở nên phổ biến."},{"z":"为了解决这个问题，大家纷纷出主意，想出了很多取球的办法。","t":["为了","解决","这个","问题","大家","纷纷","出","主意","想出","了","很多","取球","的","办法"],"v":"Để giải quyết vấn đề này, mọi người tranh nhau góp ý, nghĩ ra rất nhiều cách lấy bóng."},{"z":"可是，这些办法都没能让比赛顺畅起来。","t":["可是","这些","办法","都","没能","让","比赛","顺畅","起来"],"v":"Thế nhưng không cách nào trong số đó giúp trận đấu diễn ra trôi chảy được."},{"z":"把篮筐的底去掉不就行了吗？","t":["把","篮筐","的","底","去掉","不","就行了","吗"],"v":"Thấy người lớn hết lần này đến lần khác vất vả lấy bóng, cậu bé tò mò hỏi bố: “Sao hà chái phía đông và phía tây, nơi con cháu sinh sống."},{"h":"走廊","p":"zǒuláng","v":"hành lang, hàng hiên","k":"dt.","x":1,"ez":"在正房和厢房之间建有走廊，可以供人行走和休息。","ev":"Giữa nhà chính và nhà chái có xây hành lang để mọi người đi lại và nghỉ ngơi."},{"h":"空间","p":"kōngjiān","v":"không gian","k":"dt.","x":0,"ez":"院子是十分理想的室外生活空间。","ev":"Khoảng sân là không gian sinh hoạt ngoài trời vô cùng lý tưởng."},{"h":"种","p":"zhòng","v":"trồng","k":"đgt.","x":1,"ez":"有的人家喜欢种草、养花、种竹子，有的人家则喜欢用大盆养金鱼。","ev":"Có nhà thích trồng cỏ, trồng hoa, trồng trúc, trong khi có nhà lại thích nuôi cá vàng trong những chậu lớn."},{"h":"竹子","p":"zhúzi","v":"cây trúc, cây tre","k":"dt.","x":0,"ez":"有的人家喜欢种草、养花、种竹子，有的人家则喜欢用大盆养金鱼。","ev":"Có nhà thích trồng cỏ, trồng hoa, trồng trúc, trong khi có nhà lại thích nuôi cá vàng trong những chậu lớn."},{"h":"则","p":"zé","v":"(chỉ sự tương phản) trong khi đó","k":"liên.","x":0,"ez":"有的人家喜欢种草、养花、种竹子，有的人家则喜欢用大盆养金鱼。","ev":"Có nhà thích trồng cỏ, trồng hoa, trồng trúc, trong khi có nhà lại thích nuôi cá vàng trong những chậu lớn."},{"h":"金鱼","p":"jīnyú","v":"cá vàng","k":"dt.","x":1,"ez":"有的人家喜欢种草、养花、种竹子，有的人家则喜欢用大盆养金鱼。","ev":"Có nhà thích trồng cỏ, trồng hoa, trồng trúc, trong khi có nhà lại thích nuôi cá vàng trong những chậu lớn."},{"h":"创造","p":"chuàngzào","v":"sáng tạo, tạo ra","k":"đgt.","x":0,"ez":"院子不仅拉近了人与自然的关系，也让家里人在此得到了感情的交流，对创造生活情趣起了很大作用，因而最为人们所喜爱。","ev":"Khoảng sân không chỉ kéo con người lại gần thiên nhiên hơn mà còn giúp người trong nhà giao lưu tình cảm với nhau, góp phần rất lớn vào việc tạo nên thú vị cho cuộc sống, vì vậy được mọi người yêu thích nhất."},{"h":"情趣","p":"qíngqù","v":"sự thú vị, điều thích thú","k":"dt.","x":1,"ez":"院子不仅拉近了人与自然的关系，也让家里人在此得到了感情的交流，对创造生活情趣起了很大作用，因而最为人们所喜爱。","ev":"Khoảng sân không chỉ kéo con người lại gần thiên nhiên hơn mà còn giúp người trong nhà giao lưu tình cảm với nhau, góp phần rất lớn vào việc tạo nên thú vị cho cuộc sống, vì vậy được mọi người yêu thích nhất."},{"h":"因而","p":"yīn'ér","v":"do đó, vì vậy","k":"liên.","x":0,"ez":"院子不仅拉近了人与自然的关系，也让家里人在此得到了感情的交流，对创造生活情趣起了很大作用，因而最为人们所喜爱。","ev":"Khoảng sân không chỉ kéo con người lại gần thiên nhiên hơn mà còn giúp người trong nhà giao lưu tình cảm với nhau, góp phần rất lớn vào việc tạo nên thú vị cho cuộc sống, vì vậy được mọi người yêu thích nhất."},{"h":"为","p":"wéi","v":"(thường được dùng với “所”) bị, được","k":"giới.","x":0,"ez":"院子不仅拉近了人与自然的关系，也让家里人在此得到了感情的交流，对创造生活情趣起了很大作用，因而最为人们所喜爱。","ev":"Khoảng sân không chỉ kéo con người lại gần thiên nhiên hơn mà còn giúp người trong nhà giao lưu tình cảm với nhau, góp phần rất lớn vào việc tạo nên thú vị cho cuộc sống, vì vậy được mọi người yêu thích nhất."},{"h":"关闭","p":"guānbì","v":"đóng kín","k":"đgt.","x":0,"ez":"只要关闭起大门，四合院内便形成一个封闭式的小环境。","ev":"Chỉ cần đóng cổng lớn lại, bên trong tứ hợp viện liền trở thành một môi trường nhỏ khép kín."},{"h":"封闭","p":"fēngbì","v":"khép kín","k":"đgt.","x":1,"ez":"只要关闭起大门，四合院内便形成一个封闭式的小环境。","ev":"Chỉ cần đóng cổng lớn lại, bên trong tứ hợp viện liền trở thành một môi trường nhỏ khép kín."},{"h":"打交道","p":"dǎ jiāodào","v":"giao thiệp, tiếp xúc","k":"đgt.","x":0,"ez":"住在四合院里的人不常与周围的邻居打交道。","ev":"Người sống trong tứ hợp viện không hay giao thiệp với hàng xóm xung quanh."},{"h":"日子","p":"rìzi","v":"cuộc sống","k":"dt.","x":0,"ez":"在小院里，一家人过着与世无争的日子，充分享受家庭的乐趣，自然有一种令人感到自在亲切的气氛。","ev":"Trong khoảng sân nhỏ, cả nhà sống những ngày tháng yên bình, chẳng tranh giành với đời, tận hưởng trọn vẹn niềm vui gia đình, tự nhiên toát lên một bầu không khí khiến người ta thấy thoải mái, thân thiết."},{"h":"充分","p":"chōngfèn","v":"đầy đủ, trọn vẹn","k":"tt.","x":0,"ez":"在小院里，一家人过着与世无争的日子，充分享受家庭的乐趣，自然有一种令人感到自在亲切的气氛。","ev":"Trong khoảng sân nhỏ, cả nhà sống những ngày tháng yên bình, chẳng tranh giành với đời, tận hưởng trọn vẹn niềm vui gia đình, tự nhiên toát lên một bầu không khí khiến người ta thấy thoải mái, thân thiết."},{"h":"令","p":"lìng","v":"khiến, làm cho","k":"đgt.","x":0,"ez":"在小院里，一家人过着与世无争的日子，充分享受家庭的乐趣，自然有一种令人感到自在亲切的气氛。","ev":"Trong khoảng sân nhỏ, cả nhà sống những ngày tháng yên bình, chẳng tranh giành với đời, tận hưởng trọn vẹn niềm vui gia đình, tự nhiên toát lên một bầu không khí khiến người ta thấy thoải mái, thân thiết."},{"h":"亲切","p":"qīnqiè","v":"thân mật, thân thiết","k":"tt.","x":0,"ez":"在小院里，一家人过着与世无争的日子，充分享受家庭的乐趣，自然有一种令人感到自在亲切的气氛。","ev":"Trong khoảng sân nhỏ, cả nhà sống những ngày tháng yên bình, chẳng tranh giành với đời, tận hưởng trọn vẹn niềm vui gia đình, tự nhiên toát lên một bầu không khí khiến người ta thấy thoải mái, thân thiết."},{"h":"劳动","p":"láodòng","v":"lao động, công việc; làm việc, lao động (bằng chân tay)","k":"dt./đgt.","x":0,"ez":"但也有多户合住一座四合院的情况，被称为“大杂院”，住户多为普通劳动人民。","ev":"Nhưng cũng có trường hợp nhiều hộ cùng ở chung một tứ hợp viện, được gọi là “đại tạp viện”, cư dân phần lớn là người lao động bình thường."},{"h":"人民","p":"rénmín","v":"nhân dân","k":"dt.","x":0,"ez":"但也有多户合住一座四合院的情况，被称为“大杂院”，住户多为普通劳动人民。","ev":"Nhưng cũng có trường hợp nhiều hộ cùng ở chung một tứ hợp viện, được gọi là “đại tạp viện”, cư dân phần lớn là người lao động bình thường."},{"h":"矛盾","p":"máodùn","v":"sự mâu thuẫn; mâu thuẫn","k":"dt./tt.","x":0,"ez":"邻里之间有时虽然也有矛盾，但更多时候是互帮互助，不是亲人胜过亲人，这种浓浓的情感是许多老北京人无法忘记的。","ev":"Giữa hàng xóm láng giềng tuy đôi khi cũng có mâu thuẫn, nhưng phần nhiều là giúp đỡ lẫn nhau, không phải ruột thịt mà còn hơn cả ruột thịt; thứ tình cảm đậm đà ấy là điều mà nhiều người Bắc Kinh xưa không thể nào quên."},{"h":"浓","p":"nóng","v":"sâu sắc, đậm","k":"tt.","x":0,"ez":"邻里之间有时虽然也有矛盾，但更多时候是互帮互助，不是亲人胜过亲人，这种浓浓的情感是许多老北京人无法忘记的。","ev":"Giữa hàng xóm láng giềng tuy đôi khi cũng có mâu thuẫn, nhưng phần nhiều là giúp đỡ lẫn nhau, không phải ruột thịt mà còn hơn cả ruột thịt; thứ tình cảm đậm đà ấy là điều mà nhiều người Bắc Kinh xưa không thể nào quên."}]],"texts":[{"no":1,"tz":"","tv":"","lines":[{"s":"","z":"四合院，是中国华北地区民居中的一种组合建筑形式。","p":"Sìhéyuàn, shì Zhōngguó Huáběi dìqū mínjū zhōng de yì zhǒng zǔhé jiànzhù xíngshì.","v":"Tứ hợp viện là một hình thức kiến trúc tổ hợp trong nhà ở dân gian vùng Hoa Bắc, Trung Quốc.","b":0},{"s":"","z":"所谓四合，“四”指东、西、南、北四面，“合”就是四面房屋围在一起，中间形成一个方形的院子。","p":"Suǒwèi sìhé, “sì” zhǐ dōng, xī, nán, běi sì miàn, “hé” jiù shì sì miàn fángwū wéi zài yìqǐ, zhōngjiān xíngchéng yí ge fāngxíng de yuànzi.","v":"Cái gọi là “tứ hợp” thì “tứ” chỉ bốn phía đông, tây, nam, bắc, còn “hợp” nghĩa là nhà cửa bốn phía quây lại với nhau, ở giữa tạo thành một khoảng sân hình vuông.","b":0},{"s":"","z":"四合院在中国汉族民居中历史最悠久，分布最广泛。","p":"Sìhéyuàn zài Zhōngguó Hànzú mínjū zhōng lìshǐ zuì yōujiǔ, fēnbù zuì guǎngfàn.","v":"Trong các kiểu nhà ở dân gian của người Hán ở Trung Quốc, tứ hợp viện có lịch sử lâu đời nhất và phân bố rộng rãi nhất.","b":0},{"s":"","z":"不过，只要人们一提到四合院，便自然会想到北京四合院，这是因为传统的北京四合院都有一套固定的样式，十分具有代表性，在各种各样的四合院中，北京四合院可以代表其主要特点。","p":"Búguò, zhǐyào rénmen yì tídào sìhéyuàn, biàn zìrán huì xiǎngdào Běijīng sìhéyuàn, zhè shì yīnwèi chuántǒng de Běijīng sìhéyuàn dōu yǒu yí tào gùdìng de yàngshì, shífēn jùyǒu dàibiǎoxìng, zài gèzhǒng-gèyàng de sìhéyuàn zhōng, Běijīng sìhéyuàn kěyǐ dàibiǎo qí zhǔyào tèdiǎn.","v":"Tuy vậy, hễ nhắc đến tứ hợp viện là người ta tự nhiên nghĩ ngay đến tứ hợp viện Bắc Kinh, bởi tứ hợp viện Bắc Kinh truyền thống đều có một kiểu dáng cố định, rất tiêu biểu; trong muôn vàn kiểu tứ hợp viện, tứ hợp viện Bắc Kinh có thể đại diện cho những đặc điểm chủ yếu của chúng.","b":0},{"s":"","z":"北京有各种规模的四合院。","p":"Běijīng yǒu gè zhǒng guīmó de sìhéyuàn.","v":"Bắc Kinh có tứ hợp viện với đủ mọi quy mô.","b":1},{"s":"","z":"最简单的四合院只有一个院子，比较复杂的有两三个，而有钱人家的，通常是由好几座四合院并列组成的。","p":"Zuì jiǎndān de sìhéyuàn zhǐ yǒu yí ge yuànzi, bǐjiào fùzá de yǒu liǎng-sān ge, ér yǒu qián rénjiā de, tōngcháng shì yóu hǎo jǐ zuò sìhéyuàn bìngliè zǔchéng de.","v":"Tứ hợp viện đơn giản nhất chỉ có một khoảng sân, loại phức tạp hơn có hai ba sân, còn của những nhà giàu có thì thường do mấy tòa tứ hợp viện nằm song song hợp thành.","b":0},{"s":"","z":"大门一般开在东南角或西北角，院中的北房是正房，比其他房屋的规模大，一般包括长辈的卧室和具备日常起居、接待客人等功能的客厅。","p":"Dàmén yìbān kāi zài dōngnán jiǎo huò xīběi jiǎo, yuàn zhōng de běi fáng shì zhèngfáng, bǐ qítā fángwū de guīmó dà, yìbān bāokuò zhǎngbèi de wòshì hé jùbèi rìcháng qǐjū, jiēdài kèrén děng gōngnéng de kètīng.","v":"Cổng lớn thường mở ở góc đông nam hoặc góc tây bắc; dãy nhà phía bắc trong sân là nhà chính, quy mô lớn hơn các dãy nhà khác, thường gồm phòng ngủ của bậc bề trên và phòng khách có đủ các chức năng như sinh hoạt hằng ngày, tiếp đãi khách khứa.","b":0},{"s":"","z":"院子的两边是东西厢房，是晚辈们生活的地方。","p":"Yuànzi de liǎngbiān shì dōng xī xiāngfáng, shì wǎnbèimen shēnghuó de dìfang.","v":"Hai bên sân là dãy nhà chái phía đông và phía tây, nơi con cháu sinh sống.","b":0},{"s":"","z":"在正房和厢房之间建有走廊，可以供人行走和休息。","p":"Zài zhèngfáng hé xiāngfáng zhījiān jiàn yǒu zǒuláng, kěyǐ gōng rén xíngzǒu hé xiūxi.","v":"Giữa nhà chính và nhà chái có xây hành lang để mọi người đi lại và nghỉ ngơi.","b":0},{"s":"","z":"院子是十分理想的室外生活空间。","p":"Yuànzi shì shífēn lǐxiǎng de shìwài shēnghuó kōngjiān.","v":"Khoảng sân là không gian sinh hoạt ngoài trời vô cùng lý tưởng.","b":0},{"s":"","z":"有的人家喜欢种草、养花、种竹子，有的人家则喜欢用大盆养金鱼。","p":"Yǒude rénjiā xǐhuan zhòng cǎo, yǎng huā, zhòng zhúzi, yǒude rénjiā zé xǐhuan yòng dà pén yǎng jīnyú.","v":"Có nhà thích trồng cỏ, trồng hoa, trồng trúc, trong khi có nhà lại thích nuôi cá vàng trong những chậu lớn.","b":0},{"s":"","z":"院子不仅拉近了人与自然的关系，也让家里人在此得到了感情的交流，对创造生活情趣起了很大作用，因而最为人们所喜爱。","p":"Yuànzi bùjǐn lājìnle rén yǔ zìrán de guānxi, yě ràng jiā li rén zài cǐ dédàole gǎnqíng de jiāoliú, duì chuàngzào shēnghuó qíngqù qǐle hěn dà zuòyòng, yīn'ér zuì wéi rénmen suǒ xǐ'ài.","v":"Khoảng sân không chỉ kéo con người lại gần thiên nhiên hơn mà còn giúp người trong nhà giao lưu tình cảm với nhau, góp phần rất lớn vào việc tạo nên thú vị cho cuộc sống, vì vậy được mọi người yêu thích nhất.","b":0},{"s":"","z":"只要关闭起大门，四合院内便形成一个封闭式的小环境。","p":"Zhǐyào guānbì qǐ dàmén, sìhéyuàn nèi biàn xíngchéng yí ge fēngbìshì de xiǎo huánjìng.","v":"Chỉ cần đóng cổng lớn lại, bên trong tứ hợp viện liền trở thành một môi trường nhỏ khép kín.","b":1},{"s":"","z":"住在四合院里的人不常与周围的邻居打交道。","p":"Zhù zài sìhéyuàn li de rén bù cháng yǔ zhōuwéi de línjū dǎ jiāodao.","v":"Người sống trong tứ hợp viện không hay giao thiệp với hàng xóm xung quanh.","b":0},{"s":"","z":"在小院里，一家人过着与世无争的日子，充分享受家庭的乐趣，自然有一种令人感到自在亲切的气氛。","p":"Zài xiǎo yuàn li, yì jiā rén guòzhe yǔ shì wú zhēng de rìzi, chōngfèn xiǎngshòu jiātíng de lèqù, zìrán yǒu yì zhǒng lìng rén gǎndào zìzai qīnqiè de qìfēn.","v":"Trong khoảng sân nhỏ, cả nhà sống những ngày tháng yên bình, chẳng tranh giành với đời, tận hưởng trọn vẹn niềm vui gia đình, tự nhiên toát lên một bầu không khí khiến người ta thấy thoải mái, thân thiết.","b":0},{"s":"","z":"但也有多户合住一座四合院的情况，被称为“大杂院”，住户多为普通劳动人民。","p":"Dàn yě yǒu duō hù hé zhù yí zuò sìhéyuàn de qíngkuàng, bèi chēngwéi “dàzáyuàn”, zhùhù duō wéi pǔtōng láodòng rénmín.","v":"Nhưng cũng có trường hợp nhiều hộ cùng ở chung một tứ hợp viện, được gọi là “đại tạp viện”, cư dân phần lớn là người lao động bình thường.","b":0},{"s":"","z":"邻里之间有时虽然也有矛盾，但更多时候是互帮互助，不是亲人胜过亲人，这种浓浓的情感是许多老北京人无法忘记的。","p":"Línlǐ zhījiān yǒushí suīrán yě yǒu máodùn, dàn gèng duō shíhou shì hù bāng hù zhù, bú shì qīnrén shèngguò qīnrén, zhè zhǒng nóngnóng de qínggǎn shì xǔduō lǎo Běijīngrén wúfǎ wàngjì de.","v":"Giữa hàng xóm láng giềng tuy đôi khi cũng có mâu thuẫn, nhưng phần nhiều là giúp đỡ lẫn nhau, không phải ruột thịt mà còn hơn cả ruột thịt; thứ tình cảm đậm đà ấy là điều mà nhiều người Bắc Kinh xưa không thể nào quên.","b":0}]}],"aud":[{"v":"audio/14-2.mp3","t":"audio/14-1.mp3"}],"gram":[{"id":"suowei","t":"所谓","s":"cái gọi là (tính từ)","b":"<b>所谓</b> là <b>tính từ</b>, có hai cách dùng theo sách. (1) Chỉ <b>“cái thường được gọi là”</b>, hay dùng để nêu ra một từ ngữ cần giải thích rồi giải thích nó. (2) Chỉ <b>“cái mà một số người gọi là”</b>, thường mang ý <b>không đồng tình, không thừa nhận</b> điều người khác nói. Từ ngữ được nhắc tới thường đặt trong ngoặc kép.","r":["Nêu khái niệm rồi giải thích: 所谓 + từ ngữ，(就是) + lời giải thích (所谓四合，“四”指……，“合”就是……)","Chốt lại bằng một khái niệm: ……，这就是所谓的“……”","Ý phủ nhận, không thừa nhận: (某人/某处)所谓的“X” + 其实…… (他所谓的“新闻”，其实我们早就知道了)","Khi đứng trước danh từ làm định ngữ thường thêm 的: 所谓的“健康食品”"],"e":[["很多时候，烦恼是自己找来的，这就是所谓的“自寻烦恼”。","Hěn duō shíhou, fánnǎo shì zìjǐ zhǎo lái de, zhè jiù shì suǒwèi de “zì xún fánnǎo”.","Nhiều khi phiền não là do mình tự chuốc lấy, đó chính là cái gọi là “tự tìm phiền não”."],["所谓四合，“四”指东、西、南、北四面，“合”就是四面房屋围在一起，中间形成一个方形的院子。","Suǒwèi sìhé, “sì” zhǐ dōng, xī, nán, běi sì miàn, “hé” jiù shì sì miàn fángwū wéi zài yìqǐ, zhōngjiān xíngchéng yí ge fāngxíng de yuànzi.","Cái gọi là “tứ hợp” thì “tứ” chỉ bốn phía đông, tây, nam, bắc, còn “hợp” nghĩa là nhà cửa bốn phía quây lại với nhau, ở giữa tạo thành một khoảng sân hình vuông. <i>(bài khoá)</i>"],["他所谓的“新闻”，其实我们早就知道了！","Tā suǒwèi de “xīnwén”, qíshí wǒmen zǎo jiù zhīdào le!","Cái mà anh ta gọi là “tin mới” thật ra bọn mình biết từ lâu rồi!"],["现在市场上所谓的“健康食品”其实没有统一的标准。","Xiànzài shìchǎng shang suǒwèi de “jiànkāng shípǐn” qíshí méiyǒu tǒngyī de biāozhǔn.","Những thứ gọi là “thực phẩm tốt cho sức khỏe” trên thị trường hiện nay thật ra chẳng có tiêu chuẩn thống nhất nào."]],"d":[["很多时候，烦恼是自己找来的，这就是____的“自寻烦恼”。","所谓"],["他____的“新闻”，其实我们早就知道了！","所谓"],["____四合，“四”指东、西、南、北四面，“合”就是四面房屋围在一起。","所谓"]],"w":"Nghĩa thứ hai của 所谓 mang sắc thái chê, không tin (≈ “cái gọi là… thực ra…”), thường đi với 其实; đừng dùng khi muốn khen."},{"id":"ze","t":"则","s":"(lượng từ) mẩu, bài; (liên từ) còn…thì, thì","b":"<b>则</b> có hai từ loại. <b>Lượng từ</b>: dùng cho những đoạn văn ngắn thành bài hoặc thành mục (一则新闻, 两则成语故事). <b>Liên từ</b>: cấu trúc thường gặp <b>A……，(而) B则……</b>, biểu thị sự <b>đối chiếu</b> giữa hai vế trước và sau. Ngoài ra 则 còn biểu thị <b>quan hệ nhân quả</b>, thường dùng trong văn viết, tương đương với <b>就</b> trong khẩu ngữ.","r":["Lượng từ: số từ + 则 + 新闻/故事/广告… (một mẩu tin, hai câu chuyện)","Đối chiếu: A……，(而) B则…… — 则 đứng sau chủ ngữ của vế sau (而狗则是……, 有的人家则喜欢……)","Nhân quả (văn viết) = 就: 有风则寒，无风则暖; 欲速则不达"],"e":[["在第七课，我们学习了两则成语故事。","Zài dì-qī kè, wǒmen xuéxíle liǎng zé chéngyǔ gùshi.","Ở bài 7, chúng ta đã học hai mẩu chuyện thành ngữ."],["今天的报纸上有一则非常重要的新闻。","Jīntiān de bàozhǐ shang yǒu yì zé fēicháng zhòngyào de xīnwén.","Trên báo hôm nay có một mẩu tin rất quan trọng."],["猫享受独处的快乐，而狗则是希望和别人分享快乐。","Māo xiǎngshòu dúchǔ de kuàilè, ér gǒu zé shì xīwàng hé biéren fēnxiǎng kuàilè.","Mèo tận hưởng niềm vui khi ở một mình, còn chó thì lại mong được chia sẻ niềm vui với người khác."],["有的人家喜欢种草、养花、种竹子，有的人家则喜欢用大盆养金鱼。","Yǒude rénjiā xǐhuan zhòng cǎo, yǎng huā, zhòng zhúzi, yǒude rénjiā zé xǐhuan yòng dà pén yǎng jīnyú.","Có nhà thích trồng cỏ, trồng hoa, trồng trúc, trong khi có nhà lại thích nuôi cá vàng trong những chậu lớn. <i>(bài khoá)</i>"],["北京的冬天，有风则寒，无风则暖。","Běijīng de dōngtiān, yǒu fēng zé hán, wú fēng zé nuǎn.","Mùa đông ở Bắc Kinh, có gió thì lạnh, không có gió thì ấm."],["“欲速则不达”，人生不能总是要求“快”，其实，“慢”也是一种生活的艺术。","“Yù sù zé bù dá”, rénshēng bù néng zǒngshì yāoqiú “kuài”, qíshí, “màn” yě shì yì zhǒng shēnghuó de yìshù.","“Dục tốc bất đạt”, đời người không thể lúc nào cũng đòi “nhanh”, thật ra “chậm” cũng là một nghệ thuật sống."]],"d":[["今天的报纸上有一____非常重要的新闻。","则"],["猫享受独处的快乐，而狗____是希望和别人分享快乐。","则"],["北京的冬天，有风则寒，无风____暖。","则"]],"w":"则 (liên từ) đứng sau chủ ngữ của vế sau, khác 但是/而 đứng đầu vế: ✗ 则狗希望…… → ✓ 而狗则是希望……"},{"id":"weisuo","t":"为……所……","s":"bị/được … (cấu trúc bị động, văn viết)","b":"<b>为……所……</b> là <b>cấu trúc cố định</b>, chủ yếu dùng trong <b>văn viết</b>; ở đây <b>为</b> (wéi) mang nghĩa của <b>被</b> (bị, được). Mẫu câu: đối tượng chịu tác động + <b>为</b> + người/vật gây tác động + <b>所</b> + động từ.","r":["Mẫu: A + 为 + B + 所 + động từ (A bị/được B …): 为他认真的工作态度所感动","Trước 为 có thể thêm phó từ, trạng ngữ: 更好地为人所用, 最为人们所喜爱","Hay đi với động từ chỉ cảm xúc, đánh giá hoặc sử dụng: 感动、喜爱、用……"],"e":[["认识他的人，没有人不为他认真的工作态度所感动。","Rènshi tā de rén, méiyǒu rén bù wéi tā rènzhēn de gōngzuò tàidu suǒ gǎndòng.","Những ai quen biết anh ấy, không người nào không cảm động trước thái độ làm việc nghiêm túc của anh."],["有了科学，大自然就可以更好地为人所用。","Yǒule kēxué, dàzìrán jiù kěyǐ gèng hǎo de wéi rén suǒ yòng.","Có khoa học, thiên nhiên có thể được con người sử dụng tốt hơn."],["院子不仅拉近了人与自然的关系，也让家里人在此得到了感情的交流，对创造生活情趣起了很大作用，因而最为人们所喜爱。","Yuànzi bùjǐn lājìnle rén yǔ zìrán de guānxi, yě ràng jiā li rén zài cǐ dédàole gǎnqíng de jiāoliú, duì chuàngzào shēnghuó qíngqù qǐle hěn dà zuòyòng, yīn'ér zuì wéi rénmen suǒ xǐ'ài.","Khoảng sân không chỉ kéo con người lại gần thiên nhiên hơn mà còn giúp người trong nhà giao lưu tình cảm với nhau, góp phần rất lớn vào việc tạo nên thú vị cho cuộc sống, vì vậy được mọi người yêu thích nhất. <i>(bài khoá)</i>"]],"d":[["认识他的人，没有人不____他认真的工作态度所感动。","为"],["有了科学，大自然就可以更好地为人____用。","所"],["院子对创造生活情趣起了很大作用，因而最____人们所喜爱。","为"]],"w":"为 trong cấu trúc này đọc là <b>wéi</b> (thanh 2), không đọc wèi; sắc thái trang trọng hơn 被, ít dùng trong khẩu ngữ."},{"id":"qi","t":"起","s":"(động từ) đứng sau động từ: nối, gắn kết, cố định lại","b":"<b>起</b> là <b>động từ</b>. Cấu trúc <b>động từ + 起</b> biểu thị sự <b>nối liền, kết hợp và cố định</b> lại: hai vật được nối với nhau, hoặc một trạng thái/một thứ được xác lập cố định.","r":["Nối liền, kết hợp: 拉起手 (nắm lấy tay nhau)","Khép lại, cố định: 关闭起大门 (đóng chặt cổng lại)","Xác lập nên: 建立起一套……的制度 (xây dựng nên một chế độ)","Sau 动词 + 起 thường có tân ngữ: 拉起手、关闭起大门、建立起一套制度"],"e":[["拉起手，我们就是好朋友。","Lāqǐ shǒu, wǒmen jiù shì hǎo péngyou.","Nắm tay nhau rồi, chúng ta là bạn tốt."],["只要关闭起大门，四合院内便形成一个封闭式的小环境。","Zhǐyào guānbì qǐ dàmén, sìhéyuàn nèi biàn xíngchéng yí ge fēngbìshì de xiǎo huánjìng.","Chỉ cần đóng cổng lớn lại, bên trong tứ hợp viện liền trở thành một môi trường nhỏ khép kín. <i>(bài khoá)</i>"],["对公司来说，最重要的是建立起一套行之有效的制度。","Duì gōngsī lái shuō, zuì zhòngyào de shì jiànlì qǐ yí tào xíng zhī yǒuxiào de zhìdù.","Đối với công ty, điều quan trọng nhất là xây dựng được một chế độ thiết thực, hiệu quả."]],"d":[["拉____手，我们就是好朋友。","起"],["只要关闭____大门，四合院内便形成一个封闭式的小环境。","起"],["对公司来说，最重要的是建立____一套行之有效的制度。","起"]],"w":""},{"id":"tongchang_changchang","t":"通常 vs 常常","s":"thường, thông thường — so sánh","b":"<b>Giống nhau:</b> cả hai đều biểu thị một hành động <b>thường xuyên xảy ra</b>; trong một số câu có thể thay cho nhau, nhưng ý nhấn mạnh khác nhau. Ví dụ: 我通常/常常在学校外面那个超市买东西。","r":["<b>通常</b> nhấn mạnh hành động diễn ra <b>có quy luật</b> (theo lệ thường): 有钱人家的，通常是由好几座四合院并列组成的。","<b>常常</b> nhấn mạnh hành động <b>xảy ra nhiều lần</b>: 他成绩很好，常常受到表扬。","<b>通常</b> là tính từ, <b>có thể làm định ngữ</b>: 我们通常的做法都是这样的。","<b>常常</b> là phó từ, <b>không làm định ngữ và không bổ nghĩa cho cả phân câu</b>: 他常常去上海出差，对上海很熟悉。"],"e":[["我通常/常常在学校外面那个超市买东西。","Wǒ tōngcháng/chángcháng zài xuéxiào wàimiàn nàge chāoshì mǎi dōngxi.","Tôi thường mua đồ ở cái siêu thị bên ngoài trường."],["有钱人家的，通常是由好几座四合院并列组成的。","Yǒu qián rénjiā de, tōngcháng shì yóu hǎo jǐ zuò sìhéyuàn bìngliè zǔchéng de.","Của những nhà giàu có thì thường do mấy tòa tứ hợp viện nằm song song hợp thành. <i>(bài khoá)</i>"],["我们通常的做法都是这样的。","Wǒmen tōngcháng de zuòfǎ dōu shì zhèyàng de.","Cách làm thông thường của chúng tôi đều như thế này."],["他成绩很好，常常受到表扬。","Tā chéngjì hěn hǎo, chángcháng shòudào biǎoyáng.","Cậu ấy học giỏi nên thường xuyên được khen."],["他常常去上海出差，对上海很熟悉。","Tā chángcháng qù Shànghǎi chūchāi, duì Shànghǎi hěn shúxī.","Anh ấy hay đi công tác Thượng Hải nên rất thông thạo Thượng Hải."]],"d":[["她____在家帮妈妈干活儿。","常常"],["____除夕晚上都要放鞭炮、吃饺子。","通常"],["在____情况下，火车是不会晚点的。","通常"],["周末他____去父母家过。","通常 / 常常 (đều được)"]],"w":"Mẹo: đứng trước danh từ (通常的做法, 通常情况下) hoặc mở đầu cả phân câu → chỉ dùng 通常; nhấn “nhiều lần, hay” (常常受到表扬) → dùng 常常."}],"ext":[["屋子","wūzi","phòng, căn phòng"],["卧室","wòshì","phòng ngủ"],["阳台","yángtái","ban công"],["台阶","táijiē","bậc thềm"],["墙","qiáng","tường"],["玻璃","bōli","kính, thủy tinh"],["宿舍","sùshè","ký túc xá"],["公寓","gōngyù","căn hộ, chung cư"],["单元","dānyuán","đơn nguyên (khối/cầu thang trong tòa nhà)"],["隔壁","gébì","nhà bên cạnh, sát vách"],["大厦","dàshà","tòa nhà lớn, cao ốc"],["广场","guǎngchǎng","quảng trường"]],"extt":"建筑","notes":"Dòng chú thích nguồn cuối bài: 改编自百度文库《建筑欣赏之四合院》. Bài khoá (617字) chép từ trang A116–A118, chia 3 đoạn theo ranh giới đoạn văn: đoạn 1 = đoạn văn thứ nhất (từ 1–10 + 专名 华北), đoạn 2 = đoạn “北京有各种规模的四合院……” (từ 11–30), đoạn 3 = đoạn cuối “只要关闭起大门……” (từ 31–41). Từ có dấu * (ngoài đề cương): 1 四合院, 2 民居, 12 并列, 17 起居, 20 厢房, 21 走廊, 23 种, 26 金鱼, 28 情趣, 32 封闭. Câu cuối đoạn 1 dài (>45 chữ) nhưng không có dấu ； nên giữ nguyên một dòng. Pinyin từ 33 打交道 giữ theo cách in của sách (dǎ jiāodào); trong pinyin câu bài khoá ghi thanh nhẹ dǎ jiāodao. Từ 通常 trong bảng từ mới ghi “phó.”, còn bảng 词语辨析 của sách lại xếp 通常 là 形容词 (có thể làm định ngữ) — đã giữ nguyên cả hai theo sách. Ví dụ (6) của 则 trong sách có chú thích 欲 (yù, muốn) và ví dụ (3) của 起 có chú thích 建立 (jiànlì, thiết lập) — đã lược phần chú thích khỏi câu ví dụ. Drill 通常/常常 lấy từ 做一做 (câu 1 sách đã cho đáp án 常常; câu 4 cả hai đều điền được, do người soạn tự giải). Các drill khác (所谓, 则, 为……所……, 起) tự đặt từ câu ví dụ của sách vì 练一练 là bài hoàn thành câu mở. Bảng 扩展 (建筑) trong sách chỉ có chữ Hán + pinyin, nghĩa tiếng Việt do người soạn bổ sung. Bảng 词语搭配 và phần 练习 (1–4), 运用 không đưa vào JSON.","order":[{"z":"四合院，是中国华北地区民居中的一种组合建筑形式。","t":["四合院","是","中国华北地区","民居","中","的","一种","组合","建筑","形式"],"v":"Tứ hợp viện là một hình thức kiến trúc tổ hợp trong nhà ở dân gian vùng Hoa Bắc, Trung Quốc."},{"z":"北京有各种规模的四合院。","t":["北京","有","各种","规模","的","四合院"],"v":"Bắc Kinh có tứ hợp viện với đủ mọi quy mô."},{"z":"院子是十分理想的室外生活空间。","t":["院子","是","十分","理想","的","室外","生活空间"],"v":"Khoảng sân là không gian sinh hoạt ngoài trời vô cùng lý tưởng."},{"z":"他所谓的“新闻”，其实我们早就知道了！","t":["他","所谓","的","新闻","其实","我们","早就","知道","了"],"v":"Cái mà anh ta gọi là “tin mới” thật ra bọn mình biết từ lâu rồi!"},{"z":"在第七课，我们学习了两则成语故事。","t":["在","第七课","我们","学习","了","两则","成语故事"],"v":"Ở bài 7, chúng ta đã học hai mẩu chuyện thành ngữ."},{"z":"今天的报纸上有一则非常重要的新闻。","t":["今天","的","报 giết sạch, mất đi những sinh mạng quý giá."},{"h":"讽刺","p":"fěngcì","v":"châm biếm, mỉa mai","k":"đgt.","x":0,"ez":"现在常用这个成语讽刺那些只会空谈理论的人，提醒大家做事一定要灵活，要注意理论联系实际。","ev":"Ngày nay người ta thường dùng thành ngữ này để châm biếm những kẻ chỉ biết bàn suông lý thuyết, nhắc nhở mọi người làm việc nhất định phải linh hoạt, phải chú ý gắn lý luận với thực tế."},{"h":"灵活","p":"línghuó","v":"linh hoạt, nhạy bén","k":"tt.","x":0,"ez":"现在常用这个成语讽刺那些只会空谈理论的人，提醒大家做事一定要灵活，要注意理论联系实际。","ev":"Ngày nay người ta thường dùng thành ngữ này để châm biếm những kẻ chỉ biết bàn suông lý thuyết, nhắc nhở mọi người làm việc nhất định phải linh hoạt, phải chú ý gắn lý luận với thực tế."}]],"texts":[{"no":1,"tz":"","tv":"","lines":[{"s":"","z":"两千七百多年前的战国末期，赵国名将赵奢有个儿子叫赵括，他从小读了不少兵书，跟别人谈论起军事来，没有人说得过他，就是父亲赵奢也难不住他。","p":"Liǎngqiān qībǎi duō nián qián de Zhànguó mòqī, Zhàoguó míngjiàng Zhào Shē yǒu ge érzi jiào Zhào Kuò, tā cóngxiǎo dúle bù shǎo bīngshū, gēn biérén tánlùn qǐ jūnshì lai, méiyǒu rén shuō de guò tā, jiùshì fùqin Zhào Shē yě nán bu zhù tā.","v":"Vào cuối thời Chiến quốc hơn hai nghìn bảy trăm năm trước, danh tướng nước Triệu là Triệu Xa có một người con trai tên Triệu Quát; từ nhỏ cậu đã đọc không ít binh thư, hễ bàn chuyện quân sự với ai thì không ai nói lại được cậu, ngay cả cha cậu là Triệu Xa cũng không làm khó được cậu.","b":0},{"s":"","z":"赵括因此很骄傲，自以为天下无敌，连父亲也不放在眼里。","p":"Zhào Kuò yīncǐ hěn jiāo'ào, zì yǐwéi tiānxià wúdí, lián fùqin yě bú fàng zài yǎn li.","v":"Vì thế Triệu Quát rất kiêu ngạo, tự cho mình là thiên hạ vô địch, đến cha mình cũng chẳng coi ra gì.","b":0},{"s":"","z":"但是赵奢心里明白，自己的儿子虽然对军事理论都很了解，但是没有实际作战的经验，想法很不符合实际。","p":"Dànshì Zhào Shē xīnli míngbai, zìjǐ de érzi suīrán duì jūnshì lǐlùn dōu hěn liǎojiě, dànshì méiyǒu shíjì zuòzhàn de jīngyàn, xiǎngfǎ hěn bù fúhé shíjì.","v":"Nhưng trong lòng Triệu Xa hiểu rõ, con trai mình tuy rất am hiểu lý luận quân sự nhưng không hề có kinh nghiệm đánh trận thực tế, cách nghĩ rất xa rời thực tế.","b":0},{"s":"","z":"他曾经偷偷对妻子说：“儿子的毛病是只会讲大道理，缺乏实际锻炼，不能当大将。","p":"Tā céngjīng tōutōu duì qīzi shuō: “Érzi de máobing shì zhǐ huì jiǎng dà dàolǐ, quēfá shíjì duànliàn, bù néng dāng dàjiàng.","v":"Ông từng lén nói với vợ: \"Tật xấu của con mình là chỉ biết nói đạo lý to tát, thiếu rèn luyện thực tế, không thể làm đại tướng được.","b":0},{"s":"","z":"如果让他当了大将，迟早会害了赵国。”","p":"Rúguǒ ràng tā dāngle dàjiàng, chízǎo huì hàile Zhàoguó.”","v":"Nếu để nó làm đại tướng thì sớm muộn gì cũng hại nước Triệu.\"","b":0},{"s":"","z":"几年后，赵奢去世了。","p":"Jǐ nián hòu, Zhào Shē qùshì le.","v":"Vài năm sau, Triệu Xa qua đời.","b":1},{"s":"","z":"这一年正好秦国军队来打赵国，赵国派老将廉颇带20万大军迎战。","p":"Zhè yì nián zhènghǎo Qínguó jūnduì lái dǎ Zhàoguó, Zhàoguó pài lǎojiàng Lián Pō dài èrshí wàn dàjūn yíngzhàn.","v":"Đúng năm đó quân đội nước Tần kéo đến đánh nước Triệu, nước Triệu cử lão tướng Liêm Pha dẫn 200.000 đại quân ra nghênh chiến.","b":0},{"s":"","z":"廉颇根据敌强我弱的形势，命令士兵们坚守阵地，绝对不可主动出战。","p":"Lián Pō gēnjù dí qiáng wǒ ruò de xíngshì, mìnglìng shìbīngmen jiānshǒu zhèndì, juéduì bù kě zhǔdòng chūzhàn.","v":"Căn cứ vào tình thế địch mạnh ta yếu, Liêm Pha ra lệnh cho binh lính giữ vững trận địa, tuyệt đối không được chủ động xuất quân.","b":0},{"s":"","z":"秦军多次挑战，骂他是胆小鬼，他还是不出兵。","p":"Qínjūn duō cì tiǎozhàn, mà tā shì dǎnxiǎoguǐ, tā háishi bù chūbīng.","v":"Quân Tần nhiều lần khiêu chiến, mắng ông là đồ hèn nhát, ông vẫn không xuất binh.","b":0},{"s":"","z":"这个办法果然非常有效，成功地把秦军拦在了国门之外。","p":"Zhège bànfǎ guǒrán fēicháng yǒuxiào, chénggōng de bǎ Qínjūn lán zài le guómén zhī wài.","v":"Cách này quả nhiên rất hiệu quả, đã chặn thành công quân Tần ở ngoài cửa ngõ đất nước.","b":0},{"s":"","z":"渐渐地，秦军无法快速取得胜利，粮食也快没了，有些坚持不住了。","p":"Jiànjiàn de, Qínjūn wúfǎ kuàisù qǔdé shènglì, liángshi yě kuài méi le, yǒuxiē jiānchí bu zhù le.","v":"Dần dần, quân Tần không thể nhanh chóng giành thắng lợi, lương thực cũng sắp cạn, có phần không cầm cự nổi nữa.","b":0},{"s":"","z":"秦人深知廉颇善于用兵，如果想在短期内打败赵国，必须想办法叫赵国把廉颇调回去。","p":"Qínrén shēn zhī Lián Pō shànyú yòngbīng, rúguǒ xiǎng zài duǎnqī nèi dǎbài Zhàoguó, bìxū xiǎng bànfǎ jiào Zhàoguó bǎ Lián Pō diào huíqu.","v":"Người Tần biết rõ Liêm Pha giỏi dùng binh, nếu muốn đánh bại nước Triệu trong thời gian ngắn thì phải tìm cách khiến nước Triệu điều Liêm Pha về.","b":0},{"s":"","z":"于是，他们在赵国四处散布谣言，说秦军最怕赵括，别的人都不放在眼里。","p":"Yúshì, tāmen zài Zhàoguó sìchù sànbù yáoyán, shuō Qínjūn zuì pà Zhào Kuò, bié de rén dōu bú fàng zài yǎn li.","v":"Thế là họ tung tin đồn khắp nơi trong nước Triệu, nói rằng quân Tần sợ nhất là Triệu Quát, còn những người khác thì chẳng coi ra gì.","b":0},{"s":"","z":"这时，赵王正因廉颇闭门不战而生气呢，听到外面的那些谣言，果然上当了，他派赵括去换回廉颇。","p":"Zhè shí, Zhàowáng zhèng yīn Lián Pō bì mén bú zhàn ér shēngqì ne, tīngdào wàimian de nàxiē yáoyán, guǒrán shàng dàng le, tā pài Zhào Kuò qù huànhuí Lián Pō.","v":"Lúc này, vua Triệu đang bực tức vì Liêm Pha đóng cửa không đánh, nghe những lời đồn bên ngoài, quả nhiên mắc mưu, liền cử Triệu Quát đi thay Liêm Pha về.","b":1},{"s":"","z":"赵括的母亲再三阻止赵王任命儿子为大将，说他还没有独立带兵作战的资格。","p":"Zhào Kuò de mǔqin zàisān zǔzhǐ Zhàowáng rènmìng érzi wéi dàjiàng, shuō tā hái méiyǒu dúlì dài bīng zuòzhàn de zīgé.","v":"Mẹ của Triệu Quát hết lần này đến lần khác ngăn vua Triệu bổ nhiệm con mình làm đại tướng, nói rằng cậu chưa đủ tư cách tự mình cầm quân đánh trận.","b":0},{"s":"","z":"可是，糊涂的赵王哪里听得进去！","p":"Kěshì, hútu de Zhàowáng nǎli tīng de jìnqu!","v":"Thế nhưng ông vua Triệu hồ đồ kia nào có chịu nghe!","b":0},{"s":"","z":"公元前260年，赵括带兵出战。","p":"Gōngyuán qián èrbǎi liùshí nián, Zhào Kuò dài bīng chūzhàn.","v":"Năm 260 trước Công nguyên, Triệu Quát dẫn quân ra trận.","b":0},{"s":"","z":"一直盲目自信、轻视秦军的他完全改变了廉颇的作战方案，死搬兵书上的理论，主动进攻秦军，结果数十万赵军全部被杀，丢掉了宝贵的生命。","p":"Yìzhí mángmù zìxìn, qīngshì Qínjūn de tā wánquán gǎibiànle Lián Pō de zuòzhàn fāng'àn, sǐ bān bīngshū shang de lǐlùn, zhǔdòng jìngōng Qínjūn, jiéguǒ shù shí wàn Zhàojūn quánbù bèi shā, diūdiàole bǎoguì de shēngmìng.","v":"Vốn luôn tự tin mù quáng và xem thường quân Tần, Triệu Quát thay đổi hoàn toàn phương án tác chiến của Liêm Pha, rập khuôn lý thuyết trong binh thư, chủ động tấn công quân Tần; kết quả mấy chục vạn quân Triệu bị giết sạch, mất đi những sinh mạng quý giá.","b":0},{"s":"","z":"这就是成语“纸上谈兵”的故事。","p":"Zhè jiù shì chéngyǔ “zhǐshàng tánbīng” de gùshi.","v":"Đó chính là câu chuyện về thành ngữ \"Đánh trận trên giấy\".","b":0},{"s":"","z":"现在常用这个成语讽刺那些只会空谈理论的人，提醒大家做事一定要灵活，要注意理论联系实际。","p":"Xiànzài cháng yòng zhège chéngyǔ fěngcì nàxiē zhǐ huì kōngtán lǐlùn de rén, tíxǐng dàjiā zuòshì yídìng yào línghuó, yào zhùyì lǐlùn liánxì shíjì.","v":"Ngày nay người ta thường dùng thành ngữ này để châm biếm những kẻ chỉ biết bàn suông lý thuyết, nhắc nhở mọi người làm việc nhất định phải linh hoạt, phải chú ý gắn lý luận với thực tế.","b":0}]}],"aud":[{"v":"audio/15-2.mp3","t":"audio/15-1.mp3"}],"gram":[{"id":"guo","t":"动词 + 得/不 + 过","s":"hơn được / không hơn được (bổ ngữ 过)","b":"<b>过</b> ở đây là <b>động từ xu hướng</b>, đọc <b>guò</b>, thường dùng theo khuôn <b>động từ + 得/不 + 过</b>, làm <b>bổ ngữ</b>, biểu thị ý <b>vượt hơn, thắng được</b> (胜过) người khác.","r":["Khẳng định: V + 得 + 过 + người/vật bị vượt → làm được hơn, thắng được: 没有人说得过他","Phủ định: V + 不 + 过 + người/vật bị vượt → không bì được, không thắng nổi: 比不过你们、竞争不过他们","Đối tượng bị vượt đặt ngay sau 过","lỗi hay gặp: ✗ 我说他不过 → ✓ 我说不过他"],"e":[["……跟别人谈论起军事来，没有人说得过他，……","……gēn biérén tánlùn qǐ jūnshì lai, méiyǒu rén shuō de guò tā,……","…hễ bàn chuyện quân sự với ai thì không ai nói lại được cậu… <i>(bài khoá)</i>"],["年轻人记忆力好，这一点我比不过你们。","Niánqīngrén jìyìlì hǎo, zhè yì diǎn wǒ bǐ bu guò nǐmen.","Người trẻ trí nhớ tốt, về điểm này tôi không bì được với các bạn."],["我们的原材料贵，人工费用高，产品在价格上肯定竞争不过他们。","Wǒmen de yuáncáiliào guì, réngōng fèiyong gāo, chǎnpǐn zài jiàgé shang kěndìng jìngzhēng bu guò tāmen.","Nguyên liệu của chúng ta đắt, chi phí nhân công cao, về giá cả sản phẩm của ta chắc chắn không cạnh tranh nổi với họ."]],"d":[["跟别人谈论起军事来，没有人说得____他。","过"],["年轻人记忆力好，这一点我比不____你们。","过"],["产品在价格上肯定竞争不____他们。","过"]],"w":"Đừng nhầm với trợ từ động thái 过 (guo, chỉ trải nghiệm) như 受过专业训练; bổ ngữ 得/不 + 过 mang nghĩa \"hơn / thắng được\"."},{"id":"chizao","t":"迟早","s":"sớm muộn gì (phó từ)","b":"<b>迟早</b> là <b>phó từ</b>, phía sau thường là <b>động từ</b>, biểu thị một hành động hay sự việc nào đó <b>sớm hay muộn cũng sẽ xảy ra</b> (早晚会发生).","r":["Đứng trước động từ, thường đi với 会: 迟早会害了赵国","Có thể thêm 都 trước 会: 迟早都会得到解决","Hay dùng ở vế sau câu giả thiết: 如果……，迟早会……","lỗi hay gặp: ✗ 我们会迟早被挤出市场 → ✓ 我们迟早会被挤出市场"],"e":[["如果让他当了大将，迟早会害了赵国。","Rúguǒ ràng tā dāngle dàjiàng, chízǎo huì hàile Zhàoguó.","Nếu để nó làm đại tướng thì sớm muộn gì cũng hại nước Triệu. <i>(bài khoá)</i>"],["随着网络技术的发展，这些问题迟早都会得到解决。","Suízhe wǎngluò jìshù de fāzhǎn, zhèxiē wèntí chízǎo dōu huì dédào jiějué.","Cùng với sự phát triển của công nghệ mạng, sớm muộn gì những vấn đề này cũng sẽ được giải quyết."],["如果不重视技术研究和产品开发，我们迟早会被别人挤出市场。","Rúguǒ bú zhòngshì jìshù yánjiū hé chǎnpǐn kāifā, wǒmen chízǎo huì bèi biérén jǐchū shìchǎng.","Nếu không coi trọng nghiên cứu kỹ thuật và phát triển sản phẩm, sớm muộn gì chúng ta cũng bị người khác đẩy ra khỏi thị trường."]],"d":[["如果让他当了大将，____会害了赵国。","迟早"],["随着网络技术的发展，这些问题____都会得到解决。","迟早"],["如果不重视技术研究和产品开发，我们____会被别人挤出市场。","迟早"]],"w":"迟早 nhấn mạnh việc chắc chắn sẽ xảy ra, chỉ chưa biết lúc nào; đặt trước 会/都会 + động từ."},{"id":"zaisan","t":"再三","s":"nhiều lần, hết lần này đến lần khác (phó từ)","b":"<b>再三</b> là <b>phó từ</b>, nghĩa là \"<b>一次又一次</b>\" (hết lần này đến lần khác). Phía sau thường là <b>động từ</b>; đôi khi còn có thể đứng <b>sau động từ không mang tân ngữ</b>.","r":["再三 + động từ (có thể mang tân ngữ): 再三阻止赵王……、再三邀请","Động từ không mang tân ngữ + 再三: 考虑再三","lỗi hay gặp: ✗ 他考虑再三这个问题 → ✓ 他再三考虑这个问题"],"e":[["赵括的母亲再三阻止赵王任命儿子为大将，……","Zhào Kuò de mǔqin zàisān zǔzhǐ Zhàowáng rènmìng érzi wéi dàjiàng,……","Mẹ của Triệu Quát hết lần này đến lần khác ngăn vua Triệu bổ nhiệm con mình làm đại tướng… <i>(bài khoá)</i>"],["我最近这段时间特别忙，实在没时间参加小王的活动，可他再三邀请，出于礼貌，我只好答应了。","Wǒ zuìjìn zhè duàn shíjiān tèbié máng, shízài méi shíjiān cānjiā Xiǎo Wáng de huódòng, kě tā zàisān yāoqǐng, chūyú lǐmào, wǒ zhǐhǎo dāying le.","Dạo này tôi bận vô cùng, thật sự không có thời gian tham gia hoạt động của Tiểu Vương, nhưng cậu ấy mời đi mời lại, vì phép lịch sự tôi đành nhận lời."],["朋友请他做公司的总经理，他考虑再三，最后还是客气地拒绝了。","Péngyou qǐng tā zuò gōngsī de zǒngjīnglǐ, tā kǎolǜ zàisān, zuìhòu háishi kèqi de jùjué le.","Bạn bè mời anh ấy làm tổng giám đốc công ty, anh ấy cân nhắc đi cân nhắc lại, cuối cùng vẫn lịch sự từ chối."]],"d":[["赵括的母亲____阻止赵王任命儿子为大将。","再三"],["可他____邀请，出于礼貌，我只好答应了。","再三"],["他考虑____，最后还是客气地拒绝了。","再三"]],"w":"Đứng trước động từ thì động từ có thể mang tân ngữ; đứng sau động từ (考虑再三) thì động từ không được mang tân ngữ."},{"id":"shengli_chenggong","t":"胜利 vs 成功","s":"thắng lợi – thành công","b":"Cả hai đều là <b>động từ</b>, đều biểu thị <b>đạt được mục đích như dự tính</b>. Ví dụ: 北京<b>胜利/成功</b>地举办了2008年夏季奥运会。","r":["胜利: khi chỉ công việc… đạt mục đích dự tính, thường làm <b>trạng ngữ</b> (胜利地完成了调查工作) — 成功: không chỉ dùng cho công việc, sự nghiệp mà cả các phương diện khác; làm được <b>trạng ngữ</b> lẫn <b>vị ngữ</b> (实验终于成功了)","胜利 còn có nghĩa <b>đánh bại đối phương</b> trong chiến tranh hoặc thi đấu (这场比赛的胜利者) — 成功 không có nghĩa đánh bại đối phương","成功 còn là <b>tính từ</b>, mang nghĩa khiến người ta hài lòng, có thể làm <b>bổ ngữ</b> (拍得很成功) — 胜利 không có nghĩa này, không làm bổ ngữ","lỗi hay gặp: ✗ 这部电视剧拍得很胜利 → ✓ 这部电视剧拍得很成功"],"e":[["北京胜利/成功地举办了2008年夏季奥运会。","Běijīng shènglì/chénggōng de jǔbànle èr líng líng bā nián xiàjì Àoyùnhuì.","Bắc Kinh đã tổ chức thắng lợi/thành công Thế vận hội mùa hè năm 2008."],["经过一年多的努力，我们胜利地完成了调查工作。","Jīngguò yì nián duō de nǔlì, wǒmen shènglì de wánchéngle diàochá gōngzuò.","Sau hơn một năm nỗ lực, chúng tôi đã hoàn thành thắng lợi công tác điều tra."],["经过艰苦的努力，实验终于成功了。","Jīngguò jiānkǔ de nǔlì, shíyàn zhōngyú chénggōng le.","Trải qua bao nỗ lực gian khổ, cuối cùng thí nghiệm đã thành công."],["谁坚持到最后，谁就是这场比赛的胜利者。","Shéi jiānchí dào zuìhòu, shéi jiù shì zhè chǎng bǐsài de shènglìzhě.","Ai trụ được đến cuối cùng, người đó chính là người chiến thắng trong trận đấu này."],["这部电视剧拍得很成功，在全国播出后，受到观众的喜爱。","Zhè bù diànshìjù pāi de hěn chénggōng, zài quánguó bōchū hòu, shòudào guānzhòng de xǐ'ài.","Bộ phim truyền hình này quay rất thành công, sau khi phát sóng trên toàn quốc đã được khán giả yêu thích."]],"d":[["这项实验如果研究____，将给成千上万的病人带来希望。","成功"],["得民心者才会赢得这场战争的____。","胜利"],["她____地说服了丈夫放弃了搬家的打算。","成功"],["座谈会开得很____，大家交换了意见，增进了理解。","成功"]],"w":"Chiến tranh, thi đấu, đánh bại đối thủ → 胜利; đứng sau 得 làm bổ ngữ (开得很…、拍得很…) hoặc làm vị ngữ cho việc ngoài công việc (实验成功了) → 成功."}],"ext":[["枪","qiāng","súng"],["射击","shèjī","bắn, xạ kích"],["英雄","yīngxióng","anh hùng"],["士兵","shìbīng","binh lính"],["敌人","dírén","kẻ địch, quân địch"],["战争","zhànzhēng","chiến tranh"],["胜利","shènglì","thắng lợi, chiến thắng"]],"extt":"军事","notes":"Trang sách A125–A133 (tr. 135–143). Bài khoá 639 chữ (theo sách), 7 đoạn, chia 3 phần: đoạn 1–2 / đoạn 3–4 / đoạn 5–7; cuối bài khoá không có dòng chú thích nguồn. Câu đầu bài khoá chép đúng sách \"两千七百多年前的战国末期\" (sách in vậy dù mốc lịch sử thực tế khoảng 2.200–2.300 năm). Hai câu dài (câu đầu, câu \"一直盲目自信……\") >45 chữ, không có ；, giữ nguyên một câu. Từ mới có dấu * (ngoài đề cương): 1, 9, 14, 15, 22, 23, 24, 28, 33, 36. Từ số 1 纸上谈兵 sách không ghi từ loại (pos để trống). 专名 đánh số 1–6 theo mục 专有名词. Sách chỉ có 3 mục 词语例释 (过, 迟早, 再三) và 1 mục 词语辨析 (胜利—成功). Drill của 过/迟早/再三 đặt dựa trên câu ví dụ của sách vì 练一练 chỉ là bài hoàn thành câu mở; drill 胜利/成功 lấy từ 做一做 (đáp án do người soạn giải). Bảng 扩展 (军事) trong sách chỉ có chữ Hán + pinyin, nghĩa tiếng Việt do người soạn bổ sung.","order":[{"z":"如果让他当了大将，迟早会害了赵国。","t":["如果","让","他","当","了","大将","迟早会","害","了","赵国"],"v":"Nếu để nó làm đại tướng thì sớm muộn gì cũng hại nước Triệu.\""},{"z":"几年后，赵奢去世了。","t":["几年","后","赵奢","去世","了"],"v":"Vài năm sau, Triệu Xa qua đời."},{"z":"秦军多次挑战，骂他是胆小鬼，他还是不出兵。","t":["秦军","多次","挑战","骂","他","是","胆小鬼","他" :"Người giảm cân và người tăng cân có sự khác biệt rõ rệt về kiểu dao động cân nặng. <i>(bài khoá)</i>"},{"h":"明显","p":"míngxiǎn","v":"rõ ràng, nổi bật","k":"tt.","x":0,"ez":"调查结果显示，市民对电子阅读的兴趣明显提高了。","ev":"Kết quả khảo sát cho thấy người dân ngày càng hứng thú với việc đọc sách điện tử một cách rõ rệt."},{"h":"补偿","p":"bǔcháng","v":"đền bù, bổ khuyết","k":"đgt.","x":1,"ez":"体重减轻者会表现出较强的补偿模式。","ev":"Người giảm cân thể hiện kiểu bù trừ khá mạnh. <i>(bài khoá)</i>"},{"h":"立即","p":"lìjí","v":"lập tức, ngay","k":"phó.","x":0,"ez":"即在周末之后体重立即下降。","ev":"Tức là ngay sau cuối tuần cân nặng giảm xuống liền. <i>(bài khoá)</i>"},{"h":"趋势","p":"qūshì","v":"xu hướng, chiều hướng","k":"dt.","x":0,"ez":"这一下降趋势直至周五结束。","ev":"Xu hướng giảm này kéo dài cho đến hết thứ Sáu. <i>(bài khoá)</i>"},{"h":"差异","p":"chāyì","v":"sự khác biệt","k":"dt.","x":0,"ez":"而体重增加者每天的体重都会存在差异。","ev":"Còn cân nặng của người tăng cân thì ngày nào cũng có sự chênh lệch. <i>(bài khoá)</i>"},{"h":"联合","p":"liánhé","v":"kết hợp, hợp nhất; chung","k":"đgt./tt.","x":0,"ez":"这项联合多所医学院校所做的研究发现，除了个别人以外，多数人体重的增加会从周六开始。","ev":"Nghiên cứu do nhiều trường đại học y phối hợp thực hiện này phát hiện rằng, trừ một số ít người, cân nặng của đa số người bắt đầu tăng từ thứ Bảy. <i>(bài khoá)</i>"},{"h":"个别","p":"gèbié","v":"riêng lẻ, cá biệt","k":"tt.","x":0,"ez":"天气预报说今晚有小到中雨，个别地区可能有大雨。","ev":"Dự báo thời tiết nói tối nay có mưa nhỏ đến mưa vừa, một vài khu vực có thể có mưa to."},{"h":"表明","p":"biǎomíng","v":"thể hiện, chứng tỏ","k":"đgt.","x":0,"ez":"它表明人们的体重变化在一周内会显示出一种明显的规律。","ev":"Điều đó cho thấy sự thay đổi cân nặng của con người trong một tuần có một quy luật rõ ràng. <i>(bài khoá)</i>"},{"h":"临时","p":"línshí","v":"đến lúc; tạm thời","k":"phó./tt.","x":0,"ez":"早到了30分钟，所以我临时决定去旁边的书店看看。","ev":"Đến sớm 30 phút nên tôi quyết định ngay lúc đó ghé hiệu sách bên cạnh xem một chút."},{"h":"现象","p":"xiànxiàng","v":"hiện tượng","k":"dt.","x":0,"ez":"工作日和周末体重的临时变化应该被视为正常现象。","ev":"Sự thay đổi cân nặng tạm thời giữa ngày làm việc và cuối tuần nên được xem là hiện tượng bình thường. <i>(bài khoá)</i>"},{"h":"非","p":"fēi","v":"không phải, không","k":"đgt.","x":0,"ez":"成功有时候并非想象中那么难。","ev":"Thành công đôi khi không hề khó như ta tưởng."},{"h":"就餐","p":"jiùcān","v":"đi ăn","k":"đgt.","x":1,"ez":"这是由于人们在周末会有更多的时间外出就餐。","ev":"Đó là vì vào cuối tuần người ta có nhiều thời gian ra ngoài ăn uống hơn. <i>(bài khoá)</i>"},{"h":"放纵","p":"fàngzòng","v":"buông thả, không kiểm soát","k":"đgt.","x":1,"ez":"周末对饮食稍微有些放纵影响不大。","ev":"Cuối tuần hơi buông thả một chút trong ăn uống thì không ảnh hưởng mấy. <i>(bài khoá)</i>"},{"h":"苗条","p":"miáotiáo","v":"thon thả, mảnh khảnh","k":"tt.","x":0,"ez":"想要变苗条的节食者应注意到这种变化规律。","ev":"Người ăn kiêng muốn có vóc dáng thon thả nên chú ý đến quy luật thay đổi này. <i>(bài khoá)</i>"},{"h":"借口","p":"jièkǒu","v":"cớ; lấy cớ","k":"dt./đgt.","x":0,"ez":"他借口家里有事，提前离开了会场。","ev":"Anh ấy lấy cớ nhà có việc để rời hội trường sớm."},{"h":"采取","p":"cǎiqǔ","v":"áp dụng, dùng","k":"đgt.","x":0,"ez":"我们虽然还不能准确预报地震，但可以采取有效措施，最大限度地保护我们的财产。","ev":"Tuy chúng ta chưa thể dự báo chính xác động đất, nhưng có thể áp dụng các biện pháp hữu hiệu để bảo vệ tài sản của mình ở mức tối đa."},{"h":"措施","p":"cuòshī","v":"biện pháp","k":"dt.","x":0,"ez":"应及时采取措施阻止这一上升趋势。","ev":"Nên kịp thời có biện pháp ngăn chặn xu hướng tăng này. <i>(bài khoá)</i>"}]],"texts":[{"no":1,"tz":"","tv":"","lines":[{"s":"","z":"据报道，医学专家进行了一项新研究，研究发现：由于人们在一周内的营养摄入和饮食模式会影响到他们的体重变化，因此节食者的体重会在一周内上下波动。","p":"Jù bàodào, yīxué zhuānjiā jìnxíngle yí xiàng xīn yánjiū, yánjiū fāxiàn: yóuyú rénmen zài yì zhōu nèi de yíngyǎng shèrù hé yǐnshí móshì huì yǐngxiǎng dào tāmen de tǐzhòng biànhuà, yīncǐ jiéshízhě de tǐzhòng huì zài yì zhōu nèi shàngxià bōdòng.","v":"Theo tin đưa, các chuyên gia y học đã tiến hành một nghiên cứu mới và phát hiện rằng: do lượng dinh dưỡng hấp thu và kiểu ăn uống của con người trong một tuần có ảnh hưởng đến sự thay đổi cân nặng, nên cân nặng của người ăn kiêng sẽ dao động lên xuống trong vòng một tuần.","b":0},{"s":"","z":"总共有80名年龄在25-62岁之间的成年人参与了这项研究。","p":"Zǒnggòng yǒu bāshí míng niánlíng zài èrshíwǔ dào liùshí'èr suì zhījiān de chéngniánrén cānyùle zhè xiàng yánjiū.","v":"Tổng cộng có 80 người trưởng thành trong độ tuổi từ 25 đến 62 đã tham gia nghiên cứu này.","b":0},{"s":"","z":"研究人员根据他们的相对体重变化将其分为三种类型：体重减轻者、体重增加者和体重保持者。","p":"Yánjiū rényuán gēnjù tāmen de xiāngduì tǐzhòng biànhuà jiāng qí fēnwéi sān zhǒng lèixíng: tǐzhòng jiǎnqīngzhě, tǐzhòng zēngjiāzhě hé tǐzhòng bǎochízhě.","v":"Các nhà nghiên cứu căn cứ vào sự thay đổi cân nặng tương đối của họ mà chia thành ba nhóm: người giảm cân, người tăng cân và người giữ cân.","b":0},{"s":"","z":"这些成年人在每天起床之后、早餐之前称一下自己的体重，为了保证可靠性，只有那些至少连续7天以上称过体重的人才会被纳入分析。","p":"Zhèxiē chéngniánrén zài měi tiān qǐchuáng zhīhòu, zǎocān zhīqián chēng yíxià zìjǐ de tǐzhòng, wèile bǎozhèng kěkàoxìng, zhǐyǒu nàxiē zhìshǎo liánxù qī tiān yǐshàng chēngguo tǐzhòng de rén cái huì bèi nàrù fēnxī.","v":"Mỗi ngày, sau khi ngủ dậy và trước bữa sáng, những người này tự cân trọng lượng của mình; để bảo đảm độ tin cậy, chỉ những ai đã cân liên tục ít nhất 7 ngày trở lên mới được đưa vào phân tích.","b":0},{"s":"","z":"对这些志愿者的跟踪调查时间最短为15天，最长为330天。","p":"Duì zhèxiē zhìyuànzhě de gēnzōng diàochá shíjiān zuì duǎn wéi shíwǔ tiān, zuì cháng wéi sānbǎi sānshí tiān.","v":"Thời gian theo dõi những tình nguyện viên này ngắn nhất là 15 ngày, dài nhất là 330 ngày.","b":0},{"s":"","z":"研究成果显示：这些人的体重变化表现出清晰的模式，即周末之后体重升高，在工作日体重减轻（周五达到最低点）。","p":"Yánjiū chéngguǒ xiǎnshì: zhèxiē rén de tǐzhòng biànhuà biǎoxiàn chū qīngxī de móshì, jí zhōumò zhīhòu tǐzhòng shēnggāo, zài gōngzuòrì tǐzhòng jiǎnqīng (zhōuwǔ dádào zuì dī diǎn).","v":"Kết quả nghiên cứu cho thấy: sự thay đổi cân nặng của những người này thể hiện một quy luật rõ ràng, tức là cân nặng tăng lên sau cuối tuần và giảm xuống vào các ngày làm việc (thấp nhất vào thứ Sáu).","b":1},{"s":"","z":"研究人员还意外地发现，体重减轻者和体重增加者在体重波动模式上存在着明显不同。","p":"Yánjiū rényuán hái yìwài de fāxiàn, tǐzhòng jiǎnqīngzhě hé tǐzhòng zēngjiāzhě zài tǐzhòng bōdòng móshì shang cúnzàizhe míngxiǎn bù tóng.","v":"Các nhà nghiên cứu còn bất ngờ phát hiện rằng người giảm cân và người tăng cân có sự khác biệt rõ rệt về kiểu dao động cân nặng.","b":0},{"s":"","z":"体重减轻者会表现出较强的补偿模式，即在周末之后体重立即下降，这一下降趋势直至周五结束；","p":"Tǐzhòng jiǎnqīngzhě huì biǎoxiàn chū jiào qiáng de bǔcháng móshì, jí zài zhōumò zhīhòu tǐzhòng lìjí xiàjiàng, zhè yí xiàjiàng qūshì zhízhì zhōuwǔ jiéshù;","v":"Người giảm cân thể hiện kiểu bù trừ khá mạnh, tức là ngay sau cuối tuần cân nặng giảm xuống liền, và xu hướng giảm này kéo dài cho đến hết thứ Sáu;","b":0},{"s":"","z":"而体重增加者每天的体重都会存在差异，他们在工作日的体重并无明显减轻。","p":"ér tǐzhòng zēngjiāzhě měi tiān de tǐzhòng dōu huì cúnzài chāyì, tāmen zài gōngzuòrì de tǐzhòng bìng wú míngxiǎn jiǎnqīng.","v":"còn cân nặng của người tăng cân thì ngày nào cũng chênh lệch, vào các ngày làm việc cân nặng của họ không hề giảm rõ rệt.","b":0},{"s":"","z":"这项联合多所医学院校所做的研究发现，除了个别人以外，多数人体重的增加会从周六开始，而体重减轻则会从周二开始，特别是对于那些体重减轻者和体重保持者来说更是如此。","p":"Zhè xiàng liánhé duō suǒ yīxué yuànxiào suǒ zuò de yánjiū fāxiàn, chúle gèbié rén yǐwài, duōshù rén tǐzhòng de zēngjiā huì cóng zhōuliù kāishǐ, ér tǐzhòng jiǎnqīng zé huì cóng zhōu'èr kāishǐ, tèbié shì duìyú nàxiē tǐzhòng jiǎnqīngzhě hé tǐzhòng bǎochízhě lái shuō gèng shì rúcǐ.","v":"Nghiên cứu do nhiều trường đại học y phối hợp thực hiện này phát hiện rằng, trừ một số ít người, cân nặng của đa số người bắt đầu tăng từ thứ Bảy và bắt đầu giảm từ thứ Ba, nhất là với những người giảm cân và người giữ cân thì càng đúng như vậy.","b":1},{"s":"","z":"它表明人们的体重变化在一周内会显示出一种明显的规律，工作日和周末体重的临时变化应该被视为正常现象，而非真正的体重增加，这是由于人们在周末会有更多的时间外出就餐。","p":"Tā biǎomíng rénmen de tǐzhòng biànhuà zài yì zhōu nèi huì xiǎnshì chū yì zhǒng míngxiǎn de guīlǜ, gōngzuòrì hé zhōumò tǐzhòng de línshí biànhuà yīnggāi bèi shìwéi zhèngcháng xiànxiàng, ér fēi zhēnzhèng de tǐzhòng zēngjiā, zhè shì yóuyú rénmen zài zhōumò huì yǒu gèng duō de shíjiān wàichū jiùcān.","v":"Điều đó cho thấy sự thay đổi cân nặng của con người trong một tuần có một quy luật rõ ràng: sự thay đổi cân nặng tạm thời giữa ngày làm việc và cuối tuần nên được xem là hiện tượng bình thường chứ không phải tăng cân thật sự, bởi vì vào cuối tuần người ta có nhiều thời gian ra ngoài ăn uống hơn.","b":0},{"s":"","z":"周末对饮食稍微有些放纵影响不大，但为了能成功减轻体重，想要变苗条的节食者应注意到这种变化规律，周末之后不要再找任何吃美食的借口，应及时采取措施阻止这一上升趋势。","p":"Zhōumò duì yǐnshí shāowēi yǒuxiē fàngzòng yǐngxiǎng bú dà, dàn wèile néng chénggōng jiǎnqīng tǐzhòng, xiǎng yào biàn miáotiáo de jiéshízhě yīng zhùyì dào zhè zhǒng biànhuà guīlǜ, zhōumò zhīhòu bú yào zài zhǎo rènhé chī měishí de jièkǒu, yīng jíshí cǎiqǔ cuòshī zǔzhǐ zhè yí shàngshēng qūshì.","v":"Cuối tuần hơi buông thả một chút trong ăn uống thì không ảnh hưởng mấy, nhưng để giảm cân thành công, người ăn kiêng muốn có vóc dáng thon thả nên chú ý đến quy luật thay đổi này: sau cuối tuần đừng tìm thêm bất cứ cái cớ nào để ăn đồ ngon nữa, mà nên kịp thời có biện pháp ngăn chặn xu hướng tăng cân này.","b":0}]}],"aud":[{"v":"audio/16-2.mp3","t":"audio/16-1.mp3"}],"gram":[{"id":"ji","t":"即","s":"tức là; liền, ngay (động từ / phó từ, văn viết)","b":"<b>即</b> là từ mang sắc thái <b>văn viết</b>. Làm <b>động từ</b>, nghĩa là “就是” (<i>tức là, chính là</i>), dùng để giải thích, làm rõ điều vừa nói. Làm <b>phó từ</b>, nghĩa là “就”, “便” (<i>liền, ngay</i>), đứng trước động từ.","r":["Động từ: A，即 B — B giải thích, cụ thể hoá cho A: “旦”是象形字，即太阳从地平线上升起。","Phó từ: 即 + động từ = 就/便 + động từ: 不懂即问 (không hiểu là hỏi ngay), 一拍即合 (vừa bàn là hợp ý ngay).","Hay gặp trong các kết cấu cố định: 一……即……, 即可 (= 就可以)."],"e":[["“旦”是象形字，即太阳从地平线上升起。","“Dàn” shì xiàngxíngzì, jí tàiyáng cóng dìpíngxiàn shang shēngqǐ.","“旦” là chữ tượng hình, tức là mặt trời mọc lên từ đường chân trời."],["这些人的体重变化表现出清晰的模式，即周末之后体重升高，在工作日体重减轻（周五达到最低点）。","Zhèxiē rén de tǐzhòng biànhuà biǎoxiàn chū qīngxī de móshì, jí zhōumò zhīhòu tǐzhòng shēnggāo, zài gōngzuòrì tǐzhòng jiǎnqīng (zhōuwǔ dádào zuì dī diǎn).","Sự thay đổi cân nặng của những người này thể hiện một quy luật rõ ràng, tức là cân nặng tăng lên sau cuối tuần và giảm xuống vào các ngày làm việc (thấp nhất vào thứ Sáu). <i>(bài khoá)</i>"],["不懂即问是他最大的优点，也是他成功的主要原因。","Bù dǒng jí wèn shì tā zuì dà de yōudiǎn, yě shì tā chénggōng de zhǔyào yuányīn.","Không hiểu là hỏi ngay — đó là ưu điểm lớn nhất của anh ấy, cũng là lý do chính giúp anh ấy thành công."],["在办公司这件事上，两人早都有打算，这次的机会让他俩一拍即合。","Zài bàn gōngsī zhè jiàn shì shang, liǎng rén zǎo dōu yǒu dǎsuàn, zhè cì de jīhuì ràng tā liǎ yì pāi jí hé.","Chuyện mở công ty thì cả hai đã tính từ lâu, lần này có cơ hội nên hai người vừa bàn đã ăn ý ngay."]],"d":[["他可聪明了，什么东西一学____会。","即"],["汉字“宇”代表上下四方，____所有的空间。","即"],["在鸟爸爸、鸟妈妈的精心照顾下，小鸟30~35天____可独立生活。","即"]],"w":"即 trang trọng hơn 就是/就; trong khẩu ngữ thường nói 就是 hoặc 就. Đừng nhầm 即 (jí, tức là) với 既 (jì, đã… lại…)."},{"id":"gebie","t":"个别","s":"riêng lẻ, cá biệt; số rất ít (tính từ)","b":"<b>个别</b> là <b>tính từ</b>, có hai nghĩa: (1) “单个、各个” — <i>riêng lẻ, từng cái một</i>, thường làm định ngữ trước danh từ chỉ hoạt động: 个别谈话, 个别训练; (2) chỉ <b>số rất ít, hiếm có</b>: 个别人, 个别地区.","r":["Nghĩa “riêng lẻ”: 个别 + danh từ/động từ hoạt động — 个别谈话 (nói chuyện riêng), 个别训练 (huấn luyện riêng).","Nghĩa “cực ít”: 个别 + danh từ chỉ người/nơi chốn — 个别人, 个别地区; hay đi với 除了……以外 để đối lập với 多数/大部分.","Có thể làm định ngữ có 的: 个别(的)现象."],"e":[["他经常采取个别谈话的方式了解情况和解决问题。","Tā jīngcháng cǎiqǔ gèbié tánhuà de fāngshì liǎojiě qíngkuàng hé jiějué wèntí.","Anh ấy thường dùng cách nói chuyện riêng để nắm tình hình và giải quyết vấn đề."],["教练针对他的技术特点进行了个别训练，达到了比较好的效果。","Jiàoliàn zhēnduì tā de jìshù tèdiǎn jìnxíngle gèbié xùnliàn, dádàole bǐjiào hǎo de xiàoguǒ.","Huấn luyện viên đã luyện tập riêng cho anh ấy dựa theo đặc điểm kỹ thuật của anh, đạt được hiệu quả khá tốt."],["……除了个别人以外，多数人体重的增加会从周六开始，……","……chúle gèbié rén yǐwài, duōshù rén tǐzhòng de zēngjiā huì cóng zhōuliù kāishǐ, ……","…trừ một số ít người, cân nặng của đa số người bắt đầu tăng từ thứ Bảy… <i>(bài khoá)</i>"],["天气预报说今晚有小到中雨，个别地区可能有大雨。","Tiānqì yùbào shuō jīn wǎn yǒu xiǎo dào zhōng yǔ, gèbié dìqū kěnéng yǒu dàyǔ.","Dự báo thời tiết nói tối nay có mưa nhỏ đến mưa vừa, một vài khu vực có thể có mưa to."]],"d":[["教练针对他的技术特点进行了____训练。","个别"],["天气预报说今晚有小到中雨，____地区可能有大雨。","个别"],["除了____人以外，多数人体重的增加会从周六开始。","个别"]],"w":"个别 (cá biệt, rất ít) khác 各别/各自 (mỗi người riêng). 个别人 = một vài người lẻ tẻ, không phải “mỗi người”."},{"id":"fei","t":"非","s":"phi-, không thuộc; không phải; nhất định (tiền tố / động từ / phó từ)","b":"<b>非</b> có ba cách dùng: (1) <b>tiền tố</b>, đứng trước thành phần danh từ, biểu thị <i>không thuộc phạm vi đó</i> (非语言, 非专业人员); (2) <b>động từ</b>, nghĩa là “不是” (<i>không phải</i>), hay gặp trong 而非, 并非; (3) <b>phó từ</b>, biểu thị chủ quan cố ý khăng khăng, nhất định phải làm (非要); có khi dùng trong câu hỏi tu từ để phủ định sự cần thiết. Kết hợp với động từ tạo cấu trúc thường dùng <b>非 + động từ + 不可</b>, nghĩa là “必须” (<i>nhất định phải</i>).","r":["Tiền tố: 非 + danh từ — 非语言的交流, 非专业人员, 非工作人员.","Động từ = 不是: A，而非 B (là A chứ không phải B); 并非 (hoàn toàn không phải).","Phó từ: 非要 + động từ — khăng khăng, nhất quyết; 何必非要……呢？ — hỏi tu từ: cần gì phải….","Cấu trúc 非 + động từ + 不可 = 必须: 非你本人去不可 (nhất định chính bạn phải đi)."],"e":[["在非语言的交流中，眼睛起着重要的作用。","Zài fēi yǔyán de jiāoliú zhōng, yǎnjing qǐzhe zhòngyào de zuòyòng.","Trong giao tiếp phi ngôn ngữ, đôi mắt đóng vai trò quan trọng."],["我们公司的技术部门都是专业人员，工资高；非专业人员做服务工作，工资不高。","Wǒmen gōngsī de jìshù bùmén dōu shì zhuānyè rényuán, gōngzī gāo; fēi zhuānyè rényuán zuò fúwù gōngzuò, gōngzī bù gāo.","Bộ phận kỹ thuật công ty chúng tôi toàn là nhân viên chuyên môn, lương cao; nhân viên không chuyên làm công việc phục vụ, lương không cao."],["……工作日和周末体重的临时变化应该被视为正常现象，而非真正的体重增加，……","……gōngzuòrì hé zhōumò tǐzhòng de línshí biànhuà yīnggāi bèi shìwéi zhèngcháng xiànxiàng, ér fēi zhēnzhèng de tǐzhòng zēngjiā, ……","…sự thay đổi cân nặng tạm thời giữa ngày làm việc và cuối tuần nên được xem là hiện tượng bình thường chứ không phải tăng cân thật sự… <i>(bài khoá)</i>"],["成功有时候并非想象中那么难。","Chénggōng yǒu shíhou bìng fēi xiǎngxiàng zhōng nàme nán.","Thành công đôi khi không hề khó như ta tưởng."],["他非要离婚，我们谁拦也拦不住。","Tā fēi yào lí hūn, wǒmen shéi lán yě lán bú zhù.","Anh ta nhất quyết đòi ly hôn, ai trong chúng tôi can cũng không được."],["我本不想提这件事，你又何必非要我说出来呢？","Wǒ běn bù xiǎng tí zhè jiàn shì, nǐ yòu hébì fēi yào wǒ shuō chūlai ne?","Tôi vốn không muốn nhắc chuyện này, cần gì cậu cứ phải bắt tôi nói ra chứ?"],["有些家长已经习惯了这种竞争，非让自家的孩子考第一名不可。","Yǒuxiē jiāzhǎng yǐjīng xíguànle zhè zhǒng jìngzhēng, fēi ràng zìjiā de háizi kǎo dì-yī míng bùkě.","Một số phụ huynh đã quen với kiểu cạnh tranh này, nhất định bắt con mình phải thi đứng thứ nhất."],["补办学生证的事非你本人去不可。","Bǔbàn xuéshēngzhèng de shì fēi nǐ běnrén qù bùkě.","Việc làm lại thẻ sinh viên thì nhất định phải chính bạn đi."]],"d":[["门口的牌子上写着：____工作人员请勿入内。","非"],["世界上并____只有人类才会骗人，动物也会。","非"],["听说你住院了，他____来看看你不可。","非"],["补办学生证的事____你本人去不可。","非"]],"w":"Đừng quên 不可 trong cấu trúc 非……不可 (khẩu ngữ đôi khi bỏ 不可: 他非要去). 而非/并非 mang sắc thái văn viết, tương đương 而不是/并不是."},{"id":"linshi_zanshi","t":"临时 vs 暂时","s":"đến lúc, tạm thời – tạm thời, trong thời gian ngắn","b":"<b>临时</b> và <b>暂时</b> đều có nghĩa “<b>trong thời gian ngắn</b>” (短时间内), trong trường hợp này có thể thay thế cho nhau: 没找到满意的房子前，我临时/暂时借住在朋友家里。","r":["临时 biểu thị “临到事情发生的时候” (<i>đến lúc sự việc xảy ra mới…</i>, tức thời, bất chợt): 早到了30分钟，所以我临时决定去旁边的书店看看。 — 暂时 không có nghĩa này.","暂时 biểu thị một khoảng thời gian tương đối gần, không xác định cụ thể (<i>tạm thời, trước mắt</i>): 这套房子我很喜欢，暂时还不打算卖掉。 — 临时 không có nghĩa này.","临时 còn làm <b>từ thuộc tính</b> (属性词), nghĩa là ngắn hạn, không chính thức: 临时工作, 临时的家 — 暂时 không có cách dùng này."],"e":[["没找到满意的房子前，我临时/暂时借住在朋友家里。","Méi zhǎodào mǎnyì de fángzi qián, wǒ línshí/zànshí jièzhù zài péngyou jiā li.","Trước khi tìm được căn nhà ưng ý, tôi tạm thời ở nhờ nhà bạn."],["早到了30分钟，所以我临时决定去旁边的书店看看。","Zǎo dàole sānshí fēnzhōng, suǒyǐ wǒ línshí juédìng qù pángbiān de shūdiàn kànkan.","Đến sớm 30 phút nên tôi quyết định ngay lúc đó ghé hiệu sách bên cạnh xem một chút."],["这套房子我很喜欢，暂时还不打算卖掉。","Zhè tào fángzi wǒ hěn xǐhuan, zànshí hái bù dǎsuàn màidiào.","Tôi rất thích căn nhà này, trước mắt chưa định bán."],["麻烦你春节后帮刘方的女儿找份临时工作。","Máfan nǐ Chūn Jié hòu bāng Liú Fāng de nǚ'ér zhǎo fèn línshí gōngzuò.","Phiền anh sau Tết giúp con gái của Lưu Phương tìm một công việc tạm thời."]],"d":[["我们租下了一所房子作为____的家。","临时"],["演出结束，我想____休息一段时间，考虑一下明年的工作。","暂时"],["公司遇到一些____的困难，我们正在积极想办法。","暂时"],["这件事你____先不要告诉他。","暂时"]],"w":"Mẹo: “đến lúc mới quyết/ứng biến” hoặc đứng trước danh từ (临时工作, 临时的家) → 临时; “trước mắt, tạm thời trong một thời gian” (暂时还不……, 暂时休息) → 暂时."}],"ext":[["挂号","guà hào","đăng ký khám, lấy số"],["急诊","jízhěn","cấp cứu"],["救护车","jiùhùchē","xe cứu thương"],["内科","nèikē","khoa nội"],["过敏","guòmǐn","dị ứng"],["打喷嚏","dǎ pēntì","hắt hơi"],["着凉","zháo liáng","bị cảm lạnh"],["吐","tù","nôn, ói"],["痒","yǎng","ngứa"],["消化","xiāohuà","tiêu hoá"]],"extt":"医务1","notes":"Nguồn cuối bài khoá: 改编自《北京青年报》，作者：臧恒佳. Bài khoá 627 chữ, 4 đoạn trong sách, chia thành 3 phần: đoạn 1–2 (từ 1–17) / đoạn 3 (từ 18–29) / đoạn 4 (từ 30–41; đoạn này tràn từ tr.147 sang tr.148). Bài không có mục 专名. Từ mới số 4, 5, 6, 14, 17, 19, 26, 36, 37 có dấu * (ngoài đề cương). Pinyin từ 22 chép theo sách là “dá dào” (có cách); pinyin 苗条 theo sách là miáotiáo. Khoảng tuổi “25-62” trong sách in bằng dấu gạch ngang. Một số câu bài khoá dài >45 chữ nhưng không có ；nên giữ nguyên một câu; câu duy nhất có ；(đoạn 3) được cắt thành 2 dòng. Phần 注释 gồm 3 mục 词语例释 (即, 个别, 非) và 1 词语辨析 (临时—暂时). Drill của 即 và 非 lấy từ 练一练 (bài viết lại câu) của sách, đổi thành dạng điền khuyết, đáp án do người soạn giải; drill của 个别 đặt dựa trên câu ví dụ của sách vì 练一练 là bài hoàn thành câu mở; drill của 临时—暂时 lấy từ 做一做 (câu (1) sách đã cho đáp án 临时). vocab_ex của 报道, 总共, 可靠, 达到, 明显, 借口, 采取 lấy từ câu bài 练习 của sách (đã điền đáp án); của 即, 个别, 临时, 非 lấy từ phần 注释; còn lại trích câu/vế câu trong bài khoá. Bảng 扩展 (医务1) trong sách chỉ có chữ Hán + pinyin, nghĩa tiếng Việt do người soạn bổ sung.","order":[{"z":"对这些志愿者的跟踪调查时间最短为15天，最长为330天。","t":["对","这些","志愿者","的","跟踪调查","时间","最短","为","15","天","最长","为","330","天"],"v":"Thời gian theo dõi những tình nguyện viên này ngắn nhất là 15 ngày, dài nhất là 330 ngày."},{"z":"旦”是象形字，即太阳从地平线上升起。","t":["旦","是","象形字","即","太阳","从","地平线","上","升起"],"v":"“旦” là chữ tượng hình, tức là mặt trời mọc lên từ đường chân trời."},{"z":"他经常采取个别谈话的方式了解情况和解决问题。","t":["他","经常","采取","个别谈话","的","方式","了解","情况","和","解决问题"],"v":"Anh ấy thường dùng cách nói chuyện riêng để nắm tình hình và giải quyết vấn đề."},{"z":"天气预报说今晚有小到中雨，个别地区可能有大雨。","t":["天气预报","说","今晚","有","小到中雨","个别","地区","可能","有","大雨"],"v":"Dự báo thời tiết nói tối nay có mưa nhỏ đến mưa vừa, một vài khu vực có thể có mưa to."},{"z":"在非语言的交流中，眼睛起着重要的作用。","t":["在","非","语言","的","交流","中","眼睛","起着","重要","的","作用"],"v":"Trong giao tiếp phi ngôn ngữ, đôi mắt đóng vai trò quan trọng."},{"z":"成功有时候并非想象中那么难。","t":["成功","有时候","并非","想象","中","那么","难"],"v":"Thành công đôi khi không hề khó như ta tưởng."},{"z":"他非要离婚，我们谁拦也拦不住。","t":["他","非要","离婚","我们","谁","拦","也","拦不住"],"v":"Anh ta nhất quyết đòi ly hôn, ai trong chúng tôi can cũng không được."},{"z":"我本不想提这件事，你又何必非要我说出来呢？","t":["我本","不想","提","这件","事","你","又","何必","非要","我","说","出来","呢"],"v":"Tôi vốn không muốn nhắc chuyện này, cần gì cậu cứ phải bắt tôi nói ra chứ?"},{"z":"补办学生证的事非你本人去不可。","t":["补办","学生证","的","事","非","你","本人","去","不可"],"v":"Việc làm lại thẻ sinh viên thì nhất định phải chính bạn đi."},{"z":"没找到满意的房子前，我临时/暂时借住在朋友家里。","t":["没","找到","满意","的","房子","前","我","临时","/","暂时","借住","在","朋友","家里"],"v":"Trước khi tìm được căn nhà ưng ý, tôi tạm thời ở nhờ nhà bạn."},{"z":"早到了30分钟，所以我临时决定去旁边的书店看看。","t":["早到","了","30","分钟","所以","我","临时","决定","去","旁边","的","书店","看看"],"v":"Đến sớm 30 phút nên tôi quyết định ngay lúc đó ghé hiệu sách bên cạnh xem một chút."},{"z":"这套房子我很喜欢，暂时还不打算卖掉。","t":["这套","房子","我","很","喜欢","暂时","还","不","打算","卖掉"],"v":"Tôi rất thích căn nhà
