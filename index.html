ì việc làm ăn của tôi coi như xong."},{"h":"维持","p":"wéichí","v":"duy trì, giữ lại","k":"đgt.","x":1,"ez":"还有一个很重要的原因，就是维持这种书店饱和的“生态”，避免更多、更强的对手来“插足”。","ev":"Còn một lý do rất quan trọng nữa, đó là duy trì “hệ sinh thái” đã bão hòa hiệu sách như thế này, tránh để nhiều đối thủ hơn, mạnh hơn “chen chân” vào."},{"h":"饱和","p":"bǎohé","v":"làm bão hòa","k":"đgt.","x":1,"ez":"还有一个很重要的原因，就是维持这种书店饱和的“生态”，避免更多、更强的对手来“插足”。","ev":"Còn một lý do rất quan trọng nữa, đó là duy trì “hệ sinh thái” đã bão hòa hiệu sách như thế này, tránh để nhiều đối thủ hơn, mạnh hơn “chen chân” vào."},{"h":"不见得","p":"bújiàndé","v":"chưa chắc, không nhất thiết","k":"phó.","x":0,"ez":"我把其他三家都挤垮了，不见得是件好事。","ev":"Tôi chèn cho ba hiệu kia sập hết thì chưa chắc đã là chuyện tốt."}]],"texts":[{"no":1,"tz":"","tv":"","lines":[{"s":"","z":"建伟在大学的一座公寓楼里开了一家书店，顺便卖点儿文具、电池、小日用品等。","p":"Jiànwěi zài dàxué de yí zuò gōngyù lóu li kāile yì jiā shūdiàn, shùnbiàn mài diǎnr wénjù, diànchí, xiǎo rìyòngpǐn děng.","v":"Kiến Vĩ mở một hiệu sách trong một tòa nhà ở của trường đại học, tiện thể bán thêm ít đồ dùng văn phòng, pin và đồ dùng lặt vặt hằng ngày.","b":0},{"s":"","z":"一年多来，虽然每件商品的利润都并不高，但他诚信经营，薄利多销，使书店生意越来越红火，甚至成为了媒体的采访对象。","p":"Yì nián duō lái, suīrán měi jiàn shāngpǐn de lìrùn dōu bìng bù gāo, dàn tā chéngxìn jīngyíng, bólì-duōxiāo, shǐ shūdiàn shēngyi yuè lái yuè hónghuo, shènzhì chéngwéile méitǐ de cǎifǎng duìxiàng.","v":"Hơn một năm qua, tuy lãi trên mỗi món hàng đều không cao, nhưng anh kinh doanh trung thực, lãi ít bán nhiều, khiến việc buôn bán của hiệu sách ngày càng phát đạt, thậm chí còn trở thành đối tượng phỏng vấn của giới truyền thông.","b":0},{"s":"","z":"这个大学里另外还有三家书店，由于受到了建伟书店的影响，这三家书店的经营空间越来越小，三家的营业额加起来还不如他一家高。","p":"Zhège dàxué li lìngwài hái yǒu sān jiā shūdiàn, yóuyú shòudàole Jiànwěi shūdiàn de yǐngxiǎng, zhè sān jiā shūdiàn de jīngyíng kōngjiān yuè lái yuè xiǎo, sān jiā de yíngyè'é jiā qilai hái bùrú tā yì jiā gāo.","v":"Trong trường đại học này còn có ba hiệu sách khác; do bị hiệu sách của Kiến Vĩ ảnh hưởng, không gian kinh doanh của ba hiệu này ngày càng thu hẹp, doanh thu của cả ba cộng lại còn không cao bằng một mình hiệu của anh.","b":0},{"s":"","z":"建伟成了这里的“书店老大”。","p":"Jiànwěi chéngle zhèlǐ de “shūdiàn lǎodà”.","v":"Kiến Vĩ trở thành “anh cả ngành sách” ở nơi đây.","b":0},{"s":"","z":"这时，许多亲朋好友便建议他干脆把另三家书店挤垮，垄断这个市场。","p":"Zhè shí, xǔduō qīnpéng hǎoyǒu biàn jiànyì tā gāncuì bǎ lìng sān jiā shūdiàn jǐkuǎ, lǒngduàn zhège shìchǎng.","v":"Lúc này, nhiều người thân bạn bè liền khuyên anh dứt khoát chèn ép cho ba hiệu sách kia sập tiệm, độc chiếm thị trường này.","b":1},{"s":"","z":"可建伟不但没有去挤垮对手，反而还经常帮助三家书店搞一些营销活动，对于一家快要倒闭的书店，他还主动热心地借给其资金，想办法让他继续经营下去。","p":"Kě Jiànwěi búdàn méiyǒu qù jǐkuǎ duìshǒu, fǎn'ér hái jīngcháng bāngzhù sān jiā shūdiàn gǎo yìxiē yíngxiāo huódòng, duìyú yì jiā kuàiyào dǎobì de shūdiàn, tā hái zhǔdòng rèxīn de jiè gěi qí zījīn, xiǎng bànfǎ ràng tā jìxù jīngyíng xiaqu.","v":"Nhưng Kiến Vĩ không những không chèn ép đối thủ, trái lại còn thường xuyên giúp ba hiệu sách kia tổ chức các hoạt động tiếp thị; với một hiệu sách sắp phải đóng cửa, anh còn chủ động, nhiệt tình cho họ vay vốn, tìm cách giúp họ tiếp tục kinh doanh.","b":0},{"s":"","z":"有人问他：“你怎么这么傻？就让他们倒霉，不好吗？！”","p":"Yǒu rén wèn tā: “Nǐ zěnme zhème shǎ? Jiù ràng tāmen dǎoméi, bù hǎo ma?!”","v":"Có người hỏi anh: “Sao anh lại dại dột thế? Cứ để họ gặp xui xẻo, chẳng phải tốt hơn sao?!”","b":0},{"s":"","z":"建伟说，我是在保持这一地区图书市场的“生态平衡”。","p":"Jiànwěi shuō, wǒ shì zài bǎochí zhè yí dìqū túshū shìchǎng de “shēngtài pínghéng”.","v":"Kiến Vĩ nói, tôi đang giữ “cân bằng sinh thái” cho thị trường sách ở khu vực này.","b":1},{"s":"","z":"商业领域其实和自然界一样，自然界中的生物，适当有一些“敌人”，会促使它们生长得更好；","p":"Shāngyè lǐngyù qíshí hé zìránjiè yíyàng, zìránjiè zhōng de shēngwù, shìdàng yǒu yìxiē “dírén”, huì cùshǐ tāmen shēngzhǎng de gèng hǎo;","v":"Lĩnh vực thương mại thật ra cũng giống như giới tự nhiên: sinh vật trong tự nhiên nếu có một vài “kẻ thù” ở mức vừa phải thì sẽ được thúc đẩy để sinh trưởng tốt hơn;","b":0},{"s":"","z":"同样的，对手并不会妨碍我的发展，反而会促进经营，让我获得更多利益。","p":"tóngyàng de, duìshǒu bìng bú huì fáng'ài wǒ de fāzhǎn, fǎn'ér huì cùjìn jīngyíng, ràng wǒ huòdé gèng duō lìyì.","v":"tương tự như vậy, đối thủ không hề cản trở sự phát triển của tôi, trái lại còn thúc đẩy việc kinh doanh, giúp tôi thu được nhiều lợi ích hơn.","b":0},{"s":"","z":"一个原因是这样能创造让客户有所比较和优中选优的购物环境，通过比较，学生们才知道我的书店服务好、品种优、价格合理。","p":"Yí ge yuányīn shì zhèyàng néng chuàngzào ràng kèhù yǒusuǒ bǐjiào hé yōu zhōng xuǎn yōu de gòuwù huánjìng, tōngguò bǐjiào, xuéshengmen cái zhīdào wǒ de shūdiàn fúwù hǎo, pǐnzhǒng yōu, jiàgé hélǐ.","v":"Một lý do là làm như vậy sẽ tạo ra môi trường mua sắm để khách hàng có cái mà so sánh, chọn cái tốt nhất trong những cái tốt; qua so sánh, sinh viên mới biết hiệu sách của tôi phục vụ tốt, hàng hóa chất lượng, giá cả hợp lý.","b":0},{"s":"","z":"如果只有我一家书店了，学生们没有了比较，价格定得再低也会认为我的书价高，万一他们自己跑到其他图书市场去“货比三家”，那我的生意就完了。","p":"Rúguǒ zhǐ yǒu wǒ yì jiā shūdiàn le, xuéshengmen méiyǒule bǐjiào, jiàgé dìng de zài dī yě huì rènwéi wǒ de shūjià gāo, wànyī tāmen zìjǐ pǎodào qítā túshū shìchǎng qù “huò bǐ sān jiā”, nà wǒ de shēngyi jiù wán le.","v":"Nếu chỉ còn mỗi hiệu sách của tôi, sinh viên không còn gì để so sánh, thì giá tôi đặt thấp đến đâu họ cũng sẽ cho là sách của tôi đắt; lỡ như họ tự chạy sang chợ sách khác để “so hàng ba nhà”, thì việc làm ăn của tôi coi như xong.","b":0},{"s":"","z":"还有一个很重要的原因，就是维持这种书店饱和的“生态”，避免更多、更强的对手来“插足”。","p":"Hái yǒu yí ge hěn zhòngyào de yuányīn, jiù shì wéichí zhè zhǒng shūdiàn bǎohé de “shēngtài”, bìmiǎn gèng duō, gèng qiáng de duìshǒu lái “chāzú”.","v":"Còn một lý do rất quan trọng nữa, đó là duy trì “hệ sinh thái” đã bão hòa hiệu sách như thế này, tránh để nhiều đối thủ hơn, mạnh hơn “chen chân” vào.","b":0},{"s":"","z":"我把其他三家都挤垮了，不见得是件好事，因为别人一看这么大的地方只有我一家书店，新的书店可能就会出现，弄不好来一个比我更强的对手。","p":"Wǒ bǎ qítā sān jiā dōu jǐkuǎ le, bújiàndé shì jiàn hǎoshì, yīnwèi biéren yí kàn zhème dà de dìfang zhǐ yǒu wǒ yì jiā shūdiàn, xīn de shūdiàn kěnéng jiù huì chūxiàn, nòng bu hǎo lái yí ge bǐ wǒ gèng qiáng de duìshǒu.","v":"Tôi chèn cho ba hiệu kia sập hết thì chưa chắc đã là chuyện tốt, vì người khác thấy một nơi rộng thế này mà chỉ có mỗi hiệu sách của tôi, có thể sẽ mở hiệu sách mới, không khéo lại xuất hiện một đối thủ còn mạnh hơn tôi.","b":0},{"s":"","z":"所以，为了保持目前这种经营的“生态平衡”，我要继续把对手培养好。","p":"Suǒyǐ, wèile bǎochí mùqián zhè zhǒng jīngyíng de “shēngtài pínghéng”, wǒ yào jìxù bǎ duìshǒu péiyǎng hǎo.","v":"Vì vậy, để giữ được “sự cân bằng sinh thái” trong kinh doanh như hiện nay, tôi phải tiếp tục bồi dưỡng tốt cho đối thủ của mình.","b":0}]}],"aud":[{"v":"audio/29-2.mp3","t":"audio/29-1.mp3"}],"gram":[{"id":"buru","t":"不如","s":"không bằng, thua (động từ)","b":"<b>不如</b> là <b>động từ</b>, biểu thị <b>không bằng, thua kém</b> (比不上). Thường dùng theo mẫu <b>A 不如 B</b> (+ tính từ): A kém B về mặt nào đó.","r":["<b>A 不如 B</b>: A không bằng B — 求人不如求己。","<b>A 不如 B + tính từ</b>: nói rõ mặt so sánh — 三家的营业额加起来还不如他一家高。","Có thể làm định ngữ: 棋艺<b>不如你</b>的人 (người chơi cờ kém hơn bạn).","Trong 练一练/练习, 不如 còn dùng để đưa ra đề xuất tốt hơn: …，<b>不如</b>我们周末去看看吧。"],"e":[["求人不如求己。","Qiú rén bùrú qiú jǐ.","Nhờ người không bằng tự lực."],["……由于受到了建伟书店的影响，这三家书店的经营空间越来越小，三家的营业额加起来还不如他一家高。","……Yóuyú shòudàole Jiànwěi shūdiàn de yǐngxiǎng, zhè sān jiā shūdiàn de jīngyíng kōngjiān yuè lái yuè xiǎo, sān jiā de yíngyè'é jiā qilai hái bùrú tā yì jiā gāo.","…Do bị hiệu sách của Kiến Vĩ ảnh hưởng, không gian kinh doanh của ba hiệu này ngày càng thu hẹp, doanh thu của cả ba cộng lại còn không cao bằng một mình hiệu của anh. <i>(bài khoá)</i>"],["如果找一个棋艺不如你或者和你差不多的人下棋，虽然你可能会轻易地战胜对手，但并不能使你的棋艺得到提高。","Rúguǒ zhǎo yí ge qíyì bùrú nǐ huòzhě hé nǐ chàbuduō de rén xià qí, suīrán nǐ kěnéng huì qīngyì de zhànshèng duìshǒu, dàn bìng bù néng shǐ nǐ de qíyì dédào tígāo.","Nếu tìm một người chơi cờ kém hơn hoặc ngang ngửa bạn để đánh, tuy bạn có thể dễ dàng thắng đối thủ, nhưng điều đó không giúp trình độ cờ của bạn được nâng lên."]],"d":[["她的汉语说得很好，我的发音____她。","不如"],["听说展览馆最近有个小人书展，____我们周末去看看吧。","不如"],["今天阳光真好，在房间睡觉____出去走走。","不如"]],"w":"Mẫu A 不如 B: A là bên <b>kém hơn</b>. 我不如他高 = tôi không cao bằng anh ấy (anh ấy cao hơn)."},{"id":"gancui","t":"干脆","s":"dứt khoát; cứ, thôi thì (tính từ / phó từ)","b":"<b>干脆</b> có hai cách dùng. Làm <b>tính từ</b>: tả cách nói năng, làm việc <b>nhanh gọn, dứt khoát, không do dự</b> (痛快、不犹豫). Làm <b>phó từ</b>: biểu thị <b>làm luôn một cách đơn giản, quả quyết</b> (简单、果断地), đứng trước động từ.","r":["Tính từ, làm vị ngữ/bổ ngữ: 他这人很<b>干脆</b>；他答应得很<b>干脆</b>。","Phó từ, đứng trước động từ: 我看我<b>干脆</b>放弃好了。","Phó từ 干脆 thường xuất hiện khi người nói chán cách cũ và chọn luôn giải pháp triệt để: 建议他<b>干脆</b>把另三家书店挤垮。"],"e":[["他这人很干脆，说行就行，说不行就不行。","Tā zhè rén hěn gāncuì, shuō xíng jiù xíng, shuō bù xíng jiù bù xíng.","Anh ta là người rất dứt khoát, nói được là được, nói không là không."],["我求他帮忙，他答应得很干脆。","Wǒ qiú tā bāngmáng, tā dāying de hěn gāncuì.","Tôi nhờ anh ấy giúp, anh ấy nhận lời rất dứt khoát."],["我已经试了六次了，还是不行，我看我干脆放弃好了。","Wǒ yǐjīng shìle liù cì le, háishi bù xíng, wǒ kàn wǒ gāncuì fàngqì hǎo le.","Tôi thử sáu lần rồi mà vẫn không được, tôi thấy thôi cứ bỏ luôn cho xong."],["这时，许多亲朋好友便建议他干脆把另三家书店挤垮，垄断这个市场。","Zhè shí, xǔduō qīnpéng hǎoyǒu biàn jiànyì tā gāncuì bǎ lìng sān jiā shūdiàn jǐkuǎ, lǒngduàn zhège shìchǎng.","Lúc này, nhiều người thân bạn bè liền khuyên anh dứt khoát chèn ép cho ba hiệu sách kia sập tiệm, độc chiếm thị trường này. <i>(bài khoá)</i>"]],"d":[["他上周迟到，这周____不来了？！","干脆"],["我求他帮忙，他答应得很____。","干脆"],["这件事你已经考虑了一个月了，____做个决定吧？","干脆"]],"w":"Tính từ 干脆 đứng sau 很/得 (很干脆、答应得很干脆); phó từ 干脆 đứng ngay trước động từ (干脆放弃)."},{"id":"wanyi","t":"万一","s":"lỡ như, ngộ nhỡ (liên từ / danh từ)","b":"<b>万一</b> làm <b>liên từ</b>: biểu thị khả năng rất nhỏ, thường dùng cho tình huống <b>bất ngờ hoặc bất lợi</b>. 万一 cũng làm <b>danh từ</b>: chỉ <b>tình huống bất trắc</b> khả năng xảy ra rất nhỏ, thường dùng trong các cụm cố định <b>就怕万一</b>, <b>以防万一</b>.","r":["Liên từ, mở đầu vế giả định, vế sau thường có 就/那: 万一……，那……就…… — 万一他们……去“货比三家”，那我的生意就完了。","Thường đi với việc không mong muốn: 万一不小心、万一下雨、万一受伤…","Danh từ, trong cụm cố định: 不怕一万，就怕万一；以防万一。"],"e":[["……万一他们自己跑到其他图书市场去“货比三家”，那我的生意就完了。","……Wànyī tāmen zìjǐ pǎodào qítā túshū shìchǎng qù “huò bǐ sān jiā”, nà wǒ de shēngyi jiù wán le.","…Lỡ như họ tự chạy sang chợ sách khác để “so hàng ba nhà”, thì việc làm ăn của tôi coi như xong. <i>(bài khoá)</i>"],["不要将所有的鸡蛋都放在一个篮子里，因为万一不小心，鸡蛋就有可能全部打碎。","Búyào jiāng suǒyǒu de jīdàn dōu fàng zài yí ge lánzi li, yīnwèi wànyī bù xiǎoxīn, jīdàn jiù yǒu kěnéng quánbù dǎsuì.","Đừng bỏ tất cả trứng vào một giỏ, vì lỡ không cẩn thận thì có thể vỡ hết."],["不怕一万，就怕万一。","Bú pà yíwàn, jiù pà wànyī.","Không sợ mười nghìn lần bình thường, chỉ sợ một lần bất trắc."],["她总是带着一把枪，以防万一。","Tā zǒngshì dàizhe yì bǎ qiāng, yǐ fáng wànyī.","Cô ấy lúc nào cũng mang theo một khẩu súng để phòng bất trắc."]],"d":[["你小心一点，____受伤就麻烦了。","万一"],["我们还是早点出发吧，____堵车就来不及了。","万一"],["带上伞吧，以防____。","万一"]],"w":"万一 chỉ khả năng <b>rất nhỏ</b> và thường là chuyện <b>không hay</b>; với giả định bình thường thì dùng 如果."},{"id":"ji_yongji","t":"挤 vs 拥挤","s":"chen, ép / chen chúc, đông đúc — phân biệt","b":"<b>挤</b> và <b>拥挤</b> đều có thể làm <b>động từ</b> và <b>tính từ</b>; khi là tính từ, cả hai đều có nghĩa <b>chỗ thì nhỏ mà người hoặc đồ vật thì nhiều</b> (chật chội, đông đúc). Ví dụ: 这么小的教室里放三十张桌子，太挤/拥挤了！","r":["Động từ — <b>挤</b>: nhấn mạnh dùng sức để bản thân <b>chen qua đám đông</b> (我挤了半天才挤上车); <b>拥挤</b>: nhấn mạnh <b>chen chúc vào nhau</b> (不要拥挤).","<b>挤</b> thường làm <b>vị ngữ</b> (我挤得满头大汗); <b>拥挤</b> có thể làm <b>chủ ngữ hoặc tân ngữ</b> (交通拥挤是个大问题).","Chỉ <b>挤</b>: dùng sức <b>bóp/nặn</b> cho vật ra khỏi lỗ nhỏ hay khe hẹp — 牙膏用完了，已经挤不出来了。","Chỉ <b>挤</b>: người/vật <b>sát vào nhau</b>, hoặc việc <b>dồn vào cùng một khoảng thời gian</b> — 生活先被不重要的事挤满了。","Chỉ <b>挤</b>: có nghĩa <b>排挤</b> (páijǐ, loại trừ, chèn ép) — 把另三家书店挤垮。拥挤 không có nghĩa này."],"e":[["这么小的教室里放三十张桌子，太挤/拥挤了！","Zhème xiǎo de jiàoshì li fàng sānshí zhāng zhuōzi, tài jǐ/yōngjǐ le!","Lớp học nhỏ thế này mà kê ba mươi cái bàn, chật quá!"],["坐车的人太多了，我挤了半天才挤上车。","Zuò chē de rén tài duō le, wǒ jǐle bàntiān cái jǐ shang chē.","Người đi xe đông quá, tôi chen mãi mới lên được xe."],["请先下后上，不要拥挤。","Qǐng xiān xià hòu shàng, búyào yōngjǐ.","Xin mời xuống trước lên sau, đừng chen lấn."],["为了买到票，我挤得满头大汗！","Wèile mǎidào piào, wǒ jǐ de mǎn tóu dà hàn!","Để mua được vé, tôi chen đến toát mồ hôi đầy đầu!"],["交通拥挤是个大问题。","Jiāotōng yōngjǐ shì ge dà wèntí.","Ùn tắc giao thông là một vấn đề lớn."],["牙膏用完了，已经挤不出来了。","Yágāo yòngwán le, yǐjīng jǐ bu chūlái le.","Kem đánh răng hết rồi, không nặn ra được nữa."],["如果你的生活先被不重要的事挤满了，那你就无法再装进更大、更重要的事了。","Rúguǒ nǐ de shēnghuó xiān bèi bú zhòngyào de shì jǐmǎn le, nà nǐ jiù wúfǎ zài zhuāngjìn gèng dà, gèng zhòngyào de shì le.","Nếu cuộc sống của bạn đã bị những việc không quan trọng lấp kín trước, thì bạn không thể chứa thêm những việc lớn hơn, quan trọng hơn nữa."],["许多亲朋好友便建议他干脆把另三家书店挤垮，垄断这个市场。","Xǔduō qīnpéng hǎoyǒu biàn jiànyì tā gāncuì bǎ lìng sān jiā shūdiàn jǐkuǎ, lǒngduàn zhège shìchǎng.","Nhiều người thân bạn bè liền khuyên anh dứt khoát chèn ép cho ba hiệu sách kia sập tiệm, độc chiếm thị trường này. <i>(bài khoá)</i>"]],"d":[["所有的事都____在这一个星期了。","挤"],["由于人群____，有人受了伤。","拥挤"],["他假装伤心，____出了两滴眼泪。","挤"],["周末这家商场里虽然人很多，但并不____。","拥挤 / 挤"]],"w":"Nghĩa “nặn, bóp ra”, “dồn vào”, “chèn ép đối thủ” chỉ dùng <b>挤</b>; cần danh từ hóa làm chủ ngữ/tân ngữ (交通拥挤、避免拥挤) thì dùng <b>拥挤</b>."}],"ext":[["发票","fāpiào","hóa đơn"],["收据","shōujù","biên lai"],["支票","zhīpiào","séc, chi phiếu"],["欠","qiàn","nợ, thiếu"],["税","shuì","thuế"],["市场","shìchǎng","thị trường, chợ"],["执照","zhízhào","giấy phép"],["柜台","guìtái","quầy hàng"],["商品","shāngpǐn","hàng hóa"],["优惠","yōuhuì","ưu đãi"],["讨价还价","tǎojià-huánjià","mặc cả, trả giá"],["兑换","duìhuàn","đổi, quy đổi"],["投资","tóuzī","đầu tư"],["分配","fēnpèi","phân phối, phân chia"]],"extt":"经济1","notes":"Nguồn cuối bài khoá: 改编自《小故事大道理》，作者：宗先哲. Bài khoá 652 chữ (theo sách), 4 đoạn văn (tr.96–98), chia 3 phần: đoạn 1 (từ 1–13 + 专名 建伟) / đoạn 2–3 (từ 14–22) / đoạn 4 (từ 23–36). Phần 3 dài hơn vì đoạn 4 trong sách là một đoạn văn liền, không cắt giữa đoạn. Câu “商业领域其实……；同样的……” được cắt tại dấu ；. Các câu “一年多来……”, “这个大学里……”, “可建伟不但……”, “一个原因是……”, “如果只有我……”, “我把其他三家……” dài hơn 45 chữ nhưng không có ； nên giữ nguyên một dòng; lời thoại “有人问他：“你怎么这么傻？就让他们倒霉，不好吗？！”” giữ làm một dòng. OCR đọc nhầm “挤垮了” thành “挤了” (tr.98) — đã soát ảnh, sách in “挤垮了”. Từ số 8, 12, 16, 17, 18, 23, 26, 34, 35 có dấu * (ngoài đề cương). Pinyin, từ loại, nghĩa Việt chép theo sách (giữ cách viết của sách: 倒霉 “dǎo méi”; 生态 nghĩa sách ghi “sinh thái học”; 28 生长 sách ghi “sinh trưởng”). 专名 建伟 nghĩa sách: “Kiến Vĩ (tên người)”. Phần 注释 gồm 3 mục 词语例释 (不如, 干脆, 万一) và 1 词语辨析 (挤—拥挤); bảng 词语搭配 (培养/促使/妨碍/促进 + tân ngữ; 一套/一间/一所 公寓; 一节/一块 电池; 资金 不足/紧张; 价格/收费/方法/建议/结构/设计 合理) không đưa vào schema. Drill: 不如 câu 1 từ 练习2①, câu 2 từ 练习3① (đáp án C); 干脆 câu 1 từ 练习3② (đáp án D); 万一 câu 1 từ 练习3③ (đáp án C); 挤 vs 拥挤 lấy từ 做一做 (câu (1) sách đã cho đáp án 挤; câu (2)(3)(4) do người soạn giải, câu (4) cả 挤 và 拥挤 đều dùng được như tính từ); các drill còn lại đặt theo câu ví dụ/đề 练一练 của sách (练一练 là bài hoàn thành câu mở). Đáp án 练习 (người soạn giải): 练习1 ①妨碍 ②电池 ③培养 ④利润 ⑤不见得 ⑥资金; 练习2 ①A ②B ③B ④A; 练习3 ①C ②D ③C ④C. Đáp án 做一做 phần 扩展: (1)收据 (2)税 (3)讨价还价 (4)分配. vocab_ex của 电池, 利润, 资金, 妨碍 lấy từ 练习1 (đã điền đáp án); còn lại trích nguyên câu (hoặc vế câu) bài khoá. Bảng 扩展 (话题 经济1) sách chỉ có chữ Hán + pinyin, nghĩa tiếng Việt do người soạn bổ sung. Không có chỗ nào mờ/không đọc được.","order":[{"z":"建伟成了这里的“书店老大”。","t":["建伟成","了","这里","的","书店","老大"],"v":"Kiến Vĩ trở thành “anh cả ngành sách” ở nơi đây."},{"z":"有人问他：“你怎么这么傻？","t":["有人","问","他","你","怎么","这么","傻"],"v":"Có người hỏi anh: “Sao anh lại dại dột thế? Cứ để họ gặp xui xẻo, chẳng phải tốt hơn sao?!”"},{"z":"就让他们倒霉，不好吗？","t":["就让","他们","倒霉","不好","吗"],"v":"Có người hỏi anh: “Sao anh lại dại dột thế? Cứ để họ gặp xui xẻo, chẳng phải tốt hơn sao?!”"},{"z":"建伟说，我是在保持这一地区图书市场的“生态平衡”。","t":["建伟","说","我","是","在","保持","这一","地区","图书市场","的","生态平衡"],"v":"Kiến Vĩ nói, tôi đang giữ “cân bằng sinh thái” cho thị trường sách ở khu vực này."},{"z":"我求他帮忙，他答应得很干脆。","t":["我求","他","帮忙","他","答应","得","很","干脆"],"v":"Tôi nhờ anh ấy giúp, anh ấy nhận lời rất dứt khoát."},{"z":"不怕一万，就怕万一。","t":["不怕","一万","就","怕","万一"],"v":"Không sợ mười nghìn lần bình thường, chỉ sợ một lần bất trắc."},{"z":"她总是带着一把枪，以防万一。","t":["她","总是","带","着","一把","枪","以防万一"],"v":"Cô ấy lúc nào cũng mang theo một khẩu súng để phòng bất trắc."},{"z":"坐车的人太多了，我挤了半天才挤上车。","t":["坐车","的","人太多","了","我","挤","了","半天","才","挤","上车"],"v":"Người đi xe đông quá, tôi chen mãi mới lên được xe."},{"z":"请先下后上，不要拥挤。","t":["请","先下","后","上","不要","拥挤"],"v":"Xin mời xuống trước lên sau, đừng chen lấn."},{"z":"为了买到票，我挤得满头大汗！","t":["为了","买到","票","我","挤","得","满头大汗"],"v":"Để mua được vé, tôi chen đến toát mồ hôi đầy đầu!"},{"z":"交通拥挤是个大问题。","t":["交通","拥挤","是","个","大","问题"],"v":"Ùn tắc giao thông là một vấn đề lớn."},{"z":"牙膏用完了，已经挤不出来了。","t":["牙膏","用","完","了","已经","挤","不","出来","了"],"v":"Kem đánh răng hết rồi, không nặn ra được nữa."}]},"30":{"n":30,"tz":"竞争让市场更高效","tv":"Cạnh tranh khiến thị trường phát triển","batches":[[{"h":"沙丁鱼","p":"shādīngyú","v":"cá mòi","k":"dt.","x":1,"ez":"西班牙人特别喜欢吃沙丁鱼。","ev":"Người Tây Ban Nha đặc biệt thích ăn cá mòi."},{"h":"运输","p":"yùnshū","v":"vận chuyển","k":"đgt.","x":0,"ez":"但沙丁鱼对离开大海后的环境极不适应，运输就成了问题。","ev":"Nhưng cá mòi gần như không thể thích nghi với môi trường sau khi rời biển, nên việc vận chuyển trở thành vấn đề."},{"h":"岸","p":"àn","v":"bờ (sông, biển...)","k":"dt.","x":0,"ez":"鱼上岸后，过不了多久就会死去。","ev":"Cá lên bờ chẳng được bao lâu là chết."},{"h":"商品","p":"shāngpǐn","v":"hàng hóa","k":"dt.","x":0,"ez":"而死掉的沙丁鱼口感很差，作为商品销售，价格就会便宜很多。","ev":"Mà cá mòi đã chết thì ăn rất dở, đem bán như hàng hóa thì giá sẽ rẻ đi nhiều."},{"h":"延长","p":"yáncháng","v":"kéo dài","k":"đgt.","x":0,"ez":"为了延长沙丁鱼的存 ":"thi đấu chung kết","k":"đgt.","x":0,"ez":"比如运动员每到参加比赛，尤其是决赛时，一定要将自己调整到接近最佳状态，让自己感到适度的压力，如果他不紧张、没压力感，则不利于出成绩。","ev":"Chẳng hạn, mỗi khi thi đấu, nhất là ở trận chung kết, vận động viên nhất định phải điều chỉnh bản thân đến gần trạng thái tốt nhất, để mình cảm thấy áp lực vừa phải; nếu không hồi hộp, không thấy áp lực thì lại khó đạt thành tích."},{"h":"接近","p":"jiējìn","v":"đến gần, tới gần","k":"đgt.","x":0,"ez":"比如运动员每到参加比赛，尤其是决赛时，一定要将自己调整到接近最佳状态，让自己感到适度的压力，如果他不紧张、没压力感，则不利于出成绩。","ev":"Chẳng hạn, mỗi khi thi đấu, nhất là ở trận chung kết, vận động viên nhất định phải điều chỉnh bản thân đến gần trạng thái tốt nhất, để mình cảm thấy áp lực vừa phải; nếu không hồi hộp, không thấy áp lực thì lại khó đạt thành tích."},{"h":"佳","p":"jiā","v":"tốt, đẹp, hay","k":"tt.","x":1,"ez":"比如运动员每到参加比赛，尤其是决赛时，一定要将自己调整到接近最佳状态，让自己感到适度的压力，如果他不紧张、没压力感，则不利于出成绩。","ev":"Chẳng hạn, mỗi khi thi đấu, nhất là ở trận chung kết, vận động viên nhất định phải điều chỉnh bản thân đến gần trạng thái tốt nhất, để mình cảm thấy áp lực vừa phải; nếu không hồi hộp, không thấy áp lực thì lại khó đạt thành tích."},{"h":"的确","p":"díquè","v":"đích thực, quả thực","k":"phó.","x":0,"ez":"因此，“鲇鱼效应”的确对挖掘员工潜力、提高企业活力具有积极的意义。","ev":"Vì vậy, “hiệu ứng cá nheo” quả thực có ý nghĩa tích cực đối với việc khai thác tiềm năng của nhân viên và nâng cao sức sống của doanh nghiệp."}]],"texts":[{"no":1,"tz":"","tv":"","lines":[{"s":"","z":"西班牙人特别喜欢吃沙丁鱼。","p":"Xībānyárén tèbié xǐhuan chī shādīngyú.","v":"Người Tây Ban Nha đặc biệt thích ăn cá mòi.","b":0},{"s":"","z":"但沙丁鱼对离开大海后的环境极不适应，运输就成了问题。","p":"Dàn shādīngyú duì líkāi dàhǎi hòu de huánjìng jí bú shìyìng, yùnshū jiù chéngle wèntí.","v":"Nhưng cá mòi gần như không thể thích nghi với môi trường sau khi rời biển, nên việc vận chuyển trở thành vấn đề.","b":0},{"s":"","z":"鱼上岸后，过不了多久就会死去。","p":"Yú shàng àn hòu, guò bu liǎo duōjiǔ jiù huì sǐqù.","v":"Cá lên bờ chẳng được bao lâu là chết.","b":0},{"s":"","z":"而死掉的沙丁鱼口感很差，作为商品销售，价格就会便宜很多。","p":"Ér sǐdiào de shādīngyú kǒugǎn hěn chà, zuòwéi shāngpǐn xiāoshòu, jiàgé jiù huì piányi hěn duō.","v":"Mà cá mòi đã chết thì ăn rất dở, đem bán như hàng hóa thì giá sẽ rẻ đi nhiều.","b":0},{"s":"","z":"如果上岸时沙丁鱼还活着，鱼的卖价可以涨很多倍。","p":"Rúguǒ shàng àn shí shādīngyú hái huózhe, yú de màijià kěyǐ zhǎng hěn duō bèi.","v":"Nếu lúc lên bờ cá mòi vẫn còn sống, giá bán có thể tăng lên gấp nhiều lần.","b":0},{"s":"","z":"为了延长沙丁鱼的存活期，减少经济损失，渔民们想了很多办法，但情况仍然没有得到太大的改善。","p":"Wèile yáncháng shādīngyú de cúnhuóqī, jiǎnshǎo jīngjì sǔnshī, yúmínmen xiǎngle hěn duō bànfǎ, dàn qíngkuàng réngrán méiyǒu dédào tài dà de gǎishàn.","v":"Để kéo dài thời gian sống sót của cá mòi, giảm bớt thiệt hại kinh tế, ngư dân đã nghĩ ra rất nhiều cách, nhưng tình hình vẫn không cải thiện được bao nhiêu.","b":0},{"s":"","z":"后来一位渔民无意中发现了一种巧妙而实用的方法：把几条沙丁鱼的天敌鲇鱼放进装鱼的设备中。","p":"Hòulái yí wèi yúmín wúyì zhōng fāxiànle yì zhǒng qiǎomiào ér shíyòng de fāngfǎ: bǎ jǐ tiáo shādīngyú de tiāndí niányú fàngjìn zhuāng yú de shèbèi zhōng.","v":"Về sau, một ngư dân tình cờ phát hiện ra một cách vừa khéo léo vừa thiết thực: thả vài con cá nheo, kẻ thù tự nhiên của cá mòi, vào thiết bị chứa cá.","b":0},{"s":"","z":"因为鲇鱼是食肉鱼，无法和沙丁鱼和平共处，它会四处游动寻找小鱼吃，对沙丁鱼构成威胁。","p":"Yīnwèi niányú shì shíròu yú, wúfǎ hé shādīngyú hépíng gòngchǔ, tā huì sìchù yóudòng xúnzhǎo xiǎo yú chī, duì shādīngyú gòuchéng wēixié.","v":"Vì cá nheo là loài cá ăn thịt, không thể chung sống hòa bình với cá mòi, nó sẽ bơi khắp nơi tìm cá nhỏ để ăn, trở thành mối đe dọa đối với cá mòi.","b":0},{"s":"","z":"为了逃避天敌，沙丁鱼自然会不断地加速游动，从而保持了旺盛的生命力，存活的比例大大提高。","p":"Wèile táobì tiāndí, shādīngyú zìrán huì búduàn de jiāsù yóudòng, cóng'ér bǎochíle wàngshèng de shēngmìnglì, cúnhuó de bǐlì dàdà tígāo.","v":"Để trốn tránh kẻ thù, cá mòi đương nhiên sẽ liên tục bơi nhanh hơn, nhờ đó giữ được sức sống dồi dào, tỷ lệ sống sót tăng lên đáng kể.","b":0},{"s":"","z":"看到这里，你有什么感想和体会呢？","p":"Kàndào zhèlǐ, nǐ yǒu shénme gǎnxiǎng hé tǐhuì ne?","v":"Đọc đến đây, bạn có cảm nghĩ và rút ra được điều gì không?","b":1},{"s":"","z":"其实，这在经济学上被称为“鲇鱼效应”。","p":"Qíshí, zhè zài jīngjìxué shang bèi chēngwéi “niányú xiàoyìng”.","v":"Thật ra, trong kinh tế học, hiện tượng này được gọi là “hiệu ứng cá nheo”.","b":0},{"s":"","z":"鲇鱼效应对于市场经济以及现代企业管理都有着重要的启发作用。","p":"Niányú xiàoyìng duìyú shìchǎng jīngjì yǐjí xiàndài qǐyè guǎnlǐ dōu yǒuzhe zhòngyào de qǐfā zuòyòng.","v":"Hiệu ứng cá nheo mang lại những gợi mở quan trọng cho cả kinh tế thị trường lẫn công tác quản trị doanh nghiệp hiện đại.","b":0},{"s":"","z":"这个概念的核心是：一个市场如果能采取一种措施，刺激企业活跃起来，就能使企业获得足够的活力，在市场中积极参与竞争而不至于落后，同时这样反过来又能促使市场更为高效。","p":"Zhège gàiniàn de héxīn shì: yí ge shìchǎng rúguǒ néng cǎiqǔ yì zhǒng cuòshī, cìjī qǐyè huóyuè qǐlai, jiù néng shǐ qǐyè huòdé zúgòu de huólì, zài shìchǎng zhōng jījí cānyù jìngzhēng ér bú zhìyú luòhòu, tóngshí zhèyàng fǎnguòlai yòu néng cùshǐ shìchǎng gèng wéi gāoxiào.","v":"Cốt lõi của khái niệm này là: nếu một thị trường áp dụng được biện pháp kích thích doanh nghiệp trở nên năng động, thì doanh nghiệp sẽ có đủ sức sống để tích cực tham gia cạnh tranh mà không đến nỗi bị tụt lại phía sau; đồng thời, điều đó ngược lại cũng thúc đẩy thị trường vận hành hiệu quả hơn.","b":0},{"s":"","z":"从本质上说，“鲇鱼效应”使得企业和员工产生一种危机感，其实就是一种压力效应。","p":"Cóng běnzhì shang shuō, “niányú xiàoyìng” shǐde qǐyè hé yuángōng chǎnshēng yì zhǒng wēijīgǎn, qíshí jiù shì yì zhǒng yālì xiàoyìng.","v":"Xét về bản chất, “hiệu ứng cá nheo” khiến doanh nghiệp và nhân viên nảy sinh cảm giác nguy cơ, thực chất đó chính là một kiểu hiệu ứng áp lực.","b":1},{"s":"","z":"很多研究发现，适度的压力有利于我们保持良好的状态，更加有助于挖掘我们的潜力，从而提高个人的工作效率。","p":"Hěn duō yánjiū fāxiàn, shìdù de yālì yǒulìyú wǒmen bǎochí liánghǎo de zhuàngtài, gèngjiā yǒuzhùyú wājué wǒmen de qiánlì, cóng'ér tígāo gèrén de gōngzuò xiàolǜ.","v":"Nhiều nghiên cứu phát hiện rằng áp lực vừa phải có lợi cho việc duy trì trạng thái tốt, lại càng giúp khai thác tiềm năng của chúng ta, từ đó nâng cao hiệu suất làm việc của mỗi người.","b":0},{"s":"","z":"比如运动员每到参加比赛，尤其是决赛时，一定要将自己调整到接近最佳状态，让自己感到适度的压力，如果他不紧张、没压力感，则不利于出成绩。","p":"Bǐrú yùndòngyuán měi dào cānjiā bǐsài, yóuqí shì juésài shí, yídìng yào jiāng zìjǐ tiáozhěng dào jiējìn zuì jiā zhuàngtài, ràng zìjǐ gǎndào shìdù de yālì, rúguǒ tā bù jǐnzhāng, méi yālìgǎn, zé bú lìyú chū chéngjì.","v":"Chẳng hạn, mỗi khi thi đấu, nhất là ở trận chung kết, vận động viên nhất định phải điều chỉnh bản thân đến gần trạng thái tốt nhất, để mình cảm thấy áp lực vừa phải; nếu không hồi hộp, không thấy áp lực thì lại khó đạt thành tích.","b":0},{"s":"","z":"因此，“鲇鱼效应”的确对挖掘员工潜力、提高企业活力具有积极的意义。","p":"Yīncǐ, “niányú xiàoyìng” díquè duì wājué yuángōng qiánlì, tígāo qǐyè huólì jùyǒu jījí de yìyì.","v":"Vì vậy, “hiệu ứng cá nheo” quả thực có ý nghĩa tích cực đối với việc khai thác tiềm năng của nhân viên và nâng cao sức sống của doanh nghiệp.","b":0}]}],"aud":[{"v":"audio/30-2.mp3","t":"audio/30-1.mp3"}],"gram":[{"id":"wuyi","t":"无意","s":"không có ý định (động từ); vô tình, tình cờ (phó từ)","b":"Sách giải thích <b>无意</b> có hai cách dùng. Là <b>động từ</b>, nghĩa là “不愿、没有打算” – không muốn, không có ý định; đứng trước một động từ khác: <b>无意 + V</b>. Là <b>phó từ</b>, nghĩa là “不是故意的” – không cố ý, vô tình; thường gặp ở dạng <b>无意中……</b>, hoặc <b>无意地 + V</b>.","r":["Động từ: 无意 + động từ = không có ý định làm gì (他无意伤害任何人。)","Phó từ: 无意中 + V / 无意地 + V = vô tình, tình cờ làm gì (无意中发现、无意地找到)","Kết hợp thường gặp (词语搭配): 无意（中）+ 发现 / 看到 / 知道 / 成为 / 说出 / 听到 / 提起"],"e":[["他无意伤害任何人。","Tā wúyì shānghài rènhé rén.","Anh ấy không hề có ý làm tổn thương ai cả."],["我无意打扰您，不过我可以跟您谈一会儿吗？","Wǒ wúyì dǎrǎo nín, búguò wǒ kěyǐ gēn nín tán yíhuìr ma?","Tôi không có ý làm phiền ông, nhưng tôi có thể nói chuyện với ông một lát được không?"],["后来一位渔民无意中发现了一种巧妙而实用的方法。","Hòulái yí wèi yúmín wúyì zhōng fāxiànle yì zhǒng qiǎomiào ér shíyòng de fāngfǎ.","Về sau, một ngư dân tình cờ phát hiện ra một cách vừa khéo léo vừa thiết thực. <i>(bài khoá)</i>"],["她在收拾花园时，无意地找到了这只耳环。","Tā zài shōushi huāyuán shí, wúyì de zhǎodàole zhè zhī ěrhuán.","Lúc dọn dẹp vườn, cô ấy tình cờ tìm thấy chiếc bông tai này."]],"d":[["她在收拾花园时，____地找到了这只耳环。","无意"],["我____打扰您，不过我可以跟您谈一会儿吗？","无意"],["后来一位渔民____中发现了一种巧妙而实用的方法。","无意"]],"w":"Phân biệt hai nghĩa theo vị trí: 无意 + động từ chỉ ý định (“không muốn”), còn 无意中 / 无意地 chỉ hành động xảy ra ngoài chủ ý (“vô tình”)."},{"id":"youli","t":"有利","s":"có lợi, có ích (tính từ)","b":"<b>有利</b> là <b>tính từ</b>, nghĩa là “有好处、有帮助” – có lợi, có ích. Thường dùng cấu trúc <b>有利于 + người/sự vật</b> để nói điều gì có lợi cho ai/cái gì. Dạng phủ định là <b>不利</b> (不利于……).","r":["Làm định ngữ: 有利的 + 形势 / 条件 / 地位 / 环境 / 位置 / 因素 (有利条件: điều kiện thuận lợi, lợi thế)","A 有利于 B: A có lợi cho B (适度的压力有利于我们保持良好的状态)","Đối với… có lợi: 对 + B + （是）有利的","Phủ định: 不利 / 不利于 (如果他不紧张、没压力感，则不利于出成绩)"],"e":[["高高的个子、漂亮的外表，都是他的有利条件。","Gāogāo de gèzi, piàoliang de wàibiǎo, dōu shì tā de yǒulì tiáojiàn.","Dáng người cao ráo, ngoại hình ưa nhìn đều là lợi thế của anh ấy."],["很多研究发现，适度的压力有利于我们保持良好的状态，……","Hěn duō yánjiū fāxiàn, shìdù de yālì yǒulìyú wǒmen bǎochí liánghǎo de zhuàngtài, ……","Nhiều nghiên cứu phát hiện rằng áp lực vừa phải có lợi cho việc duy trì trạng thái tốt… <i>(bài khoá)</i>"],["笑能促进心肺活动，改善肌肉紧张状况，对睡眠也是有利的。","Xiào néng cùjìn xīnfèi huódòng, gǎishàn jīròu jǐnzhāng zhuàngkuàng, duì shuìmián yě shì yǒulì de.","Cười có thể thúc đẩy hoạt động của tim phổi, cải thiện tình trạng căng cơ, và cũng có lợi cho giấc ngủ."]],"d":[["我听人介绍，苹果是最____健康的水果。","有利于"],["与电子阅读相比，纸质阅读更____保护眼睛。","有利于"],["考试时，适度的紧张____考生更好地集中精力完成考试。","有利于"],["如果他不紧张、没压力感，则____出成绩。","不利于"]],"w":"Hai cách nói tương đương: “A 有利于 B” = “A 对 B 有利”. Không nói ✗ 有利对健康 → ✓ 有利于健康 / 对健康有利."},{"id":"dique","t":"的确","s":"quả thật, đích thực (phó từ)","b":"<b>的确</b> là <b>phó từ</b>, nghĩa là “完全确实，实在” – hoàn toàn đúng như vậy, quả thật. Đặt trước động từ/tính từ hoặc cụm giới từ để khẳng định mạnh. Có thể lặp lại thành <b>的的确确</b> để nhấn mạnh hơn.","r":["Chủ ngữ + 的确 + V/Adj: 他的确是我所教过的学生中最聪明的。","的确 + cụm giới từ + V: “鲇鱼效应”的确对……具有积极的意义","Lặp lại: 的的确确 (nhấn mạnh hơn)"],"e":[["因此，“鲇鱼效应”的确对挖掘员工潜力、提高企业活力具有积极的意义。","Yīncǐ, “niányú xiàoyìng” díquè duì wājué yuángōng qiánlì, tígāo qǐyè huólì jùyǒu jījí de yìyì.","Vì vậy, “hiệu ứng cá nheo” quả thực có ý nghĩa tích cực đối với việc khai thác tiềm năng của nhân viên và nâng cao sức sống của doanh nghiệp. <i>(bài khoá)</i>"],["他的确是我所教过的学生中最聪明的。","Tā díquè shì wǒ suǒ jiāoguo de xuésheng zhōng zuì cōngming de.","Cậu ấy quả thật là người thông minh nhất trong số những học trò tôi từng dạy."],["咱们总裁选择李阳负责的的确确有些冒险，因为他太年轻了。","Zánmen zǒngcái xuǎnzé Lǐ Yáng fùzé dídíquèquè yǒuxiē màoxiǎn, yīnwèi tā tài niánqīng le.","Tổng giám đốc chọn Lý Dương phụ trách thì đúng là có phần mạo hiểm thật, vì cậu ấy còn trẻ quá."]],"d":[["他____是我所教过的学生中最聪明的。","的确"],["因此，“鲇鱼效应”____对挖掘员工潜力、提高企业活力具有积极的意义。","的确"],["你听谁说刘方要结婚了？消息____吗？（的确 / 确实）","确实"]],"w":"的确 chỉ là phó từ, phải đứng trước động từ/tính từ, không đứng một mình làm vị ngữ; câu “消息____吗？” (bài tập 2) phải dùng 确实."},{"id":"jiejin_kaojin","t":"接近 vs 靠近","s":"đến gần, gần với","b":"<b>Giống nhau:</b> cả hai đều là <b>động từ</b>, đều mang nghĩa “彼此间距离近或向一定目标运动，使彼此间距离变小” – hai bên ở gần nhau, hoặc di chuyển về phía một mục tiêu khiến khoảng cách thu hẹp; đôi khi có thể thay thế cho nhau. Ví dụ: 这个地方接近/靠近北极地区。","r":["接近 kết hợp được với người, sự vật, thời gian, địa điểm và số lượng cụ thể; 靠近 kết hợp được với người, sự vật, địa điểm cụ thể nhưng thường KHÔNG dùng cho thời gian, số lượng.","接近 còn kết hợp được với sự vật trừu tượng (目标、水平…); 靠近 thường không.","接近 còn có nghĩa “chênh lệch không nhiều” (水平非常接近); 靠近 không có nghĩa này."],"e":[["这个地方接近/靠近北极地区，夏季白天很长，天亮得也很早。","Zhège dìfang jiējìn/kàojìn Běijí dìqū, xiàjì báitiān hěn cháng, tiān liàng de yě hěn zǎo.","Nơi này gần vùng Bắc Cực, mùa hè ban ngày rất dài, trời cũng sáng rất sớm."],["接近下午一点时，救护车终于赶到了。","Jiējìn xiàwǔ yī diǎn shí, jiùhùchē zhōngyú gǎndào le.","Gần một giờ chiều, xe cứu thương cuối cùng cũng tới nơi."],["他们挤在靠近车窗的地方，脸对脸离得很近。","Tāmen jǐ zài kàojìn chēchuāng de dìfang, liǎn duì liǎn lí de hěn jìn.","Họ chen chúc ở chỗ sát cửa sổ xe, mặt đối mặt rất gần nhau."],["经过努力，现在我们已越来越接近年初定下的销售目标了。","Jīngguò nǔlì, xiànzài wǒmen yǐ yuè lái yuè jiējìn niánchū dìngxià de xiāoshòu mùbiāo le.","Nhờ nỗ lực, giờ đây chúng tôi đã ngày càng tiến gần tới mục tiêu doanh số đặt ra từ đầu năm."],["他们俩的水平非常接近，这场比赛真不好说谁会赢。","Tāmen liǎ de shuǐpíng fēicháng jiējìn, zhè chǎng bǐsài zhēn bù hǎo shuō shéi huì yíng.","Trình độ hai người họ rất sát nhau, trận đấu này thật khó nói ai sẽ thắng."]],"d":[["做这个动作时，大腿要尽量____胸部。","靠近"],["直到天快亮的时候，他的体温才____正常。","接近"],["这项技术已____世界先进水平。","接近"],["对于这个问题，几国的意见很____。","接近"]],"w":"Mẹo: gặp thời gian, số lượng, mức độ/trình độ, mục tiêu trừu tượng hoặc ý “chênh lệch ít” → chỉ dùng 接近. 靠近 thiên về khoảng cách không gian cụ thể."}],"ext":[["出口","chūkǒu","xuất khẩu"],["进口","jìnkǒu","nhập khẩu"],["贸易","màoyì","mậu dịch, thương mại"],["谈判","tánpàn","đàm phán"],["合同","hétong","hợp đồng"],["中介","zhōngjiè","trung gian, môi giới"],["破产","pòchǎn","phá sản"],["资金","zījīn","vốn, tiền vốn"],["利润","lìrùn","lợi nhuận"],["股票","gǔpiào","cổ phiếu"],["账户","zhànghù","tài khoản"],["利息","lìxī","tiền lãi"],["贷款","dàikuǎn","khoản vay; cho vay"],["汇率","huìlǜ","tỷ giá hối đoái"],["押金","yājīn","tiền đặt cọc"]],"extt":"经济2","notes":"Nguồn cuối bài khoá: 改编自《每天学一点经济学》. Phần 词语例释 của sách chỉ có 3 mục (无意, 有利, 的确) và 1 mục 词语辨析 (接近—靠近). Bài này không có 专名. Sách ghi từ loại của 决赛 là đgt. và của 无意 trong bảng từ là phó. — giữ nguyên theo sách. Pinyin 体会 sách in tǐhuì. Đáp án drill 接近/靠近 (1) theo mẫu có sẵn trong sách; (2)–(4) và drill 的确 câu 3 (练习2①) do người soạn tự giải.","order":[{"z":"西班牙人特别喜欢吃沙丁鱼。","t":["西班牙人","特别","喜欢","吃","沙丁鱼"],"v":"Người Tây Ban Nha đặc biệt thích ăn cá mòi."},{"z":"鱼上岸后，过不了多久就会死去。","t":["鱼","上岸","后","过","不了","多久","就","会","死去"],"v":"Cá lên bờ chẳng được bao lâu là chết."},{"z":"而死掉的沙丁鱼口感很差，作为商品销售，价格就会便宜很多。","t":["而","死","掉","的","沙丁鱼","口感","很差","作为","商品销售","价格","就","会","便宜","很多"],"v":"Mà cá mòi đã chết thì ăn rất dở, đem bán như hàng hóa thì giá sẽ rẻ đi nhiều."},{"z":"如果 是当你放低身段时，会缩短与人的距离，别人并不会看不起你，反而会觉得你为人谦虚。","ev":"nhưng khi bạn hạ mình xuống, bạn sẽ rút ngắn khoảng cách với người khác; họ không hề coi thường bạn mà trái lại còn thấy bạn là người khiêm tốn."},{"h":"缩短","p":"suōduǎn","v":"rút ngắn","k":"đgt.","x":0,"ez":"可是当你放低身段时，会缩短与人的距离，别人并不会看不起你，反而会觉得你为人谦虚。","ev":"nhưng khi bạn hạ mình xuống, bạn sẽ rút ngắn khoảng cách với người khác; họ không hề coi thường bạn mà trái lại còn thấy bạn là người khiêm tốn."},{"h":"看不起","p":"kànbuqǐ","v":"khinh thường, xem thường","k":"đgt.","x":0,"ez":"可是当你放低身段时，会缩短与人的距离，别人并不会看不起你，反而会觉得你为人谦虚。","ev":"nhưng khi bạn hạ mình xuống, bạn sẽ rút ngắn khoảng cách với người khác; họ không hề coi thường bạn mà trái lại còn thấy bạn là người khiêm tốn."},{"h":"谦虚","p":"qiānxū","v":"khiêm tốn","k":"tt.","x":0,"ez":"可是当你放低身段时，会缩短与人的距离，别人并不会看不起你，反而会觉得你为人谦虚。","ev":"nhưng khi bạn hạ mình xuống, bạn sẽ rút ngắn khoảng cách với người khác; họ không hề coi thường bạn mà trái lại còn thấy bạn là người khiêm tốn."},{"h":"实践","p":"shíjiàn","v":"thực tiễn; thực hành","k":"dt./đgt.","x":0,"ez":"实践证明，第二种人得到的总是比第一种人更多。","ev":"Thực tế đã chứng minh, kiểu người thứ hai bao giờ cũng nhận được nhiều hơn kiểu người thứ nhất."}]],"texts":[{"no":1,"tz":"","tv":"","lines":[{"s":"","z":"一个朋友在报社当编辑。","p":"Yí ge péngyou zài bàoshè dāng biānjí.","v":"Một người bạn của tôi làm biên tập viên ở tòa soạn báo.","b":0},{"s":"","z":"一天他去请假，他先问领导：“您今天心情好吗？”","p":"Yì tiān tā qù qǐngjià, tā xiān wèn lǐngdǎo: “Nín jīntiān xīnqíng hǎo ma?”","v":"Một hôm anh ấy đi xin nghỉ phép, trước tiên anh hỏi sếp: “Hôm nay sếp có vui không ạ?”","b":0},{"s":"","z":"领导说：“怎么了？”","p":"Lǐngdǎo shuō: “Zěnme le?”","v":"Sếp hỏi lại: “Có chuyện gì thế?”","b":0},{"s":"","z":"朋友答：“嗯，如果您心情好，我就说件事；心情不好就改天再说。”","p":"Péngyou dá: “Ǹg, rúguǒ nín xīnqíng hǎo, wǒ jiù shuō jiàn shì; xīnqíng bù hǎo jiù gǎitiān zài shuō.”","v":"Anh bạn đáp: “Vâng, nếu hôm nay sếp vui thì em xin nói một chuyện; còn không vui thì để hôm khác hẵng nói.”","b":0},{"s":"","z":"领导有了兴趣，假，就这样轻易地请好了。","p":"Lǐngdǎo yǒule xìngqù, jià, jiù zhèyàng qīngyì de qǐnghǎo le.","v":"Sếp thấy tò mò, và thế là đơn nghỉ phép được duyệt một cách dễ dàng.","b":0},{"s":"","z":"不得不说，这位朋友很会利用“登门槛效应”来处理问题。","p":"Bùdébù shuō, zhè wèi péngyou hěn huì lìyòng “dēng ménkǎn xiàoyìng” lái chǔlǐ wèntí.","v":"Phải nói rằng anh bạn này rất biết vận dụng “hiệu ứng thò chân vào cửa” để giải quyết vấn đề.","b":0},{"s":"","z":"心理学家曾做过“登门槛技术”的现场实验。","p":"Xīnlǐxuéjiā céng zuòguo “dēng ménkǎn jìshù” de xiànchǎng shíyàn.","v":"Các nhà tâm lý học từng làm một thí nghiệm thực địa về “kỹ thuật thò chân vào cửa”.","b":0},{"s":"","z":"他们派人到两个社区，劝人们在屋前立一块“小心驾驶”的圆形标志。","p":"Tāmen pài rén dào liǎng ge shèqū, quàn rénmen zài wū qián lì yí kuài “xiǎoxīn jiàshǐ” de yuánxíng biāozhì.","v":"Họ cử người đến hai khu dân cư, thuyết phục người dân dựng trước nhà một tấm biển tròn ghi “Lái xe cẩn thận”.","b":0},{"s":"","z":"在第一个社区，研究人员直接向人们提出要求，结果很多人表示拒绝，接受率仅为17%。","p":"Zài dì-yī ge shèqū, yánjiū rényuán zhíjiē xiàng rénmen tíchū yāoqiú, jiéguǒ hěn duō rén biǎoshì jùjué, jiēshòulǜ jǐn wéi bǎi fēn zhī shíqī.","v":"Ở khu thứ nhất, các nhà nghiên cứu đưa ra yêu cầu thẳng với người dân, kết quả là rất nhiều người từ chối, tỉ lệ chấp nhận chỉ có 17%.","b":0},{"s":"","z":"在第二个社区，研究人员把同样的事情分成两个步骤：先向大家出示一份赞成安全驾驶的请愿书，请求他们在上面签字，几周后再提出立牌要求，这次接受者竟然达到了55%。","p":"Zài dì-èr ge shèqū, yánjiū rényuán bǎ tóngyàng de shìqing fēnchéng liǎng ge bùzhòu: xiān xiàng dàjiā chūshì yí fèn zànchéng ānquán jiàshǐ de qǐngyuànshū, qǐngqiú tāmen zài shàngmian qiānzì, jǐ zhōu hòu zài tíchū lì pái yāoqiú, zhè cì jiēshòuzhě jìngrán dádàole bǎi fēn zhī wǔshíwǔ.","v":"Ở khu thứ hai, các nhà nghiên cứu chia cùng một việc ấy thành hai bước: trước tiên đưa cho mọi người xem một bản kiến nghị ủng hộ lái xe an toàn và nhờ họ ký tên vào đó, vài tuần sau mới đề nghị dựng biển; lần này số người đồng ý lên tới 55%.","b":0},{"s":"","z":"第一个步骤的签字是很容易的，几乎所有人都照做了，大家可能都没意识到，这个小小的“登门槛行为”对接下来的决定产生了重要影响。","p":"Dì-yī ge bùzhòu de qiānzì shì hěn róngyì de, jīhū suǒyǒu rén dōu zhàozuò le, dàjiā kěnéng dōu méi yìshi dào, zhège xiǎoxiǎo de “dēng ménkǎn xíngwéi” duì jiē xialai de juédìng chǎnshēngle zhòngyào yǐngxiǎng.","v":"Việc ký tên ở bước đầu rất dễ dàng, hầu như ai cũng làm theo; có lẽ chẳng ai nhận ra rằng cái “hành vi thò chân vào cửa” nhỏ bé ấy đã ảnh hưởng quan trọng đến quyết định sau đó của họ.","b":0},{"s":"","z":"日常生活中也是这样。","p":"Rìcháng shēnghuó zhōng yě shì zhèyàng.","v":"Trong cuộc sống hằng ngày cũng vậy.","b":1},{"s":"","z":"当你想要求某人做某件较大的事情，又担心对方不愿意做时，可以先向他/她提出做一件同类型的、比较容易的事。","p":"Dāng nǐ xiǎng yāoqiú mǒu rén zuò mǒu jiàn jiào dà de shìqing, yòu dānxīn duìfāng bú yuànyì zuò shí, kěyǐ xiān xiàng tā/tā tíchū zuò yí jiàn tóng lèixíng de、bǐjiào róngyì de shì.","v":"Khi bạn muốn nhờ ai đó làm một việc tương đối lớn mà lại sợ người ta không chịu, bạn có thể đề nghị họ làm trước một việc cùng loại nhưng dễ hơn.","b":0},{"s":"","z":"比如你想与一个女孩谈恋爱，如果一开始就迫切地提出要跟她约会，女孩可能会犹豫，甚至表现得很冷淡；","p":"Bǐrú nǐ xiǎng yǔ yí ge nǚhái tán liàn'ài, rúguǒ yì kāishǐ jiù pòqiè de tíchū yào gēn tā yuēhuì, nǚhái kěnéng huì yóuyù, shènzhì biǎoxiàn de hěn lěngdàn;","v":"Chẳng hạn bạn muốn hẹn hò yêu đương với một cô gái, nếu ngay từ đầu đã nôn nóng đòi hẹn hò, cô ấy có thể sẽ do dự, thậm chí tỏ ra rất lạnh nhạt;","b":0},{"s":"","z":"如果你说“饭总是要吃的吧，一起吃饭吧”，她答应了，那接下来是去看电影还是泡酒吧都无所谓了。","p":"rúguǒ nǐ shuō “fàn zǒngshì yào chī de ba, yìqǐ chī fàn ba”, tā dāying le, nà jiē xialai shì qù kàn diànyǐng háishi pào jiǔbā dōu wúsuǒwèi le.","v":"còn nếu bạn nói “Đằng nào chẳng phải ăn cơm, mình đi ăn cùng nhau nhé”, cô ấy nhận lời rồi thì sau đó đi xem phim hay ngồi quán bar cũng chẳng thành vấn đề nữa.","b":0},{"s":"","z":"你想让同事帮你值班或写报告什么的，直接说八成儿会被拒绝，把事情模糊化，“能不能帮个小忙”，“不会占用你很多时间”，台阶一铺，事情就容易多了……","p":"Nǐ xiǎng ràng tóngshì bāng nǐ zhíbān huò xiě bàogào shénmede, zhíjiē shuō bāchéngr huì bèi jùjué, bǎ shìqing móhuhuà, “néng bu néng bāng ge xiǎo máng”, “bú huì zhànyòng nǐ hěn duō shíjiān”, táijiē yì pū, shìqing jiù róngyì duō le……","v":"Bạn muốn nhờ đồng nghiệp trực thay hay viết giúp bản báo cáo chẳng hạn, nói thẳng ra thì gần như chắc chắn sẽ bị từ chối; hãy nói sự việc một cách mập mờ đi: “Giúp mình một việc nhỏ được không?”, “Không mất nhiều thời gian của cậu đâu”, bậc thang đã trải sẵn thì mọi chuyện dễ hơn nhiều…","b":0},{"s":"","z":"你可能会说，这些小动作会让人觉得你很狡猾。","p":"Nǐ kěnéng huì shuō, zhèxiē xiǎo dòngzuò huì ràng rén juéde nǐ hěn jiǎohuá.","v":"Có thể bạn sẽ nói những mánh nhỏ này khiến người ta thấy bạn rất xảo quyệt.","b":1},{"s":"","z":"但是不得不承认，有了这些小动作的帮助，别人的确更愿意接受你的请求。","p":"Dànshì bùdébù chéngrèn, yǒule zhèxiē xiǎo dòngzuò de bāngzhù, biérén díquè gèng yuànyì jiēshòu nǐ de qǐngqiú.","v":"Nhưng phải thừa nhận rằng, nhờ có những mánh nhỏ ấy, người khác quả thật sẵn lòng chấp nhận lời nhờ vả của bạn hơn.","b":0},{"s":"","z":"有时候，当你自认为了不起时，别人通常觉得你这人不过如此；","p":"Yǒu shíhou, dāng nǐ zì rènwéi liǎobuqǐ shí, biérén tōngcháng juéde nǐ zhè rén búguò rúcǐ;","v":"Có những lúc, khi bạn tự cho mình là ghê gớm, người khác thường lại thấy bạn cũng chỉ đến thế mà thôi;","b":0},{"s":"","z":"可是当你放低身段时，会缩短与人的距离，别人并不会看不起你，反而会觉得你为人谦虚。","p":"kěshì dāng nǐ fàngdī shēnduàn shí, huì suōduǎn yǔ rén de jùlí, biérén bìng bú huì kànbuqǐ nǐ, fǎn'ér huì juéde nǐ wéirén qiānxū.","v":"nhưng khi bạn hạ mình xuống, bạn sẽ rút ngắn khoảng cách với người khác; họ không hề coi thường bạn mà trái lại còn thấy bạn là người khiêm tốn.","b":0},{"s":"","z":"实践证明，第二种人得到的总是比第一种人更多。","p":"Shíjiàn zhèngmíng, dì-èr zhǒng rén dédào de zǒngshì bǐ dì-yī zhǒng rén gèng duō.","v":"Thực tế đã chứng minh, kiểu người thứ hai bao giờ cũng nhận được nhiều hơn kiểu người thứ nhất.","b":0}]}],"aud":[{"v":"audio/31-2.mp3","t":"audio/31-1.mp3"}],"gram":[{"id":"ng","t":"嗯","s":"thán từ — đọc ńg / ňg / ǹg tùy nghĩa","b":"Theo sách, <b>嗯</b> là <b>thán từ</b> (叹词), đứng đầu câu, tách khỏi phần sau bằng dấu câu. Cùng một chữ nhưng có <b>ba cách đọc</b>, mỗi cách mang một nghĩa: thanh 2 <b>ńg</b> — hỏi lại, nghi vấn; thanh 3 <b>ňg</b> — ngạc nhiên, thấy chuyện không nên như vậy; thanh 4 <b>ǹg</b> — đồng ý, nhận lời, tán thành.","r":["Đọc <b>ńg</b> (thanh 2): biểu thị nghi vấn — 嗯？不是28号……","Đọc <b>ňg</b> (thanh 3): biểu thị bất ngờ hoặc cho rằng việc đó không nên xảy ra — 嗯！你怎么还没走啊？","Đọc <b>ǹg</b> (thanh 4): biểu thị đồng ý, nhận lời hoặc tán thành — 嗯，没问题……","Dấu câu sau 嗯 đi theo nghĩa: nghi vấn thường dùng ？, bất ngờ dùng ！, đồng ý dùng ，"],"e":[["嗯？不是28号，难道是我记错了？","Ńg? Bú shì èrshíbā hào, nándào shì wǒ jìcuò le?","Hả? Không phải ngày 28 à, chẳng lẽ tôi nhớ nhầm?"],["嗯？人都去哪儿了？","Ńg? Rén dōu qù nǎr le?","Ủa? Mọi người đi đâu hết rồi?"],["嗯！你的房间为什么这么冷？","Ňg! Nǐ de fángjiān wèi shénme zhème lěng?","Ơ kìa! Sao phòng cậu lạnh thế này?"],["嗯！你怎么还没走啊？","Ňg! Nǐ zěnme hái méi zǒu a?","Ơ! Sao cậu vẫn chưa đi thế?"],["嗯，如果您心情好，我就说件事；心情不好就改天再说。","Ǹg, rúguǒ nín xīnqíng hǎo, wǒ jiù shuō jiàn shì; xīnqíng bù hǎo jiù gǎitiān zài shuō.","Vâng, nếu hôm nay sếp vui thì em xin nói một chuyện; còn không vui thì để hôm khác hẵng nói. <i>(bài khoá)</i>"],["嗯，没问题，我这就给她送去。","Ǹg, méi wèntí, wǒ zhè jiù gěi tā sòngqu.","Ừ, không vấn đề gì, tôi mang sang cho cô ấy ngay đây."]],"d":[["嗯____我记住了，明天给你发邮件。","，(ǹg — đồng ý)"],["嗯____小明怎么又忘了关灯啦？","！(ňg — ngạc nhiên, không hài lòng)"],["嗯____我的手机怎么不见了？","？(ńg — nghi vấn)"]],"w":"Đừng đọc mọi chữ 嗯 là “ừ”: khi đi với dấu ？ hoặc ！ nó là “hả?/ơ!”, chỉ thanh 4 ǹg mới là “ừ, vâng”."},{"id":"qingyi","t":"轻易","s":"dễ dàng (tính từ); tùy tiện, khinh suất (phó từ)","b":"Theo sách, <b>轻易</b> là <b>tính từ</b>, nghĩa là “đơn giản, dễ dàng”, thường làm <b>trạng ngữ</b> đứng trước động từ (轻易地请好了). Ngoài ra 轻易 còn là <b>phó từ</b>, chỉ thái độ xử lý việc <b>không thận trọng, tùy tiện</b>; khi đó hay dùng trong câu phủ định, tạo thành khung <b>轻易不……</b> nghĩa là “ít khi (làm…)”, “không dễ gì (làm…)”.","r":["Tính từ, làm trạng ngữ: 轻易(地) + động từ — làm việc gì một cách dễ dàng: 轻易地请好了, 不是轻易得到的.","Phó từ, mang nghĩa “tùy tiện, khinh suất”, thường ở câu phủ định: 从不轻易决定, 不轻易转变.","Khung <b>轻易不 + động từ</b> = “rất ít khi làm…”: 轻易不求人 (ít khi nhờ vả ai).","Kết hợp thường gặp (词语搭配): 轻易(地) + 相信/放弃/改变/实现/答应/错过（机会）/发表（意见）/达到（目标）."],"e":[["领导有了兴趣，假，就这样轻易地请好了。","Lǐngdǎo yǒule xìngqù, jià, jiù zhèyàng qīngyì de qǐnghǎo le.","Sếp thấy tò mò, và thế là đơn nghỉ phép được duyệt một cách dễ dàng. <i>(bài khoá)</i>"],["任何胜利都不是轻易得到的，背后都要付出艰辛的努力。","Rènhé shènglì dōu bú shì qīngyì dédào de, bèihòu dōu yào fùchū jiānxīn de nǔlì.","Chẳng chiến thắng nào có được dễ dàng, đằng sau đều là những nỗ lực gian khổ."],["他这个人的特点，是从不轻易决定，也不轻易转变。","Tā zhège rén de tèdiǎn, shì cóng bù qīngyì juédìng, yě bù qīngyì zhuǎnbiàn.","Đặc điểm của anh ấy là không bao giờ quyết định tùy tiện, mà cũng không dễ dàng thay đổi."],["他为人好强，轻易不求人，这次向咱们借钱，一定是遇到什么难事了。","Tā wéirén hàoqiáng, qīngyì bù qiú rén, zhè cì xiàng zánmen jiè qián, yídìng shì yùdào shénme nánshì le.","Anh ấy vốn hiếu thắng, ít khi nhờ vả ai, lần này lại hỏi vay tiền chúng ta thì chắc chắn là gặp chuyện khó khăn gì rồi."]],"d":[["任何胜利都不是____得到的，背后都要付出艰辛的努力。","轻易"],["他为人好强，____不求人，这次向咱们借钱，一定是遇到什么难事了。","轻易"],["他这个人的特点，是从不____决定，也不轻易转变。","轻易"]],"w":"轻易不…… không có nghĩa “không dễ dàng” theo kiểu khó khăn, mà là “ít khi, không tùy tiện làm”: 轻易不求人 = hiếm khi nhờ người khác."},{"id":"qingyi_rongyi","t":"轻易 vs 容易","s":"cùng nghĩa “dễ”, nhưng khác chức năng và nghĩa mở rộng","b":"<b>Điểm giống</b> (theo bảng 共同点 của sách): khi làm <b>tính từ</b>, cả 轻易 và 容易 đều biểu thị việc làm <b>không tốn sức, không vất vả</b>.","r":["① 轻易 nhấn mạnh làm việc <b>nhẹ nhàng, không tốn sức</b>, thường làm <b>trạng ngữ</b>; 容易 ngoài nghĩa việc đơn giản, không khó làm còn có thể chỉ <b>bản thân nội dung sự việc không phức tạp</b>, và có thể <b>làm vị ngữ độc lập</b> (考试特别容易).","② 容易 còn biểu thị <b>khả năng xảy ra một biến đổi nào đó là lớn</b> (dễ…, hay…): 容易发脾气; 轻易 không có nghĩa này.","③ 轻易 còn là <b>phó từ</b>, mang nghĩa “tùy tiện, khinh suất” (从不轻易放过); 容易 không có cách dùng này.","lỗi hay gặp: ✗ 今天的考试特别轻易 → ✓ 今天的考试特别容易 (làm vị ngữ độc lập phải dùng 容易)."],"e":[["她从小学习就好，高考时很轻易地考上了名牌大学，接着又读了研究生。","Tā cóngxiǎo xuéxí jiù hǎo, gāokǎo shí hěn qīngyì de kǎoshangle míngpái dàxué, jiēzhe yòu dúle yánjiūshēng.","Cô ấy học giỏi từ nhỏ, thi đại học đỗ vào trường danh tiếng rất dễ dàng, sau đó lại học tiếp cao học."],["今天的考试特别容易，我半个小时就答完了。","Jīntiān de kǎoshì tèbié róngyì, wǒ bàn ge xiǎoshí jiù dáwán le.","Bài thi hôm nay cực kỳ dễ, tôi làm xong chỉ trong nửa tiếng."],["他最近心情不好，容易发脾气。","Tā zuìjìn xīnqíng bù hǎo, róngyì fā píqi.","Dạo này anh ấy tâm trạng không tốt, hay nổi nóng."],["我爱书，无论走到哪里，我从不轻易放过书摊、书店。","Wǒ ài shū, wúlùn zǒudào nǎlǐ, wǒ cóng bù qīngyì fàngguò shūtān, shūdiàn.","Tôi yêu sách, dù đi đến đâu cũng chẳng bao giờ bỏ qua sạp sách hay hiệu sách nào."]],"d":[["据说这位刘先生从不____花钱请人吃饭。","轻易"],["看完信后，____不动感情的父亲眼圈都红了。","轻易"],["你这样做，不了解情况的人很____误会。","容易"],["我们双方都没有____放弃自己的意愿。","轻易"]],"w":"Mẹo: thấy chỗ trống đứng một mình làm vị ngữ (很～, 特别～) hoặc mang nghĩa “dễ bị, hay…” → 容易; đi với phủ định 不/从不/没有 + động từ mang nghĩa “tùy tiện” → 轻易."}],"ext":[["推辞","tuīcí","từ chối, khước từ"],["议论","yìlùn","bàn tán, bình luận"],["转告","zhuǎngào","chuyển lời, nhắn lại"],["祝福","zhùfú","chúc phúc, lời chúc"],["握手","wòshǒu","bắt tay"],["看望","kànwàng","thăm, thăm hỏi"],["问候","wènhòu","hỏi thăm, chào hỏi"],["处理","chǔlǐ","xử lý, giải quyết"],["恭喜","gōngxǐ","chúc mừng"],["宣布","xuānbù","tuyên bố, công bố"],["信任","xìnrèn","tin tưởng, tín nhiệm"],["配合","pèihé","phối hợp"],["当心","dāngxīn","cẩn thận, coi chừng"]],"extt":"行为1","notes":"Nguồn cuối bài khoá: 改编自《休闲》2011年第3期，作者：郭茗儿. Bài khoá 714 chữ (theo sách), tr.114–116 (ảnh B115–B117), chia 3 phần tại ranh giới đoạn: đầu bài → “……产生了重要影响。” (đoạn 1–3, từ 1–13) / “日常生活中也是这样……” → “……事情就容易多了……” (đoạn 4, từ 14–22) / “你可能会说……” → hết (đoạn 5, từ 23–29). Bài không có 专名. Từ số 1, 7, 13, 19, 21, 25 có dấu * (ngoài đề cương). Từ 21 sách ghi “八成（儿） bāchéng (r)”, từ loại “phó.” — giữ nguyên; câu vocab_ex dùng dạng 八成儿 trong bài khoá. Từ 19 sách ghi pinyin tách “zhí bān”. Câu “领导有了兴趣，假，就这样轻易地请好了。” sách in đúng như vậy (có “假，” tách riêng), giữ nguyên. Hai câu dài >45 chữ ở đoạn 3 (“在第二个社区……达到了55%。” và “第一个步骤的签字……重要影响。”) không có ；nên giữ một dòng; câu “比如你想与一个女孩谈恋爱……” và “有时候……” được cắt tại ；. Đoạn 4 kết thúc bằng “……” (sách in “容易多了……”). Phần 注释 gồm 2 mục 词语例释 (嗯, 轻易) và 1 词语辨析 (轻易—容易). Bảng 词语搭配 (không có trường trong schema): 缩短+长度/距离/时间/路线; 处理+问题/矛盾/关系/工作/信息/文件/商品; 狡猾的+狐狸（húli, con cáo）/敌人; 了不起的+人物/贡献/成绩/发明/创造/民族/母亲; 迫切地+要求/需要/希望/盼望/寻找; 轻易（地）+相信/放弃/改变/实现/答应/错过（机会）/发表（意见）/达到（目标）; 视线/记忆/声音/印象/意思/光线/字迹+模糊; 态度/表情/关系/生意/反应+冷淡. Drill 嗯 lấy từ 练一练 (điền dấu câu, đáp án và cách đọc do người soạn giải; câu (3) có thể hiểu là ngạc nhiên ！ nhưng chọn ？ theo nghĩa nghi vấn). Drill 轻易: 练一练 của sách là bài hoàn thành câu mở nên người soạn đặt câu điền khuyết từ ví dụ (2)(4)(3) của sách. Drill 轻易—容易 lấy từ 做一做 (câu (1) sách đã đánh dấu 轻易; câu (2)(3)(4) đáp án do người soạn giải). Dòng “lỗi hay gặp” và các mục warn do người soạn đặt. vocab_ex của 出示/赞成/请愿书/值班/报告/八成（儿）/模糊 là vế câu trích nguyên từ bài khoá (câu gốc quá dài); còn lại là nguyên câu bài khoá. Bảng 扩展 (话题: 行为1) trong sách chỉ có chữ Hán + pinyin, nghĩa tiếng Việt do người soạn bổ sung. Sách không có chỗ mờ/không đọc được.","order":[{"z":"一个朋友在报社当编辑。","t":["一个","朋友","在","报社","当","编辑"],"v":"Một người bạn của tôi làm biên tập viên ở tòa soạn báo."},{"z":"领导有了兴趣，假，就这样轻易地请好了。","t":["领导","有","了","兴趣","假","就","这样","轻易","地请","好","了"],"v":"Sếp thấy tò mò, và thế là đơn nghỉ phép được duyệt một cách dễ dàng."},{"z":"心理学家曾做过“登门槛技术”的现场实验。","t":["心理学家","曾","做","过","登","门槛","技术","的","现场实验"],"v":"Các nhà tâm lý học từng làm một thí nghiệm thực địa về “kỹ thuật thò chân vào cửa”."},{"z":"日常生活中也是这样。","t":["日常生活","中","也","是","这样"],"v":"Trong cuộc sống hằng ngày cũng vậy."},{"z":"实践证明，第二种人得到的总是比第一种人更多。","t":["实践证明","第二种","人","得到","的","总是","比","第一种","人","更","多"],"v":"Thực tế đã chứng minh, kiểu người thứ hai bao giờ cũng nhận được nhiều hơn kiểu người thứ nhất."},{"z":"不是28号，难道是我记错了？","t":["不是","28","号","难道","是","我","记错","了"],"v":"Hả? Không phải ngày 28 à, chẳng lẽ tôi nhớ nhầm?"},{"z":"人都去哪儿了？","t":["人","都","去","哪儿","了"],"v":"Ủa? Mọi người đi đâu hết rồi?"},{"z":"你的房间为什么这么冷？","t":["你","的","房间","为什么","这么","冷"],"v":"Ơ kìa! Sao phòng cậu lạnh thế này?"},{"z":"你怎么还没走啊？","t":["你","怎么","还","没","走","啊"],"v":"Ơ! Sao cậu vẫn chưa đi thế?"},{"z":"嗯，没问题，我这就给她送去。","t":["嗯","没","问题","我","这","就","给","她","送","去"],"v":"Ừ, không vấn đề gì, tôi mang sang cho cô ấy ngay đây."},{"z":"他最近心情不好，容易发脾气。","t":["他","最近","心情","不好","容易","发脾气"],"v":"Dạo này anh ấy tâm trạng không tốt, hay nổi nóng."},{"z":"我爱书，无论走到哪里，我从不轻易放过书摊、书店。","t":["我爱书","无论","走","到","哪里","我","从不","轻易","放过","书摊","书店"],"v":"Tôi yêu sách, dù đi đến đâu cũng chẳng bao giờ bỏ qua sạp sách hay hiệu sách nào."}]},"32":{"n":32,"tz":"身边的环保","tv":"Bảo vệ môi trường quanh ta","batches":[[{"h":"消失","p":"xiāoshī","v":"biến mất","k":"đgt.","x":0,"ez":"从国际环保组织公布的数据可知，地球上一半以上的动植物正在消失，这是真实的情况，一点儿也不夸张。","ev":"Theo số liệu do các tổ chức bảo vệ môi trường quốc tế công bố, hơn một nửa số loài động thực vật trên Trái Đất đang biến mất; đó là tình hình có thật, không hề phóng đại chút nào."},{"h":"洪水","p":"hóngshuǐ","v":"nước lũ","k":"dt.","x":1,"ez":"动植物的消失，部分原因是由于自然界的变化，比如洪水、地震等改变了它们生活的环境。","ev":"Sự biến mất của động thực vật một phần là do những biến đổi của giới tự nhiên, chẳng hạn lũ lụt, động đất… đã làm thay đổi môi trường sống của chúng."},{"h":"地震","p":"dìzhèn","v":"động đất","k":"đgt.","x":0,"ez":"动植物的消失，部分原因是由于自然界的变化，比如洪水、地震等改变了它们生活的环境。","ev":"Sự biến mất của động thực vật một phần là do những biến đổi của giới tự nhiên, chẳng hạn lũ lụt, động đất… đã làm thay đổi môi trường sống của chúng."},{"h":"破坏","p":"pòhuài","v":"phá hủy, tàn phá","k":"đgt.","x":0,"ez":"但更大的原因则是人类对自然的破坏——有些地区的森林已经几乎被人砍光了。","ev":"Nhưng nguyên nhân lớn hơn lại là sự tàn phá thiên nhiên của con người — rừng ở một số vùng gần như đã bị chặt trụi."},{"h":"砍","p":"kǎn","v":"chặt, chẻ, bổ","k":"đgt.","x":0,"ez":"有些地区的森林已经几乎被人砍光了，很多河流被污染，不再适合鱼类生存。","ev":"Rừng ở một số vùng gần như đã bị chặt trụi, nhiều dòng sông bị ô nhiễm, không còn thích hợp cho cá sin o hoạt động sản xuất công nghiệp và nông nghiệp gây ra."},{"h":"生产","p":"shēngchǎn","v":"sản xuất","k":"đgt.","x":0,"ez":"大型工厂生产过程中，有的会产生大量废水。","ev":"Trong quá trình sản xuất của các nhà máy lớn, có nhà máy thải ra một lượng lớn nước thải."},{"h":"大型","p":"dàxíng","v":"quy mô lớn, khổng lồ","k":"tt.","x":0,"ez":"大型工厂生产过程中，有的会产生大量废水。","ev":"Trong quá trình sản xuất của các nhà máy lớn, có nhà máy thải ra một lượng lớn nước thải."},{"h":"工厂","p":"gōngchǎng","v":"công xưởng, nhà máy","k":"dt.","x":0,"ez":"大型工厂生产过程中，有的会产生大量废水。","ev":"Trong quá trình sản xuất của các nhà máy lớn, có nhà máy thải ra một lượng lớn nước thải."},{"h":"废","p":"fèi","v":"thải, bỏ","k":"tt.","x":0,"ez":"有的要大量燃烧煤炭，从而产生大量废气和废物。","ev":"Có nhà máy phải đốt một lượng lớn than đá, từ đó sinh ra nhiều khí thải và chất thải."},{"h":"燃烧","p":"ránshāo","v":"bốc cháy, đốt cháy","k":"đgt.","x":0,"ez":"有的要大量燃烧煤炭，从而产生大量废气和废物。","ev":"Có nhà máy phải đốt một lượng lớn than đá, từ đó sinh ra nhiều khí thải và chất thải."},{"h":"煤炭","p":"méitàn","v":"than đá","k":"dt.","x":0,"ez":"有的要大量燃烧煤炭，从而产生大量废气和废物。","ev":"Có nhà máy phải đốt một lượng lớn than đá, từ đó sinh ra nhiều khí thải và chất thải."},{"h":"密切","p":"mìqiè","v":"mật thiết, thân mật","k":"tt.","x":0,"ez":"还有一部分污染和我们的日常生活密切相关，汽车尾气就是其中之一。","ev":"Còn một phần ô nhiễm có liên quan mật thiết đến sinh hoạt hằng ngày của chúng ta, khí thải ô tô chính là một trong số đó."},{"h":"尾气","p":"wěiqì","v":"khí thải","k":"dt.","x":1,"ez":"还有一部分污染和我们的日常生活密切相关，汽车尾气就是其中之一。","ev":"Còn một phần ô nhiễm có liên quan mật thiết đến sinh hoạt hằng ngày của chúng ta, khí thải ô tô chính là một trong số đó."},{"h":"幸运","p":"xìngyùn","v":"may mắn","k":"tt.","x":0,"ez":"幸运的是，越来越多的人敏感地认识到了环境问题的严重。","ev":"May mắn là ngày càng nhiều người đã nhạy bén nhận ra mức độ nghiêm trọng của vấn đề môi trường."},{"h":"敏感","p":"mǐngǎn","v":"nhạy cảm","k":"tt.","x":0,"ez":"幸运的是，越来越多的人敏感地认识到了环境问题的严重。","ev":"May mắn là ngày càng nhiều người đã nhạy bén nhận ra mức độ nghiêm trọng của vấn đề môi trường."},{"h":"自觉","p":"zìjué","v":"tự giác, có ý thức","k":"tt.","x":0,"ez":"越来越多的人……自觉地投入到了保护地球的行动中。","ev":"Ngày càng nhiều người… đã tự giác tham gia vào hành động bảo vệ Trái Đất."},{"h":"设施","p":"shèshī","v":"thiết bị, phương tiện","k":"dt.","x":0,"ez":"生产中，增加环保设施，减少污染物排放。","ev":"Trong sản xuất, người ta bổ sung thiết bị bảo vệ môi trường, giảm phát thải chất ô nhiễm."},{"h":"能源","p":"néngyuán","v":"nguồn năng lượng","k":"dt.","x":0,"ez":"调整能源消费结构，逐步向可再生能源转变。","ev":"Điều chỉnh cơ cấu tiêu thụ năng lượng, từng bước chuyển sang năng lượng tái tạo."},{"h":"逐步","p":"zhúbù","v":"từng bước, dần dần","k":"phó.","x":0,"ez":"调整能源消费结构，逐步向可再生能源转变。","ev":"Điều chỉnh cơ cấu tiêu thụ năng lượng, từng bước chuyển sang năng lượng tái tạo."},{"h":"尽量","p":"jǐnliàng","v":"cố gắng hết sức","k":"phó.","x":0,"ez":"而在日常生活中，改变生活习惯，尽量减少生活垃圾，做到垃圾分类。","ev":"Còn trong sinh hoạt hằng ngày thì thay đổi thói quen, cố gắng giảm rác thải sinh hoạt và thực hiện phân loại rác."},{"h":"私（人）","p":"sī (rén)","v":"riêng, cá nhân","k":"dt.","x":0,"ez":"同时，尽量多骑自行车，多选择公共交通，少使用私家车。","ev":"Đồng thời, cố gắng đi xe đạp nhiều hơn, chọn phương tiện công cộng nhiều hơn và ít dùng xe riêng hơn."},{"h":"尊敬","p":"zūnjìng","v":"kính trọng","k":"đgt.","x":0,"ez":"这些为此付出努力的人们令人尊敬，取得的成绩也令人鼓舞。","ev":"Những người đã nỗ lực vì điều này thật đáng kính trọng, và những thành quả họ đạt được cũng thật đáng khích lệ."},{"h":"鼓舞","p":"gǔwǔ","v":"cổ vũ, khích lệ","k":"đgt.","x":0,"ez":"这些为此付出努力的人们令人尊敬，取得的成绩也令人鼓舞。","ev":"Những người đã nỗ lực vì điều này thật đáng kính trọng, và những thành quả họ đạt được cũng thật đáng khích lệ."},{"h":"消极","p":"xiāojí","v":"tiêu cực","k":"tt.","x":0,"ez":"房间脏了，消极的逃避和不符合实际的幻想都不能解决问题。","ev":"Phòng bẩn rồi thì trốn tránh một cách tiêu cực hay ảo tưởng viển vông đều không giải quyết được vấn đề."},{"h":"幻想","p":"huànxiǎng","v":"ảo tưởng, hoang tưởng","k":"dt.","x":0,"ez":"房间脏了，消极的逃避和不符合实际的幻想都不能解决问题。","ev":"Phòng bẩn rồi thì trốn tránh một cách tiêu cực hay ảo tưởng viển vông đều không giải quyết được vấn đề."},{"h":"贡献","p":"gòngxiàn","v":"sự đóng góp; cống hiến","k":"dt./đgt.","x":0,"ez":"为保持它的卫生每一个人都应付出行动，做出贡献。","ev":"Để giữ nó sạch sẽ, mỗi người đều phải hành động và góp sức của mình."},{"h":"命运","p":"mìngyùn","v":"số phận, vận mệnh","k":"dt.","x":0,"ez":"人类的命运由我们自己掌握，改变要靠我们自己。","ev":"Vận mệnh của nhân loại do chính chúng ta nắm giữ, sự thay đổi phải dựa vào chính chúng ta."},{"h":"掌握","p":"zhǎngwò","v":"nắm chắc, nắm vững, hiểu rõ","k":"đgt.","x":0,"ez":"人类的命运由我们自己掌握，改变要靠我们自己。","ev":"Vận mệnh của nhân loại do chính chúng ta nắm giữ, sự thay đổi phải dựa vào chính chúng ta."}]],"texts":[{"no":1,"tz":"","tv":"","lines":[{"s":"","z":"如果你觉得地球上的一点儿小污染没什么关系，那你可就大错特错了！","p":"Rúguǒ nǐ juéde dìqiú shang de yìdiǎnr xiǎo wūrǎn méi shénme guānxi, nà nǐ kě jiù dàcuò-tècuò le!","v":"Nếu bạn cho rằng một chút ô nhiễm nhỏ trên Trái Đất chẳng hề gì thì bạn đã sai hoàn toàn rồi!","b":0},{"s":"","z":"环境污染会危害动物、植物以及人类自身。","p":"Huánjìng wūrǎn huì wēihài dòngwù, zhíwù yǐjí rénlèi zìshēn.","v":"Ô nhiễm môi trường sẽ gây hại cho động vật, thực vật và cả chính con người.","b":0},{"s":"","z":"有些生活在过去的动物，你今天再也看不到了，植物也面临着同样的危险。","p":"Yǒuxiē shēnghuó zài guòqù de dòngwù, nǐ jīntiān zài yě kàn bu dào le, zhíwù yě miànlínzhe tóngyàng de wēixiǎn.","v":"Có những loài động vật từng sống trong quá khứ mà ngày nay bạn không bao giờ còn được nhìn thấy nữa; thực vật cũng đang đứng trước nguy cơ tương tự.","b":0},{"s":"","z":"动植物的消失，部分原因是由于自然界的变化，比如洪水、地震等改变了它们生活的环境，但更大的原因则是人类对自然的破坏——有些地区的森林已经几乎被人砍光了，很多河流被污染，不再适合鱼类生存，有的地区原本是草原，如今已变为沙漠……","p":"Dòngzhíwù de xiāoshī, bùfen yuányīn shì yóuyú zìránjiè de biànhuà, bǐrú hóngshuǐ, dìzhèn děng gǎibiànle tāmen shēnghuó de huánjìng, dàn gèng dà de yuányīn zé shì rénlèi duì zìrán de pòhuài——yǒuxiē dìqū de sēnlín yǐjīng jīhū bèi rén kǎnguāng le, hěn duō héliú bèi wūrǎn, bú zài shìhé yúlèi shēngcún, yǒu de dìqū yuánběn shì cǎoyuán, rújīn yǐ biànwéi shāmò……","v":"Sự biến mất của động thực vật một phần là do những biến đổi của giới tự nhiên, chẳng hạn lũ lụt, động đất… đã làm thay đổi môi trường sống của chúng, nhưng nguyên nhân lớn hơn lại là sự tàn phá thiên nhiên của con người — rừng ở một số vùng gần như đã bị chặt trụi, nhiều dòng sông bị ô nhiễm, không còn thích hợp cho cá sinh sống, có những vùng vốn là thảo nguyên, nay đã biến thành sa mạc…","b":0},{"s":"","z":"从国际环保组织公布的数据可知，地球上一半以上的动植物正在消失，这是真实的情况，一点儿也不夸张。","p":"Cóng guójì huánbǎo zǔzhī gōngbù de shùjù kě zhī, dìqiú shang yíbàn yǐshàng de dòngzhíwù zhèngzài xiāoshī, zhè shì zhēnshí de qíngkuàng, yìdiǎnr yě bù kuāzhāng.","v":"Theo số liệu do các tổ chức bảo vệ môi trường quốc tế công bố, hơn một nửa số loài động thực vật trên Trái Đất đang biến mất; đó là tình hình có thật, không hề phóng đại chút nào.","b":0},{"s":"","z":"人类自身也饱受污染的危害。","p":"Rénlèi zìshēn yě bǎoshòu wūrǎn de wēihài.","v":"Bản thân con người cũng đang chịu đủ mọi tác hại của ô nhiễm.","b":1},{"s":"","z":"有些地区地表水已污染，地下水又被过量使用，水资源短缺问题就连科学家们也不知道该如何解决，目前世界上有17%的人无法享用干净的饮用水，而每年死于与空气污染有关的疾病的人比死于车祸的还要多。","p":"Yǒuxiē dìqū dìbiǎoshuǐ yǐ wūrǎn, dìxiàshuǐ yòu bèi guòliàng shǐyòng, shuǐ zīyuán duǎnquē wèntí jiù lián kēxuéjiāmen yě bù zhīdào gāi rúhé jiějué, mùqián shìjiè shang yǒu bǎi fēn zhī shíqī de rén wúfǎ xiǎngyòng gānjìng de yǐnyòngshuǐ, ér měi nián sǐ yú yǔ kōngqì wūrǎn yǒuguān de jíbìng de rén bǐ sǐ yú chēhuò de hái yào duō.","v":"Ở một số vùng, nước mặt đã bị ô nhiễm, nước ngầm lại bị khai thác quá mức; vấn đề thiếu hụt tài nguyên nước đến cả các nhà khoa học cũng không biết nên giải quyết thế nào. Hiện nay trên thế giới có 17% dân số không được dùng nước uống sạch, còn số người chết mỗi năm vì các bệnh liên quan đến ô nhiễm không khí thậm chí còn nhiều hơn số người chết vì tai nạn giao thông.","b":0},{"s":"","z":"这些数据确实令人不安。","p":"Zhèxiē shùjù quèshí lìng rén bù'ān.","v":"Những số liệu này thật sự khiến người ta lo lắng.","b":0},{"s":"","z":"一部分环境污染是由工业农业生产活动造成的，例如，大型工厂生产过程中，有的会产生大量废水；","p":"Yí bùfen huánjìng wūrǎn shì yóu gōngyè nóngyè shēngchǎn huódòng zàochéng de, lìrú, dàxíng gōngchǎng shēngchǎn guòchéng zhōng, yǒu de huì chǎnshēng dàliàng fèishuǐ;","v":"Một phần ô nhiễm môi trường là do hoạt động sản xuất công nghiệp và nông nghiệp gây ra, chẳng hạn trong quá trình sản xuất của các nhà máy lớn, có nhà máy thải ra một lượng lớn nước thải;","b":0},{"s":"","z":"有的要大量燃烧煤炭，从而产生大量废气和废物。","p":"yǒu de yào dàliàng ránshāo méitàn, cóng'ér chǎnshēng dàliàng fèiqì hé fèiwù.","v":"có nhà máy phải đốt một lượng lớn than đá, từ đó sinh ra nhiều khí thải và chất thải.","b":0},{"s":"","z":"还有一部分污染和我们的日常生活密切相关，汽车尾气就是其中之一。","p":"Hái yǒu yí bùfen wūrǎn hé wǒmen de rìcháng shēnghuó mìqiè xiāngguān, qìchē wěiqì jiù shì qízhōng zhī yī.","v":"Còn một phần ô nhiễm có liên quan mật thiết đến sinh hoạt hằng ngày của chúng ta, khí thải ô tô chính là một trong số đó.","b":0},{"s":"","z":"此外，垃圾也会对环境造成严重的损害。","p":"Cǐwài, lājī yě huì duì huánjìng zàochéng yánzhòng de sǔnhài.","v":"Ngoài ra, rác thải cũng gây tổn hại nghiêm trọng cho môi trường.","b":0},{"s":"","z":"幸运的是，越来越多的人敏感地认识到了环境问题的严重，并自觉地投入到了保护地球的行动中。","p":"Xìngyùn de shì, yuè lái yuè duō de rén mǐngǎn de rènshi dàole huánjìng wèntí de yánzhòng, bìng zìjué de tóurù dàole bǎohù dìqiú de xíngdòng zhōng.","v":"May mắn là ngày càng nhiều người đã nhạy bén nhận ra mức độ nghiêm trọng của vấn đề môi trường và tự giác tham gia vào hành động bảo vệ Trái Đất.","b":1},{"s":"","z":"生产中，增加环保设施，减少污染物排放，调整能源消费结构，逐步向可再生能源转变；","p":"Shēngchǎn zhōng, zēngjiā huánbǎo shèshī, jiǎnshǎo wūrǎnwù páifàng, tiáozhěng néngyuán xiāofèi jiégòu, zhúbù xiàng kězàishēng néngyuán zhuǎnbiàn;","v":"Trong sản xuất, người ta bổ sung thiết bị bảo vệ môi trường, giảm phát thải chất ô nhiễm, điều chỉnh cơ cấu tiêu thụ năng lượng, từng bước chuyển sang năng lượng tái tạo;","b":0},{"s":"","z":"而在日常生活中，改变生活习惯，尽量减少生活垃圾，做到垃圾分类。","p":"ér zài rìcháng shēnghuó zhōng, gǎibiàn shēnghuó xíguàn, jǐnliàng jiǎnshǎo shēnghuó lājī, zuòdào lājī fēnlèi.","v":"còn trong sinh hoạt hằng ngày thì thay đổi thói quen, cố gắng giảm rác thải sinh hoạt và thực hiện phân loại rác.","b":0},{"s":"","z":"同时，尽量多骑自行车，多选择公共交通，少使用私家车。","p":"Tóngshí, jǐnliàng duō qí zìxíngchē, duō xuǎnzé gōnggòng jiāotōng, shǎo shǐyòng sījiāchē.","v":"Đồng thời, cố gắng đi xe đạp nhiều hơn, chọn phương tiện công cộng nhiều hơn và ít dùng xe riêng hơn.","b":0},{"s":"","z":"这些为此付出努力的人们令人尊敬，取得的成绩也令人鼓舞。","p":"Zhèxiē wèi cǐ fùchū nǔlì de rénmen lìng rén zūnjìng, qǔdé de chéngjì yě lìng rén gǔwǔ.","v":"Những người đã nỗ lực vì điều này thật đáng kính trọng, và những thành quả họ đạt được cũng thật đáng khích lệ.","b":0},{"s":"","z":"地球是人类共同的家园，我们应该把它看作一个属于自己的大房间。","p":"Dìqiú shì rénlèi gòngtóng de jiāyuán, wǒmen yīnggāi bǎ tā kànzuò yí ge shǔyú zìjǐ de dà fángjiān.","v":"Trái Đất là ngôi nhà chung của nhân loại, chúng ta nên coi nó như một căn phòng lớn của chính mình.","b":0},{"s":"","z":"房间脏了，消极的逃避和不符合实际的幻想都不能解决问题，为保持它的卫生每一个人都应付出行动，做出贡献。","p":"Fángjiān zāng le, xiāojí de táobì hé bù fúhé shíjì de huànxiǎng dōu bù néng jiějué wèntí, wèi bǎochí tā de wèishēng měi yí ge rén dōu yīng fùchū xíngdòng, zuòchū gòngxiàn.","v":"Phòng bẩn rồi thì trốn tránh một cách tiêu cực hay ảo tưởng viển vông đều không giải quyết được vấn đề; để giữ nó sạch sẽ, mỗi người đều phải hành động và góp sức của mình.","b":0},{"s":"","z":"人类的命运由我们自己掌握，改变要靠我们自己。","p":"Rénlèi de mìngyùn yóu wǒmen zìjǐ zhǎngwò, gǎibiàn yào kào wǒmen zìjǐ.","v":"Vận mệnh của nhân loại do chính chúng ta nắm giữ, sự thay đổi phải dựa vào chính chúng ta.","b":0}]}],"aud":[{"v":"audio/32-2.mp3","t":"audio/32-1.mp3"}],"gram":[{"id":"miqie","t":"密切","s":"mật thiết, gần gũi; sát sao, chặt chẽ (tính từ); làm cho gắn bó (động từ)","b":"Sách nêu ba cách dùng của <b>密切</b>. Thứ nhất, là <b>tính từ</b> chỉ quan hệ gần gũi, mật thiết (密切相关、来往密切). Thứ hai, cũng là tính từ nhưng chỉ thái độ <b>coi trọng, tỉ mỉ, chu đáo</b> (đối với một vấn đề…), khi đó thường đứng trước động từ làm trạng ngữ: <b>密切（地）+ V</b>. Thứ ba, là <b>động từ</b> với nghĩa “使关系近” – làm cho quan hệ trở nên gắn bó hơn, mang tân ngữ trực tiếp: <b>密切 + 了 + 关系/联系/友谊</b>.","r":["Tính từ – quan hệ gần: A和B密切相关；来往比先前密切了","Tính từ – coi trọng, tỉ mỉ: 密切（地）+ 观察 / 配合 / 注意 / 关注","Động từ – làm cho gắn bó: 密切了……的联系 / ……之间的友谊","Kết hợp (词语搭配): 密切 + 合作 / 相关 / 联系 / 配合 / 注意 / 关注"],"e":[["还有一部分污染和我们的日常生活密切相关。","Hái yǒu yí bùfen wūrǎn hé wǒmen de rìcháng shēnghuó mìqiè xiāngguān.","Còn một phần ô nhiễm có liên quan mật thiết đến sinh hoạt hằng ngày của chúng ta. <i>(bài khoá)</i>"],["参加了这次环保活动后，两人便有了共同语言，来往也比先前密切了。","Cānjiāle zhè cì huánbǎo huódòng hòu, liǎng rén biàn yǒule gòngtóng yǔyán, láiwǎng yě bǐ xiānqián mìqiè le.","Sau khi tham gia hoạt động bảo vệ môi trường lần này, hai người bắt đầu có tiếng nói chung, qua lại cũng thân thiết hơn trước."],["刘医生密切地观察着李妈妈病情的发展。","Liú yīshēng mìqiè de guāncházhe Lǐ māma bìngqíng de fāzhǎn.","Bác sĩ Lưu đang theo dõi sát sao diễn biến bệnh tình của bác Lý."],["家长应和老师密切配合，形成合力，保持教育的一致性。","Jiāzhǎng yīng hé lǎoshī mìqiè pèihé, xíngchéng hélì, bǎochí jiàoyù de yízhìxìng.","Phụ huynh nên phối hợp chặt chẽ với giáo viên, tạo thành sức mạnh chung để việc giáo dục được nhất quán."],["这条铁路的建成，大大密切了西南地区与首都的联系。","Zhè tiáo tiělù de jiànchéng, dàdà mìqièle xīnán dìqū yǔ shǒudū de liánxì.","Việc hoàn thành tuyến đường sắt này đã khiến mối liên hệ giữa vùng Tây Nam và thủ đô gắn bó hơn rất nhiều."],["友好城市之间的交往密切了两国人民之间的友谊。","Yǒuhǎo chéngshì zhī jiān de jiāowǎng mìqièle liǎng guó rénmín zhī jiān de yǒuyì.","Sự giao lưu giữa các thành phố kết nghĩa đã thắt chặt tình hữu nghị giữa nhân dân hai nước."]],"d":[["参加了这次环保活动后，两人便有了共同语言，来往也比先前____了。","密切"],["家长应和老师____配合，形成合力，保持教育的一致性。","密切"],["这条铁路的建成，大大____了西南地区与首都的联系。","密切"]],"w":"Muốn biết 密切 đang là động từ hay tính từ, hãy xem phía sau nó: có tân ngữ đi kèm (thường có 了) như 密切了……的联系 thì là động từ “làm cho gắn bó”; đứng trước một động từ khác như 密切（地）观察 thì mang nghĩa “sát sao, chặt chẽ”."},{"id":"jinliang","t":"尽量","s":"cố gắng hết sức, hết mức có thể (phó từ)","b":"Sách giải thích <b>尽量</b> là <b>phó từ</b>, biểu thị cố gắng đạt tới mức tối đa trong một phạm vi nhất định. Nó đứng trước động từ hoặc cụm động từ, rất hay đi với 多/少: <b>尽量 + 多/少 + V</b>.","r":["尽量 + V: 尽量使用节能电器、尽量减少生活垃圾","尽量 + 多/少 + V: 尽量多骑自行车、尽量少吃油炸食品","Có thể đứng sau động từ năng nguyện / chủ ngữ: 老年人要尽量……、请大家都尽量……"],"e":[["同时，尽量多骑自行车，多选择公共交通，少使用私家车。","Tóngshí, jǐnliàng duō qí zìxíngchē, duō xuǎnzé gōnggòng jiāotōng, shǎo shǐyòng sījiāchē.","Đồng thời, cố gắng đi xe đạp nhiều hơn, chọn phương tiện công cộng nhiều hơn và ít dùng xe riêng hơn. <i>(bài khoá)</i>"],["老年人要尽量少吃油炸食品。","Lǎoniánrén yào jǐnliàng shǎo chī yóuzhá shípǐn.","Người cao tuổi nên hạn chế hết mức đồ chiên rán."],["为了节约能源，请大家都尽量使用节能电器。","Wèile jiéyuē néngyuán, qǐng dàjiā dōu jǐnliàng shǐyòng jiénéng diànqì.","Để tiết kiệm năng lượng, mời mọi người cố gắng dùng các thiết bị điện tiết kiệm năng lượng."]],"d":[["老年人要____少吃油炸食品。","尽量"],["为了节约能源，请大家都____使用节能电器。","尽量"],["而在日常生活中，改变生活习惯，____减少生活垃圾，做到垃圾分类。","尽量"]],"w":"尽 trong 尽量 đọc thanh 3: jǐnliàng (theo bảng từ của sách)."},{"id":"zhubu","t":"逐步","s":"từng bước, dần dần (phó từ)","b":"Theo sách, <b>逐步</b> nghĩa là “một bước rồi một bước” (一步一步地), <b>thường dùng cho những việc do con người thực hiện</b> (人为的情况), và <b>nói chung không bổ nghĩa cho từ mang tính tính từ</b>. Nó đứng trước động từ làm trạng ngữ: <b>逐步 + V</b>.","r":["逐步 + V: 逐步扩大 / 逐步恢复 / 逐步向……转变","Thường dùng cho thay đổi do con người chủ động tiến hành (调整结构、恢复生产…)","Nói chung không bổ nghĩa cho tính từ: ✗ 逐步冷了 → chỉ dùng trước động từ"],"e":[["云计算应用市场规模正在逐步扩大。","Yún jìsuàn yìngyòng shìchǎng guīmó zhèngzài zhúbù kuòdà.","Quy mô thị trường ứng dụng điện toán đám mây đang từng bước mở rộng."],["……调整能源消费结构，逐步向可再生能源转变；","……tiáozhěng néngyuán xiāofèi jiégòu, zhúbù xiàng kězàishēng néngyuán zhuǎnbiàn;","…điều chỉnh cơ cấu tiêu thụ năng lượng, từng bước chuyển sang năng lượng tái tạo; <i>(bài khoá)</i>"],["记者了解到，现在受灾群众已逐步恢复了正常的生产生活。","Jìzhě liǎojiě dào, xiànzài shòuzāi qúnzhòng yǐ zhúbù huīfùle zhèngcháng de shēngchǎn shēnghuó.","Theo tìm hiểu của phóng viên, hiện nay người dân vùng bị thiên tai đã từng bước khôi phục sản xuất và sinh hoạt bình thường."]],"d":[["云计算应用市场规模正在____扩大。","逐步"],["调整能源消费结构，____向可再生能源转变。","逐步"],["记者了解到，现在受灾群众已____恢复了正常的生产生活。","逐步"]],"w":"逐步 nhấn mạnh tiến trình có kế hoạch, làm từng bước một, và đi với động từ; không dùng 逐步 trước tính từ."},{"id":"guli_guwu","t":"鼓励 vs 鼓舞","s":"khuyến khích, động viên / cổ vũ, khích lệ, làm phấn chấn","b":"<b>Điểm giống:</b> cả hai đều là <b>động từ</b>, đều có nghĩa làm cho người ta phấn chấn, tăng thêm lòng tin. Ví dụ dùng được cả hai: 这次谈话，使刘洋受到极大的鼓励/鼓舞。","r":["鼓励 là từ trung tính, có thể dùng cho việc không tốt (怎么还鼓励呢？); 鼓舞 là từ mang nghĩa tốt (褒义词).","鼓励 nhấn mạnh việc thúc đẩy đối phương làm một việc gì, chủ ngữ thường là người hoặc tổ chức, hay dùng kết cấu kiêm ngữ “鼓励某人做某事”; 鼓舞 nhấn mạnh tinh thần phấn chấn lên do chịu một tác động nào đó, chủ ngữ thường là sự vật.","鼓舞 còn là tính từ, chỉ trạng thái hưng phấn, phấn chấn (令人十分鼓舞); 鼓励 không có nghĩa và cách dùng này."],"e":[["这次谈话，使刘洋受到极大的鼓励/鼓舞。","Zhè cì tánhuà, shǐ Liú Yáng shòudào jí dà de gǔlì/gǔwǔ.","Cuộc nói chuyện lần này khiến Lưu Dương được khích lệ rất nhiều."],["吸烟有害健康，你不阻止他，怎么还鼓励呢？","Xīyān yǒuhài jiànkāng, nǐ bù zǔzhǐ tā, zěnme hái gǔlì ne?","Hút thuốc có hại cho sức khỏe, bạn không ngăn cậu ấy lại mà sao còn khuyến khích?"],["新产品的研制成功极大地鼓舞了科技人员。","Xīn chǎnpǐn de yánzhì chénggōng jí dà de gǔwǔle kējì rényuán.","Việc nghiên cứu chế tạo thành công sản phẩm mới đã tiếp thêm nguồn cổ vũ to lớn cho đội ngũ khoa học kỹ thuật."],["近些年，国家越来越鼓励大学生毕业后开办自己的公司。","Jìn xiē nián, guójiā yuè lái yuè gǔlì dàxuéshēng bìyè hòu kāibàn zìjǐ de gōngsī.","Những năm gần đây, nhà nước ngày càng khuyến khích sinh viên sau khi tốt nghiệp mở công ty riêng."],["新的胜利给了全体队员很大的鼓舞。","Xīn de shènglì gěile quántǐ duìyuán hěn dà de gǔwǔ.","Chiến thắng mới đã tiếp thêm cho toàn đội rất nhiều phấn khởi."],["年初制定的目标顺利实现，取得的成绩令人十分鼓舞。","Niánchū zhìdìng de mùbiāo shùnlì shíxiàn, qǔdé de chéngjì lìng rén shífēn gǔwǔ.","Mục tiêu đặt ra từ đầu năm đã hoàn thành suôn sẻ, thành tích đạt được thật khiến người ta vô cùng phấn khởi."],["这些为此付出努力的人们令人尊敬，取得的成绩也令人鼓舞。","Zhèxiē wèi cǐ fùchū nǔlì de rénmen lìng rén zūnjìng, qǔdé de chéngjì yě lìng rén gǔwǔ.","Những người đã nỗ lực vì điều này thật đáng kính trọng, và những thành quả họ đạt được cũng thật đáng khích lệ. <i>(bài khoá)</i>"]],"d":[["父母平时应____孩子多参加体育活动。","鼓励"],["听了他们的发言，我挺受____的，对他们很有信心。","鼓舞"],["感谢大家对我的肯定与____。","鼓励"],["谈判的成功给了他极大的____。","鼓舞"]],"w":"Mẹo: có cấu trúc “鼓励 + ai đó + làm gì” với chủ ngữ là người → dùng 鼓励; chủ ngữ là một sự việc (thắng lợi, thành công…) khiến tinh thần lên cao, hoặc sau 令人/受到 với nghĩa tích cực → thường dùng 鼓舞."}],"ext":[["金属","jīnshǔ","kim loại"],["黄金","huángjīn","vàng"],["银","yín","bạc"],["钢铁","gāngtiě","gang thép, sắt thép"],["煤炭","méitàn","than đá"],["能源","néngyuán","nguồn năng lượng"],["原料","yuánliào","nguyên liệu"],["资源","zīyuán","tài nguyên"]],"extt":"资源","notes":"Bài khoá không có dòng ghi nguồn ở cuối; bài này không có 专名. Phần 热身2 của sách ghi “本课生词中的：绝迹”, nhưng 绝迹 không có trong bảng 39 từ mới và không xuất hiện trong bài khoá — giữ nguyên bảng từ theo sách. Sách ghi từ loại 地震 là đgt. và 废 là tt. — giữ nguyên theo sách. Phần 词语例释 chỉ có 3 mục (密切, 尽量, 逐步) và 1 mục 词语辨析 (鼓励—鼓舞). Hai câu bài khoá dài (“动植物的消失……变为沙漠……” và “有些地区地表水……还要多。”) không có dấu ； nên để nguyên một câu. 练一练 của 密切/尽量/逐步 là bài hoàn thành câu mở nên drill tự đặt từ câu ví dụ của sách; drill 鼓励/鼓舞: câu (1) có đáp án mẫu trong sách, câu (2)–(4) của 做一做 và câu 练习1④ do người soạn tự giải. Bảng 扩展 trong sách chỉ có pinyin, nghĩa tiếng Việt do người soạn bổ sung.","order":[{"z":"环境污染会危害动物、植物以及人类自身。","t":["环境污染","会","危害","动物","植物","以及","人类","自身"],"v":"Ô nhiễm môi trường sẽ gây hại cho động vật, thực vật và cả chính con người."},{"z":"人类自身也饱受污染的危害。","t":["人类","自身","也","饱受","污染","的","危害"],"v":"Bản thân con người cũng đang chịu đủ mọi tác hại của ô nhiễm."},{"z":"此外，垃圾也会对环境造成严重的损害。","t":["此外","垃圾","也","会","对","环境","造成","严重","的","损害"],"v":"Ngoài ra, rác thải cũng gây tổn hại nghiêm trọng cho môi trường."},{"z":"同时，尽量多骑自行车，多选择公共交通，少使用私家车。","t":["同时","尽量","多","骑","自行车","多","选择","公共交通","少","使用","私家车"],"v":"Đồng thời, cố gắng đi xe đạp nhiều hơn, chọn phương tiện công cộng nhiều hơn và ít dùng xe riêng hơn."},{"z":"还有一部分污染和我们的日常生活密切相关。","t":["还有","一部分","污染","和","我们","的","日常生活","密切相关"],"v":"Còn một phần ô nhiễm có liên quan mật thiết đến sinh hoạt hằng ngày của chúng ta. (bài khoá)"},{"z":"刘医生密切地观察着李妈妈病情的发展。","t":["刘","医生","密切","地","观察","着","李妈妈","病情","的","发展"],"v":"Bác sĩ Lưu đang theo dõi sát sao diễn biến bệnh tình của bác Lý."},{"z":"家长应和老师密切配合，形成合力，保持教育的一致性。","t":["家长","应","和","老师","密切配合","形成","合力","保持","教育","的","一致性"],"v":"Phụ huynh nên phối hợp chặt chẽ với giáo viên, tạo thành sức mạnh chung để việc giáo dục được nhất quán."},{"z":"友好城市之间的交往密切了两国人民之间的友谊。","t":["友好城市","之间","的","交往","密切","了","两国人民","之间","的","友谊"],"v":"Sự giao lưu giữa các thành phố kết nghĩa đã thắt chặt tình hữu nghị giữa nhân dân hai nước."},{"z":"老年人要尽量少吃油炸食品。","t":["老年人","要","尽量少","吃","油炸","食品"],"v":"Người cao tuổi nên hạn chế hết mức đồ chiên rán."},{"z":"为了节约能源，请大家都尽量使用节能电器。","t":["为了","节约能源","请","大家","都","尽量","使用","节能","电器"],"v":"Để tiết kiệm năng lượng, mời mọi người cố gắng dùng các thiết bị điện tiết kiệm năng lượng."},{"z":"云计算应用市场规模正在逐步扩大。","t":["云","计算","应用","市场","规模","正在","逐步","扩大"],"v":"Quy mô thị trường ứng dụng điện toán đám mây đang từng bước mở rộng."},{"z":"这次谈话，使刘洋受到极大的鼓励/鼓舞。","t":["这次","谈话","使","刘洋","受到","极大","的","鼓励","/","鼓舞"],"v":"Cuộc nói chuyện lần này khiến Lưu Dương được khích lệ rất nhiều."},{"z":"吸烟有害健康，你不阻止他，怎么还鼓励呢？","t":["吸烟","有害","健康","你","不","阻止","他","怎么","还","鼓励","呢"],"v":"Hút thuốc có hại cho sức khỏe, bạn không ngăn cậu ấy lại mà sao còn khuyến khích?"},{"z":"新产品的研制成功极大地鼓舞了科技人员。","t":["新","产品","的","研制成功","极大","地","鼓舞","了","科技人员"],"v":"Việc nghiên cứu chế tạo thành công sản phẩm mới đã tiếp thêm nguồn cổ vũ to lớn cho đội ngũ khoa học kỹ thuật."},{"z":"近些年，国家越来越鼓励大学生毕业后开办自己的公司。","t":["近些年","国家","越来越","鼓励","大学生","毕业","后","开办","自己","的","公司"],"v"
