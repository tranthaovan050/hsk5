 lưu giữ đến nay, người cùng ông uống rượu nhiều lần nhất là Úc Đạt Phu."},{"h":"资料","p":"zīliào","v":"tài liệu, tư liệu","k":"dt.","x":0,"ez":"现在保存的历史资料记载，他和郁达夫一起喝酒的次数最多。","ev":"Theo ghi chép trong các tư liệu lịch sử còn lưu giữ đến nay, người cùng ông uống rượu nhiều lần nhất là Úc Đạt Phu."},{"h":"曾经","p":"céngjīng","v":"đã từng","k":"phó.","x":0,"ez":"孔子曾经带着学生周游各国14年，传播他的思想。","ev":"Khổng Tử từng dẫn học trò chu du các nước suốt 14 năm để truyền bá tư tưởng của mình."},{"h":"形容","p":"xíngróng","v":"hình dung, miêu tả","k":"đgt.","x":0,"ez":"郁达夫在1933年曾经作诗形容他：“醉眼蒙眬上酒楼，彷徨呐喊两悠悠”，描写得十分形象。","ev":"Năm 1933, Úc Đạt Phu từng làm thơ hình dung ông: \"Mắt say lờ đờ bước lên tửu lâu, Bàng hoàng, Gào thét cả hai đều thong dong\", tả vô cùng sinh động."},{"h":"蒙眬","p":"ménglóng","v":"lờ mờ, mơ màng, mờ ảo","k":"tt.","x":1,"ez":"郁达夫在1933年曾经作诗形容他：“醉眼蒙眬上酒楼，彷徨呐喊两悠悠”，描写得十分形象。","ev":"Năm 1933, Úc Đạt Phu từng làm thơ tả ông: \"Mắt say lờ mờ bước lên tửu lâu, Bàng hoàng, Gào thét cả hai đều thong dong\", tả vô cùng sinh động."},{"h":"悠悠","p":"yōuyōu","v":"thong thả, ung dung","k":"tt.","x":1,"ez":"郁达夫在1933年曾经作诗形容他：“醉眼蒙眬上酒楼，彷徨呐喊两悠悠”，描写得十分形象。","ev":"Năm 1933, Úc Đạt Phu từng làm thơ tả ông: \"Mắt say lờ đờ bước lên tửu lâu, Bàng hoàng, Gào thét cả hai đều ung dung\", tả vô cùng sinh động."},{"h":"形象","p":"xíngxiàng","v":"sinh động","k":"tt.","x":0,"ez":"郁达夫在1933年曾经作诗形容他：“醉眼蒙眬上酒楼，彷徨呐喊两悠悠”，描写得十分形象。","ev":"Năm 1933, Úc Đạt Phu từng làm thơ tả ông: \"Mắt say lờ đờ bước lên tửu lâu, Bàng hoàng, Gào thét cả hai đều thong dong\", tả vô cùng sinh động."},{"h":"郁达夫","p":"Yù Dáfū","v":"Úc Đạt Phu (1896–1945) (nhà văn nổi tiếng của Trung Quốc)","k":"tên riêng","x":0,"ez":"现在保存的历史资料记载，他和郁达夫一起喝酒的次数最多。","ev":"Theo ghi chép trong các tư liệu lịch sử còn lưu giữ đến nay, người cùng ông uống rượu nhiều lần nhất là Úc Đạt Phu."},{"h":"《彷徨》","p":"Pánghuáng","v":"Bàng hoàng (tên một tập truyện ngắn của Lỗ Tấn)","k":"tên riêng","x":0,"ez":"郁达夫在1933年曾经作诗形容他：“醉眼蒙眬上酒楼，彷徨呐喊两悠悠”，描写得十分形象。","ev":"Năm 1933, Úc Đạt Phu từng làm thơ tả ông: \"Mắt say lờ đờ bước lên tửu lâu, Bàng hoàng, Gào thét cả hai đều thong dong\" (ý chỉ hai tập truyện 《彷徨》 và 《呐喊》), tả vô cùng sinh động."},{"h":"《呐喊》","p":"Nàhǎn","v":"Gào thét (tên một tập truyện ngắn của Lỗ Tấn)","k":"tên riêng","x":0,"ez":"郁达夫在1933年曾经作诗形容他：“醉眼蒙眬上酒楼，彷徨呐喊两悠悠”，描写得十分形象。","ev":"Năm 1933, Úc Đạt Phu từng làm thơ tả ông: \"Mắt say lờ đờ bước lên tửu lâu, Bàng hoàng, Gào thét cả hai đều thong dong\" (ý chỉ hai tập truyện 《彷徨》 và 《呐喊》), tả vô cùng sinh động."}]],"texts":[{"no":1,"tz":"","tv":"","lines":[{"s":"","z":"美食很大一部分是靠名人推动的，这一点在民国时期表现得尤其突出。","p":"Měishí hěn dà yí bùfen shì kào míngrén tuīdòng de, zhè yì diǎn zài Mínguó shíqī biǎoxiàn de yóuqí tūchū.","v":"Phần lớn các món ngon được lan toả nhờ người nổi tiếng, điều này thể hiện đặc biệt rõ vào thời Dân Quốc.","b":0},{"s":"","z":"例如著名的文学家鲁迅，在吃喝这件事上，就算是个地道的行家，不但会吃，还会亲自动手做，对许多美食都有独特的见解。","p":"Lìrú zhùmíng de wénxuéjiā Lǔ Xùn, zài chīhē zhè jiàn shì shang, jiù suàn shì ge dìdao de hángjia, búdàn huì chī, hái huì qīnzì dòngshǒu zuò, duì xǔduō měishí dōu yǒu dútè de jiànjiě.","v":"Chẳng hạn như nhà văn nổi tiếng Lỗ Tấn, trong chuyện ăn uống có thể coi là một người sành sỏi thực thụ: không chỉ biết ăn mà còn tự tay nấu, lại có cách nhìn riêng về rất nhiều món ngon.","b":0},{"s":"","z":"这是近代新时尚。","p":"Zhè shì jìndài xīn shíshàng.","v":"Đây là một mốt mới của thời cận đại.","b":0},{"s":"","z":"北京是鲁迅长期生活过的城市，仅从这一时期鲁迅写作的日记中，我们发现他去过的知名餐馆就有65家，另外，他还很爱吃稻香村的点心。","p":"Běijīng shì Lǔ Xùn chángqī shēnghuó guo de chéngshì, jǐn cóng zhè yì shíqī Lǔ Xùn xiězuò de rìjì zhōng, wǒmen fāxiàn tā qù guo de zhīmíng cānguǎn jiù yǒu liùshíwǔ jiā, lìngwài, tā hái hěn ài chī Dàoxiāngcūn de diǎnxin.","v":"Bắc Kinh là thành phố Lỗ Tấn từng sống lâu năm; chỉ riêng trong nhật ký ông viết thời kỳ này, ta đã thấy có tới 65 nhà hàng nổi tiếng ông từng đến, ngoài ra ông còn rất thích ăn bánh ngọt của tiệm Đạo Hương Thôn.","b":0},{"s":"","z":"作为大作家、大学问家，鲁迅对吃很讲究，吃的内容在他的日记里占了很大一部分。","p":"Zuòwéi dà zuòjiā, dà xuéwenjiā, Lǔ Xùn duì chī hěn jiǎngjiu, chī de nèiróng zài tā de rìjì li zhàn le hěn dà yí bùfen.","v":"Là một đại văn hào, một học giả lớn, Lỗ Tấn rất cầu kỳ chuyện ăn uống, chuyện ăn chiếm một phần rất lớn trong nhật ký của ông.","b":0},{"s":"","z":"在众多餐馆里，鲁迅去得最多、最喜欢的是广和居，平均每周都要去一次。","p":"Zài zhòngduō cānguǎn li, Lǔ Xùn qù de zuì duō, zuì xǐhuan de shì Guǎnghéjū, píngjūn měi zhōu dōu yào qù yí cì.","v":"Trong vô số nhà hàng, nơi Lỗ Tấn đến nhiều nhất và thích nhất là Quảng Hòa Cư, trung bình tuần nào cũng phải đến một lần.","b":0},{"s":"","z":"鲁迅经常到这家店的一个重要原因是距离近，广和居的大门就在他当时住的胡同的斜对面。","p":"Lǔ Xùn jīngcháng dào zhè jiā diàn de yí ge zhòngyào yuányīn shì jùlí jìn, Guǎnghéjū de dàmén jiù zài tā dāngshí zhù de hútòng de xié duìmiàn.","v":"Một lý do quan trọng khiến Lỗ Tấn hay đến quán này là vì gần: cổng chính của Quảng Hòa Cư nằm ngay chếch đối diện con hẻm ông ở hồi đó.","b":1},{"s":"","z":"位于菜市口附近的广和居是北京“八大居”之首，在民国时期非常出名。","p":"Wèiyú Càishìkǒu fùjìn de Guǎnghéjū shì Běijīng “bā dà jū” zhī shǒu, zài Mínguó shíqī fēicháng chūmíng.","v":"Quảng Hòa Cư nằm gần Thái Thị Khẩu, đứng đầu \"Bát đại cư\" của Bắc Kinh, rất nổi tiếng vào thời Dân Quốc.","b":0},{"s":"","z":"广和居算不上豪华，但却很适合朋友在这里聚会、热闹。","p":"Guǎnghéjū suàn bu shàng háohuá, dàn què hěn shìhé péngyou zài zhèli jùhuì, rènao.","v":"Quảng Hòa Cư chẳng thể gọi là sang trọng, nhưng lại rất hợp để bạn bè tụ họp, vui vẻ náo nhiệt ở đây.","b":0},{"s":"","z":"这里特别欢迎文人的光临，为他们的聚会创造了很好的条件。","p":"Zhèli tèbié huānyíng wénrén de guānglín, wèi tāmen de jùhuì chuàngzào le hěn hǎo de tiáojiàn.","v":"Nơi đây đặc biệt chào đón giới văn nhân lui tới, tạo điều kiện rất tốt cho những buổi tụ họp của họ.","b":0},{"s":"","z":"广和居院里分成大小不同的各种房间，有一个人的，有三五人小聚的，也有十多个人大聚会的。","p":"Guǎnghéjū yuàn li fēnchéng dàxiǎo bùtóng de gè zhǒng fángjiān, yǒu yí ge rén de, yǒu sān wǔ rén xiǎo jù de, yě yǒu shí duō ge rén dà jùhuì de.","v":"Bên trong Quảng Hòa Cư chia thành đủ loại phòng lớn nhỏ: có phòng cho một người, có phòng cho dăm ba người họp mặt nhỏ, cũng có phòng cho hơn chục người tụ tập đông vui.","b":0},{"s":"","z":"这大大满足了鲁迅爱和朋友吃饭的要求。","p":"Zhè dàdà mǎnzú le Lǔ Xùn ài hé péngyou chīfàn de yāoqiú.","v":"Điều này đáp ứng rất tốt nhu cầu thích ăn uống cùng bạn bè của Lỗ Tấn.","b":0},{"s":"","z":"他爱好交际，大方好客，常呼朋唤友，多数是三五个人一起吃，有时甚至会直接让广和居送外卖到家里，在家招待朋友。","p":"Tā àihào jiāojì, dàfang hàokè, cháng hūpéng-huànyǒu, duōshù shì sān wǔ ge rén yìqǐ chī, yǒushí shènzhì huì zhíjiē ràng Guǎnghéjū sòng wàimài dào jiā li, zài jiā zhāodài péngyou.","v":"Ông thích giao thiệp, rộng rãi, hiếu khách, hay rủ rê bạn bè, phần lớn là dăm ba người cùng ăn, có khi còn bảo thẳng Quảng Hòa Cư mang đồ ăn đến tận nhà để đãi bạn.","b":0},{"s":"","z":"当然最重要的还是因为广和居有鲁迅喜欢的菜。","p":"Dāngrán zuì zhòngyào de háishi yīnwèi Guǎnghéjū yǒu Lǔ Xùn xǐhuan de cài.","v":"Đương nhiên, quan trọng nhất vẫn là vì Quảng Hòa Cư có những món Lỗ Tấn thích.","b":0},{"s":"","z":"那里的菜既有高档的，也有适合普通百姓的，样样都让人有胃口。","p":"Nàli de cài jì yǒu gāodàng de, yě yǒu shìhé pǔtōng bǎixìng de, yàngyàng dōu ràng rén yǒu wèikǒu.","v":"Món ăn ở đó vừa có món cao cấp, vừa có món hợp với người dân bình thường, món nào cũng khiến người ta thấy ngon miệng.","b":0},{"s":"","z":"鲁迅也爱喝酒，虽然明明知道自己有胃病，不应该喝酒，但却很难戒掉。","p":"Lǔ Xùn yě ài hē jiǔ, suīrán míngmíng zhīdào zìjǐ yǒu wèibìng, bù yīnggāi hē jiǔ, dàn què hěn nán jièdiào.","v":"Lỗ Tấn cũng thích uống rượu; dù biết rõ mình bị đau dạ dày, không nên uống, nhưng ông vẫn khó mà cai được.","b":1},{"s":"","z":"他是每顿饭必喝酒的人。","p":"Tā shì měi dùn fàn bì hē jiǔ de rén.","v":"Ông là người bữa nào cũng nhất định phải uống rượu.","b":0},{"s":"","z":"现在保存的历史资料记载，他和郁达夫一起喝酒的次数最多。","p":"Xiànzài bǎocún de lìshǐ zīliào jìzǎi, tā hé Yù Dáfū yìqǐ hē jiǔ de cìshù zuì duō.","v":"Theo ghi chép trong các tư liệu lịch sử còn lưu giữ đến nay, người cùng ông uống rượu nhiều lần nhất là Úc Đạt Phu.","b":0},{"s":"","z":"鲁迅酒量不大，经常喝醉，而且在喝酒的过程中烟不离手。","p":"Lǔ Xùn jiǔliàng bú dà, jīngcháng hēzuì, érqiě zài hē jiǔ de guòchéng zhōng yān bù lí shǒu.","v":"Tửu lượng của Lỗ Tấn không cao, hay bị say, hơn nữa lúc uống rượu thì điếu thuốc không rời tay.","b":0},{"s":"","z":"郁达夫在1933年曾经作诗形容他：“醉眼蒙眬上酒楼，彷徨呐喊两悠悠”，描写得十分形象。","p":"Yù Dáfū zài yī jiǔ sān sān nián céngjīng zuò shī xíngróng tā: “Zuìyǎn ménglóng shàng jiǔlóu, pánghuáng nàhǎn liǎng yōuyōu”, miáoxiě de shífēn xíngxiàng.","v":"Năm 1933, Úc Đạt Phu từng làm thơ tả ông: \"Mắt say lờ đờ bước lên tửu lâu, Bàng hoàng, Gào thét cả hai đều thong dong\", tả vô cùng sinh động.","b":0}]}],"aud":[{"v":"audio/09-2.mp3","t":"audio/09-1.mp3"}],"gram":[{"id":"suan","t":"算","s":"coi là, xem như (động từ)","b":"<b>算</b> là động từ, nghĩa là \"coi là, xem như\" (认作，当作). Sau <b>算</b> có thể thêm <b>了</b> thành <b>算了</b>, biểu thị ý thôi, bỏ qua, không so đo tính toán nữa.","r":["算 (+ 是) + danh từ/cụm từ: coi như là… — 就算是个地道的行家","算了: thôi, bỏ đi, không so đo nữa; đứng cuối câu (扔掉算了) hoặc đầu câu (算了吧，…)","Kết hợp bổ ngữ (词语搭配): 算得上 / 算不上 — coi được là / chẳng thể coi là (广和居算不上豪华)"],"e":[["例如著名的文学家鲁迅，在吃喝这件事上，就算是个地道的行家，……","Lìrú zhùmíng de wénxuéjiā Lǔ Xùn, zài chīhē zhè jiàn shì shang, jiù suàn shì ge dìdao de hángjia, ……","Chẳng hạn như nhà văn nổi tiếng Lỗ Tấn, trong chuyện ăn uống có thể coi là một người sành sỏi thực thụ… <i>(bài khoá)</i>"],["这钱就算我借给你的，将来你有了的时候再还我。","Zhè qián jiù suàn wǒ jiè gěi nǐ de, jiānglái nǐ yǒu le de shíhou zài huán wǒ.","Số tiền này coi như tôi cho cậu mượn, sau này khi nào có thì cậu trả lại tôi."],["不就是一个空瓶子吗？扔掉算了。","Bú jiù shì yí ge kōng píngzi ma? Rēngdiào suàn le.","Chẳng qua chỉ là một cái chai rỗng thôi mà? Vứt đi cho xong."],["算了吧，你跑得再快，也追不上会飞的鸟啊。","Suàn le ba, nǐ pǎo de zài kuài, yě zhuī bu shàng huì fēi de niǎo a.","Thôi đi, cậu có chạy nhanh đến mấy cũng chẳng đuổi kịp con chim biết bay đâu."]],"d":[["这事你找我商量____找对人了，这方面我可懂得不少。","算"],["不就是一个空瓶子吗？扔掉____。","算了"],["广和居____不上豪华，但却很适合朋友在这里聚会、热闹。","算"]],"w":"Đừng nhầm 算 \"coi là\" với 算 \"tính toán\" (vd. 算出他们月收入的平均数 — tính ra mức thu nhập trung bình)."},{"id":"zuowei","t":"作为","s":"coi như; với tư cách (động từ / giới từ)","b":"<b>作为</b> làm động từ nghĩa là \"coi như, xem là\" (看作，认为是……), hay dùng trong mẫu <b>把 A 作为 B</b>. <b>作为</b> còn làm giới từ, dùng để dẫn ra thân phận của người hoặc tính chất của sự vật: \"với tư cách là, là…\".","r":["Động từ: 把 + A + 作为 + B — lấy A làm B (把那儿作为每晚散步的去处)","Động từ: 作为 + danh từ — coi như là… (作为我加班的表扬)","Giới từ: 作为 + thân phận/tính chất, thường đứng đầu câu: 作为大作家、大学问家，鲁迅……","Giới từ cũng có thể đứng sau chủ ngữ: 中国作为主要生产国之一……"],"e":[["北海公园离家最近，所以我把那儿作为每晚散步的去处。","Běihǎi Gōngyuán lí jiā zuì jìn, suǒyǐ wǒ bǎ nàr zuòwéi měi wǎn sànbù de qùchù.","Công viên Bắc Hải gần nhà nhất nên tôi lấy chỗ đó làm nơi đi dạo mỗi tối."],["经理要请我去吃顿饭，说是作为我加班的表扬。","Jīnglǐ yào qǐng wǒ qù chī dùn fàn, shuō shì zuòwéi wǒ jiābān de biǎoyáng.","Giám đốc muốn mời tôi đi ăn một bữa, bảo là coi như khen thưởng việc tôi làm thêm giờ."],["作为大作家、大学问家，鲁迅对吃很讲究，吃的内容在他的日记里占了很大一部分。","Zuòwéi dà zuòjiā, dà xuéwenjiā, Lǔ Xùn duì chī hěn jiǎngjiu, chī de nèiróng zài tā de rìjì li zhàn le hěn dà yí bùfen.","Là một đại văn hào, một học giả lớn, Lỗ Tấn rất cầu kỳ chuyện ăn uống, chuyện ăn chiếm một phần rất lớn trong nhật ký của ông. <i>(bài khoá)</i>"],["西红柿是世界上种植非常普遍的蔬菜，中国作为主要生产国之一也在扩大它的种植面积。","Xīhóngshì shì shìjiè shang zhòngzhí fēicháng pǔbiàn de shūcài, Zhōngguó zuòwéi zhǔyào shēngchǎnguó zhī yī yě zài kuòdà tā de zhòngzhí miànjī.","Cà chua là loại rau được trồng rất phổ biến trên thế giới; Trung Quốc, với tư cách là một trong những nước sản xuất chính, cũng đang mở rộng diện tích trồng loại cây này."]],"d":[["北海公园离家最近，所以我把那儿____每晚散步的去处。","作为"],["经理要请我去吃顿饭，说是____我加班的表扬。","作为"],["____大作家、大学问家，鲁迅对吃很讲究。","作为"]],"w":"Khi 作为 làm giới từ đứng đầu câu, chủ ngữ phía sau phải chính là người/vật mang thân phận đó (作为大作家……，鲁迅……)."},{"id":"cengjing","t":"曾经","s":"đã từng (phó từ)","b":"<b>曾经</b> là phó từ, biểu thị trước đây đã từng có một hành vi nào đó hoặc đã từng xảy ra một tình huống nào đó. Đặt trước động từ (cụm vị ngữ).","r":["Chủ ngữ + (thời gian) + 曾经 + động từ: 郁达夫在1933年曾经作诗……","Nói về việc đã xảy ra trong quá khứ: 鲁迅曾经说……；孔子曾经带着学生周游各国14年"],"e":[["郁达夫在1933年曾经作诗形容他：“醉眼蒙眬上酒楼，彷徨呐喊两悠悠”，描写得十分形象。","Yù Dáfū zài yī jiǔ sān sān nián céngjīng zuò shī xíngróng tā: “Zuìyǎn ménglóng shàng jiǔlóu, pánghuáng nàhǎn liǎng yōuyōu”, miáoxiě de shífēn xíngxiàng.","Năm 1933, Úc Đạt Phu từng làm thơ tả ông: \"Mắt say lờ đờ bước lên tửu lâu, Bàng hoàng, Gào thét cả hai đều thong dong\", tả vô cùng sinh động. <i>(bài khoá)</i>"],["鲁迅曾经说他是将别人喝牛奶、咖啡的时间用来学习。","Lǔ Xùn céngjīng shuō tā shì jiāng biérén hē niúnǎi, kāfēi de shíjiān yònglái xuéxí.","Lỗ Tấn từng nói ông đã dùng khoảng thời gian người khác uống sữa, uống cà phê để học tập."],["孔子曾经带着学生周游各国14年，传播他的思想。","Kǒngzǐ céngjīng dàizhe xuésheng zhōuyóu gè guó shísì nián, chuánbō tā de sīxiǎng.","Khổng Tử từng dẫn học trò chu du các nước suốt 14 năm để truyền bá tư tưởng của mình."]],"d":[["人们____把西红柿当做有害的果子。","曾经"],["郁达夫在1933年____作诗形容他。","曾经"],["鲁迅____说他是将别人喝牛奶、咖啡的时间用来学习。","曾经"]],"w":"曾经 vs 已经 (练习 2④): 曾经 nói việc đã từng xảy ra trong quá khứ (nay thường không còn); 已经 nhấn mạnh việc đã hoàn thành, kết quả thường kéo dài đến hiện tại."},{"id":"qinzi_ziji","t":"亲自 vs 自己","s":"tự mình, đích thân / bản thân","b":"Điểm giống: cả hai đều có nghĩa \"bản thân, tự mình\". Ví dụ: (鲁迅)不但会吃，还会<b>亲自/自己</b>动手做。","r":["亲自: phó từ, thường đứng giữa chủ ngữ và động từ — 老人总是亲自喂养他的猴子。","亲自: thường dùng cho người có thân phận, địa vị cao, hoặc việc bình thường ít khi làm — 这份礼物是市长亲自为生病的小女孩儿做的。","自己: đại từ, có thể làm chủ ngữ, tân ngữ, định ngữ… — 请大家带好自己的资料。","自己: nhấn mạnh người thực hiện hành động là bản thân chứ không phải người khác — 你应该自己努力学习，不能总是靠别人。"],"e":[["（鲁迅）不但会吃，还会亲自/自己动手做。","(Lǔ Xùn) búdàn huì chī, hái huì qīnzì / zìjǐ dòngshǒu zuò.","(Lỗ Tấn) không chỉ biết ăn mà còn tự tay nấu. <i>(bài khoá)</i>"],["老人总是亲自喂养他的猴子。","Lǎorén zǒngshì qīnzì wèiyǎng tā de hóuzi.","Ông lão lúc nào cũng tự tay nuôi con khỉ của mình."],["这份礼物是市长亲自为生病的小女孩儿做的。","Zhè fèn lǐwù shì shìzhǎng qīnzì wèi shēngbìng de xiǎo nǚháir zuò de.","Món quà này do chính ngài thị trưởng tự tay làm cho cô bé bị ốm."],["请大家带好自己的资料。","Qǐng dàjiā dài hǎo zìjǐ de zīliào.","Mọi người nhớ mang theo tài liệu của mình nhé."],["你应该自己努力学习，不能总是靠别人。","Nǐ yīnggāi zìjǐ nǔlì xuéxí, bù néng zǒngshì kào biérén.","Em phải tự mình cố gắng học, không thể lúc nào cũng dựa vào người khác."]],"d":[["今年我的业绩全公司第一，新年晚会上，总裁____给我发了奖金。","亲自"],["希望您能____来参加这次活动。","亲自"],["每个学生都有____的性格特点和兴趣爱好，因此老师在教育学生时应该注意选择合适的方法。","自己"],["我听说总理将____参加这次活动。","亲自"]],"w":"亲自 là phó từ nên không làm định ngữ hay tân ngữ: ✗ 带好亲自的资料 → ✓ 带好自己的资料. Câu 这是你____的事，应该____做 chỉ dùng được 自己 (sách đánh dấu 亲自 ×)."}],"ext":[["道德","dàodé","đạo đức"],["传统","chuántǒng","truyền thống"],["风俗","fēngsú","phong tục"],["制度","zhìdù","chế độ"],["秩序","zhìxù","trật tự"],["权力","quánlì","quyền lực"],["权利","quánlì","quyền lợi"],["义务","yìwù","nghĩa vụ"],["文明","wénmíng","văn minh"],["人口","rénkǒu","dân số"],["集体","jítǐ","tập thể"]],"extt":"社会","notes":"Nguồn bài khoá: 改编自《民国吃家》，作者：二毛. Bài khoá 648 chữ, sách chia 4 đoạn; ở đây gộp đoạn 1+2 thành phần 1 (từ 1–16). Từ 25 呼朋唤友 sách không ghi từ loại. Bảng 扩展 (社会) sách chỉ in chữ Hán + pinyin, nghĩa Việt do người soạn bổ sung. Ví dụ (4) của 作为 bỏ các chú thích pinyin/nghĩa trong ngoặc (种植, 扩大, 面积) mà sách chèn vào câu. Không có chỗ mờ.","order":[{"z":"广和居算不上豪华，但却很适合朋友在这里聚会、热闹。","t":["广和居","算不上","豪华","但","却","很","适合","朋友","在","这里","聚会","热闹"],"v":"Quảng Hòa Cư chẳng thể gọi là sang trọng, nhưng lại rất hợp để bạn bè tụ họp, vui vẻ náo nhiệt ở đây."},{"z":"这大大满足了鲁迅爱和朋友吃饭的要求。","t":["这","大大","满足","了","鲁迅","爱","和","朋友","吃饭","的","要求"],"v":"Điều này đáp ứng rất tốt nhu cầu thích ăn uống cùng bạn bè của Lỗ Tấn."},{"z":"当然最重要的还是因为广和居有鲁迅喜欢的菜。","t":["当然","最","重要","的","还是","因为","广和居","有","鲁迅","喜欢","的","菜"],"v":"Đương nhiên, quan trọng nhất vẫn là vì Quảng Hòa Cư có những món Lỗ Tấn thích."},{"z":"他是每顿饭必喝酒的人。","t":["他","是","每顿饭","必","喝酒","的","人"],"v":"Ông là người bữa nào cũng nhất định phải uống rượu."},{"z":"鲁迅酒量不大，经常喝醉，而且在喝酒的过程中烟不离手。","t":["鲁迅","酒量","不","大","经常","喝醉","而且","在","喝酒","的","过 ,"k":"tên riêng","x":0,"ez":"1895年12月28日，法国人卢米埃尔兄弟在巴黎第一次向公众播放了短片《火车到站》，这一天后来成为电影产生的纪念日，兄弟俩也成为历史上最早的电影导演。","ev":"Ngày 28 tháng 12 năm 1895, anh em nhà Lumière người Pháp lần đầu tiên chiếu cho công chúng xem đoạn phim ngắn “Tàu hỏa vào ga” tại Paris; về sau ngày này trở thành ngày kỷ niệm sự ra đời của điện ảnh, còn hai anh em cũng trở thành những đạo diễn điện ảnh đầu tiên trong lịch sử."}]],"texts":[{"no":1,"tz":"","tv":"","lines":[{"s":"","z":"1872年的一天，在美国加利福尼亚州的一个酒店里，斯坦福与科恩围绕“马奔跑时蹄子是否着地”进行了辩论。","p":"1872 nián de yì tiān, zài Měiguó Jiālìfúníyà Zhōu de yí ge jiǔdiàn li, Sītǎnfú yǔ Kē'ēn wéirào “mǎ bēnpǎo shí tízi shìfǒu zháodì” jìnxíngle biànlùn.","v":"Một ngày năm 1872, tại một khách sạn ở bang California, Mỹ, Stanford và Cohen đã tranh luận xoay quanh câu hỏi “khi ngựa phi nước đại, móng có chạm đất hay không”.","b":0},{"s":"","z":"斯坦福认为，马奔跑得那么快，在跳起时四蹄应该都是不落地的；","p":"Sītǎnfú rènwéi, mǎ bēnpǎo de nàme kuài, zài tiàoqǐ shí sì tí yīnggāi dōu shì bú luòdì de;","v":"Stanford cho rằng ngựa chạy nhanh như thế thì lúc bật lên, cả bốn móng đều phải rời khỏi mặt đất;","b":0},{"s":"","z":"而科恩认为，马要是四蹄都不着地，那不是成了青蛙啦？","p":"ér Kē'ēn rènwéi, mǎ yàoshi sì tí dōu bù zháodì, nà bú shì chéngle qīngwā la?","v":"còn Cohen thì cho rằng nếu cả bốn móng ngựa đều không chạm đất thì chẳng phải nó thành con ếch rồi sao?","b":0},{"s":"","z":"应该是始终有一蹄着地。","p":"Yīnggāi shì shǐzhōng yǒu yì tí zháodì.","v":"Lúc nào cũng phải có một móng chạm đất.","b":0},{"s":"","z":"两人各执一词，争论得脸红脖子粗，谁也说服不了谁。","p":"Liǎng rén gè zhí yì cí, zhēnglùn de liǎn hóng bózi cū, shéi yě shuōfú bu liǎo shéi.","v":"Hai người mỗi người một ý, cãi nhau đến đỏ mặt tía tai, chẳng ai thuyết phục được ai.","b":0},{"s":"","z":"于是他们就请英国摄影师麦布里奇来判断，可麦布里奇也弄不清楚。","p":"Yúshì tāmen jiù qǐng Yīngguó shèyǐngshī Màibùlǐqí lái pànduàn, kě Màibùlǐqí yě nòng bu qīngchu.","v":"Thế là họ mời nhiếp ảnh gia người Anh Muybridge đến phân xử, nhưng Muybridge cũng không biết rõ.","b":0},{"s":"","z":"不过摄影师毕竟是摄影师，主意还是有的。","p":"Búguò shèyǐngshī bìjìng shì shèyǐngshī, zhǔyi háishi yǒu de.","v":"Có điều nhiếp ảnh gia rốt cuộc vẫn là nhiếp ảnh gia, ông ấy vẫn nghĩ ra cách.","b":0},{"s":"","z":"他们一起来到一个操场，在一条跑道的一边等距离放上24个照相机，照相机对准跑道；","p":"Tāmen yìqǐ láidào yí ge cāochǎng, zài yì tiáo pǎodào de yìbiān děng jùlí fàngshang èrshísì ge zhàoxiàngjī, zhàoxiàngjī duìzhǔn pǎodào;","v":"Họ cùng đến một sân tập, đặt 24 chiếc máy ảnh cách đều nhau dọc một bên đường chạy, ống kính hướng thẳng vào đường chạy;","b":0},{"s":"","z":"在跑道另一边打24个洞，分别插进24根木棍，木棍上系着细线，细线穿过跑道，接上相机快门。","p":"zài pǎodào lìng yìbiān dǎ èrshísì ge dòng, fēnbié chājìn èrshísì gēn mùgùn, mùgùn shang jìzhe xìxiàn, xìxiàn chuānguò pǎodào, jiēshang xiàngjī kuàimén.","v":"ở bên kia đường chạy thì đào 24 cái lỗ, cắm vào mỗi lỗ một cây gậy gỗ, trên gậy buộc sợi dây mảnh, dây căng ngang qua đường chạy và nối với nút chụp của máy ảnh.","b":0},{"s":"","z":"一切都准备好了，麦布里奇让一匹马从跑道的一头飞奔到另一头，马一边跑，一边按顺序撞断拦路的24根细线，相机连续拍下了24张相片，相邻两张相片的差距都很小。","p":"Yíqiè dōu zhǔnbèi hǎo le, Màibùlǐqí ràng yì pǐ mǎ cóng pǎodào de yì tóu fēibēn dào lìng yì tóu, mǎ yìbiān pǎo, yìbiān àn shùnxù zhuàngduàn lánlù de èrshísì gēn xìxiàn, xiàngjī liánxù pāixiale èrshísì zhāng xiàngpiàn, xiānglín liǎng zhāng xiàngpiàn de chājù dōu hěn xiǎo.","v":"Mọi thứ đã sẵn sàng, Muybridge cho một con ngựa phi từ đầu này sang đầu kia đường chạy; ngựa vừa chạy vừa lần lượt làm đứt 24 sợi dây chắn ngang đường, máy ảnh liên tiếp chụp được 24 tấm, hai tấm liền nhau chỉ khác nhau rất ít.","b":1},{"s":"","z":"相片显示：马奔跑时始终有一蹄着地，科恩赢了。","p":"Xiàngpiàn xiǎnshì: mǎ bēnpǎo shí shǐzhōng yǒu yì tí zháodì, Kē'ēn yíng le.","v":"Các tấm ảnh cho thấy: khi ngựa chạy, lúc nào cũng có một móng chạm đất – Cohen đã thắng.","b":0},{"s":"","z":"事后，有人无意识地快速拉动那一长串相片，“奇迹”出现了：各张相片中静止的马连成了一匹运动的马，相片“活”了。","p":"Shìhòu, yǒu rén wú yìshi de kuàisù lādòng nà yì cháng chuàn xiàngpiàn, “qíjì” chūxiàn le: gè zhāng xiàngpiàn zhōng jìngzhǐ de mǎ liánchéngle yì pǐ yùndòng de mǎ, xiàngpiàn “huó” le.","v":"Sau đó, có người vô tình kéo nhanh chuỗi ảnh dài ấy, và “kỳ tích” đã xuất hiện: những con ngựa đứng yên trong từng tấm ảnh nối lại thành một con ngựa đang chuyển động, các tấm ảnh như “sống” dậy.","b":0},{"s":"","z":"这就是电影最早的样子。","p":"Zhè jiù shì diànyǐng zuì zǎo de yàngzi.","v":"Đó chính là hình hài sơ khai nhất của điện ảnh.","b":0},{"s":"","z":"经过艰苦的试验，电影拍摄技术逐渐改进、成熟。","p":"Jīngguò jiānkǔ de shìyàn, diànyǐng pāishè jìshù zhújiàn gǎijìn, chéngshú.","v":"Trải qua quá trình thử nghiệm gian khổ, kỹ thuật quay phim dần dần được cải tiến và hoàn thiện.","b":1},{"s":"","z":"1895年12月28日，法国人卢米埃尔兄弟在巴黎第一次向公众播放了短片《火车到站》，这一天后来成为电影产生的纪念日，兄弟俩也成为历史上最早的电影导演。","p":"Yībājiǔwǔ nián shí'èr yuè èrshíbā rì, Fǎguórén Lúmǐ'āi'ěr xiōngdì zài Bālí dì-yī cì xiàng gōngzhòng bōfàngle duǎnpiàn 《Huǒchē Dào Zhàn》, zhè yì tiān hòulái chéngwéi diànyǐng chǎnshēng de jìniànrì, xiōngdì liǎ yě chéngwéi lìshǐ shang zuì zǎo de diànyǐng dǎoyǎn.","v":"Ngày 28 tháng 12 năm 1895, anh em nhà Lumière người Pháp lần đầu tiên chiếu cho công chúng xem đoạn phim ngắn “Tàu hỏa vào ga” tại Paris; về sau ngày này trở thành ngày kỷ niệm sự ra đời của điện ảnh, còn hai anh em cũng trở thành những đạo diễn điện ảnh đầu tiên trong lịch sử.","b":0},{"s":"","z":"留心生活的每一瞬间，并为之争论，适时请求帮助、认真研究，或许重大发现就在你的眼前。","p":"Liúxīn shēnghuó de měi yí shùnjiān, bìng wèi zhī zhēnglùn, shìshí qǐngqiú bāngzhù, rènzhēn yánjiū, huòxǔ zhòngdà fāxiàn jiù zài nǐ de yǎnqián.","v":"Hãy để tâm đến từng khoảnh khắc trong cuộc sống và tranh luận vì nó, đúng lúc thì nhờ người giúp đỡ, nghiêm túc nghiên cứu, biết đâu phát hiện trọng đại đang ở ngay trước mắt bạn.","b":0}]}],"aud":[{"v":"audio/10-2.mp3","t":"audio/10-1.mp3"}],"gram":[{"id":"bijing","t":"毕竟","s":"rốt cuộc, suy cho cùng (phó từ)","b":"<b>毕竟</b> là <b>phó từ</b>, sách giải thích là “到底，终于” – rốt cuộc, cuối cùng thì vẫn là. Ngoài ra, <b>毕竟</b> còn dùng để <b>chỉ ra phần quan trọng nhất hoặc đúng nhất</b> của sự việc, thường đi kèm với câu mang ý “(dù thế nào thì) kết luận vẫn là như vậy”. Vị trí: đứng sau chủ ngữ, trước vị ngữ, hoặc đứng đầu một phân câu để nêu lý do mang tính quyết định.","r":["Nghĩa “rốt cuộc, cuối cùng (vẫn)”: 虽然……，但毕竟 + kết quả (但毕竟完成了任务)","Mẫu nhấn bản chất: A 毕竟是 A (摄影师毕竟是摄影师) – dù sao A vẫn là A, nên có phẩm chất vốn có của A","Nêu lý do then chốt: vế trước nêu nhận định, vế sau dùng 毕竟 + lý do quan trọng nhất (他不高兴是正常的，毕竟……)","Vị trí: trước động từ/vị ngữ hoặc đầu phân câu; ✗ 他是毕竟摄影师 → ✓ 他毕竟是摄影师"],"e":[["虽然我们遇到了很多困难，但毕竟完成了任务。","Suīrán wǒmen yùdàole hěn duō kùnnan, dàn bìjìng wánchéngle rènwu.","Tuy chúng tôi gặp rất nhiều khó khăn nhưng rốt cuộc vẫn hoàn thành nhiệm vụ."],["不过摄影师毕竟是摄影师，主意还是有的。","Búguò shèyǐngshī bìjìng shì shèyǐngshī, zhǔyi háishi yǒu de.","Có điều nhiếp ảnh gia rốt cuộc vẫn là nhiếp ảnh gia, ông ấy vẫn nghĩ ra cách. <i>(bài khoá)</i>"],["生活中总有无法解决的问题，毕竟不是所有的对错都能讲清楚，甚至可能根本就没有真正的对与错。","Shēnghuó zhōng zǒng yǒu wúfǎ jiějué de wèntí, bìjìng bú shì suǒyǒu de duìcuò dōu néng jiǎng qīngchu, shènzhì kěnéng gēnběn jiù méiyǒu zhēnzhèng de duì yǔ cuò.","Trong cuộc sống luôn có những vấn đề không thể giải quyết, suy cho cùng không phải chuyện đúng sai nào cũng nói rõ được, thậm chí có khi chẳng hề có đúng sai thật sự."],["他不高兴是正常的，毕竟没有人能在摔得头破血流的时候，还高兴得起来。","Tā bù gāoxìng shì zhèngcháng de, bìjìng méiyǒu rén néng zài shuāi de tóu pò xuè liú de shíhou, hái gāoxìng de qilai.","Anh ấy không vui cũng là bình thường, suy cho cùng chẳng ai ngã đến vỡ đầu chảy máu mà còn vui nổi."]],"d":[["____是秋天了，再热也不会像夏天那样。","毕竟"],["虽然我们遇到了很多困难，但____完成了任务。","毕竟"],["他不高兴是正常的，____没有人能在摔得头破血流的时候，还高兴得起来。","毕竟"]],"w":"毕竟 khác 终于: 终于 nhấn kết quả đến sau một thời gian chờ đợi (他终于来了); 毕竟 nhấn bản chất/sự thật không đổi hoặc lý do then chốt (他毕竟是孩子). Khi nêu lý do, 毕竟 thường đứng ở vế sau."},{"id":"zhujian","t":"逐渐","s":"dần dần (phó từ)","b":"<b>逐渐</b> là <b>phó từ</b>, biểu thị <b>mức độ hoặc số lượng tăng lên hay giảm đi từng chút một</b>. Đứng trước động từ hoặc tính từ làm trạng ngữ, diễn tả sự thay đổi diễn ra từ từ, liên tục.","r":["逐渐 + động từ: 逐渐限制 / 逐渐受到……欢迎 / 逐渐改进","逐渐 + tính từ (chỉ sự biến đổi): 逐渐成熟","Hay đi với ngữ cảnh có quá trình: 经过……，逐渐……；首先……，并逐渐……","✗ 他逐渐地来了 (hành động một lần) → ✓ 天气逐渐暖和了 (biến đổi từ từ)"],"e":[["食物越来越少，老人不得不逐渐限制猴子的食量。","Shíwù yuè lái yuè shǎo, lǎorén bù dé bù zhújiàn xiànzhì hóuzi de shíliàng.","Thức ăn ngày càng ít, ông lão đành phải hạn chế dần khẩu phần của lũ khỉ."],["这项运动首先在亚太地区流行，并逐渐受到世界各地人们的欢迎。","Zhè xiàng yùndòng shǒuxiān zài Yà-Tài dìqū liúxíng, bìng zhújiàn shòudào shìjiè gèdì rénmen de huānyíng.","Môn thể thao này thịnh hành trước tiên ở khu vực châu Á – Thái Bình Dương, rồi dần dần được mọi người khắp thế giới yêu thích."],["经过艰苦的试验，电影拍摄技术逐渐改进、成熟。","Jīngguò jiānkǔ de shìyàn, diànyǐng pāishè jìshù zhújiàn gǎijìn, chéngshú.","Trải qua quá trình thử nghiệm gian khổ, kỹ thuật quay phim dần dần được cải tiến và hoàn thiện. <i>(bài khoá)</i>"]],"d":[["食物越来越少，老人不得不____限制猴子的食量。","逐渐"],["这项运动首先在亚太地区流行，并____受到世界各地人们的欢迎。","逐渐"],["经过艰苦的试验，电影拍摄技术____改进、成熟。","逐渐"]],"w":"逐渐 nhấn sự thay đổi tự nhiên, từng bước theo thời gian; không dùng cho hành động xảy ra một lần, tức thời."},{"id":"huoxu","t":"或许","s":"có lẽ, có thể (phó từ)","b":"<b>或许</b> là <b>phó từ</b>, nghĩa là “也许，有可能” – có lẽ, biết đâu, có khả năng. Dùng để nêu một phỏng đoán hoặc khả năng chưa chắc chắn. Thường đứng trước vị ngữ, hoặc đứng ở đầu câu/phân câu.","r":["Chủ ngữ + 或许 + vị ngữ: ……或许这次会有变化 (hay đi với 会)","或许 đứng đầu câu: 或许正是因为……，你就会……","Dùng ở vế sau để nêu khả năng/kết quả có thể xảy ra: ……，或许重大发现就在你的眼前","Dễ nhầm: 或许 (có lẽ) ≠ 或者 (hoặc là): ✗ 吃中餐或许西餐都可以 → ✓ 吃中餐或者西餐都可以"],"e":[["虽然以前她不支持你，但或许这次会有变化。","Suīrán yǐqián tā bù zhīchí nǐ, dàn huòxǔ zhè cì huì yǒu biànhuà.","Tuy trước đây cô ấy không ủng hộ bạn, nhưng biết đâu lần này sẽ khác."],["或许正是因为这一点一滴的努力，你就会走在别人的前面。","Huòxǔ zhèng shì yīnwèi zhè yìdiǎn yìdī de nǔlì, nǐ jiù huì zǒu zài biérén de qiánmiàn.","Có lẽ chính nhờ những nỗ lực từng chút một ấy mà bạn sẽ đi trước người khác."],["留心生活的每一瞬间，并为之争论，适时请求帮助、认真研究，或许重大发现就在你的眼前。","Liúxīn shēnghuó de měi yí shùnjiān, bìng wèi zhī zhēnglùn, shìshí qǐngqiú bāngzhù, rènzhēn yánjiū, huòxǔ zhòngdà fāxiàn jiù zài nǐ de yǎnqián.","Hãy để tâm đến từng khoảnh khắc trong cuộc sống và tranh luận vì nó, đúng lúc thì nhờ người giúp đỡ, nghiêm túc nghiên cứu, biết đâu phát hiện trọng đại đang ở ngay trước mắt bạn. <i>(bài khoá)</i>"]],"d":[["虽然以前她不支持你，但____这次会有变化。","或许"],["____正是因为这一点一滴的努力，你就会走在别人的前面。","或许"],["留心生活的每一瞬间，并为之争论，适时请求帮助、认真研究，____重大发现就在你的眼前。","或许"]],"w":"Đừng nhầm 或许 với 或者: 或者 là liên từ “hoặc” nối hai lựa chọn (练习 2: 吃中餐或者西餐都可以); 或许 là phó từ chỉ khả năng “có lẽ”."},{"id":"xianshi_xiande","t":"显示 vs 显得","s":"cho thấy, thể hiện – tỏ ra, trông có vẻ (động từ)","b":"<b>Điểm giống:</b> 显示 và 显得 đều là <b>động từ</b>, đều mang nghĩa “biểu hiện ra, khiến người ta nhìn thấy”, nhưng <b>thông thường không thể thay thế cho nhau</b>.","r":["显示: chỉ việc thể hiện ra một <b>thái độ, năng lực hoặc tình hình</b> nào đó (相片显示：马奔跑时始终有一蹄着地)","显得: chỉ việc thể hiện ra một <b>đặc tính</b> nào đó (几年不见，他显得成熟多了)","显示: thường kết hợp với <b>danh từ hoặc mệnh đề (小句)</b> – 显示出了他的才能 / 调查显示，……","显得: thường kết hợp với <b>tính từ</b> – 显得成熟 / 显得格外明亮"],"e":[["相片显示：马奔跑时始终有一蹄着地。","Xiàngpiàn xiǎnshì: mǎ bēnpǎo shí shǐzhōng yǒu yì tí zháodì.","Các tấm ảnh cho thấy: khi ngựa chạy, lúc nào cũng có một móng chạm đất. <i>(bài khoá)</i>"],["这次活动的组织显示出了他的才能。","Zhè cì huódòng de zǔzhī xiǎnshì chūle tā de cáinéng.","Việc tổ chức hoạt động lần này đã cho thấy tài năng của anh ấy."],["几年不见，他显得成熟多了。","Jǐ nián bú jiàn, tā xiǎnde chéngshú duō le.","Mấy năm không gặp, trông anh ấy chín chắn hơn nhiều."],["中秋节那天，月亮显得格外明亮。","Zhōngqiū Jié nà tiān, yuèliang xiǎnde géwài míngliàng.","Hôm Tết Trung thu, mặt trăng trông sáng lạ thường."]],"d":[["他最近怎么了？总是____不太高兴。","显得"],["调查____，只有37%的人愿意回到没有手机的时代。","显示"],["节日的北京____更加美丽。","显得"],["你得____出自己的本领，公司才会愿意用你。","显示"]],"w":"Mẹo: sau chỗ trống là tính từ (高兴、美丽、成熟) → 显得; sau là danh từ/mệnh đề hoặc có 出 + năng lực, kết quả (显示出才能, 调查显示……) → 显示."}],"ext":[["围巾","wéijīn","khăn quàng cổ"],["领带","lǐngdài","cà vạt"],["手套","shǒutào","găng tay"],["牛仔裤","niúzǎikù","quần jean"],["丝绸","sīchóu","lụa"],["布","bù","vải"],["耳环","ěrhuán","bông tai"],["戒指","jièzhǐ","nhẫn"]],"extt":"服饰","notes":"Dòng chú thích nguồn cuối bài: 改编自《小故事　大道理》，作者：胡晓. Bài khoá (560字) chép từ trang A082–A084, chia 3 đoạn: đoạn 1 = đoạn văn thứ nhất (từ 1–18 + 专名 1–4), đoạn 2 = hai đoạn văn “一切都准备好了…” và “事后…” (từ 19–24), đoạn 3 = hai đoạn văn cuối (từ 25–37 + 专名 5). Sách in từ 5 là 蹄（子）tí (zi); trong JSON ghi han = 蹄子 để khớp chữ trong bài khoá (蹄子是否着地), pinyin giữ nguyên cách in của sách. Từ có dấu * (ngoài đề cương): 4 奔跑, 5 蹄（子）, 7 青蛙, 17 棍, 24 意识, 26 试验, 34 瞬间. Từ 19 匹 sách ghi “lượng. (được dùng cho ngựa) con”. Từ 奇迹 (số 2) có trong tên bài, xuất hiện lại trong đoạn 2 (“奇迹”出现了). Câu dài ở đoạn 1 (斯坦福认为……；而科恩认为……？ và 他们一起来到……；在跑道另一边……) được cắt tại dấu ；. Ví dụ (4) của 毕竟 trong sách có chú thích 血 (xuè, máu), đã lược phần chú thích khỏi câu ví dụ. Bảng 扩展 (服饰) trong sách chỉ có chữ Hán + pinyin, nghĩa tiếng Việt do người soạn bổ sung. Drill 毕竟 câu 1 lấy từ 练习 3 (给括号里的词选择适当的位置, câu ②); drill 显示/显得 lấy từ 做一做 (câu 1 sách đã cho đáp án 显得). Các drill khác (毕竟 câu 2–3, 逐渐, 或许) tự đặt từ câu ví dụ của sách vì 练一练 là bài hoàn thành câu mở. vocab_ex của 辩论, 啦, 说服, 系, 拦, 拍, 导演, 差距 lấy từ câu trong phần 练习 của sách (đã điền đáp án); 成熟 lấy từ bảng 词语辨析.","order":[{"z":"应该是始终有一蹄着地。","t":["应该","是","始终","有","一蹄","着","地"],"v":"Lúc nào cũng phải có một móng chạm đất."},{"z":"两人各执一词，争论得脸红脖子粗，谁也说服不了谁。","t":["两人","各执一词","争论","得","脸红脖子粗","谁","也","说服","不了","谁"],"v":"Hai người mỗi người một ý, cãi nhau đến đỏ mặt tía tai, chẳng ai thuyết phục được ai."},{"z":"不过摄影师毕竟是摄影师，主意还是有的。","t":["不过","摄影师","毕竟","是","摄影师","主意","还是","有","的"],"v":"Có điều nhiếp ảnh gia rốt cuộc vẫn là nhiếp ảnh gia, ông ấy vẫn nghĩ ra cách."},{"z":"这就是电影最早的样子。","t":["这","就是","电影","最早","的","样子"],"v":"Đó chính là hình hài sơ khai nhất của điện ảnh."},{"z":"经过艰苦的试验，电影拍摄技术逐渐改进、成熟。","t":["经过","艰苦","的","试验","电影","拍摄","技术","逐渐","改进","成熟"],"v":"Trải qua quá trình thử nghiệm gian khổ, kỹ thu hút đập nhanh thêm 10 nhịp."},{"h":"清醒","p":"qīngxǐng","v":"tỉnh táo; tỉnh lại","k":"tt./đgt.","x":1,"ez":"我被一阵吵闹声突然惊醒，过了半天，脑子才清醒过来。","ev":"Tôi bị một tràng tiếng ồn ào làm giật mình tỉnh giấc, mãi một lúc lâu đầu óc mới tỉnh táo lại."},{"h":"呼吸","p":"hūxī","v":"hít thở","k":"đgt.","x":0,"ez":"从睡眠状态过渡到清醒状态时，人的呼吸会从16次/分钟提高到24次/分钟，心跳每分钟加快10次。","ev":"Khi chuyển từ trạng thái ngủ sang trạng thái tỉnh táo, nhịp thở của con người sẽ tăng từ 16 lần/phút lên 24 lần/phút, tim mỗi phút đập nhanh thêm 10 nhịp."},{"h":"心理","p":"xīnlǐ","v":"tâm lý","k":"dt.","x":0,"ez":"如果突然被闹钟叫醒，将在心理上使人产生心慌、情绪低落、感觉没睡醒等不适。","ev":"Nếu đột ngột bị đồng hồ báo thức đánh thức, về mặt tâm lý người ta sẽ thấy khó chịu như bồn chồn, tâm trạng ủ rũ, cảm giác như chưa ngủ dậy."},{"h":"慌（张）","p":"huāng (zhāng)","v":"luống cuống, bối rối","k":"tt.","x":0,"ez":"如果突然被闹钟叫醒，将在心理上使人产生心慌、情绪低落、感觉没睡醒等不适。","ev":"Nếu đột ngột bị đồng hồ báo thức đánh thức, về mặt tâm lý người ta sẽ thấy khó chịu như bồn chồn, tâm trạng ủ rũ, cảm giác như chưa ngủ dậy."},{"h":"情绪","p":"qíngxù","v":"tâm trạng, tinh thần","k":"dt.","x":0,"ez":"如果突然被闹钟叫醒，将在心理上使人产生心慌、情绪低落、感觉没睡醒等不适。","ev":"Nếu đột ngột bị đồng hồ báo thức đánh thức, về mặt tâm lý người ta sẽ thấy khó chịu như bồn chồn, tâm trạng ủ rũ, cảm giác như chưa ngủ dậy."},{"h":"低落","p":"dīluò","v":"suy nhược, ủ rũ","k":"tt.","x":0,"ez":"如果突然被闹钟叫醒，将在心理上使人产生心慌、情绪低落、感觉没睡醒等不适。","ev":"Nếu đột ngột bị đồng hồ báo thức đánh thức, về mặt tâm lý người ta sẽ thấy khó chịu như bồn chồn, tâm trạng ủ rũ, cảm giác như chưa ngủ dậy."},{"h":"记忆","p":"jìyì","v":"nhớ; ký ức","k":"đgt./dt.","x":0,"ez":"如果是从深度睡眠中被突然叫醒，那么，人的短期记忆能力、计算技能都会受到影响，这些能力最多为正常状态的65%，与醉酒者相当。","ev":"Nếu bị đánh thức đột ngột khi đang ngủ sâu thì khả năng ghi nhớ ngắn hạn và kỹ năng tính toán của con người đều bị ảnh hưởng, những năng lực này nhiều nhất chỉ bằng 65% so với trạng thái bình thường, tương đương người say rượu."},{"h":"计算","p":"jìsuàn","v":"tính toán","k":"đgt.","x":0,"ez":"如果是从深度睡眠中被突然叫醒，那么，人的短期记忆能力、计算技能都会受到影响，这些能力最多为正常状态的65%，与醉酒者相当。","ev":"Nếu bị đánh thức đột ngột khi đang ngủ sâu thì khả năng ghi nhớ ngắn hạn và kỹ năng tính toán của con người đều bị ảnh hưởng, những năng lực này nhiều nhất chỉ bằng 65% so với trạng thái bình thường, tương đương người say rượu."},{"h":"相当","p":"xiāngdāng","v":"tương đương với, ngang nhau","k":"đgt.","x":0,"ez":"这种鸟一天所食的害虫相当于自己的体重。","ev":"Lượng sâu hại loài chim này ăn trong một ngày tương đương với trọng lượng cơ thể của chính nó."},{"h":"持续","p":"chíxù","v":"kéo dài, duy trì lâu dài","k":"đgt.","x":0,"ez":"这种状态如果持续数天、数周、数月，将导致高血压、失眠和一些精神问题等。","ev":"Nếu trạng thái này kéo dài vài ngày, vài tuần, vài tháng, sẽ dẫn đến cao huyết áp, mất ngủ và một số vấn đề về tinh thần."},{"h":"数","p":"shù","v":"vài, mấy","k":"số.","x":0,"ez":"这种状态如果持续数天、数周、数月，将导致高血压、失眠和一些精神问题等。","ev":"Nếu trạng thái này kéo dài vài ngày, vài tuần, vài tháng, sẽ dẫn đến cao huyết áp, mất ngủ và một số vấn đề về tinh thần."},{"h":"导致","p":"dǎozhì","v":"dẫn đến, gây ra","k":"đgt.","x":0,"ez":"这种状态如果持续数天、数周、数月，将导致高血压、失眠和一些精神问题等。","ev":"Nếu trạng thái này kéo dài vài ngày, vài tuần, vài tháng, sẽ dẫn đến cao huyết áp, mất ngủ và một số vấn đề về tinh thần."},{"h":"失眠","p":"shīmián","v":"mất ngủ","k":"đgt.","x":0,"ez":"这种状态如果持续数天、数周、数月，将导致高血压、失眠和一些精神问题等。","ev":"Nếu trạng thái này kéo dài vài ngày, vài tuần, vài tháng, sẽ dẫn đến cao huyết áp, mất ngủ và một số vấn đề về tinh thần."},{"h":"精神","p":"jīngshén","v":"tinh thần; sôi nổi, hoạt bát","k":"dt./tt.","x":0,"ez":"实验失败了没关系，打起精神从头再来。","ev":"Thí nghiệm thất bại cũng không sao, hãy lấy lại tinh thần làm lại từ đầu."},{"h":"专家","p":"zhuānjiā","v":"chuyên gia","k":"dt.","x":0,"ez":"对此，专家解释说，人在睡眠时，身体会发生一些变化，因此人们在早上醒来时更容易发病，而闹铃则会使发病的可能性变得更大。","ev":"Về điều này, các chuyên gia giải thích rằng khi con người ngủ, cơ thể sẽ có một số thay đổi, vì thế lúc thức dậy vào buổi sáng người ta dễ phát bệnh hơn, còn chuông báo thức lại khiến khả năng phát bệnh càng lớn hơn."},{"h":"采用","p":"cǎiyòng","v":"chọn dùng, áp dụng","k":"đgt.","x":0,"ez":"如果你必须定个闹钟，应采用柔和的声音或音乐。","ev":"Nếu bạn buộc phải đặt đồng hồ báo thức thì nên chọn âm thanh hoặc bản nhạc êm dịu."},{"h":"柔和","p":"róuhé","v":"êm dịu","k":"tt.","x":1,"ez":"如果你必须定个闹钟，应采用柔和的声音或音乐。","ev":"Nếu bạn buộc phải đặt đồng hồ báo thức thì nên chọn âm thanh hoặc bản nhạc êm dịu."},{"h":"肾上腺素","p":"shènshàngxiànsù","v":"a-đrê-na-lin","k":"thuật ngữ khoa học","x":0,"ez":"出于自我保护，被闹钟叫醒时我们的身体会提高体内的肾上腺素水平。","ev":"Do cơ chế tự bảo vệ, khi bị đồng hồ báo thức đánh thức, cơ thể chúng ta sẽ nâng cao nồng độ a-đrê-na-lin trong người."},{"h":"血压","p":"xuèyā","v":"huyết áp","k":"thuật ngữ khoa học","x":0,"ez":"研究发现，突然被闹铃惊醒的人比自然醒的人血压更高、心跳更快。","ev":"Nghiên cứu phát hiện, người bị chuông báo thức đột ngột đánh thức có huyết áp cao hơn và tim đập nhanh hơn người tự thức dậy."},{"h":"愿望","p":"yuànwàng","v":"ước muốn, điều mong muốn","k":"dt.","x":0,"ez":"各种醒来方式中，当然是自然醒最符合我们的愿望。","ev":"Trong các cách thức dậy, đương nhiên tự thức dậy là hợp với mong muốn của chúng ta nhất."},{"h":"窗帘","p":"chuānglián","v":"rèm cửa sổ","k":"dt.","x":0,"ez":"可谁能替你拉开窗帘让阳光照进来呢？","ev":"Nhưng ai có thể kéo rèm cửa sổ giúp bạn để ánh nắng chiếu vào chứ?"},{"h":"市场","p":"shìchǎng","v":"thị trường, chợ","k":"dt.","x":0,"ez":"近年来，市场上出现了一种新的电子产品，名为“光闹钟”。","ev":"Những năm gần đây, trên thị trường đã xuất hiện một loại sản phẩm điện tử mới có tên là “đồng hồ báo thức ánh sáng”."},{"h":"产品","p":"chǎnpǐn","v":"sản phẩm","k":"dt.","x":0,"ez":"近年来，市场上出现了一种新的电子产品，名为“光闹钟”。","ev":"Những năm gần đây, trên thị trường đã xuất hiện một loại sản phẩm điện tử mới có tên là “đồng hồ báo thức ánh sáng”."},{"h":"模仿","p":"mófǎng","v":"mô phỏng, bắt chước","k":"đgt.","x":0,"ez":"它能在室内模仿早晨自然光线的变化，通过光线的作用使人在设定的时间里自然地醒来，可避免传统闹钟突然惊醒对人体健康的伤害。","ev":"Nó có thể mô phỏng sự thay đổi của ánh sáng tự nhiên buổi sớm ngay trong phòng, nhờ tác dụng của ánh sáng giúp người ta thức dậy tự nhiên vào giờ đã cài đặt, tránh được tác hại đối với sức khỏe do đồng hồ báo thức truyền thống đột ngột làm giật mình tỉnh giấc."},{"h":"避免","p":"bìmiǎn","v":"tránh, ngăn ngừa","k":"đgt.","x":0,"ez":"它能在室内模仿早晨自然光线的变化，通过光线的作用使人在设定的时间里自然地醒来，可避免传统闹钟突然惊醒对人体健康的伤害。","ev":"Nó có thể mô phỏng sự thay đổi của ánh sáng tự nhiên buổi sớm ngay trong phòng, nhờ tác dụng của ánh sáng giúp người ta thức dậy tự nhiên vào giờ đã cài đặt, tránh được tác hại đối với sức khỏe do đồng hồ báo thức truyền thống đột ngột làm giật mình tỉnh giấc."},{"h":"传统","p":"chuántǒng","v":"truyền thống; (thuộc) truyền thống","k":"dt./tt.","x":0,"ez":"它能在室内模仿早晨自然光线的变化，通过光线的作用使人在设定的时间里自然地醒来，可避免传统闹钟突然惊醒对人体健康的伤害。","ev":"Nó có thể mô phỏng sự thay đổi của ánh sáng tự nhiên buổi sớm ngay trong phòng, nhờ tác dụng của ánh sáng giúp người ta thức dậy tự nhiên vào giờ đã cài đặt, tránh được tác hại đối với sức khỏe do đồng hồ báo thức truyền thống đột ngột làm giật mình tỉnh giấc."}]],"texts":[{"no":1,"tz":"","tv":"","lines":[{"s":"","z":"医学研究证明，人类睡眠有其特定的机制，自然醒是最符合人体生物钟规律的。","p":"Yīxué yánjiū zhèngmíng, rénlèi shuìmián yǒu qí tèdìng de jīzhì, zìránxǐng shì zuì fúhé réntǐ shēngwùzhōng guīlǜ de.","v":"Nghiên cứu y học đã chứng minh, giấc ngủ của loài người có cơ chế riêng của nó, và tự thức dậy là phù hợp nhất với quy luật đồng hồ sinh học của cơ thể.","b":0},{"s":"","z":"光线是自然醒的必要条件，是人体内的生物闹钟。","p":"Guāngxiàn shì zìránxǐng de bìyào tiáojiàn, shì réntǐ nèi de shēngwù nàozhōng.","v":"Ánh sáng là điều kiện cần thiết để tự thức dậy, là chiếc đồng hồ báo thức sinh học trong cơ thể người.","b":0},{"s":"","z":"早晨，人体感受到逐渐变强的太阳光线，新陈代谢随之加快，人逐渐从熟睡过渡到浅睡，直到醒来。","p":"Zǎochen, réntǐ gǎnshòu dào zhújiàn biàn qiáng de tàiyáng guāngxiàn, xīnchén dàixiè suí zhī jiākuài, rén zhújiàn cóng shúshuì guòdù dào qiǎnshuì, zhídào xǐnglái.","v":"Buổi sáng, cơ thể cảm nhận được ánh nắng mặt trời mạnh dần lên, quá trình trao đổi chất cũng theo đó tăng nhanh, con người dần chuyển từ ngủ say sang ngủ nông cho đến khi tỉnh dậy.","b":0},{"s":"","z":"这就是阴雨天人们往往喜欢睡懒觉的原因。","p":"Zhè jiù shì yīnyǔtiān rénmen wǎngwǎng xǐhuan shuì lǎnjiào de yuányīn.","v":"Đó chính là lý do vì sao vào những ngày trời âm u mưa gió, người ta thường thích ngủ nướng.","b":0},{"s":"","z":"紧张的现代生活，使很多上班的人无法享受轻松舒适的睡眠、自然地醒来，闹钟的用途就显得格外重要了。","p":"Jǐnzhāng de xiàndài shēnghuó, shǐ hěn duō shàngbān de rén wúfǎ xiǎngshòu qīngsōng shūshì de shuìmián, zìrán de xǐnglái, nàozhōng de yòngtú jiù xiǎnde géwài zhòngyào le.","v":"Cuộc sống hiện đại căng thẳng khiến nhiều người đi làm không thể tận hưởng giấc ngủ thư thái, dễ chịu và thức dậy một cách tự nhiên, vì thế công dụng của đồng hồ báo thức càng trở nên đặc biệt quan trọng.","b":1},{"s":"","z":"但实验研究证明，人们对自然醒与被闹钟铃声叫醒这两种方式所产生的反应是很不相同的。","p":"Dàn shíyàn yánjiū zhèngmíng, rénmen duì zìránxǐng yǔ bèi nàozhōng língshēng jiàoxǐng zhè liǎng zhǒng fāngshì suǒ chǎnshēng de fǎnyìng shì hěn bù xiāngtóng de.","v":"Nhưng nghiên cứu thực nghiệm đã chứng minh, phản ứng mà con người sinh ra đối với hai cách thức là tự thức dậy và bị tiếng chuông báo thức đánh thức là rất khác nhau.","b":0},{"s":"","z":"从睡眠状态过渡到清醒状态时，人的呼吸会从16次/分钟提高到24次/分钟，心跳每分钟加快10次。","p":"Cóng shuìmián zhuàngtài guòdù dào qīngxǐng zhuàngtài shí, rén de hūxī huì cóng shíliù cì/fēnzhōng tígāo dào èrshísì cì/fēnzhōng, xīntiào měi fēnzhōng jiākuài shí cì.","v":"Khi chuyển từ trạng thái ngủ sang trạng thái tỉnh táo, nhịp thở của con người sẽ tăng từ 16 lần/phút lên 24 lần/phút, tim mỗi phút đập nhanh thêm 10 nhịp.","b":0},{"s":"","z":"如果突然被闹钟叫醒，将在心理上使人产生心慌、情绪低落、感觉没睡醒等不适。","p":"Rúguǒ tūrán bèi nàozhōng jiàoxǐng, jiāng zài xīnlǐ shang shǐ rén chǎnshēng xīnhuāng, qíngxù dīluò, gǎnjué méi shuìxǐng děng búshì.","v":"Nếu đột ngột bị đồng hồ báo thức đánh thức, về mặt tâm lý người ta sẽ thấy khó chịu như bồn chồn, tâm trạng ủ rũ, cảm giác như chưa ngủ dậy.","b":0},{"s":"","z":"如果是从深度睡眠中被突然叫醒，那么，人的短期记忆能力、计算技能都会受到影响，这些能力最多为正常状态的65%，与醉酒者相当。","p":"Rúguǒ shì cóng shēndù shuìmián zhōng bèi tūrán jiàoxǐng, nàme, rén de duǎnqī jìyì nénglì, jìsuàn jìnéng dōu huì shòudào yǐngxiǎng, zhèxiē nénglì zuì duō wéi zhèngcháng zhuàngtài de bǎi fēn zhī liùshíwǔ, yǔ zuìjiǔzhě xiāngdāng.","v":"Nếu bị đánh thức đột ngột khi đang ngủ sâu thì khả năng ghi nhớ ngắn hạn và kỹ năng tính toán của con người đều bị ảnh hưởng, những năng lực này nhiều nhất chỉ bằng 65% so với trạng thái bình thường, tương đương người say rượu.","b":0},{"s":"","z":"出于自我保护，被闹钟叫醒时我们的身体会提高体内的肾上腺素水平。","p":"Chūyú zìwǒ bǎohù, bèi nàozhōng jiàoxǐng shí wǒmen de shēntǐ huì tígāo tǐnèi de shènshàngxiànsù shuǐpíng.","v":"Do cơ chế tự bảo vệ, khi bị đồng hồ báo thức đánh thức, cơ thể chúng ta sẽ nâng cao nồng độ a-đrê-na-lin trong người.","b":1},{"s":"","z":"这种状态如果持续数天、数周、数月，将导致高血压、失眠和一些精神问题等。","p":"Zhè zhǒng zhuàngtài rúguǒ chíxù shù tiān, shù zhōu, shù yuè, jiāng dǎozhì gāoxuèyā, shīmián hé yìxiē jīngshén wèntí děng.","v":"Nếu trạng thái này kéo dài vài ngày, vài tuần, vài tháng, sẽ dẫn đến cao huyết áp, mất ngủ và một số vấn đề về tinh thần.","b":0},{"s":"","z":"研究发现，突然被闹铃惊醒的人比自然醒的人血压更高、心跳更快。","p":"Yánjiū fāxiàn, tūrán bèi nàolíng jīngxǐng de rén bǐ zìránxǐng de rén xuèyā gèng gāo, xīntiào gèng kuài.","v":"Nghiên cứu phát hiện, người bị chuông báo thức đột ngột đánh thức có huyết áp cao hơn và tim đập nhanh hơn người tự thức dậy.","b":0},{"s":"","z":"对此，专家解释说，人在睡眠时，身体会发生一些变化，因此人们在早上醒来时更容易发病，而闹铃则会使发病的可能性变得更大。","p":"Duì cǐ, zhuānjiā jiěshì shuō, rén zài shuìmián shí, shēntǐ huì fāshēng yìxiē biànhuà, yīncǐ rénmen zài zǎoshang xǐnglái shí gèng róngyì fābìng, ér nàolíng zé huì shǐ fābìng de kěnéngxìng biàn de gèng dà.","v":"Về điều này, các chuyên gia giải thích rằng khi con người ngủ, cơ thể sẽ có một số thay đổi, vì thế lúc thức dậy vào buổi sáng người ta dễ phát bệnh hơn, còn chuông báo thức lại khiến khả năng phát bệnh càng lớn hơn.","b":0},{"s":"","z":"如果你必须定个闹钟，应采用柔和的声音或音乐。","p":"Rúguǒ nǐ bìxū dìng ge nàozhōng, yīng cǎiyòng róuhé de shēngyīn huò yīnyuè.","v":"Nếu bạn buộc phải đặt đồng hồ báo thức thì nên chọn âm thanh hoặc bản nhạc êm dịu.","b":0},{"s":"","z":"各种醒来方式中，当然是自然醒最符合我们的愿望。","p":"Gè zhǒng xǐnglái fāngshì zhōng, dāngrán shì zìránxǐng zuì fúhé wǒmen de yuànwàng.","v":"Trong các cách thức dậy, đương nhiên tự thức dậy là hợp với mong muốn của chúng ta nhất.","b":1},{"s":"","z":"可谁能替你拉开窗帘让阳光照进来呢？","p":"Kě shéi néng tì nǐ lākāi chuānglián ràng yángguāng zhào jìnlai ne?","v":"Nhưng ai có thể kéo rèm cửa sổ giúp bạn để ánh nắng chiếu vào chứ?","b":0},{"s":"","z":"近年来，市场上出现了一种新的电子产品，名为“光闹钟”。","p":"Jìnnián lái, shìchǎng shang chūxiànle yì zhǒng xīn de diànzǐ chǎnpǐn, míng wéi “guāngnàozhōng”.","v":"Những năm gần đây, trên thị trường đã xuất hiện một loại sản phẩm điện tử mới có tên là “đồng hồ báo thức ánh sáng”.","b":0},{"s":"","z":"它能在室内模仿早晨自然光线的变化，通过光线的作用使人在设定的时间里自然地醒来，可避免传统闹钟突然惊醒对人体健康的伤害。","p":"Tā néng zài shìnèi mófǎng zǎochen zìrán guāngxiàn de biànhuà, tōngguò guāngxiàn de zuòyòng shǐ rén zài shèdìng de shíjiān li zìrán de xǐnglái, kě bìmiǎn chuántǒng nàozhōng tūrán jīngxǐng duì réntǐ jiànkāng de shānghài.","v":"Nó có thể mô phỏng sự thay đổi của ánh sáng tự nhiên buổi sớm ngay trong phòng, nhờ tác dụng của ánh sáng giúp người ta thức dậy tự nhiên vào giờ đã cài đặt, tránh được tác hại đối với sức khỏe do đồng hồ báo thức truyền thống đột ngột làm giật mình tỉnh giấc.","b":0},{"s":"","z":"希望这样能向真正的“自然醒”走近一点，再走近一点。","p":"Xīwàng zhèyàng néng xiàng zhēnzhèng de “zìránxǐng” zǒujìn yìdiǎn, zài zǒujìn yìdiǎn.","v":"Hy vọng như vậy có thể tiến gần thêm một chút, rồi lại gần thêm chút nữa tới việc “tự thức dậy” thực sự.","b":0}]}],"aud":[{"v":"audio/11-2.mp3","t":"audio/11-1.mp3"}],"gram":[{"id":"laiguolai","t":"来/过来","s":"động từ xu hướng làm bổ ngữ (醒来, 清醒过来, 忙不过来)","b":"<b>来/过来</b> là <b>động từ xu hướng</b>, thường gặp theo dạng <b>Động từ + 来/过来</b>. Sách nêu ba cách dùng: (1) đứng sau động từ <b>醒</b>, biểu thị sự chuyển từ trạng thái ngủ sang tỉnh; (2) <b>过来</b> đứng sau động từ, biểu thị <b>trở lại trạng thái ban đầu, bình thường</b>; (3) <b>Động từ + 得/不 + 过来</b> biểu thị có khả năng (hoặc không đủ sức) làm việc gì, thường dùng ở dạng phủ định.","r":["醒 + 来/过来: từ ngủ chuyển sang tỉnh (醒来, 直到醒来)","Động từ + 过来: trở lại trạng thái bình thường, vốn có (清醒过来, 活过来)","Động từ + 得/不 + 过来: làm xuể / không làm xuể (数得过来, 忙不过来) — hay dùng dạng phủ định"],"e":[["……人逐渐从熟睡过渡到浅睡，直到醒来。","……rén zhújiàn cóng shúshuì guòdù dào qiǎnshuì, zhídào xǐnglái.","…con người dần chuyển từ ngủ say sang ngủ nông cho đến khi tỉnh dậy. <i>(bài khoá)</i>"],["早晨醒来，我发现窗外正下着大雪。","Zǎochen xǐnglái, wǒ fāxiàn chuāng wài zhèng xiàzhe dàxuě.","Sáng ra thức dậy, tôi thấy ngoài cửa sổ tuyết đang rơi dày."],["我被一阵吵闹声突然惊醒，过了半天，脑子才清醒过来。","Wǒ bèi yí zhèn chǎonào shēng tūrán jīngxǐng, guòle bàntiān, nǎozi cái qīngxǐng guòlai.","Tôi bị một tràng tiếng ồn ào làm giật mình tỉnh giấc, mãi một lúc lâu đầu óc mới tỉnh táo lại."],["他救了妻子，没救孩子。有的人说他做得对，因为孩子可以再生一个，妻子却不能活过来。","Tā jiùle qīzi, méi jiù háizi. Yǒu de rén shuō tā zuò de duì, yīnwèi háizi kěyǐ zài shēng yí ge, qīzi què bù néng huó guòlai.","Anh ấy cứu vợ mà không cứu con. Có người nói anh ấy làm đúng, vì con thì có thể sinh đứa khác, còn vợ thì không thể sống lại."],["天上的星星那么多，谁数得过来呀？","Tiān shang de xīngxing nàme duō, shéi shǔ de guòlai ya?","Sao trên trời nhiều như thế, ai mà đếm xuể chứ?"],["最近手头的工作太多了，我都忙不过来了。","Zuìjìn shǒutóu de gōngzuò tài duō le, wǒ dōu máng bu guòlai le.","Dạo này việc trong tay nhiều quá, tôi bận đến mức làm không xuể."]],"d":[["早晨醒____，我发现窗外正下着大雪。","来"],["过了半天，脑子才清醒____。","过来"],["最近手头的工作太多了，我都忙不____了。","过来"]],"w":"Muốn nói “không làm xuể” thì chèn 不 vào giữa động từ và 过来: ✗ 不忙过来 → ✓ 忙不过来. 过来 sau 清醒/活/改… nhấn mạnh việc trở về trạng thái bình thường."},{"id":"suo","t":"所","s":"trợ từ (所 + động từ); lượng từ cho trường học, cơ quan","b":"<b>所</b> là <b>trợ từ</b>, đứng trước động từ để chỉ sự vật (đối tượng chịu tác động của hành động). Thường dùng trước động từ trong kết cấu chủ – vị, cả cụm làm <b>định ngữ, chủ ngữ</b>… Dạng <b>有/无 + 所 + động từ</b>: 所 kết hợp với động từ phía sau thành cụm làm tân ngữ cho 有, 无. Ngoài ra 所 còn làm <b>lượng từ</b>, dùng cho nơi ở, cơ quan, trường học…","r":["Chủ ngữ + 所 + động từ + 的 (+ danh từ): 山水画所表现的…, 人们……所产生的反应","有所 + động từ: có phần… (有所提高); 无所 + động từ: không gì không… (无所不谈)","Lượng từ: 一所大学, 一所幼儿园"],"e":[["山水画所表现的是人与自然的关系。","Shānshuǐhuà suǒ biǎoxiàn de shì rén yǔ zìrán de guānxi.","Điều mà tranh sơn thủy thể hiện là mối quan hệ giữa con người và thiên nhiên."],["……人们对自然醒与被闹钟铃声叫醒所产生的反应是很不相同的。","……rénmen duì zìránxǐng yǔ bèi nàozhōng língshēng jiàoxǐng suǒ chǎnshēng de fǎnyìng shì hěn bù xiāngtóng de.","…phản ứng mà con người sinh ra đối với việc tự thức dậy và việc bị chuông báo thức đánh thức là rất khác nhau. <i>(bài khoá)</i>"],["调查显示，随着年龄的增大，女性的职场幸福感有所提高。","Diàochá xiǎnshì, suízhe niánlíng de zēngdà, nǚxìng de zhíchǎng xìngfúgǎn yǒu suǒ tígāo.","Điều tra cho thấy, tuổi càng cao thì cảm giác hạnh phúc nơi công sở của phụ nữ càng có phần tăng lên."],["我和李阳是无所不谈的好朋友。","Wǒ hé Lǐ Yáng shì wú suǒ bù tán de hǎo péngyou.","Tôi và Lý Dương là bạn thân, chuyện gì cũng kể cho nhau nghe."],["来自北京一所大学的学生做了关于这个问题的实验。","Láizì Běijīng yì suǒ dàxué de xuésheng zuòle guānyú zhège wèntí de shíyàn.","Sinh viên của một trường đại học ở Bắc Kinh đã làm thí nghiệm về vấn đề này."],["学校附近就有一所幼儿园，你可以把孩子送到那儿去。","Xuéxiào fùjìn jiù yǒu yì suǒ yòu'éryuán, nǐ kěyǐ bǎ háizi sòng dào nàr qù.","Gần trường có ngay một trường mẫu giáo, bạn có thể gửi con đến đó."]],"d":[["正如你____估计的那样，李岩确实改变了主意。","所"],["我和李阳是无____不谈的好朋友。","所"],["学校附近就有一____幼儿园，你可以把孩子送到那儿去。","所"]],"w":"所 chỉ đứng trước động từ (không đứng trước danh từ hay tính từ), và cụm 所 + động từ thường cần 的 theo sau khi làm định ngữ/chủ ngữ: ✗ 他所说是对的 → ✓ 他所说的是对的."},{"id":"xiangdang","t":"相当","s":"tương đương (động từ); khá, tương đối (phó từ)","b":"<b>相当</b> là <b>động từ</b>, biểu thị hai bên (về số lượng, điều kiện, tình hình…) chênh lệch không nhiều, gần như ngang nhau. <b>相当</b> còn có thể làm <b>phó từ</b>, biểu thị mức độ khá cao.","r":["Động từ: A 与/和 B 相当, hoặc A 相当于 B","Phó từ: 相当 + tính từ/động từ tâm lý (相当满意)","相当一部分 + danh từ: một phần khá lớn"],"e":[["……这些能力最多为正常状态的65%，与醉酒者相当。","……zhèxiē nénglì zuì duō wéi zhèngcháng zhuàngtài de bǎi fēn zhī liùshíwǔ, yǔ zuìjiǔzhě xiāngdāng.","…những năng lực này nhiều nhất chỉ bằng 65% so với trạng thái bình thường, tương đương người say rượu. <i>(bài khoá)</i>"],["这种鸟一天所食的害虫相当于自己的体重。","Zhè zhǒng niǎo yì tiān suǒ shí de hàichóng xiāngdāng yú zìjǐ de tǐzhòng.","Lượng sâu hại loài chim này ăn trong một ngày tương đương với trọng lượng cơ thể của chính nó."],["菜的味道好极了，服务也挺周到，我相当满意。","Cài de wèidao hǎo jí le, fúwù yě tǐng zhōudào, wǒ xiāngdāng mǎnyì.","Món ăn ngon tuyệt, phục vụ cũng rất chu đáo, tôi khá hài lòng."],["如果要问人们选择职业时主要考虑的是什么，有相当一部分人会以收入多少作为标准。","Rúguǒ yào wèn rénmen xuǎnzé zhíyè shí zhǔyào kǎolǜ de shì shénme, yǒu xiāngdāng yí bùfen rén huì yǐ shōurù duōshao zuòwéi biāozhǔn.","Nếu hỏi khi chọn nghề người ta chủ yếu cân nhắc điều gì, thì sẽ có một bộ phận khá lớn lấy thu nhập cao hay thấp làm tiêu chuẩn."]],"d":[["这种鸟一天所食的害虫____于自己的体重。","相当"],["菜的味道好极了，服务也挺周到，我____满意。","相当"],["这些能力最多为正常状态的65%，与醉酒者____。","相当"]],"w":"Khi là động từ, 相当 không mang thẳng tân ngữ: ✗ 相当醉酒者 → ✓ 与醉酒者相当 / 相当于醉酒者."},{"id":"shu","t":"数","s":"shǔ: đếm; nói đến… phải kể (động từ) · shù: vài, mấy (số từ)","b":"<b>数 (shǔ)</b> là <b>động từ</b>, nghĩa là kiểm đếm (số lượng) hoặc đọc lần lượt từng (con số). Dạng <b>数……（最）……</b> hoặc <b>（最）……的（要/就）数……</b> biểu thị tính ra hoặc so sánh thì (nhất) là… <b>数 (shù)</b> là <b>số từ</b>, nghĩa là “vài, mấy”, thường dùng trong văn viết.","r":["数 shǔ: đếm (数了一下, 您数数)","（最）……的（要/就）数 + danh từ: nói đến … nhất thì phải kể đến … (那就数李阳了)","数 shù + lượng từ/danh từ: vài, mấy (数小时, 数天、数周、数月) — văn viết"],"e":[["我大概数了一下，车上有32个学生。","Wǒ dàgài shǔle yíxià, chē shang yǒu sānshí'èr ge xuésheng.","Tôi đếm sơ qua, trên xe có 32 học sinh."],["先生，这是找您的钱，58块6，您数数。","Xiānsheng, zhè shì zhǎo nín de qián, wǔshíbā kuài liù, nín shǔshu.","Thưa anh, đây là tiền thối lại, 58 tệ 6 hào, anh đếm lại nhé."],["我觉得北京最美、最有名气的公园要数颐和园了。","Wǒ juéde Běijīng zuì měi, zuì yǒu míngqi de gōngyuán yào shǔ Yíhéyuán le.","Tôi thấy công viên đẹp nhất, nổi tiếng nhất Bắc Kinh phải kể đến Di Hòa Viên."],["要说我们班跑得最快的，那就数李阳了。","Yào shuō wǒmen bān pǎo de zuì kuài de, nà jiù shǔ Lǐ Yáng le.","Nói đến người chạy nhanh nhất lớp mình thì phải kể đến Lý Dương."],["这里夏季的雷阵雨一般可持续数小时或者更久的时间。","Zhèlǐ xiàjì de léizhènyǔ yìbān kě chíxù shù xiǎoshí huòzhě gèng jiǔ de shíjiān.","Mưa giông mùa hè ở đây thường có thể kéo dài vài tiếng hoặc lâu hơn nữa."],["这种状态如果持续数天、数周、数月，将导致高血压、失眠和一些精神问题等。","Zhè zhǒng zhuàngtài rúguǒ chíxù shù tiān, shù zhōu, shù yuè, jiāng dǎozhì gāoxuèyā, shīmián hé yìxiē jīngshén wèntí děng.","Nếu trạng thái này kéo dài vài ngày, vài tuần, vài tháng, sẽ dẫn đến cao huyết áp, mất ngủ và một số vấn đề về tinh thần. <i>(bài khoá)</i>"]],"d":[["每晚抽出点儿时间来阅读、学习，坚持____年之后，成功就会向你招手。","数"],["要说我们班跑得最快的，那就____李阳了。","数"],["天上的星星那么多，谁____得过来呀？","数"]],"w":"Chú ý âm đọc: động từ đọc <b>shǔ</b> (数数, 要数…); số từ đọc <b>shù</b> (数天, 数小时). 数 shù mang sắc thái văn viết, khẩu ngữ thường nói 几: 数天 ≈ 几天."},{"id":"chixu_jixu","t":"持续 vs 继续","s":"kéo dài liên tục / tiếp tục","b":"Điểm giống: cả hai đều là <b>động từ</b>, đều có nghĩa kéo dài không ngừng, nhưng nghĩa khác nhau khá nhiều nên <b>không thể thay thế cho nhau</b>.","r":["持续: động tác diễn ra liên tục, giữa chừng không ngắt quãng — 继续: giữa chừng động tác có thể có lúc dừng","持续 làm được định ngữ (持续的高温) — 继续 không làm được định ngữ","持续 mang được bổ ngữ thời lượng (持续三天) — 继续 thường không mang bổ ngữ thời lượng"],"e":[["这场雨持续下了两个多小时。","Zhè chǎng yǔ chíxù xiàle liǎng ge duō xiǎoshí.","Trận mưa này rơi liên tục hơn hai tiếng đồng hồ."],["对不起！打扰了，你们继续学习吧。","Duìbuqǐ! Dǎrǎo le, nǐmen jìxù xuéxí ba.","Xin lỗi! Làm phiền rồi, các bạn cứ tiếp tục học đi."],["持续的高温让许多老人感到不适。","Chíxù de gāowēn ràng xǔduō lǎorén gǎndào búshì.","Nắng nóng kéo dài khiến nhiều người già cảm thấy khó chịu trong người."],["小明发烧持续三天了，家里人都很着急。","Xiǎo Míng fāshāo chíxù sān tiān le, jiā li rén dōu hěn zháojí.","Tiểu Minh sốt kéo dài ba ngày rồi, cả nhà ai cũng rất sốt ruột."]],"d":[["真希望刘老师能____给我们上课。","继续"],["这次的宣传活动将____到9月底。","持续"],["不管你是快乐还是难过，生活总要____下去。","继续"],["朋友是在你失败时，鼓励你____前进的人。","继续"]],"w":"Làm tiếp một việc (có thể sau khi bị gián đoạn) → 继续 (继续学习, 继续前进); một trạng thái kéo dài bao lâu/đến lúc nào → 持续 (持续三天, 持续到9月底)."}],"ext":[["抽屉","chōuti","ngăn kéo"],["书架","shūjià","giá sách"],["窗帘","chuānglián","rèm cửa sổ"],["地毯","dìtǎn","thảm trải sàn"],["被子","bèizi","chăn, mền"],["玩具","wánjù","đồ chơi"],["日历","rìlì","lịch"],["日期","rìqī","ngày tháng"],["包裹","bāoguǒ","bưu kiện, gói hàng"]],"extt":"家居1","notes":"Nguồn bài khoá: 改编自“中国科普网”. Bài không có mục 专名 mà có mục 科学名词 (4 từ: 生物钟, 新陈代谢, 肾上腺素, 血压), được xếp vào cuối đợt chứa chúng như 专名, đánh số 1–4 theo sách, pos ghi \"thuật ngữ khoa học\" (sách không ghi từ loại). Từ mới số 4, 5, 9, 18, 34 có dấu * (ngoài đề cương). Từ 21 sách in là 慌（张） huāng (zhāng); bài khoá chỉ có 心慌 nên câu ví dụ chỉ chứa 慌. Ví dụ (2) của 所 trong phần 注释 sách in lược bớt \"这两种方式\" so với bài khoá — giữ nguyên như sách. Ví dụ cho 危害, 规律, 必要, 享受, 精神, 清醒, 相当 lấy từ phần 运用/练习/注释 của sách thay vì bài khoá. Drill: 所(1) lấy từ 练习1③, 数(1) lấy từ 练习2②, 持续 vs 继续 lấy đủ 4 câu 做一做; các drill còn lại của 来/过来, 所, 相当, 数 do người soạn tạo chỗ trống từ câu ví dụ của sách (练一练 trong sách là bài hoàn thành câu mở). Bảng 扩展 (家居1) trong sách chỉ có chữ Hán + pinyin, nghĩa tiếng Việt do người soạn bổ sung.","order":[{"z":"这就是阴雨天人们往往喜欢睡懒觉的原因。","t":["这","就是","阴雨天","人们","往往","喜欢","睡懒觉","的","原因"],"v":"Đó chính là lý do vì sao vào những ngày trời âm u mưa gió, người ta thường thích ngủ nướng."},{"z":"可谁能替你拉开窗帘让阳光照进来呢？","t":["可","谁","能","替","你","拉开","窗帘","让","阳光","照进来","呢"],"v":"Nhưng ai có thể kéo rèm cửa sổ giúp bạn để ánh nắng chiếu vào chứ?"},{"z":"早晨醒来，我发现窗外正下着大雪。","t":["早晨","醒来","我","发现","窗外","正下","着","大雪"],"v":"Sáng ra thức dậy, tôi thấy ngoài cửa sổ tuyết đang rơi dày."},{"z":"他救了妻子，没救孩子。","t":["他","救","了","妻子","没","救","孩子"],"v":"Anh ấy cứu vợ mà không cứu con. Có người nói anh ấy làm đúng, vì con thì có thể sinh đứa khác, còn vợ thì không thể sống lại."},{"z":"天上的星星那么多，谁数得过来呀？","t":["天上","的","星星","那么","多","谁","数得","过来","呀"],"v":"Sao trên trờ àn, qiě zài kuàisù zēngzhǎng dāngzhōng”.","v":"WeChat \"có hơn 70 triệu người dùng đăng ký ở nước ngoài, và con số này vẫn đang tăng nhanh\".","b":0},{"s":"","z":"7月3日，在北京召开的2013腾讯合作伙伴大会上，腾讯总裁刘炽平言语间充满了骄傲。","p":"Qī yuè sān rì, zài Běijīng zhàokāi de èr líng yī sān Téngxùn hézuò huǒbàn dàhuì shang, Téngxùn zǒngcái Liú Chìpíng yányǔ jiān chōngmǎnle jiāo'ào.","v":"Ngày 3 tháng 7, tại Hội nghị đối tác hợp tác Tencent 2013 tổ chức ở Bắc Kinh, chủ tịch Tencent Lưu Sí Bình nói năng đầy tự hào.","b":0},{"s":"","z":"2011年1月，微信上线；同年4月，以英文名WeChat正式进入国际市场；","p":"Èr líng yī yī nián yī yuè, Wēixìn shàngxiàn; tóng nián sì yuè, yǐ Yīngwén míng WeChat zhèngshì jìnrù guójì shìchǎng;","v":"Tháng 1 năm 2011, WeChat ra mắt; tháng 4 cùng năm, chính thức gia nhập thị trường quốc tế với tên tiếng Anh là WeChat;","b":1},{"s":"","z":"2011年12月，实现支持全球100个国家的短信注册；2012年底，覆盖国家和地区超过100个。","p":"Èr líng yī yī nián shí'èr yuè, shíxiàn zhīchí quánqiú yìbǎi ge guójiā de duǎnxìn zhùcè; èr líng yī èr nián dǐ, fùgài guójiā hé dìqū chāoguò yìbǎi ge.","v":"Tháng 12 năm 2011, WeChat hỗ trợ được việc đăng ký bằng tin nhắn ở 100 quốc gia trên thế giới; cuối năm 2012, số quốc gia và vùng lãnh thổ được phủ sóng đã vượt quá 100.","b":0},{"s":"","z":"如今，微信已经覆盖了200多个国家和地区、支持16种外语，是全球使用人数最多的移动通信应用。","p":"Rújīn, Wēixìn yǐjīng fùgàile liǎngbǎi duō ge guójiā hé dìqū, zhīchí shíliù zhǒng wàiyǔ, shì quánqiú shǐyòng rénshù zuì duō de yídòng tōngxìn yìngyòng.","v":"Ngày nay, WeChat đã phủ sóng hơn 200 quốc gia và vùng lãnh thổ, hỗ trợ 16 ngoại ngữ, là ứng dụng liên lạc di động có số người dùng đông nhất thế giới.","b":0},{"s":"","z":"在美国互联网企业“称霸”全球的背景下，作为中国自己的移动互联网产品，微信的出现，自然吸引了更多的关注。","p":"Zài Měiguó hùliánwǎng qǐyè “chēngbà” quánqiú de bèijǐng xià, zuòwéi Zhōngguó zìjǐ de yídòng hùliánwǎng chǎnpǐn, Wēixìn de chūxiàn, zìrán xīyǐnle gèng duō de guānzhù.","v":"Trong bối cảnh các doanh nghiệp Internet Mỹ \"xưng bá\" toàn cầu, sự xuất hiện của WeChat – một sản phẩm Internet di động của chính Trung Quốc – đương nhiên thu hút nhiều sự chú ý hơn.","b":0},{"s":"","z":"被称为“微信之父”的腾讯公司高级副总裁张小龙介绍了微信的发展过程：微信的研究开发工作开展得很早，2010年底，移动互联网刚起步，腾讯广州产品研发中心就开始考虑相关业务。","p":"Bèi chēngwéi “Wēixìn zhī fù” de Téngxùn gōngsī gāojí fù zǒngcái Zhāng Xiǎolóng jièshàole Wēixìn de fāzhǎn guòchéng: Wēixìn de yánjiū kāifā gōngzuò kāizhǎn de hěn zǎo, èr líng yī líng nián dǐ, yídòng hùliánwǎng gāng qǐbù, Téngxùn Guǎngzhōu chǎnpǐn yánfā zhōngxīn jiù kāishǐ kǎolǜ xiāngguān yèwù.","v":"Phó chủ tịch cấp cao của Tencent Trương Tiểu Long, người được gọi là \"cha đẻ của WeChat\", đã giới thiệu quá trình phát triển của WeChat: công việc nghiên cứu phát triển WeChat được triển khai từ rất sớm; cuối năm 2010, khi Internet di động mới chập chững khởi bước, trung tâm nghiên cứu phát triển sản phẩm của Tencent ở Quảng Châu đã bắt đầu tính đến mảng kinh doanh liên quan.","b":1},{"s":"","z":"他们清楚地认识到了这样的现实——在个人计算机时代，由于中国互联网的用户数量以及市场成熟程度等都低于发达国家，在产品创新上难有领导地位，而移动互联网是一个重新开始的机会。","p":"Tāmen qīngchu de rènshi dàole zhèyàng de xiànshí——zài gèrén jìsuànjī shídài, yóuyú Zhōngguó hùliánwǎng de yònghù shùliàng yǐjí shìchǎng chéngshú chéngdù děng dōu dī yú fādá guójiā, zài chǎnpǐn chuàngxīn shang nán yǒu lǐngdǎo dìwèi, ér yídòng hùliánwǎng shì yí ge chóngxīn kāishǐ de jīhuì.","v":"Họ nhận thức rõ một thực tế: trong thời đại máy tính cá nhân, do số lượng người dùng Internet cũng như mức độ trưởng thành của thị trường Trung Quốc đều thấp hơn các nước phát triển, nên khó giữ vị trí dẫn đầu về đổi mới sản phẩm, còn Internet di động lại là một cơ hội để bắt đầu lại.","b":0},{"s":"","z":"在经营销售上，微信针对不同的国家和地区，推出了不同的广告片，邀请当地明星和名人代言，收效相当不错。","p":"Zài jīngyíng xiāoshòu shang, Wēixìn zhēnduì bùtóng de guójiā hé dìqū, tuīchūle bùtóng de guǎnggàopiàn, yāoqǐng dāngdì míngxīng hé míngrén dàiyán, shōuxiào xiāngdāng búcuò.","v":"Về kinh doanh và tiêu thụ, WeChat tung ra những đoạn phim quảng cáo khác nhau nhắm vào từng quốc gia, vùng lãnh thổ, mời ngôi sao và người nổi tiếng địa phương làm đại diện, thu được hiệu quả khá tốt.","b":0},{"s":"","z":"海外用户群中不仅有华裔和新移民，还出现了更多的外国人。","p":"Hǎiwài yònghùqún zhōng bùjǐn yǒu huáyì hé xīn yímín, hái chūxiànle gèng duō de wàiguórén.","v":"Trong nhóm người dùng ở nước ngoài không chỉ có người gốc Hoa và những người mới di cư, mà còn xuất hiện ngày càng nhiều người nước ngoài.","b":0}]}],"aud":[{"v":"audio/12-2.mp3","t":"audio/12-1.mp3"}],"gram":[{"id":"yiji","t":"以及","s":"và, cùng với (liên từ)","b":"<b>以及</b> là <b>liên từ</b>, dùng để nối các từ hoặc cụm từ có <b>quan hệ song song</b> (ngang hàng). Theo sách, các thành phần được nối thường có sự phân biệt <b>chính – phụ</b> hoặc <b>trước – sau</b>.","r":["Nối từ/cụm từ song song, thường đứng trước thành phần cuối của chuỗi liệt kê: A、B以及C","Thành phần chính / đến trước đặt trước 以及, thành phần phụ / đến sau đặt sau: 学校的领导、教师以及一些学生代表","Có thể nối cụm danh từ dài: 用户数量以及市场成熟程度"],"e":[["吃饭时不要用筷子敲打碗、盘子以及桌面。","Chīfàn shí búyào yòng kuàizi qiāodǎ wǎn, pánzi yǐjí zhuōmiàn.","Khi ăn cơm đừng dùng đũa gõ vào bát, đĩa và mặt bàn."],["学校的领导、教师以及一些学生代表观看了演出。","Xuéxiào de lǐngdǎo, jiàoshī yǐjí yìxiē xuésheng dàibiǎo guānkànle yǎnchū.","Lãnh đạo nhà trường, các giáo viên và một số đại diện học sinh đã xem buổi biểu diễn."],["……由于中国互联网的用户数量以及市场成熟程度等都低于发达国家，在产品创新上难有领导地位，……","……yóuyú Zhōngguó hùliánwǎng de yònghù shùliàng yǐjí shìchǎng chéngshú chéngdù děng dōu dī yú fādá guójiā, zài chǎnpǐn chuàngxīn shang nán yǒu lǐngdǎo dìwèi,……","…do số lượng người dùng Internet cũng như mức độ trưởng thành của thị trường Trung Quốc đều thấp hơn các nước phát triển, nên khó giữ vị trí dẫn đầu về đổi mới sản phẩm… <i>(bài khoá)</i>"]],"d":[["本店销售电视、冰箱、洗衣机____其他电器。","以及"],["吃饭时不要用筷子敲打碗、盘子____桌面。","以及"],["学校的领导、教师____一些学生代表观看了演出。","以及"]],"w":"以及 thường đặt trước thành phần cuối cùng trong chuỗi liệt kê; phần quan trọng hơn hoặc xảy ra trước đứng trước 以及."},{"id":"chengdu","t":"程度","s":"mức độ, trình độ (danh từ)","b":"<b>程度</b> là <b>danh từ</b>, chỉ <b>mức độ hoặc trình độ</b> mà một phương diện nào đó đạt tới.","r":["Danh từ/tính từ + 程度: 市场成熟程度 (mức độ trưởng thành của thị trường)","……发展到了……的程度: phát triển đến mức…","在很大程度上: ở mức độ lớn, phần lớn"],"e":[["……由于中国互联网的用户数量以及市场成熟程度等都低于发达国家，在产品创新上难有领导地位，……","……yóuyú Zhōngguó hùliánwǎng de yònghù shùliàng yǐjí shìchǎng chéngshú chéngdù děng dōu dī yú fādá guójiā, zài chǎnpǐn chuàngxīn shang nán yǒu lǐngdǎo dìwèi,……","…do số lượng người dùng Internet cũng như mức độ trưởng thành của thị trường Trung Quốc đều thấp hơn các nước phát triển, nên khó giữ vị trí dẫn đầu về đổi mới sản phẩm… <i>(bài khoá)</i>"],["问题已经发展到了十分严重的程度。","Wèntí yǐjīng fāzhǎn dàole shífēn yánzhòng de chéngdù.","Vấn đề đã phát triển đến mức hết sức nghiêm trọng."],["在很大程度上，一个人的未来取决于他所受的教育。","Zài hěn dà chéngdù shang, yí ge rén de wèilái qǔjué yú tā suǒ shòu de jiàoyù.","Ở mức độ lớn, tương lai của một người phụ thuộc vào nền giáo dục mà người đó nhận được."]],"d":[["问题已经发展到了十分严重的____。","程度"],["在很大____上，一个人的未来取决于他所受的教育。","程度"]],"w":""},{"id":"fada_fazhan","t":"发达 vs 发展","s":"phát triển (tính từ) – phát triển (động từ)","b":"<b>发达</b> và <b>发展</b> có ý nghĩa liên quan đến nhau, nhưng <b>thường không thể thay thế cho nhau</b>.","r":["发达 là <b>tính từ</b>: 这个城市的经济不太发达。 — 发展 là <b>động từ</b>: 这个城市正在大力发展经济。","发达 miêu tả <b>trình độ phát triển rất cao</b> (发达国家: nước phát triển) — 发展 chỉ <b>sự biến đổi</b> của sự vật (发展中国家: nước đang phát triển)"],"e":[["这个城市的经济不太发达。","Zhège chéngshì de jīngjì bú tài fādá.","Kinh tế của thành phố này không phát triển lắm."],["这个城市正在大力发展经济。","Zhège chéngshì zhèngzài dàlì fāzhǎn jīngjì.","Thành phố này đang ra sức phát triển kinh tế."],["由于中国互联网的用户数量以及市场成熟程度等都低于发达国家，在产品创新上难有领导地位。","Yóuyú Zhōngguó hùliánwǎng de yònghù shùliàng yǐjí shìchǎng chéngshú chéngdù děng dōu dī yú fādá guójiā, zài chǎnpǐn chuàngxīn shang nán yǒu lǐngdǎo dìwèi.","Do số lượng người dùng Internet cũng như mức độ trưởng thành của thị trường Trung Quốc đều thấp hơn các nước phát triển, nên khó giữ vị trí dẫn đầu về đổi mới sản phẩm. <i>(bài khoá)</i>"],["中国还是一个发展中国家。","Zhōngguó hái shì yí ge fāzhǎnzhōng guójiā.","Trung Quốc vẫn là một nước đang phát triển."]],"d":[["四川是茶馆文化最____的地区之一。","发达"],["人们常说这种动物不聪明，其实它的大脑很____。","发达"],["方便的交通是____经济的基础。","发展"],["她的病情____得比我们想象的还要快。","发展"]],"w":"Mẹo: sau 很/最/不太 (mức độ) → 发达; có tân ngữ (发展经济) hoặc bổ ngữ (发展得很快) → 发展. 发达国家 = nước phát triển, 发展中国家 = nước đang phát triển."}],"ext":[["键盘","jiànpán","bàn phím"],["鼠标","shǔbiāo","chuột máy tính"],["光盘","guāngpán","đĩa quang, đĩa CD"],["信息","xìnxī","thông tin"],["硬件","yìngjiàn","phần cứng"],["软件","ruǎnjiàn","phần mềm"],["数码","shùmǎ","kỹ thuật số"],["数据","shùjù","dữ liệu"],["程序","chéngxù","chương trình"],["系统","xìtǒng","hệ thống"],["网络","wǎngluò","mạng"],["信号","xìnhào","tín hiệu"],["充电器","chōngdiànqì","bộ sạc"]],"extt":"电脑网络","notes":"Nguồn cuối bài khoá: 改编自《人民日报·海外版》，作者：张意轩. Bài khoá 562 chữ, 6 đoạn trong sách, chia thành 3 phần: đoạn 1–2 / đoạn 3–4 / đoạn 5–6. Từ mới số 1, 2, 4, 8, 16, 18, 21, 24, 34, 41 có dấu * (ngoài đề cương). Tên riêng (专名1–5) đánh số theo mục 专有名词 của sách. Tên bài trên trang mở đầu là 海外用户玩儿微信 (tab bên lề in 海外用户玩微信). Câu bài khoá đầu tiên được cắt tại dấu …… thành 2 dòng; hai câu dài ở phần 3 (>45 chữ, không có ；) giữ nguyên một câu. Câu ví dụ trong vocab_ex cho 以及, 程度, 发达, 领导 lấy từ phần 注释 của sách thay vì câu bài khoá (câu bài khoá quá dài). Drill 1 của 以及 lấy từ 练习3 ③ (bỏ các ký hiệu A/B/C/D, đáp án ở vị trí D); các drill khác của 以及 và 程度 đặt dựa trên câu ví dụ của sách vì 练一练 chỉ là bài hoàn thành câu mở. Ví dụ thứ 3 của 发达 vs 发展 chép theo bảng 词语辨析 (bỏ 如：). Bảng 扩展 (电脑网络) trong sách chỉ có chữ Hán + pinyin, nghĩa tiếng Việt do người soạn bổ sung.","order":[{"z":"如此大手笔的推广，腾讯自有其底气所在。","t":["如此","大手笔","的","推广","腾讯","自有","其","底气","所在"],"v":"Quảng bá mạnh tay như vậy, Tencent ắt có chỗ dựa vững chắc của mình."},{"z":"微信“在海外注册用户已经超过7000万，且在快速增长当中”。","t":["微信","在","海外","注册","用户","已经","超过","7000","万","且","在","快速增长","当中"],"v":"WeChat \"có hơn 70 triệu người dùng đăng ký ở nước ngoài, và con số này vẫn đang tăng nhanh\"."},{"z":"吃饭时不要用筷子敲打碗、盘子以及桌面。","t":["吃饭","时","不要","用","筷
